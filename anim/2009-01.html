<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-01 动画 · 打印缓冲区的逻辑结构</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     概念辨析类：打印数据缓冲区应选哪种逻辑结构
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>题干关键条件：主机「<b>依次写入</b>」、打印机「<b>依次取出</b>」。写入次序必须等于打印次序，页序才不会乱。这指向考点：<b>缓冲区的逻辑结构 = 先进先出（FIFO）</b>。</p>' },
  { title: '逐项分析 A：栈',
    cls: 'bad',
    body: '<p>栈是<b>后进先出</b>（LIFO）：主机写满缓冲区后，打印机先取到的将是<b>最后写入</b>的数据，整份文档的页序全部颠倒。✗</p>' },
  { title: '逐项分析 B：队列',
    cls: 'good',
    body: '<p>队列是<b>先进先出</b>（FIFO）：先写入的先被取出打印，<b>写入次序 = 打印次序</b>，与题干「依次写入、依次取出」完全吻合。✓</p>' },
  { title: '逐项分析 C：树',
    cls: 'bad',
    body: '<p>树是<b>一对多</b>的层次结构，结点之间是父子分支关系，不存在「按时间依次排队」的线性次序，无法保证先进先出。✗</p>' },
  { title: '逐项分析 D：图',
    cls: 'bad',
    body: '<p>图是<b>多对多</b>的网状结构，顶点之间只有邻接关系，更没有天然的先后次序。✗</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>缓冲区要「先到先服务、保序」，逻辑结构应为<b>队列</b>，答案选 <b>B</b>。</p>' },
  { title: '记忆锚点',
    cls: 'key',
    body: '<p>凡「先进先出、保序」的缓冲场景（打印缓冲区、键盘输入缓冲区）都是<b>队列</b>；凡「后进先出」的场景（函数调用、括号匹配、撤销操作）才是<b>栈</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '打印数据缓冲区的逻辑结构',
  subtitle: '考点：主机依次写入、打印机依次取出 · 四种逻辑结构逐项推演（2009-01）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 支持 / ✗ 否决）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（队列）',
    html: '记忆锚点：缓冲区「依次写入、依次取出」= <b>先进先出</b> = 队列。干扰项 A 的误区是把「临时存放」当成「后进先出」——栈会颠倒打印次序；树与图是层次/网状结构，根本表达不了排队次序。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
