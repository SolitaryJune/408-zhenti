<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-03 动画 · RNL 遍历过程演示</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     算法/过程类：在 SVG 树上按 RNL 次序逐个点亮结点
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var NS = 'http://www.w3.org/2000/svg';
var ORDER = [3, 1, 7, 5, 6, 2, 4];                  // RNL 访问次序
var POS = {1:[230,45], 2:[140,140], 3:[330,140], 4:[75,235], 5:[205,235], 6:[140,325], 7:[275,325]};
var EDGES = [[1,2],[1,3],[2,4],[2,5],[5,6],[5,7]];
var nodeEls = {};

function build(stage){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 460 360');
  svg.setAttribute('width', '460');
  svg.setAttribute('height', '360');
  EDGES.forEach(function(e){
    var a = POS[e[0]], b = POS[e[1]];
    var ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', a[0]); ln.setAttribute('y1', a[1]);
    ln.setAttribute('x2', b[0]); ln.setAttribute('y2', b[1]);
    ln.setAttribute('stroke', '#5a7d8c66'); ln.setAttribute('stroke-width', '3');
    svg.appendChild(ln);
  });
  [1,2,3,4,5,6,7].forEach(function(n){
    var g = document.createElementNS(NS, 'g');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', POS[n][0]); c.setAttribute('cy', POS[n][1]); c.setAttribute('r', 22);
    c.setAttribute('fill', '#ffffff'); c.setAttribute('stroke', '#213e48'); c.setAttribute('stroke-width', '2.5');
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', POS[n][0]); t.setAttribute('y', POS[n][1] + 7);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '20'); t.setAttribute('font-weight', '700'); t.setAttribute('fill', '#1b3a4b');
    t.textContent = String(n);
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
    nodeEls[n] = { circle: c, text: t };
  });
  wrap.appendChild(svg);
  stage.appendChild(wrap);
}

function render(stage, sn){
  var visited = ORDER.slice(0, sn.count);
  var cur = sn.count > 0 ? ORDER[sn.count - 1] : 0;
  [1,2,3,4,5,6,7].forEach(function(n){
    var o = nodeEls[n];
    if(n === cur){
      o.circle.setAttribute('fill', '#2f9e44'); o.circle.setAttribute('stroke', '#276942');
      o.text.setAttribute('fill', '#ffffff');
    } else if(visited.indexOf(n) >= 0){
      o.circle.setAttribute('fill', '#2f9e4424'); o.circle.setAttribute('stroke', '#2f9e44');
      o.text.setAttribute('fill', '#1e4d33');
    } else {
      o.circle.setAttribute('fill', '#ffffff'); o.circle.setAttribute('stroke', '#213e48');
      o.text.setAttribute('fill', '#1b3a4b');
    }
  });
}

AW.init({
  title: '二叉树的 RNL 遍历演示',
  subtitle: 'RNL = 先递归右子树 → 访问根 → 再递归左子树（中序的镜像）· 目标序列 <code>3,1,7,5,6,2,4</code>（2009-03）',
  counterLabel: '已访问',
  ribbonTitle: '访问序号（✓ 已访问）',
  intro: '点击「▶ 播放」，看绿色光标按 RNL 次序逐个点亮结点。',
  build: build,
  render: render,

  snaps: [
    { cls:'shift', tag:'开始', log:'遍历次序 RNL：先右、再根、后左。从根 1 出发。', count:0 },
    { cls:'ok', tag:'访问 3', log:'先走右子树：根 1 的右孩子是 3，3 没有孩子 → 第 1 个访问 3。', count:1, ribbon:{k:1, ok:true} },
    { cls:'ok', tag:'访问 1', log:'右子树处理完毕 → 第 2 个访问根 1。', count:2, ribbon:{k:2, ok:true} },
    { cls:'ok', tag:'访问 7', log:'转入左子树 2：按 RNL 先走 2 的右子树 5；5 的右孩子是 7 → 第 3 个访问 7。', count:3, ribbon:{k:3, ok:true} },
    { cls:'ok', tag:'访问 5', log:'7 所在子树走完 → 第 4 个访问 5。', count:4, ribbon:{k:4, ok:true} },
    { cls:'ok', tag:'访问 6', log:'接着走 5 的左孩子 6 → 第 5 个访问 6。', count:5, ribbon:{k:5, ok:true} },
    { cls:'ok', tag:'访问 2', log:'2 的右子树（7、5、6）全部处理完 → 第 6 个访问 2。', count:6, ribbon:{k:6, ok:true} },
    { cls:'ok', tag:'访问 4', log:'最后走 2 的左孩子 4 → 第 7 个访问 4。', count:7, ribbon:{k:7, ok:true} },
    { cls:'done', tag:'完成', log:'得到序列 3, 1, 7, 5, 6, 2, 4，与题面完全一致 → 遍历方式为 RNL（右 → 根 → 左）。', count:7, done:true },
  ],

  result: {
    big: '答案 D（RNL）',
    html: '一眼定位法：序列首元素 <b>3</b> 恰是根的右孩子 → 先右后根再左，即 <b>RNL</b>（LRN 首个应访问最左下的 4，NRL 应先访问根 1，RLN 应先访问 7）。记忆点：RNL 是中序的镜像，序列开头在右子树、结尾是最左下的 4。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
