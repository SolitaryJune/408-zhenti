<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-04 平衡二叉树判定 · 四树逐棵检查动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
  .avl-svg{width:100%;max-width:920px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .avl-svg .tedge{stroke:#5a7d8c;stroke-width:2.5px;transition:opacity .4s}
  .avl-svg .tnode circle{fill:#ffffff;stroke:#213e48;stroke-width:2.5px;transition:opacity .4s, fill .3s, stroke .3s}
  .avl-svg .tnode.fail circle{fill:#e63946;stroke:#a02830}
  .avl-svg .tnode.pass circle{fill:#2f9e44;stroke:#276942}
  .avl-svg .hidden-el{opacity:0}
  .vcaps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:920px;margin:10px auto 0}
  .vcap{border:1.5px solid #5a7d8c66;border-radius:10px;padding:7px 9px;font-size:12.5px;line-height:1.6;
    color:#586e72;background:#fff;transition:all .3s;font-weight:600}
  .vcap b{display:block;font-size:14.5px;color:#213e48;margin-bottom:2px;font-family:JetBrains Mono,Menlo,monospace}
  .vcap.ok{border-color:#2f9e44;background:#f0f7e6;color:#276942}
  .vcap.ok b{color:#276942}
  .vcap.bad{border-color:#e63946;background:#fff5f5;color:#a02830}
  .vcap.bad b{color:#a02830}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 2009-04 平衡二叉树判定（SVG 四树逐棵检查） ==================
 * 题：下列二叉排序树中，满足平衡二叉树定义的是__。（答案 B）
 * 演示：按题图依次画出 A/B/C/D 四棵候选树，逐棵计算根的平衡因子，
 *       结点随步骤显现；失衡结点标红，B 全树标绿。 */

var TREES = [
  { key:'A', step:1, nodes:[
      {id:'A-R',  x:100, y:55},  {id:'A-L',  x:55,  y:140}, {id:'A-LR', x:105, y:225}],
    edges:[['A-R','A-L'], ['A-L','A-LR']] },
  { key:'B', step:2, nodes:[
      {id:'B-R',  x:370, y:55},  {id:'B-LC', x:305, y:140}, {id:'B-LL', x:250, y:225},
      {id:'B-RC', x:435, y:140}, {id:'B-RR', x:490, y:225}],
    edges:[['B-R','B-LC'], ['B-R','B-RC'], ['B-LC','B-LL'], ['B-RC','B-RR']] },
  { key:'C', step:3, nodes:[
      {id:'C-R',  x:640, y:55},  {id:'C-L',  x:585, y:140}, {id:'C-RA', x:695, y:140},
      {id:'C-RB', x:750, y:225}, {id:'C-RC', x:705, y:310}],
    edges:[['C-R','C-L'], ['C-R','C-RA'], ['C-RA','C-RB'], ['C-RB','C-RC']] },
  { key:'D', step:4, nodes:[
      {id:'D-R',  x:880, y:55},  {id:'D-RL', x:940, y:140}, {id:'D-X',  x:825, y:140},
      {id:'D-Y',  x:770, y:225}, {id:'D-Z',  x:885, y:225}, {id:'D-W',  x:835, y:310},
      {id:'D-V',  x:885, y:395}],
    edges:[['D-R','D-X'], ['D-R','D-RL'], ['D-X','D-Y'], ['D-X','D-Z'], ['D-Y','D-W'], ['D-W','D-V']] },
];
var TSTEP = { A:1, B:2, C:3, D:4 };
var FAIL_SETS = { A:['A-R'], B:[], C:['C-R'], D:['D-R','D-X'] };
var CAPS = {
  A: { ok:false, txt:'左高 2 · 右高 0<br>根 BF = |2−0| = 2 ✗' },
  B: { ok:true,  txt:'左高 2 · 右高 2<br>根 BF = 0，全结点 ≤1 ✓' },
  C: { ok:false, txt:'左高 1 · 右高 3<br>根 BF = |1−3| = 2 ✗' },
  D: { ok:false, txt:'左高 4 · 右高 1<br>根 BF = 3（左孩子也失衡）✗' },
};

function build(stage){
  var h = '<svg viewBox="0 0 990 430" class="avl-svg">';
  TREES.forEach(function(t){
    t.nmap = {};
    t.nodes.forEach(function(n){ t.nmap[n.id] = n; });
    t.edges.forEach(function(e){
      var p = t.nmap[e[0]], c = t.nmap[e[1]];
      h += '<line x1="' + p.x + '" y1="' + p.y + '" x2="' + c.x + '" y2="' + c.y + '"' +
           ' class="tedge hidden-el" data-step="' + t.step + '"/>';
    });
    t.nodes.forEach(function(n){
      h += '<g class="tnode hidden-el" data-step="' + t.step + '" data-tree="' + t.key + '" data-id="' + n.id + '">' +
           '<circle cx="' + n.x + '" cy="' + n.y + '" r="20"/></g>';
    });
  });
  h += '</svg>';
  stage.innerHTML = h;
  var caps = AW.el('div', 'vcaps');
  ['A','B','C','D'].forEach(function(k){
    var d = AW.el('div', 'vcap', '<b>选项 ' + k + '</b>待检查');
    d.id = 'cap-' + k;
    caps.appendChild(d);
  });
  stage.appendChild(caps);
  this._svg = stage.querySelector('.avl-svg'); this._caps = caps;
}

function render(stage, sn, i){
  var svg = this._svg, caps = this._caps;
  [].forEach.call(svg.querySelectorAll('.tnode, .tedge'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  [].forEach.call(svg.querySelectorAll('.tnode'), function(el){
    el.classList.remove('fail', 'pass');
    var tree = el.dataset.tree;
    if(i >= TSTEP[tree]){
      if(FAIL_SETS[tree].indexOf(el.dataset.id) >= 0) el.classList.add('fail');
      else if(tree === 'B') el.classList.add('pass');
    }
  });
  ['A','B','C','D'].forEach(function(k){
    var d = caps.querySelector('#cap-' + k);
    if(i >= TSTEP[k]){
      d.className = 'vcap ' + (CAPS[k].ok ? 'ok' : 'bad');
      d.innerHTML = '<b>选项 ' + k + '</b>' + CAPS[k].txt;
    } else {
      d.className = 'vcap';
      d.innerHTML = '<b>选项 ' + k + '</b>待检查';
    }
  });
}

var SNAPS = [
  { cls:'shift', tag:'开始', count:0,
    log:'平衡因子 BF = 左子树高 − 右子树高（空子树高记 0），平衡二叉树要求每个结点 |BF| ≤ 1。按题图逐棵画出 A/B/C/D 四棵候选，只要有一个结点失衡即淘汰。' },
  { cls:'miss', tag:'A：根失衡', count:1, ribbon:{k:1, ok:false},
    log:'画出 A：根只有左子树——左子树高 2（两层的斜链），右子树为空高 0 → 根 BF = |2−0| = 2 > 1，根结点失衡，A 淘汰 ✗' },
  { cls:'ok', tag:'B：全树平衡', count:2, ribbon:{k:2, ok:true},
    log:'画出 B：根左、右子树都是高 2 的形态 → 根 BF = 0；左孩子的左子树高 1、右子树空 → BF = 1；右孩子对称 → BF = 1。全树 |BF| ≤ 1，B 平衡 ✓' },
  { cls:'miss', tag:'C：根失衡', count:3, ribbon:{k:3, ok:false},
    log:'画出 C：左子树高 1，右子树是 3 层斜链 → 根 BF = |1−3| = 2 > 1，根结点失衡，C 淘汰 ✗' },
  { cls:'miss', tag:'D：根失衡', count:4, ribbon:{k:4, ok:false},
    log:'画出 D：左子树深达 4 层（带下坠链），右子树仅高 1 → 根 BF = 3 > 1；其左孩子 BF = |3−1| = 2 也失衡（两个红结点），D 淘汰 ✗' },
  { cls:'step', tag:'汇总', count:4,
    log:'四棵树判定齐了：A ✗（BF=2）、B ✓（全结点 |BF|≤1）、C ✗（BF=2）、D ✗（BF=3）。唯一满足平衡二叉树定义的是 B。' },
  { cls:'done', tag:'完成', count:4, done:true,
    log:'答案选 B。' },
];

AW.init({
  title: '2009-04 哪棵二叉排序树是平衡二叉树？',
  subtitle: '题：下列二叉排序树中，满足平衡二叉树定义的是__。判定标准 <code>|左子树高 − 右子树高| ≤ 1</code>（空子树高记 0）——按题图逐棵画出 A/B/C/D 并检查平衡因子。',
  counterLabel: '已检查',
  ribbonTitle: '候选树判定（✓ 平衡 / ✗ 失衡）',
  intro: '点击「▶ 播放」，四棵候选树逐棵画出并判定，看红色失衡结点出现在哪。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 B',
    html: '平衡二叉树要求<b>每个结点</b>的 |左子树高 − 右子树高| ≤ 1（空子树高记 0）。A 根 BF = 2、C 根 BF = 2、D 根 BF = 3（其左孩子 BF = 2 也失衡），只有 <b>B</b> 全树每个结点都 ≤ 1。记忆锚点：判定要<b>逐结点</b>做，一个失衡即全盘否决——失衡常出现在「一头沉」的斜链形态。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
