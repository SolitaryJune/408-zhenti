<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-04 动画 · 平衡二叉树的判定</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/推理类：逐个候选树检查平衡因子
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：平衡二叉树的定义',
    cls: 'key',
    body: '<p>平衡二叉树（AVL 树）：<b>任意结点</b>的左、右子树高度之差绝对值 ≤ 1，空子树高度记 <code>0</code>。判定从根往下逐点检查，<b>一个结点失衡即全盘否决</b>。</p>' },
  { title: '检查 A：根只有左子树',
    cls: 'bad',
    body: '<p>A 中根的左子树高 <code>2</code>、右子树为空高 <code>0</code>，平衡因子 <code>|2 − 0| = 2 &gt; 1</code> —— 根结点失衡，不是平衡二叉树。✗</p>' },
  { title: '检查 B：根左右对称',
    cls: 'good',
    body: '<p>B 中根的左、右子树都是高 <code>2</code> 的形态，根平衡因子 <code>0</code>；左孩子的左子树高 <code>1</code>、右子树为空 → <code>|1 − 0| = 1</code>；右孩子对称。<b>每个结点都 ≤ 1</b>，是平衡二叉树。✓</p>' },
  { title: '检查 C：根右子树太深',
    cls: 'bad',
    body: '<p>C 中根的左子树高 <code>1</code>，右子树是一条 3 层以上的斜链，高度差 ≥ <code>2</code> —— 根结点失衡。✗</p>' },
  { title: '检查 D：根左子树太深',
    cls: 'bad',
    body: '<p>D 中根的左子树深达 <code>4</code> 层（带下坠链），右子树仅高 <code>1</code>，高度差 ≥ <code>2</code> —— 根结点（及其左孩子）失衡。✗</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有 <b>B</b> 全树每个结点的左右子树高度差都 ≤ 1，答案选 <b>B</b>。</p>' },
  { title: '记忆锚点',
    cls: 'key',
    body: '<p>判定口诀「<b>先看根，再逐层看</b>」：任何一层失衡即淘汰。失衡常出现在「一头沉」形态——只有单侧子树（如 A）或两侧深度悬殊（如 C、D）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '哪棵二叉排序树是平衡二叉树？',
  subtitle: '考点：平衡因子 = 左右子树高度差 · 空子树高记 0 · 逐结点检验（2009-04）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 平衡 / ✗ 失衡）',
  intro: '点击「▶ 播放」逐个候选树检查平衡因子。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：A 根失衡 <code>|2−0|=2</code>；C、D 根两侧深度悬殊；B 全树平衡。注意判定要<b>逐结点</b>做，不只看根——只是本题的失衡点恰好都在根上。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
