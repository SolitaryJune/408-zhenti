<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-05 完全二叉树的最多结点数 · 分层构树动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
<style>
  .cbt-svg{width:100%;max-width:920px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .cbt-svg .tedge{stroke:#5a7d8c66;stroke-width:1.6px;transition:opacity .4s}
  .cbt-svg .tedge.ghost-el{stroke:#e63946;stroke-width:2px;stroke-dasharray:5 4}
  .cbt-svg .tnode circle{fill:#ffffff;stroke:#47616c;stroke-width:1.8px;transition:opacity .4s, fill .3s, stroke .3s}
  .cbt-svg .tnode.leafn circle{fill:#2f9e44;stroke:#276942}
  .cbt-svg .tnode.grown circle,.cbt-svg .tnode.hotn circle{fill:#e07a2f;stroke:#b45309}
  .cbt-svg .tnode.lost circle{fill:#b9cbd0;stroke:#586e72}
  .cbt-svg .tnode.ghostn circle{fill:#e6394666;stroke:#e63946;stroke-dasharray:4 3}
  .cbt-svg .hidden-el{opacity:0}
  .cbt-svg .laylab{font-size:15px;font-weight:700;fill:#b9cbd0;font-family:PingFang SC,sans-serif}
  .clegend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12.5px}
  .clegend .lg{border-radius:999px;padding:3px 12px;font-weight:700;border:1.5px solid}
  .lg-leaf{background:#2f9e441f;border-color:#2f9e4466;color:#276942}
  .lg-grow{background:#e07a2f1f;border-color:#e07a2f66;color:#b45309}
  .lg-ghost{background:#e63946664d;border-color:#e6394666;color:#a02830}
  .hformula{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 2009-05 完全二叉树分层构树动画（SVG） ==================
 * 题：完全二叉树第 6 层（根为第 1 层）有 8 个叶结点，结点个数最多是__。（答案 C=111）
 * 演示：逐层画出一棵真实的完全二叉树——前 5 层放满 31 个、第 6 层放满 32 个
 *       （末尾 8 个为叶），其余 24 个结点伸满第 7 层 48 个 → 合计 111；
 *       再用反例假设（119）演示为何不能更多。 */

var W = 1400;
var ROWY = [35, 115, 195, 275, 355, 440, 525];
var RAD  = [26, 22, 19, 16, 14, 12, 10];
var TOTAL = 111;

var NODES = [];   // {n, x, y, r, step, leaf, ghost}
var EDGES = [];   // {child, parent, step, ghost}
(function genTree(){
  for(var k = 1; k <= 7; k++){
    var cnt = Math.pow(2, k - 1);
    for(var j = 0; j < cnt; j++){
      var n = cnt + j;                     // 层 k 第 j 个的全局编号 = 2^(k-1)+j
      if(n > TOTAL) break;
      NODES.push({ n:n, x:(j + 0.5) * W / cnt, y:ROWY[k - 1], r:RAD[k - 1],
        step:(k <= 5 ? 1 : (k === 6 ? 2 : 4)), leaf:(n >= 56 && n <= 63), ghost:false });
    }
  }
  NODES.forEach(function(nd){ if(nd.n >= 2) EDGES.push({ child:nd.n, parent:Math.floor(nd.n / 2), step:nd.step, ghost:false }); });
  // 反例假设：总数 119 时第 7 层多出的 8 个结点（挂在第 6 层 56~59 号上）
  for(var g = 112; g <= 119; g++){
    var p = 56 + Math.floor((g - 112) / 2);
    var slot = (p * 2 + (g - 112) % 2) - 64;   // 第 7 层槽位
    NODES.push({ n:g, x:(slot + 0.5) * W / 48, y:ROWY[6], r:RAD[6], step:6, leaf:false, ghost:true });
    EDGES.push({ child:g, parent:p, step:6, ghost:true });
  }
})();
var NMAP = {};
NODES.forEach(function(nd){ NMAP[nd.n] = nd; });

function build(stage){
  var h = '<svg viewBox="0 0 1400 548" class="cbt-svg">';
  var layNames = ['第1层','第2层','第3层','第4层','第5层','第6层','第7层'];
  layNames.forEach(function(s, k){
    h += '<text x="8" y="' + (ROWY[k] + 5) + '" class="laylab">' + s + '</text>';
  });
  EDGES.forEach(function(e){
    var P = NMAP[e.parent], C = NMAP[e.child];
    h += '<line x1="' + P.x + '" y1="' + P.y + '" x2="' + C.x + '" y2="' + C.y + '"' +
         ' class="tedge hidden-el' + (e.ghost ? ' ghost-el' : '') + '" data-step="' + e.step + '"/>';
  });
  NODES.forEach(function(nd){
    h += '<g class="tnode hidden-el' + (nd.ghost ? ' ghost-el' : '') + '" data-step="' + nd.step + '" data-n="' + nd.n + '">' +
         '<circle cx="' + nd.x + '" cy="' + nd.y + '" r="' + nd.r + '"/></g>';
  });
  h += '</svg>';
  stage.innerHTML = h;
  var legend = AW.el('div', 'clegend',
    '<span class="lg lg-leaf">绿色 = 叶结点（第 6 层末尾 8 个）</span>' +
    '<span class="lg lg-grow">橙色 = 还能生长的结点</span>' +
    '<span class="lg lg-ghost">红虚线 = 「119」反例假设结点</span>');
  var formula = AW.el('div', 'hformula');
  stage.appendChild(legend);
  stage.appendChild(formula);
  this._svg = stage.querySelector('.cbt-svg'); this._formula = formula;
}

var FORMULAS = [
  '目标：第 6 层恰有 <b>8</b> 个叶结点，让总结点「最多」',
  '前 5 层放满：1+2+4+8+16 = <code>31</code>',
  '第 6 层放满：+32 → 累计 <code>63</code>',
  '第 6 层非叶 = 32 − 8 = <code>24</code> 个',
  '第 7 层：24 × 2 = <code>48</code> 个',
  '总计 31 + 32 + 48 = <code>111</code>',
  '若 119：第 6 层叶子只剩 4 个 ≠ 8 ✗',
  '39、52 均不合「最多 / 8 叶」✗',
  'n 最大 = <b>111</b>（选 C）',
];

function render(stage, sn, i){
  var svg = this._svg;
  [].forEach.call(svg.querySelectorAll('.tnode, .tedge'), function(el){
    var s = +el.dataset.step;
    var hidden = s > i;
    if(el.classList.contains('ghost-el')) hidden = (i !== 6);   // 反例结点只在第 6 步现身
    el.classList.toggle('hidden-el', hidden);
  });
  [].forEach.call(svg.querySelectorAll('.tnode'), function(el){
    el.classList.remove('leafn', 'grown', 'hotn', 'lost', 'ghostn');
    if(el.classList.contains('ghost-el')){ el.classList.add('ghostn'); return; }
    var n = +el.dataset.n;
    if(n >= 56 && n <= 63 && i >= 3){
      if(i === 6 && n <= 59) el.classList.add('lost');    // 反例中叶子被迫"变非叶"
      else el.classList.add('leafn');
    }
    if(n >= 32 && n <= 55){
      if(i === 3) el.classList.add('grown');
      else if(i === 4) el.classList.add('hotn');
    }
  });
  this._formula.innerHTML = FORMULAS[Math.min(i, FORMULAS.length - 1)];
}

var SNAPS = [
  { cls:'shift', tag:'开始', count:0,
    log:'完全二叉树第 6 层（根为第 1 层）恰有 8 个叶结点，求结点总数「最多」。策略：让前 6 层全部放满，第 6 层除 8 个叶子外的结点全部伸满第 7 层。下面逐层画出一棵真实的完全二叉树。' },
  { cls:'ok', tag:'前 5 层放满', count:1,
    log:'第 1～5 层放满成一棵满二叉树：1+2+4+8+16 = 31 个结点。' },
  { cls:'ok', tag:'第 6 层放满', count:2,
    log:'再放满第 6 层：32 个结点（累计 63）。此刻第 6 层全部是「暂定叶子」。' },
  { cls:'step', tag:'标出 8 个叶', count:3,
    log:'完全二叉树同层结点从左到右连续排列——让第 6 层末尾 8 个（绿色）当叶结点，前面 24 个（橙色）继续当父母。叶结点只要求「自己没有孩子」，同层其余结点照样能生长。' },
  { cls:'ok', tag:'第 7 层长满', count:4,
    log:'24 个非叶结点各生 2 个孩子 → 第 7 层长出 24×2 = 48 个，从左到右连续排列，形态合法（这正是结点数最多时的样子）。' },
  { cls:'good', tag:'合计', count:5,
    log:'清点：31（前 5 层）+ 32（第 6 层）+ 48（第 7 层）= 111 个。这就是「最多」。' },
  { cls:'miss', tag:'反证：119 不行', count:6,
    log:'假如总数是 119：第 7 层要有 56 个 → 第 6 层前 28 个结点都得有孩子（红虚线 = 多出的 8 个假设结点）→ 第 6 层叶子只剩 4 个（灰色），与「8 个叶」矛盾 ✗' },
  { cls:'step', tag:'排除干扰项', count:7,
    log:'39 = 31+8：第 6 层只有 8 个结点且全为叶——合法形态但不是「最多」；52：第 6 层有 21 个结点全是叶，21 ≠ 8 不合题意。✗' },
  { cls:'done', tag:'完成', count:8, done:true,
    log:'结点个数最多 111，选 C。' },
];

AW.init({
  title: '2009-05 完全二叉树的最多结点数 · 分层构树动画',
  subtitle: '题：完全二叉树第 6 层（根为第 1 层）有 <code>8</code> 个叶结点，结点总数最多是__？策略：前 6 层放满、第 6 层除 8 叶外的结点伸满第 7 层。',
  counterLabel: '构树步',
  intro: '点击「▶ 播放」，看一棵 111 个结点的完全二叉树逐层长出来。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '最多 111 个（选 C）',
    html: '前 5 层放满 <code>31</code> + 第 6 层放满 <code>32</code>（末尾 8 个为叶）+ 第 7 层 <code>24×2 = 48</code> = <b>111</b>。关键：叶结点只约束「自己没有孩子」，第 6 层其余 24 个还能伸满第 7 层。反证：若 119，第 6 层前 28 个都得有孩子，叶子只剩 4 ≠ 8。记忆锚点：<code>前 k 层满 = 2^k − 1</code>，叶子排在完全树同层的尾部。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
