<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-06 动画 · 森林转二叉树后的关系判定</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/推理链类：左孩子右兄弟规则下的组合枚举
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：转换规则',
    cls: 'key',
    body: '<p>森林 → 二叉树的规则是「<b>左孩子、右兄弟</b>」：二叉树中某结点的<b>左孩子</b>是它在森林里的第一个孩子，<b>右孩子</b>是它的下一个兄弟。设 v 在二叉树中的父结点为 <code>w</code>，而 w 的父结点是 <code>u</code>——题给条件即 u 是 v 的二叉树「祖父」。</p>' },
  { title: '组合枚举：4 种位置',
    cls: 'step',
    body: '<p>v 可能是 w 的<b>左孩子</b>或<b>右孩子</b>，w 也可能是 u 的左孩子或右孩子，共 <code>4</code> 种组合，逐一翻译回森林查关系。</p>' },
  { title: '组合一：左·左',
    cls: 'step',
    body: '<p>v 是 w 的<b>左</b>孩子、w 是 u 的<b>左</b>孩子：森林里 v 是 w 的第一个孩子、w 是 u 的第一个孩子 → u 是 v 的<b>祖父</b>，三种关系都不满足。</p>' },
  { title: '组合二：右·左 → I 可能',
    cls: 'good',
    body: '<p>v 是 w 的<b>右</b>孩子（v 是 w 的下一兄弟）、w 是 u 的<b>左</b>孩子：w 与 v 同为 u 的孩子 → <b>I. 父子关系，可能</b>。✓</p>' },
  { title: '组合三：右·右 → II 可能',
    cls: 'good',
    body: '<p>w 是 u 的<b>右</b>孩子（w 是 u 的下一兄弟）、v 是 w 的<b>右</b>孩子：u、w、v 是同父的三兄弟 → <b>II. 兄弟关系，可能</b>。✓</p>' },
  { title: '组合四：右孩子下再挂左 → III 不可能',
    cls: 'bad',
    body: '<p>w 是 u 的<b>右</b>孩子、v 是 w 的<b>左</b>孩子：u 与 w 是兄弟，v 是 w 的孩子 → u 与 v 是伯侄。查 III：u 的父结点与 v 的父结点（w）是<b>父子</b>而非兄弟 → III 不成立。✗</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>I、II 都有合法组合；III 任何组合都推不出——v 的父结点要么就是 w 本身（与 u 的父结点是父子），要么与 u 的父结点是同一结点（同一人谈不上互为兄弟）。答案选 <b>B（I 和 II）</b>。</p>' },
  { title: '记忆锚点',
    cls: 'key',
    body: '<p>「右孩子 = 兄弟」是钥匙：v 挂在右边就往<b>同层</b>想（兄弟 → 进而与 u 成父子），挂在左边就往<b>下一层</b>想；III 要跨两层仍保持兄弟链，翻译回去必然变成父子。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '森林转二叉树：u 是 v 的「祖父」，森林里可能是什么关系？',
  subtitle: '考点：左孩子右兄弟 · 4 种位置组合逐一翻译回森林（2009-06）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 成立 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（I 和 II）',
    html: '记忆锚点：组合「右·左」给出<b>父子</b>（I），组合「右·右」给出<b>兄弟</b>（II）；「左·左」是普通祖孙，而 III 要求 u 的父结点与 v 的父结点互为兄弟，对照四种组合全都不成立。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
