<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-06 森林 → 二叉树转换 · 祖孙关系检验动画</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .dual{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .panel{flex:1 1 380px;max-width:470px;min-width:300px}
  .ptitle{font-size:13px;font-weight:700;color:#213e48;margin-bottom:6px;text-align:center}
  .fsvg{width:100%;display:block;background:#f8edcb;border:1px solid #1b3a4b38;border-radius:12px}
  .fsvg .tedge{stroke:#b9cbd0;stroke-width:2.5px;transition:opacity .4s, stroke .3s, stroke-width .3s}
  .fsvg .tedge.lithot{stroke:#e07a2f;stroke-width:4px}
  .fsvg .tedge.litok{stroke:#2f9e44;stroke-width:4px}
  .fsvg .tnode circle{fill:#ffffff;stroke:#213e48;stroke-width:2.5px;transition:opacity .4s, fill .3s, stroke .3s}
  .fsvg .tnode text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:14px;
    text-anchor:middle;dominant-baseline:central;fill:#1b3a4b;transition:opacity .4s, fill .3s}
  .fsvg .tnode.hotn circle{fill:#e07a2f;stroke:#b45309}
  .fsvg .tnode.hotn text{fill:#fff}
  .fsvg .tnode.okn circle{fill:#2f9e44;stroke:#276942}
  .fsvg .tnode.okn text{fill:#fff}
  .fsvg .tnode.badn circle{fill:#e63946;stroke:#a02830}
  .fsvg .tnode.badn text{fill:#fff}
  .fsvg .hidden-el{opacity:0}
  .fsvg .elab{font-size:12px;font-weight:700;fill:#586e72;font-family:PingFang SC,sans-serif}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 2009-06 森林→二叉树转换动画（SVG 双面板） ==================
 * 题：二叉树中 u 是 v 的父结点的父结点（u 是 v 的"二叉树祖父"），
 *     森林中 u、v 可能的关系：I 父子 / II 兄弟 / III u 的父与 v 的父是兄弟？（答案 B：I 和 II）
 * 演示：左面板画出一座示例森林，右面板按「左孩子·右兄弟」转换成二叉树；
 *       再取 4 组具体结点对（对应 4 种左右孩子组合）逐一检验 I/II/III。 */

var FOREST = {
  nodes:{ A:[90,45], B:[40,140], C:[100,140], D:[160,140], E:[40,235], F:[75,235], G:[130,235], D1:[160,235], H:[255,45] },
  edges:[['A','B'], ['A','C'], ['A','D'], ['B','E'], ['C','F'], ['C','G'], ['D','D1']],
};
// 二叉树：边 [父, 子, 左/右]
var BIN = {
  nodes:{ A:[235,40], B:[135,110], H:[335,110], E:[70,180], C:[200,180], F:[140,250], D:[260,250], G:[195,320], D1:[210,320] },
  edges:[['A','B','左'], ['A','H','右'], ['B','E','左'], ['B','C','右'], ['C','F','左'], ['C','D','右'], ['F','G','右'], ['D','D1','左']],
};
// 每个检验步的高亮集合：f=森林结点, fe=森林边, b=二叉树结点, be=二叉树边, verd=判决
var ST = {
  3:{ f:['A','B','E'],       fe:['B-E','A-B'],           b:['A','B','E'],    be:['B-E','A-B'],   verd:'' },
  4:{ f:['A','B','C'],       fe:['A-B','A-C'],           b:['A','B','C'],    be:['B-C','A-B'],   verd:'ok' },
  5:{ f:['A','B','C','D'],   fe:['A-B','A-C','A-D'],     b:['B','C','D'],    be:['C-D','B-C'],   verd:'ok' },
  6:{ f:['A','C','D','D1'],  fe:['A-C','A-D','D-D1'],    b:['C','D','D1'],   be:['D-D1','C-D'],  verd:'miss' },
};

function nodesHtml(pos, step){
  var h = '';
  Object.keys(pos).forEach(function(id){
    h += '<g class="tnode hidden-el" data-step="' + step + '" data-id="' + id + '">' +
         '<circle cx="' + pos[id][0] + '" cy="' + pos[id][1] + '" r="21"/>' +
         '<text x="' + pos[id][0] + '" y="' + pos[id][1] + '">' + id + '</text></g>';
  });
  return h;
}
function edgesHtml(edges, pos, step, withLabel){
  var h = '';
  edges.forEach(function(e){
    var a = pos[e[0]], b = pos[e[1]];
    if(withLabel){
      h += '<g class="tedge hidden-el" data-step="' + step + '" data-id="' + e[0] + '-' + e[1] + '">' +
           '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>' +
           '<text class="elab" text-anchor="middle" x="' + ((a[0] + b[0]) / 2 + (e[2] === '左' ? -13 : 13)) +
           '" y="' + ((a[1] + b[1]) / 2 - 8) + '">' + e[2] + '</text></g>';
    } else {
      h += '<line class="tedge hidden-el" data-step="' + step + '" data-id="' + e[0] + '-' + e[1] + '"' +
           ' x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
    }
  });
  return h;
}

function build(stage){
  var p1 = AW.el('div', 'panel',
    '<div class="ptitle">原森林（树1：A 及其子孙　树2：H）</div>' +
    '<svg viewBox="0 0 320 290" class="fsvg">' +
    edgesHtml(FOREST.edges, FOREST.nodes, 1, false) +
    nodesHtml(FOREST.nodes, 1) +
    '</svg>');
  var p2 = AW.el('div', 'panel',
    '<div class="ptitle">转换后的二叉树（左孩子 · 右兄弟）</div>' +
    '<svg viewBox="0 0 470 370" class="fsvg">' +
    edgesHtml(BIN.edges, BIN.nodes, 2, true) +
    nodesHtml(BIN.nodes, 2) +
    '</svg>');
  var dual = AW.el('div', 'dual');
  dual.appendChild(p1); dual.appendChild(p2);
  stage.innerHTML = '';
  stage.appendChild(dual);
  this._svgF = p1.querySelector('.fsvg'); this._svgB = p2.querySelector('.fsvg');
}

function apply(svg, nodes, edges, st, verd){
  [].forEach.call(svg.querySelectorAll('.tnode, .tedge'), function(el){
    el.classList.remove('hotn', 'okn', 'badn', 'lithot', 'litok');
  });
  if(!st) return;
  nodes.forEach(function(id){
    var el = null;
    [].forEach.call(svg.querySelectorAll('.tnode'), function(g){ if(g.dataset.id === id) el = g; });
    if(el) el.classList.add(verd === 'ok' ? 'okn' : (verd === 'miss' ? 'badn' : 'hotn'));
  });
  edges.forEach(function(id){
    var el = null;
    [].forEach.call(svg.querySelectorAll('.tedge'), function(g){ if(g.dataset.id === id) el = g; });
    if(el) el.classList.add(verd === 'ok' ? 'litok' : 'lithot');
  });
}

function render(stage, sn, i){
  [].forEach.call(this._svgF.querySelectorAll('.tnode, .tedge'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  [].forEach.call(this._svgB.querySelectorAll('.tnode, .tedge'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  var st = sn.st || null, verd = st ? st.verd : '';
  apply(this._svgF, st ? st.f : [], st ? st.fe : [], st, verd);
  apply(this._svgB, st ? st.b : [], st ? st.be : [], st, verd);
}

var SNAPS = [
  { cls:'shift', tag:'开始', count:0,
    log:'森林 → 二叉树的规则是「左孩子 · 右兄弟」：左孩子 = 原来的第一个孩子，右孩子 = 下一个兄弟。题给条件：二叉树中 u 是 v 的父结点的父结点——问 u、v 在原森林中可能是什么关系。下面画一座具体森林逐一检验。' },
  { cls:'step', tag:'画出森林', count:1,
    log:'示例森林：树1 根 A，孩子 B、C、D；B 的孩子 E；C 的孩子 F、G；D 的孩子 D1；树2 单结点 H。' },
  { cls:'ok', tag:'转换', count:2,
    log:'转成二叉树：A 左=B（第一个孩子）、A 右=H（下一棵树的根）；B 左=E、B 右=C（C 是 B 的弟弟）；C 左=F、C 右=D；F 右=G、D 左=D1。边上的「左/右」就是翻译回森林的钥匙。' },
  { cls:'step', tag:'组合一：左·左', count:3, st:ST[3],
    log:'取对 (u=A, v=E)：二叉树中 E 的父是 B、B 的父是 A。E 是 B 的左孩子（第一个孩子）、B 是 A 的左孩子 → 森林里 A 是 E 的祖父。父子？兄弟？都不是——先看一个"什么都不是"的组合。' },
  { cls:'ok', tag:'组合二：右·左 → I 成立', count:4, st:ST[4], ribbon:{k:1, ok:true},
    log:'取对 (u=A, v=C)：C 是 B 的右孩子（= B 的弟弟），B 是 A 的左孩子 → 森林里 C 与 B 同为 A 的孩子 → A 是 C 的父亲。I. 父子关系，可能 ✓' },
  { cls:'ok', tag:'组合三：右·右 → II 成立', count:5, st:ST[5], ribbon:{k:2, ok:true},
    log:'取对 (u=B, v=D)：D 是 C 的右孩子（弟弟）、C 是 B 的右孩子（弟弟）→ 森林里 B、C、D 是同父三兄弟 → B 与 D 是兄弟。II. 兄弟关系，可能 ✓' },
  { cls:'miss', tag:'组合四：左·右 → III 不成立', count:6, st:ST[6], ribbon:{k:3, ok:false},
    log:'取对 (u=C, v=D1)：D1 是 D 的左孩子（D 的第一个孩子）、D 是 C 的右孩子（C 的弟弟）→ 森林里 D1 是 D 的孩子，C 与 D 是兄弟（C 与 D1 是伯侄）。查 III：C 的父结点 A 与 D1 的父结点 D 是「父子」而非兄弟 → III 不成立 ✗' },
  { cls:'shift', tag:'III 为何总不成立', count:6,
    log:'一般地，v 的森林父结点只有两种落点：① v 是 w 的左孩子 → v 的父 = w，此时 u 的父与 w 是「父子」；② v 是 w 的右孩子 → v 的父 = u 自己。「父与子」「自己与自己」都成不了兄弟 → III 任何组合都推不出。' },
  { cls:'done', tag:'完成', count:6, done:true,
    log:'I、II 均有合法组合，III 永远不成立 → 答案选 B（I 和 II）。' },
];

AW.init({
  title: '2009-06 森林 → 二叉树转换 · 祖孙关系检验动画',
  subtitle: '题：二叉树中 u 是 v 的父结点的父结点，森林中 u、v 可能的关系？规则 <code>左孩子 = 第一个孩子，右孩子 = 下一兄弟</code>——画出森林与转换结果，用具体结点对逐一检验 I / II / III。',
  counterLabel: '检验步',
  ribbonTitle: '关系检验（✓ 可能 / ✗ 不可能）',
  intro: '点击「▶ 播放」，先看森林怎么转成二叉树，再用 4 组结点对逐一检验。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 B（I 和 II）',
    html: '「右孩子 = 下一兄弟」是钥匙：v 是 w 的右孩子 → v 与 w 同父，w 是 u 的左孩子时 u 就是 v 的父亲（<b>I</b>）；w 也是右孩子时 u、w、v 三兄弟（<b>II</b>）。而 v 的森林父结点要么是 w（与 u 的父是父子）、要么就是 u 自己——都成不了兄弟 → <b>III 永远不成立</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
