<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-07 动画 · 无向连通图性质判断</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/推理类：三条叙述逐条验证（证明或反例）
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：判断标准',
    cls: 'key',
    body: '<p>三条叙述要么给出「对所有无向连通图都成立」的理由，要么举出<b>一个反例</b>否决。注意题问的是「正确的是」，必须挑<b>恒成立</b>的。</p>' },
  { title: '验证 I：度之和为偶数',
    cls: 'good',
    body: '<p>无向图每条边给两个端点<b>各贡献 1 度</b>，所以所有顶点的度之和 = <code>2 × 边数</code>，一定是偶数（握手定理，与是否连通无关）→ <b>I 恒成立</b>。✓</p>' },
  { title: '验证 II：边数大于 n−1',
    cls: 'bad',
    body: '<p>反例：n 个顶点的<b>树</b>就是无向连通图，边数恰好 <code>= n − 1</code>，并不「大于」n − 1 → II 不成立。✗</p>' },
  { title: '验证 III：存在度为 1 的顶点',
    cls: 'bad',
    body: '<p>反例：3 个顶点构成<b>三角形（环）</b>，每个顶点的度都是 <code>2</code>，没有任何度为 1 的顶点 → III 不成立。✗</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有 I 是必然性质，II、III 都能举出反例 → 答案选 <b>A（只有 I）</b>。</p>' },
  { title: '记忆锚点',
    cls: 'key',
    body: '<p>度之和 = <code>2E</code>（握手定理）永远成立；「连通」只保证 <code>E ≥ n − 1</code>，不保证 <code>E &gt; n − 1</code>（树取等号）；「有度为 1 的顶点」对环、完全图都不成立。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '无向连通图，哪条性质一定成立？',
  subtitle: '考点：握手定理 · 连通图边数下界 · 度为 1 的顶点未必存在（2009-07）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 成立 / ✗ 反例否决）',
  intro: '点击「▶ 播放」逐条验证三个叙述。',
  snaps: snaps,
  result: {
    big: '答案 A（只有 I）',
    html: '记忆锚点：度之和 = <b>2 × 边数</b> 必为偶数；树是「边数 = n − 1」的连通图（否掉 II）；三角形环「每点度数 2」（否掉 III）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
