<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-08 动画 · m 阶 B 树定义辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念辨析类：m 阶 B 树定义要点逐项对照
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：m 阶 B 树定义要点',
    cls: 'key',
    body: '<p>① 根结点最多有 <code>m</code> 棵子树（非叶时至少 2 棵）；② 除根外每个非叶结点子树数在 <code>⌈m/2⌉ ～ m</code> 之间；③ 所有<b>叶结点（失败结点）在同一层</b>；④ 结点内关键字升序（或降序）<b>有序</b>。要找「<b>不符合</b>」的一条。</p>' },
  { title: '逐项分析 A',
    cls: 'good',
    body: '<p>A「根结点最多有 m 棵子树」：与要点①完全一致，符合定义。✓</p>' },
  { title: '逐项分析 B',
    cls: 'good',
    body: '<p>B「所有叶结点都在同一层上」：B 树是<b>绝对平衡</b>的多路查找树，全部叶结点（失败结点）出现在同一层，与要点③一致，符合定义。✓</p>' },
  { title: '逐项分析 C',
    cls: 'good',
    body: '<p>C「各结点内关键字均升序或降序排列」：B 树是查找结构，结点内关键字必须有序才能二段式查找，与要点④一致，符合定义。✓</p>' },
  { title: '逐项分析 D',
    cls: 'bad',
    body: '<p>D「叶结点之间通过指针链接」：<b>这是 B+ 树的特性</b>——B+ 树把全部关键字放在叶子层并串成有序链表以支持顺序（范围）查找。m 阶 B 树的关键字分散在所有结点中，叶子之间没有链接指针 → <b>不符合 B 树定义</b>。✗</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>A、B、C 都是定义原文，D 是 B+ 树的标志 → 答案选 <b>D</b>。</p>' },
  { title: '记忆锚点',
    cls: 'key',
    body: '<p>「<b>叶子串链表</b>」见 B+ 不见 B；再记一条：B 树的关键字全部结点都存，B+ 树把关键字集中在叶子层、非叶结点只作索引。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '哪条叙述不符合 m 阶 B 树的定义？',
  subtitle: '考点：B 树定义要点 vs B+ 树特性 · 逐项对照（2009-08）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 符合 / ✗ 不符合）',
  intro: '点击「▶ 播放」逐项对照 B 树定义。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：「叶子之间通过指针链接」是 <b>B+ 树</b>的标志性特征（叶子串成有序链表便于范围查询），m 阶 B 树定义中没有这一条；A、B、C 均为定义原文。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
