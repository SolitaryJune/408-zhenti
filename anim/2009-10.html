<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-10 动画 · 用第二趟不变量识别排序算法</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/推理类：四种排序第二趟后的不变量逐一对照
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：序列与切入点',
    cls: 'key',
    body: '<p>序列 <code>11, 12, 13, 7, 8, 9, 23, 4, 5</code> 是<b>第二趟排序后</b>的结果。每种排序第二趟后都有固定特征（不变量），逐一对照即可锁定唯一可能的算法。</p>' },
  { title: '对照冒泡排序',
    cls: 'bad',
    body: '<p>冒泡每趟把一个最值「就位」：大数沉底版第二趟后末两位应是 <code>13, 23</code>（小数冒顶版前两位应是 <code>4, 5</code>）。题面末两位是 <code>4, 5</code>、前两位是 <code>11, 12</code>，两端都不满足 → 不可能是冒泡。✗</p>' },
  { title: '对照插入排序',
    cls: 'good',
    body: '<p>插入排序第 i 趟后<b>前 i+1 个元素有序</b>：第二趟后前 3 个 <code>11, 12, 13</code> 恰好有序，后 6 个保持输入原样即可（输入可取 <code>11, 13, 12, 7, …</code>）→ 可能是插入排序。✓</p>' },
  { title: '对照选择排序',
    cls: 'bad',
    body: '<p>选择排序每趟从未排序部分选最值放到前端：第二趟后前两位应是全序列最小的 <code>4, 5</code>，题面是 <code>11, 12</code> → 不可能。✗</p>' },
  { title: '对照二路归并排序',
    cls: 'bad',
    body: '<p>归并每趟使有序段长度翻倍：第二趟后每 <code>4</code> 个一组各自有序。第一组 <code>11, 12, 13, 7</code> 内部无序 → 不可能。✗</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>四种算法里只有<b>插入排序</b>的第二趟不变量成立 → 答案选 <b>B</b>。</p>' },
  { title: '记忆锚点',
    cls: 'key',
    body: '<p>四个不变量一句话：冒泡看「<b>两端就位的最值</b>」、插入看「<b>前缀有序</b>」、选择看「<b>前缀是最小的几个</b>」、归并看「<b>等长块内有序</b>」。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '哪个算法的第二趟可能排出这个序列？',
  subtitle: '序列 <code>11,12,13,7,8,9,23,4,5</code> · 四种排序的不变量逐一对照（2009-10）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 可能 / ✗ 排除）',
  intro: '点击「▶ 播放」逐个算法对照第二趟特征。',
  snaps: snaps,
  result: {
    big: '答案 B（插入排序）',
    html: '记忆锚点：只有插入排序允许「<b>前缀有序、其余保持输入原样</b>」（前 3 个 11,12,13 有序即可）。冒泡看两端最值（不满足）、选择看最小两数在前（4,5 不在前两位）、归并看 4 元块内有序（11,12,13,7 无序）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
