<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-11 CPU 区分指令与数据的依据</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     2009-11：冯·诺依曼机 CPU 区分指令和数据的依据
     模板：概念/推理链类，只改 AW.init 区域
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>冯·诺依曼计算机：<b>指令和数据都以二进制形式存放在同一存储器中</b>。从存储器读出的都只是 0/1 串，CPU 到底靠什么把它们区分开？</p>' },
  { title: '选项 A：指令操作码的译码结果',
    cls: 'bad',
    ribbon: {k:1, ok:false},
    body: '<p><b>错</b>。译码发生在<b>取指之后</b>——CPU 得先把取出的内容当指令送入 IR，才谈得上对操作码译码。译码是「先当指令用」之后的结果，不能反过来当区分依据。</p>' },
  { title: '选项 B：指令和数据的寻址方式',
    cls: 'bad',
    ribbon: {k:2, ok:false},
    body: '<p><b>错</b>。寻址方式只说明如何寻找操作数，与「取出的内容是指令还是数据」无关；寻址方式字段本身就在指令里，前提仍是先把它当指令。</p>' },
  { title: '选项 C：指令周期的不同阶段',
    cls: 'good',
    ribbon: {k:3, ok:true},
    body: '<p><b>对</b>。<b>取指周期</b>从存储器取出的一定是指令（送 IR）；<b>执行周期</b>访存取出的一定是操作数（送运算器）。同一段二进制，处在哪个阶段就被当做什么用——阶段就是区分依据。</p>' },
  { title: '选项 D：指令和数据所在的存储单元',
    cls: 'bad',
    ribbon: {k:4, ok:false},
    body: '<p><b>错</b>。存储程序原理下指令和数据可以放在<b>任意</b>存储单元，同一单元先后既可存指令也可存数据，按单元区分不了。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>取指取的是指令、执行访存取的是数据——CPU 按「指令周期的不同阶段」区分指令和数据</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    ribbon: s.ribbon || null,
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2009-11 冯·诺依曼机：CPU 区分指令与数据的依据',
  subtitle: '考点：存储程序原理 · 指令执行过程',
  counterLabel: '推理步',
  ribbonTitle: '选项判定（✓ 对 / ✗ 错）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '按<b>指令周期的不同阶段</b>区分：取指周期取出的是<b>指令</b>，执行周期访存取出的是<b>数据</b>。A 译码在后、B 寻址方式无关、D 单元任意存放，均不能作为依据。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
