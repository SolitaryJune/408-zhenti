<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-22 外部中断与内部异常辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2009-22：外部中断 vs 内部异常（推理链）
     模板：概念/推理链类，只改 AW.init 区域
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先分两类',
    cls: 'key',
    body: '<p><b>外部中断</b>：由 <b>CPU 以外的部件（外设）</b>发出中断请求引起，与当前执行的指令无关，随时可能发生。<b>内部异常</b>：由 <b>CPU 内部</b>执行指令过程中发生的事件引起（运算溢出、除 0、缺页、非法操作码等）。</p>' },
  { title: '选项 A：键盘输入',
    cls: 'good',
    ribbon: {k:1, ok:true},
    body: '<p><b>是外部中断</b>。键盘是典型的外部设备，用户敲键后由键盘（经接口）向 CPU 发出<b>中断请求</b>，源头在 CPU 之外——与正在执行的指令无关。</p>' },
  { title: '选项 B：除数为 0',
    cls: 'bad',
    ribbon: {k:2, ok:false},
    body: '<p><b>内部异常</b>。执行除法指令时由 CPU 内部检测出除数为 0，随指令产生，与外设无关。</p>' },
  { title: '选项 C：浮点运算下溢',
    cls: 'bad',
    ribbon: {k:3, ok:false},
    body: '<p><b>内部异常</b>。运算结果超出浮点数的可表示范围，发生在 CPU 的<b>运算器内部</b>，属指令执行中的事件（常按机器零处理，但仍属内部事件）。</p>' },
  { title: '选项 D：访存缺页',
    cls: 'bad',
    ribbon: {k:4, ok:false},
    body: '<p><b>内部异常</b>。取指令或取数访存时发现该页不在主存，由<b>指令执行引发</b>，页表/存储管理都在 CPU 一侧——不是外设请求。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A（键盘输入）</b>。记忆锚点：<b>看事件源头——外设请求 = 外部中断；指令执行中 CPU 内部产生 = 内部异常</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    ribbon: s.ribbon || null,
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2009-22 哪个事件引起外部中断？',
  subtitle: '考点：异常和中断机制 · 外部中断与内部异常的区分',
  counterLabel: '推理步',
  ribbonTitle: '选项判定（✓ 外部中断 / ✗ 内部异常）',
  intro: '点击「▶ 播放」逐项归类。',
  snaps: snaps,
  result: {
    big: '答案 A（键盘输入）',
    html: '唯一源头在 CPU 之外的事件是<b>键盘输入</b>。除 0、浮点下溢都发生在 CPU 运算器内部；缺页由访存指令引发——三者均为<b>内部异常</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
