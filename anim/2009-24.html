<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-24 · 哪个调度算法兼顾等待与执行</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念辨析类：进程调度算法对比（答案 D）
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>题眼：<b>综合考虑等待时间和执行时间</b> → 找一个把这两个量<b>都</b>放进"挑选依据"的算法。候选公式：<code>R = 1 + 等待时间 / 要求服务时间</code>。</p>' },
  { title: 'A. 时间片轮转 —— 错',
    cls: 'bad',
    body: '<p>按固定时间片轮流执行，每个进程机会均等，挑选与等待时间、执行时间<b>都无关</b> → 排除。</p>' },
  { title: 'B. 短进程优先 —— 错',
    cls: 'bad',
    body: '<p>只看<b>执行时间</b>（短的先上），等待时间不参与比较，长进程可能饥饿 → 只考虑了一头，排除。</p>' },
  { title: 'C. 先来先服务 —— 错',
    cls: 'bad',
    body: '<p>只按到达顺序排队（体现等待时间），执行时间不参与比较 → 也只考虑了一头，排除。</p>' },
  { title: 'D. 高响应比优先 —— 对',
    cls: 'good',
    body: '<p>响应比 <code>R = 1 + 等待/服务</code>：<b>等得久 → R 升高</b>（照顾等待），<b>服务短 → R 升高</b>（照顾短作业）。等待与执行两个因素同时起作用。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案 <b>D</b>。记忆锚点：<b>响应比 = 1 + 等待时间 / 要求服务时间</b>，等待与执行"一锅端"。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2009-24 · 哪个调度算法兼顾等待与执行',
  subtitle: '考点：高响应比优先 · R = 1 + 等待时间 / 要求服务时间',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：<b>高响应比优先：R = 1 + W/S</b>。分子含等待时间，分母是执行（服务）时间——等待越长、执行越短，R 越大，故"综合考虑"两者。A 与两者无关，B 只看执行，C 只看到达顺序。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
