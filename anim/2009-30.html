<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009-30 · 文件访问控制信息的存放位置</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念辨析类：文件访问控制信息的合理位置（答案 A FCB）
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>题眼：<b>文件访问控制信息</b> = "谁能对该文件做什么"（读/写/执行权限）的存取控制信息，找它的合理存放位置。</p>' },
  { title: 'A. 文件控制块 —— 对',
    cls: 'good',
    body: '<p>FCB 是文件存在的标志，存放文件的<b>全部管理信息</b>：名称、物理位置、结构、<b>存取控制信息</b>、使用信息等 → 访问控制信息就在 FCB 中，打开文件时调入内存随取随用。</p>' },
  { title: 'B. 文件分配表 —— 错',
    cls: 'bad',
    body: '<p>FAT 记录<b>盘块的分配/链接</b>情况，管的是"文件放在哪些块"，不管"谁能访问" → 排除。</p>' },
  { title: 'C. 用户口令表 —— 错',
    cls: 'bad',
    body: '<p>口令表用于<b>登录认证</b>（验证"你是谁"），不是"你能否访问某个文件" → 排除。</p>' },
  { title: 'D. 系统注册表 —— 错',
    cls: 'bad',
    body: '<p>注册表存放操作系统的<b>配置信息</b>，与单个文件的访问控制无关 → 排除。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案 <b>A</b>。记忆锚点：FCB 是文件的"户口本"，基本信息 + 地址信息 + <b>存取控制信息</b> + 使用信息都在其中。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2009-30 · 文件访问控制信息存在哪',
  subtitle: '考点：文件控制块 FCB 的组成 · 存取控制信息',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '记忆锚点：<b>FCB = 文件的"户口本"</b>，基本信息 + 地址信息 + <b>存取控制信息</b> + 使用信息都在其中。FAT 管盘块分配，口令表管身份认证，注册表管系统配置。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
