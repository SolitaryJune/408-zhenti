<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念/分析类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2009-34：奈奎斯特定理求无噪声信道极限速率
     模板：概念 / 计算推理类（逐步揭示推理链卡片）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：无噪声 → 奈奎斯特',
    cls: 'key',
    body: '<p>题干条件：<b>无噪声</b>、带宽 W = <code>3 kHz</code>、QAM 调制 4 相位 × 4 振幅。「无噪声」且未给信噪比 → 用<b>奈奎斯特定理</b>，不是香农公式。</p>' },
  { title: '写出奈奎斯特公式',
    cls: '',
    body: '<p>理想无噪声信道极限速率：<code>C = 2W × log2(V)</code>。W 是带宽（Hz），V 是每个码元可取的状态数。</p>' },
  { title: '求码元状态数 V',
    cls: '',
    body: '<p>QAM 把相位与振幅组合：每个码元共有 <code>4 × 4 = 16</code> 种状态，即 V = 16。</p>' },
  { title: '换算每码元比特数',
    cls: '',
    body: '<p>每码元携带 <code>log2(16) = 4</code> bit 信息。</p>' },
  { title: '代入求极限速率',
    cls: 'good',
    body: '<p>C = 2 × 3000 × 4 = <b>24000 bps = 24 kbps</b>。选 <b>B</b>。</p>' },
  { title: '排除干扰项',
    cls: 'bad',
    body: '<p>A 12 kbps：漏了系数 2（3000×4）。C 48 kbps：把 2W 误乘成 4W（4×3000×4）。D 96 kbps：忘了对状态数取对数（2×3000×16）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2009-34：奈奎斯特定理求最大速率',
  subtitle: '无噪声 · 带宽 3 kHz · QAM 4 相位 × 4 振幅 · 选项逐项推演',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开计算推理链。',
  snaps: snaps,
  result: {
    big: '答案 B：24 kbps',
    html: '记忆锚点：<b>无噪声找奈奎斯特（2W log2 V），有噪声才找香农</b>。<br>V = 4 相位 × 4 振幅 = 16 种状态，log2(16)=4，C = 2×3000×4 = 24000 bps。干扰项 A 漏系数 2、C 系数错乘 4、D 未取对数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
