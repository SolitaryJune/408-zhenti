<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念/分析类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     2009-36：以太网交换机转发决策使用的 PDU 地址
     模板：概念 / 分析推理类（逐步揭示推理链卡片）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：交换机的 PDU 是帧',
    cls: 'key',
    body: '<p>以太网交换机是<b>数据链路层（二层）</b>设备，处理的 PDU 是「帧」。帧头里只有 MAC 地址（物理地址），没有 IP 地址。</p>' },
  { title: '交换机的两个动作：学习与转发',
    cls: '',
    body: '<p>收到帧后交换机做两件事，方向相反：<br><b>自学习</b>：把「<b>源</b> MAC ↔ 入端口」写进地址表；<br><b>转发决策</b>：拿帧的「<b>目的</b> MAC」查地址表定出端口。</p>' },
  { title: '转发决策查目的 MAC',
    cls: 'good',
    body: '<p>表查到 → 从对应端口发出；查不到 → 向除入端口外的所有端口<b>泛洪</b>。转发决策使用的正是<b>目的物理地址</b>，选 <b>A</b>。</p>' },
  { title: '排除 C：源 MAC 是学习的',
    cls: 'bad',
    body: '<p>源物理地址用于<b>自学习</b>建表，不是转发决策的查询依据——两个动作刚好用两个不同方向的地址。</p>' },
  { title: '排除 B、D：IP 是三层的事',
    cls: 'bad',
    body: '<p>目的/源 IP 地址属于网络层，交换机不解析；按 IP 地址转发是<b>路由器</b>（三层设备）的职责。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2009-36：交换机转发决策用的地址',
  subtitle: '考点：以太网交换机 · 自学习 vs 转发决策 · 选项逐项推演',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A：目的物理地址',
    html: '记忆锚点：<b>源 MAC 学习进表，目的 MAC 查表转发</b>。<br>干扰项：C 源 MAC 用于自学习；B/D 是 IP 地址，路由器才用。交换机的 PDU 是帧，路由器的 PDU 是 IP 分组。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
