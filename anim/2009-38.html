<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念/分析类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2009-38：TCP 确认序号的推算
     模板：概念 / 计算推理类（逐步揭示推理链卡片）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：确认号的规则',
    cls: 'key',
    body: '<p>TCP 的确认号 = <b>期望对方发送的下一个字节的序号</b>（累积确认），即「最后收到的字节序号 + 1」。已知：第一段序号 <code>200</code>、载荷 <code>300 B</code>；第二段载荷 <code>500 B</code>。</p>' },
  { title: '第一段：字节 200～499',
    cls: '',
    body: '<p>第一段序号 200、300 B → 覆盖字节 <code>200 ～ 499</code>（首序号 + 载荷 − 1 = 末字节）。</p>' },
  { title: '第二段：字节 500～999',
    cls: '',
    body: '<p>第二段紧随其后，序号 = 200 + 300 = <code>500</code>，500 B → 覆盖字节 <code>500 ～ 999</code>。</p>' },
  { title: '套规则算确认号',
    cls: 'good',
    body: '<p>乙正确接收两段 → 累积确认到字节 999，确认号 = 999 + 1 = <b>1000</b>：「1000 之前都收到，请从 1000 继续」。选 <b>D</b>。</p>' },
  { title: '排除干扰项',
    cls: 'bad',
    body: '<p>A 500：只是第二段的序号（收完第一段的确认号）；C 800：两段载荷 300+500 相加，忘了加初始序号 200；B 700：200+500，漏加第一段载荷 300。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2009-38：TCP 确认号的推算',
  subtitle: '段1：序号 200、300 B · 段2：500 B · 确认号 = 期望的下一个字节',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D：1000',
    html: '记忆锚点：<b>确认号 = 已收到的最后字节序号 + 1 = 期望收到的第一个字节序号</b>。<br>200 + 300 + 500 = 1000。干扰项：A 500（第二段序号）、B 700（漏加一段载荷）、C 800（漏加初始序号）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
