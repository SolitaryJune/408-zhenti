<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念/分析类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2009-40：FTP 传递命令使用的连接
     模板：概念 / 特性对比类（逐步揭示推理链卡片）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：FTP 是双连接协议',
    cls: 'key',
    body: '<p>FTP 客户与服务器之间有<b>两条</b>连接：<b>控制连接</b> + <b>数据连接</b>。题目问「传递 FTP <b>命令</b>」走哪条。</p>' },
  { title: '控制连接：传命令，全程保持',
    cls: 'good',
    body: '<p>控制连接建立在 <b>TCP</b> 之上（服务器端熟知端口 <code>21</code>），传送客户端的命令与服务器的应答；在整个会话期间<b>一直保持打开</b>。</p>' },
  { title: '数据连接：传文件，按需开关',
    cls: '',
    body: '<p>数据连接也建立在 TCP 之上（主动模式服务器端端口 <code>20</code>），每次文件传输<b>按需建立、传完即关</b>，只负责文件内容。</p>' },
  { title: '排除 B：数据连接不传命令',
    cls: 'bad',
    body: '<p>B 说的是数据连接——它只传文件数据，不传命令。命令与数据各走各的连接，职责分明。</p>' },
  { title: '排除 C、D：FTP 基于 TCP',
    cls: 'bad',
    body: '<p>FTP 需要可靠的命令与文件交付，两条连接都建立在 <b>TCP</b> 之上，与 UDP 无关。基于 UDP 的文件传输协议是 TFTP（端口 69），别混淆。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2009-40：FTP 命令走哪条连接',
  subtitle: '考点：FTP 双连接 · 控制连接（TCP 21） vs 数据连接（TCP 20）',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A：TCP 之上的控制连接',
    html: '记忆锚点：<b>命令走 TCP 21 控制连接（全程保持），文件走 TCP 20 数据连接（按需建、传完断）</b>。<br>两条连接都基于 TCP；UDP 文件传输是 TFTP。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
