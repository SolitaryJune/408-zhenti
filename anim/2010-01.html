<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-01 进退栈约束 · 出栈序列判定动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 四个选项的确定性模拟结果（ops: 操作串；run: 最大连续退栈数）
var OPTS = [
  { L:'A', seq:'dcebfa', ok:true,  run:2,
    ops:['进a','进b','进c','进d','退d①','退c②','进e','退e①','退b②','进f','退f①','退a②'],
    note:'四个退栈段最长都只有 2 连退，合法。' },
  { L:'B', seq:'cbdaef', ok:true,  run:2,
    ops:['进a','进b','进c','退c①','退b②','进d','退d①','退a②','进e','退e①','进f','退f①'],
    note:'每段退栈都不超过 2 连退，合法。' },
  { L:'C', seq:'bcaefd', ok:true,  run:2,
    ops:['进a','进b','退b①','进c','退c①','退a②','进d','进e','退e①','进f','退f①','退d②'],
    note:'最长 2 连退（退 c、a 与退 f、d 两段），合法。' },
  { L:'D', seq:'afedcb', ok:false, run:5,
    ops:['进a','退a①','进b','进c','进d','进e','进f','退f①','退e②','退d③','退c④','退b⑤'],
    note:'要 f 先出只能压满 b~f，此后 e、d、c、b 全在栈顶只能连退，第 3 连退即违规。' },
];

function targetRow(seq, failAt){
  var chars = seq.split('');
  var classes = chars.map(function(c, i){ return failAt === i ? 'miss' : ''; });
  return AW.cellRow(chars, classes, null, 1);
}

function opChips(ops, failIdx){
  var h = '<div style="display:flex;flex-wrap:wrap;max-width:640px">';
  ops.forEach(function(o, i){
    var base = 'display:inline-block;border-radius:8px;padding:3px 9px;margin:3px 2px;font-size:13px;font-weight:700;';
    if (i === failIdx) {
      h += '<span style="' + base + 'background:#e6394620;border:1.5px solid #e63946;color:#a02830;animation:aw-pop .45s ease">' + o + ' ✗</span>';
    } else if (o.charAt(0) === '退') {
      h += '<span style="' + base + 'background:#f8edcb;border:1.5px solid #e07a2f;color:#92400e">' + o + '</span>';
    } else {
      h += '<span style="' + base + 'background:#1b3a4b14;border:1.5px solid #1b3a4b;color:#1b3a4b">' + o + '</span>';
    }
  });
  return h + '</div>';
}

// 违规瞬间的栈内视图（传入自底向上的数组）
function stackViz(arr){
  var h = '<div style="display:inline-block;text-align:center;margin:6px 18px 0 0;vertical-align:top">';
  h += '<div style="font-size:12px;color:#b9cbd0;margin-bottom:4px">栈顶 ↑</div>';
  h += '<div style="display:inline-flex;flex-direction:column;gap:4px;border:2px solid #5a7d8c66;border-radius:10px;padding:6px">';
  for (var i = arr.length - 1; i >= 0; i--){
    var cls = (i === arr.length - 1) ? 'aw-box miss' : 'aw-box dim';
    h += '<div class="' + cls + '" style="width:40px;height:34px;font-size:15px">' + arr[i] + '</div>';
  }
  return h + '</div><div style="font-size:12px;color:#b9cbd0;margin-top:4px">栈底</div></div>';
}

function optionSnap(o, i){
  var failIdx = o.ok ? -1 : 9;   // D 的违规操作是「退d③」（下标 9）
  var verdict = o.ok
    ? '<div style="margin-top:10px;font-size:15px;font-weight:800;color:#2f9e44">✓ 可行：最大连续退栈 ' + o.run + ' 次（允许 2 次）</div>'
    : '<div style="margin-top:10px;font-size:15px;font-weight:800;color:#e63946">✗ 不可行：退 d 已是第 3 次连续退栈，违反约束</div>';
  var extra = o.ok ? '' : stackViz(['b','c','d']) +
    '<div style="display:inline-block;vertical-align:top;max-width:430px;font-size:13.5px;line-height:1.9;color:#213e48">' +
    '弹出 a 后，为让 f 先出只能依次压入 b、c、d、e、f；此后栈顶依次是 e、d、c、b，<b>只能一直退栈</b>：' +
    '退 f①、退 e② 之后栈顶是 d，再退就<b style="color:#a02830">连续第 3 次退栈</b>，违规。</div>';
  return {
    cls: o.ok ? 'ok' : 'miss',
    tag: o.ok ? o.L + ' 可行 ✓' : o.L + ' 不可行 ✗',
    log: '选项 ' + o.L + '（' + o.seq + '）：' + o.note,
    count: i + 1,
    ribbon: { k: i + 1, ok: o.ok },
    html: '<div class="aw-row-label"><b>选项 ' + o.L + '</b> 的目标出栈序列</div>' +
          targetRow(o.seq, o.ok ? -1 : 3) +
          '<div class="aw-row-label" style="margin-top:12px"><b>唯一确定的操作序列</b>（蓝=进栈，琥珀=退栈，①②…=当前连续退栈计数）</div>' +
          opChips(o.ops, failIdx) + extra + verdict,
  };
}

var snaps = [{
  cls: 'step', tag: '规则', count: 0,
  html: '<div style="font-size:14.5px;line-height:2;color:#213e48">' +
        '进栈次序固定为 <b>a b c d e f</b>，进出栈可交替，但<b style="color:#a02830">不允许连续 3 次退栈</b>（2 连退合法）。<br>' +
        '判定方法：出栈序列给定后操作序列<b>唯一确定</b>——下一个要出的字符不在栈顶，就把未进栈的元素压到它出现为止再弹出。<br>' +
        '下面对四个选项逐一模拟，看最长的那段连续退栈有没有达到 3 次。</div>',
}].concat(OPTS.map(optionSnap)).concat([{
  cls: 'done', tag: '结论', count: 5, done: true,
  log: 'A、B、C 最大 2 连退合法；D 被迫 5 连退 → 不可能的出栈序列是 afedcb，选 D。',
  html: '<div style="font-size:15px;line-height:2;color:#213e48">' +
        'A、B、C 的最大连续退栈都是 <b>2 次</b>，合法；D 出 a 后必须压满 b~f，<b style="color:#a02830">被迫 5 连退</b>，第 3 连退即违规。<br>' +
        '所以不可能得到的出栈序列是 <b style="color:#e63946;font-size:18px">afedcb</b>，答案选 <b style="color:#e63946;font-size:18px">D</b>。</div>',
}]);

AW.init({
  title: '2010-01 · 不许连续退栈三次：判定不可能的出栈序列',
  subtitle: '进栈次序 <code>a b c d e f</code> · 逐选项确定性模拟 · 连续退栈上限 2 次',
  counterLabel: '已判定选项',
  ribbonTitle: '选项（✓ 可行 / ✗ 不可行）',
  intro: '点击「▶ 播放」逐个选项模拟，看哪一个躲不开 3 连退。',
  snaps: snaps,
  result: {
    big: '答案 D（afedcb）',
    html: '出栈序列给定后操作序列<b>唯一确定</b>。A/B/C 的最长连续退栈都只有 2 次；D 要先出 a 再出 f，只能压满 b~f 后<b>连退 5 次</b>，第 3 连退（退到 d）就违反「不允许连续三次退栈」。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
