<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-02 双端入队单端出队 · 可达序列判定动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 目标队形从出口端读到另一端；build: 各元素入队端（左/右）
var OPTS = [
  { L:'A', seq:'bacde', ok:true,  build:['a 先入','b 进左端','c 进右端','d 进右端','e 进右端'],
    strip:['bacde','bacd','bac','ba','a'], ends:['右端','右端','右端','左端'] },
  { L:'B', seq:'dbace', ok:true,  build:['a 先入','b 进左端','c 进右端','d 进左端','e 进右端'],
    strip:['dbace','dbac','bac','ba','a'], ends:['右端','左端','右端','左端'] },
  { L:'C', seq:'dbcae', ok:false,
    strip:['dbcae','dbca','bca'], ends:['右端','左端'] },
  { L:'D', seq:'ecbad', ok:true,  build:['a 先入','b 进左端','c 进左端','d 进右端','e 进左端'],
    strip:['ecbad','ecba','ecb','ec','e'], ends:['右端','右端','右端','左端'] },
];

function dequeRow(arr, marks){
  var chars = arr.split('');
  var cls = chars.map(function(c, i){ return marks && marks[i] ? marks[i] : ''; });
  var h = '<div style="display:flex;gap:6px">';
  for (var i = 0; i < chars.length; i++){
    h += '<div class="aw-col" style="width:44px">' +
         '<div class="aw-ptr" style="color:' + (i === 0 ? '#2f9e44' : 'transparent') + '">出口端→</div>' +
         '<div class="aw-box' + (cls[i] ? ' ' + cls[i] : '') + '">' + chars[i] + '</div></div>';
  }
  return h + '</div>';
}

function stripRows(o){
  var h = '';
  for (var i = 0; i < o.strip.length; i++){
    var marks = null;
    if (!o.ok && i === o.strip.length - 1){
      marks = {}; marks[o.strip[i].indexOf(o.seq.charAt(2))] = 'miss';   // 卡死的那位（选项 C 是 c）
    }
    if (i === 0){
      h += '<div style="display:flex;align-items:center;gap:10px;margin:4px 0">' +
           '<span style="font-size:13px;color:#213e48;font-weight:700;width:118px">目标队形</span>' + dequeRow(o.strip[0], marks) + '</div>';
    } else {
      h += '<div style="display:flex;align-items:center;gap:10px;margin:4px 0">' +
           '<span style="font-size:13px;color:#586e72;width:118px">剥去 ' + o.seq.charAt(5 - i) + '（' + o.ends[i - 1] + '）</span>' +
           dequeRow(o.strip[i], marks) + '</div>';
    }
  }
  return h;
}

function buildChips(o){
  var h = '<div style="margin-top:10px">';
  o.build.forEach(function(b){
    h += '<span style="display:inline-block;background:#1b3a4b14;border:1.5px solid #1b3a4b;border-radius:8px;padding:3px 9px;margin:3px;font-size:13px;font-weight:700;color:#1b3a4b">' + b + '</span>';
  });
  return h + '</div>';
}

function okSnap(o, i){
  return {
    cls: 'ok', tag: o.L + ' 可行 ✓', count: i + 1,
    ribbon: { k: i + 1, ok: true },
    log: '选项 ' + o.L + '（' + o.seq + '）：逐层剥离全部落在两端，可达。',
    html: '<div class="aw-row-label"><b>选项 ' + o.L + '</b>：目标出队序列（从出口端读出）</div>' +
          dequeRow(o.seq, { 0: 'hit' }) +
          '<div class="aw-row-label" style="margin-top:12px"><b>剥离检验</b>：最后入队的必在两端之一，逐个剥掉</div>' +
          stripRows(o) +
          '<div style="font-size:15px;font-weight:800;color:#2f9e44;margin-top:8px">✓ 每一层都落在端点，可达</div>' +
          buildChips(o),
  };
}

var snapC1 = {
  cls: 'shift', tag: 'C 剥离中', count: 3,
  log: '选项 C（dbcae）：剥 e（右端）、剥 d（左端）后剩 bca，暂未卡死。',
  html: '<div class="aw-row-label"><b>选项 C</b>：目标出队序列 dbcae</div>' +
        dequeRow('dbcae', { 0: 'hit', 4: 'hit' }) +
        '<div class="aw-row-label" style="margin-top:12px"><b>剥离检验</b></div>' + stripRows(OPTS[2]),
};

var snapC2 = {
  cls: 'miss', tag: 'C 不可行 ✗', count: 4,
  ribbon: { k: 3, ok: false },
  log: '选项 C：bca 里 c 夹在中间——轮到 c 入队时队里只有 a、b，c 只能落到两端，不可达。',
  html: '<div class="aw-row-label">剩余队形 <b>bca</b>：轮到 c 入队时它必须落在两端</div>' +
        dequeRow('bca', { 1: 'miss' }) +
        '<div style="font-size:14px;line-height:2;color:#213e48;margin-top:10px">' +
        '轮到 c 入队时，队里只有 a、b（队形仅 <b>ab</b> 或 <b>ba</b>），c 从左端或右端进去只能得到 ' +
        '<b>cab、abc、cba、bac</b> 四种，<b style="color:#a02830">绝无 bca</b>。<br>' +
        '把出口端换到另一侧等价于检验逆序 <b>eacbd</b>：剥 e、剥 d 后剩 acb，c 同样卡在中间。<br>' +
        '<b style="color:#e63946">✗ 选项 C 不可达。</b></div>',
};

var snaps = [{
  cls: 'step', tag: '规则', count: 0,
  html: '<div style="font-size:14.5px;line-height:2;color:#213e48">' +
        '两端都可<b>入队</b>，但只有固定一端能<b>出队</b>；a~e 全部入队后才出队。<br>' +
        '于是出队序列 = 最终队形从「出口端」的读数。<br>' +
        '判定口诀：<b style="color:#92400e">最后入队的元素必在两端之一</b>，剥掉它再查倒数第二个……逐层剥离，卡在中间即不可达。</div>',
},
okSnap(OPTS[0], 0),
okSnap(OPTS[1], 1),
snapC1,
snapC2,
okSnap(OPTS[3], 4),
{
  cls: 'done', tag: '结论', count: 6, done: true,
  log: 'A、B、D 剥离检验全通过；C 在剩 bca 时卡死 → 不可得的出队序列是 dbcae，选 C。',
  html: '<div style="font-size:15px;line-height:2;color:#213e48">' +
        'A（bacde）、B（dbace）、D（ecbad）都能由左右端交替入队构造出来；只有 C（dbcae）在剩 <b>bca</b> 时卡死——' +
        'c 入队时只能落两端，排不出中间位。<br>' +
        '不可能得到的出队序列是 <b style="color:#e63946;font-size:18px">dbcae</b>，答案选 <b style="color:#e63946;font-size:18px">C</b>。</div>',
}];

AW.init({
  title: '2010-02 · 双端入队、单端出队：判定不可能的出队序列',
  subtitle: 'a~e 依次入队（各选左/右端）· 全部入完再从固定一端出队 · 剥离检验法',
  counterLabel: '已判定选项',
  ribbonTitle: '选项（✓ 可达 / ✗ 不可达）',
  intro: '点击「▶ 播放」，用「最后入队必在两端」逐层剥离四个选项。',
  snaps: snaps,
  result: {
    big: '答案 C（dbcae）',
    html: '可达队形满足：<b>最后入队的元素必在两端之一</b>。A/B/D 逐层剥离全部通过；C 剥去 e、d 后剩 bca，而 c 入队时队内只有 a、b，只能落两端 → <b>不可达</b>。出口端固定、且必须全部入队后再出队，是本题两个前提。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
