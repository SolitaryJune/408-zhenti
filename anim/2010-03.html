<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-03 后序线索树 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 题给二叉树：a(左 b，右 c)；b 无左孩子，右孩子 d
function treeSvg(marks){
  var P = { a: [170, 36], b: [90, 116], c: [250, 116], d: [150, 196] };
  var E = [['a','b'],['a','c'],['b','d']];
  var s = '<svg width="340" height="236" style="display:block;margin:0 auto">';
  E.forEach(function(e){
    var p = P[e[0]], q = P[e[1]];
    s += '<line x1="' + p[0] + '" y1="' + p[1] + '" x2="' + q[0] + '" y2="' + q[1] + '" stroke="#94a3b8" stroke-width="2.5"/>';
  });
  for (var k in P){
    var m = marks && marks[k];
    var fill = '#fff', stroke = '#cbd5e1', txt = '#0f172a';
    if (m === 'ok'){ fill = '#dcfce7'; stroke = '#16a34a'; txt = '#14532d'; }
    else if (m === 'hit'){ fill = '#16a34a'; stroke = '#16a34a'; txt = '#fff'; }
    else if (m === 'miss'){ fill = '#fee2e2'; stroke = '#dc2626'; txt = '#b91c1c'; }
    else if (m === 'key'){ fill = '#fef3c7'; stroke = '#d97706'; txt = '#92400e'; }
    s += '<circle cx="' + P[k][0] + '" cy="' + P[k][1] + '" r="24" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.5"/>' +
         '<text x="' + P[k][0] + '" y="' + (P[k][1] + 6) + '" text-anchor="middle" font-size="17" font-weight="700" fill="' + txt + '" font-family="Menlo,Consolas,monospace">' + k + '</text>';
  }
  s += '<text x="90" y="152" text-anchor="middle" font-size="11" fill="#94a3b8">无左孩子</text>';
  s += '<text x="205" y="152" text-anchor="middle" font-size="11" fill="#94a3b8">叶</text>';
  s += '</svg>';
  return s;
}

function threadChips(list, badKey){
  var h = '<div style="margin-top:8px">';
  list.forEach(function(t){
    var isBad = badKey && t.indexOf(badKey) === 0;
    h += '<span style="display:inline-block;border-radius:8px;padding:3px 9px;margin:3px;font-size:13px;font-weight:700;' +
         (isBad ? 'background:#fee2e2;border:1.5px solid #dc2626;color:#b91c1c' : 'background:#f1f5f9;border:1.5px solid #cbd5e1;color:#334155') +
         '">' + t + '</span>';
  });
  return h + '</div>';
}

var STEPS = [
  { title: '审题眼：先写后序序列', cls: 'key',
    body: '<p>树形固定：a 的左孩子 <b>b</b>、右孩子 <b>c</b>，b 无左孩子、右孩子 <b>d</b>（虚线是待核对的线索）。考点：<b>后序线索树</b>——空指针按后序前驱/后继填。按「左→右→根」写出后序序列：<b style="font-size:16px">d, b, c, a</b>。</p>' + treeSvg(null) },
  { title: '线索规则：空指针存前驱/后继', cls: '',
    body: '<p>规则只有两条：<b>无左孩子 → 左指针存后序前驱；无右孩子 → 右指针存后序后继</b>。后序第一个结点 d 无前驱（左线索为 Null），最后一个结点 a 无后继且左右孩子均实存，不含线索。4 个结点的二叉树共有 5 个空指针 → 恰好 5 条线索。</p>' },
  { title: '逐结点求应存的线索', cls: 'good',
    body: '<p>对照后序序列 <b>d → b → c → a</b>：</p>' +
          '<ul><li><b>d</b>：左指 Null（无前驱），右指后继 <b>b</b>；</li>' +
          '<li><b>b</b>：右孩子实存，左指前驱 <b>d</b>；</li>' +
          '<li><b>c</b>：左指前驱 <b>b</b>，右指后继 <b>a</b>；</li>' +
          '<li><b>a</b>：两个孩子均实存，无线索。</li></ul>' },
  { title: '核对选项 A', cls: 'bad',
    body: '<p>A 的线索：b 的左线索指 <b>a</b>——但 b 的后序前驱是 <b>d</b>，错；c、d 之间互指（c→d、d→c）也不符合 c 的后继是 a、d 的后继是 b。</p>' +
          threadChips(['b 左线索 → a ✗', 'c 右线索 → d ✗', 'd 的线索 → c/Null ✗'], 'b 左线索') },
  { title: '核对选项 B', cls: 'bad',
    body: '<p>B 的线索：b 的左线索指 <b>Null</b>——b 明明有前驱 d，错；d 的线索指 a 也无据（d 的后继是 b）；c 的右线索指 Null，而 c 的后继是 a。</p>' +
          threadChips(['b 左线索 → Null ✗', 'd 线索 → a ✗', 'c 右线索 → Null ✗'], 'b 左线索') },
  { title: '核对选项 C', cls: 'bad',
    body: '<p>C 的线索：b 的左线索仍指 <b>a</b>（应为 d），错；c 的右线索指 <b>Null</b>（后继应是 a），错。</p>' +
          threadChips(['b 左线索 → a ✗', 'c 右线索 → Null ✗'], 'b 左线索') },
  { title: '核对选项 D：全部吻合', cls: 'good',
    body: '<p>D 的 5 条线索：b 左指 <b>d</b>（前驱）✓；c 左指 <b>b</b>（前驱）✓、右指 <b>a</b>（后继）✓；d 左指 <b>Null</b>（无前驱）✓、右指 <b>b</b>（后继）✓。与后序序列 dbca 完全一致。</p>' +
          threadChips(['b 左 → d ✓', 'c 左 → b ✓', 'c 右 → a ✓', 'd 左 → Null ✓', 'd 右 → b ✓']) },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b style="font-size:16px">D</b>。记忆锚点：<b>先写遍历序列，再让每条线索对号入座</b>；首结点无前驱、末结点无后继，线索为 Null。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010-03 · 哪个符合后序线索树的定义',
  subtitle: '树形：a（左 b 右 c），b 无左孩子、右孩子 d · 后序序列 <code>d b c a</code> · 逐项核对线索',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '后序线索 = 空指针按<b>后序前驱/后继</b>填。本题 5 条线索应为：d 左→Null、d 右→b、b 左→d、c 左→b、c 右→a。干扰项 A/B/C 都错在 <b>b 的左线索</b>（指了 a 或 Null，正确指前驱 d）。记忆锚点：先写后序序列 dbca，再对号入座。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
