<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-05 树的叶结点计数 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两张账单', cls: 'key',
    body: '<p>度为 4 的树 T：20 个度 4、10 个度 3、1 个度 2、10 个度 1 的结点，求<b>叶结点（度 0）个数</b>。核心公式只有一个：<b>所有结点的度数之和 = 边数 = 结点数 − 1</b>。</p>' },
  { title: '第一步：度数求和得边数', cls: '',
    body: '<p>每条边在双亲一侧记 1 度，所以度数总和就是边数：</p>' +
          '<p style="font-size:16px"><b>20×4 + 10×3 + 1×2 + 10×1 = 80 + 30 + 2 + 10 = <span style="color:#92400e">122</span> 条边</b></p>' },
  { title: '第二步：边数加 1 得结点数', cls: '',
    body: '<p>除根以外，每个结点头顶恰有一条来自双亲的边 → <b>结点数 = 边数 + 1 = 123</b>。</p>' },
  { title: '第三步：减去全部非叶结点', cls: '',
    body: '<p>度 1、2、3、4 的结点都不是叶子，共 20 + 10 + 1 + 10 = <b>41</b> 个；<br>' +
          '叶结点 = 123 − 41 = <b style="color:#16a34a;font-size:17px">82</b>。</p>' },
  { title: '验算：设叶结点为 x', cls: 'good',
    body: '<p>度数之和 = 结点数 − 1，即 <b>122 = (41 + x) − 1</b>，解得 <b>x = 82</b>，与上面一致。</p>' +
          '<p>这正是通式：n0（叶）= 1 + Σ(度−1)×ni = 1 + 3×20 + 2×10 + 1×1 + 0×10 = 82。</p>' },
  { title: '结论与易错对照', cls: 'good',
    body: '<p>答案选 <b style="font-size:16px">B（82 个）</b>。干扰项：41 是非叶结点数（选 A 的来源）；漏掉「边数+1」或漏减度 1 结点会凑出别的数字。</p>' +
          '<p>记忆锚点：<b>度数和 = 边数 = 结点数 − 1</b>，三个量知二求三。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010-05 · 度为 4 的树有多少叶结点',
  subtitle: '20 个度4 + 10 个度3 + 1 个度2 + 10 个度1 · 核心式 <code>度数和 = 边数 = 结点数 − 1</code>',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」按三步算出叶结点数。',
  snaps: snaps,
  result: {
    big: '82 个（答案 B）',
    html: '度数和 = 122 = 边数 → 结点数 123 → 减去 41 个非叶结点 = <b>82</b>。验算通式：n0 = 1 + Σ(度−1)×ni。易错：漏减度 1 的 10 个结点、或忘了边数要 +1（根）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
