<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-12 缩短程序执行时间的措施 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域 ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：执行时间 = 指令数 × CPI × 时钟周期', cls: 'key',
    body: '<p>程序（CPU）执行时间可拆成三个因子：<b>程序指令条数 × CPI × 时钟周期</b>。判定每项措施只需回答一个问题——<b>它压缩了哪个因子</b>？压住任何一个，执行时间都会缩短。</p>' },
  { title: '措施 I：提高 CPU 时钟频率 → 有效', cls: 'good',
    body: '<p>时钟周期 = 1 / 主频。提高时钟频率 → <b>时钟周期变短</b>；同一程序的指令数与 CPI 不变，执行时间随之缩短。<b>✔ 有效</b></p>' },
  { title: '措施 II：优化数据通路结构 → 有效', cls: 'good',
    body: '<p>数据通路是取指、译码、取数、执行、写回的"流水道路"。结构优化后每条指令所需的时钟周期数减少，即 <b>CPI 降低</b> → 执行时间缩短。<b>✔ 有效</b></p>' },
  { title: '措施 III：对程序进行编译优化 → 有效', cls: 'good',
    body: '<p>编译优化能生成更精简的指令序列：<b>指令条数减少</b>（有时还换来更低的 CPI）→ 执行时间缩短。它与硬件无关，但同样是缩短程序执行时间的措施。<b>✔ 有效</b></p>' },
  { title: '结论：三项全部有效，选 D', cls: 'good',
    body: '<p>I 管时钟周期、II 管 CPI、III 管指令条数——三个因子各被一项措施压住，<b>I、II 和 III 全部能缩短程序执行时间</b>，答案选 <b>D</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});
snaps[1].ribbon = { k: 1, ok: true };
snaps[2].ribbon = { k: 2, ok: true };
snaps[3].ribbon = { k: 3, ok: true };

AW.init({
  title: '2010-12 · 哪些措施能缩短程序执行时间',
  subtitle: '执行时间 = <code>指令数 × CPI × 时钟周期</code> · 逐项判定 I / II / III',
  counterLabel: '判定项',
  ribbonTitle: '措施（✓ 有效）',
  intro: '点击「▶ 播放」逐项判定三条措施。',
  snaps: snaps,
  result: {
    big: '答案 D（I、II 和 III）',
    html: '执行时间 = <b>指令数 × CPI × 时钟周期</b>：提高主频压缩时钟周期、优化数据通路降低 CPI、编译优化减少指令条数——三项措施各命中一个因子，全部有效。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
