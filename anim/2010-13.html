<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-13 8 位补码乘法溢出判断 · 过程动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域 ================== */
var REGS = [
  { name: 'r1', hex: 'FEH', bits: '11111110', val: '−2' },
  { name: 'r2', hex: 'F2H', bits: '11110010', val: '−14' },
  { name: 'r3', hex: '90H', bits: '10010000', val: '−112' },
  { name: 'r4', hex: 'F8H', bits: '11111000', val: '−8' },
];
var OPS = [
  { key: 'A', expr: 'r1×r2', calc: '(−2)×(−14)', val: '+28',  ovf: false },
  { key: 'B', expr: 'r2×r3', calc: '(−14)×(−112)', val: '+1568', ovf: true },
  { key: 'C', expr: 'r1×r4', calc: '(−2)×(−8)', val: '+16',  ovf: false },
  { key: 'D', expr: 'r2×r4', calc: '(−14)×(−8)', val: '+112', ovf: false },
];
var OVFBITS = '0000011000100000'.split('');   // 1568 的 16 位补码（真值形式）

var D = {};   // build 建立的持久 DOM 引用

function bitBoxes(bits, clsOf){
  var row = AW.el('div', 'aw-cells');
  bits.forEach(function(b, i){
    var col = AW.el('div', 'aw-col');
    col.appendChild(AW.el('div', 'aw-ptr', ''));
    col.appendChild(AW.el('div', 'aw-box' + (clsOf && clsOf(i) ? ' ' + clsOf(i) : ''), b));
    col.appendChild(AW.el('div', 'aw-idx', ''));
    row.appendChild(col);
  });
  return row;
}

var snaps = [
  { cls: 'step', tag: '开始', count: 0,
    log: '四个 8 位补码数两两相乘，结果放回 8 位寄存器。判据：8 位补码范围 −128 ~ +127，超出即溢出。先解码、再逐个检验。' },
  { cls: 'step', tag: '解码 r1、r2', count: 1,
    log: 'r1 = FEH = 1111 1110B，最高位 1 → 负数，真值 −2；r2 = F2H = 1111 0010B → 真值 −14。' },
  { cls: 'step', tag: '解码 r3、r4', count: 2,
    log: 'r3 = 90H = 1001 0000B → 真值 −112；r4 = F8H = 1111 1000B → 真值 −8。四个操作数全部就位。' },
  { cls: 'ok', tag: 'A 不溢出', count: 3, ribbon: { k: 1, ok: true },
    log: 'A：r1×r2 = (−2)×(−14) = +28 ≤ +127 → 在范围内，不溢出。' },
  { cls: 'miss', tag: 'B 溢出！', count: 4, ribbon: { k: 2, ok: false },
    log: 'B：r2×r3 = (−14)×(−112) = +1568 > +127 → 超出 8 位补码范围，溢出！低 8 位截断成 0010 0000B=32，与真值完全对不上。' },
  { cls: 'ok', tag: 'C 不溢出', count: 5, ribbon: { k: 3, ok: true },
    log: 'C：r1×r4 = (−2)×(−8) = +16 ≤ +127 → 不溢出。' },
  { cls: 'ok', tag: 'D 不溢出', count: 6, ribbon: { k: 4, ok: true },
    log: 'D：r2×r4 = (−14)×(−8) = +112 ≤ +127 → 临界但未超界，不溢出。' },
  { cls: 'done', tag: '完成', count: 7, done: true,
    log: '四个乘积中只有 r2×r3 = +1568 超出 −128~+127 → 会发生溢出的是 B。' },
];

AW.init({
  title: '2010-13 · 8 位补码乘法谁会溢出',
  subtitle: '<code>r1=FEH · r2=F2H · r3=90H · r4=F8H</code> · 结果存入 8 位寄存器（−128 ~ +127）',
  counterLabel: '已判定',
  ribbonTitle: '四个运算（✓ 不溢出 / ✗ 溢出）',
  intro: '点击「▶ 播放」：先解码四个操作数，再逐个检验乘积是否越界。',
  snaps: snaps,

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    inner.appendChild(AW.el('div', 'aw-row-label',
      '<b>判据：</b>8 位补码表示范围 <b style="color:#a02830">−128 ~ +127</b>，乘积超出即溢出'));

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>第一步 · 解码：</b>补码最高位是 1 即负数'));
    D.regRows = [];
    REGS.forEach(function(r){
      var row = AW.el('div', '');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;margin:4px 0';
      row.appendChild(AW.el('div', '', '<code style="background:#1b3a4b26;padding:2px 8px;border-radius:6px">' +
        r.name + ' = ' + r.hex + '</code>'));
      var boxes = bitBoxes(r.bits.split(''), function(i){ return i === 0 ? 'ok' : ''; });
      D[r.name + '_boxes'] = boxes;
      row.appendChild(boxes);
      var vt = AW.el('div', '', '→ 真值 <b style="color:#1b3a4b">' + r.val + '</b>');
      row.appendChild(vt);
      inner.appendChild(row);
      D.regRows.push(row);
    });

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>第二步 · 逐个检验乘积：</b>'));
    D.opRows = [];
    OPS.forEach(function(o){
      var row = AW.el('div', 'aw-stepcard');
      row.style.cssText = 'padding:9px 14px;margin:6px 0;transition:opacity .25s,border-color .25s';
      row.innerHTML = '<b>' + o.key + '．' + o.expr + '</b> = ' + o.calc +
        ' = <b style="color:' + (o.ovf ? '#e63946' : '#2f9e44') + '">' + o.val + '</b>';
      inner.appendChild(row);
      D.opRows.push(row);
    });

    D.ovf = AW.el('div', '');
    inner.appendChild(D.ovf);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    // 解码行：i=0 全部半透明；i=1 点亮 r1/r2；i≥2 全部点亮
    D.regRows.forEach(function(row, k){
      row.style.opacity = (i === 0 || (i === 1 && k >= 2)) ? '0.35' : '1';
    });
    // 运算行：判定后加 good/bad 边框，未判定半透明
    D.opRows.forEach(function(row, k){
      var judged = i >= 3 + k;
      row.style.opacity = judged ? '1' : '0.35';
      row.className = 'aw-stepcard' + (judged ? (OPS[k].ovf ? ' bad' : ' good') : '');
    });
    // B 的溢出展示：i≥4 显示 16 位真值与被截断的低 8 位
    if (i >= 4){
      var low8 = OVFBITS.map(function(b, k){ return k >= 8 ? b : ''; });
      D.ovf.innerHTML = '';
      var t = AW.el('div', 'aw-row-label', 'B 的乘积 1568 的 16 位表示（红框 = 被保留的低 8 位，高 8 位被丢弃）');
      D.ovf.appendChild(t);
      var tr = bitBoxes(OVFBITS, function(k){ return k >= 8 ? 'miss' : 'dim'; });
      D.ovf.appendChild(tr);
    } else {
      D.ovf.innerHTML = '';
    }
  },

  result: {
    big: '答案 B（r2×r3 = +1568 溢出）',
    html: '8 位补码范围 <b>−128 ~ +127</b>：A = +28、C = +16、D = +112 都在范围内；只有 <b>r2×r3 = (−14)×(−112) = +1568 &gt; +127</b> 溢出。记忆锚点：<b>负负相乘得大正数，最容易越界</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
