<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-18 程序员可见的寄存器 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域 ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：什么叫"程序员可见"', cls: 'key',
    body: '<p>可见 = 汇编程序能<b>直接或间接地使用/影响</b>该寄存器：能编程改变它、能感知它的变化、它影响程序流程。一句话判据：<b>程序里"摸得到"的才可见</b>。</p>' },
  { title: 'A：MAR → 不可见', cls: 'bad',
    body: '<p>存储器地址寄存器：CPU 访存时由<b>硬件自动装入</b>要访问的地址，指令系统里没有任何指令能读写它 → 对程序员<b>透明</b>。</p>' },
  { title: 'B：PC → 可见 ✔', cls: 'good',
    body: '<p>程序计数器：执行<b>转移、调用、返回</b>指令时 PC 被赋为目标地址，取下一条指令也按 PC 进行——程序员正是通过这些指令"操纵"PC 来控制程序流向 → <b>可见</b>。</p>' },
  { title: 'C：MDR → 不可见', cls: 'bad',
    body: '<p>存储器数据寄存器：写主存时硬件把数据放进它、读主存时它暂存读出的数据，全部<b>自动完成</b>，无指令可访问 → 透明。</p>' },
  { title: 'D：IR → 不可见', cls: 'bad',
    body: '<p>指令寄存器：取指周期由硬件自动装入<b>当前正在执行的指令</b>，程序员既读不到也写不了 → 透明。（"能看到指令内容"是反汇编层面的事，不是指令系统的能力。）</p>' },
  { title: '结论：只有 PC 可见，选 B', cls: 'good',
    body: '<p>四个寄存器里只有 <b>PC</b> 会被转移类指令改写、能被程序员感知与控制；MAR、MDR、IR 都是 CPU 内部工作寄存器 → 答案选 <b>B</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});
snaps[1].ribbon = { k: 1, ok: false };
snaps[2].ribbon = { k: 2, ok: true };
snaps[3].ribbon = { k: 3, ok: false };
snaps[4].ribbon = { k: 4, ok: false };

AW.init({
  title: '2010-18 · 汇编程序员可见的寄存器',
  subtitle: 'MAR / PC / MDR / IR —— 谁是程序"摸得到"的',
  counterLabel: '判定项',
  ribbonTitle: '选项（✓ 可见 / ✗ 透明）',
  intro: '点击「▶ 播放」逐项检验四个寄存器。',
  snaps: snaps,
  result: {
    big: '答案 B（程序计数器 PC）',
    html: '判据：程序能否<b>编程改变/感知</b>。转移、调用、返回指令都在改写 <b>PC</b> → 可见；MAR、MDR、IR 由硬件自动装入使用、无指令可访问 → 透明。记忆锚点：<b>可见的只有 PC、通用寄存器、条件码等；内部工作寄存器一律透明</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
