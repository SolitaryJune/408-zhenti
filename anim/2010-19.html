<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-19 流水线阻塞来源辨析 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域 ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：分清"病"与"药"', cls: 'key',
    body: '<p>流水线阻塞 = 必须暂停等待、插入"气泡"。三大阻塞源：<b>数据相关</b>（数据冒险）、<b>条件转移</b>（控制冒险）、<b>资源冲突</b>（结构冒险）。题目问的是<b>不会</b>引起阻塞的那一项。</p>' },
  { title: 'A：数据旁路（转发）→ 不阻塞 ✔', cls: 'good',
    body: '<p>旁路/转发不是冒险，而是<b>解决数据相关的技术</b>：把上一条指令 ALU 的结果直接从段间送到下一条指令的输入端，免去"等写回再读"的停顿 → 它<b>减少</b>阻塞而非制造阻塞。</p>' },
  { title: 'B：数据相关 → 阻塞 ✘', cls: 'bad',
    body: '<p>后条指令要用前条尚未写回的结果，硬件若不处理只能<b>暂停等待</b>（或靠旁路缓解）→ 会引起阻塞。</p>' },
  { title: 'C：条件转移 → 阻塞 ✘', cls: 'bad',
    body: '<p>转移方向在执行段才能确定，此前<b>预取的后续指令可能全部作废</b>，要清空流水线重新取指（控制冒险）→ 会引起阻塞。</p>' },
  { title: 'D：资源冲突 → 阻塞 ✘', cls: 'bad',
    body: '<p>多条指令同时<b>争用同一部件</b>（如存储器、除法器），结构冒险只能排队 → 会引起阻塞。</p>' },
  { title: '结论：不会引起阻塞的是 A', cls: 'good',
    body: '<p>B、C、D 恰是三大冒险；A（旁路/转发）是<b>对付数据冒险的手段</b>，本身不产生停顿 → 答案选 <b>A</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});
snaps[1].ribbon = { k: 1, ok: true };
snaps[2].ribbon = { k: 2, ok: false };
snaps[3].ribbon = { k: 3, ok: false };
snaps[4].ribbon = { k: 4, ok: false };

AW.init({
  title: '2010-19 · 什么会引起指令流水线阻塞',
  subtitle: '三大冒险 vs 一味"药" · 逐项判定',
  counterLabel: '判定项',
  ribbonTitle: '选项（✓ 不阻塞 / ✗ 阻塞）',
  intro: '点击「▶ 播放」逐项判定 A~D。',
  snaps: snaps,
  result: {
    big: '答案 A（数据旁路/转发）',
    html: '三大阻塞源：<b>数据相关、条件转移、资源冲突</b>（数据/控制/结构冒险）。数据旁路（转发）是<b>解决数据相关的技术</b>——把结果直接送进下一条指令的输入端，减少停顿，本身不阻塞。记忆锚点：<b>旁路是药，相关是病</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
