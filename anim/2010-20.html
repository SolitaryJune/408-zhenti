<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-20 识别总线标准缩写 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域 ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先立"成员库"再排除', cls: 'key',
    body: '<p>常见总线标准：<b>ISA、EISA、VESA、PCI、PCI-Express、USB、SCSI、AGP</b>。先记住这串"正经总线"，再把每个选项里的"混入者"揪出来。</p>' },
  { title: 'A：PCI、CRT、USB、EISA → 排除', cls: 'bad',
    body: '<p>PCI ✓、USB ✓、EISA ✓，但 <b>CRT</b> 是阴极射线管<b>显示器</b>（I/O 设备），不是总线 → <b>A 出局</b>。</p>' },
  { title: 'B：ISA、CPI、VESA、EISA → 排除', cls: 'bad',
    body: '<p>ISA ✓、VESA ✓、EISA ✓，但 <b>CPI</b> 是每条指令时钟周期数（<b>性能指标</b>），不是总线 → <b>B 出局</b>。</p>' },
  { title: 'C：ISA、SCSI、RAM、MIPS → 排除', cls: 'bad',
    body: '<p>ISA ✓、SCSI ✓（总线/接口标准），但 <b>RAM</b> 是存储器件、<b>MIPS</b> 是每秒百万条指令（性能指标）→ <b>C 出局</b>。</p>' },
  { title: 'D：ISA、EISA、PCI、PCI-Express → 全中', cls: 'good',
    body: '<p>ISA（工业标准总线）→ EISA（扩展 ISA）→ PCI（外围部件互连）→ PCI-Express（PCI 的串行演进版），<b>四个全部是总线标准</b> → <b>✔ 正确</b>。</p>' },
  { title: '结论：答案选 D', cls: 'good',
    body: '<p>A、B、C 各藏一个"冒牌货"（CRT 显示器 / CPI 指标 / RAM+MIPS），只有 <b>D</b> 是清一色总线标准 → 答案选 <b>D</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});
snaps[1].ribbon = { k: 1, ok: false };
snaps[2].ribbon = { k: 2, ok: false };
snaps[3].ribbon = { k: 3, ok: false };
snaps[4].ribbon = { k: 4, ok: true };

AW.init({
  title: '2010-20 · 哪一组全是总线标准',
  subtitle: 'ISA / EISA / PCI / PCI-Express / USB / SCSI / VESA vs 冒牌货',
  counterLabel: '判定项',
  ribbonTitle: '选项（✓ 全是总线 / ✗ 有混入者）',
  intro: '点击「▶ 播放」逐项排除。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '总线标准记忆线：<b>ISA → EISA → VESA → PCI → PCI-Express</b>，外加 USB、SCSI、AGP。冒牌货对号入座：<b>CRT</b>=显示器、<b>CPI/MIPS</b>=性能指标、<b>RAM</b>=存储器。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
