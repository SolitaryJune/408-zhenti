<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-24 导致创建新进程的操作</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     概念/推理链类动画（复制 tools/anim_concept_template.html，只改 AW.init 区域）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链
var STEPS = [
  { title: '审题眼：创建进程的判断标准',
    cls: 'key',
    body: '<p>创建进程 = 让一段程序从"静态"变成"动态"执行（建 PCB、分配资源）。教材归纳的典型时机：<b>用户登录、作业调度、提供服务、应用请求</b>。逐项对照题干三个事件。</p>' },
  { title: 'I. 用户登录成功 → 会创建',
    cls: 'good',
    body: '<p><b>对</b>。登录成功后系统要为该用户建立会话/服务进程，正是"用户登录"这一典型时机。若登录不成功则不创建，验证通过才建。</p>' },
  { title: 'II. 设备分配 → 不会创建',
    cls: 'bad',
    body: '<p><b>错</b>。分配设备只是把资源交给<b>已存在的进程</b>使用，资源分配不产生新的程序执行流。这是最强的干扰项："分配资源"≠"创建进程"。</p>' },
  { title: 'III. 启动程序执行 → 会创建',
    cls: 'good',
    body: '<p><b>对</b>。程序是静态文件，启动执行必须先创建进程（建 PCB、分配内存等），属于"作业调度/应用请求"时机。</p>' },
  { title: '组合与排错',
    cls: 'key',
    body: '<p>会创建的是 <b>I 和 III</b> → 选 C。若误把"设备分配"也算上就落进 D；若漏掉"用户登录"就落进 B——两个干扰恰好对应两种典型错误。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C（仅 I 和 III）</b>。记忆锚点：<b>登录、调度、服务、应用请求会建进程；分配资源不建进程</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010·24 哪些操作会创建新进程',
  subtitle: '考点：进程的创建时机 · I 登录 / II 设备分配 / III 启动程序',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：<b>用户登录成功、启动程序执行都会创建新进程；设备分配只是资源分配，不创建进程</b>。错误组合：多算 II → D，漏算 I → B。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
