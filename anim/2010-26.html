<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-26 降低进程优先级的合理时机</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/推理链类动画（复制 tools/anim_concept_template.html，只改 AW.init 区域）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链
var STEPS = [
  { title: '审题眼：动态优先级的方向口诀',
    cls: 'key',
    body: '<p>调整优先级是为了公平与效率：<b>刚消耗完 CPU 的人应让位（降）</b>，久等的人应补偿（升），刚做完 I/O 的人应奖励（升）。带着口诀逐项验证。</p>' },
  { title: '选项 A：时间片用完',
    cls: 'good',
    body: '<p><b>对</b>。该进程刚独占 CPU 跑满一个时间片，若不降级，它可能立刻再次抢占 CPU，别人一直干等。此时降低优先级正是"降低"的合理时机。</p>' },
  { title: '选项 B：刚完成 I/O 进入就绪队列',
    cls: 'bad',
    body: '<p><b>错</b>，方向反了。I/O 型进程刚交出 CPU 去等设备，回来后应<b>提高</b>优先级让它尽快处理下一批 I/O，提升设备与 CPU 的并行度。</p>' },
  { title: '选项 C：长期处于就绪队列中',
    cls: 'bad',
    body: '<p><b>错</b>，方向也反了。这是"饥饿"的前兆，应当<b>提高</b>优先级（老化 aging 策略）补偿它，而不是雪上加霜再降级。</p>' },
  { title: '选项 D：从就绪转为运行',
    cls: 'bad',
    body: '<p><b>错</b>。刚被调度器选中上台，说明它当前优先级够高，与降级无关；降级应发生在它<b>放弃</b> CPU（如时间片用完）时。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A（进程的时间片用完）</b>。记忆锚点：<b>用完时间片 → 降；做完 I/O、久等未运行 → 升</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010·26 降低进程优先级的合理时机',
  subtitle: '考点：CPU 调度（动态优先级）· 四个时机逐项判断',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '记忆锚点：<b>时间片用完 → 降级</b>；刚完成 I/O → 升级（奖励 I/O 型进程）；长期在就绪队列 → 升级（防饥饿）；就绪转运行 → 与降级无关。B、C 是"升"的时机，D 是"上台"的瞬间。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
