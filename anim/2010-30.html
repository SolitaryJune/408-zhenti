<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-30 混合索引的最大文件长度</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     概念/纯计算推理类动画（复制 tools/anim_concept_template.html，只改 AW.init 区域）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链
var STEPS = [
  { title: '审题眼：先算基数 64',
    cls: 'key',
    body: '<p>磁盘索引块与数据块均为 <code>256B</code>，地址项 <code>4B</code> → 一个索引块能容纳 <code>256 ÷ 4 = 64</code> 个地址项。这个 <b>64</b> 是所有间接层数的基数。</p>' },
  { title: '直接地址：4 块',
    cls: 'step',
    body: '<p>4 个直接地址项直接指向数据块 → 直接索引能表示 <b>4 个数据块</b>。</p>' },
  { title: '一级间接：2 × 64 = 128 块',
    cls: 'step',
    body: '<p>每个一级间接地址项指向一个<b>索引块</b>，索引块内 64 个地址项再各指向一个数据块 → 每项管 64 块，2 项共 <b>128 个数据块</b>（乘一次 64）。</p>' },
  { title: '二级间接：1 × 64 × 64 = 4096 块',
    cls: 'step',
    body: '<p>二级间接地址项 → 第一级索引块（64 项）→ 第二级索引块（各 64 项）→ 数据块 → <code>64 × 64 = 4096</code> 个数据块（<b>连乘两次 64</b>）。</p>' },
  { title: '合计并换算单位',
    cls: 'good',
    body: '<p>总数据块 = 4 + 128 + 4096 = <b>4228 块</b>；最大文件 = 4228 × 256B = 1082368B ÷ 1024 = <b>1057KB</b>。对照：A（33KB）= 漏掉二级间接只算 132 块。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C（1057KB）</b>。记忆锚点：<b>一级乘一次 64，二级乘两次 64；最后除 1024 化 KB</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010·30 混合索引：单个文件最大长度',
  subtitle: '考点：文件系统（索引结点）· 4 直接 + 2 一级间接 + 1 二级间接 · 块 256B · 地址项 4B',
  intro: '点击「▶ 播放」逐步展开计算推理链。',
  snaps: snaps,
  result: {
    big: '答案 C（1057KB）',
    html: '计算链：<b>64</b>（256÷4）→ 直接 <b>4</b> + 一级 <b>128</b> + 二级 <b>4096</b> = <b>4228 块</b> → × 256B ÷ 1024 = <b>1057KB</b>。干扰项 A 是漏了二级间接（33KB），B、D 是间接层数乘错。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
