<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-31 设置当前工作目录的主要目的</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/推理链类动画（复制 tools/anim_concept_template.html，只改 AW.init 区域）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链
var STEPS = [
  { title: '审题眼：检索是怎么发生的',
    cls: 'key',
    body: '<p>按名存取：用户给出路径名，系统必须沿目录结构<b>逐级查找目录项</b>，才能定位文件的 FCB/索引结点。开销就在"找目录"这一段。</p>' },
  { title: '没有当前目录：每次从根找起',
    cls: 'bad',
    body: '<p>走绝对路径 <code>/usr/chen/report.txt</code>，每次都要从<b>根目录</b>开始逐级查下来，路径越长开销越大——大量重复检索。</p>' },
  { title: '设当前目录：相对路径直达',
    cls: 'good',
    body: '<p>把常用目录设为<b>当前工作目录</b>后用<b>相对路径</b>访问：检索从当前目录出发，省掉"根目录 → 当前目录"那一大段逐级查找 → <b>目录检索开销明显下降，检索速度加快</b>。</p>' },
  { title: '排除 A / B：与空间无关',
    cls: 'bad',
    body: '<p>当前目录只是检索的"起点约定"，不减少目录文件本身的存储——<b>外存空间（A）与内存空间（B）都不会因此节省</b>。</p>' },
  { title: '排除 D：检索 ≠ 读写',
    cls: 'bad',
    body: '<p>读写速度取决于磁盘性能与缓冲策略；目录机制改变的只是"找到文件"的过程，不是"读写数据块"的过程。<b>找到快 ≠ 读写快</b>——D 是最强干扰项。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C（加快文件的检索速度）</b>。记忆锚点：<b>当前目录 = 相对路径的起点，省的是目录检索的时间</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010·31 设置当前工作目录的主要目的',
  subtitle: '考点：目录管理 · 检索 / 空间 / 读写四个方向逐项辨析',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：<b>当前目录让相对路径检索跳过"根 → 当前目录"的逐级查找，加快的是文件的检索速度</b>。A/B 谈空间、D 谈读写数据，都不被当前目录机制改变。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
