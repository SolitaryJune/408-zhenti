<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-33 · 网络体系结构描述的内容</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     概念/分析类：网络体系结构三要素逐项辨析
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：找"不属于"的那一项',
    cls: 'key',
    body: '<p>网络<b>体系结构</b>是计算机网络各层次及其协议的集合，只回答三件事：<b>分哪些层</b>、<b>每层用什么协议</b>、<b>每层完成什么功能</b>（以及层间接口）。它是抽象的<b>功能定义</b>——只说"做什么"，不说"怎么做"。</p>' },
  { title: '逐项分析 A：网络的层次',
    cls: '',
    body: '<p>A 网络的层次：<b>属于</b>。"分成哪几层"正是体系结构的第一要素，分层结构是它的骨架。</p>' },
  { title: '逐项分析 B：每层使用的协议',
    cls: '',
    body: '<p>B 每层使用的协议：<b>属于</b>。体系结构明确规定每个层次所使用的协议，"各层及其协议的集合"就是定义本身。</p>' },
  { title: '逐项分析 C：协议的内部实现细节',
    cls: 'good',
    body: '<p>C 协议的内部实现细节：<b>不属于</b> ✓。协议内部用什么算法、用软件还是硬件去实现，是具体的工程实现问题；体系结构只做抽象的功能定义，<b>不规定实现细节</b>。</p>' },
  { title: '逐项分析 D：每层必须完成的功能',
    cls: '',
    body: '<p>D 每层必须完成的功能：<b>属于</b>。每层"做什么"、功能边界划在哪，恰恰是体系结构要定义的核心内容。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>不属于体系结构所描述内容的是 <b>C：协议的内部实现细节</b>。记忆锚点：体系结构 = <b>层次 + 协议 + 功能</b>，全是"做什么"；"怎么做"是实现的事，不在其列。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010-33 · 网络体系结构描述的内容',
  subtitle: '考点：体系结构 = 层次 + 每层协议 + 每层功能 · 选项逐项推演',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：网络体系结构只描述<b>层次、每层协议、每层功能</b>这些"做什么"的内容；协议的<b>内部实现细节</b>不属于体系结构的描述范围。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
