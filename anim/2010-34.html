<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-34 · 存储转发分组交换总时延</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     算法/过程类：分组交换流水线时序推演（H1→R1→R2→H2）
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2010-34 · 存储转发分组交换总时延',
  subtitle: '文件 980000B · 分组 1000B（头 20B）· 链路 100Mbps · 路径 H1→R1→R2→H2 共 3 段链路 · 不计传播时延',
  counterLabel: '时延槽',
  ribbonTitle: '时间槽（✓ 推进）',
  intro: '点击「▶ 播放」观察分组在 4 个节点间的流水线推进。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>图例</b>：每格 = 一个发送时延槽 0.08ms · 数字 = 分组编号 · 亮绿 = 本槽动作'));
    var head = AW.el('div', '');
    head.style.cssText = 'display:flex;align-items:flex-end;margin:6px 0 2px;';
    var hlab = AW.el('div', '', '<span style="font-size:12px;color:#586e72">节点</span>');
    hlab.style.cssText = 'width:118px;flex:0 0 auto;text-align:center;';
    head.appendChild(hlab);
    for(var s = 1; s <= 6; s++){
      var h = AW.el('div', '', '<div style="width:44px;text-align:center;font-size:11.5px;color:#586e72">槽' + s + '</div>');
      head.appendChild(h);
    }
    inner.appendChild(head);
    var defs = [
      ['H1', '主机甲 · 发送', 0],
      ['R1', '路由器1 · 存储-转发', 1],
      ['R2', '路由器2 · 存储-转发', 2],
      ['H2', '主机乙 · 接收完成', 2],
    ];
    this._rows = [];
    this._offs = [];
    for(var r = 0; r < 4; r++){
      var line = AW.el('div', '');
      line.style.cssText = 'display:flex;align-items:center;margin:6px 0;';
      var lab = AW.el('div', '', '<b style="font-size:13px;color:#213e48">' + defs[r][0] + '</b><br><span style="font-size:10.5px;color:#b9cbd0">' + defs[r][1] + '</span>');
      lab.style.cssText = 'width:118px;flex:0 0 auto;line-height:1.3;';
      line.appendChild(lab);
      var cells = AW.el('div', 'aw-cells');
      var arr = [];
      for(var c = 0; c < 6; c++){
        var box = AW.el('div', 'aw-box', '');
        cells.appendChild(box);
        arr.push(box);
      }
      line.appendChild(cells);
      inner.appendChild(line);
      this._rows.push(arr);
      this._offs.push(defs[r][2]);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'初始', count:0, slot:0,
      log:'题干参数：文件 980000B；分组 1000B，其中头部 20B；链路速率 100Mbps；路径 H1→R1→R2→H2 共 3 段链路；忽略传播时延与分组拆装时间。' },
    { cls:'step', tag:'拆分组', count:1, slot:0,
      log:'每组净载荷 = 1000 − 20 = 980B；分组数 = 980000 ÷ 980 = 1000 组。' },
    { cls:'step', tag:'单组发送时延', count:2, slot:0,
      log:'发送一个分组需 1000 × 8 ÷ 100Mbps = 80μs = 0.08ms。下面每个格子就代表一个 0.08ms 的时间槽。' },
    { cls:'step', tag:'槽1', count:3, slot:1,
      log:'0~0.08ms：H1 发送第 1 组。R1 还没收到完整分组，只能先存储——存储转发必须整组收完才能转发。' },
    { cls:'step', tag:'槽2', count:4, slot:2,
      log:'H1 发第 2 组；R1 收完第 1 组并开始转发。两条链路并行工作，这就是流水线。' },
    { cls:'step', tag:'槽3', count:5, slot:3,
      log:'H1 发第 3 组，R1 转发第 2 组，R2 转发第 1 组；槽 3 末（0.24ms）第 1 组到达 H2。' },
    { cls:'step', tag:'槽4~5', count:6, slot:5,
      log:'流水线稳定运转：H1、R1、R2、H2 各忙各的，此后每隔 0.08ms 就有一组到达 H2。' },
    { cls:'ok', tag:'找规律', count:7, slot:5, dimAll:true,
      log:'通项：H2 收完第 k 组的时刻 = (k + 2) × 0.08ms。验证：k=1 → 3 × 0.08 = 0.24ms ✓。' },
    { cls:'ok', tag:'代入 k=1000', count:8, slot:5,
      log:'第 1000 组收完时刻 = (1000 + 2) × 0.08ms = 80.16ms，即从 H1 开始发送到 H2 接收完为止至少需要 80.16ms。' },
    { cls:'done', tag:'完成', count:9, slot:5, done:true,
      log:'结论：80.16ms，选 C。干扰项：80ms 只算了 H1 发完 1000 组；80.24ms 把链路多算了一段。' },
  ],

  render: function(stage, sn){
    var slot = sn.slot || 0;
    for(var r = 0; r < 4; r++){
      for(var s = 1; s <= 6; s++){
        var box = this._rows[r][s - 1];
        var off = this._offs[r];
        var g = s - off;
        if(slot === 0 || sn.dimAll){
          box.innerHTML = '';
          box.className = 'aw-box dim';
        } else if(g >= 1 && s <= slot){
          box.innerHTML = String(g);
          box.className = 'aw-box' + (s === slot ? ' hit' : ' ok');
        } else {
          box.innerHTML = '';
          box.className = 'aw-box';
        }
      }
    }
  },

  result: {
    big: '80.16ms（选 C）',
    html: '总时延 = (分组数 + 链路数 − 1) × 单分组发送时延 = (1000 + 3 − 1) × 0.08ms = <b>80.16ms</b>。首组要走完 3 段链路（3 × 0.08ms），此后每 0.08ms 到达一组。先算净载荷 980B 得出 1000 组是第一步。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
