<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-36 · 拥塞丢包对应的 ICMP 报文</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     概念/分析类：ICMP 差错报告报文适用场景辨析
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：拥塞 → 丢包 → 通知谁',
    cls: 'key',
    body: '<p>场景：路由器 R 因为<b>拥塞</b>（缓冲区装不下）丢弃了 IP 分组，要向<b>源主机</b>发一个 ICMP 差错报告报文。考点：五种 ICMP 差错报文各自管什么异常。</p>' },
  { title: 'ICMP 差错报告报文家族',
    cls: '',
    body: '<ul><li><b>终点不可达</b>：分组根本无法交付（无路由、协议不可达等）</li><li><b>源点抑制</b>：因拥塞丢弃分组，劝源主机减速</li><li><b>时间超过</b>：TTL 减为 0，或分片重组超时</li><li><b>参数问题</b>：头部字段有错</li><li><b>改变路由（重定向）</b>：主机把分组交给了非最优路由器</li></ul>' },
  { title: '逐项分析 A：路由重定向',
    cls: 'bad',
    body: '<p>A 路由重定向：用于主机<b>选错了路由器</b>（走了非最优路径）的场合，路由器告诉主机"下次从更好的路由器走"。与"拥塞"无关。✗</p>' },
  { title: '逐项分析 B：目的不可达',
    cls: 'bad',
    body: '<p>B 目的不可达：指分组<b>根本无法交付</b>（找不到路由、端口不可达等）。拥塞丢弃是"路是通的但太挤"，不是"无路可走"。✗</p>' },
  { title: '逐项分析 C：源点抑制',
    cls: 'good',
    body: '<p>C 源点抑制：<b>对</b> ✓。专门用于拥塞场景——路由器缓冲区耗尽、被迫丢弃分组时，向源主机发送源点抑制报文，让源主机<b>放慢发送速率</b>以缓解拥塞。</p>' },
  { title: '逐项分析 D：超时',
    cls: 'bad',
    body: '<p>D 超时：TTL 减到 0（防止分组在网络里无限兜圈），或分片在重组时限内没凑齐才发送，与拥塞无关。✗</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>拥塞丢包 → 发送<b>源点抑制</b>报文，答案选 <b>C</b>。记忆锚点：<b>拥塞劝减速 = 源点抑制</b>；无路可走 = 终点不可达；TTL 归零 = 超时；选错路由器 = 重定向。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010-36 · 拥塞丢包对应的 ICMP 报文',
  subtitle: '考点：ICMP 差错报告报文的适用场景 · 选项逐项推演',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：拥塞丢包 → <b>源点抑制</b>（劝源主机减速）；终点不可达是"无路可走"；超时是 TTL 归零或重组超时；重定向是"你选错路由器了"。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
