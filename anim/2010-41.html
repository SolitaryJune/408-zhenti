<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-41 散列表构造与 ASL · 动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var LEN = 10;
var KEYS = [
  { k: 7,  h: 0, path: [0] },
  { k: 8,  h: 3, path: [3] },
  { k: 30, h: 6, path: [6] },
  { k: 11, h: 5, path: [5] },
  { k: 18, h: 5, path: [5, 6, 7], conflict: '5(11)、6(30) 被占' },
  { k: 9,  h: 6, path: [6, 7, 8], conflict: '6(30)、7(18) 被占' },
  { k: 14, h: 0, path: [0, 1],    conflict: '0(7) 被占' },
];

function hashHtml(ht, marks, noteHtml, titleHtml){
  var h = '';
  if (titleHtml) h += '<div class="aw-row-label">' + titleHtml + '</div>';
  h += '<div class="aw-cells" style="gap:6px">';
  for (var i = 0; i < LEN; i++){
    var cls = marks && marks[i] ? ' ' + marks[i] : '';
    h += '<div class="aw-col"><div class="aw-ptr"></div>' +
         '<div class="aw-box' + cls + '" style="width:52px;height:52px;font-size:16px">' +
         (ht[i] == null ? '' : ht[i]) + '</div>' +
         '<div class="aw-idx">' + i + '</div></div>';
  }
  h += '</div>';
  if (noteHtml) h += '<div class="aw-row-label" style="margin-top:10px">' + noteHtml + '</div>';
  return h;
}

function chips(pairs, color){
  var h = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">';
  pairs.forEach(function(p){
    h += '<div style="background:' + (color || '#f6fef9') + ';border:1.5px solid #16a34a;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;color:#14532d">' +
         p[0] + ' → ' + p[1] + ' 次</div>';
  });
  return h + '</div>';
}

// 构建 7 步插入 snaps
var ht = [];
for (var i0 = 0; i0 < LEN; i0++) ht.push(null);

var insertSnaps = KEYS.map(function(it, j){
  var marks = {};
  for (var p = 0; p < it.path.length - 1; p++) marks[it.path[p]] = 'miss';
  marks[it.path[it.path.length - 1]] = 'hit';
  ht[it.path[it.path.length - 1]] = it.k;
  var times = it.path.length;
  var log = '插入 ' + it.k + '：H(' + it.k + ') = (' + it.k + '×3) mod 7 = ' + it.h;
  log += it.conflict ? '，' + it.conflict + ' → 探到 ' + it.path[it.path.length - 1] + ' 号为空，落位，探测 ' + times + ' 次。'
                     : '，' + it.h + ' 号为空 → 直接落位，探测 1 次。';
  return {
    cls: it.conflict ? 'miss' : 'ok',
    tag: it.conflict ? '冲突·探测' : '直接插入',
    count: j + 1,
    ribbon: { k: j + 1, ok: true },
    log: log,
    html: hashHtml(ht, marks,
      '已插入 ' + (j + 1) + ' / 7 个关键字；本次探测 <b>' + times + '</b> 次（查找成功时的比较次数）。',
      '<b>散列表</b>（表长 10，线性探测：冲突就从散列地址逐格向后找空位）'),
  };
});

// 完整表（重放）
var htFull = [];
for (var i1 = 0; i1 < LEN; i1++) htFull.push(null);
KEYS.forEach(function(it){ htFull[it.path[it.path.length - 1]] = it.k; });

var successSnap = {
  cls: 'step', tag: '第 1 问完成', count: 8, ribbon: { k: 8, ok: true },
  log: '散列表构造完成。查找成功比较次数 = 各关键字插入探测次数，合计 12，ASL 成功 = 12/7。',
  html: hashHtml(htFull, null,
    chips([['7', 1], ['8', 1], ['30', 1], ['11', 1], ['18', 3], ['9', 3], ['14', 2]]) +
    '<div style="font-size:15px;line-height:2;margin-top:6px">合计 1+1+1+1+3+3+2 = <b>12</b>，7 个关键字等概率：<br>' +
    '<b style="font-size:17px;color:#16a34a">ASL成功 = 12 ÷ 7 = 12/7</b></div>',
    '<b>第 1 问答案</b>（下标 0~9：7、14、空、8、空、11、30、18、9、空）'),
};

var failChips = [['H=0', 3], ['H=1', 2], ['H=2', 1], ['H=3', 2], ['H=4', 1], ['H=5', 5], ['H=6', 4]];
var failSnap = {
  cls: 'step', tag: '第 2 问·失败探查', count: 9, ribbon: { k: 9, ok: true },
  log: '失败从 7 个散列地址出发，逐格探到第一个空单元：H=5 最惨，5→6→7→8→9 空，共 5 次。',
  html: hashHtml(htFull, { 5: 'ok', 6: 'ok', 7: 'ok', 8: 'ok', 9: 'miss' },
    chips(failChips, '#fff7f7') +
    '<div style="font-size:14px;line-height:2;margin-top:6px">失败入口只有 <b>H(key) = 0~6 这 7 个地址</b>（分母是<b>模数 7</b>，不是表长 10）。<br>' +
    '示意：从 H=5 出发 → 5(11)、6(30)、7(18)、8(9) 全占 → 9 号为空才判失败，共 <b style="color:#b91c1c">5 次</b>。</div>',
    '<b>查找失败</b>：从散列地址出发，探到第一个空单元为止'),
};

var doneSnap = {
  cls: 'done', tag: '结论', count: 10, done: true, ribbon: { k: 10, ok: true },
  log: 'ASL 成功 = 12/7，ASL 不成功 = 18/7。',
  html: hashHtml(htFull, null,
    '<div style="font-size:15.5px;line-height:2.1">' +
    '查找成功：1+1+1+1+3+3+2 = 12，除以 7 个关键字 → <b style="color:#16a34a;font-size:18px">ASL成功 = 12/7</b><br>' +
    '查找不成功：3+2+1+2+1+5+4 = 18，除以 7 个散列地址 → <b style="color:#dc2626;font-size:18px">ASL不成功 = 18/7</b><br>' +
    '<span style="font-size:13.5px;color:#64748b">两个分母含义不同：成功按关键字个数（7），失败按模数 7 的地址数。</span></div>',
    '<b>第 2 问答案</b>'),
};

var snaps = [{
  cls: 'step', tag: '开工前', count: 0,
  html: hashHtml([], null,
    '<div style="font-size:14.5px;line-height:2;color:#334155">' +
    '装填因子 = 元素数 ÷ 表长：<b>0.7 = 7 ÷ 表长 → 表长 10</b>（下标 0~9）。<br>' +
    '散列函数 <b>H(key) = (key×3) mod 7</b>，散列地址 0~6；冲突用<b>线性探测</b>逐格向后找空位。<br>' +
    '依次插入：7, 8, 30, 11, 18, 9, 14。</div>',
    '<b>散列表</b>（表长 10，全空）'),
}].concat(insertSnaps).concat([successSnap, failSnap, doneSnap]);

AW.init({
  title: '2010-41 · 散列表构造与两种 ASL',
  subtitle: 'H(key) = (key×3) mod 7 · 线性探测 · 装填因子 0.7 → 表长 10 · 关键字 7, 8, 30, 11, 18, 9, 14',
  counterLabel: '已插入关键字',
  ribbonTitle: '关键字序号（✓ 已插入 / 完成）',
  intro: '点击「▶ 播放」逐个插入关键字，再分别统计成功与失败的 ASL。',
  snaps: snaps,
  result: {
    big: '成功 12/7 · 失败 18/7',
    html: '表长 10；落位 0=7、1=14、3=8、5=11、6=30、7=18、8=9。成功比较 = 插入探测次数，共 <b>12</b>，ASL成功 = <b>12/7</b>；失败从 7 个散列地址（模数 7）探到第一个空单元，共 <b>18</b> 次，ASL不成功 = <b>18/7</b>。陷阱：失败的分母是模数 7 而非表长 10；18、9 都要数清被挡的次数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
