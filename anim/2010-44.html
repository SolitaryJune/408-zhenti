<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2010-44 直接映射 Cache · 行号与命中率 · 过程动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域 ================== */
var D = {};

function cardBox(){
  var c = AW.el('div', 'aw-stepcard');
  c.style.cssText = 'padding:10px 14px;margin:6px 0;transition:opacity .25s';
  return c;
}

var snaps = [
  { cls: 'step', tag: '开始', count: 0,
    log: '数据 Cache：8 行 × 64B、直接映射；主存 256MB 按字节编址；int 4B；数组首地址 320，按行优先存放。' },
  { cls: 'step', tag: '地址拆分', count: 1,
    log: '(1) 256MB = 2^28 → 地址 28 位：块内偏移 6 位（64B = 2^6）、行号 3 位（8 行）、标记 = 28 − 6 − 3 = 19 位。' },
  { cls: 'ok', tag: '总容量 532B', count: 2,
    log: '(1) 每行 = 数据 512 bit + 标记 19 bit + 有效位 1 bit = 532 bit；总容量 = 8 × 532 bit = 4256 bit = 532 B。' },
  { cls: 'step', tag: 'a[0][31] 的地址', count: 3,
    log: '(2) a[0][31] 地址 = 320 + (0×256 + 31)×4 = 320 + 124 = 444。' },
  { cls: 'ok', tag: '行号 6', count: 4,
    log: '主存块号 = 444 ÷ 64 取整 = 6 → 直接映射行号 = 6 mod 8 = 6（点亮行 6）。' },
  { cls: 'step', tag: 'a[1][1] 的地址', count: 5,
    log: '(2) a[1][1] 地址 = 320 + (1×256 + 1)×4 = 320 + 1028 = 1348。' },
  { cls: 'ok', tag: '行号 5', count: 6,
    log: '主存块号 = 1348 ÷ 64 取整 = 21 → 行号 = 21 mod 8 = 5（点亮行 5）。' },
  { cls: 'ok', tag: '程序 A 命中率 93.75%', count: 7,
    log: '(3) A 按行访问：一块 64B 装 16 个 int，调入后 16 次访问 15 中 1 不中；总 miss = 65536 ÷ 16 = 4096 → 命中率 = (65536 − 4096) ÷ 65536 = 93.75%。' },
  { cls: 'miss', tag: '程序 B 命中率 0%', count: 8,
    log: 'B 按列访问：相邻访问相距 1024B（跨 16 块），块号不断更换；且相隔 8 块绕回同一 Cache 行，行内早被换出 → 每次都 miss → 命中率 0%。' },
  { cls: 'done', tag: '完成', count: 9, done: true,
    log: '总容量 532B；a[0][31]、a[1][1] 对应行号 6、5；A 命中率 93.75%、B 为 0% → 程序 A 执行更快。' },
];

AW.init({
  title: '2010-44 · 直接映射 Cache：容量 / 行号 / 命中率',
  subtitle: '8 行 × 64B · 28 位地址 = <code>标记19 + 行号3 + 块内6</code> · 程序 A 按行、程序 B 按列',
  counterLabel: '推导步',
  ribbonTitle: '推导进度（✓）',
  intro: '点击「▶ 播放」：先拆地址算容量，再算行号，最后对比两种遍历。',
  snaps: snaps,

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>第(1)问 · 28 位地址拆分与总容量：</b>'));
    var split = AW.el('div', '');
    split.style.cssText = 'display:flex;gap:8px;align-items:center;margin:6px 0;opacity:.35;transition:opacity .25s';
    D.split = split;
    function partBox(txt, w, color){
      var b = AW.el('div', 'aw-stepcard', txt);
      b.style.cssText += 'width:' + w + 'px;text-align:center;margin:0;padding:8px 6px;border-color:' + color;
      return b;
    }
    split.appendChild(partBox('标记 19 位', 150, '#b9cbd0'));
    split.appendChild(AW.el('div', '', '<b style="color:#586e72">｜</b>'));
    split.appendChild(partBox('行号 3 位', 90, '#2f9e44'));
    split.appendChild(AW.el('div', '', '<b style="color:#586e72">｜</b>'));
    split.appendChild(partBox('块内偏移 6 位', 120, '#e07a2f'));
    inner.appendChild(split);
    D.cap = cardBox();
    inner.appendChild(D.cap);

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>第(2)问 · Cache 8 个行（直接映射：行号 = 块号 mod 8）：</b>'));
    var rows = AW.el('div', 'aw-cells');
    D.rowBoxes = [];
    for (var r = 0; r < 8; r++){
      var col = AW.el('div', 'aw-col');
      col.appendChild(AW.el('div', 'aw-ptr', ''));
      var box = AW.el('div', 'aw-box', String(r));
      box.style.cssText = 'width:38px;height:38px;font-size:15px';
      col.appendChild(box);
      col.appendChild(AW.el('div', 'aw-idx', '行' + r));
      rows.appendChild(col);
      D.rowBoxes.push(box);
    }
    inner.appendChild(rows);
    D.calc1 = AW.el('div', 'aw-row-label', '');
    D.calc2 = AW.el('div', 'aw-row-label', '');
    inner.appendChild(D.calc1);
    inner.appendChild(D.calc2);

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>第(3)问 · 两种遍历的命中率：</b>'));
    D.demoWrap = AW.el('div', '');
    D.demoWrap.style.cssText = 'opacity:.35;transition:opacity .25s';
    D.demoWrap.appendChild(AW.el('div', 'aw-row-label',
      '程序 A：一块 64B 装下连续 16 个 int —— <b>第 1 次 miss，之后 15 次全 hit</b>'));
    var cells = AW.el('div', 'aw-cells');
    D.demoBoxes = [];
    for (var n = 0; n < 16; n++){
      var col2 = AW.el('div', 'aw-col');
      col2.appendChild(AW.el('div', 'aw-ptr', ''));
      var b2 = AW.el('div', 'aw-box', String(n + 1));
      b2.style.cssText = 'width:32px;height:32px;font-size:13px';
      col2.appendChild(b2);
      col2.appendChild(AW.el('div', 'aw-idx', ''));
      cells.appendChild(col2);
      D.demoBoxes.push(b2);
    }
    D.demoWrap.appendChild(cells);
    inner.appendChild(D.demoWrap);
    D.pb = cardBox();
    inner.appendChild(D.pb);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    D.split.style.opacity = i >= 1 ? '1' : '0.35';
    D.cap.style.opacity = i >= 2 ? '1' : '0.35';
    D.cap.innerHTML = i >= 2
      ? '<p>每行 = 64×8 + 19 + 1 = <b>532 bit</b>；总容量 = 8 × 532 bit = 4256 bit = <b>532 B</b>。</p>'
      : '<p>每行 = 数据位 + 标记位 + 有效位 → 总容量？</p>';

    D.rowBoxes.forEach(function(box, r){
      if (i >= 6 && r === 5){ box.className = 'aw-box ok'; }
      else if (i >= 4 && r === 6){ box.className = 'aw-box hit'; }
      else { box.className = 'aw-box'; }
    });

    D.calc1.innerHTML = (i >= 3)
      ? 'a[0][31]：地址 = 320 + (0×256+31)×4 = <b>444</b>' + (i >= 4 ? ' → 块号 ⌊444/64⌋ = 6 → 行号 <b style="color:#2f9e44">6</b>' : '')
      : '';
    D.calc2.innerHTML = (i >= 5)
      ? 'a[1][1]：地址 = 320 + (1×256+1)×4 = <b>1348</b>' + (i >= 6 ? ' → 块号 ⌊1348/64⌋ = 21 → 行号 21 mod 8 = <b style="color:#2f9e44">5</b>' : '')
      : '';

    D.demoWrap.style.opacity = i >= 7 ? '1' : '0.35';
    D.demoBoxes.forEach(function(b, n){
      b.className = 'aw-box' + (i >= 7 ? (n === 0 ? ' miss' : ' ok') : '');
    });
    D.pb.style.opacity = i >= 8 ? '1' : '0.35';
    D.pb.className = 'aw-stepcard' + (i >= 8 ? ' bad' : '');
    D.pb.innerHTML = i >= 8
      ? '<p><b>程序 B（按列访问）</b>：同列相邻元素相距 256×4 = <b>1024B</b>，每次访问都换块；相隔 8 块又映射到同一行，轮到时早被换出 → <b>每次都 miss，命中率 0%</b>。</p>'
      : '<p><b>程序 B（按列访问）</b>：相邻两次访问相距多远？命中率？</p>';
  },

  result: {
    big: '532B · 行 6 与 行 5 · A 快于 B',
    html: '(1) 数据 Cache 总容量 = 8 × (512+19+1) bit = <b>532B</b>；(2) a[0][31]（444 → 块 6）→ 行号 <b>6</b>，a[1][1]（1348 → 块 21）→ 行号 <b>5</b>；(3) 程序 A 命中率 <b>93.75%</b>、程序 B <b>0%</b> —— A 按行访问利用空间局部性，执行时间更短。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
