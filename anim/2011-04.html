<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-04 完全二叉树的叶结点个数 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>完全二叉树共 <b>768</b> 个结点，求叶结点数 n₀。备好两条结论：<b>n₀ = n₂ + 1</b>（叶子 = 度 2 结点数 + 1）；完全二叉树中 n₁（度 1 结点）<b>只能取 0 或 1</b>。</p>' },
  { title: '列方程', cls: '',
    body: '<p>三度归一：n = n₀ + n₁ + n₂ = 768。代入 n₀ = n₂ + 1，得 <code>2·n₂ + n₁ + 1 = 768</code>。</p>' },
  { title: '奇偶性定 n₁', cls: '',
    body: '<p>2·n₂ + 1 恒为奇数；要凑出偶数 768，n₁ 必须 = <b>1</b>。（若 n₁ = 0，方程无整数解——这就是完全二叉树「偶数个结点必有 1 个度 1 结点」的原因。）</p>' },
  { title: '解出 n₂ 与 n₀', cls: 'good',
    body: '<p>n₁ = 1 ⇒ 2·n₂ = 766 ⇒ <b>n₂ = 383</b>，<b>n₀ = n₂ + 1 = 384</b>。</p>' },
  { title: '编号法验证', cls: 'good',
    body: '<p>完全二叉树按层编号，叶子恰为编号 <b>⌊n/2⌋+1 … n</b> 的结点：⌊768/2⌋+1 = 385，编号 385~768 全是叶子，共 <b>768 − 384 = 384</b> 个 ✓。最后一个分支结点 384 号只有左孩子（768 号），没有右孩子（769 号不存在）——正是 n₁ = 1 的样子。</p>' },
  { title: '排除干扰项', cls: 'bad',
    body: '<p><b>D（385）</b>：把 384 号分支结点也数成叶子，差 1；<b>A、B（257/258）</b>：奇偶判断错、方程配错凑出来的数。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>叶结点 <b>384</b> 个，答案选 <b>C</b>。记忆锚点：n 的奇偶定 n₁（偶 ⇒ n₁ = 1），再用 n₀ = n₂ + 1；或直接「叶子 = 编号 ⌊n/2⌋+1 … n」。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'key' ? 'shift' : 'step'),
    tag: '第 ' + (i + 1) + '/' + STEPS.length + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-04 · 768 个结点的完全二叉树有多少叶子？',
  subtitle: '考点 <code>n₀ = n₂ + 1</code> + 完全二叉树 n₁ ∈ {0, 1} · 推理链逐步展开',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C · 384 个叶子',
    html: '2·n₂ + n₁ + 1 = 768，由奇偶性 <b>n₁ = 1</b> ⇒ n₂ = 383 ⇒ <b>n₀ = 384</b>。验证：叶子是编号 ⌊768/2⌋+1 = 385 … 768 的结点，恰好 384 个。D 的 385 是把最后的分支结点 384 号也数了进去。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
