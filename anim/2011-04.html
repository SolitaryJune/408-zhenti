<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-04 完全二叉树的叶结点个数 · 结构演示</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .cbt-svg{width:100%;max-width:620px;display:block;margin:0 auto;background:#f8fafc;
    border:1px solid #1b3a4b38;border-radius:12px}
  .cbt-svg .edge{stroke:#5a7d8c;stroke-width:2.5px}
  .cbt-svg .node circle{transition:fill .35s, opacity .4s;stroke-width:2.5px;stroke:#1b3a4b}
  .cbt-svg .node text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:16px;
    text-anchor:middle;dominant-baseline:central;fill:#fff;transition:fill .35s}
  .cbt-svg .node.plain circle{fill:#94a3b8;stroke:#64748b}
  .cbt-svg .node.bran circle{fill:#1b3a4b;stroke:#0b1f2a}
  .cbt-svg .node.leaf circle{fill:#16a34a;stroke:#14532d}
  .cbt-svg .node.deg1 circle{fill:#e07a2f;stroke:#9a3412}
  .cbt-svg .deg1lbl{font-size:12px;font-weight:800;fill:#c2410c;text-anchor:middle;
    font-family:JetBrains Mono,Menlo,monospace;transition:opacity .4s}
  .cbt-svg .hidden-el{opacity:0}
  .hformula{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
  .hformula .keyf{color:#e63946}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 2011-04 完全二叉树叶子数（SVG 结构演示） ==================
 * 题：完全二叉树共 768 个结点，求叶结点数。（答案 C = 384）
 * 演示：先用 n=6 的小完全二叉树看清"编号→角色"与"n₁ 只能 0/1"，
 *       再推广到 768：n 偶 ⇒ n₁=1 ⇒ n₀ = n₂+1 ⇒ 384。 */

var NODES = [
  { id:'1', x:310, y:45,  step:0 },
  { id:'2', x:180, y:130, step:0 },
  { id:'3', x:460, y:130, step:0 },
  { id:'4', x:120, y:215, step:0 },
  { id:'5', x:240, y:215, step:0 },
  { id:'6', x:410, y:215, step:0 },   /* 6 号是 3 号的左孩子（完全二叉树形状） */
];
var EDGES = [
  { a:'1', b:'2' }, { a:'1', b:'3' },
  { a:'2', b:'4' }, { a:'2', b:'5' },
  { a:'3', b:'6' },
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 620 265');
  svg.setAttribute('class', 'cbt-svg');
  EDGES.forEach(function(e){
    var A = null, B = null;
    NODES.forEach(function(n){ if (n.id === e.a) A = n; if (n.id === e.b) B = n; });
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y);
    ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
    ln.setAttribute('class', 'edge');
    svg.appendChild(ln);
  });
  NODES.forEach(function(n){
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'node plain');
    g.dataset.id = n.id;
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 21);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y);
    t.textContent = n.id;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
  });
  /* 3 号结点旁的"只有左孩子"标注 */
  var lb = document.createElementNS(svgNS, 'text');
  lb.setAttribute('x', 520); lb.setAttribute('y', 130);
  lb.setAttribute('class', 'deg1lbl hidden-el'); lb.dataset.step = 2;
  lb.textContent = '3号：只有左孩子 → 度1';
  svg.appendChild(lb);
  stage.appendChild(svg);
  var formulaBox = AW.el('div', 'hformula');
  stage.appendChild(formulaBox);
  this._svg = svg; this._formulaBox = formulaBox;
}

function render(stage, sn, i){
  var svg = this._svg;
  [].forEach.call(svg.querySelectorAll('.node'), function(el){
    el.classList.remove('bran', 'leaf', 'deg1');
    el.classList.add('plain');
    if (i >= 1) {                       /* 编号法定角色：≤⌊n/2⌋ 分支，>⌊n/2⌋ 叶子 */
      var id = +el.dataset.id;
      if (id <= 3) el.classList.add('bran'); else el.classList.add('leaf');
    }
    if (i >= 2 && el.dataset.id === '3') { el.classList.remove('bran'); el.classList.add('deg1'); }
  });
  [].forEach.call(svg.querySelectorAll('.deg1lbl'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  var formulas = [
    '题：完全二叉树 n = <code>768</code>，求叶子数 n₀。先拿 n = 6 的小树看结构',
    '编号法：编号 ≤ ⌊n/2⌋ 的是<b>分支结点</b>，编号 > ⌊n/2⌋ 的是<b>叶子</b>',
    '数一数（n=6）：n₂ = 2（1、2号），n₁ = <b>1</b>（3号只有左孩子），n₀ = 3（4、5、6号）',
    '推广：n = 768 为<b>偶数</b> ⇒ 最后一个结点是左孩子 ⇒ 它父结点只有左孩子 ⇒ <b>n₁ = 1</b>',
    'n₀ + n₁ + n₂ = 768 且 n₀ = n₂ + 1 ⇒ 2n₂ + 2 = 768 ⇒ n₂ = 383 ⇒ <code class="keyf">n₀ = 384</code>',
    '编号法验证：⌊768/2⌋ + 1 = 385 ⇒ 叶子 = 编号 385…768，共 <b>384</b> 个 ✓',
    '排除：D(385) 把 384 号分支结点也数成叶子；A、B 是方程配错凑出的数',
    'n₀ = <b>384</b>（选 C）',
  ];
  this._formulaBox.innerHTML = formulas[Math.min(i, formulas.length - 1)] || '';
}

var SNAPS = [
  { cls:'shift', tag:'审题', count:0,
    log:'完全二叉树共 768 个结点，求叶结点数。形状完全由 n 决定，先用 n=6 的小树看清结构规律。' },
  { cls:'step', tag:'编号定角色', count:1,
    log:'完全二叉树按层编号：编号 ≤ ⌊n/2⌋ 的是分支结点（1、2、3 号），编号 > ⌊n/2⌋ 的全是叶子（4、5、6 号）。' },
  { cls:'step', tag:'数度数', count:2,
    log:'1、2 号各有两个孩子（度2）；3 号只有左孩子 6 号——769 号不存在（度1）；4、5、6 号是叶子。n=6 时 n₀=3、n₁=1、n₂=2，合计 6 ✓。' },
  { cls:'shift', tag:'奇偶定 n₁', count:3,
    log:'推广到 768：n 是偶数 ⇒ 最后一个结点 768 号必是左孩子 ⇒ 它的父结点 384 号只有左孩子 ⇒ n₁ = 1（n 为奇数时 n₁ = 0）。' },
  { cls:'ok', tag:'解方程', count:4,
    log:'n₀ + n₁ + n₂ = 768，代入 n₁ = 1、n₀ = n₂ + 1：2n₂ + 2 = 768 ⇒ n₂ = 383 ⇒ n₀ = 384。' },
  { cls:'ok', tag:'编号法验证', count:5,
    log:'直接验证：叶子 = 编号 ⌊768/2⌋+1 = 385 … 768 的结点，共 768 − 384 = 384 个 ✓（384 号正是那个只有左孩子的结点）。' },
  { cls:'miss', tag:'排除干扰', count:6,
    log:'D(385)：把 384 号分支结点也数进叶子；A(257)、B(258)：n₁ 奇偶判断错、方程配错凑出的数。' },
  { cls:'done', tag:'完成', count:7, done:true,
    log:'叶结点 384 个，选 C。' },
];

AW.init({
  title: '2011-04 · 768 个结点的完全二叉树有多少叶子？',
  subtitle: '考点 <code>n₀ = n₂ + 1</code> ＋ 完全二叉树 n₁ ∈ {0,1} · 用 n=6 小树看清结构再推广到 768',
  counterLabel: '演示步',
  intro: '点击「▶ 播放」：先给小树按编号染色定位叶子，再看奇偶性如何锁定 n₁。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 C · 384 个叶子',
    html: 'n = 768 是偶数 ⇒ n₁ = 1；由 n₀ = n₂ + 1 与 n₀ + n₂ = 767 解得 <b>n₂ = 383、n₀ = 384</b>。<br>' +
      '快速验证：叶子 = 编号 ⌊n/2⌋+1 … n，即 385…768，恰好 <b>384</b> 个。记忆锚点：<code>完全二叉树叶子从 ⌊n/2⌋+1 号开始</code>。',
  },
});
</script>
</body>
</html>
