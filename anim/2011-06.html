<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-06 树转二叉树 · 无右孩子结点数（结构演示）</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .ft-svg{width:100%;max-width:780px;display:block;margin:0 auto;background:#f8fafc;
    border:1px solid #1b3a4b38;border-radius:12px}
  .ft-svg .edge{stroke:#5a7d8c;stroke-width:2.5px}
  .ft-svg .edge.newedge{stroke:#e07a2f;stroke-dasharray:5 4}
  .ft-svg .node circle{fill:#1b3a4b;stroke:#1b3a4b;stroke-width:2.5px;transition:fill .35s, stroke .35s}
  .ft-svg .node text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:15px;
    text-anchor:middle;dominant-baseline:central;fill:#fff;transition:fill .35s}
  .ft-svg .node.leaf circle{fill:#16a34a;stroke:#14532d}
  .ft-svg .node.norp circle{fill:#e63946;stroke:#7f1d1d}
  .ft-svg .node.hot circle{fill:#d97706;stroke:#92400e}
  .ft-svg .hidden-el{opacity:0}
  .ft-svg .side-lbl{font-size:12px;font-weight:800;font-family:JetBrains Mono,Menlo,monospace;
    text-anchor:middle;fill:#2563eb}
  .ft-svg .panel-lbl{font-size:14px;font-weight:800;fill:#334155;text-anchor:middle}
  .hformula{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 2011-06 树→二叉树：无右孩子的结点（SVG 双树对照） ==================
 * 题：2011 个结点的树、叶 116，对应二叉树中无右孩子的结点数？（答案 D = 1896）
 * 演示：7 结点小树（叶 4）做孩子-兄弟转换 → 数出"无右孩子"= 非叶数 + 1 → 代入求解。 */

/* 原树 */
var TNODES = [
  { id:'R', x:150, y:50,  step:0, leaf:false },
  { id:'A', x:80,  y:140, step:0, leaf:false },
  { id:'B', x:150, y:140, step:0, leaf:true  },
  { id:'C', x:220, y:140, step:0, leaf:false },
  { id:'D', x:45,  y:230, step:0, leaf:true  },
  { id:'E', x:115, y:230, step:0, leaf:true  },
  { id:'F', x:220, y:230, step:0, leaf:true  },
];
var TEDGES = [
  { a:'R', b:'A', step:0 }, { a:'R', b:'B', step:0 }, { a:'R', b:'C', step:0 },
  { a:'A', b:'D', step:0 }, { a:'A', b:'E', step:0 }, { a:'C', b:'F', step:0 },
];
/* 对应二叉树（孩子-兄弟）：左=第一个孩子，右=下一个兄弟 */
var BNODES = [
  { id:'R', x:620, y:50,  step:1, leaf:false },
  { id:'A', x:545, y:140, step:1, leaf:false },
  { id:'D', x:475, y:230, step:2, leaf:false },
  { id:'E', x:525, y:320, step:2, leaf:true  },
  { id:'B', x:615, y:230, step:3, leaf:false },
  { id:'C', x:685, y:320, step:3, leaf:false },
  { id:'F', x:625, y:410, step:3, leaf:true  },
];
var BEDGES = [
  { a:'R', b:'A', step:1, lbl:'孩', lx:572, ly:88 },
  { a:'A', b:'D', step:2, lbl:'孩', lx:500, ly:178 },
  { a:'D', b:'E', step:2, lbl:'兄', lx:522, ly:268 },
  { a:'A', b:'B', step:3, lbl:'兄', lx:600, ly:178 },
  { a:'B', b:'C', step:3, lbl:'兄', lx:672, ly:268 },
  { a:'C', b:'F', step:3, lbl:'孩', lx:632, ly:358 },
];
var FORMULAS = [
  '题：树有 <code>2011</code> 个结点、叶 116，对应二叉树中<b>无右孩子</b>的结点有几个？先用 7 结点小树做实验',
  '规则：<b>左指针挂第一个孩子，右指针挂下一个兄弟</b>。根 R 转换后只有左孩子 A',
  'A 的孩子链 D→E：A 左挂 D，D 右挂 E（兄弟）',
  '兄弟链继续：A 右挂 B，B 右挂 C（兄弟），C 左挂孩子 F —— 转换完成',
  '数一数：无右孩子的是 <b>R、E、C、F</b>（红色）共 4 个',
  '对应回原树：R（根没有兄弟）＋ C、E、F（每个分支结点的<b>最后一个孩子</b>）',
  '规律：每个非叶结点贡献 1 个「最后孩子」，根再贡献 1 ⇒ 无右孩子数 = <code>非叶数 + 1</code>。验证：(7−4)+1 = 4 ✓',
  '代入：非叶 = 2011 − 116 = <b>1895</b> ⇒ 无右孩子 = 1895 + 1 = <code class="kf">1896</code>',
  '无右孩子 <b>1896</b> 个（选 D）',
];

function build(stage){
  var mk = function(txt, x, y, cls, extra){
    return '<text x="' + x + '" y="' + y + '" class="' + cls + '"' + (extra || '') + '>' + txt + '</text>';
  };
  var h = '<svg viewBox="0 0 780 455" class="ft-svg">';
  h += mk('原树（7 结点 · 叶 4）', 150, 20, 'panel-lbl');
  h += mk('对应二叉树（孩子-兄弟）', 600, 20, 'panel-lbl');
  TEDGES.forEach(function(e){
    var A = null, B = null;
    TNODES.forEach(function(n){ if (n.id === e.a) A = n; if (n.id === e.b) B = n; });
    h += '<line x1="' + A.x + '" y1="' + A.y + '" x2="' + B.x + '" y2="' + B.y + '" class="edge"/>';
  });
  BNODES.forEach(function(n){ n._ref = 'b'; });
  TNODES.forEach(function(n){ n._ref = 't'; });
  BEDGES.forEach(function(e){
    var A = null, B = null;
    BNODES.forEach(function(n){ if (n.id === e.a) A = n; if (n.id === e.b) B = n; });
    h += '<line x1="' + A.x + '" y1="' + A.y + '" x2="' + B.x + '" y2="' + B.y + '"' +
         ' class="edge newedge hidden-el" data-step="' + e.step + '"/>';
    h += mk(e.lbl, e.lx, e.ly, 'side-lbl hidden-el', ' data-step="' + e.step + '"');
  });
  TNODES.concat(BNODES).forEach(function(n){
    h += '<g class="node' + (n.leaf ? ' leaf' : '') + (n._ref === 'b' ? ' hidden-el' : '') + '"' +
         ' data-id="' + n.id + '" data-side="' + n._ref + '" data-step="' + n.step + '">' +
         '<circle cx="' + n.x + '" cy="' + n.y + '" r="19"/>' +
         '<text x="' + n.x + '" y="' + n.y + '">' + n.id + '</text></g>';
  });
  h += '</svg>';
  stage.innerHTML = h;
  var formulaBox = AW.el('div', 'hformula');
  stage.appendChild(formulaBox);
  this._svg = stage.querySelector('.ft-svg'); this._formulaBox = formulaBox;
}

function render(stage, sn, i){
  var svg = this._svg;
  [].forEach.call(svg.querySelectorAll('.node'), function(el){
    if (el.dataset.side === 'b'){
      el.classList.toggle('hidden-el', +el.dataset.step > i);
    }
    el.classList.remove('norp', 'hot');
    if (i >= 4 && ['R','E','C','F'].indexOf(el.dataset.id) >= 0){
      if (el.dataset.side === 'b') el.classList.add('norp');
      else el.classList.add('hot');           /* 原树中对应的「最后孩子 / 根」 */
    }
  });
  [].forEach.call(svg.querySelectorAll('.edge.newedge'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  [].forEach.call(svg.querySelectorAll('.side-lbl'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  this._formulaBox.innerHTML = FORMULAS[Math.min(i, FORMULAS.length - 1)] || '';
}

var SNAPS = [
  { cls:'shift', tag:'审题', count:0,
    log:'树有 2011 个结点、叶 116 个。树转二叉树用「孩子-兄弟」表示法，转换后数无右孩子的结点 —— 先用 7 结点（叶 4）的小树做实验。' },
  { cls:'step', tag:'转换 ①', count:1,
    log:'规则：左指针 = 第一个孩子，右指针 = 下一个兄弟。根 R 只有左孩子 A（R 没有兄弟，右指针空！）。' },
  { cls:'step', tag:'转换 ②', count:2,
    log:'A 的孩子是 D、E：A 的左指针挂 D，D 的右指针挂兄弟 E。' },
  { cls:'step', tag:'转换 ③', count:3,
    log:'兄弟链继续串：A 的右指针挂 B，B 的右指针挂 C（都是 R 的孩子），C 的左指针挂它的孩子 F。转换完成。' },
  { cls:'ok', tag:'标出无右孩子', count:4,
    log:'数一数：二叉树中无右孩子的是 R、E、C、F，共 4 个（红色）。有右孩子的 A、B、D 都挂在某条兄弟链中间。' },
  { cls:'shift', tag:'回到原树', count:5,
    log:'看原树（橙色）：R 是根、天生没有兄弟；C、E、F 分别是各兄弟链的「最后一个孩子」。规律浮出水面。' },
  { cls:'ok', tag:'提炼规律', count:6,
    log:'每个分支结点（非叶）的孩子链末尾恰有 1 个「最后孩子」，加上没有兄弟的根 ⇒ 无右孩子数 = 非叶结点数 + 1。小树验证：(7−4)+1 = 4 ✓' },
  { cls:'ok', tag:'代入求解', count:7,
    log:'原树分支结点 = 2011 − 116 = 1895 个 ⇒ 无右孩子结点 = 1895 + 1 = 1896。' },
  { cls:'done', tag:'完成', count:8, done:true,
    log:'无右孩子的结点 1896 个，选 D。' },
];

AW.init({
  title: '2011-06 · 树转二叉树后，无右孩子的结点有几个？',
  subtitle: '2011 个结点 · 叶 116 · 孩子-兄弟表示法：<code>左 = 第一个孩子，右 = 下一个兄弟</code>',
  counterLabel: '转换步',
  intro: '点击「▶ 播放」：看小树如何变成二叉树、无右孩子的结点是谁，再推广到 2011 个结点。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 D · 1896 个',
    html: '孩子-兄弟转换后，<b>无右孩子 ⇔ 原树中没有下一个兄弟</b>：即每个非叶结点的最后一个孩子 + 无兄弟的根。<br>' +
      '非叶结点 = 2011 − 116 = 1895 ⇒ 无右孩子 = 1895 + 1 = <b>1896</b>。记忆锚点：<code>无右孩子数 = 非叶结点数 + 1</code>（A 的 115、B 的 116 是把叶数直接搬过去的陷阱）。',
  },
});
</script>
</body>
</html>
