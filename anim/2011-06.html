<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-06 树转二叉树 · 无右孩子结点数推理动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 小样例：根 + 三个孩子 A B C，A 的两个孩子 a1 a2 → 转换后的二叉树
function demoTree(){
  var box = function(v, color){
    return '<div class="aw-box" style="width:40px;height:32px;font-size:13px;' +
           (color ? 'border-color:' + color + ';color:' + color : '') + '">' + v + '</div>';
  };
  var h = '<div style="display:inline-block;text-align:center;vertical-align:middle;margin:4px 12px 0 0;font-size:12.5px;color:#94a3b8">';
  h += '<div style="display:flex;justify-content:center">' + box('根', '#d97706') + '</div>';
  h += '<div style="display:flex;justify-content:center;gap:96px;margin-top:10px">' + box('A') + box('B') + '</div>';
  h += '<div style="display:flex;justify-content:center;gap:36px;margin-top:10px">' + box('a1') + box('a2') + box('C') + '</div>';
  h += '<div style="margin-top:6px">左=第一个孩子 · 右=右兄弟（琥珀=无右孩子）</div>';
  return h + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>树有 <b>2011</b> 个结点、<b>116</b> 个叶结点，求对应二叉树中<b>无右孩子</b>的结点数。转换规则（孩子-兄弟表示法）：<b>左指针 = 第一个孩子，右指针 = 右兄弟</b>。</p>' },
  { title: '翻译问题', cls: '',
    body: '<p>「二叉树中无右孩子」⟺「该结点在原树中<b>没有右兄弟</b>」。于是问题变成：原树里谁没有右兄弟？</p>' },
  { title: '谁没有右兄弟：①根', cls: 'key',
    body: '<p><b>根结点</b>全树唯一、永远没有兄弟，转换后必然无右孩子——这一类只有 <b>1</b> 个，最容易被漏数。</p>' },
  { title: '谁没有右兄弟：②每个分支结点的最后一个孩子', cls: 'key',
    body: '<p>分支结点的孩子们排成一条兄弟链（第一个孩子 → 二弟 → 三弟 → …），链上只有<b>末尾那个</b>没有右兄弟。每个分支结点恰贡献 1 个，共 <b>2011 − 116 = 1895</b> 个。</p>' },
  { title: '小样例验证规律', cls: '',
    body: '<p>' + demoTree() + '<span style="display:inline-block;vertical-align:top;font-size:14px;line-height:2.1">根+3 孩子，A 再带 a1、a2：共 6 结点、4 叶、2 个分支结点。无右孩子的是 <b>根、C、a2</b> 共 3 个 = 分支结点 2 + 根 1，与本题同构 ✓<br>A、B、a1 都有右兄弟（右孩子）✗</span></p>' },
  { title: '汇总计算', cls: 'good',
    body: '<p>两类不重叠（根没有父结点，不在任何兄弟链上）：<b>1895 + 1 = 1896</b> 个。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>无右孩子的结点 <b>1896</b> 个，答案选 <b>D</b>。记忆锚点：<b>无右孩子 = 根 + 每个分支结点的最后一个孩子</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'key' ? 'shift' : 'step'),
    tag: '第 ' + (i + 1) + '/' + STEPS.length + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-06 · 树转二叉树：无右孩子的结点有多少个？',
  subtitle: '2011 结点、116 叶 · 转换规则 <code>左=第一个孩子 · 右=右兄弟</code>',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D · 1896 个',
    html: '无右孩子 ⟺ 原树中无右兄弟：根 1 个 + 每个分支结点的最后一个孩子共 2011 − 116 = <b>1895</b> 个，合计 <b>1896</b>。漏掉根就错选 C；拿叶结点数 116 去凑会掉进 A/B 的坑——叶结点也可能有右兄弟。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
