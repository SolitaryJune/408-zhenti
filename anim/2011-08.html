<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-08 图的三条论断辨析 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 回路示意：v1 → v2 → v1（首尾重复）
function cycleDemo(){
  var b = function(v){ return '<div class="aw-box" style="width:36px;height:30px;font-size:13px">' + v + '</div>'; };
  return '<div style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin:2px 0">' +
         b('v1') + '<span>→</span>' + b('v2') + '<span>→</span>' + b('v1') +
         '<span style="font-size:12.5px;color:#94a3b8;margin-left:6px">首尾都是 v1，顶点重复</span></div>';
}

// 空间对比小表
function spaceTable(){
  return '<table style="border-collapse:collapse;font-size:13px;margin-top:6px">' +
    '<tr><th style="border:1px solid #cbd5e1;padding:4px 10px;background:#f1f5f9">存储</th>' +
    '<th style="border:1px solid #cbd5e1;padding:4px 10px;background:#f1f5f9">空间</th>' +
    '<th style="border:1px solid #cbd5e1;padding:4px 10px;background:#f1f5f9">稀疏图（e ≪ n²）</th></tr>' +
    '<tr><td style="border:1px solid #cbd5e1;padding:4px 10px">邻接矩阵</td>' +
    '<td style="border:1px solid #cbd5e1;padding:4px 10px">O(n²) 个元素</td>' +
    '<td style="border:1px solid #cbd5e1;padding:4px 10px;color:#b91c1c"><b>大量 ∞/0 死重，费空间</b></td></tr>' +
    '<tr><td style="border:1px solid #cbd5e1;padding:4px 10px">邻接表</td>' +
    '<td style="border:1px solid #cbd5e1;padding:4px 10px">O(n + e)</td>' +
    '<td style="border:1px solid #cbd5e1;padding:4px 10px;color:#15803d"><b>只存实际边，省空间</b></td></tr></table>';
}

var STEPS = [
  { title: '审题眼：三条论断独立判断', cls: 'key',
    body: '<p>Ⅰ 回路与简单路径 · Ⅱ 稀疏图的存储选择 · Ⅲ 拓扑序列与回路的关系。互不牵连，逐条判断后再组合选项。</p>' },
  { title: 'Ⅰ：回路是简单路径？——错', cls: 'bad',
    body: '<p>简单路径要求序列中<b>顶点不重复</b>。回路首尾相接：' + cycleDemo() + ' v1 重复出现，所以回路不是简单路径。只能说回路是「简单<b>回路</b>」（除首尾外不重复）。</p>' },
  { title: 'Ⅱ：稀疏图用邻接矩阵更省空间？——错', cls: 'bad',
    body: '<p>说反了。' + spaceTable() + ' 稀疏图 e ≪ n²，<b>邻接表</b>才省空间；邻接矩阵适合<b>稠密图</b>。</p>' },
  { title: 'Ⅲ：存在拓扑序列 ⟹ 无回路？——对', cls: 'good',
    body: '<p>拓扑排序每步取一个<b>入度为 0</b> 的顶点。若图有环，环上顶点入度永远不为 0，排序必然中途卡死、得不到全部顶点的序列。所以：<b>存在拓扑序列 ⟺ 图无环（DAG）</b>，Ⅲ 正确。</p>' },
  { title: '组合选项', cls: 'good',
    body: '<p>Ⅰ 错、Ⅱ 错、Ⅲ 对 ⇒ <b>仅Ⅲ</b>正确，答案选 <b>C</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'key' ? 'shift' : 'step'),
    tag: '第 ' + (i + 1) + '/' + STEPS.length + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-08 · 图的三条论断：哪条对？',
  subtitle: 'Ⅰ 回路 vs 简单路径 · Ⅱ 稀疏图存储 · Ⅲ 拓扑序列 ⟺ 无环',
  intro: '点击「▶ 播放」逐条辨析。',
  snaps: snaps,
  result: {
    big: '答案 C · 仅Ⅲ正确',
    html: '回路首尾顶点重复，不是<b>简单路径</b>（Ⅰ错）；稀疏图省空间要靠<b>邻接表</b>，邻接矩阵适合稠密图（Ⅱ错）；<b>有向图无环 ⟺ 存在拓扑序列</b>，有环则拓扑排序必卡死（Ⅲ对）。记忆点：回路 ≠ 简单路径，稀疏→邻接表，拓扑→无环。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
