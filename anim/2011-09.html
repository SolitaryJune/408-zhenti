<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-09 散列表查找效率三措施 · 辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 装填因子对比小图：同样的 7 个关键字，表长 8（α 大）vs 表长 14（α 小）
function loadDemo(){
  var cell = function(v, hot){
    return '<div class="aw-box' + (hot ? ' miss' : '') + '" style="width:26px;height:26px;font-size:12px">' + v + '</div>';
  };
  function rowOf(cells){
    return '<div style="display:flex;gap:3px">' + cells.map(function(c){ return cell(c[0], c[1]); }).join('') + '</div>';
  }
  var dense = rowOf([[14,1],[24,1],[33,1],[42,1],[51,1],[60,1],[3,1],['空',0]]);
  var sparse = rowOf([[14,0],['空',0],['空',0],[24,0],['空',0],['空',0],['空',0],[33,0],['空',0],['空',0],[42,0],['空',0],['空',0],[51,0]]);
  return '<div style="font-size:12.5px;color:#64748b;margin-top:6px">' +
         'α 大（表长 8 塞 7 个，几乎处处相邻，一撞就连环）：<br>' + dense + '<br>' +
         'α 小（表长 14 塞 7 个，间隔大，撞上概率低）：<br>' + sparse + '</div>';
}

// 堆积（聚集）示意：连续占用块
function clusterDemo(){
  var cell = function(v, cls){
    return '<div class="aw-box ' + (cls || '') + '" style="width:26px;height:26px;font-size:11px">' + v + '</div>';
  };
  var h = '<div style="font-size:12.5px;color:#64748b;margin-top:6px">线性探测形成连续占用块（堆积）：同义词 24、34 之外，非同义词 58、66 也被挤进来——</div>';
  h += '<div style="display:flex;gap:3px;margin-top:4px;align-items:center">' +
       cell(24,'ok') + cell(34,'ok') + cell(58,'hit') + cell(66,'hit') + cell('空','dim') +
       '<span style="font-size:12.5px;color:#b91c1c;margin-left:8px">散列到 2~5 附近的新元素都要一路探测</span></div>';
  return h;
}

var STEPS = [
  { title: '审题眼：效率由什么决定', cls: 'key',
    body: '<p>散列查找的比较次数取决于<b>冲突多少</b>：散列函数越均匀、冲突处理越不堆积、表越空（装填因子小），平均查找长度越短。用这把尺子量三条措施。</p>' },
  { title: 'Ⅰ：增大装填因子？——方向反了', cls: 'bad',
    body: '<p>α = 表中记录数 ÷ 表长。α 越大表越满、新元素撞上已有元素的概率越高，查找越慢。' + loadDemo() + ' 想提高效率应<b>适当减小</b> α，Ⅰ 错。</p>' },
  { title: 'Ⅱ：设计冲突少的散列函数——对', cls: 'good',
    body: '<p>散列函数越均匀，关键字越分散地落到各地址，冲突越少，比较次数越少。这是提高散列效率<b>最根本</b>的手段，Ⅱ 对。</p>' },
  { title: 'Ⅲ：处理冲突避免堆积——对', cls: 'good',
    body: '<p>' + clusterDemo() + ' 换用二次探测、链地址法等<b>避免堆积</b>，能显著缩短探测路径，Ⅲ 对。</p>' },
  { title: '组合选项', cls: 'good',
    body: '<p>Ⅰ 错、Ⅱ 对、Ⅲ 对 ⇒ <b>仅Ⅱ、Ⅲ</b>，答案选 <b>D</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'key' ? 'shift' : 'step'),
    tag: '第 ' + (i + 1) + '/' + STEPS.length + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-09 · 哪些措施能提高散列表查找效率？',
  subtitle: 'Ⅰ 增大装填因子 · Ⅱ 冲突少的散列函数 · Ⅲ 避免堆积（聚集）',
  intro: '点击「▶ 播放」逐条辨析。',
  snaps: snaps,
  result: {
    big: '答案 D · 仅Ⅱ、Ⅲ',
    html: '散列效率三板斧：<b>散列函数均匀</b>（Ⅱ）、<b>处理冲突不堆积</b>（Ⅲ）、<b>装填因子适当小</b>。Ⅰ 的「增大 α」让表更满、冲突更多，方向完全相反——这是本题唯一的陷阱。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
