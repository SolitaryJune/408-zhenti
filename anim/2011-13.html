<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-13 IEEE 754 单精度编码 −8.25</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 算法/过程类动画（复制 tools/anim_algo_template.html，只改 AW.init 区域）
     演示：−8.25 → 规格化 → 数符/阶码/尾数三段填充 → 拼 32 位 → C104 0000H -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var refs = {};

function fldLabel(t){
  var d = AW.el('div', '', t);
  d.style.cssText = 'font-size:11.5px;color:#586e72;margin-bottom:5px;text-align:center;white-space:nowrap;';
  return d;
}
function bitbox(w, mono){
  var b = AW.el('div', '');
  b.style.cssText = 'width:' + w + 'px;height:36px;border:2px solid #5a7d8c66;border-radius:8px;display:flex;align-items:center;justify-content:center;' +
    'font-family:"SF Mono",Menlo,Consolas,monospace;font-weight:700;font-size:14px;background:#fff;color:#1b3a4b;' +
    'transition:background .2s,border-color .2s,color .2s,opacity .2s;';
  b.textContent = '';
  return b;
}

var EXP = '10000010';
var FRAC = '00001000000000000000000';   // 23 位：00001 后补 18 个 0

var SNAPS = [
  { norm:'x = −8.25　→　8.25 = 1000.01B', sig:'', exp:'', frac:'',
    bits:'', hex:'', hi:'', cls:'shift', tag:'准备', count:0,
    log:'IEEE 754 单精度 = 1 位数符 + 8 位阶码（偏置 127）+ 23 位尾数。先把 x = −8.25 写成二进制：8.25 = 1000.01B' },
  { norm:'−8.25 = −1000.01B = −1.00001 × 2³', sig:'', exp:'', frac:'',
    bits:'', hex:'', hi:'', cls:'step', tag:'规格化', count:1, ribbon:{k:1, ok:true},
    log:'规格化：小数点左移 3 位 → −1.00001 × 2³，隐含整数位 1，尾数小数部分 = 00001' },
  { norm:'−8.25 = −1.00001 × 2³　数符：负 → 1', sig:'1', exp:'', frac:'',
    bits:'', hex:'', hi:'sig', cls:'ok', tag:'数符=1', count:2, ribbon:{k:2, ok:true},
    log:'数符 S：负数 → 1（第 31 位）' },
  { norm:'−8.25 = −1.00001 × 2³　阶码：3 + 127 = 130', sig:'1', exp:EXP, frac:'',
    bits:'', hex:'', hi:'exp', cls:'ok', tag:'阶码=10000010', count:3, ribbon:{k:3, ok:true},
    log:'阶码 E = 真指数 3 + 偏置 127 = 130 = 10000010B（第 30~23 位）' },
  { norm:'−8.25 = −1.00001 × 2³　尾数：00001 补 0 到 23 位', sig:'1', exp:EXP, frac:FRAC,
    bits:'', hex:'', hi:'frac', cls:'ok', tag:'尾数=00001…', count:4, ribbon:{k:4, ok:true},
    log:'尾数 M：去掉隐含的 1，存小数部分 00001，后面补 0 凑满 23 位（第 22~0 位）' },
  { norm:'拼接：1 10000010 00001000000000000000000', sig:'1', exp:EXP, frac:FRAC,
    bits:'1100 0001 0000 0100 0000 0000 0000 0000', hex:'', hi:'bits', cls:'shift', tag:'拼 32 位', count:5,
    log:'把三段拼成 32 位：1 | 10000010 | 00001000000000000000000，按 4 位一组读出' },
  { norm:'验证：−(1 + 1/32) × 2³ = −8.25 ✓', sig:'1', exp:EXP, frac:FRAC,
    bits:'1100 0001 0000 0100 0000 0000 0000 0000', hex:'C104 0000H', hi:'hex', cls:'done', tag:'十六进制', count:6, ribbon:{k:5, ok:true},
    log:'每 4 位转 1 个十六进制数字：1100→C，0001→1，0000→0，0100→4 … → C104 0000H，与选项 A 一致' },
  { norm:'−8.25 ⇒ C104 0000H（选 A）', sig:'1', exp:EXP, frac:FRAC,
    bits:'1100 0001 0000 0100 0000 0000 0000 0000', hex:'C104 0000H', hi:'hex', cls:'done', tag:'完成', count:7, done:true,
    log:'结论：FR1 内容为 C104 0000H，选 A。反向验算：数符 1 为负，阶码 130−127=3，尾数 1+1/32 → −(33/32)×8 = −8.25 ✓' },
];

function fill(box, val, hot){
  if(val){ box.textContent = val; box.style.opacity = '1'; }
  else { box.textContent = ''; box.style.opacity = '.35'; }
  if(hot){ box.style.background = '#2f9e4424'; box.style.borderColor = '#2f9e44'; box.style.color = '#1e4d33'; }
  else { box.style.background = '#fff'; box.style.borderColor = '#5a7d8c66'; box.style.color = '#1b3a4b'; }
}

AW.init({
  title: '2011·13 把 −8.25 编成 IEEE 754 单精度浮点数',
  subtitle: 'float x = −8.25 存入 32 位寄存器 FR1 · 单精度 = <code>1 位符 + 8 位阶码(偏置127) + 23 位尾数</code>',
  counterLabel: '编码步数',
  ribbonTitle: '编码要点（✓ 完成）',
  intro: '点击「▶ 播放」，按 规格化 → 数符 → 阶码 → 尾数 → 拼接 → 十六进制 逐步编码。',
  snaps: SNAPS,

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    // 参数说明
    var params = AW.el('div', '');
    params.style.cssText = 'font-size:12.5px;color:#47616c;background:#f8edcb;border:1px solid #1b3a4b26;border-radius:10px;padding:8px 12px;line-height:1.7;margin-bottom:12px;';
    params.innerHTML = 'IEEE 754 单精度（32 位）：数符 <b>1</b> 位 ｜ 阶码 <b>8</b> 位（偏置值 127）｜ 尾数 <b>23</b> 位（隐含最高位 1，只存小数部分）';
    inner.appendChild(params);

    // 当前推演式
    refs.norm = AW.el('div', '');
    refs.norm.style.cssText = 'font-family:"SF Mono",Menlo,Consolas,monospace;font-size:14px;font-weight:700;color:#1b3a4b;background:#f8edcb;border:1.5px solid #e07a2f;border-radius:10px;padding:9px 12px;';
    inner.appendChild(refs.norm);

    // 字段区：数符 / 阶码 / 尾数
    refs.fields = AW.el('div', '');
    refs.fields.style.cssText = 'display:flex;align-items:flex-end;gap:8px;margin-top:12px;width:max-content;';
    var g1 = AW.el('div', ''); g1.appendChild(fldLabel('数符 (1 位)'));
    refs.sig = bitbox(40); g1.appendChild(refs.sig);
    var g2 = AW.el('div', ''); g2.appendChild(fldLabel('阶码 (8 位)'));
    refs.exp = []; var r2 = AW.el('div',''); r2.style.cssText='display:flex;gap:2px;';
    for(var i = 0; i < 8; i++){ var b = bitbox(26); refs.exp.push(b); r2.appendChild(b); }
    g2.appendChild(r2);
    var g3 = AW.el('div', ''); g3.appendChild(fldLabel('尾数 (23 位)'));
    refs.frac = []; var r3 = AW.el('div',''); r3.style.cssText='display:flex;gap:1px;';
    for(var j = 0; j < 23; j++){ var b2 = bitbox(20); refs.frac.push(b2); r3.appendChild(b2); }
    g3.appendChild(r3);
    refs.fields.appendChild(g1); refs.fields.appendChild(g2); refs.fields.appendChild(g3);
    inner.appendChild(refs.fields);

    // 32 位拼接
    refs.bits = AW.el('div', '');
    refs.bits.style.cssText = 'margin-top:12px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;font-weight:700;letter-spacing:2px;color:#213e48;min-height:20px;';
    inner.appendChild(refs.bits);

    // 十六进制结果
    refs.hex = AW.el('div', '');
    refs.hex.style.cssText = 'margin-top:8px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:20px;font-weight:800;min-height:28px;';
    inner.appendChild(refs.hex);
    inner.appendChild(AW.el('div', 'aw-hint', '绿色=本步填入的字段；灰色空格=尚未填写'));

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    refs.norm.textContent = sn.norm;
    fill(refs.sig, sn.sig, sn.hi === 'sig');
    for(var i = 0; i < 8; i++){ fill(refs.exp[i], sn.exp.charAt(i) || '', sn.hi === 'exp'); }
    for(var j = 0; j < 23; j++){ fill(refs.frac[j], sn.frac.charAt(j) || '', sn.hi === 'frac'); }
    refs.bits.textContent = sn.bits ? '32 位：' + sn.bits : '';
    if(sn.hex){
      refs.hex.textContent = 'FR1 = ' + sn.hex;
      refs.hex.style.color = '#2f9e44';
    } else {
      refs.hex.textContent = 'FR1 = ？';
      refs.hex.style.color = '#b9cbd0';
    }
  },

  result: {
    big: 'C104 0000H（选 A）',
    html: '三段编码：数符 <b>1</b>（负数）；阶码 <b>3+127=130</b> = <code>10000010B</code>；尾数 <b>00001</b> 补 0 到 23 位。拼接即 <code>1100 0001 0000 0100 …</code> = <b>C104 0000H</b>。记忆锚点：<b>规格化定指数 → 加 127 得阶码 → 去 1 补零填尾数</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
