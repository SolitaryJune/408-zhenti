<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-14 随机存取方式辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 概念/推理链类动画（复制 tools/anim_concept_template.html，只改 AW.init 区域） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：什么叫"随机存取"',
    cls: 'key',
    body: '<p>随机存取的定义：存取<b>任意一个</b>存储单元所需时间相同，<b>与物理位置无关</b>。判断时只问一句——读不同位置的内容，耗时一样吗？</p>' },
  { title: 'A 选项 EPROM：是随机存取',
    cls: 'bad',
    body: '<p>EPROM 是半导体只读存储器，按地址直接选中存储单元。注意：<b>"只读"与存取方式无关</b>，可读可写说的是属性，按地址访问就是随机存取。</p>' },
  { title: 'B 选项 CDROM：不是随机存取 → 本题答案',
    cls: 'good',
    body: '<p>CDROM 是光盘，记录介质是连续的<b>螺旋光道</b>：要读某段数据必须先沿光道顺序定位，再等目标扇区旋转到激光头下方。读内圈与外圈耗时不同——<b>存取时间与位置有关</b>，属于顺序（串行）存取。</p>' },
  { title: 'C 选项 DRAM：是随机存取',
    cls: 'bad',
    body: '<p>DRAM 按行、列地址直接选中存储单元，存取时间与地址无关。虽然需要定期刷新，但"刷新"是内部维护动作，不影响它按地址随机访问的本质。</p>' },
  { title: 'D 选项 SRAM：是随机存取',
    cls: 'bad',
    body: '<p>SRAM 用触发器存位、按地址直接访问，同样满足"存取时间与位置无关"，是标准的随机存取存储器（作 Cache 用的正是它）。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B（CDROM）</b>。记忆锚点：磁带、光盘 = 顺序存取；半导体存储器（SRAM/DRAM/EPROM 等 ROM 类）= 随机存取。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011·14 哪种存储器"不采用随机存取方式"',
  subtitle: '考点：存取方式分类 · 判据：存取时间是否与物理位置无关',
  counterLabel: '推进步数',
  intro: '点击「▶ 播放」逐项推演四个选项。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '<b>CDROM（光盘）</b>沿螺旋光道顺序定位、等扇区转到读写头，存取时间随位置变化 → 顺序存取。EPROM/DRAM/SRAM 都是按地址直接选中的半导体存储器 = 随机存取。记忆锚点：判断看<b>"耗时与位置无关吗"</b>，不看介质种类、不看可读可写。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
