<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-15 MAR 的位数由什么决定</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 概念/推理链类动画（复制 tools/anim_concept_template.html，只改 AW.init 区域） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：MAR 位数看谁',
    cls: 'key',
    body: '<p>题目给了两个数：<b>地址空间 64MB</b> 与 <b>实装主存 32MB</b>（4M×8 位芯片组成）。MAR 的位数取决于 CPU 能寻址的<b>主存地址空间</b>大小，不是实装容量。</p>' },
  { title: '算地址空间：64MB = 2 的 26 次方',
    cls: 'key',
    body: '<p>64MB = 64 × 2^20B = <b>2^26 B</b>。地址空间里最大地址是 2^26 − 1，要把它装进 MAR，至少需要 <b>26 位</b>。</p>' },
  { title: '排除 C（25 位）：那是实装容量的位数',
    cls: 'bad',
    body: '<p>32MB = 2^25 B，25 位地址只能覆盖 2^25 个单元。若 MAR 只有 25 位，地址空间中<b>顶层的 32MB</b> 将永远无法被寻址到——"留待扩容"的空间也要能编址。</p>' },
  { title: '芯片规格只是干扰信息',
    cls: 'bad',
    body: '<p>"4M × 8 位芯片"决定的是芯片数量：32MB ÷ (4M × 1B) = <b>8 片</b>，以及如何分组、位扩展是否需要——与 MAR 的位数<b>无关</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D（26 位）</b>。MAR 位数 ≥ 主存地址空间的位数；实装容量只决定实际用掉的低地址段，芯片数 = 实装容量 ÷ 单片容量。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011·15 MAR 至少多少位：64MB 空间 vs 32MB 实装',
  subtitle: '考点：存储器性能指标 · 按字节编址 · 地址空间 64MB · 实装 32MB（4M×8 位芯片）',
  counterLabel: '推进步数',
  intro: '点击「▶ 播放」逐步推演 MAR 位数的计算。',
  snaps: snaps,
  result: {
    big: '答案 D（26 位）',
    html: '64MB = <b>2^26 B</b> → MAR 至少 <b>26 位</b>。25 位（2^25）只够 32MB 实装容量，顶层空间无法寻址；4M×8 位芯片只影响片数（8 片）。记忆锚点：<b>MAR 看地址空间，芯片数看实装容量</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
