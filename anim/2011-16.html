<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-16 偏移寻址方式辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 概念/推理链类动画（复制 tools/anim_concept_template.html，只改 AW.init 区域） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：偏移寻址的定义',
    cls: 'key',
    body: '<p>题干给出判定标准：<b>有效地址 EA = 某个寄存器内容 + 形式地址 A</b>。拿着这把尺子量四个选项。</p>' },
  { title: 'B 基址寻址：是偏移寻址',
    cls: 'good',
    body: '<p>EA = <b>(BR)</b> + A：基址寄存器内容加形式地址，完全符合"寄存器 + 形式地址"，用于程序重定位、扩大寻址范围。</p>' },
  { title: 'C 相对寻址：是偏移寻址',
    cls: 'good',
    body: '<p>EA = <b>(PC)</b> + A：以程序计数器 PC 为那个"寄存器"，加偏移量 A，支持程序浮动（转移目标随程序位置变化）。</p>' },
  { title: 'D 变址寻址：是偏移寻址',
    cls: 'good',
    body: '<p>EA = <b>(IX)</b> + A：变址寄存器内容加形式地址，适合数组遍历（A 指向数组首址，IX 变化）。与基址的区别只是"谁是基准谁是偏移"，不影响归类。</p>' },
  { title: 'A 间接寻址：不是偏移寻址 → 本题答案',
    cls: 'bad',
    body: '<p>间接寻址是 EA = <b>(A)</b>：先访存取出 A 单元里存的地址，再按它取操作数——关键动作是"再访存一次"，<b>没有任何"寄存器内容与形式地址相加"</b>的操作。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A（间接寻址）</b>。记忆锚点：偏移寻址 = 基址 + 变址 + 相对，公式统一为 EA = (寄存器) + A；间接寻址 = 串接访存，不是相加。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011·16 谁不属于偏移寻址',
  subtitle: '考点：指令寻址方式 · 判据：EA = (寄存器) + 形式地址 A',
  counterLabel: '推进步数',
  intro: '点击「▶ 播放」用定义逐项度量。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '基址 EA=(BR)+A、相对 EA=(PC)+A、变址 EA=(IX)+A，都是<b>寄存器 + 形式地址</b> → 属偏移寻址；间接寻址 EA=(A) 靠<b>再访存</b>拿地址，无相加操作 → 不属于。记忆锚点：<b>偏移三兄弟：基址、变址、相对</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
