<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-17 无符号 bgt 的转移条件推演</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 算法/过程类动画（复制 tools/anim_algo_template.html，只改 AW.init 区域）
     演示：bgt(无符号大于转移) → 用 A−B 的 CF/ZF 真值表逐情形推演 → 得出条件 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var refs = {};

var COLS = ['比较情形', 'CF（借位）', 'ZF（零）', 'CF + ZF', '取反后', '转移？'];
var CASES = [
  ['A > B', '0', '0', '0', '1', '转移 ✓'],
  ['A < B', '1', '0', '1', '0', '不转移'],
  ['A = B', '0', '1', '1', '0', '不转移'],
];

var SNAPS = [
  { rows:[null,null,null], cur:-1,
    cls:'shift', tag:'准备', count:0,
    log:'bgt：无符号整数比较，"大于"时转移。硬件比较 = 做减法 A−B，然后看标志位：CF 记借位，ZF 记结果是否为零' },
  { rows:[null,null,null], cur:-1,
    cls:'step', tag:'判读规则', count:1,
    log:'无符号"大于" = 减法无借位（CF=0）且结果非零（ZF=0，排除相等）。CF 与 ZF 任一为 1 都不能转移 → 条件对"CF+ZF"取反' },
  { rows:['row0',null,null], cur:0,
    cls:'ok', tag:'A > B', count:2, ribbon:{k:1, ok:true},
    log:'情形 1：A > B → 不够减的情况不存在，CF=0；结果非零，ZF=0 → CF+ZF=0，取反得 1 → 转移 ✓' },
  { rows:['row0','row1',null], cur:1,
    cls:'miss', tag:'A < B', count:3, ribbon:{k:2, ok:false},
    log:'情形 2：A < B → 不够减，CF=1；结果非零，ZF=0 → CF+ZF=1，取反得 0 → 不转移' },
  { rows:['row0','row1','row2'], cur:2,
    cls:'miss', tag:'A = B', count:4, ribbon:{k:3, ok:false},
    log:'情形 3：A = B → 无借位，CF=0；结果为零，ZF=1 → CF+ZF=1，取反得 0 → 不转移（"大于"必须排除相等）' },
  { rows:['row0','row1','row2'], cur:-1,
    cls:'ok', tag:'汇成条件', count:5,
    log:'三种情形汇总：仅当 CF=0 且 ZF=0（即"CF+ZF"取反 = 1）时转移 → 正是选项 C' },
  { rows:['row0','row1','row2'], cur:-1,
    cls:'done', tag:'排除干扰项', count:6,
    log:'A 带了 OF（溢出标志）、B/D 带了 SF（符号标志）——OF、SF 是判读带符号数用的，无符号比较"大于"用不上 → 排除' },
  { rows:['row0','row1','row2'], cur:-1,
    cls:'done', tag:'完成', count:7, done:true,
    log:'结论：bgt 的转移条件为 (CF+ZF) 取反 = 1，即 CF=0 且 ZF=0，选 C' },
];

function mkTable(stage){
  var t = AW.el('table', '');
  t.style.cssText = 'border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;';
  var thead = AW.el('thead', '');
  var htr = AW.el('tr', '');
  refs.heads = [];
  COLS.forEach(function(c){
    var th = AW.el('th', '', c);
    th.style.cssText = 'background:#f1f5f9;color:#334155;padding:9px 6px;border-bottom:2px solid #cbd5e1;font-size:12.5px;';
    htr.appendChild(th); refs.heads.push(th);
  });
  thead.appendChild(htr); t.appendChild(thead);
  var tbody = AW.el('tbody', '');
  refs.rows = []; refs.cells = [];
  CASES.forEach(function(row, ri){
    var tr = AW.el('tr', '');
    var cells = [];
    row.forEach(function(_, ci){
      var td = AW.el('td', '');
      td.style.cssText = 'padding:10px 6px;text-align:center;border-bottom:1px solid #e2e8f0;font-family:"SF Mono",Menlo,Consolas,monospace;font-weight:700;transition:all .2s;';
      tr.appendChild(td); cells.push(td);
    });
    refs.rows.push(tr); refs.cells.push(cells); tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  var box = AW.el('div', 'aw-scroll');
  box.appendChild(t);
  stage.appendChild(box);
}

function setRow(i, state, cur){
  var hot = (cur === i);
  refs.rows[i].style.background = hot ? (state === 'hit' ? '#f0fdf4' : '#fff8f8') : 'transparent';
  refs.cells[i].forEach(function(td, ci){
    var v = CASES[i][ci];
    td.textContent = v;
    td.style.opacity = '1';
    td.style.fontWeight = '700';
    if(ci === 0){ td.style.color = '#334155'; td.style.background = 'transparent'; return; }
    if(ci === 5){
      var trans = (v.charAt(0) !== '不');
      td.style.color = trans ? '#15803d' : '#b91c1c';
      td.style.background = hot ? (trans ? '#dcfce7' : '#fee2e2') : 'transparent';
      td.style.borderRadius = '8px';
      return;
    }
    td.style.color = (v === '1') ? '#92400e' : '#64748b';
    if(hot && ci >= 1 && ci <= 4){
      td.style.background = state === 'hit' ? '#dcfce7' : '#fee2e2';
      td.style.borderRadius = '6px';
    } else {
      td.style.background = 'transparent';
    }
  });
}
function dimRow(i){
  refs.rows[i].style.background = 'transparent';
  refs.cells[i].forEach(function(td, ci){
    if(ci === 0){
      td.textContent = CASES[i][0];
      td.style.color = '#334155';
      td.style.fontWeight = '700';
    } else {
      td.textContent = '·';
      td.style.color = '#94a3b8';
      td.style.fontWeight = '400';
    }
    td.style.opacity = '.45';
    td.style.background = 'transparent';
  });
}

AW.init({
  title: '2011·17 无符号整数 bgt 的转移条件',
  subtitle: '标志寄存器：<code>CF 进位/借位 · ZF 零 · SF 符号 · OF 溢出</code> · 比较 = 减法 A−B 置标志',
  counterLabel: '推演步数',
  ribbonTitle: '比较情形（✓ 转移 / ✗ 不转移）',
  intro: '点击「▶ 播放」，逐情形填写 CF/ZF 真值表。',
  snaps: SNAPS,

  build: function(stage){
    stage.innerHTML = '';
    mkTable(stage);
    var note = AW.el('div', '');
    note.style.cssText = 'margin-top:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;font-size:13px;color:#475569;line-height:1.7;';
    note.innerHTML = '判读：无符号比较只看 <b>CF</b>（不够减 → 借位 CF=1）与 <b>ZF</b>（结果为零 → ZF=1）；<b>SF、OF 是带符号比较的标志</b>，本题用不到。';
    stage.appendChild(note);
  },

  render: function(stage, sn){
    for(var i = 0; i < 3; i++){
      if(sn.rows[i] == null){ dimRow(i); }
      else { setRow(i, i === 0 ? 'hit' : 'bad', sn.cur); }
    }
  },

  result: {
    big: '答案 C：取反(CF+ZF)=1',
    html: '无符号"大于" = <b>无借位且结果非零</b>（CF=0 且 ZF=0），即"CF+ZF"取反为 <b>1</b>。干扰项混入了 <b>OF/SF</b>——那是带符号比较的标志。记忆锚点：<b>无符号看 CF/ZF，带符号才看 SF/OF</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
