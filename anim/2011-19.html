<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-19 指令执行叙述的正误辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 概念/推理链类动画（复制 tools/anim_concept_template.html，只改 AW.init 区域） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：前提与要求',
    cls: 'key',
    body: '<p>前提：<b>不采用 Cache、不采用指令预取、处于"开中断"状态</b>。要求选出<b>错误</b>的叙述——前三项是这些叙述成立的关键前提。</p>' },
  { title: 'A 每个指令周期至少访存一次：正确',
    cls: 'good',
    body: '<p>没有 Cache、没有预取，CPU 每条指令都必须<b>亲自访存取指</b>。因此每个指令周期至少访问内存一次（若还需取操作数，访存更多）。A 正确。</p>' },
  { title: 'B 指令周期 ≥ 一个时钟周期：正确',
    cls: 'good',
    body: '<p>时钟周期是 CPU 工作的<b>最小时间单位</b>：指令周期 = 取指周期 + 间址/执行/中断周期，每个机器周期又由若干时钟周期构成。指令周期 ≥ 一个时钟周期必然成立。B 正确。</p>' },
  { title: 'C NOP 不改任何寄存器：错误 → 本题答案',
    cls: 'bad',
    body: '<p>空操作指令"什么都不做"只是指<b>执行段</b>。但 NOP 仍要<b>取指、译码</b>——取指结束时会执行 <b>PC 加 1</b>，否则永远取不到下一条指令。PC 内容变了，"任何寄存器内容都不会被改变"不成立。C 错误。</p>' },
  { title: 'D 每条指令执行结束时都可能被外部中断打断：正确',
    cls: 'good',
    body: '<p>CPU 在<b>每条指令执行结束时</b>采样中断请求线。机器处于"开中断"状态，外部中断请求恰可在此处打断当前程序。D 正确。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。本质：把"执行"与"取指"分开看——NOP 的执行段确实不动寄存器，但<b>取指必改 PC</b>，这是程序顺序执行的根本机制。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011·19 指令执行的叙述，哪条错误',
  subtitle: '考点：指令执行过程 · 前提：无 Cache 无预取、开中断 · 选"错误"项',
  counterLabel: '推进步数',
  intro: '点击「▶ 播放」逐项核对四条叙述。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '<b>NOP 也要取指，取指必改 PC</b>——"任何寄存器都不变"必错。A 成立靠"无 Cache 无预取"，B 成立因时钟周期是最小单位，D 成立因开中断且中断采样在指令执行结束时。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
