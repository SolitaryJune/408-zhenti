<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-23 调度算法辨析：短任务优先且不饥饿</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两个条件缺一不可',
    cls: 'key',
    body: '<p>题干要求同时满足：<b>① 短任务优先</b>——调度时偏向要求服务时间短的作业；<b>② 不会发生饥饿</b>——任何进程最终都能被调度执行。拿这两条逐个筛选项。</p>' },
  { title: 'A 先来先服务（FCFS）',
    cls: 'bad',
    body: '<p>只按<b>到达顺序</b>调度，与任务长短无关 → 不满足①「短任务优先」。它虽然不饥饿，但第一个条件就出局。</p>' },
  { title: 'C 时间片轮转（RR）',
    cls: 'bad',
    body: '<p>按固定时间片<b>公平轮转</b>，不偏向短任务 → 不满足①。同样是"不饥饿但不挑短任务"。</p>' },
  { title: 'D 非抢占式短任务优先（SJF）',
    cls: 'bad',
    body: '<p>短任务确实优先，但只要有短任务不断到达，<b>长任务可能永远排不上</b> → 违反②「不会饥饿」，出局。</p>' },
  { title: 'B 高响应比优先（HRRN）',
    cls: 'good',
    body: '<p>响应比 R =（等待 + 要求服务）÷ 要求服务 = 1 + 等待 ÷ 服务。服务时间短 → R 大，天然<b>偏爱短任务</b>（满足①）；长任务等得越久 R 越大，<b>迟早被调度</b>（满足②）。两条全占。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：高响应比优先 = 「短任务优先」+「等待时间兜底防饥饿」；SJF 的死穴正是长任务饥饿。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-23 哪种算法「短任务优先且不会饥饿」',
  subtitle: '考点：调度算法特性对比 · 逐项推演（FCFS / HRRN / RR / SJF）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B：高响应比优先',
    html: '响应比 = 1 + <b>等待时间 ÷ 要求服务时间</b>：服务短的响应比高（短任务优先），等待久的响应比会涨上来（不饥饿）。FCFS、RR 不挑短任务；非抢占式 SJF 会让长任务饥饿。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
