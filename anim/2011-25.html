<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-25 线程不能共享的资源</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：共享 / 私有清单',
    cls: 'key',
    body: '<p>同一进程内的线程——<b>共享（进程级）</b>：代码段、数据段/全局变量、堆、打开的文件、信号；<b>私有（线程级）</b>：TCB、寄存器组（程序计数器、栈指针）、独立的栈。问"不能共享"，就找私有清单里的东西。</p>' },
  { title: 'A 进程 P 的代码段',
    cls: 'bad',
    body: '<p>进程级资源，<b>共享</b>——各线程执行的正是同一份代码，不选。</p>' },
  { title: 'B 进程 P 中打开的文件',
    cls: 'bad',
    body: '<p>打开文件表挂在<b>进程</b>上，所有线程共用，<b>共享</b>，不选。</p>' },
  { title: 'C 进程 P 的全局变量',
    cls: 'bad',
    body: '<p>全局变量在<b>数据段</b>，对所有线程可见，恰恰是线程间通信最常用的共享区，<b>共享</b>，不选。</p>' },
  { title: 'D 某线程的栈指针',
    cls: 'good',
    body: '<p>栈指针属于<b>寄存器组</b>，指示该线程自己的栈顶。线程是独立调度和执行的单位，函数调用、局部变量都压在各自栈里——若栈指针共享，两个线程同时压栈会互相破坏调用现场。<b>私有，不能共享</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：线程共享"整间屋子"（代码、数据、文件），但每人自带<b>一套寄存器和一张栈</b>——TCB、寄存器组（含栈指针、PC）、栈都是私有的。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-25 进程 P 的线程不能共享什么',
  subtitle: '考点：线程共享资源 vs 线程私有资源 · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D：某线程的栈指针',
    html: '线程<b>共享</b>：代码段、全局变量、打开的文件、堆；线程<b>私有</b>：TCB、寄存器组（栈指针、PC）、自己的栈。栈指针随线程切换保存/恢复，绝不能共享。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
