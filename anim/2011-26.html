<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-26 磁盘 I/O 请求的处理流程</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
.io-row{display:flex;align-items:stretch;justify-content:center;gap:6px;flex-wrap:wrap;padding:18px 0 6px}
.io-node{min-width:128px;padding:14px 12px;border-radius:10px;border:2px solid #5a7d8c66;background:#f8edcb;
  color:#47616c;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;
  transition:all .35s}
.io-node small{display:block;font-weight:400;font-size:11.5px;color:#586e72;margin-top:4px}
.io-node.act{border-color:#1b3a4b;background:#d9e3df;color:#1b3a4b;box-shadow:0 2px 10px rgba(37,99,235,.25)}
.io-node.ok{border-color:#2f9e44;background:#2f9e4424;color:#1e4d33}
.io-node.busy{border-color:#e07a2f;background:#f8edcb;color:#92400e}
.io-arrow{align-self:center;font-size:20px;color:#b9cbd0;font-weight:700}
.io-hint{text-align:center;font-size:13px;color:#586e72;margin-top:14px;min-height:20px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 五个节点：用户程序 → 系统调用处理程序 → 设备驱动程序 → 磁盘设备 → 中断处理程序
var NODES = [
  '用户程序<small>发出 read 请求</small>',
  '系统调用处理程序<small>陷入内核 · 识别请求</small>',
  '设备驱动程序<small>翻译命令 · 启动设备</small>',
  '磁盘设备<small>寻道/旋转/读写</small>',
  '中断处理程序<small>响应中断 · 交还结果</small>',
];

// 每步携带完整状态：'' 未到 / act 当前 / ok 完成 / busy 工作
var SNAPS = [
  { nodes:['act','','','',''], diskNote:'等待请求',
    cls:'shift', tag:'开始', count:0,
    log:'用户程序发出磁盘 I/O 请求（read 磁盘块）——请求必须经内核完成，先看它把请求交给谁' },
  { nodes:['ok','act','','',''], diskNote:'等待命令',
    cls:'step', tag:'陷入内核', count:1, ribbon:{k:1, ok:true},
    log:'用户程序执行陷入指令进入内核 → 系统调用处理程序接手，识别并登记这次磁盘 I/O 请求' },
  { nodes:['ok','ok','act','',''], diskNote:'等待命令',
    cls:'step', tag:'转交驱动', count:2, ribbon:{k:2, ok:true},
    log:'系统调用处理程序把请求转交设备驱动程序——它知道该设备的具体操作细节' },
  { nodes:['ok','ok','ok','busy',''], diskNote:'被启动',
    cls:'ok', tag:'启动设备', count:3, ribbon:{k:3, ok:true},
    log:'设备驱动程序把抽象请求翻译成设备命令，设置寄存器、启动磁盘开始工作（此后 CPU 与磁盘并行）' },
  { nodes:['ok','ok','ok','busy',''], diskNote:'读写中…',
    cls:'step', tag:'并行工作', count:4,
    log:'磁盘寻道、旋转、读写数据——这一步不需要 CPU 干预，用户进程可以继续做别的事' },
  { nodes:['ok','ok','ok','ok','act'], diskNote:'完成，发中断',
    cls:'ok', tag:'设备完成', count:5,
    log:'磁盘完成操作，控制器向 CPU 发出中断请求——注意：中断发生在设备"干完活"之后' },
  { nodes:['ok','ok','ok','ok','ok'], diskNote:'已完成',
    cls:'step', tag:'响应中断', count:6, ribbon:{k:4, ok:true},
    log:'中断处理程序响应中断、保存现场，取回数据与状态信息' },
  { nodes:['ok','ok','ok','ok','ok'], diskNote:'已完成',
    cls:'done', tag:'完成', count:7, done:true,
    log:'处理结果交还用户程序。完整顺序：用户程序 → 系统调用处理程序 → 设备驱动程序 → 中断处理程序' },
];

AW.init({
  title: '2011-26 磁盘 I/O 请求的处理流程',
  subtitle: '用户程序发出请求后，内核各环节按什么顺序接手？',
  counterLabel: '环节推进',
  ribbonTitle: '处理环节（✓ 按顺序点亮）',
  intro: '点击「▶ 播放」逐步演示各环节的接力顺序。',
  snaps: SNAPS,

  build: function(stage){
    stage.innerHTML = '';
    var row = AW.el('div', 'io-row');
    this._nodes = [];
    var self = this;
    NODES.forEach(function(label, i){
      if(i > 0) row.appendChild(AW.el('div', 'io-arrow', '→'));
      var b = AW.el('div', 'io-node', label);
      row.appendChild(b);
      self._nodes.push(b);
    });
    stage.appendChild(row);
    this._hint = AW.el('div', 'io-hint', '');
    stage.appendChild(this._hint);
  },

  render: function(stage, sn){
    var self = this;
    sn.nodes.forEach(function(st, i){
      self._nodes[i].className = 'io-node' + (st ? ' ' + st : '');
    });
    if(sn.diskNote) this._nodes[3].innerHTML = NODES[3].replace('</small>', ' · ' + sn.diskNote + '</small>');
    this._hint.innerHTML = sn.diskNote === '读写中…'
      ? '关键因果：<b>先有驱动程序启动 I/O，才有设备完成后的中断</b> —— 中断处理程序不可能排在设备驱动程序之前'
      : '凡把「中断处理程序」排在「设备驱动程序」之前的选项（A、C、D）都颠倒了因果';
  },

  result: {
    big: '答案 B',
    html: '正确流程：<b>用户程序 → 系统调用处理程序 → 设备驱动程序 → 中断处理程序</b>。驱动程序启动设备在前，设备完成后才有中断；A/C/D 都把中断处理程序排到了驱动程序前面，因果颠倒。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
