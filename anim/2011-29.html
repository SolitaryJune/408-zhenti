<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-29 抖动的有效应对措施</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：抖动的根因',
    cls: 'key',
    body: '<p>抖动（thrashing）= 系统花在<b>页面换入换出</b>上的时间远多于实际计算时间，CPU 利用率骤降。根因：<b>内存中进程太多、每进程分到的页框太少</b>，频繁缺页。有效措施必须能降低缺页率。</p>' },
  { title: 'I 撤销部分进程 —— 有效',
    cls: 'good',
    body: '<p>撤销部分进程 → <b>降低多道程序度</b>，腾出的页框分给留下的进程，每进程页框变多、缺页率随之下降。治本。</p>' },
  { title: 'II 增加磁盘交换区容量 —— 无效',
    cls: 'bad',
    body: '<p>抖动不是"交换区装不下"造成的——页面照样换进换出，只是换了地方换。<b>交换区再大，频繁缺页依旧</b>，不解决竞争页框的矛盾。</p>' },
  { title: 'III 提高用户进程的优先级 —— 无效',
    cls: 'bad',
    body: '<p>优先级属于 <b>CPU 调度</b>概念，决定谁先上处理机；它与缺页次数毫无关系，调优先级不减少页面换入换出。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>仅 I 有效，答案选 <b>A</b>。其他有效手段：工作集模型、缺页率算法（PFF）、挂起若干进程——共同思想是<b>让留下的进程拿到足够页框</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-29 系统抖动时哪些措施有效',
  subtitle: '考点：抖动的根因与对策 · 判断 I/II/III',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A：仅 I（撤销部分进程）',
    html: '抖动是<b>内存页框竞争</b>问题：撤销/挂起部分进程、工作集模型、PFF 都有效；增加交换区容量（II）和提高优先级（III）都不能降低缺页率。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
