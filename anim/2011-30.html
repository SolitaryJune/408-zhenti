<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-30 逻辑地址在哪个阶段形成</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：四阶段地址形态表',
    cls: 'key',
    body: '<p>源程序到内存执行经过：编辑 → 编译 → 链接 → 装载。<b>编辑</b>产生源程序文本（符号名）；<b>编译</b>产生目标模块（模块内从 0 编起的相对地址，模块间互相独立）；<b>链接</b>拼成完整装入模块（统一编址）；<b>装载</b>重定位成物理地址。</p>' },
  { title: 'A 编辑、B 编译 —— 都不是',
    cls: 'bad',
    body: '<p>编辑只写源代码，谈不上地址空间。编译后<b>每个目标模块各自从 0 号单元编址</b>，多个模块的地址互相重叠——这还不是整个进程统一的逻辑地址。</p>' },
  { title: 'C 链接 —— 形成逻辑地址',
    cls: 'good',
    body: '<p>链接程序把若干目标模块和库函数装配成<b>一个完整的装入模块</b>，为所有代码、数据<b>统一分配</b>相对整个模块的地址——这就是交给地址变换机构的<b>逻辑地址</b>。</p>' },
  { title: 'D 装载 —— 是使用不是形成',
    cls: 'bad',
    body: '<p>装载时进行<b>地址重定位</b>，把逻辑地址变换成物理地址。它是逻辑地址的"消费者"，不是"生产者"。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C（链接）</b>。记忆锚点：编译给出"模块内从 0 开始"的地址，<b>链接统一排定逻辑地址</b>，装载把它变成物理地址。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-30 逻辑地址在哪个阶段形成',
  subtitle: '考点：编辑 / 编译 / 链接 / 装载 的地址形态 · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C：链接',
    html: '编译后的目标模块各自从 0 编址、彼此重叠；<b>链接</b>把它们装配成统一装入模块并一次性排定逻辑地址；装载只负责把逻辑地址重定位成物理地址。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
