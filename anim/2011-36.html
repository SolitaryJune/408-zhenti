<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-36 · 哪个 MAC 协议会对收到的帧发确认</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     概念/分析类：四种 MAC 协议是否内建确认机制的辨析
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：找"会回 ACK"的 MAC 协议',
    cls: 'key',
    body: '<p>"对正确接收到的数据帧进行<b>确认</b>" = 接收方收好一帧后要回送一个 <b>ACK 确认帧</b>。逐个检查四个候选，看谁的协议里写死了这套机制。</p>' },
  { title: 'CSMA：只管"什么时候能发"',
    cls: 'bad',
    body: '<p>CSMA（载波侦听多路访问）：发前先侦听信道，忙就退避等待。它只有"何时可发"的规则，<b>没有任何确认机制</b>，接收方收到帧不回 ACK。✗</p>' },
  { title: 'CDMA：是复用技术，不是帧协议',
    cls: 'bad',
    body: '<p>CDMA（码分多址）：一种<b>信道划分/复用</b>技术，让多个站用不同码片序列在同一信道同时通信。它压根不定义"帧"和"确认"这回事。✗</p>' },
  { title: 'CSMA/CD：靠冲突检测，不靠确认',
    cls: 'bad',
    body: '<p>CSMA/CD（有线以太网）：发送方<b>边发边检测冲突</b>，检测到就停发、退避重发。差错帧由接收方校验后直接丢弃、交给上层处理，<b>MAC 层不回 ACK</b>。✗</p>' },
  { title: 'CSMA/CA：确认 + 重传是协议内建的',
    cls: 'good',
    body: '<p>CSMA/CA（802.11 无线网）：无线信道误码率高、又<b>无法边发边检测冲突</b>，所以协议规定接收方<b>正确收到帧后必须回 ACK</b>；发送方超时收不到 ACK 就重传。✓</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D（CSMA/CA）</b>。记忆锚点：<b>CA 的 A = Avoidance</b>，无线靠"确认 + 重传"弥补不可靠；CD 靠冲突检测，不需要确认。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-36 · 哪个 MAC 协议会对收到的帧发确认',
  subtitle: '考点：介质访问控制 · CSMA / CDMA / CSMA/CD / CSMA/CA 逐项辨析',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 支撑 / ✗ 排除）',
  intro: '点击「▶ 播放」逐项排查四个 MAC 协议。',
  snaps: snaps,
  result: {
    big: '答案 D（CSMA/CA）',
    html: '802.11 无线网无法边发边检测冲突，协议规定<b>接收方正确收到帧必须回 ACK</b>、发送方超时重传——这是 CSMA/CA 内建的确认机制。CSMA/CD 靠冲突检测，CSMA 无机制，CDMA 是复用技术。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
