<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-39 · TCP 第二次握手的报文段</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/分析类：三次握手字段规则（SYN/ACK、ack、seq）推理链
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：这是第二次握手',
    cls: 'key',
    body: '<p>甲发来 <code>(SYN=1, seq=11220)</code> 是<b>第一次握手</b>；乙接受连接，回送的是<b>第二次握手</b>。要逐个定三类字段：<b>SYN/ACK 标志</b>、<b>确认号 ack</b>、<b>序号 seq</b>。</p>' },
  { title: '定标志位：SYN=1，ACK=1',
    cls: 'key',
    body: '<p>第二次握手既要带<b>乙自己的同步</b>（SYN=1），又要<b>确认甲的 SYN</b>（ACK=1）。→ SYN=0、ACK=0 的 <b>A、D 直接排除</b>。</p>' },
  { title: '定确认号：ack = 甲 seq + 1',
    cls: 'key',
    body: '<p>规则：<b>SYN 报文段虽不携带数据，但要消耗一个序号</b>。甲的序号用到 11220，乙期望甲的下一个字节从 11221 开始，所以 <code>ack = 11220 + 1 = 11221</code>。B 的 ack = 11220，漏加了 SYN 占的 1，<b>排除</b>。</p>' },
  { title: '定序号：seq 是乙自己选的',
    cls: '',
    body: '<p>seq 是<b>乙自己选择</b>的初始序号，与甲的 11220 无关（题目问"可能是"，只需其余字段自洽）。四个选项里满足 SYN=1、ACK=1、ack=11221 的只有 C（seq=11221）。</p>' },
  { title: '核对 C',
    cls: 'good',
    body: '<p>C = <code>(SYN=1, ACK=1, seq=11221, ack=11221)</code>：标志位对 ✓，ack = 甲 seq + 1 ✓，seq 为乙的自选序号 ✓。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>SYN 占一个序号 → 对方的确认号 = 对方收到的 seq + 1</b>；第二次握手 = SYN 1 + ACK 1。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2011-39 · TCP 第二次握手的报文段',
  subtitle: '考点：三次握手 · 甲发 (SYN=1, seq=11220) · 乙接受连接后回什么',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 支撑 / ✗ 排除）',
  intro: '点击「▶ 播放」逐字段推演乙的应答报文段。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '第二次握手 = <b>(SYN=1, ACK=1, seq=乙自选, ack=甲 seq+1)</b>。SYN 占一个序号，所以 ack = 11220 + 1 = <b>11221</b>；A/D 缺标志位，B 的 ack 漏加 1。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
