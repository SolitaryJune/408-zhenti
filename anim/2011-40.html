<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-40 · 接收方返回的确认号</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     算法/过程类：TCP 字节序号空间倒推 + 累计确认推演
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2011-40 · 接收方返回的确认号',
  subtitle: '三个连续段 300B/400B/500B · 第 3 段序号 900 · 乙只收到第 1、3 段',
  counterLabel: '推演步数',
  ribbonTitle: '数据段（✓ 已到达 / ✗ 丢失）',
  intro: '点击「▶ 播放」逐步倒推各段字节范围。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>三个连续 TCP 段</b>（序号 = 本段第 1 个字节的编号）'));
    var line = AW.el('div', '');
    line.style.cssText = 'display:flex;align-items:flex-start;margin:10px 0 4px;';
    this._ptrs = [];
    this._boxes = [];
    for(var f = 0; f <= 2; f++){
      var col = AW.el('div', '');
      col.style.cssText = 'width:120px;display:flex;flex-direction:column;align-items:center;margin-right:14px;';
      var ptr = AW.el('div', '', '');
      ptr.style.cssText = 'height:22px;font-size:12px;font-weight:700;white-space:nowrap;';
      var box = AW.el('div', 'aw-box', '段' + (f + 1));
      box.style.width = '76px';
      var idx = AW.el('div', 'aw-idx', ['300B', '400B', '500B'][f]);
      col.appendChild(ptr);
      col.appendChild(box);
      col.appendChild(idx);
      line.appendChild(col);
      this._ptrs.push(ptr);
      this._boxes.push(box);
    }
    inner.appendChild(line);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'初始', count:0,
      st:['dim','dim','dim'], pt:{},
      log:'已知：三个连续段 300B、400B、500B，第 3 段序号 900。TCP 序号指本段第 1 个字节的编号。' },
    { cls:'step', tag:'第 3 段落位', count:1,
      st:['dim','dim','ok'], pt:{2:{t:'seq 900~1399', c:'#1b3a4b'}},
      log:'第 3 段 500B：从序号 900 起，占 900 ~ 900+500−1 = 1399。' },
    { cls:'step', tag:'第 2 段落位', count:2,
      st:['dim','ok','ok'], pt:{1:{t:'seq 500~899', c:'#1b3a4b'}, 2:{t:'seq 900~1399', c:'#1b3a4b'}},
      log:'第 2 段 400B：结束于 900−1 = 899，起始 = 899−400+1 = 500，占 500 ~ 899。' },
    { cls:'step', tag:'第 1 段落位', count:3,
      st:['ok','ok','ok'], pt:{0:{t:'seq 200~499', c:'#1b3a4b'}, 1:{t:'seq 500~899', c:'#1b3a4b'}, 2:{t:'seq 900~1399', c:'#1b3a4b'}},
      log:'第 1 段 300B：结束于 500−1 = 499，起始 = 499−300+1 = 200，占 200 ~ 499。' },
    { cls:'miss', tag:'第 2 段丢失', count:4, ribbon:{k:2, ok:false},
      st:['ok','miss','ok'], pt:{0:{t:'已收 ✓', c:'#276942'}, 1:{t:'丢失 ✗', c:'#a02830'}, 2:{t:'已收 ✓', c:'#276942'}},
      log:'乙只收到第 1、3 段，第 2 段（500~899）丢失。TCP 累计确认：连续收到的最高字节 = 499。' },
    { cls:'ok', tag:'确认号出炉', count:5,
      st:['ok','miss','ok'], pt:{0:{t:'已收 ✓', c:'#276942'}, 1:{t:'ack = 500（缺口处）', c:'#92400e'}, 2:{t:'已收 ✓', c:'#276942'}},
      log:'确认号 = 期望对方发送的下一个字节 = 499 + 1 = 500。' },
    { cls:'done', tag:'完成', count:6, done:true,
      st:['ok','miss','ok'], pt:{0:{t:'已收 ✓', c:'#276942'}, 1:{t:'ack = 500', c:'#92400e'}, 2:{t:'已收 ✓', c:'#276942'}},
      log:'结论：确认序号 = 500，选 B。即使第 3 段已到手，ack 也只指向第一个缺失字节。' },
  ],

  render: function(stage, sn){
    var st = sn.st || ['', '', ''];
    var pt = sn.pt || {};
    for(var f = 0; f <= 2; f++){
      this._boxes[f].className = 'aw-box' + (st[f] ? ' ' + st[f] : '');
      var p = pt[f];
      this._ptrs[f].innerHTML = p ? p.t : '';
      this._ptrs[f].style.color = p ? (p.c || '#213e48') : '#213e48';
    }
  },

  result: {
    big: '确认号 = 500（选 B）',
    html: 'TCP <b>累计确认</b>：确认号 = 连续收到的最高字节 + 1。第 2 段（500~899）丢失后，即使第 3 段（900~1399）已收到，ack 也只能是 <b>500</b>——直指第一个缺口字节。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
