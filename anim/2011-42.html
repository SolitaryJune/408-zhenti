<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-42 两个等长升序序列的中位数 · 折半舍弃动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var A = [11, 13, 15, 17, 19];
var B = [2, 4, 6, 8, 20];

// 一行序列：keep [s..e] 正常显示（其中 mid 位 hit），其余 dim
function seqRow(arr, s, e, mid, label){
  var chars = [], cls = [];
  arr.forEach(function(v, i){
    chars.push(String(v));
    if (i < s || i > e) cls.push('dim');
    else if (i === mid) cls.push('hit');
    else cls.push('');
  });
  return '<div class="aw-row-label" style="margin-top:2px"><b>' + label + '</b>　保留区间 [' + s + '..' + e + ']' +
         (mid != null ? '　中位数下标 ' + mid + ' → ' + arr[mid] : '') + '</div>' +
         AW.cellRow(chars, cls, null, 0);
}

function roundSnap(s1, e1, s2, e2, m1, m2, cmpHtml, discardHtml){
  return '<div>' + seqRow(A, s1, e1, m1, 'A′') + seqRow(B, s2, e2, m2, 'B′') +
         '<div style="font-size:14px;line-height:2;color:#213e48;margin-top:8px">' + cmpHtml + '</div>' +
         '<div style="font-size:13.5px;line-height:1.9;color:#586e72;margin-top:4px">' + discardHtml + '</div></div>';
}

var snaps = [
  { cls:'step', tag:'题面', count:0,
    html: seqRow(A, 0, 4, 2, 'A（原序列）') + seqRow(B, 0, 4, 2, 'B（原序列）') +
          '<div style="font-size:14px;line-height:2;color:#213e48;margin-top:8px">' +
          '两个等长升序序列，中位数 = 全体元素升序序列的第 ⌈L/2⌉ 个。<br>' +
          '合并 (2,4,6,8,11,13,15,17,19,20) 共 10 个，第 5 个是 <b>11</b> —— 下面用<b style="color:#e07a2f">折半舍弃法</b>把它找出来。</div>',
    log:'题面样例：A=(11,13,15,17,19)，B=(2,4,6,8,20)，全体中位数为 11。' },

  { cls:'shift', tag:'核心思想', count:0,
    html:'<div style="font-size:14.5px;line-height:2.1;color:#213e48">' +
         '各取当前等长子序列的中位数 a、b 比较：<br>' +
         '① <b>a = b</b> ⇒ 它就是答案；<br>' +
         '② <b>a &lt; b</b> ⇒ 舍弃 A′ 前 ⌊n/2⌋ 个 + B′ 后 ⌊n/2⌋ 个（a 留下）；<br>' +
         '③ <b>a &gt; b</b> ⇒ 舍弃 A′ 后 ⌊n/2⌋ 个 + B′ 前 ⌊n/2⌋ 个（b 留下）。<br>' +
         '每轮两序列<b>等长减半</b>；各剩 1 个时取<b>较小</b>者。</div>',
    log:'核心思想：比中位数 → 等长舍弃两半 → 各剩 1 个取较小者。' },

  { cls:'step', tag:'第 1 轮', count:1,
    html: roundSnap(0, 4, 0, 4, 2, 2,
      'a = A[2] = <b>15</b>，b = B[2] = <b>6</b>；<b>a &gt; b</b>（情况③）。',
      '舍弃 A′ 后 ⌊5/2⌋=2 个（17、19），舍弃 B′ 前 2 个（2、4）；中位数 a=15、b=6 都保留。') ,
    log:'第 1 轮：a=15 > b=6，弃 A 后 2 个、B 前 2 个。' },

  { cls:'step', tag:'第 2 轮', count:2,
    html: roundSnap(0, 2, 2, 4, 1, 3,
      'A′ = (11,13,15)，B′ = (6,8,20)，仍等长（3 个）。<br>a = A[1] = <b>13</b>，b = B[3] = <b>8</b>；<b>a &gt; b</b>（情况③）。',
      '舍弃 A′ 后 1 个（15），舍弃 B′ 前 1 个（6）。'),
    log:'第 2 轮：a=13 > b=8，弃 A 后 1 个、B 前 1 个。' },

  { cls:'step', tag:'第 3 轮', count:3,
    html: roundSnap(0, 1, 3, 4, 0, 3,
      'A′ = (11,13)，B′ = (8,20)，等长（2 个）。<br>a = A[0] = <b>11</b>（⌈2/2⌉=第 1 个），b = B[3] = <b>8</b>；<b>a &gt; b</b>（情况③）。',
      '舍弃 A′ 后 1 个（13），舍弃 B′ 前 1 个（8）。'),
    log:'第 3 轮：a=11 > b=8，弃 A 后 1 个、B 前 1 个。' },

  { cls:'ok', tag:'收尾：各剩 1 个', count:4,
    html: seqRow(A, 0, 0, null, 'A′') + seqRow(B, 4, 4, null, 'B′') +
          '<div style="font-size:14px;line-height:2;color:#213e48;margin-top:8px">' +
          '两子序列各剩一个元素：11 与 20。取<b>较小者 11</b>，即两序列的中位数。<br>' +
          '验证：合并序列 (2,4,6,8,<b>11</b>,13,15,17,19,20) 的第 5 个恰是 11 ✓</div>',
    log:'各剩 1 个：min(11, 20) = 11，与题干样例吻合。' },

  { cls:'step', tag:'复杂度', count:5,
    html:'<div style="font-size:14.5px;line-height:2.2;color:#213e48">' +
         '<b>时间</b>：每轮两个子序列长度同时减半，O(log₂n) 轮、每轮 O(1) 次比较 ⇒ <b>O(log₂n)</b>。<br>' +
         '<b>空间</b>：只用 start1/end1/start2/end2 几个下标变量，不搬元素 ⇒ <b>O(1)</b>。<br>' +
         '对比：直接归并找第 ⌈L/2⌉ 个要 O(n) 时间；两次二分查找的朴素做法为 O(log²n)——折半舍弃更优。</div>',
    log:'每轮等长减半：时间 O(log₂n)；只用常数个下标：空间 O(1)。' },

  { cls:'done', tag:'结论', count:6, done:true,
    html:'<div style="font-size:15px;line-height:2.1;color:#213e48">' +
         '第 1 问：比中位数、等长舍弃（a&lt;b 弃 A 头 B 尾；a&gt;b 弃 A 尾 B 头；奇数长度时中位数保留）。<br>' +
         '第 2 问：四个下标变量 + 中点比较，本轮样例三轮收敛到 <b>11</b>。<br>' +
         '第 3 问：时间 <b style="color:#276942;font-size:17px">O(log₂n)</b>、空间 <b style="color:#276942;font-size:17px">O(1)</b>。</div>',
    log:'结论：折半舍弃法三问齐答，样例结果 11，复杂度 O(log₂n) / O(1)。' },
];

AW.init({
  title: '2011-42 · 两个等长升序序列的中位数',
  subtitle: '样例 <code>A=(11,13,15,17,19)　B=(2,4,6,8,20)</code> · 折半舍弃法逐轮演示',
  counterLabel: '轮次',
  intro: '点击「▶ 播放」看两序列如何等长减半、收敛到中位数。',
  snaps: snaps,
  result: {
    big: '中位数 11 · O(log₂n) 时间 / O(1) 空间',
    html: '每轮取两子序列中位数 a、b 比较：a&gt;b 弃 A′ 尾部与 B′ 头部各 ⌊n/2⌋ 个（a&lt;b 对称），<b>奇数长度时中位数本身要保留</b>，保证两序列始终等长；各剩 1 个时取较小者。样例三轮收敛：15/6 → 13/8 → 11/8 → min(11,20)=<b>11</b>。时间 O(log₂n)，空间 O(1)。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
