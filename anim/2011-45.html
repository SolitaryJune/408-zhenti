<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011-45 银行叫号问题：信号量设计与时序</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
.bp-semwrap{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bp-sem{padding:6px 14px;border-radius:8px;background:#f8edcb;border:1px solid #1b3a4b26;font-size:13.5px;color:#213e48;transition:all .3s}
.bp-sem b{font-family:Menlo,Consolas,monospace;font-size:15px;color:#3730a3;margin-left:4px}
.bp-sem.hot{background:#fef9c3;border-color:#fbbf24;box-shadow:0 1px 8px rgba(251,191,36,.4)}
.bp-seats{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.bp-seatlbl{font-size:12.5px;color:#586e72;width:88px;text-align:right;margin-right:2px}
.bp-seat{width:44px;height:42px;border-radius:8px;border:2px solid #5a7d8c66;background:#f8edcb;color:#b9cbd0;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;transition:all .3s}
.bp-seat.busy{border-color:#2f9e44;background:#2f9e4424;color:#1e4d33}
.bp-actor{max-width:680px;margin:0 auto 8px;padding:9px 14px;border-radius:8px;font-size:13.5px;
  border:1px solid #1b3a4b26;background:#f8edcb;color:#213e48;transition:all .3s;min-height:20px}
.bp-actor.clerk{background:#1b3a4b14;border-color:#d9e3df}
.bp-actor .who{font-weight:700;margin-right:8px}
.bp-actor.cust .who{color:#b45309}
.bp-actor.clerk .who{color:#1b3a4b}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 每步携带完整状态：座位占用、四个信号量值、双方当前动作、正在操作的信号量
function BP(seats, m, e, f, s, hot, cust, clerk, cls, tag, count, log, ribbon){
  return { state:{seats:seats, m:m, e:e, f:f, s:s, hot:hot, cust:cust, clerk:clerk},
           cls:cls, tag:tag, count:count, log:log, ribbon:ribbon || null, done:false };
}
function seats(a){ var r = []; for(var i = 0; i < 10; i++) r.push(a[i] || 0); return r; }

var SNAPS = [
  BP(seats([]), 1, 10, 0, 0, null,
    '（尚无顾客）', 'P(full)：full=0 无顾客，营业员阻塞休息',
    'shift', '初始', 0,
    '初始：mutex=1（取号机空闲）、empty=10（10 个空座位）、full=0（无等待顾客）、service=0（还没人可叫）'),
  BP(seats([1]), 1, 9, 0, 0, 'e',
    '顾客1：P(empty) 10→9，坐进座位', 'P(full)：仍在等待',
    'step', '顾客1 到达', 0,
    '顾客 1 到达：P(empty) 申请空座位（10→9），坐进等候区——P(empty) 必须在 P(mutex) 之前，先有座位再碰取号机'),
  BP(seats([1]), 1, 9, 0, 0, 'm',
    '顾客1：P(mutex) 取号（号 1）→ V(mutex)', 'P(full)：仍在等待',
    'step', '取号', 0,
    '顾客 1 互斥使用取号机：P(mutex) 1→0 取号，V(mutex) 0→1 释放——一次只允许一位顾客取号'),
  BP(seats([1]), 1, 9, 1, 0, 'f',
    '顾客1：V(full) 0→1，登记「有人在等」', 'P(full) 满足，被唤醒',
    'ok', '通知营业员', 0,
    '顾客 1 执行 V(full)：等待顾客数 0→1，把阻塞中的营业员唤醒——先挂号再等叫号，信号不会丢'),
  BP(seats([1]), 1, 9, 1, 0, 's',
    '顾客1：P(service) 等叫号（阻塞）', '即将 P(full) 请顾客',
    'step', '等叫号', 0,
    '顾客 1 执行 P(service)：service=0，阻塞等待被叫——顾客这边的事做完了，安心等号'),
  BP(seats([]), 1, 10, 0, 0, null,
    '顾客1：被叫号唤醒，离开座位走向窗口', 'P(full) 1→0 → V(empty) 9→10 → V(service) 叫 1 号',
    'ok', '叫号', 0,
    '营业员：P(full) 请到顾客（1→0）；V(empty) 空出座位（9→10）；V(service) 叫 1 号，唤醒顾客 1'),
  BP(seats([]), 1, 10, 0, 0, null,
    '顾客1：获取服务 → 服务完毕离开', '为 1 号顾客服务中…',
    'ok', '服务完毕', 1, {k:1, ok:true},
    '顾客 1 获取服务并完成——mutex 管互斥、empty/full 管座位、service 管一对一叫号，一轮协作闭环'),
  BP(seats([1,1]), 1, 8, 2, 0, 'e',
    '顾客2、3 到达：P(empty)×2（10→8），各自取号，V(full)×2（0→2）', 'P(full) 请到顾客',
    'step', '顾客2、3 到达', 1,
    '顾客 2、3 先后到达：各占一个座位（empty 10→8）、互斥取号、各执行一次 V(full)（0→2）'),
  BP(seats([0,1]), 1, 9, 1, 0, 'f',
    '顾客2：被叫号唤醒 → 获取服务', 'P(full) 2→1 → V(empty) 8→9 → V(service) 叫 2 号',
    'ok', '服务顾客2', 2, {k:2, ok:true},
    '营业员接待顾客 2：P(full)（2→1）、V(empty)（8→9）、V(service) 叫号——每位顾客占用一个座位、一次服务'),
  BP(seats([0,0]), 1, 10, 0, 0, 's',
    '顾客3：被叫号唤醒 → 获取服务', 'P(full) 1→0 → V(empty) 9→10 → V(service) 叫 3 号',
    'ok', '服务顾客3', 3, {k:3, ok:true},
    '营业员接待顾客 3。若座位满员（empty=0），后续顾客在 P(empty) 上阻塞，进不了等候区——这就是座位数的作用'),
  BP(seats([]), 1, 10, 0, 0, null,
    '——', 'while(TRUE) 循环：P(full) 等下一位…',
    'done', '结论', 3,
    '答案：mutex=1 互斥取号机；empty=10 空座位数；full=0 等待顾客数；service=0 叫号同步。顺序要点：顾客先 P(empty) 再 P(mutex)、先 V(full) 再 P(service)'),
];
SNAPS[SNAPS.length - 1].done = true;

AW.init({
  title: '2011-45 银行叫号：信号量怎么设、P/V 怎么排',
  subtitle: '1 个服务窗口 · 10 个等候座位 · 取号机一次一人（顾客-营业员 = 生产者-消费者变体）',
  counterLabel: '已服务顾客',
  ribbonTitle: '已服务顾客（✓ 完成服务）',
  intro: '点击「▶ 播放」逐步演示顾客与营业员的协作时序。',
  snaps: SNAPS,

  build: function(stage){
    stage.innerHTML = '';
    this._sem = AW.el('div', 'bp-semwrap');
    stage.appendChild(this._sem);
    var seatRow = AW.el('div', 'bp-seats');
    seatRow.appendChild(AW.el('div', 'bp-seatlbl', '等候座位'));
    this._seatEls = [];
    for(var i = 0; i < 10; i++){
      var d = AW.el('div', 'bp-seat', '座' + (i + 1));
      seatRow.appendChild(d);
      this._seatEls.push(d);
    }
    stage.appendChild(seatRow);
    this._cust = AW.el('div', 'bp-actor cust');
    this._clerk = AW.el('div', 'bp-actor clerk');
    stage.appendChild(this._cust);
    stage.appendChild(this._clerk);
  },

  render: function(stage, sn){
    var st = sn.state;
    var self = this;
    var SEMS = [['mutex', st.m], ['empty', st.e], ['full', st.f], ['service', st.s]];
    this._sem.innerHTML = SEMS.map(function(x){
      return '<span class="bp-sem' + (st.hot === x[0] ? ' hot' : '') + '">' + x[0] + ' =<b>' + x[1] + '</b></span>';
    }).join('');
    st.seats.forEach(function(v, i){
      self._seatEls[i].className = 'bp-seat' + (v ? ' busy' : '');
    });
    this._cust.innerHTML = '<span class="who">顾客</span>' + st.cust;
    this._clerk.innerHTML = '<span class="who">营业员</span>' + st.clerk;
  },

  result: {
    big: '答案：4 个信号量 + 正确的 P/V 顺序',
    html: '信号量：<b>mutex=1</b>（互斥取号机）、<b>empty=10</b>（空座位数）、<b>full=0</b>（等待顾客数）、<b>service=0</b>（叫号同步）。<br/>' +
      '顾客：P(empty) → P(mutex) → 取号 → V(mutex) → <b>V(full) → P(service)</b> → 获取服务；<br/>' +
      '营业员：while(TRUE){ P(full) → V(empty) → V(service) → 为顾客服务 }。<br/>' +
      '关键顺序：先占座再取号（P(empty) 在 P(mutex) 前），先挂号再等叫（V(full) 在 P(service) 前）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
