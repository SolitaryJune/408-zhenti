<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-01 递归求阶乘的时间复杂度</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/推理链类：递归展开推导 T(n)
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>代码只有两个动作：出口 <code>if (n &lt;= 1) return 1</code>，递归体 <code>return n * fact(n-1)</code>。递归规模每次<b>减 1</b>，每层只做常数次操作。考点：<b>递归调用次数 × 每层工作量</b>。</p>' },
  { title: '展开递归调用链',
    cls: '',
    body: '<p>fact(4) → fact(3) → fact(2) → fact(1)：单路递归、不分叉，共 <b>4 次调用</b>。一般地，从 fact(n) 递归到 fact(1) 共调用 <b>n 次</b>。</p>' },
  { title: '数每层的工作量',
    cls: '',
    body: '<p>每层只执行：1 次比较（<code>n &lt;= 1</code>）、1 次乘法、1 次返回——都是 <b>O(1)</b> 常数操作。函数体里没有任何循环，也没有对长度为 n 的结构做扫描。</p>' },
  { title: '总复杂度',
    cls: 'good',
    body: '<p>总操作数 = 调用次数 × 每层工作 = n × O(1) = <b>O(n)</b>。</p>' },
  { title: '逐项排除',
    cls: 'bad',
    body: '<p>A「O(log<sub>2</sub> n)」：需要规模<b>折半</b>（如二分查找），这里是每次减 1，错。</p>' +
          '<p>C「O(n log<sub>2</sub> n)」、D「O(n<sup>2</sup>)」：需要每层做 O(n) 级工作（递归中套循环），本题没有，错。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B（O(n)）</b>。记忆锚点：<b>单路递归、规模每次减 1、每层 O(1) ⇒ 总复杂度 O(n)</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '递归求阶乘的时间复杂度',
  subtitle: '题 1 · <code>int fact(int n)</code> 单路递归 · 逐层推导 T(n)',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B · O(n)',
    html: 'fact(n) → fact(n−1) → … → fact(1) 共 <b>n 次调用</b>，每层只有常数工作，T(n) = n × O(1) = <b>O(n)</b>。干扰项 A 来自「折半」直觉，C/D 来自「每层还要扫一遍」的联想——这段递归里都没有。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
