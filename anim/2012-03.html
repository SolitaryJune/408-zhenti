<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-03 前序+后序确定根的孩子 · 结构演示</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
<style>
  .bt-svg{width:100%;max-width:620px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .bt-svg .edge{stroke:#5a7d8c;stroke-width:2.5px}
  .bt-svg .node circle{fill:#1b3a4b;stroke:#1b3a4b;stroke-width:2.5px;transition:fill .35s}
  .bt-svg .node text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:16px;
    text-anchor:middle;dominant-baseline:central;fill:#fff}
  .bt-svg .node.hot circle{fill:#e07a2f;stroke:#9a3412}
  .bt-svg .node.hidden-el{opacity:0}
  .seq-label{font-size:13px;color:#586e72;margin:10px 0 4px}
  .seq-label b{color:#213e48}
  .seq-wrap{display:flex;justify-content:center}
  .hformula{margin-top:12px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 2012-03 前序+后序 → 根的孩子（SVG + 序列指针） ==================
 * 题：前序 a,e,b,d,c、后序 b,c,d,e,a，根结点的孩子？（答案 A：只有 e）
 * 演示：前序第 2 个 = e 且后序倒数第 2 = e ⇒ a 若有两个孩子则矛盾 ⇒ 只有唯一孩子 e。 */

/* 各阶段结点坐标（5 结点链，孩子可左可右）与可见性 */
var NODE_IDS = ['a', 'e', 'b', 'd', 'c'];
var VIEWS = [
  { pos:{}, vis:[] },
  { pos:{a:[310,45]}, vis:['a'], hot:['a'] },
  { pos:{a:[310,45]}, vis:['a'], hot:['a'] },
  { pos:{a:[310,45]}, vis:['a'], hot:['a'] },
  { pos:{a:[310,45], e:[310,115]}, vis:['a','e'], hot:['e'] },
  { pos:{a:[310,45], e:[310,115], b:[310,185]}, vis:['a','e','b'], hot:['b'] },
  { pos:{a:[310,45], e:[310,115], b:[310,185], d:[310,255], c:[310,325]}, vis:['a','e','b','d','c'], hot:['d','c'] },
  { pos:{a:[310,45], e:[240,115], b:[170,185], d:[100,255], c:[30,325]}, vis:['a','e','b','d','c'], hot:[] },
  { pos:{a:[310,45], e:[240,115], b:[170,185], d:[100,255], c:[30,325]}, vis:['a','e','b','d','c'], hot:['e'] },
];
var EDGE_VIS = [ false, false, false, false, true, true, true, true, true ];
/* 序列行配色：[前序5格, 后序5格] + 指针 */
var ROWVIEW = [
  { pre:['dim','dim','dim','dim','dim'], post:['dim','dim','dim','dim','dim'], pptr:{}, qptr:{} },
  { pre:['hit','','','',''], post:['','','','','hit'], pptr:{1:'前序第1个=根'}, qptr:{5:'后序最后=根'} },
  { pre:['','hit','','',''], post:['','','','hit',''], pptr:{2:'前序第2个'}, qptr:{4:'后序倒数第2'} },
  { pre:['','hit','','',''], post:['','','','hit',''], pptr:{2:'若有两个孩子：这是左子树的根'}, qptr:{4:'而这应是右子树最后访问的点'} },
  { pre:['','hit','','',''], post:['','','','hit',''], pptr:{}, qptr:{} },
  { pre:['','hit','','',''], post:['','','','hit',''], pptr:{}, qptr:{} },
  { pre:['','','','',''], post:['','','','',''], pptr:{}, qptr:{} },
  { pre:['','','','',''], post:['','','','',''], pptr:{}, qptr:{} },
  { pre:['','hit','','',''], post:['','','','hit',''], pptr:{2:'孩子关系由序列定死'}, qptr:{4:'与左右挂法无关'} },
];
var FORMULAS = [
  '题：前序 = a,e,b,d,c；后序 = b,c,d,e,a。问根 a 的孩子',
  '定根：前序第一个 = <code>a</code>，后序最后一个也 = a ✓',
  '对比关键位：前序第 2 个 = <code>e</code>，后序倒数第 2 个 = <code>e</code> —— 是同一个结点！',
  '若 a 有两个孩子：前序第 2 个应是<b>左</b>子树的根，后序倒数第 2 个应在<b>右</b>子树里 —— 两个位置分属两棵不相交的子树，不可能是同一个 e ⇒ 矛盾',
  '∴ a 不可能有两个孩子，也先证不出零个（前序有 e 跟随）⇒ a 只有<b>唯一孩子 e</b>',
  '递归看 e 的子树：前序 e 之后 3 个（b,d,c）＝ 后序 e 之前 3 个（b,c,d）⇒ 同理 e 只有唯一孩子 b',
  'b→d→c 同理 —— 整棵树是链 a−e−b−d−c，孩子关系全部确定',
  '但每个孩子挂左还是挂右不定（图中全挂左只是其中一种）⇒ 中序不唯一，<b>根的孩子</b>却是确定的',
  '根的孩子 = 只有 <b>e</b>（选 A）',
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 620 360');
  svg.setAttribute('class', 'bt-svg');
  for (var k = 0; k < 4; k++){
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('class', 'edge hidden-el');
    ln.dataset.idx = k;
    svg.appendChild(ln);
  }
  NODE_IDS.forEach(function(id){
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'node hidden-el');
    g.dataset.id = id;
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('r', 21);
    var t = document.createElementNS(svgNS, 'text');
    t.textContent = id;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
  });
  stage.appendChild(svg);
  var preBox = AW.el('div', 'seq-wrap');
  var postBox = AW.el('div', 'seq-wrap');
  stage.appendChild(AW.el('div', 'seq-label', '<b>前序遍历</b>：a, e, b, d, c'));
  stage.appendChild(preBox);
  stage.appendChild(AW.el('div', 'seq-label', '<b>后序遍历</b>：b, c, d, e, a'));
  stage.appendChild(postBox);
  var formulaBox = AW.el('div', 'hformula');
  stage.appendChild(formulaBox);
  this._svg = svg; this._preBox = preBox; this._postBox = postBox; this._formulaBox = formulaBox;
}

function render(stage, sn, i){
  var svg = this._svg;
  var v = VIEWS[Math.min(i, VIEWS.length - 1)];
  var chainPos = ['a','e','b','d','c'].map(function(id){ return v.pos[id]; });
  [].forEach.call(svg.querySelectorAll('.node'), function(el){
    var id = el.dataset.id, p = v.pos[id];
    if (p){
      el.querySelector('circle').setAttribute('cx', p[0]);
      el.querySelector('circle').setAttribute('cy', p[1]);
      var t = el.querySelector('text');
      t.setAttribute('x', p[0]); t.setAttribute('y', p[1]);
    }
    el.classList.toggle('hidden-el', v.vis.indexOf(id) < 0);
    el.classList.remove('hot');
    if (v.hot.indexOf(id) >= 0) el.classList.add('hot');
  });
  [].forEach.call(svg.querySelectorAll('.edge'), function(el, k){
    var A = chainPos[k], B = chainPos[k + 1];
    if (A && B && EDGE_VIS[Math.min(i, EDGE_VIS.length - 1)]){
      el.setAttribute('x1', A[0]); el.setAttribute('y1', A[1]);
      el.setAttribute('x2', B[0]); el.setAttribute('y2', B[1]);
    }
    el.classList.toggle('hidden-el', !(A && B && EDGE_VIS[Math.min(i, EDGE_VIS.length - 1)]));
  });
  var rv = ROWVIEW[Math.min(i, ROWVIEW.length - 1)];
  this._preBox.innerHTML = '';
  this._preBox.appendChild(AW.cellRow(['a','e','b','d','c'], rv.pre, rv.pptr));
  this._postBox.innerHTML = '';
  this._postBox.appendChild(AW.cellRow(['b','c','d','e','a'], rv.post, rv.qptr));
  this._formulaBox.innerHTML = FORMULAS[Math.min(i, FORMULAS.length - 1)] || '';
}

var SNAPS = [
  { cls:'shift', tag:'审题', count:0,
    log:'前序 a,e,b,d,c、后序 b,c,d,e,a。问：根结点 a 的孩子是谁？用「关键位对比」来锁定。' },
  { cls:'ok', tag:'定根', count:1,
    log:'前序第一个就是根：a；后序最后一个也是 a，互相印证。' },
  { cls:'step', tag:'关键位对比', count:2,
    log:'前序第 2 个是 e，后序倒数第 2 个也是 e —— 两个关键位置指向同一个结点！' },
  { cls:'miss', tag:'两个孩子？矛盾', count:3,
    log:'反设 a 有两个孩子：前序第 2 个必是左子树的根；后序倒数第 2 个必是右子树里最后访问的结点。左右子树不相交，这两处不可能是同一个 e ⇒ a 不可能有两个孩子。' },
  { cls:'ok', tag:'唯一孩子 e', count:4,
    log:'前序中 e 紧跟 a，说明 e 这个孩子存在且唯一 ⇒ 根 a 只有孩子 e（本题所问已解决）。' },
  { cls:'step', tag:'递归推进', count:5,
    log:'继续看 e 的子树：前序 e 后面 3 个 = b,d,c；后序 e 前面 3 个 = b,c,d。同样道理，e 只有唯一孩子 b。' },
  { cls:'ok', tag:'整树是链', count:6,
    log:'b→d、d→c 同理逐层唯一 ⇒ 整棵树是链 a−e−b−d−c，孩子关系完全确定。' },
  { cls:'shift', tag:'左右仍不定', count:7,
    log:'注意：每个孩子挂左还是挂右没有信息决定（图中是全挂左的一种）。中序序列会随挂法变，但「谁是谁的孩子」不变。' },
  { cls:'done', tag:'完成', count:8, done:true,
    log:'根结点只有孩子 e，选 A。' },
];

AW.init({
  title: '2012-03 · 前序 a,e,b,d,c ＋ 后序 b,c,d,e,a，根的孩子是？',
  subtitle: '考点：前序＋后序可确定每个结点的<b>孩子数</b> · 关键位对比：<code>前序第2个 vs 后序倒数第2个</code>',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」：先定位根，再对比两个序列的关键位置，推出 a 只有一个孩子 e。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 A · 根只有孩子 e',
    html: '前序第 2 个（=e）与后序倒数第 2 个（=e）重合 ⇒ 若 a 有两个孩子，这两处应分属左、右两棵不相交的子树，矛盾 ⇒ ' +
      '<b>a 只有唯一孩子 e</b>。继续递归得整树为链 a−e−b−d−c（左右挂法不定、中序不定，孩子关系确定）。<br>' +
      '记忆锚点：<code>前序第2个 ＝ 后序倒数第2个 ⇒ 根只有一个孩子</code>。',
  },
});
</script>
</body>
</html>
