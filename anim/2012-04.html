<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-04 平衡因子全为1的AVL树 · 构树演示</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
<style>
  .avl-svg{width:100%;max-width:640px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .avl-svg .edge{stroke:#5a7d8c;stroke-width:2px;transition:opacity .4s}
  .avl-svg .node circle{fill:#1b3a4b;stroke:#1b3a4b;stroke-width:2px;transition:fill .35s, stroke .35s}
  .avl-svg .node text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:14px;
    text-anchor:middle;dominant-baseline:central;fill:#fff}
  .avl-svg .node.leaf circle{fill:#2f9e44;stroke:#1e4d33}
  .avl-svg .node.hot circle{fill:#e07a2f;stroke:#9a3412}
  .avl-svg .node.bal circle{stroke:#e07a2f;stroke-width:4px}
  .avl-svg .hidden-el{opacity:0}
  .avl-svg .lvl{font-size:11.5px;font-weight:700;fill:#b9cbd0;font-family:Menlo,monospace}
  .avl-svg .lvlline{stroke:#1b3a4b26;stroke-width:1.5;stroke-dasharray:3 5}
  .hformula{margin-top:12px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
  .hformula .kf{color:#e63946}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 2012-04 平衡因子全 1 的 AVL（SVG 逐层构树） ==================
 * 题：高度为 6、所有非叶结点平衡因子均为 1 的平衡二叉树，结点总数？（答案 B = 20）
 * 递推：N(h) = N(h−1) + N(h−2) + 1；N(1)=1, N(2)=2 ⇒ 4, 7, 12, 20。
 * 演示：把满足条件的树逐层"长"出来，直观验证递推。 */

var LVL_Y = [30, 100, 170, 240, 310, 380];   /* 6 层 */
var NODES = [
  { id:'A', x:310, y:30,  step:2, leaf:false },
  { id:'B', x:200, y:100, step:2, leaf:false },
  { id:'C', x:430, y:100, step:2, leaf:false },
  { id:'D', x:120, y:170, step:3, leaf:false },
  { id:'E', x:280, y:170, step:3, leaf:false },
  { id:'F', x:360, y:170, step:3, leaf:false },
  { id:'G', x:500, y:170, step:3, leaf:false },
  { id:'H', x:70,  y:240, step:4, leaf:false },
  { id:'I', x:180, y:240, step:4, leaf:false },
  { id:'P', x:235, y:240, step:4, leaf:false },
  { id:'Q', x:300, y:240, step:4, leaf:true  },
  { id:'S', x:355, y:240, step:4, leaf:false },
  { id:'T', x:420, y:240, step:4, leaf:true  },
  { id:'V', x:480, y:240, step:4, leaf:true  },
  { id:'J', x:40,  y:310, step:5, leaf:false },
  { id:'K', x:105, y:310, step:5, leaf:true  },
  { id:'O', x:160, y:310, step:5, leaf:true  },
  { id:'R', x:215, y:310, step:5, leaf:true  },
  { id:'U', x:295, y:310, step:5, leaf:true  },
  { id:'N', x:20,  y:380, step:5, leaf:true  },
];
var EDGES = [
  { a:'A', b:'B', step:2 }, { a:'A', b:'C', step:2 },
  { a:'B', b:'D', step:3 }, { a:'B', b:'E', step:3 },
  { a:'C', b:'F', step:3 }, { a:'C', b:'G', step:3 },
  { a:'D', b:'H', step:4 }, { a:'D', b:'I', step:4 },
  { a:'E', b:'P', step:4 }, { a:'E', b:'Q', step:4 },
  { a:'F', b:'S', step:4 }, { a:'F', b:'T', step:4 },
  { a:'G', b:'V', step:4 },
  { a:'H', b:'J', step:5 }, { a:'H', b:'K', step:5 },
  { a:'J', b:'N', step:5 }, { a:'I', b:'O', step:5 },
  { a:'P', b:'R', step:5 }, { a:'S', b:'U', step:5 },
];
var COUNTS = [0, 0, 3, 7, 14, 20, 20, 20, 20];
var FORMULAS = [
  '题：AVL 树高度 6，所有非叶结点平衡因子均为 1（左比右高 1 层）⇒ 形状被完全确定',
  '递推：N(h) = N(h−1) + N(h−2) + 1；N(1) = 1，N(2) = 2',
  '画根（第 6 层系统）：根 + 左子树（高5）+ 右子树（高4）',
  '展开高 5/高 4 子树：B(左5右3)、C(左3右2) ⇒ 已画 7 个',
  '继续展开高 3/高 2 子树 ⇒ 已画 14 个',
  '最后一轮展开高 2/高 1 ⇒ 20 个，全树画完（绿 = 叶子）',
  '校验：每个非叶结点（橙圈）都是 左高 − 右高 = 1 ✓，树高恰 6 层 ✓',
  '递推核算：N(1)=1 → N(2)=2 → N(3)=4 → N(4)=7 → N(5)=12 → <code class="kf">N(6)=20</code>',
  '结点总数 = <b>20</b>（选 B）',
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 620 415');
  svg.setAttribute('class', 'avl-svg');
  /* 层参考线与层号 */
  LVL_Y.forEach(function(y, k){
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', 8); ln.setAttribute('y1', y);
    ln.setAttribute('x2', 612); ln.setAttribute('y2', y);
    ln.setAttribute('class', 'lvlline hidden-el');
    ln.dataset.step = 2;
    svg.appendChild(ln);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', 14); t.setAttribute('y', y - 5);
    t.setAttribute('class', 'lvl hidden-el');
    t.dataset.step = 2;
    t.textContent = '第' + (k + 1) + '层';
    svg.appendChild(t);
  });
  EDGES.forEach(function(e){
    var A = null, B = null;
    NODES.forEach(function(n){ if (n.id === e.a) A = n; if (n.id === e.b) B = n; });
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y);
    ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
    ln.setAttribute('class', 'edge hidden-el');
    ln.dataset.step = e.step;
    svg.appendChild(ln);
  });
  NODES.forEach(function(n){
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'node' + (n.leaf ? ' leaf' : '') + ' hidden-el');
    g.dataset.id = n.id; g.dataset.step = n.step; g.dataset.leaf = n.leaf ? '1' : '0';
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 17);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y);
    t.textContent = n.id;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
  });
  stage.appendChild(svg);
  var formulaBox = AW.el('div', 'hformula');
  stage.appendChild(formulaBox);
  this._svg = svg; this._formulaBox = formulaBox;
}

function render(stage, sn, i){
  var svg = this._svg;
  [].forEach.call(svg.querySelectorAll('.node'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
    el.classList.remove('hot', 'bal');
    if (+el.dataset.step === i) el.classList.add('hot');
    if (i >= 6 && el.dataset.leaf === '0') el.classList.add('bal');
  });
  [].forEach.call(svg.querySelectorAll('.edge'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  [].forEach.call(svg.querySelectorAll('.lvl, .lvlline'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  this._formulaBox.innerHTML = FORMULAS[Math.min(i, FORMULAS.length - 1)] || '';
}

var SNAPS = [
  { cls:'shift', tag:'审题', count:0,
    log:'高度 6、每个非叶结点平衡因子都 = 1 —— 即左子树恰好比右子树高 1 层。这个条件把树的形状完全定死了，结点数唯一。' },
  { cls:'shift', tag:'递推公式', count:0,
    log:'设 N(h) 为满足条件的树的最小结点数（此处形状唯一，就是结点数）：根 + 左子树 h−1 + 右子树 h−2 ⇒ N(h) = N(h−1) + N(h−2) + 1，N(1)=1、N(2)=2。' },
  { cls:'step', tag:'画根', count:3,
    log:'第 6 层系统：根 A，左子树高 5、右子树高 4（保证平衡因子 = 1）。先画 3 个顶点。' },
  { cls:'step', tag:'展开 ①', count:7,
    log:'B（高5系统）= 左高4 + 右高3 ⇒ 添 D、E；C（高4系统）= 左高3 + 右高2 ⇒ 添 F、G。共 3 + 4 = 7 个。' },
  { cls:'step', tag:'展开 ②', count:14,
    log:'D(4)=H,I；E(3)=P,Q；F(3)=S,T；G(2)=V ⇒ 再添 7 个，累计 14。高 2 的系统 = 根 + 一个左孩子（如 I、P、S）。' },
  { cls:'step', tag:'展开 ③', count:20,
    log:'H(3)=J,K；J(2)=N；I(2)=O；P(2)=R；S(2)=U ⇒ 再添 6 个，累计 20，全树画完。绿色是叶子。' },
  { cls:'ok', tag:'条件校验', count:20,
    log:'检查每个非叶结点（橙圈）：左子树恰比右子树高 1 层 ⇒ 平衡因子全为 1 ✓；树恰占满 6 层 ⇒ 高度为 6 ✓。' },
  { cls:'ok', tag:'递推核算', count:20,
    log:'纯递推验证：N(1)=1，N(2)=2，N(3)=2+1+1=4，N(4)=4+2+1=7，N(5)=7+4+1=12，N(6)=12+7+1=20 ✓' },
  { cls:'done', tag:'完成', count:20, done:true,
    log:'结点总数 20，选 B。' },
];

AW.init({
  title: '2012-04 · 高度 6、平衡因子全为 1 的 AVL 树有多少结点？',
  subtitle: '递推 <code>N(h) = N(h−1) + N(h−2) + 1</code> · 斐波那契型构树，逐层画出来验证',
  counterLabel: '已画结点',
  intro: '点击「▶ 播放」：看这棵「左恰比右高 1 层」的 AVL 树一层层长到 20 个结点。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 B · 20 个结点',
    html: '平衡因子全 1 ⇒ 根的左子树高 h−1、右子树高 h−2 ⇒ <code>N(h)=N(h−1)+N(h−2)+1</code>。<br>' +
      'N(1)=1 → N(2)=2 → N(3)=4 → N(4)=7 → N(5)=12 → <b>N(6)=20</b>。' +
      '记忆锚点：<code>1, 2, 4, 7, 12, 20 —— 每项 = 前两项之和 + 1</code>（选 C 的 32、D 的 33 多是把"满树"概念掺了进来）。',
  },
});
</script>
</body>
</html>
