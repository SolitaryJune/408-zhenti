<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-05 邻接表有向图BFS的复杂度</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/分析推理类：BFS 复杂度拆解
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>n 个结点、e 条边的<b>有向图</b>，<b>邻接表</b>存储，做<b>广度优先遍历（BFS）</b>。复杂度 = <b>访问顶点</b>的开销 ＋ <b>扫描边</b>的开销，两部分分开算。</p>' },
  { title: '顶点部分：O(n)',
    cls: '',
    body: '<p>每个顶点入队、出队<b>恰好一次</b>，并做一次 visited 标记 ⇒ 共 n 次基本操作 ⇒ <b>O(n)</b>。</p>' },
  { title: '边部分：O(e)',
    cls: '',
    body: '<p>顶点出队时顺它的边链表走一遍。有向图中每条弧只出现在<b>弧尾</b>顶点的链表里 ⇒ 全部链表合计恰好 <code>e</code> 个弧结点，每条弧只被扫描一次 ⇒ <b>O(e)</b>。</p>' },
  { title: '合计',
    cls: 'good',
    body: '<p>O(n) ＋ O(e) = <b>O(n + e)</b>。</p>' },
  { title: '逐项排除',
    cls: 'bad',
    body: '<p>B「O(e)」：漏了 O(n)——每个顶点至少访问一次；e 可能远小于 n，不能省略。</p>' +
          '<p>D「O(ne)」：混淆存储结构——<b>邻接矩阵</b>上每个顶点出队后要扫整行 n 个单元，总量级才是 O(n²)；邻接表按需只存存在的弧。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C（O(n+e)）</b>。对比记忆：<b>邻接表 O(n+e)，邻接矩阵 O(n²)</b>（DFS 同理）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '邻接表存储的有向图 BFS 复杂度',
  subtitle: 'n 个结点 · e 条边 · 邻接表 · 广度优先遍历 · 开销两分法',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C · O(n+e)',
    html: '顶点各入队出队一次 O(n) ＋ 每条弧只在弧尾链表中被扫一次 O(e) = <b>O(n+e)</b>。<br>记住对照组：<b>邻接矩阵</b>上 BFS/DFS 是 O(n²)——选 D 的同学是把两种存储结构搞混了。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
