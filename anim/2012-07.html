<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-07 Dijkstra最短路径生成次序</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     算法/过程类：Dijkstra 逐轮选点+松弛，dist 表随轮更新
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var VERTS = ['a','b','c','d','e','f'];

var vRow, dRow;

function build(stage){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var lbl1 = AW.el('div', 'aw-row-label', '<b>顶点</b>（绿＝已确定最短路径、选入 S）');
  vRow = AW.el('div', 'aw-cells');
  var lbl2 = AW.el('div', 'aw-row-label', '<b>dist 值</b>（本轮刚更新/新增的用亮色标出）');
  dRow = AW.el('div', 'aw-cells');
  wrap.appendChild(lbl1); wrap.appendChild(vRow);
  wrap.appendChild(lbl2); wrap.appendChild(dRow);
  stage.appendChild(wrap);
}

function distClass(sn, v){
  if (sn.sel === v) return 'hit';
  if (sn.upd.indexOf(v) >= 0) return 'ok';
  if (sn.dist[v] === '∞') return 'dim';
  return '';
}

function render(stage, sn){
  vRow.innerHTML = '';
  var vCls = VERTS.map(function(v){
    return (sn.inS.indexOf(v) >= 0) ? 'hit' : '';
  });
  vRow.appendChild(AW.cellRow(VERTS, vCls));
  dRow.innerHTML = '';
  var dCls = VERTS.map(function(v){ return distClass(sn, v); });
  var chars = VERTS.map(function(v){ return sn.dist[v]; });
  dRow.appendChild(AW.cellRow(chars, dCls));
}

AW.init({
  title: 'Dijkstra 算法：从源点 a 出发的最短路径生成次序',
  subtitle: '弧集 <code>a→b=2, a→c=5, b→c=1, b→d=3, c→d=3, c→e=4, c→f=1, d→e=1, d→f=4, e→f=1</code>',
  counterLabel: '已确定顶点',
  ribbonTitle: '各轮选入 S 的顶点（✓）',
  intro: '点击「▶ 播放」逐轮执行：选当前 dist 最小的未定顶点 → 松弛它的出边。',

  build: build,
  render: render,

  snaps: [
    { cls:'shift', tag:'初始化', log:'初始：dist(a)=0，其余均为 ∞，S=∅。每轮从未确定顶点中选 dist 最小者加入 S，并松弛其出边。',
      dist:{a:'0',b:'∞',c:'∞',d:'∞',e:'∞',f:'∞'}, inS:[], sel:null, upd:[] },
    { cls:'ok', tag:'第 1 轮', log:'选 a(0) 加入 S；松弛出边：a→b 得 dist(b)=2，a→c 得 dist(c)=5。',
      dist:{a:'0',b:'2',c:'5',d:'∞',e:'∞',f:'∞'}, inS:['a'], sel:'a', upd:['b','c'], count:1, ribbon:{k:1, ok:true} },
    { cls:'ok', tag:'第 2 轮 · 第一条', log:'选 dist 最小的 b(2) —— 题干第一条最短路径就是 a→b。松弛：b→c 使 dist(c)=min(5, 2+1)=3（更新），b→d 使 dist(d)=2+3=5（新增）。',
      dist:{a:'0',b:'2',c:'3',d:'5',e:'∞',f:'∞'}, inS:['a','b'], sel:'b', upd:['c','d'], count:2, ribbon:{k:2, ok:true} },
    { cls:'ok', tag:'第 3 轮 · 第二条', log:'选 c(3) —— 题干第二条。松弛：c→d 得 3+3=6，大于已有 5，保留 5；c→e 得 7；c→f 得 4。',
      dist:{a:'0',b:'2',c:'3',d:'5',e:'7',f:'4'}, inS:['a','b','c'], sel:'c', upd:['e','f'], count:3, ribbon:{k:3, ok:true} },
    { cls:'ok', tag:'第 4 轮', log:'候选 d=5、e=7、f=4 → 选 f(4)！正是 c→f=1 这条短弧让 f 抢先于 d。f 无出边，无松弛。',
      dist:{a:'0',b:'2',c:'3',d:'5',e:'7',f:'4'}, inS:['a','b','c','f'], sel:'f', upd:[], count:4, ribbon:{k:4, ok:true} },
    { cls:'ok', tag:'第 5 轮', log:'候选 d=5、e=7 → 选 d(5)。松弛 d→e：5+1=6 小于 7，dist(e) 更新为 6。',
      dist:{a:'0',b:'2',c:'3',d:'5',e:'6',f:'4'}, inS:['a','b','c','f','d'], sel:'d', upd:['e'], count:5, ribbon:{k:5, ok:true} },
    { cls:'ok', tag:'第 6 轮', log:'只剩 e(6) → 选入 S。全部顶点的最短路径确定完毕。',
      dist:{a:'0',b:'2',c:'3',d:'5',e:'6',f:'4'}, inS:['a','b','c','f','d','e'], sel:'e', upd:[], count:6, ribbon:{k:6, ok:true} },
    { cls:'done', tag:'完成', log:'生成次序：b → c → f → d → e。题干已给第一条 b、第二条 c，其后依次是 f、d、e。',
      dist:{a:'0',b:'2',c:'3',d:'5',e:'6',f:'4'}, inS:['a','b','c','f','d','e'], sel:null, upd:[], count:6, done:true },
  ],

  result: {
    big: 'f → d → e',
    html: '第三、四、五条最短路径的目标顶点依次是 <b>f(4)、d(5)、e(6)</b>，答案选 <b>C</b>。<br>关键一幕：<code>c→f=1</code> 这条短弧使 dist(f)=4 排到 dist(d)=5 之前——Dijkstra 每轮只认「当前 dist 最小」，不认邻接远近。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
