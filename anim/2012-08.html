<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-08 最小生成树四命题判断</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/辨析类：MST 四命题逐项判断
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>四个命题围绕两件事：<b>代价（权值和）唯一性</b> 与 <b>树形态唯一性</b>。核心结论先记住：<b>MST 代价必唯一，形态未必唯一</b>（有权值相同的边时）。</p>' },
  { title: '命题 I：代价唯一 ✓',
    cls: 'good',
    body: '<p>I「最小生成树的代价唯一」：<b>对</b>。无论选到哪棵 MST，n−1 条边的权值和都相同——代价唯一性与形态唯一性是两回事。</p>' },
  { title: '命题 II：最小边必在 ✗',
    cls: 'bad',
    body: '<p>II「所有权值最小的边一定出现在所有 MST 中」：<b>错</b>。反例：三角形三边权值全为 1，任取两条边都是 MST——任何一条「权值最小的边」都可以缺席某棵 MST。</p>' },
  { title: '命题 III：Prim 起点无关 ✗',
    cls: 'bad',
    body: '<p>III「Prim 从不同顶点开始得到的结果一定相同」：<b>错</b>。存在并列权值的边时，不同起点贪心顺序不同，可能长出<b>不同形态</b>的 MST（代价仍相等）。</p>' },
  { title: '命题 IV：两算法总不同 ✗',
    cls: 'bad',
    body: '<p>IV「Prim 与 Kruskal 得到的 MST 总不相同」：<b>错</b>。当 MST 唯一（如各边权互不相同）时，两个算法得到的就是<b>同一棵</b>树。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有 I 正确 ⇒ 答案选 <b>A（仅 I）</b>。锚点：<b>代价唯一 ⇏ 形态唯一</b>；「一定 / 总不」这类绝对化表述在 MST 判断题里几乎都是坑。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '最小生成树：四个命题逐项判断',
  subtitle: '命题 I 代价唯一 · II 最小边必在 · III Prim 起点无关 · IV 两算法总不同',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐项判断，注意区分「代价唯一」与「形态唯一」。',
  snaps: snaps,
  result: {
    big: '答案 A · 仅 I',
    html: 'MST 的<b>代价必唯一</b>，但<b>形态未必唯一</b>——II（并列最小边可缺席）、III（Prim 不同起点）、IV（唯一时两算法同解）都栽在「形态唯一性」上。<br>反例模型：三边形三边等权，任取两条边都是 MST。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
