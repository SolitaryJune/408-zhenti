<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-09 3阶B-树删除关键字78</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     算法/过程类：B-树删除 → 下溢 → 兄弟借键（父子轮换）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var rootRow, midRow, leafRow;

function nodeEl(keys, classes){
  var n = AW.el('div', 'aw-cells');
  n.style.border = '2px solid #cbd5e1';
  n.style.borderRadius = '10px';
  n.style.padding = '3px';
  n.style.gap = '3px';
  keys.forEach(function(k, i){
    var b = AW.el('div', 'aw-box' + (classes && classes[i] ? ' ' + classes[i] : ''), k);
    b.style.width = '40px';
    b.style.height = '40px';
    b.style.borderWidth = '0';
    n.appendChild(b);
  });
  return n;
}

function build(stage){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var lbl1 = AW.el('div', 'aw-row-label', '<b>根结点</b>');
  rootRow = AW.el('div', 'aw-cells');
  var lbl2 = AW.el('div', 'aw-row-label', '<b>中间结点</b>（左 / 右）');
  midRow = AW.el('div', 'aw-cells');
  midRow.style.gap = '60px';
  var lbl3 = AW.el('div', 'aw-row-label', '<b>叶结点</b>（从左到右；删除发生在最右叶 [78]）');
  leafRow = AW.el('div', 'aw-cells');
  leafRow.style.gap = '26px';
  wrap.appendChild(lbl1); wrap.appendChild(rootRow);
  wrap.appendChild(lbl2); wrap.appendChild(midRow);
  wrap.appendChild(lbl3); wrap.appendChild(leafRow);
  stage.appendChild(wrap);
}

/* 按 sn.mode 计算各结点的关键字与高亮：
   init / find / under / check / rotate / done */
function treeState(mode){
  var st = {};
  st.root = { keys:['45'], cls:[''] };
  st.midL = { keys:['17','35'], cls:['',''] };
  st.leaves = [
    { keys:['10'], cls:[''] },
    { keys:['21'], cls:[''] },
    { keys:['37'], cls:[''] },
    { keys:['47'], cls:[''] }
  ];
  if (mode === 'init'){
    st.midR = { keys:['55','65'], cls:['',''] };
    st.leaves.push({ keys:['60','62'], cls:['',''] });
    st.leaves.push({ keys:['78'], cls:[''] });
  } else if (mode === 'find'){
    st.midR = { keys:['55','65'], cls:['',''] };
    st.leaves.push({ keys:['60','62'], cls:['',''] });
    st.leaves.push({ keys:['78'], cls:['miss'] });
  } else if (mode === 'under'){
    st.midR = { keys:['55','65'], cls:['',''] };
    st.leaves.push({ keys:['60','62'], cls:['ok','ok'] });
    st.leaves.push({ keys:[''], cls:['miss'] });
  } else if (mode === 'check'){
    st.midR = { keys:['55','65'], cls:['',''] };
    st.leaves.push({ keys:['60','62'], cls:['ok','ok'] });
    st.leaves.push({ keys:[''], cls:['miss'] });
  } else if (mode === 'rotate'){
    st.midR = { keys:['55','65'], cls:['','hit'] };
    st.leaves.push({ keys:['60','62'], cls:['','hit'] });
    st.leaves.push({ keys:[''], cls:[''] });
  } else { // done
    st.midR = { keys:['55','62'], cls:['','ok'] };
    st.leaves.push({ keys:['60'], cls:[''] });
    st.leaves.push({ keys:['65'], cls:['ok'] });
  }
  return st;
}

function render(stage, sn){
  var st = treeState(sn.mode);
  rootRow.innerHTML = '';
  rootRow.appendChild(nodeEl(st.root.keys, st.root.cls));
  midRow.innerHTML = '';
  midRow.appendChild(nodeEl(st.midL.keys, st.midL.cls));
  midRow.appendChild(nodeEl(st.midR.keys, st.midR.cls));
  leafRow.innerHTML = '';
  st.leaves.forEach(function(nd){
    leafRow.appendChild(nodeEl(nd.keys, nd.cls));
  });
}

AW.init({
  title: '3 阶 B-树：删除关键字 78',
  subtitle: '3 阶 ⇒ 每个结点关键字数 <code>1 ~ 2</code>，下限 ⌈3/2⌉−1 = 1 · 根 [45] · 最右叶 [78]',
  counterLabel: '操作步',
  ribbonTitle: '关键判定（✓ / ✗）',
  intro: '点击「▶ 播放」演示删除 78 的完整流程：定位 → 删除 → 查下溢 → 借键。',

  build: build,
  render: render,

  snaps: [
    { cls:'shift', tag:'初始', log:'一棵 3 阶 B-树：根 [45]，中间 [17 35] 与 [55 65]，叶从左到右 10 / 21 / 37 / 47 / 60 62 / 78。任务：删除关键字 78。', mode:'init' },
    { cls:'miss', tag:'定位 78', log:'78 位于最右叶结点 [78] 中，且是叶结点——可以直接删除，无需先与后继交换。', mode:'find', ribbon:{k:1, ok:false} },
    { cls:'miss', tag:'下溢！', log:'删除后该结点剩 0 个关键字，低于 3 阶 B-树的下限 ⌈3/2⌉−1 = 1 → 发生下溢，必须调整。', mode:'under', count:2 },
    { cls:'step', tag:'查兄弟', log:'同父左兄弟 [60 62] 有 2 个关键字 ≥ ⌈3/2⌉ = 2 → 「够借」，走借键路线而非合并。', mode:'check', count:3, ribbon:{k:2, ok:true} },
    { cls:'shift', tag:'借键·旋转', log:'借键的标准动作是「父子轮换」：左兄弟最大键 62 上升到父结点，父结点分隔键 65 下降到被删叶结点。', mode:'rotate', count:4, ribbon:{k:3, ok:false} },
    { cls:'ok', tag:'调整完成', log:'结果：父结点 [55 62]，最右叶 [65]，各结点关键字数回到 1~2 的合法范围，仍是一棵合法 3 阶 B-树。', mode:'done', count:5, ribbon:{k:4, ok:true} },
    { cls:'done', tag:'结论', log:'最右叶结点中的关键字是 65，答案选 D。', mode:'done', count:6, done:true },
  ],

  result: {
    big: '最右叶 [65] · 答案 D',
    html: '删除 78 → 叶结点下溢 → 左兄弟 [60 62] 够借 → <b>62 上父、65 下子</b> → 最右叶变为 <b>[65]</b>。<br>易错：借键必须<b>经过父结点中转</b>（父键是兄弟间的分隔键），把 62 直接平移进叶结点会破坏 B-树的有序结构。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
