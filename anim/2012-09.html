<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-09 3阶B-树删除关键字78 · 结构演示</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
  .btree-svg{width:100%;max-width:700px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .notrans *{transition:none!important}
  .btree-svg .tedge{stroke:#5a7d8c;stroke-width:2.5px;transition:stroke .35s,stroke-width .35s}
  .btree-svg .tedge.hot{stroke:#e63946;stroke-width:4px}
  .btree-svg .tedge.g{stroke:#2f9e44;stroke-width:4px}
  .btree-svg .nborder{fill:#fff;stroke:#1b3a4b;stroke-width:2px;rx:9}
  .btree-svg .kslot{fill:#f8edcb;stroke:#5a7d8c66;stroke-width:1.5px}
  .btree-svg .kslot.ok{fill:#2f9e4424;stroke:#2f9e44}
  .btree-svg .kslot.hit{fill:#f8edcb;stroke:#e07a2f;stroke-width:2.5px}
  .btree-svg .kslot.miss{fill:#e6394620;stroke:#e63946;stroke-width:2.5px}
  .btree-svg .kslot.ghost{fill:#fff;stroke:#e63946;stroke-width:2px;stroke-dasharray:5 4}
  .btree-svg .ktext{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:14px;
    fill:#1b3a4b;text-anchor:middle;dominant-baseline:central;transition:opacity .3s}
  .btree-svg .dim-slot .ktext{opacity:.35}
  .btree-svg .rowcap{font-size:12px;fill:#586e72;text-anchor:middle;font-weight:700}
  .hformula{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 2012-09 3阶B-树删除 78（SVG 结构演示） ==================
 * 题图：根 [45]；中间 [17 35] [55 65]；叶 10 / 21 / 37 / 47 / [60 62] / [78]。
 * 删 78 → 最右叶下溢 → 同父左兄弟 [60 62] 够借 → 62 上父、65 下叶 → 最右叶 [65]，选 D。 */

var SLOT_W = 44, SLOT_H = 42, GAP = 4, PAD = 3;
var NODE_POS = {
  R:  { x:330, y:45,  cap:'根' },
  ML: { x:150, y:143, cap:'中间·左' },
  MR: { x:480, y:143, cap:'中间·右' },
  L1: { x:50,  y:245 }, L2: { x:150, y:245 }, L3: { x:250, y:245 },
  L4: { x:355, y:245 }, L5: { x:480, y:245, cap:'左兄弟' }, L6: { x:595, y:245, cap:'最右叶' },
};
/* 每个结点的槽数（决定外框宽度；L6 预留 2 槽以显示空位） */
var NODE_SLOTS = { R:1, ML:2, MR:2, L1:1, L2:1, L3:1, L4:1, L5:2, L6:2 };
var TEDGES = [
  { id:'R-ML', a:'R', b:'ML' }, { id:'R-MR', a:'R', b:'MR' },
  { id:'ML-L1', a:'ML', b:'L1' }, { id:'ML-L2', a:'ML', b:'L2' }, { id:'ML-L3', a:'ML', b:'L3' },
  { id:'MR-L4', a:'MR', b:'L4' }, { id:'MR-L5', a:'MR', b:'L5' }, { id:'MR-L6', a:'MR', b:'L6' },
];
/* 每步各结点的槽状态：{t: 文本, c: ''|ok|hit|miss|ghost} */
var BASE = {
  R:  [{t:'45', c:''}],
  ML: [{t:'17', c:''}, {t:'35', c:''}],
  MR: [{t:'55', c:''}, {t:'65', c:''}],
  L1: [{t:'10', c:''}], L2: [{t:'21', c:''}], L3: [{t:'37', c:''}], L4: [{t:'47', c:''}],
  L5: [{t:'60', c:''}, {t:'62', c:''}],
  L6: [{t:'78', c:''}],
};
function S(t, c){ return {t:t, c:c || ''}; }
function stepState(mode){
  var st = {
    R:  [S('45')], ML: [S('17'), S('35')],
    L1: [S('10')], L2: [S('21')], L3: [S('37')], L4: [S('47')],
  };
  if (mode === 'init'){ st.MR = [S('55'), S('65')]; st.L5 = [S('60'), S('62')]; st.L6 = [S('78')]; }
  else if (mode === 'find'){ st.MR = [S('55'), S('65')]; st.L5 = [S('60'), S('62')]; st.L6 = [S('78', 'miss')]; }
  else if (mode === 'under'){ st.MR = [S('55'), S('65')]; st.L5 = [S('60'), S('62')]; st.L6 = [S('', 'ghost')]; }
  else if (mode === 'check'){ st.MR = [S('55'), S('65')]; st.L5 = [S('60', 'ok'), S('62', 'ok')]; st.L6 = [S('', 'ghost')]; }
  else if (mode === 'rotate'){ st.MR = [S('55'), S('65 ↓', 'hit')]; st.L5 = [S('60'), S('62 ↑', 'hit')]; st.L6 = [S('', 'ghost')]; }
  else { st.MR = [S('55'), S('62', 'ok')]; st.L5 = [S('60')]; st.L6 = [S('65', 'ok')]; }
  return st;
}
/* 每步边样式 */
var ESTEPS = {
  init:   { 'R-ML':'', 'R-MR':'', 'MR-L4':'', 'MR-L5':'', 'MR-L6':'' },
  find:   { 'R-ML':'', 'R-MR':'hot', 'MR-L4':'', 'MR-L5':'', 'MR-L6':'hot' },
  under:  { 'R-ML':'', 'R-MR':'hot', 'MR-L4':'', 'MR-L5':'', 'MR-L6':'hot' },
  check:  { 'R-ML':'', 'R-MR':'', 'MR-L4':'', 'MR-L5':'g', 'MR-L6':'' },
  rotate: { 'R-ML':'', 'R-MR':'', 'MR-L4':'', 'MR-L5':'g', 'MR-L6':'g' },
  done:   { 'R-ML':'', 'R-MR':'', 'MR-L4':'', 'MR-L5':'', 'MR-L6':'g' },
};
var FORMULAS = [
  '3 阶 B-树：每个非根结点关键字数 ∈ <code>[⌈3/2⌉−1, 3−1] = [1, 2]</code>',
  '定位：45 → 55 65 → 78，78 在最右叶且是<b>叶结点</b> → 可直接删除',
  '删除后剩 <code>0 &lt; 1</code>（下限 ⌈3/2⌉−1）→ <b>下溢</b>，必须调整',
  '左兄弟 [60 62] 有 2 个关键字 ≥ ⌈3/2⌉ = 2 → <b>够借</b>，不合并',
  '借键 = 父子轮换：兄最大键 <code>62 ↑上父</code>，父分隔键 <code>65 ↓下子</code>',
  '父 [55 62]、最右叶 [65]，全部回到 [1, 2] 合法区间',
  '最右叶结点中的关键字 = <b>65</b> → 选 D',
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 660 300');
  svg.setAttribute('class', 'btree-svg');
  this._edges = {}; this._slots = {}; this._slotTexts = {};
  TEDGES.forEach(function(e){
    var A = NODE_POS[e.a], B = NODE_POS[e.b];
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y + SLOT_H / 2 + PAD + 1);
    ln.setAttribute('y2', B.y - SLOT_H / 2 - PAD - 1);
    ln.setAttribute('x2', B.x);
    ln.setAttribute('class', 'tedge');
    this._edges[e.id] = ln;
    svg.appendChild(ln);
  }, this);
  Object.keys(NODE_POS).forEach(function(id){
    var n = NODE_POS[id], nSlots = NODE_SLOTS[id];
    var w = nSlots * SLOT_W + (nSlots - 1) * GAP + 2 * PAD;
    var g = document.createElementNS(svgNS, 'g');
    var border = document.createElementNS(svgNS, 'rect');
    border.setAttribute('x', n.x - w / 2); border.setAttribute('y', n.y - SLOT_H / 2 - PAD);
    border.setAttribute('width', w); border.setAttribute('height', SLOT_H + 2 * PAD);
    border.setAttribute('rx', 9);
    border.setAttribute('class', 'nborder');
    g.appendChild(border);
    this._slots[id] = []; this._slotTexts[id] = [];
    for (var s = 0; s < nSlots; s++){
      var sx = n.x - w / 2 + PAD + s * (SLOT_W + GAP);
      var r = document.createElementNS(svgNS, 'rect');
      r.setAttribute('x', sx); r.setAttribute('y', n.y - SLOT_H / 2);
      r.setAttribute('width', SLOT_W); r.setAttribute('height', SLOT_H);
      r.setAttribute('rx', 6);
      r.setAttribute('class', 'kslot');
      var t = document.createElementNS(svgNS, 'text');
      t.setAttribute('x', sx + SLOT_W / 2); t.setAttribute('y', n.y);
      t.setAttribute('class', 'ktext');
      g.appendChild(r); g.appendChild(t);
      this._slots[id].push(r); this._slotTexts[id].push(t);
    }
    if (n.cap){
      var cap = document.createElementNS(svgNS, 'text');
      cap.setAttribute('x', n.x); cap.setAttribute('y', n.y - SLOT_H / 2 - PAD - 8);
      cap.setAttribute('class', 'rowcap');
      cap.textContent = n.cap;
      g.appendChild(cap);
    }
    svg.appendChild(g);
  }, this);
  stage.appendChild(svg);
  var formulaBox = AW.el('div', 'hformula');
  stage.appendChild(formulaBox);
  this._svg = svg; this._formulaBox = formulaBox;
}

function render(stage, sn, i){
  var self = this;
  var mode = sn.mode || 'init';
  var st = stepState(mode);
  var es = ESTEPS[mode] || ESTEPS.init;
  TEDGES.forEach(function(e){
    var ln = self._edges[e.id];
    ln.setAttribute('class', 'tedge' + (es[e.id] ? ' ' + es[e.id] : ''));
  });
  Object.keys(NODE_POS).forEach(function(id){
    var slots = st[id];
    for (var s = 0; s < NODE_SLOTS[id]; s++){
      var item = slots[s] || S('', 'ghost');
      self._slotTexts[id][s].textContent = item.t;
      self._slots[id][s].setAttribute('class', 'kslot' + (item.c ? ' ' + item.c : ''));
    }
  });
  this._formulaBox.innerHTML = FORMULAS[Math.min(i, FORMULAS.length - 1)] || '';
}

var SNAPS = [
  { cls:'shift', tag:'初始', mode:'init', count:0,
    log:'一棵 3 阶 B-树（题图）：根 [45]，中间 [17 35] 与 [55 65]，叶从左到右 10 / 21 / 37 / 47 / [60 62] / [78]。任务：删除关键字 78。' },
  { cls:'miss', tag:'定位 78', mode:'find', count:1, ribbon:{k:1, ok:false},
    log:'沿 45 → 55 65 → 78 找到：78 在最右叶结点 [78] 中，且是叶结点 → 可直接删除，无需先与后继交换。' },
  { cls:'miss', tag:'下溢！', mode:'under', count:2,
    log:'删除后该结点剩 0 个关键字，低于 3 阶 B-树的下限 ⌈3/2⌉−1 = 1 → 发生下溢（红虚线空位），必须调整。' },
  { cls:'step', tag:'查兄弟', mode:'check', count:3, ribbon:{k:2, ok:true},
    log:'同父左兄弟 [60 62] 有 2 个关键字 ≥ ⌈3/2⌉ = 2 → 「够借」，走借键路线而非合并（兄弟只剩下限个数才合并）。' },
  { cls:'shift', tag:'借键·父子轮换', mode:'rotate', count:4, ribbon:{k:3, ok:true},
    log:'借键的标准动作是「父子轮换」：左兄弟最大键 62 上升到父结点补位，父结点分隔键 65 下降到被删叶结点 —— 62 不能直接平移进叶！' },
  { cls:'ok', tag:'调整完成', mode:'done', count:5, ribbon:{k:4, ok:true},
    log:'结果：父结点 [55 62]，左兄弟 [60]，最右叶 [65]，各结点关键字数回到 1~2 的合法区间，仍是一棵合法 3 阶 B-树。' },
  { cls:'done', tag:'结论', mode:'done', count:6, done:true,
    log:'最右叶结点中的关键字是 65 → 选 D。' },
];

AW.init({
  title: '2012-09 3阶B-树：删除关键字 78',
  subtitle: '3 阶 ⇒ 每个非根结点关键字数 <code>1 ~ 2</code> · 题图：根 [45]，最右叶 [78]，其同父左兄弟 [60 62]',
  counterLabel: '操作步',
  ribbonTitle: '关键判定（✓ / ✗）',
  intro: '点击「▶ 播放」演示删除 78 的完整流程：定位 → 删除 → 查下溢 → 借键（父子轮换）。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '最右叶 [65] · 答案 D',
    html: '删除 78 → 叶结点下溢 → 同父左兄弟 [60 62] 够借 → <b>62 上父、65 下叶</b> → 最右叶变为 <b>[65]</b>。<br>' +
      '易错：借键必须<b>经过父结点中转</b>——父结点的 65 是两兄弟间的"分隔键"，62 直接平移进叶会破坏父结点的有序分隔职责（A/B/C 的共同来源）。<br>' +
      '口诀：<code>兄弟够借就"转"——兄最大键上父，父分隔键下子</code>。',
  },
});
</script>
</body>
</html>
