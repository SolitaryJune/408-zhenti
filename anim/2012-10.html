<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-10 每趟至少定位一个元素的排序</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/辨析类：五种排序"每趟定位"性质逐项判断
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：判定标准',
    cls: 'key',
    body: '<p>「一趟」＝对所有尚未确定最终位置的元素处理一遍。判定标准：每趟结束后是否<b>必有元素被「钉死」在最终位置</b>（此后不再参与任何移动）。</p>' },
  { title: 'I 简单选择排序 ✓',
    cls: 'good',
    body: '<p>每趟从未排序区选出<b>最小者</b>，换到未排序区头部——该元素到达最终位置，此后不再参与比较与移动。<b>✓ 满足</b>。</p>' },
  { title: 'II 希尔排序 ✗',
    cls: 'bad',
    body: '<p>按增量分组做插入排序：同一元素在不同趟、不同增量组里<b>来回移动</b>，任何元素都不保证落定最终位置。<b>✗ 不满足</b>。</p>' },
  { title: 'III 快速排序 ✓',
    cls: 'good',
    body: '<p>每趟<b>枢纽（pivot）元素归位</b>——它左侧都不大于它、右侧都不小于它，最终位置确定。<b>✓ 满足</b>。</p>' },
  { title: 'IV 堆排序 ✓',
    cls: 'good',
    body: '<p>每趟把<b>堆顶</b>（当前最大值）与无序区末尾元素交换——堆顶元素落到最终位置。<b>✓ 满足</b>。</p>' },
  { title: 'V 二路归并排序 ✗',
    cls: 'bad',
    body: '<p>每趟只是把有序子段<b>两两归并</b>成更长的有序段；「有序」≠「位置最终」，除最后一趟外元素仍会整体移动，无人被钉死。<b>✗ 不满足</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>满足的是 I、III、IV ⇒ 答案选 <b>A</b>。口诀：<b>每趟有元素「归位」的是选排、快排、堆排；希尔、归并不保证。</b></p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '哪些排序每趟都至少确定一个元素的最终位置',
  subtitle: 'I 选择 · II 希尔 · III 快速 · IV 堆 · V 二路归并 · 逐项判定',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐项判断，标准是「每趟是否有元素被钉死在最终位置」。',
  snaps: snaps,
  result: {
    big: '答案 A · 仅 I、III、IV',
    html: '选排（选最小者到位）、快排（pivot 归位）、堆排（堆顶沉底）每趟都<b>钉死一个元素</b>；希尔、归并的元素还要跨趟移动。<br>最大的坑是 V：归并出的「有序段」≠「位置最终」。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
