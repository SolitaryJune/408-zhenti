<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-11 折半插入与直接插入的差异</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     概念/辨析类：折半插入 vs 直接插入 逐项对比
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：唯一的区别在哪',
    cls: 'key',
    body: '<p>折半插入排序 ＝ 直接插入排序中把「在有序区里<b>找插入位置</b>」由顺序比较换成<b>折半查找</b>，定位之后的移动、插入动作原封不动。只需逐项对比「哪些环节变了」。</p>' },
  { title: 'A 总趟数：相同',
    cls: '',
    body: '<p>两者都是 <b>n−1 趟</b>——逐个把第 2…n 个元素插入前面的有序区。A 排除。</p>' },
  { title: 'B 移动次数：相同',
    cls: '',
    body: '<p>移动次数由初始序列的<b>逆序数</b>决定：找到位置后元素照样逐个后移，与「怎么找到位置」无关。B 排除。</p>' },
  { title: 'C 辅助空间：相同',
    cls: '',
    body: '<p>都只用一个暂存单元（哨兵），<b>O(1)</b>。C 排除。</p>' },
  { title: 'D 比较次数：可能不同',
    cls: 'good',
    body: '<p>折半查找的比较次数<b>只与有序区长度有关</b>（约 log<sub>2</sub>i 次），与初始排列无关；直接插入的比较次数随初始有序度变化（基本有序时约 n−1 次）。<b>可能不同 —— D 正确</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D（元素之间的比较次数）</b>。记忆锚点：<b>折半插入「比较更准，移动一样多，空间一样少」。</b></p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '折半插入排序 vs 直接插入排序',
  subtitle: '唯一区别：有序区内「找位置」用折半查找 · 其余环节逐项对比',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐项对比四个选项。',
  snaps: snaps,
  result: {
    big: '答案 D · 比较次数',
    html: '趟数（n−1）、移动次数（由逆序数决定）、辅助空间（O(1)）都相同；只有<b>比较次数</b>可能不同——折半查找约 log<sub>2</sub>i 次且与初始排列无关，直接插入与初始有序度有关。<br>易错：折半只优化「找位置」，<b>不省移动</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
