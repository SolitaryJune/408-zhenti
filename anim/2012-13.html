<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-13 无符号数零扩展 · 过程动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var X = 'F F F A';            // x 的 16 位机器数
var Y_ZERO = ['0','0','0','0','F','F','F','A'];   // 零扩展
var Y_SIGN = ['F','F','F','F','F','F','F','A'];   // （对比）符号扩展

var states = [
  { log: 'unsigned short x = 65530；unsigned int y = x。int 32 位、short 16 位，把 16 位的 x 加长成 32 位，怎么补高位？',
    tag: '审题', cls: 'shift', xcls: 'dim', ycls: 'dim' },
  { log: '先写 x 的机器数：65535 的十六进制是 FFFFH，x = FFFFH − 5H = FFFAH（16 位无符号数）',
    tag: '求 FFFA', cls: 'step', xcls: '', ycls: 'dim' },
  { log: '核对：0xFFFA = 15×4096 + 15×256 + 15×16 + 10 = 65530 ✓。unsigned 类型没有符号位，FFFA 就是数值本身',
    tag: '核对', cls: 'step', xcls: '', ycls: 'dim' },
  { log: '扩展规则：无符号数加长位数 → 数值不变，高位一律补 0（零扩展）',
    tag: '零扩展规则', cls: 'shift', xcls: '', ycls: 'dim' },
  { log: 'y = 0000 FFFA H：高 4 位是补进去的 0，低 4 位原样复制 x → 选 B',
    tag: '补 0', cls: 'ok', xcls: '', ycls: 'zero' },
  { log: '对比：只有 signed short 的负数才按符号扩展补 1 → FFFF FFFA（选项 D）。本题 x 是 unsigned，不适用',
    tag: '对比符号扩展', cls: 'miss', xcls: '', ycls: 'sign' },
  { log: '结论：y 的机器数 = 0000 FFFA H，答案 B。记忆点：无符号扩展补 0，有符号扩展补符号位',
    tag: '完成', cls: 'done', xcls: '', ycls: 'zero' },
];

function cell(cls, ch, label){
  var col = AW.el('div', 'aw-col');
  col.appendChild(AW.el('div', 'aw-box' + (cls ? ' ' + cls : ''), ch));
  col.appendChild(AW.el('div', 'aw-idx', label || ''));
  return col;
}
function rowOf(items, clsMode){
  var row = AW.el('div', 'aw-cells');
  items.forEach(function(it, i){
    var ch = it[0], cls = it[1];
    if(clsMode === 'zero'){ cls = i < 4 ? 'ok' : 'hit'; }
    if(clsMode === 'sign'){ cls = i < 4 ? 'miss' : 'hit'; }
    row.appendChild(cell(cls, ch, ''));
  });
  return row;
}

AW.init({
  title: '2012·13 unsigned short → unsigned int 怎么补位？',
  subtitle: '<code>x = 65530</code>（16 位）赋给 32 位的 <code>y</code> · 无符号扩展 vs 符号扩展',
  counterLabel: '推进步',
  ribbonTitle: '结论登记（✓ 零扩展 / ✗ 符号扩展）',
  intro: '点击「▶ 播放」，看清 16 位如何长成 32 位。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var info = AW.el('div', '');
    info.style.cssText = 'font-size:12.5px;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 12px;line-height:1.7;margin-bottom:10px;';
    info.innerHTML = 'short = 16 位（4 个十六进制位），int = 32 位（8 个十六进制位）；本题按无符号数处理。';
    var l1 = AW.el('div', 'aw-row-label', '<b>x</b>：unsigned short（16 位）');
    var r1 = AW.el('div', '', '');
    r1.id = 'xRow';
    var l2 = AW.el('div', 'aw-row-label', '<b>y</b>：unsigned int（32 位）');
    var r2 = AW.el('div', '', '');
    r2.id = 'yRow';
    wrap.appendChild(info);
    wrap.appendChild(l1); wrap.appendChild(r1);
    wrap.appendChild(l2); wrap.appendChild(r2);
    stage.appendChild(wrap);
  },
  render: function(stage, sn){
    var xRow = document.getElementById('xRow');
    var yRow = document.getElementById('yRow');
    var xItems = sn.xcls === 'dim'
      ? [['·','dim'],['·','dim'],['·','dim'],['·','dim']]
      : [['F',''],['F',''],['F',''],['A','']];
    var yItems = sn.ycls === 'dim'
      ? [['·','dim'],['·','dim'],['·','dim'],['·','dim'],['·','dim'],['·','dim'],['·','dim'],['·','dim']]
      : (sn.ycls === 'sign' ? Y_SIGN : Y_ZERO);
    xRow.innerHTML = '';
    xRow.appendChild(rowOf(xItems, sn.xcls));
    yRow.innerHTML = '';
    yRow.appendChild(rowOf(yItems, sn.ycls));
  },
  snaps: (function(){
    return states.map(function(s, i){
      var sn = { cls: s.cls, tag: s.tag, log: s.log, count: i,
                 xcls: s.xcls, ycls: s.ycls };
      if(i === states.length - 1) sn.done = true;
      return sn;
    });
  })(),
  result: {
    big: '答案 B（0000 FFFA H）',
    html: '<b>无符号数加长 → 高位补 0</b>：<code>FFFA</code> 变 <code>0000 FFFA</code>。干扰项 D <code>FFFF FFFA</code> 是把负数符号扩展硬套在 unsigned 上的结果。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
