<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-18 字段直接编码位数 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：33 个命令、5 个互斥类', cls: 'key',
    body: '<p>字段直接编码法：把操作控制字段分成若干小段，<b>互斥的微命令编进同一段</b>，各段独立译码。5 个互斥类（7、3、12、5、6）→ 分成 <b>5 段</b>。</p>' },
  { title: '原则一：互斥才编同一段', cls: 'key',
    body: '<p>同一段内每个状态对应一个微命令，段内命令互斥、可以二选一；<b>相容</b>（可同时出现）的命令必须分在不同段。所以不能把 33 个命令编成一个字段。</p>' },
  { title: '原则二：每段留一个"不发命令"状态', cls: 'key',
    body: '<p>每段要空出一个状态表示<b>本段不发出任何微命令</b>（通常全 0）→ 每段要编码的状态数 = 命令数 <b>+ 1</b>，位数 = log2(命令数 + 1) 向上取整。</p>' },
  { title: '逐段计算位数', cls: 'good',
    body: '<p>7+1=8 → <b>3 位</b>；3+1=4 → <b>2 位</b>；12+1=16 → <b>4 位</b>；5+1=8 → <b>3 位</b>；6+1=8 → <b>3 位</b>。</p>' },
  { title: '求和：3+2+4+3+3 = 15 位', cls: 'good',
    body: '<p>五个字段共 <b>15 位</b>，选 <b>C</b>。</p>' },
  { title: '排除干扰项', cls: 'bad',
    body: '<p><b>A 5位</b>：只按互斥类个数给位；<b>B 6位</b>：把 33 个命令当一个字段（log2(33)≈6）；<b>D 33位</b>：一位对应一个命令（水平直接控制思路）。三个都违背"分段编码"。</p>' },
  { title: '结论：答案 C', cls: 'good',
    body: '<p>答案选 <b>C（15 位）</b>。记忆锚点：<b>位数 = 各互斥类的 log2(命令数 + 1) 向上取整之和</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});
snaps[3].ribbon = { k: 1, ok: true };
snaps[4].ribbon = { k: 2, ok: true };
snaps[5].ribbon = { k: 3, ok: false };

AW.init({
  title: '2012·18 微指令操作控制字段至少要几位？',
  subtitle: '字段直接编码 · 33 个微命令 · 5 个互斥类：7、3、12、5、6',
  counterLabel: '推理步',
  ribbonTitle: '关键环节（✓ 对 / ✗ 干扰项）',
  intro: '点击「▶ 播放」，按分段原则逐步算位数。',
  snaps: snaps,
  result: {
    big: '答案 C（15 位）',
    html: '分成 5 段，每段按「命令数 + 1」取位数：<b>3 + 2 + 4 + 3 + 3 = 15 位</b>。漏掉"+1 的不发命令状态"或想一路平铺成 33 位，都是常见错法。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
