<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-21 I/O 总线数据线上传什么 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：三类线各管什么', cls: 'key',
    body: '<p>CPU 与 I/O 接口之间的总线含数据线、地址线、控制线。<b>地址线、控制线单向</b>（CPU → 接口）；<b>数据线双向</b>——凡要传的"内容"都走数据线。</p>' },
  { title: 'Ⅰ 命令字 → 走数据线', cls: 'good',
    body: '<p>CPU 执行输出指令，把命令字经<b>数据线</b>写入接口的命令寄存器 → <b>✔ 属于数据线</b>。</p>' },
  { title: 'Ⅱ 状态字 → 走数据线', cls: 'good',
    body: '<p>CPU 执行输入指令，把接口状态寄存器里的状态字经<b>数据线</b>读回 → <b>✔ 属于数据线</b>。方向相反，但走的同是那条双向数据线。</p>' },
  { title: 'Ⅲ 中断类型号 → 走数据线', cls: 'good',
    body: '<p>中断响应时，中断控制器把类型号经<b>数据线</b>送给 CPU，CPU 用它查中断向量表找服务程序入口 → <b>✔ 属于数据线</b>。</p>' },
  { title: '排除常见误解', cls: 'bad',
    body: '<p>状态字不走控制线——控制线传的是<b>时序与应答信号</b>（读/写命令、中断请求、中断响应）；类型号也不走地址线——地址线是 CPU 发出地址用的单向线。</p>' },
  { title: '结论：Ⅰ、Ⅱ、Ⅲ 全对，选 D', cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>数据线传"内容"——数据、命令字、状态字、中断类型号；地址线传地址；控制线传时序与应答</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});
snaps[1].ribbon = { k: 1, ok: true };
snaps[2].ribbon = { k: 2, ok: true };
snaps[3].ribbon = { k: 3, ok: true };

AW.init({
  title: '2012·21 哪些信息在 I/O 总线的数据线上传输？',
  subtitle: 'Ⅰ 命令字 · Ⅱ 状态字 · Ⅲ 中断类型号 —— 逐项核对走线',
  counterLabel: '核对项',
  ribbonTitle: '三项信息（✓ 走数据线）',
  intro: '点击「▶ 播放」逐项核对三类信息的走线。',
  snaps: snaps,
  result: {
    big: '答案 D（Ⅰ、Ⅱ、Ⅲ 全走数据线）',
    html: '<b>数据线双向、传内容</b>：命令字（CPU→接口）、状态字（接口→CPU）、中断类型号（中断控制器→CPU）全走数据线；地址线传地址、控制线传时序应答，均为单向。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
