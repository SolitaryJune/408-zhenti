<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-22 中断隐指令做什么 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：隐指令 = 硬件自动的一组操作', cls: 'key',
    body: '<p>中断隐指令<b>不是指令系统里的真实指令</b>，而是 CPU 响应中断时由<b>硬件自动完成</b>的操作。它做几件事？——关中断、保护断点、找服务程序入口。</p>' },
  { title: '隐指令三件事', cls: 'key',
    body: '<p>① <b>关中断</b>：防止关键硬件操作被打断；② <b>保护断点</b>：把 PC 存起来，回来接着执行；③ <b>形成中断服务程序入口地址并送 PC</b>：硬件找到入口、跳转过去。</p>' },
  { title: 'Ⅰ 关中断 → 属于隐指令', cls: 'good',
    body: '<p>关中断由硬件在响应周期自动完成 → <b>✔ 属于隐指令</b>。不先关中断，断点可能还没存好就被新中断覆盖。</p>' },
  { title: 'Ⅲ 形成入口地址送 PC → 属于隐指令', cls: 'good',
    body: '<p>硬件（中断向量法：向量地址 → 向量表 → 服务程序入口）自动把入口装入 PC → <b>✔ 属于隐指令</b>。</p>' },
  { title: 'Ⅱ 保存通用寄存器 → 不属于', cls: 'bad',
    body: '<p>通用寄存器是程序的"现场"，由<b>中断服务程序开头的压栈指令（软件）</b>保存 → <b>✘ 不属于隐指令</b>。隐指令只保护"断点"（PC）这一项。</p>' },
  { title: '结论：仅Ⅰ、Ⅲ，选 B', cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>隐指令管"断点和入口"，通用寄存器现场由服务程序保存</b>；前者纯硬件、对程序员透明，后者是软件。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});
snaps[2].ribbon = { k: 1, ok: true };
snaps[3].ribbon = { k: 3, ok: true };
snaps[4].ribbon = { k: 2, ok: false };

AW.init({
  title: '2012·22 中断隐指令除保护断点外还做什么？',
  subtitle: 'Ⅰ 关中断 · Ⅱ 保存通用寄存器 · Ⅲ 形成入口地址送 PC —— 逐项判定',
  counterLabel: '核对项',
  ribbonTitle: '三项操作（✓ 隐指令 / ✗ 不是）',
  intro: '点击「▶ 播放」逐项判定三条操作。',
  snaps: snaps,
  result: {
    big: '答案 B（仅Ⅰ、Ⅲ）',
    html: '中断隐指令三件事：<b>关中断、保护断点、形成服务程序入口送 PC</b>。保存通用寄存器（Ⅱ）是中断服务程序开头由软件压栈完成的，不属于隐指令。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
