<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-24 中断处理与子程序调用的压栈差异</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2012-24（选择题）中断处理一定会保存而子程序调用不需要保存的是
     形态：概念辨析 · 逐项对比推理链
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：一定保存 vs 不需要保存',
    cls: 'key',
    scls: 'shift', tag: '审题',
    body: '<p>题眼是双重限定：这个内容<b>中断处理一定保存</b>，同时<b>子程序调用不需要保存</b>。两个条件必须同时满足。中断和子程序调用都要压栈保护现场，但保护的对象有差别，逐个寄存器对比。</p>' },
  { title: 'A 程序计数器：两者都要保存',
    cls: 'bad',
    scls: 'step',
    body: '<p><b>子程序调用</b>时 call 指令自动把返回地址（PC 的内容）压栈；<b>中断处理</b>也要保存断点地址。PC 属于「两者都需要」，不满足「子程序不需要」，排除 A。</p>' },
  { title: 'C / D 通用寄存器：不是「一定 vs 不需要」',
    cls: 'bad',
    scls: 'step',
    body: '<p><b>中断处理</b>会保存将要使用的通用寄存器现场（否则被中断程序的数据会被破坏）；<b>子程序调用</b>按调用约定也常要保存部分通用寄存器。两者都可能保存，不满足「子程序一定不需要」，排除 C、D。</p>' },
  { title: 'B 程序状态字：只有中断一定保存',
    cls: 'good',
    scls: 'ok',
    body: '<p><b>子程序调用</b>只是同一程序内部的转移，CPU 的工作状态（态别、状态标志、中断屏蔽位）没有变化，PSW <b>不需要保存</b>。而<b>中断响应</b>必然改变 CPU 状态（如用户态转核心态、关中断），返回被中断程序时必须恢复原状，所以中断处理<b>一定保存 PSW</b>。B 完全符合题眼。</p>' },
  { title: '结论',
    cls: 'good',
    scls: 'done',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>子程序调用只换「执行位置」（压栈返回地址即可），中断还要换「CPU 状态」——PSW 只在中断处理时一定保存</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.scls || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2012-24】中断处理 vs 子程序调用：压栈保护谁',
  subtitle: '考点：中断现场保护 · 逐项对比',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：<b>PSW 记录 CPU 状态，只有中断响应会改变它（用户态→核心态、修改中断屏蔽位），返回时必须恢复</b>；子程序调用状态不变，PSW 不用压栈。A 的返回地址两种情况都压栈，C/D 通用寄存器则都「按需」保存。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
