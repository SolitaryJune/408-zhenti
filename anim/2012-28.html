<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-28 read 系统调用的三个判断</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     2012-28（选择题）read 系统调用过程的三条叙述判断
     形态：概念辨析 · 逐条揭示推理链
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：read 的完整流程',
    cls: 'key',
    scls: 'shift', tag: '审题',
    body: '<p>用户进程 read 一个磁盘文件：执行<code>陷入指令</code>把请求交给内核 → 内核检查数据是否已在内存 → 不在则发起磁盘 I/O 并等待 → I/O 完成后返回。三条叙述分别考「阻塞与否」「态切换」「参数」。</p>' },
  { title: 'Ⅱ 正确：系统调用必经用户态→核心态',
    cls: 'good',
    scls: 'ok',
    body: '<p>系统调用要执行特权指令、访问内核数据结构，必须先由<b>用户态切换到核心态</b>，这是系统调用的固有过程。Ⅱ 对。</p>' },
  { title: 'Ⅰ 正确：数据不在内存就睡眠等待',
    cls: 'good',
    scls: 'ok',
    body: '<p>若文件数据<b>不在内存</b>，内核必须发起磁盘 I/O，数据到达前该进程无事可做，会主动进入<b>睡眠（阻塞）状态</b>让出 CPU，I/O 完成后再被唤醒。Ⅰ 对。</p>' },
  { title: 'Ⅲ 错误：read 用文件描述符，不是文件名',
    cls: 'bad',
    scls: 'miss',
    body: '<p>read 的参数是<b>文件描述符 fd</b>——它是 <code>open</code> 系统调用时用文件名打开文件后返回的编号。之后内核靠打开文件表项定位文件，read 只需要 fd、缓冲区地址和长度，<b>不再需要文件名</b>。Ⅲ 错。</p>' },
  { title: '结论',
    cls: 'good',
    scls: 'done',
    body: '<p>Ⅰ、Ⅱ 正确，Ⅲ 错误 → 答案选 <b>A（仅Ⅰ、Ⅱ）</b>。记忆锚点：<b>open 用文件名、read 用 fd；请求 I/O 且数据未就绪的进程必然阻塞；进内核必切核心态</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.scls || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2012-28】read 系统调用过程判断',
  subtitle: '考点：系统调用机制 · 逐条推演Ⅰ / Ⅱ / Ⅲ',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（仅Ⅰ、Ⅱ）',
    html: '记忆锚点：<b>系统调用→核心态（Ⅱ 对）；数据不在内存→进程睡眠等 I/O（Ⅰ 对）；read 的参数是 fd 不是文件名（Ⅲ 错）</b>——文件名只在 open 时使用。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
