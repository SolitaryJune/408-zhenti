<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-38 动画 · ARP 的功能方向</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：问的是「查询方向」',
    cls: 'key',
    tag: '审题',
    body: '<p>ARP = <b>A</b>ddress <b>R</b>esolution <b>P</b>rotocol，地址解析协议。四个选项是四对「从什么查什么」——考的就是它的<b>映射方向</b>。</p>' },
  { title: 'ARP 解决什么问题',
    cls: '',
    tag: '场景',
    body: '<p>主机已知同一局域网上目标主机的 <b>IP 地址</b>，但发以太网帧必须先填好帧头里的 <b>MAC 地址</b>——帧等不了，必须先拿到 MAC。</p>' },
  { title: 'ARP 的工作过程',
    cls: '',
    tag: '过程',
    body: '<p>① 查本地 ARP 缓存；② 未命中就<b>广播</b> ARP 请求：「谁的 IP 是这个，请告诉我你的 MAC」；③ 目标主机<b>单播</b>回 ARP 响应；④ 映射写入缓存。全程<b>输入 IP，输出 MAC</b>。</p>' },
  { title: '排除 B：MAC 查 IP 是 RARP',
    cls: 'bad',
    tag: '排除 B',
    body: '<p>方向反了。根据 MAC 地址查询 IP 地址是 <b>RARP</b>（逆向地址解析协议）的活，历史上用于无盘工作站启动。</p>' },
  { title: '排除 C / D：域名的事归 DNS 管',
    cls: 'bad',
    tag: '排除 C/D',
    body: '<p>域名与 IP 地址之间的翻译由 <b>DNS</b> 完成（应用层），与 ARP（网络层辅助协议）无关。C「域名查 IP」、D「IP 查域名」都不对。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '答案 A',
    body: '<p>答案选 <b>A（根据 IP 地址查询 MAC 地址）</b>。记忆锚点：<b>A = ARP = IP 查 MAC</b>；RARP 反向；DNS 管域名与 IP。</p>' },
];

var CLSMAP = { key: 'shift', bad: 'miss', good: 'ok' };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (CLSMAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'ARP 协议的功能（2012·38）',
  subtitle: '考点：<code>地址解析 ARP / RARP / DNS 的分工</code> · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（IP 查 MAC）',
    html: 'ARP 把同一局域网内的 <b>IP 地址映射成 MAC 地址</b>：广播请求、单播响应。反向查询是 RARP；域名与 IP 之间是 DNS——三个「查询」别混。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
