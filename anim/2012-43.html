<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-43 性能折算链 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：一条"每秒次数"折算链', cls: 'key',
    body: '<p>已知：主频 80MHz、CPI = 4、每条指令访存 1.5 次、块 16B、命中率 99%、总线 32 位、缺页率 0.0005%、页 4KB、缓冲寄存器 32 位、四体交叉每体 50ns。主轴是：<b>指令 → 访存 → Cache 缺失 → 缺页 → DMA → 带宽</b>。</p>' },
  { title: '问1① MIPS = 主频 ÷ CPI = 20', cls: 'good',
    body: '<p>每秒指令数 = 80M ÷ 4 = 20M 条 → <b>MIPS = 20</b>。</p>' },
  { title: '问1② 每秒 Cache 缺失 30 万次', cls: 'good',
    body: '<p>每条指令访存 1.5 次 → 每秒访存 20M × 1.5 = 30M 次；缺失率 = 1 − 99% = 1% → 每秒缺失 30M × 1% = <b>0.3M = 300,000 次</b>。（缺失率作用在访存次数上，别乘错对象）</p>' },
  { title: '问1③ 主存带宽 ≥ 4.8MB/s', cls: 'good',
    body: '<p>每次缺失要和主存交换一块 16B → 主存带宽至少 16B × 0.3M/s = <b>4.8MB/s</b>（不考虑 DMA）。</p>' },
  { title: '问2① 每秒缺页异常 1.5 次', cls: 'good',
    body: '<p>缺页率 0.0005% 作用在"Cache 缺失后访问主存"上 → 每秒缺页 = 0.3M × 0.0005% = <b>1.5 次</b>。</p>' },
  { title: '问2② DMA 请求 ≥ 1536 次/秒', cls: 'good',
    body: '<p>每页 4KB，缓冲寄存器 32 位 = 4B → 每页分 4KB ÷ 4B = 1024 次传送；周期挪用方式每挪用一个存储周期传 4B、发一次请求 → 1.5 × 1024 = <b>1536 次/秒</b>。</p>' },
  { title: '问3 DMA 优先级更高', cls: 'key',
    body: '<p>CPU 和 DMA 控制器同时抢存储器总线时，<b>DMA 优先级更高</b>：DMA 请求得不到及时响应，I/O 数据可能丢失；CPU 等一两个周期只是慢一点，不出错。</p>' },
  { title: '问4 四体交叉最大带宽 = 320MB/s', cls: 'good',
    body: '<p>四体低位交叉流水启动：每 1/4 存储周期启动一个体，即体间隔 = 50ns ÷ 4 = 12.5ns。流水满载时每 12.5ns 读出一个 32 位（4B）字 → 带宽 = 4B ÷ 12.5ns = <b>320MB/s</b>（= 16B ÷ 50ns）。</p>' },
  { title: '结论：四问答案汇总', cls: 'good',
    body: '<p><b>①</b> MIPS = 20，缺失 30 万次/秒，带宽 ≥ 4.8MB/s；<b>②</b> 缺页 1.5 次/秒，DMA ≥ 1536 次/秒；<b>③</b> DMA 优先级高（数据会丢）；<b>④</b> 最大带宽 320MB/s。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});
snaps[1].ribbon = { k: 1, ok: true };
snaps[3].ribbon = { k: 2, ok: true };
snaps[5].ribbon = { k: 3, ok: true };
snaps[7].ribbon = { k: 4, ok: true };

AW.init({
  title: '2012·43 从 MIPS 到 DMA 请求与交叉存储带宽',
  subtitle: '主频 <code>80MHz</code> · CPI <code>4</code> · 访存 <code>1.5</code> 次/条 · 块 <code>16B</code> · 命中率 <code>99%</code> · 总线 <code>32 位</code>',
  counterLabel: '折算步',
  ribbonTitle: '四问进度（✓ 已解决）',
  intro: '点击「▶ 播放」，沿折算链逐问推演。',
  snaps: snaps,
  result: {
    big: '问1 20 MIPS · 30万次/s · 4.8MB/s',
    html: '问2：<b>缺页 1.5 次/s</b>、<b>DMA 请求 1536 次/s</b>；问3：<b>DMA 优先级更高</b>（不及时响应数据会丢）；问4：四体交叉流水，<b>最大带宽 320MB/s</b>。核心方法：找准每级"每秒次数"的作用对象，逐级相乘。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
