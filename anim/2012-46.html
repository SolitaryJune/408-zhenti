<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2012-46 文件索引结构与寻址字节计算</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2012-46（大题）4TB 文件系统 / 1KB 块 / 512B 索引表区
     形态：纯计算推理链 · 逐步揭示
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先把容量换成块数',
    cls: 'key',
    scls: 'shift', tag: '审题',
    body: '<p>文件系统最大容量 4TB = <code>2^42</code> B，磁盘块 1KB = <code>2^10</code> B。<br><b>总块数 = 2^42 ÷ 2^10 = 2^32 个</b>，块号范围 <code>0 ~ 2^32 - 1</code>。两问都围绕「字段/表项能覆盖多少块 × 每块 1KB」展开。</p>' },
  { title: '（1）块号最少占 4 字节',
    cls: 'good',
    scls: 'ok',
    body: '<p>直接索引的每个表项放一个块号。要能区分 <code>2^32</code> 个块，块号至少需要 32 位，即 <b>最少占 4 字节</b>。（注意：块号针对「块」计数，不是针对字节。）</p>' },
  { title: '（1）单个文件最大 128 KB',
    cls: 'good',
    scls: 'ok',
    body: '<p>索引表区共 512B，每项 4B：<code>512 ÷ 4 = 128 项</code>，每项指向一个 1KB 块。<br><b>最大文件 = 128 × 1KB = 128 KB</b>（即 <code>2^17</code> B）。</p>' },
  { title: '（2）直接索引部分：504B → 84KB',
    cls: 'key',
    scls: 'shift',
    body: '<p>第 0~7 字节拿去做 <code>&lt;起始块号, 块数&gt;</code> 后，剩余 504B 仍是直接索引，每项 6B：<code>504 ÷ 6 = 84 项</code> → 84 × 1KB = <b>84 KB</b>。</p>' },
  { title: '（2）连续分配部分：块数 2B → 2^26 B',
    cls: 'key',
    scls: 'shift',
    body: '<p>预分配连续空间的「块数」字段占 2B（16 位）→ 最多表示 <code>2^16</code> 个块 → <code>2^16 × 1KB = 2^26</code> B（64MB）。<br><b>当前结构下单文件最大长度 = 2^26 B + 84 KB = 67108864 + 86016 = 67194880 字节</b>。</p>' },
  { title: '（2）最优拆分：起始块号 4B、块数 4B',
    cls: 'good',
    scls: 'ok',
    body: '<p>要使单文件最长，两个字段都要覆盖整个文件系统：<b>起始块号占 4 字节</b>可寻址全部 <code>2^32</code> 个块（覆盖 4TB 空间）；<b>块数占 4 字节</b>可表示最多 <code>2^32</code> 个块（即 4TB）。两者合计恰为 8B，此时连续部分能覆盖整个文件系统容量，单个文件长度达到最大值 <b>4TB</b>。</p>' },
  { title: '结论',
    cls: 'good',
    scls: 'done',
    body: '<p><b>（1）块号最少 4 字节；最大文件 128 KB。</b><br><b>（2）最大长度 2^26 字节 + 84 KB（67194880 字节）；起始块号与块数各占 4 字节</b>，理由是各自都能覆盖 <code>2^32</code> 个块。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.scls || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2012-46】索引结构容量计算（7 分）',
  subtitle: '考点：文件系统索引节点 · 4TB / 1KB 块 / 512B 索引表区',
  intro: '点击「▶ 播放」逐步展开计算推理链。',
  snaps: snaps,
  result: {
    big: '4B·128KB / 2^26B+84KB·4B',
    html: '<b>（1）</b>块号最少 <b>4 字节</b>（区分 2^32 个块需 32 位），最大文件 <b>128 KB</b>（512÷4=128 项）。<br><b>（2）</b>最大长度 <b>2^26 字节 + 84 KB = 67194880 字节</b>；起始块号与块数<b>各占 4 字节</b>——都能覆盖 2^32 个块，连续部分可达 4TB 上限。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
