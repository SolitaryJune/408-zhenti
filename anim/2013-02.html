<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-02 栈：p2=3 时 p3 的可能取值</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 模板：anim_algo_template.html（算法/过程类），只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 栈横排演示：左底 → 右顶
function stkRow(stk){
  if (!stk.length){
    return '<div class="aw-cells"><div class="aw-box dim" style="width:70px">空栈</div></div>';
  }
  var h = '<div class="aw-cells">';
  for (var i = 0; i < stk.length; i++){
    h += '<div class="aw-col"><div class="aw-ptr">' + (i === stk.length - 1 ? '顶' : '') + '</div>'
       + '<div class="aw-box' + (i === stk.length - 1 ? ' hit' : '') + '">' + stk[i] + '</div></div>';
  }
  return h + '</div>';
}
function popRow(pops){
  if (!pops.length) return '<div class="aw-cells"><div class="aw-box dim" style="width:70px">（无）</div></div>';
  var h = '<div class="aw-cells">';
  for (var i = 0; i < pops.length; i++){
    h += '<div class="aw-col"><div class="aw-ptr">' + (i === pops.length - 1 ? '最新' : '') + '</div>'
       + '<div class="aw-box' + (i === pops.length - 1 ? ' hit' : ' ok') + '">' + pops[i] + '</div></div>';
  }
  return h + '</div>';
}
function rowLabel(t){ return '<div class="aw-row-label"><b>' + t + '</b></div>'; }
function card(cls, title, body){
  return '<div class="aw-stepcard ' + cls + '"><h4><span class="n">•</span>' + title + '</h4>' + body + '</div>';
}

// 每步的栈内容与出栈记录（n = 6 演示）
var ST = [
  { stk: [],            pops: [],        hiPop: false },
  { stk: [1],           pops: [2],       hiPop: false },
  { stk: [],            pops: [2,3,1],   hiPop: true  },
  { stk: [2],           pops: [1,3],     hiPop: false },
  { stk: [],            pops: [1,3,2],   hiPop: true  },
  { stk: [1],           pops: [2,3,4],   hiPop: true  },
  { stk: [1,4],         pops: [2,3,4,5], hiPop: true  },
  { stk: [1,2],         pops: [4,3,6],   hiPop: true  },
  { stk: [],            pops: [],        hiPop: false },
  { stk: [],            pops: [],        hiPop: false }
];

var LOGS = [
  '审题：入栈序列 1,2,…,n；p2 = 3 → 3 是第二个出栈，3 出栈那一刻必须在栈顶。入栈与出栈可以交错进行',
  '案例①（p1=2）：入 1、入 2、出 2（p1=2），再入 3、出 3（p2=3）→ 栈里还剩 1',
  '案例①出栈 1 → p3 = 1 可行！或者不急着出 1，继续入栈 4、5、6 再逐个出，p3 还能取别的值',
  '案例②（p1=1）：入 1、出 1（p1=1），再入 2、入 3、出 3（p2=3）→ 栈里还剩 2',
  '案例②出栈 2 → p3 = 2 可行！同理，p3 也可取 4, 5, …, n',
  '案例①续：不出 1，改入 4、出 4 → p3 = 4 也可行（4 出栈时 3 已不在栈中，合法）',
  '案例①再续：入 4、入 5、出 5 → p3 = 5 也可行（5 出栈时 4 还在栈里，合法）',
  '案例③（p1=4）：入 1、2、3、4，出 4（p1=4）、出 3（p2=3）→ 栈剩 1、2；再入 5、6、出 6 → p3 = 6 可行',
  '排除：p1 = 3 与 p2 = 3 矛盾；p1 ≥ 5 时 4 未出栈、压在 3 上面，3 到不了栈顶。所以 p1 只能取 1、2、4',
  '汇总三情形：p3 ∈ {1, 2, 4, 5, …, n}，恰为除 3 以外的全部值，共 n−1 个 → 选 C'
];
var TAGS = ['审题', '案例① 演示', 'p3=1 可行', '案例② 演示', 'p3=2 可行', 'p3=4 可行',
            'p3=5 可行', '案例③ p3=6 可行', '排除不可能', '完成'];
var CLS  = ['step', 'step', 'ok', 'step', 'ok', 'ok', 'ok', 'ok', 'miss', 'done'];
// ribbon 点亮的 p3 可行取值
var RB   = [null, null, 1, null, 2, 4, 5, 6, null, null];
// 每步累计演示的出栈动作数
var CNT  = [0, 2, 3, 5, 6, 7, 8, 11, 11, 11];

var snaps = [];
for (var i = 0; i < ST.length; i++){
  var s = ST[i];
  var h = '';
  if (i === 0){
    h += card('key', '题意与推理路线',
      '<p>入栈 <code>1,2,3,…,n</code>，出栈序列为 p1, p2, p3, …；已知 <b>p2 = 3</b>（3 第二个出栈）。</p>'
      + '<p>推理路线：先定 p1 的候选 → 每种情形下 3 出栈后栈里剩什么 → p3 能取哪些值 → 合并计数。</p>'
      + '<p>下面用 n = 6 具体演示各种可行操作序列。</p>');
  } else {
    h += rowLabel('栈（左底 → 右顶）');
    h += stkRow(s.stk);
    h += rowLabel('已出栈序列');
    h += popRow(s.pops);
    if (i === 8){
      h += card('bad', '排除不可能的情形',
        '<p>p1 = 3：与 p2 = 3 矛盾，直接排除。</p>'
        + '<p>p1 ≥ 5：出栈 p1 后栈顶是 p1 − 1 ≥ 4（4 还压在 3 上面），3 不可能第二个出栈。</p>'
        + '<p>所以 <b>p1 只能取 1、2、4</b>。</p>');
    }
  }
  var sn = { cls: CLS[i], tag: TAGS[i], log: LOGS[i], count: CNT[i], html: h };
  if (RB[i] != null) sn.ribbon = { k: RB[i], ok: true };
  if (i === ST.length - 1) sn.done = true;
  snaps.push(sn);
}

AW.init({
  title: '栈的出栈序列：p2 = 3 时 p3 能取几个值（2013-02）',
  subtitle: '入栈 <code>1,2,…,n</code> · 已知 p2 = 3 · 演示 n = 6 的各种可行操作序列',
  counterLabel: '演示出栈次数',
  ribbonTitle: 'p3 的可行取值（✓ 已验证）',
  intro: '点击「▶ 播放」逐步枚举 p1 的三种情形。',
  snaps: snaps,
  result: {
    big: '答案 C：n−1 个',
    html: 'p1 只能取 <b>1、2、4</b>；三种情形合并后 p3 ∈ <b>{1, 2, 4, 5, …, n}</b>，恰为除 3 以外的全部值，共 <b>n−1</b> 个。<br>记忆点：<b>入栈出栈可交错</b>（p1=4 是易漏解）；3 已作为 p2 出栈，p3 永远不可能再是 3。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
