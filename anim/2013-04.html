<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-04 三叉哈夫曼树 · 最小带权路径长度</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
<style>
  .hfmt-svg{width:100%;max-width:700px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .notrans *{transition:none!important}
  .hfmt-svg .hedge{stroke:#5a7d8c;stroke-width:2.5px;transition:opacity .4s}
  .hfmt-svg .tnode circle{transition:opacity .4s, fill .3s}
  .hfmt-svg .tnode .val{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:14px;
    fill:#fff;text-anchor:middle;dominant-baseline:central}
  .hfmt-svg .tnode.leaf circle{fill:#2f9e44}
  .hfmt-svg .tnode.internal circle{fill:#1b3a4b}
  .hfmt-svg .tnode.internal.hot circle{fill:#e07a2f}
  .hfmt-svg .tnode.root circle{fill:#e63946}
  .hfmt-svg .tnode.virtual circle{fill:#b9cbd0;stroke-dasharray:5 4;stroke:#586e72}
  .hfmt-svg .tnode.wpl circle{fill:#2f9e44}
  .hfmt-svg .hidden-el{opacity:0}
  .hfmt-svg .depth{font-size:11px;font-weight:700;fill:#1b3a4b;text-anchor:middle;
    font-family:JetBrains Mono,Menlo,monospace;transition:opacity .4s}
  .hqueue{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;justify-content:center}
  .hqueue .qchip{background:#5a7d8c26;color:#1b3a4b;border:1.5px solid #5a7d8c66;border-radius:999px;
    padding:4px 13px;font-weight:800;font-family:JetBrains Mono,Menlo,monospace;font-size:14px}
  .hqueue .qchip.hot{background:#e07a2f1f;border-color:#e07a2f;color:#e07a2f}
  .hqueue .qchip.merged{opacity:.45;text-decoration:line-through}
  .hformula{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 2013-04 三叉哈夫曼树（SVG 结构演示） ==================
 * 叶权 2,3,4,5,6,7：(6−1) mod (3−1) = 1 ≠ 0 → 补 1 个权 0 虚结点。
 * 合并：0+2+3→5*，4+5+5*→14，6+7+14→27（根）。
 * WPL = 6×1+7×1+4×2+5×2+2×3+3×3+0×3 = 46 → 选 B。 */

var NODES = [
  { id:'L2', x:190, y:330, v:'2',  leaf:true,  step:0, depth:3 },
  { id:'L3', x:275, y:330, v:'3',  leaf:true,  step:0, depth:3 },
  { id:'L4', x:75,  y:235, v:'4',  leaf:true,  step:0, depth:2 },
  { id:'L5', x:300, y:235, v:'5',  leaf:true,  step:0, depth:2 },
  { id:'L6', x:330, y:140, v:'6',  leaf:true,  step:0, depth:1 },
  { id:'L7', x:450, y:140, v:'7',  leaf:true,  step:0, depth:1 },
  { id:'V0', x:105, y:330, v:'0*', leaf:false, step:0, depth:3, virtual:true },
  { id:'N1', x:185, y:235, v:'5*', leaf:false, step:1, depth:2, internal:true },
  { id:'N2', x:190, y:140, v:'14', leaf:false, step:2, depth:1, internal:true },
  { id:'N3', x:325, y:45,  v:'27', leaf:false, step:3, depth:0, internal:true },
];
var EDGES = [
  { a:'N1', b:'V0', step:1 }, { a:'N1', b:'L2', step:1 }, { a:'N1', b:'L3', step:1 },
  { a:'N2', b:'L4', step:2 }, { a:'N2', b:'N1', step:2 }, { a:'N2', b:'L5', step:2 },
  { a:'N3', b:'N2', step:3 }, { a:'N3', b:'L6', step:3 }, { a:'N3', b:'L7', step:3 },
];
var QUEUES = [
  { chips:['0*','2','3','4','5','6','7'], hot:['0*'], merged:[] },
  { chips:['4','5','5*','6','7'],         hot:['5*'], merged:['0*','2','3'] },
  { chips:['6','7','14'],                 hot:['14'], merged:['0*','2','3','4','5','5*'] },
  { chips:['27（树根）'],                  hot:['27（树根）'], merged:['0*','2','3','4','5','5*','6','7','14'] },
  { chips:['深度已标注'],                  hot:[], merged:[] },
  { chips:['WPL = 46'],                   hot:['WPL = 46'], merged:[] },
  { chips:['答案 B：46'],                 hot:['答案 B：46'], merged:[] },
];
var FORMULAS = [
  '(n₀−1) mod (k−1) = (6−1) mod 2 = <code>1 ≠ 0</code> → 补 1 个权 0 虚结点 0*',
  '第 1 次合并：0* + 2 + 3 → <code>5*</code>',
  '第 2 次合并：4 + 5(叶) + 5* → <code>14</code>',
  '第 3 次合并：6 + 7 + 14 → <code>27</code>（根）· 构树完成',
  '深度：6、7 → 1 层；4、5 → 2 层；2、3（和虚结点 0*）→ 3 层',
  'WPL = 6×1 + 7×1 + 4×2 + 5×2 + 2×3 + 3×3 + 0×3 = 6+7+8+10+6+9+0 = <code>46</code>',
  'WPL 最小值 = <b>46</b> → 选 B',
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 700 380');
  svg.setAttribute('class', 'hfmt-svg');
  this._edges = {}; this._nodes = {}; this._depths = {};
  EDGES.forEach(function(e){
    var A = null, B = null;
    NODES.forEach(function(n){ if (n.id === e.a) A = n; if (n.id === e.b) B = n; });
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y);
    ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
    ln.setAttribute('class', 'hedge hidden-el');
    ln.dataset.step = e.step;
    this._edges[e.a + '-' + e.b] = ln;
    svg.appendChild(ln);
  }, this);
  NODES.forEach(function(n){
    var g = document.createElementNS(svgNS, 'g');
    var cls = 'tnode ' + (n.virtual ? 'virtual' : (n.leaf ? 'leaf' : 'internal')) + ' hidden-el';
    g.setAttribute('class', cls);
    g.dataset.id = n.id;
    g.dataset.step = n.step;
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', n.internal ? 22 : 20);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('class', 'val');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y);
    t.textContent = n.v;
    g.appendChild(c); g.appendChild(t);
    this._nodes[n.id] = g;
    svg.appendChild(g);
    var d = document.createElementNS(svgNS, 'text');
    d.setAttribute('class', 'depth hidden-el');
    d.setAttribute('x', n.x); d.setAttribute('y', n.y + (n.internal ? 36 : 34));
    d.textContent = '深度' + n.depth;
    this._depths[n.id] = d;
    svg.appendChild(d);
  }, this);
  stage.appendChild(svg);
  var queueBox = AW.el('div', 'hqueue');
  var formulaBox = AW.el('div', 'hformula');
  stage.appendChild(queueBox);
  stage.appendChild(formulaBox);
  this._svg = svg; this._queueBox = queueBox; this._formulaBox = formulaBox;
}

function render(stage, sn, i){
  var self = this;
  var svg = this._svg;
  [].forEach.call(svg.querySelectorAll('.tnode, .hedge'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > Math.min(i, 3));
  });
  [].forEach.call(svg.querySelectorAll('.tnode'), function(el){
    el.classList.remove('hot', 'root', 'wpl');
    if (i >= 1 && i <= 3){
      var produced = ['N1', 'N2', 'N3'][i - 1];
      if (el.dataset.id === produced) el.classList.add('hot');
    }
    if (i >= 3 && el.dataset.id === 'N3') el.classList.add('root');
    if (i >= 5 && el.dataset.step <= 3 && el.dataset.id !== 'N3' && el.dataset.id !== 'V0' && el.dataset.id !== 'N1' && el.dataset.id !== 'N2'){
      el.classList.add('wpl');
    }
  });
  Object.keys(this._depths).forEach(function(id){
    self._depths[id].classList.toggle('hidden-el', i < 4);
  });
  var q = QUEUES[Math.min(i, QUEUES.length - 1)];
  this._queueBox.innerHTML = '权值队列：' + q.chips.map(function(c){
    var cls = 'qchip' + (q.hot.indexOf(c) >= 0 ? ' hot' : '') + (q.merged.indexOf(c) >= 0 ? ' merged' : '');
    return '<span class="' + cls + '">' + c + '</span>';
  }).join('');
  this._formulaBox.innerHTML = FORMULAS[Math.min(i, FORMULAS.length - 1)] || '';
}

var SNAPS = [
  { cls:'shift', tag:'审题 · 补虚结点', count:0,
    log:'6 个叶权 2,3,4,5,6,7，建三叉哈夫曼树（每个分支结点恰 3 个孩子）。先验 (n₀−1) mod (k−1)：5 mod 2 = 1 ≠ 0 → 直接合并最后一轮只剩 2 个，必须补 1 个权 0 的虚结点 0*（灰色虚线），凑成 7 棵。' },
  { cls:'ok', tag:'合并① → 5*', count:1, ribbon:{k:1, ok:true},
    log:'取最小三棵 0*、2、3 → 合并出新结点 5*。虚结点权 0 排在最深处，不贡献路径长度。' },
  { cls:'ok', tag:'合并② → 14', count:2, ribbon:{k:2, ok:true},
    log:'当前最小三棵：4、5（原叶）、5*（新结点）→ 合并为 14。' },
  { cls:'ok', tag:'合并③ → 根 27', count:3, ribbon:{k:3, ok:true},
    log:'取 6、7、14 → 合并为 27，即树根。7 棵树每次减 2，共合并 3 次，构树完成。' },
  { cls:'step', tag:'标注深度', count:3,
    log:'读深度：6、7 在第 1 层；4、5（叶）在第 2 层；2、3（与虚结点 0*）在第 3 层。权越小的离根越远。' },
  { cls:'ok', tag:'算 WPL = 46', count:3,
    log:'WPL = Σ叶权×深度 = 6×1 + 7×1 + 4×2 + 5×2 + 2×3 + 3×3 + 0×3 = 6+7+8+10+6+9+0 = 46。验算：内部结点权之和 = 5+14+27 = 46 ✓' },
  { cls:'done', tag:'完成', count:3, done:true,
    log:'三叉哈夫曼树的带权路径长度最小为 46 → 选 B。' },
];

AW.init({
  title: '2013-04 三叉哈夫曼树：最小带权路径长度',
  subtitle: '叶权 <code>2,3,4,5,6,7</code> · 每次取最小 3 棵合并 · 先验 <code>(n₀−1) mod (k−1)</code> 决定是否补权 0 虚结点',
  counterLabel: '合并',
  ribbonTitle: '合并次数（✓ 完成一次）',
  intro: '点击「▶ 播放」逐次合并最小权值，看三叉哈夫曼树长出来，再算 WPL。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 B：WPL = 46',
    html: '(n₀−1) mod (k−1) = 1 ≠ 0 → 先补 1 个权 0 虚结点；三次合并 0+2+3→5、4+5+5→14、6+7+14→27。<br>' +
      'WPL = 叶权×深度之和 = <b>6+7+8+10+6+9+0 = 46</b>（= 内部结点权之和 5+14+27）。<br>' +
      '陷阱：<b>不补虚结点</b>最后一轮只有 2 棵可并、根只有 2 个孩子，不是合法三叉哈夫曼树；27 只是根权（选项 A 的来源）；把内部结点权也乘深度会算出 54/56 一类的大值。',
  },
});
</script>
</body>
</html>
