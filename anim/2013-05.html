<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-05 后序线索二叉树：叶结点的右线索</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：anim_concept_template.html（概念/分析类），只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n + '</span>' + title + '</h4>' + body + '</div>';
}

// 反例小树（pre 等宽）：父 P，左孩子 Y（带子树），右孩子 X（叶）
var TREE =
'<pre style="background:#f8fafc;padding:12px;border-radius:10px;font-family:Menlo,monospace;font-size:14px;line-height:1.55;margin-top:8px">'
+ '      父 P\n'
+ '     /    \\\n'
+ '   <span style="color:#2563eb;font-weight:700">Y(左孩子)</span>  <span style="color:#16a34a;font-weight:700">X(叶)</span>\n'
+ '   /  \\\n'
+ ' Y的左  Y的右\n'
+ '</pre>';

var STEPS = [
  { title: '审题眼：X 的位置关系', cls: 'key',
    body: '<p>X 是<b>叶结点</b>且存在<b>左兄弟 Y</b> → 父结点有两个孩子：<b>Y 是左孩子、X 是右孩子</b>。X 没有任何孩子，左右指针均为空，都可用于存放线索。</p>' + TREE },
  { title: '后序规则：左右根', cls: '',
    body: '<p>后序遍历顺序：<b>左子树 → 右子树 → 根</b>。于是 Y 整棵子树（含 Y 自己）都在 X 之前访问完，然后访问 X，最后访问父结点。</p>' },
  { title: 'X 的前驱是谁（左线索）', cls: '',
    body: '<p>后序中子树的根最后访问：Y 子树最后被访问的结点就是 <b>Y 本身</b>。所以 X 的<b>前驱 = 左兄弟 Y</b>，填在 X 的<b>左线索</b>里。</p>' },
  { title: 'X 的后继是谁（右线索）', cls: 'good',
    body: '<p>访问 X 时：父的左子树已全部访问完，X 是父的<b>最后一个孩子</b> → 下一个访问的就是<b>父结点</b>。X 的右指针为空，正好填入后继 → <b>右线索指向 X 的父结点</b>，选 A。</p>' },
  { title: '逐项排除 B', cls: 'bad',
    body: '<p>B（以 Y 为根的子树的最左下结点）：它是后序中 Y 子树<b>最先</b>访问的结点，在 X 之前很早就出现，绝不可能是 X 的后继。</p>' },
  { title: '逐项排除 C、D', cls: 'bad',
    body: '<p>C（Y 本身）：Y 是 X 的<b>前驱</b>，填的是左线索——左右颠倒。</p>'
        + '<p>D（Y 子树的最右下结点）：后序中 Y 子树最后访问的是根 Y；最右下结点若存在必在 Y 之前访问，也在 X 之前。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>X 的右线索指向 <b>X 的父结点</b>，选 <b>A</b>。</p>'
        + '<p>记忆锚点：<b>后序中"父的右孩子（叶）"的下一个访问者就是父结点</b>；左兄弟 Y 是它的前驱（左线索）。</p>' }
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '后序线索二叉树：叶结点 X 的右线索指向谁（2013-05）',
  subtitle: 'X 为叶 · 存在左兄弟 Y · 按后序「左右根」逐步推后继',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A：X 的父结点',
    html: 'X 是父的<b>右孩子（叶）</b>，后序访问完 X 后紧接着访问的就是<b>父结点</b> → 右线索指向父结点。<br>干扰项根源：<b>Y 是前驱不是后继</b>（左右线索别搞反）；Y 子树的任何结点都在 X 之前访问。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
