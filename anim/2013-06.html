<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-06 BST 删除 v 再插入 v：T1 与 T3 相同吗</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：anim_concept_template.html（概念/分析类），只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n + '</span>' + title + '</h4>' + body + '</div>';
}

// v 只有一个孩子的删除-再插入小例子
var EG =
'<pre style="background:#f8fafc;padding:12px;border-radius:10px;font-family:Menlo,monospace;font-size:14px;line-height:1.55;margin-top:8px">'
+ 'T1:    v(根)         T2:    c(根)        T3:    c(根)\n'
+ '      /                     \\\\                  \\\\\n'
+ '    c                        v                  v\n'
+ '(v 是分支结点)         (删 v：c 顶位)     (插 v：只能成叶)\n'
+ '</pre>'
+ '<p style="font-size:12.5px;color:#64748b">T1 中 v 有孩子；T3 中 v 成了叶 → 同一关键字的孩子数不同 → T3 ≠ T1。</p>';

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>T1 删除结点 v 得 T2，再把 v 插回 T2 得 T3。问 T1 与 T3 的关系——关键看两点：<b>删除怎么改变树形</b>、<b>插入落在什么位置</b>。分"v 是叶 / 不是叶"两种情形讨论。</p>' },
  { title: '情形一：v 是叶结点', cls: '',
    body: '<p>BST 删除叶结点 = <b>直接摘除</b>，其余结点纹丝不动。再插回 v：从根按关键字一路比较，比较路径与原来完全一致，必然走到原来那个空位——v 回到原位、仍是叶。</p>' },
  { title: '情形一结论：T3 = T1', cls: 'good',
    body: '<p>v 是叶时删除再插入<b>完全复原</b> → <b>Ⅱ「若 v 是叶则 T1 与 T3 相同」正确</b>；Ⅰ「若 v 是叶则不同」错误。</p>' },
  { title: '情形二：v 不是叶结点', cls: '',
    body: '<p>v 有孩子，删除必须"找人顶位"：只有一个孩子 → 孩子直接顶替 v；有两个孩子 → 用 v 的<b>中序前驱（或后继）</b>替补，再递归删除替补结点。无论哪种，v 原来的位置被别人占据，<b>树形已经改变</b>。</p>' },
  { title: '小例子（v 只有一个孩子）', cls: '',
    body: EG },
  { title: '情形二结论：T3 ≠ T1', cls: 'good',
    body: '<p>再插入 v 时，新结点只能落在<b>空指针处，必然是叶</b>。而 T1 中 v 是有孩子的分支结点——同一个关键字，孩子数都不同，两棵树不可能相同 → <b>Ⅲ「若 v 不是叶则 T1 与 T3 不同」正确</b>；Ⅳ 错误。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>正确的是 <b>Ⅱ、Ⅲ</b>，选 <b>C</b>。</p>'
        + '<p>记忆锚点：<b>叶结点删了再插会复原；带孩子的结点删除时树形已动，插回的 v 只能当叶，回不到原位。</b></p>' }
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '二叉排序树：删 v 再插 v，T1 与 T3 相同吗（2013-06）',
  subtitle: '删除 T1 中的 v 得 T2 · 插入 v 得 T3 · 判断 Ⅰ~Ⅳ 四个命题',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C：仅 Ⅱ、Ⅲ',
    html: 'v 是叶：删除 = 直接摘，插回走原路回原位 → <b>T3 = T1</b>（Ⅱ 对）。<br>v 不是叶：删除要"顶位"，树形已变；插回的 v 只能是叶，与 T1 中有孩子的 v 矛盾 → <b>T3 ≠ T1</b>（Ⅲ 对）。故选 <b>C</b>。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
