<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-08 哪一个不是广度优先遍历序列</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：anim_algo_template.html（算法/过程类），只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var ADJ = {
  a: ['b','e','h'], b: ['a','c','d'], c: ['b','d','h'], d: ['b','c'],
  e: ['a','f','g'], f: ['e'], g: ['e'], h: ['a','c']
};

function adjHtml(hiV){
  var vs = ['a','b','c','d','e','f','g','h'];
  var h = '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0">';
  for (var i = 0; i < vs.length; i++){
    var v = vs[i];
    h += '<div style="border:1px solid ' + (hiV === v ? '#16a34a' : '#e2e8f0') + ';background:'
       + (hiV === v ? '#f0fdf4' : '#fff') + ';border-radius:9px;padding:4px 9px;font-family:Menlo,monospace;font-size:12.5px">'
       + '<b style="color:#0f172a">' + v + '</b><span style="color:#64748b">: ' + ADJ[v].join(', ') + '</span></div>';
  }
  return h + '</div>';
}

// 序列格子：seq 顶点数组，lay 层号数组（-1 = 未定），badIndex 标红
function seqRow(seq, lay, badIndex, prefixLen){
  if (!seq.length) return '';
  var h = '<div class="aw-cells" style="justify-content:center;margin-top:6px">';
  for (var i = 0; i < seq.length; i++){
    var bad = badIndex === i;
    var done = prefixLen != null && i < prefixLen;
    h += '<div class="aw-col"><div class="aw-ptr">' + (lay[i] >= 0 ? '层' + lay[i] : '') + '</div>'
       + '<div class="aw-box ' + (bad ? 'miss' : (done ? 'ok' : '')) + '" style="width:40px">' + seq[i] + '</div></div>';
  }
  return h + '</div>';
}
function rowLabel(t){ return '<div class="aw-row-label"><b>' + t + '</b></div>'; }
function card(cls, title, body){
  return '<div class="aw-stepcard ' + cls + '" style="margin-top:10px"><h4><span class="n">•</span>' + title + '</h4>' + body + '</div>';
}

// 正确 BFS 演示（从 a）：[顶点, 层号]
var BFS = [
  { seq: [], lay: [] },
  { seq: ['a'], lay: [0] },
  { seq: ['a','b','e','h'], lay: [0,1,1,1] },
  { seq: ['a','b','e','h','c','d'], lay: [0,1,1,1,2,2] },
  { seq: ['a','b','e','h','c','d','f','g'], lay: [0,1,1,1,2,2,2,2] }
];
var BFS_LOG = [
  '',
  '访问起点 a，层号 0；a 入队',
  'a 出队：其全部未访问邻居 b、e、h 被一口气访问（层 1、连续出现）——这是 BFS 的硬规则',
  'b 出队 → 访问 c、d（层 2）；e、h 暂在队列中，尚未出队',
  'e 出队 → 访问 f、g（层 2）；随后 h、c、d、f、g 依次出队均无新顶点，遍历完成。得到一条合法 BFS 序列：a, b, e, h, c, d, f, g（层号 0,1,1,1,2,2,2,2 非降）'
];

// 四个选项：序列 + 各顶点层号（-1 = 检查到此处即崩溃）
var OPT = [
  { name: 'A', seq: ['h','c','a','b','d','e','g','f'], lay: [0,1,1,2,2,2,3,3], ok: true },
  { name: 'B', seq: ['e','a','f','g','b','h','c','d'], lay: [0,1,1,1,2,2,3,3], ok: true },
  { name: 'C', seq: ['d','b','c','a','h','e','f','g'], lay: [0,1,1,2,2,3,4,4], ok: true },
  { name: 'D', seq: ['a','b','c','d','h','e','f','g'], lay: [0,1,2,2,-1,-1,-1,-1], ok: false, bad: 4 }
];

var LOGS = [
  '审题：8 顶点无向图，判断哪个选项【不是】广度优先（BFS）遍历序列',
  'BFS 铁律：序列按层号非降；起点层 0；一个顶点出队时必须把它所有未访问邻居一口气访问完（同层、连续出现）',
  '检验 A：h, c, a, b, d, e, g, f → 层号 0,1,1,2,2,2,3,3 非降；h 出队可按序访问 c、a，c 出队访问 b、d，a 出队访问 e，e 出队访问 g、f → 合法 BFS ✓',
  '检验 B：e, a, f, g, b, h, c, d → 层号 0,1,1,1,2,2,3,3 非降；e 出队访问 a、f、g，a 出队访问 b、h，b 出队访问 c、d → 合法 BFS ✓',
  '检验 C：d, b, c, a, h, e, f, g → 层号 0,1,1,2,2,3,4,4 非降；d 出队访问 b、c，b 出队访问 a，c 出队访问 h，a 出队访问 e，e 出队访问 f、g → 合法 BFS ✓',
  '检验 D：a, b, c, d, h, … → a 出队时必须一口气访问完它的全部邻居 b、e、h！但序列里 b 之后是 c（c 与 a 不相邻，属第 2 层），h 明明是 a 的邻居（层 1）却被挤到 d 之后 → 层号 0,1,2,2,1 中途回落，违反 BFS 分层 → 不是 BFS 序列 ✗',
  '结论：A、B、C 都能找到合法的邻居访问顺序，只有 D 违反「同层连续出现」规则 → 选 D'
];
var TAGS = ['审题', 'BFS 规则', '检验 A ✓', '检验 B ✓', '检验 C ✓', '检验 D ✗', '完成'];
var CLS  = ['step', 'step', 'ok', 'ok', 'ok', 'miss', 'done'];

var snaps = [];
// 步 0~1：题面 + 规则
var h0 = card('key', '题意与图的邻接表', '<p>对下面的无向图做遍历，判断哪个选项<b>不是</b>广度优先遍历序列。邻接表（按字母序，邻居访问顺序可任选）：</p>' + adjHtml());
snaps.push({ cls: 'step', tag: '审题', log: LOGS[0], count: 0, html: h0 });

var h1 = adjHtml() + card('key', 'BFS 的分层判定法',
  '<p>① 序列按<b>层号非降</b>排列：起点层 0，某顶点只与已访问的层 k 顶点相邻时层号为 k+1；</p>'
  + '<p>② 一个顶点出队时，必须把它的<b>全部未访问邻居一口气访问完</b>（它们同层、连续出现）；</p>'
  + '<p>③ 题目未规定邻接表存储顺序，每个顶点的邻居按<b>任意顺序</b>访问都算合法——判定只看结构。</p>');
snaps.push({ cls: 'step', tag: 'BFS 规则', log: LOGS[1], count: 1, html: h1 });

// 步 2~6：正确 BFS 演示
for (var i = 2; i <= 6; i++){
  var idx = i - 2;
  var h = adjHtml() + rowLabel('从 a 出发的合法 BFS 演示');
  h += seqRow(BFS[idx].seq, BFS[idx].lay, null, BFS[idx].seq.length);
  h += card(idx >= 2 ? 'good' : '', 'BFS 演示 第' + idx + '步', '<p>' + BFS_LOG[idx] + '</p>');
  var sn = { cls: 'ok', tag: 'BFS 演示 第' + idx + '步', log: BFS_LOG[idx] || '演示开始', count: i, html: h };
  if (idx > 0) sn.ribbon = { k: idx, ok: true };
  snaps.push(sn);
}

// 步 7~10：四个选项检验
for (var oi = 0; oi < 4; oi++){
  var o = OPT[oi];
  var h = adjHtml(o.name === 'D' ? 'a' : '') + rowLabel('选项 ' + o.name + '：' + o.seq.join(', '));
  h += seqRow(o.seq, o.lay, o.bad, o.seq.length);
  var body = '<p>层号序列：<b>' + o.lay.map(function(x){ return x >= 0 ? x : '?'; }).join(', ') + '</b></p>';
  body += '<p>' + LOGS[2 + oi].replace(/^检验 [ABCD]：[^→]*→ /, '') + '</p>';
  h += card(o.ok ? 'good' : 'bad', '选项 ' + o.name + (o.ok ? '：合法 BFS' : '：不是 BFS'), body);
  var sn = {
    cls: o.ok ? 'ok' : 'miss',
    tag: '检验 ' + o.name + (o.ok ? ' ✓' : ' ✗'),
    log: LOGS[2 + oi] + (oi === 3 ? '　' + LOGS[6] : ''), count: 7 + oi, html: h,
    ribbon: { k: oi + 1, ok: o.ok }
  };
  if (oi === 3) sn.done = true;
  snaps.push(sn);
}

AW.init({
  title: '哪一个不是广度优先遍历序列（2013-08）',
  subtitle: '8 顶点无向图 · 判定法：<code>层号非降</code> + <code>出队即访问全部未访问邻居</code>',
  counterLabel: '检验进度',
  ribbonTitle: '选项 / 演示步（✓ 合法 / ✗ 违反）',
  intro: '点击「▶ 播放」先看正确 BFS，再逐项检验四个选项。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: 'D = <b>a, b, c, d, h, e, f, g</b>：a 出队时必须一口气访问完邻居 <b>b、e、h</b>，但 h 被推迟到 c、d 之后出现——层号 0,1,2,2,<b>1</b> 中途回落，违反 BFS 分层规则。<br>记忆点：<b>起点的全部邻居必须紧跟起点同层连续出现</b>；D 那串更像一条 DFS 路径。A、B、C 按层号检验均合法。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
