<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-09 AOE 网：加快哪些活动能缩短工期</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：anim_algo_template.html（算法/过程类），只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 活动表：a(1→2,3) b(1→3,8) c(2→4,9) d(3→2,4) e(2→5,6) f(3→5,10) g(4→6,6) h(5→6,9)
var ACTS = [
  ['a', '1→2', 3], ['b', '1→3', 8], ['c', '2→4', 9], ['d', '3→2', 4],
  ['e', '2→5', 6], ['f', '3→5', 10], ['g', '4→6', 6], ['h', '5→6', 9]
];

function actTable(hiKeys){
  var h = '<table style="border-collapse:collapse;margin:6px auto;font-size:13px">';
  h += '<tr><th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">活动</th>'
     + '<th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">有向边</th>'
     + '<th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">工期</th></tr>';
  for (var i = 0; i < ACTS.length; i++){
    var hit = hiKeys && hiKeys[ACTS[i][0]];
    h += '<tr><td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center;background:'
       + (hit ? '#dcfce7' : '#fff') + ';font-weight:700">' + ACTS[i][0] + '</td>'
       + '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">' + ACTS[i][1] + '</td>'
       + '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">' + ACTS[i][2] + '</td></tr>';
  }
  return h + '</table>';
}

// ve 表：v1..v6（hiArr = 本步新算出的事件编号数组）
function veTable(ve, hiArr){
  var h = '<table style="border-collapse:collapse;margin:6px auto;font-size:13px">';
  h += '<tr><th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">事件</th>';
  for (var i = 1; i <= 6; i++) h += '<th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">v' + i + '</th>';
  h += '</tr><tr><td style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">ve</td>';
  for (var i = 1; i <= 6; i++){
    var isHi = hiArr && hiArr.indexOf(i) >= 0;
    h += '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center;background:'
       + (isHi ? '#fef3c7' : '#fff') + ';font-weight:700;color:#1d4ed8">'
       + (ve && ve[i] != null ? ve[i] : '·') + '</td>';
  }
  return h + '</tr></table>';
}

function pathsHtml(hiPath){
  var P = [
    ['P1', '1→3→2→4→6', 'b, d, c, g', 27],
    ['P2', '1→3→2→5→6', 'b, d, e, h', 27],
    ['P3', '1→3→5→6', 'b, f, h', 27]
  ];
  var h = '<table style="border-collapse:collapse;margin:6px auto;font-size:13px">';
  h += '<tr><th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">路径</th>'
     + '<th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">顶点序列</th>'
     + '<th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">活动</th>'
     + '<th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">长度</th></tr>';
  for (var i = 0; i < P.length; i++){
    var hit = hiPath === P[i][0];
    h += '<tr><td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center;background:'
       + (hit ? '#fef3c7' : '#fff') + ';font-weight:700">' + P[i][0] + '</td>'
       + '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">' + P[i][1] + '</td>'
       + '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center;font-family:Menlo,monospace">' + P[i][2] + '</td>'
       + '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">' + P[i][3] + '</td></tr>';
  }
  return h + '</table>';
}

function card(cls, title, body){
  return '<div class="aw-stepcard ' + cls + '" style="margin-top:10px"><h4><span class="n">•</span>' + title + '</h4>' + body + '</div>';
}

// ve 逐步
var VE = [
  {},
  {1: 0, 3: 8},
  {1: 0, 3: 8, 2: 12},
  {1: 0, 3: 8, 2: 12, 4: 21, 5: 18},
  {1: 0, 3: 8, 2: 12, 4: 21, 5: 18, 6: 27}
];
var VEHI = [[], [1, 3], [2], [4, 5], [6]];

var LOGS = [
  '审题：AOE 网含 8 个活动 a~h。缩短工期的条件：被加快的活动必须覆盖【每一条】关键路径',
  '求最早发生时间：ve(1)=0；ve(3)=ve(1)+b=8',
  've(2)=max(a: 0+3, d: 8+4)=12（d 指向 2，c/e 从 2 出发要等 ve(2)）',
  've(4)=ve(2)+c=21；ve(5)=max(e: 12+6, f: 8+10)=max(18,18)=18',
  've(6)=max(g: 21+6, h: 18+9)=max(27,27)=27 → 工期 27',
  '找关键路径：长度为 27 的路径有三条——P1: b-d-c-g、P2: b-d-e-h、P3: b-f-h（P3 极易漏看！）',
  '检验 A（c 和 e）：c 在 P1、e 在 P2，但 P3 上没有 c 也没有 e → P3 仍长 27，工期不变 ✗',
  '检验 B（d 和 c）：d 在 P1、P2 上，但 P3（1→3→5→6）不含 d → P3 仍长 27，工期不变 ✗',
  '检验 D（f 和 h）：f、h 都只在 P3 上，P1、P2 不动 → 工期仍 27 ✗',
  '检验 C（f 和 d）：f 覆盖 P3，d 同时覆盖 P1 与 P2 → 三条关键路径全部缩短 → 工期缩短为 26 ✓（各减 1 天验证：P1=8+3+9+6=26，P2=8+3+6+9=26，P3=8+9+9=26）',
  '结论：同时加快 f 和 d 就能缩短工程工期 → 选 C'
];
var TAGS = ['审题', 've(1)(3)', 've(2)=12', 've(4)(5)', 've(6)=27 工期', '三条关键路径',
            'A ✗', 'B ✗', 'D ✗', 'C ✓', '完成'];
var CLS  = ['step', 'step', 'ok', 'ok', 'ok', 'shift', 'miss', 'miss', 'miss', 'ok', 'done'];
var HIKEY = [null, null, null, null, null, null,
             {c:1, e:1}, {d:1, c:1}, {f:1, h:1}, {f:1, d:1}, null];
var HIPATH = [null, null, null, null, null, 'P1', 'P3', 'P3', 'P1', null, null];

var snaps = [];
for (var i = 0; i <= 10; i++){
  var h = '';
  if (i === 0){
    h += actTable() + card('key', '题意与判定条件',
      '<p>AOE 网表示一项含 8 个活动的工程。关键路径的长度 = 工期。要缩短工期，被同时加快的活动必须<b>覆盖每一条关键路径</b>——只要还有一条关键路径没人加快，它就仍是瓶颈。</p>');
  } else if (i <= 4){
    h += actTable() + veTable(VE[i], VEHI[i]);
  } else if (i === 5){
    h += pathsHtml(HIPATH[i]) + card('key', TAGS[i], '<p>' + LOGS[i] + '</p>');
  } else if (i <= 9){
    h += actTable(HIKEY[i]) + pathsHtml(HIPATH[i]) + card(i === 9 ? 'good' : 'bad', TAGS[i], '<p>' + LOGS[i] + '</p>');
  } else {
    h += actTable({f:1, d:1}) + pathsHtml() + card('good', TAGS[i], '<p>' + LOGS[i] + '</p>');
  }
  var sn = { cls: CLS[i], tag: TAGS[i], log: LOGS[i], count: i, html: h };
  if (i >= 6 && i <= 9) sn.ribbon = { k: i - 5, ok: i === 9 };
  if (i === 10) sn.done = true;
  snaps.push(sn);
}

AW.init({
  title: 'AOE 网：加快哪些活动才能缩短工期（2013-09）',
  subtitle: '工期 27 · 关键路径三条 <code>b-d-c-g / b-d-e-h / b-f-h</code> · 加快活动须覆盖全部关键路径',
  counterLabel: '推理步',
  ribbonTitle: '选项检验（✓ 能缩短 / ✗ 不能）',
  intro: '点击「▶ 播放」先算工期与关键路径，再逐项检验选项。',
  snaps: snaps,
  result: {
    big: '答案 C：f 和 d',
    html: '三条关键路径：<b>b-d-c-g、b-d-e-h、b-f-h</b>。f 覆盖 P3，d 同时覆盖 P1、P2——同时加快 f 和 d，三条路径全部缩短（各减 1 天则工期 27 → 26）。<br>记忆点：<b>加快活动必须"雨露均沾"每条关键路径</b>；漏看 P3（1→3→5→6）就会误选 A 或 B。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
