<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-10 高度为 2 的 5 阶 B 树最少关键字数</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：anim_concept_template.html（概念/分析类），只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n + '</span>' + title + '</h4>' + body + '</div>';
}

// 最少形态示意：根 1 个关键字、2 个子结点各 2 个关键字
function minTree(){
  var box = function(w, txt, cls){
    return '<div class="aw-box ' + (cls || '') + '" style="width:' + w + 'px;height:40px;font-size:13px">' + txt + '</div>';
  };
  return '<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px">'
    + '<div style="display:flex;align-items:center;gap:10px"><span style="font-size:12px;color:#64748b">根（第 1 层）</span>'
    + box(120, '│ k │', 'hit') + '</div>'
    + '<div style="color:#94a3b8;font-size:12px">↓ 1 个关键字 → 2 棵子树 ↓</div>'
    + '<div style="display:flex;gap:28px;align-items:center">'
    + '<span style="font-size:12px;color:#64748b">第 2 层</span>'
    + box(120, '│ k │ k │', 'ok') + box(120, '│ k │ k │', 'ok') + '</div>'
    + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>求「高度为 2 的 <b>5 阶</b> B 树」最少含多少个关键字。两件事要分清：<b>5 阶决定结点关键字上下限</b>，<b>高度 2 决定层数</b>——求最少就层层取下限。</p>' },
  { title: '5 阶 B 树的三个约束', cls: '',
    body: '<p>① 每个结点<b>最多</b> 4 个关键字、5 棵子树；② <b>除根以外</b>每个结点<b>最少</b> ⌈5/2⌉ − 1 = <b>2 个关键字</b>（3 棵子树）；③ <b>根结点</b>最少 2 棵子树，即最少 <b>1 个关键字</b>。</p>' },
  { title: '第 1 层（根）取下限', cls: '',
    body: '<p>根最少 1 个关键字 → 最多 1 + 1 = 2 棵子树 → 第 2 层最少 <b>2 个结点</b>。</p>' },
  { title: '第 2 层（叶层）取下限', cls: '',
    body: '<p>第 2 层是叶层（失败结点不计高度、不算关键字）。每个结点最少 2 个关键字 → 2 × 2 = <b>4 个</b>。</p>' },
  { title: '合计最少形态', cls: 'good',
    body: minTree() + '<p>总关键字 = 1 + 2×2 = <b>5 个</b>。这就是该 B 树的最少关键字形态。</p>' },
  { title: '逐项排除', cls: 'bad',
    body: '<p>B（7）：把根的下限误当 2 个关键字，或把叶层下限误当 3 个关键字 ⌈5/2⌉。</p>'
        + '<p>C（8）：介于两者之间的误算。</p>'
        + '<p>D（14）：按「最多」算：4 + 2×5 = 14——题目问的是最少。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>最少关键字数 = 1（根）+ 2×2（两个叶层结点）= <b>5</b>，选 <b>A</b>。</p>'
        + '<p>记忆锚点：<b>根最少 1 个关键字（2 棵子树）；非根最少 ⌈m/2⌉−1 个关键字</b>。</p>' }
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '高度为 2 的 5 阶 B 树：最少关键字数（2013-10）',
  subtitle: '5 阶 = 结点最多 4 个关键字 5 棵子树 · 层层取下限',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A：5 个',
    html: '根最少 <b>1</b> 个关键字 → 2 棵子树 → 第 2 层 2 个结点，每个最少 <b>2</b> 个关键字：1 + 2×2 = <b>5</b>。<br>对照：按「最多」算是 4 + 2×5 = 14（选项 D 的陷阱）；根下限记错会得 6、7（选项 B 附近）。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
