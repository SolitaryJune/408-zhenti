<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-12 加权平均 CPI 与 MIPS</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：MIPS 公式', cls: 'key',
    body: '<p>主频 <code>1.2GHz = 1200MHz</code>。考点公式：<b>MIPS = 主频（MHz）÷ 平均 CPI</b>。关键是把 4 类指令的 CPI 按比例<b>加权</b>求平均。</p>' },
  { title: 'A 类指令的贡献', cls: '',
    body: '<p>占 50%，CPI = 2：贡献 <code>0.5 × 2 = 1.0</code> 个时钟周期。</p>' },
  { title: 'B 类指令的贡献', cls: '',
    body: '<p>占 20%，CPI = 3：贡献 <code>0.2 × 3 = 0.6</code> 个时钟周期。</p>' },
  { title: 'C 类指令的贡献', cls: '',
    body: '<p>占 10%，CPI = 4：贡献 <code>0.1 × 4 = 0.4</code> 个时钟周期。</p>' },
  { title: 'D 类指令的贡献', cls: '',
    body: '<p>占 20%，CPI = 5：贡献 <code>0.2 × 5 = 1.0</code> 个时钟周期。</p>' },
  { title: '求平均 CPI', cls: 'good',
    body: '<p>平均 CPI = 1.0 + 0.6 + 0.4 + 1.0 = <b>3.0</b>，即平均每条指令花 3 个时钟周期。</p>' },
  { title: '代入 MIPS 公式', cls: 'good',
    body: '<p>MIPS = 主频 ÷ 平均 CPI = <code>1200 ÷ 3 = 400</code>，正是选项 <b>C</b> 的数值。</p>' },
  { title: '排除干扰项 D（600）', cls: 'bad',
    body: '<p>600 = 1200 ÷ 2，错在<b>没有加权</b>、直接用了占 50% 的 A 类指令的 CPI = 2，把混合比例扔掉了。</p>' },
  { title: '排除干扰项 A / B（100 / 200）', cls: 'bad',
    body: '<p>100 对应平均 CPI = 12、200 对应平均 CPI = 6：要么主频单位换算错，要么加权累加出错，都不是正确算法能得到的结果。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>C</b>：平均 CPI = 3.0，MIPS = <b>400</b>。记忆锚点：MIPS = 主频（MHz）÷ 平均 CPI，CPI 必须按比例加权。</p>' },
];

var COUNTS = ['0', '1.0', '1.6', '2.0', '3.0', '3.0', '3.0', '3.0', '3.0', '3.0'];

var SCLS = { '': 'step', key: 'shift', good: 'ok', bad: 'miss' };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : SCLS[s.cls || ''],
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: COUNTS[i],
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (i === 6) { sn.tag = '选项 C ✓'; sn.cls = 'ok'; sn.ribbon = { k: 4, ok: true }; }
  if (i === 7) { sn.tag = '选项 D ✗'; sn.cls = 'miss'; sn.ribbon = { k: 3, ok: false }; }
  if (i === 8) { sn.tag = '选项 A/B ✗'; sn.cls = 'miss'; sn.ribbon = { k: 1, ok: false }; }
  return sn;
});

AW.init({
  title: '2013 真题 · 加权平均 CPI 求 MIPS',
  subtitle: '主频 <code>1.2GHz</code> · 四类指令按比例加权 · 逐项推演',
  counterLabel: '加权累计 CPI',
  ribbonTitle: '选项核对（✓ 正确 / ✗ 干扰项）',
  intro: '点击「▶ 播放」逐步展开推理链：先加权求平均 CPI，再除以主频得 MIPS。',
  snaps: snaps,
  result: {
    big: '400 MIPS',
    html: '答案 <b>C</b>。平均 CPI = Σ(比例×CPI) = <b>3.0</b>，MIPS = <code>1200 ÷ 3 = 400</code>。<br>记忆锚点：干扰项 D（600）正是「忘加权、只看 A 类 CPI=2」的陷阱——比例只给权重，CPI 才是周期数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
