<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-18 流水线吞吐率</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：流水线吞吐率', cls: 'key',
    body: '<p>主频 1.03GHz、<b>4 段</b>流水线、每段 1 个时钟周期、执行 <b>100</b> 条指令、无阻塞。求吞吐率 TP。</p>' },
  { title: '公式：总时间 = (k + n − 1) × τ', cls: '',
    body: '<p>n 条指令、k 段流水线：第一条指令走完要 k 个周期，之后每周期流出 1 条，故共 <code>k + n − 1</code> 个周期。TP = n ÷ 总时间。</p>' },
  { title: '求时钟周期 τ', cls: '',
    body: '<p>主频 1.03GHz → τ = <code>1 ÷ 1.03GHz</code> ≈ <b>0.971 ns</b>。注意是 1/1.03 ns，不要粗略取 1 ns。</p>' },
  { title: '求总周期数', cls: '',
    body: '<p>k = 4，n = 100：总周期 = <code>4 + 100 − 1 = 103</code> 个。前 3 个周期是"装料"时间，没有指令流出，必须计入。</p>' },
  { title: '求总时间', cls: '',
    body: '<p>总时间 = 103 × (1/1.03) ns = <b>100 ns</b>（103 ÷ 1.03 恰好 = 100）。</p>' },
  { title: '求吞吐率', cls: 'good',
    body: '<p>TP = 100 条 ÷ 100 ns = 1 条/ns = <b>1.0×10<sup>9</sup> 条指令/秒</b> → 选项 <b>C</b>。</p>' },
  { title: '排除 D（1.03×10^9）', cls: 'bad',
    body: '<p>漏掉填充时间、只算 100 个周期：100 × τ ≈ 97ns → TP ≈ 1.03×10<sup>9</sup>，数值恰好等于主频，是最强干扰项。</p>' },
  { title: '排除 B（0.97×10^9）', cls: 'bad',
    body: '<p>把 τ 粗略取成 1ns：总时间 = 103ns → TP = 100/103 ≈ 0.97×10<sup>9</sup>。错在精度：τ 精确为 1/1.03 ns，总时间整好 100ns。</p>' },
  { title: '排除 A（0.25×10^9）', cls: 'bad',
    body: '<p>0.25×10<sup>9</sup> = 主频 ÷ 4，误以为 4 段流水线让吞吐率降为 1/4——流水线是<b>提高</b>吞吐率的，不是减速器。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：TP = n ÷ [(k + n − 1) × τ]，<b>填充周期 +1</b> 不能丢。</p>' },
];

var RIBBON_AT = { 5: { k: 3, ok: true }, 6: { k: 4, ok: false }, 7: { k: 2, ok: false }, 8: { k: 1, ok: false } };

var SCLS = { '': 'step', key: 'shift', good: 'ok', bad: 'miss' };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : SCLS[s.cls || ''],
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (RIBBON_AT[i]) {
    sn.ribbon = RIBBON_AT[i];
    sn.cls = sn.ribbon.ok ? 'ok' : 'miss';
    sn.tag = '选项 ' + ['A', 'B', 'C', 'D'][sn.ribbon.k - 1] + (sn.ribbon.ok ? ' ✓' : ' ✗');
  }
  return sn;
});

AW.init({
  title: '2013 真题 · 流水线吞吐率',
  subtitle: '主频 <code>1.03GHz</code> · 4 段流水线 · 100 条指令 · 无阻塞',
  counterLabel: '步骤',
  ribbonTitle: '选项核对（✓ 正确 / ✗ 干扰项）',
  intro: '点击「▶ 播放」逐步展开推理链：公式 → 时钟周期 → 总时间 → 吞吐率 → 排除干扰项。',
  snaps: snaps,
  result: {
    big: '1.0×10^9 条指令/秒',
    html: '答案 <b>C</b>。总周期 = <code>4 + 100 − 1 = 103</code>，τ = <code>1/1.03 ns</code>，总时间 = <b>100 ns</b>，TP = <code>100 ÷ 100ns</code>。<br>记忆锚点：公式里的 <b>k + n − 1</b>；D 选项 = 主频数值，是「忘加填充时间」的经典陷阱。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
