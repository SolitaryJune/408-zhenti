<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-20 提高 RAID 可靠性的措施</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：可靠 = 可恢复', cls: 'key',
    body: '<p>题干四项：Ⅰ 磁盘镜像、Ⅱ 条带化、Ⅲ 奇偶校验、Ⅳ 增加 Cache。判断标准：<b>有没有提供数据冗余（坏了能恢复）</b>——那是可靠性；只让读写更快是性能。</p>' },
  { title: 'Ⅰ 磁盘镜像 ✓', cls: 'good',
    body: '<p>同一数据写到两块盘，坏一块另一块还有完整数据（RAID 1）——典型冗余 → <b>提高可靠性</b>。</p>' },
  { title: 'Ⅱ 条带化 ✗', cls: 'bad',
    body: '<p>数据分块摊到多块盘并行读写（RAID 0），提高速度和容量利用率；任何一块盘坏数据即缺 → <b>只提性能</b>，不提高可靠性。</p>' },
  { title: 'Ⅲ 奇偶校验 ✓', cls: 'good',
    body: '<p>多块盘数据算出奇偶校验信息，坏一块时可用其余盘 + 校验信息<b>恢复</b>（RAID 3/5）→ <b>提高可靠性</b>。</p>' },
  { title: 'Ⅳ 增加 Cache ✗', cls: 'bad',
    body: '<p>缓存热点数据、减少访盘次数，加快响应；但 Cache 只是临时副本，掉电即失 → <b>只提性能</b>。</p>' },
  { title: '组合对照选项', cls: 'good',
    body: '<p>提高可靠性 = Ⅰ + Ⅲ → 「仅Ⅰ、Ⅲ」= 选项 <b>B</b>。A 含Ⅱ，C 含Ⅳ，D 含Ⅱ和Ⅳ，均混入了只提性能的措施。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：镜像、奇偶校验 = <b>冗余 → 可靠</b>；条带化、Cache = <b>提速 → 性能</b>。</p>' },
];

var RIBBON_AT = { 1: { k: 1, ok: true }, 2: { k: 2, ok: false }, 3: { k: 3, ok: true }, 4: { k: 4, ok: false } };

var SCLS = { '': 'step', key: 'shift', good: 'ok', bad: 'miss' };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : SCLS[s.cls || ''],
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (RIBBON_AT[i]) {
    sn.ribbon = RIBBON_AT[i];
    sn.cls = sn.ribbon.ok ? 'ok' : 'miss';
    sn.tag = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ'][sn.ribbon.k - 1] + (sn.ribbon.ok ? ' ✓ 可靠' : ' ✗ 性能');
  }
  return sn;
});

AW.init({
  title: '2013 真题 · RAID 可靠性措施辨析',
  subtitle: 'Ⅰ 磁盘镜像 · Ⅱ 条带化 · Ⅲ 奇偶校验 · Ⅳ 增加 Cache · 逐项判断',
  counterLabel: '步骤',
  ribbonTitle: '四项措施（✓ 提高可靠性 / ✗ 只提性能）',
  intro: '点击「▶ 播放」逐步判断四项措施各自的作用，再组合对照选项。',
  snaps: snaps,
  result: {
    big: '仅Ⅰ、Ⅲ → 答案 B',
    html: '记忆锚点：<b>镜像（RAID 1）与奇偶校验（RAID 3/5）提供冗余 → 可靠性</b>；条带化（RAID 0）与 Cache 只提速 → 性能。<br>凡是含Ⅱ或Ⅳ的组合（A、C、D）全部排除。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
