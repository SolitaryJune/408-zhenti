<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-22 中断 I/O 与 DMA 的比较</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：找「错误」项', cls: 'key',
    body: '<p>题目问<b>错误</b>的是哪项。四个比较维度：请求对象、响应时机、传送方式、适用设备。</p>' },
  { title: 'A：请求对象不同 ✓', cls: 'good',
    body: '<p>中断 I/O 请求的是 <b>CPU 处理时间</b>（CPU 要执行中断服务程序）；DMA 请求的是<b>总线使用权</b>（数据不经过 CPU，直接在设备与主存间传）→ 说法正确。</p>' },
  { title: 'B：响应时机不同 ✓', cls: 'good',
    body: '<p>中断响应发生在<b>一条指令执行结束</b>后（指令级）；DMA 响应发生在<b>一个总线事务（存取周期）完成</b>后（总线级），更及时 → 说法正确。</p>' },
  { title: 'C：传送方式不同 ✓', cls: 'good',
    body: '<p>中断方式的数据传送靠 CPU 执行 I/O 指令（<b>软件</b>）完成；DMA 方式由 DMA 控制器（<b>硬件</b>）完成 → 说法正确。</p>' },
  { title: 'D：「适用于所有设备」✗', cls: 'bad',
    body: '<p>中断方式每次传送都要 CPU 执行一段服务程序，开销大；<b>高速设备（如磁盘）来不及响应会丢数据</b>，只适合中低速设备。「中断 I/O 适用于<b>所有</b>外部设备」太绝对 → 说法<b>错误</b>，正是本题要找的答案。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：中断借「CPU 时间」、DMA 借「总线」；中断等指令结束、DMA 等总线事务结束；中断是软件传、DMA 是硬件传；高速设备必须 DMA。</p>' },
];

var RIBBON_AT = { 1: { k: 1, ok: true }, 2: { k: 2, ok: true }, 3: { k: 3, ok: true }, 4: { k: 4, ok: false } };

var SCLS = { '': 'step', key: 'shift', good: 'ok', bad: 'miss' };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : SCLS[s.cls || ''],
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (RIBBON_AT[i]) {
    sn.ribbon = RIBBON_AT[i];
    sn.cls = sn.ribbon.ok ? 'ok' : 'miss';
    sn.tag = '选项 ' + ['A', 'B', 'C', 'D'][sn.ribbon.k - 1] + (sn.ribbon.ok ? ' 说法✓' : ' 说法✗');
  }
  return sn;
});

AW.init({
  title: '2013 真题 · 中断 I/O 与 DMA 比较',
  subtitle: '找<b>错误</b>项 · 四个维度：请求对象 / 响应时机 / 传送方式 / 适用设备',
  counterLabel: '步骤',
  ribbonTitle: '选项核对（✓ 说法正确 / ✗ 说法错误）',
  intro: '点击「▶ 播放」逐项核对 A~D 的说法，找出错误的那个。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: 'A、B、C 是中断与 DMA 的公认区别，说法均正确；D 说「中断 I/O 方式适用于<b>所有</b>外部设备」——高速设备靠中断会丢数据，必须用 DMA，故 D 错误。<br>记忆锚点：见到「所有」「仅」这类绝对化表述要警惕。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
