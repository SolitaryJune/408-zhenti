<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-24 CD-ROM 视频文件的块组织方式</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：只读介质 + 随机播放',
    cls: 'key',
    scls: 'shift', tag: '审题',
    body: '<p>两个关键词：<b>CD-ROM</b> 是只读光盘，文件一次性写入、以后不再增删改；<b>快速随机播放</b>要求能按块号直接定位任意数据块，定位开销越小越好。</p>' },
  { title: 'A 连续结构：直接算出位置，最快',
    cls: 'good',
    scls: 'ok',
    body: '<p>连续结构下文件占<b>连续的盘块</b>，知道起始块号后，第 i 块的位置 = <code>起始块号 + i</code>，一次加法直接定位、无需任何中间查找。对一次性写入、之后只读的视频文件来说没有扩展问题，<b>随机访问性能最好</b>。</p>' },
  { title: 'B 链式结构：只能顺链找',
    cls: 'bad',
    scls: 'step',
    body: '<p>链式结构每块末尾存<b>指针</b>，想到第 i 块必须从头沿链读 i 次——跳着播放（随机访问）时开销巨大，与“快速随机播放”背道而驰。</p>' },
  { title: 'C 直接索引 / D 多级索引：多一次索引访盘',
    cls: 'bad',
    scls: 'step',
    body: '<p>索引结构要先读<b>索引块</b>查出目标块号，再读数据块，随机定位多一次访盘；多级索引访盘次数更多。它们的优势是支持文件<b>动态增长</b>，但 CD-ROM 只读、根本不需要，付出索引开销不划算。</p>' },
  { title: '结论',
    cls: 'good',
    scls: 'done',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>只读 + 要随机定位 → 连续结构</b>（加法直接定位）；链式怕随机、索引怕额外访盘。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.scls || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2013-24】CD-ROM 视频文件的最佳块组织方式',
  subtitle: '考点：连续 / 链接 / 索引文件的访问性能 · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（连续结构）',
    html: '连续结构：位置 = <code>起始块号 + i</code>，一次算出、随机定位最快。链式结构随机访问要沿链找 i 次；索引/多级索引都要先读索引块，多一次访盘，而 CD-ROM 只读、无需支持文件增长。记忆点：<b>只读 + 随机 → 连续</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
