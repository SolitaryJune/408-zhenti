<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-26 与单个文件长度无关的因素</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：单文件最大长度 = 能“够着”多少块',
    cls: 'key',
    scls: 'shift', tag: '审题',
    body: '<p>含直接/间接地址项的索引结点下，单个文件的最大长度 = 该文件能索引到的所有数据块之和。逐个选项对照：它受谁影响、不受谁影响。</p>' },
  { title: 'C 地址项的个数：相关',
    cls: 'bad',
    scls: 'step',
    body: '<p>地址项越多（直接项 + 间接项），能指向的数据块就越多，文件可以越长。<b>相关，排除 C。</b></p>' },
  { title: 'B 间接地址索引的级数：相关',
    cls: 'bad',
    scls: 'step',
    body: '<p>一级、二级、三级间接地址层层扩大可寻址范围：每升一级，可多索引一批块。<b>相关，排除 B。</b></p>' },
  { title: 'D 文件块大小：相关',
    cls: 'bad',
    scls: 'step',
    body: '<p>每块越大，同样块数下文件越长；块大小也决定每个间接块能存多少个地址项。<b>相关，排除 D。</b></p>' },
  { title: 'A 索引结点的总数：无关',
    cls: 'good',
    scls: 'ok',
    body: '<p>索引结点总数 = 整个文件系统最多能容纳<b>多少个文件</b>（每个文件一个 inode），是文件系统建立时定下的<b>系统级规模参数</b>。它限制文件的“个数”，与某一个文件自身能有多长毫无关系。<b>无关，选 A。</b></p>' },
  { title: '结论',
    cls: 'good',
    scls: 'done',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>单文件长度 = 地址项个数 ×（各级间接 × 块大小）的组合</b>；inode 总数管“文件个数”，不管“文件长度”。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.scls || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2013-26】与单个文件长度无关的因素',
  subtitle: '考点：索引结点 · 地址项 / 间接级数 / 块大小 / inode 总数 · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（索引结点的总数）',
    html: '单文件长度由<b>地址项个数</b>、<b>间接级数</b>、<b>块大小</b>共同决定；<b>索引结点总数</b>是文件系统的全局规模参数（最多存多少个文件），与单个文件长度无关。记忆点：<b>inode 总数管个数，不管长度</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
