<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-27 单缓冲读入并分析 2 个数据块的最短时间</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
<style>
  .tl-wrap{ min-width: 640px; }
  .tl-row{ display:flex; align-items:center; margin: 9px 0; }
  .tl-lab{ width: 158px; font-size: 12.5px; color:#47616c; flex: 0 0 auto; line-height:1.4; }
  .tl-lab b{ color:#213e48; }
  .tl-track{ flex:1; position:relative; height: 38px; background:#f8edcb; border-radius: 8px; }
  .tl-seg{ position:absolute; top:4px; bottom:4px; border-radius: 6px; overflow:visible;
           display:flex; align-items:center; justify-content:center;
           font-size: 11.5px; font-weight: 700; color:#fff; }
  .tl-seg.read{ background:#47616c; }
  .tl-seg.move{ background:#e07a2f; }
  .tl-seg.ana{ background:#2f9e44; }
  .tl-seg.now{ box-shadow: 0 0 0 2.5px #1b3a4b inset; }
  .tl-seg .sm{ position:absolute; top:-14px; font-size:10px; color:#47616c; white-space:nowrap; }
  .tl-ruler{ flex:1; position:relative; height: 18px; margin-left: 158px; }
  .tl-tick{ position:absolute; top:0; font-size:10.5px; color:#b9cbd0; font-family:monospace; transform:translateX(-50%); }
  .tl-tick.first{ transform:none; }
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var S = {};
var TMAX = 300;   // 总时间轴 0~300

/* 三条行的各段时间片：from = 出现在第几步 */
var SEGS = [
  { row: 0, t0: 0,   t1: 100, label: '读入块1（100）', cls: 'read', from: 1 },
  { row: 1, t0: 100, t1: 105, label: '5',             cls: 'move', from: 2 },
  { row: 2, t0: 105, t1: 195, label: '分析块1（90）',  cls: 'ana',  from: 3 },
  { row: 0, t0: 105, t1: 205, label: '读入块2（100）', cls: 'read', from: 3 },
  { row: 1, t0: 205, t1: 210, label: '5',             cls: 'move', from: 5 },
  { row: 2, t0: 210, t1: 300, label: '分析块2（90）',  cls: 'ana',  from: 6 },
];

function segEl(seg, i){
  var d = AW.el('div', 'tl-seg ' + seg.cls);
  d.style.left  = (seg.t0 / TMAX * 100) + '%';
  d.style.width = ((seg.t1 - seg.t0) / TMAX * 100) + '%';
  if (seg.t1 - seg.t0 <= 10){
    var s = AW.el('span', 'sm', seg.label);   // 窄段：标签放段上方
    d.appendChild(s);
  } else {
    d.textContent = seg.label;
  }
  if (seg.from === i) d.classList.add('now');
  return d;
}

AW.init({
  title: '【2013-27】单缓冲：读入并分析 2 个数据块的最短时间',
  subtitle: '读入 <code>100</code> · 缓冲区→工作区 <code>5</code> · 分析 <code>90</code> · 单缓冲（缓冲区一次只装一块）',
  counterLabel: '时间进度',
  ribbonTitle: '关键步骤（✓ 已完成）',
  intro: '点击「▶ 播放」看三条时间线如何排布，找出可并行的环节。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', 'tl-wrap');
    var names = ['① 读入：外设 → 系统缓冲区', '② 传送：缓冲区 → 用户工作区', '③ 分析：用户工作区数据'];
    S.tracks = [];
    for (var r = 0; r < 3; r++){
      var row = AW.el('div', 'tl-row');
      row.appendChild(AW.el('div', 'tl-lab', '<b>' + names[r] + '</b>'));
      var tr = AW.el('div', 'tl-track');
      row.appendChild(tr);
      S.tracks.push(tr);
      inner.appendChild(row);
    }
    var rulerRow = AW.el('div', 'tl-row');
    var rl = AW.el('div', 'tl-ruler');
    [0, 100, 200, 300].forEach(function(t){
      var k = AW.el('div', 'tl-tick' + (t === 0 ? ' first' : ''), String(t));
      k.style.left = (t / TMAX * 100) + '%';
      rl.appendChild(k);
    });
    rulerRow.appendChild(AW.el('div', 'tl-lab', ''));
    rulerRow.appendChild(rl);
    inner.appendChild(rulerRow);
    S.note = AW.el('div', 'aw-row-label', '');
    inner.appendChild(S.note);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    for (var r = 0; r < 3; r++){
      S.tracks[r].innerHTML = '';
      SEGS.forEach(function(seg){
        if (seg.row === r && seg.from <= i) S.tracks[r].appendChild(segEl(seg, i));
      });
    }
    var notes = {
      0: '单缓冲约束：<b>系统缓冲区同一时间只能装一个数据块</b>；传送时缓冲区被占用。求 2 个块的<b>最短</b>总时间 → 能并行就并行。',
      1: '0~100：外设把块1 读入系统缓冲区。',
      2: '100~105：块1 从缓冲区送入用户工作区（仅 5）。此刻起<b>缓冲区被腾空</b>——这是并行启动的关键。',
      3: '105 起<b>并行</b>：③ 分析块1（105~195）与 ① 读入块2（105~205）同时进行——缓冲区已空，读块2 不必等分析块1 完成。',
      4: '195 分析块1 完毕；205 块2 读入缓冲区完毕。整段时间由读块2 的 100 决定（100 > 90）。',
      5: '205~210：块2 从缓冲区送入用户工作区。',
      6: '210~300：分析块2，到 300 全部完成。',
      7: '总时间 = <b>100 + 5 + 100 + 5 + 90 = 300</b>（中间重叠段取 max(90, 100) = 100）。',
    };
    S.note.innerHTML = notes[i] || '';
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'单缓冲三步：读入 100 → 传送 5 → 分析 90，求 2 块最短时间', count:0 },
    { cls:'step',  tag:'读入块1', log:'0~100：块1 读入系统缓冲区', count:100, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'传送块1', log:'100~105：缓冲区→工作区（5）；缓冲区腾空', count:105, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'并行开始', log:'105 起：分析块1（105~195）与 读入块2（105~205）并行', count:105, ribbon:{k:3, ok:true} },
    { cls:'step',  tag:'并行中', log:'195 分析完块1；205 块2 读入完毕，由读块2 的 100 决定进度', count:205, ribbon:{k:4, ok:true} },
    { cls:'shift', tag:'传送块2', log:'205~210：块2 送入用户工作区', count:210, ribbon:{k:5, ok:true} },
    { cls:'step',  tag:'分析块2', log:'210~300：分析块2，全部完成', count:300, ribbon:{k:6, ok:true} },
    { cls:'done',  tag:'完成', log:'总时间 = 100+5+100+5+90 = 300，选 C', count:300, done:true },
  ],

  result: {
    big: '最短时间 300（选 C）',
    html: '公式：<b>读块1(100) + 传送1(5) + max(分析1=90, 读块2=100) + 传送2(5) + 分析2(90) = 300</b>。关键是传送块1 后缓冲区腾空，<b>分析块1 与读入块2 并行</b>。干扰项：390 是完全不并行（2×195）；295 漏算了必须等缓冲区腾空的时间。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
