<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-28 用户态切换到内核态的操作</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：进内核态的三条通道',
    cls: 'key',
    scls: 'shift', tag: '审题',
    body: '<p>用户态 → 内核态只能由硬件强制触发：<b>① 异常（内部中断）</b>如除零、缺页；<b>② 外部中断</b>；<b>③ 系统调用</b>（执行陷入指令）。逐项对照题中三个操作。</p>' },
  { title: 'I 整数除以零：异常 → 转内核态',
    cls: 'good',
    scls: 'ok',
    body: '<p>除零是算术运算<b>异常（内部中断）</b>，硬件自动陷入内核，由内核的异常处理程序处理（通常终止进程）。<b>会转内核态 ✓</b></p>' },
  { title: 'II sin() 函数调用：库函数，留在用户态',
    cls: 'bad',
    scls: 'step',
    body: '<p>sin() 是数学<b>库函数</b>，其计算完全在用户态的库代码中完成，不执行特权指令、不陷入内核。<b>不转内核态 ✗</b> —— 关键辨析：<b>库函数 ≠ 系统调用</b>。</p>' },
  { title: 'III read 系统调用：陷入指令 → 转内核态',
    cls: 'good',
    scls: 'ok',
    body: '<p>read 是真正的<b>系统调用</b>：用户程序执行陷入指令，CPU 转入内核态执行内核的读服务例程。<b>会转内核态 ✓</b></p>' },
  { title: '结论',
    cls: 'good',
    scls: 'done',
    body: '<p>答案选 <b>B</b>（仅 I、III）。记忆锚点：<b>异常和系统调用进内核，库函数不进</b>——库函数是用户态的普通函数，系统调用才有陷入指令这一步。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.scls || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2013-28】哪些操作导致用户态 → 内核态',
  subtitle: '考点：异常 / 中断 / 系统调用 vs 库函数 · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（仅 I、III）',
    html: '<b>I 整数除以零</b>：异常，硬件陷入内核 ✓；<b>II sin()</b>：库函数，用户态完成 ✗；<b>III read 系统调用</b>：陷入指令进内核 ✓。记忆点：<b>库函数 ≠ 系统调用</b>，只有异常、中断、陷入指令才能把 CPU 带进内核态。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
