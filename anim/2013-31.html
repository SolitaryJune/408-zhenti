<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-31 按计算/I/O 比例设置优先级</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：目标是资源利用率，不是单个任务跑得快',
    cls: 'key',
    scls: 'shift', tag: '审题',
    body: '<p>题问“提高系统资源利用率”——就是让 <b>CPU 与 I/O 设备尽量并行</b>：设备忙时 CPU 别闲着，CPU 忙时设备也别空转。优先级设置要服务于这个目标。</p>' },
  { title: 'P₃：85% I/O，I/O 繁忙型',
    cls: 'good',
    scls: 'ok',
    body: '<p>P₃ 计算仅 15%、I/O 占 85%。给它<b>最高优先级</b>：一拿到 CPU 很快算完就去发起 I/O，设备不停歇；它等 I/O 阻塞时立刻把 CPU 让出来。I/O 繁忙者优先级应<b>最高</b>。</p>' },
  { title: 'P₂：50% / 50%，均衡型',
    cls: 'good',
    scls: 'step',
    body: '<p>P₂ 计算与 I/O 各半，优先级居中：<b>P₂ 排第二</b>。</p>' },
  { title: 'P₁：90% 计算，CPU 繁忙型',
    cls: 'bad',
    scls: 'step',
    body: '<p>P₁ 几乎不发起 I/O（仅 10%）。若让它高优先级，它会长期霸占 CPU，期间 I/O 设备大量空转。CPU 繁忙型进程优先级应<b>最低</b>：<b>P₁ 排最后</b>。</p>' },
  { title: '排序与结论',
    cls: 'good',
    scls: 'done',
    body: '<p>按 I/O 占比排序：<b>P₃ > P₂ > P₁</b>，答案选 <b>B</b>。记忆锚点：<b>I/O 繁忙者优先</b>——让 CPU 与设备最大程度并行，才是“资源利用率最高”。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.scls || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2013-31】合理的进程优先级设置',
  subtitle: '考点：I/O 繁忙型与 CPU 繁忙型进程的优先级 · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（P₃ > P₂ > P₁）',
    html: 'I/O 时间占比越高，优先级越高：<b>P₃（85% I/O）> P₂（50%）> P₁（10%）</b>。这样 I/O 繁忙的进程快速发起 I/O、阻塞时让出 CPU，CPU 与设备充分并行，资源利用率最高。记忆点：<b>I/O 繁忙者优先</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
