<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-32 银行家算法与安全状态</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：银行家算法 = 死锁“避免”',
    cls: 'key',
    scls: 'shift', tag: '审题',
    body: '<p>先定位：银行家算法属<b>死锁避免</b>策略——不破坏任何必要条件，每次分配前<b>试分配</b>，检查系统是否仍处<b>安全状态</b>，安全才真正分配。</p>' },
  { title: 'A “可以预防死锁” / D “破坏请求和保持”：错',
    cls: 'bad',
    scls: 'step',
    body: '<p><b>预防</b>靠破坏四个必要条件（如静态一次性申请全部资源破坏“请求和保持”）。银行家算法允许进程边持有边申请，<b>不破坏任何条件</b>，靠动态安全性检查避开危险——所以 A、D 都错。</p>' },
  { title: 'B “安全状态 ⇒ 一定无死锁”：对',
    cls: 'good',
    scls: 'ok',
    body: '<p>安全 = 存在<b>安全序列</b>：按此序列推进，每个进程都能拿到所需资源并运行完毕。既然存在这样一条稳妥的推进路线，系统<b>一定不会死锁</b>。<b>正确。</b></p>' },
  { title: 'C “不安全 ⇒ 一定死锁”：错',
    cls: 'bad',
    scls: 'step',
    body: '<p>不安全 = 找不到安全序列，只说明<b>可能</b>死锁。实际推进中进程可能提前释放资源、需求也可能变化，未必真死锁。“不安全 ⇒ 可能死锁”，不是“一定死锁”。C 错。</p>' },
  { title: '结论',
    cls: 'good',
    scls: 'done',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>安全 ⇒ 必无死锁；不安全 ⇒ 只是可能死锁</b>；银行家是“避免”不是“预防”，也不破坏“请求和保持”条件。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.scls || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2013-32】关于银行家算法的正确叙述',
  subtitle: '考点：死锁避免 · 安全状态与不安全状态 · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '<b>安全状态</b>：存在安全序列 → <b>一定无死锁</b>（B 对）。<b>不安全状态</b>：只是可能死锁，不一定真死锁（C 错）。银行家算法是<b>死锁避免</b>而非预防（A 错），不破坏“请求和保持”条件（D 错）。记忆锚点：<b>安全 ⇒ 无死锁，不安全 ⇒ 有风险但未必死锁</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
