<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-33 动画 · OSI 应用层的相邻层</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：「应用层的相邻层」是哪一层',
    cls: 'key',
    tag: '审题',
    body: '<p>OSI 七层自上而下：<code>应用(7) → 表示(6) → 会话(5) → 传输(4) → 网络(3) → 链路(2) → 物理(1)</code>。与应用层直接相邻的是<b>表示层（第 6 层）</b>——本题实际在问：哪个功能属于<b>表示层</b>。</p>' },
  { title: '逐项分析 A：对话管理',
    cls: 'bad',
    tag: 'A = 会话层',
    body: '<p>A（对话管理）：对话的建立、同步、维护与拆除是<b>会话层（第 5 层）</b>的招牌功能——但它与应用层之间还隔着表示层，不是「相邻层」，<b>错</b>。</p>' },
  { title: '逐项分析 B：数据格式转换',
    cls: 'good',
    tag: 'B = 表示层 ✓',
    body: '<p>B（数据格式转换）：编码转换、加密解密、压缩解压，管「数据语法」的正是<b>表示层（第 6 层）</b>——恰好是应用层的紧邻下一层，<b>对</b>。</p>' },
  { title: '逐项分析 C：路由选择',
    cls: 'bad',
    tag: 'C = 网络层',
    body: '<p>C（路由选择）：分组从源网络到目的网络的路径选择是<b>网络层（第 3 层）</b>的职责，离应用层很远，<b>错</b>。</p>' },
  { title: '逐项分析 D：可靠数据传输',
    cls: 'bad',
    tag: 'D = 传输层',
    body: '<p>D（可靠数据传输）：端到端的可靠传输由<b>传输层（第 4 层）</b>负责（如 TCP 的确认与重传），不是表示层，<b>错</b>。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '答案 B',
    body: '<p>表示层的邻居是应用层，表示层管<b>数据格式转换</b> → 答案选 <b>B</b>。记忆锚点：<b>表示层 = 翻译官（格式转换/加密/压缩）</b>；对话管理在会话层，路由在网络层，可靠传输在传输层。</p>' },
];

var CLSMAP = { key: 'shift', bad: 'miss', good: 'ok' };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (CLSMAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title + ' —— ' + s.tag,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'OSI 应用层的相邻层实现什么功能（2013·33）',
  subtitle: '考点：<code>OSI 七层定位</code> · 相邻层 = 表示层（第 6 层）· 选项逐项对号入座',
  counterLabel: '已推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（数据格式转换）',
    html: '应用层的相邻层是<b>表示层（第 6 层）</b>：数据格式转换、加密、压缩都归它管。干扰项归属——A 对话管理＝<b>会话层</b>，C 路由选择＝<b>网络层</b>，D 可靠数据传输＝<b>传输层</b>。记「表示层＝翻译官」即可秒杀此类题。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
