<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-34 动画 · 曼彻斯特编码解码</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var BITS = [0, 0, 1, 1, 0, 1, 1, 0];
var LV = [];                       // 每码元两半的电平：'H'/'L'
BITS.forEach(function(b){ if(b === 0){ LV.push('L','H'); } else { LV.push('H','L'); } });

var X0 = 30, W = 88, YH = 20, YL = 80;

function bitPts(j){
  var xs = X0 + W*j, xm = xs + W/2, xe = xs + W;
  var y1 = (LV[2*j] === 'H') ? YH : YL;
  var y2 = (LV[2*j + 1] === 'H') ? YH : YL;
  return xs + ',' + y1 + ' ' + xm + ',' + y1 + ' ' + xm + ',' + y2 + ' ' + xe + ',' + y2;
}

AW.init({
  title: '10BaseT 波形解码：曼彻斯特编码（2013·34）',
  subtitle: '以太网口径：<code>码元正中间 低→高（升）= 0，高→低（降）= 1</code> · 8 个码元',
  counterLabel: '已解码码元',
  ribbonTitle: '码元进度（✓ 已解码）',
  intro: '点击「▶ 播放」逐个码元解码波形。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    inner.appendChild(AW.el('div', 'aw-row-label',
      '<b>规则</b>：曼彻斯特编码每个码元正中间必有跳变——以太网规定<b>上升沿 = 0、下降沿 = 1</b>；虚线为码元边界（边界处的电平变化不是数据）。'));

    var lines = '';
    for (var i = 0; i <= 8; i++){
      var x = X0 + W*i;
      lines += '<line x1="' + x + '" y1="10" x2="' + x + '" y2="102" stroke="#5a7d8c66" stroke-dasharray="4 4"/>';
    }
    var labels = '';
    for (var m = 0; m < 8; m++){
      labels += '<text x="' + (X0 + W*m + W/2 - 18) + '" y="118" font-size="11" fill="#586e72">码元' + (m + 1) + '</text>';
    }
    var svg = '<svg width="766" height="124" style="background:#f8edcb;border:1px solid #1b3a4b26;border-radius:10px;display:block">' +
      lines +
      '<text x="6" y="24" font-size="12" fill="#b9cbd0">高</text>' +
      '<text x="6" y="84" font-size="12" fill="#b9cbd0">低</text>' +
      '<polyline id="waveDone" points="" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linejoin="round"/>' +
      '<polyline id="waveCur" points="" fill="none" stroke="#e07a2f" stroke-width="3" stroke-linejoin="round"/>' +
      labels + '</svg>';
    inner.appendChild(AW.el('div', '', svg));

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>解出比特</b>（从左到右）'));
    var row = AW.cellRow(['?','?','?','?','?','?','?','?'], ['dim','dim','dim','dim','dim','dim','dim','dim']);
    inner.appendChild(row);

    wrap.appendChild(inner);
    stage.appendChild(wrap);

    // svg 与格子已插入 DOM，直接取元素
    this._waveEl = document.getElementById('waveDone');
    this._curEl = document.getElementById('waveCur');
    this._boxes = [];
    var boxes = row.querySelectorAll('.aw-box');
    for (var k = 0; k < boxes.length; k++){ this._boxes.push(boxes[k]); }
  },

  snaps: [
    { cls:'shift', tag:'规则',     n:0, count:0, log:'以太网采用曼彻斯特编码：每个码元正中间必有跳变——低→高（上升沿）记 0，高→低（下降沿）记 1' },
    { cls:'ok',    tag:'码元1 = 0', n:1, count:1, ribbon:{k:1, ok:true}, log:'码元 1：前半低、后半高，正中间低→高上升沿 → 比特 0' },
    { cls:'ok',    tag:'码元2 = 0', n:2, count:2, ribbon:{k:2, ok:true}, log:'码元 2：又是低→高上升沿 → 比特 0' },
    { cls:'ok',    tag:'码元3 = 1', n:3, count:3, ribbon:{k:3, ok:true}, log:'码元 3：前半高、后半低，正中间高→低下降沿 → 比特 1' },
    { cls:'ok',    tag:'码元4 = 1', n:4, count:4, ribbon:{k:4, ok:true}, log:'码元 4：高→低下降沿 → 比特 1' },
    { cls:'ok',    tag:'码元5 = 0', n:5, count:5, ribbon:{k:5, ok:true}, log:'码元 5：低→高上升沿 → 比特 0' },
    { cls:'ok',    tag:'码元6 = 1', n:6, count:6, ribbon:{k:6, ok:true}, log:'码元 6：高→低下降沿 → 比特 1' },
    { cls:'ok',    tag:'码元7 = 1', n:7, count:7, ribbon:{k:7, ok:true}, log:'码元 7：高→低下降沿 → 比特 1' },
    { cls:'ok',    tag:'码元8 = 0', n:8, count:8, ribbon:{k:8, ok:true}, log:'码元 8：低→高上升沿 → 比特 0' },
    { cls:'done',  tag:'完成',     n:8, count:8, done:true, log:'8 个码元解码完毕：0011 0110 → 对应选项 A' },
  ],

  render: function(stage, sn, i){
    var self = this;
    var n = sn.n || 0;
    var gp = [], ap = [];
    for (var j = 0; j < n; j++){
      if (j === n - 1){ ap.push(bitPts(j)); } else { gp.push(bitPts(j)); }
    }
    if (self._waveEl){ self._waveEl.setAttribute('points', gp.join(' ')); }
    if (self._curEl){ self._curEl.setAttribute('points', ap.join(' ')); }
    for (var b = 0; b < 8; b++){
      var box = self._boxes[b];
      if (b < n){
        box.textContent = String(BITS[b]);
        box.className = (b === n - 1) ? 'aw-box hit' : 'aw-box ok';
      } else {
        box.textContent = '?';
        box.className = 'aw-box dim';
      }
    }
  },

  result: {
    big: '0011 0110（选 A）',
    html: '以太网曼彻斯特口径：<b>码元正中间上升沿 = 0、下降沿 = 1</b>。8 个码元的中间跳变为「升 升 降 降 升 降 降 升」→ <code>0011 0110</code>。注意：只认<b>正中间</b>那一跳，码元边界处的电平变化不携带数据；记反约定会读出 1100 1001。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
