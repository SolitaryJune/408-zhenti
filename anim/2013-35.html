<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-35 动画 · 报文交换 vs 分组交换</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .lane{ position:relative; width:580px; height:64px; margin:6px 0 2px; }
  .lane .bar{ position:absolute; left:44px; right:44px; top:29px; height:4px; background:#cbd5e1; border-radius:2px; }
  .lane .node{ position:absolute; top:10px; width:58px; height:40px; border-radius:10px; border:2px solid #64748b;
               background:#f1f5f9; color:#334155; font-size:12px; font-weight:700;
               display:flex; align-items:center; justify-content:center; }
  .lane .cap{ position:absolute; top:52px; width:100px; font-size:11px; color:#94a3b8; text-align:center; }
  .pkt{ position:absolute; top:12px; height:34px; border-radius:9px; border:2px solid #2563eb; background:#eff6ff;
        color:#1d4ed8; font-size:12px; font-weight:700; font-family:Menlo,monospace;
        display:flex; align-items:center; justify-content:center;
        transition:left .6s cubic-bezier(.22,.8,.3,1), opacity .3s, background .2s; }
  .pkt.big{ width:76px; border-color:#d97706; background:#fffbeb; color:#92400e; font-size:13px; }
  .pkt.small{ width:44px; }
  .pkt.off{ opacity:0; }
  .pkt.arrive{ border-color:#16a34a; background:#f0fdf4; color:#15803d; }
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 三个节点的横坐标（lane 宽 580）
var PX = { A: 12, L1: 120, R: 262, L2: 400, B: 512 };

AW.init({
  title: '报文交换 vs 分组交换：总时间推演（2013·35）',
  subtitle: '甲 → 路由器 → 乙（<code>存储转发</code>）· 2 段链路均 10Mbps · 报文 8Mb · 分组 10kb（忽略传播时延/分组头/拆装）',
  counterLabel: '当前时刻',
  ribbonTitle: '两阶段（✓ 已算完）',
  intro: '点击「▶ 播放」先看报文交换，再看分组交换。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    function lane(title){
      inner.appendChild(AW.el('div', 'aw-row-label', title));
      var d = AW.el('div', 'lane');
      d.appendChild(AW.el('div', 'bar'));
      var nA = AW.el('div', 'node'); nA.textContent = '甲'; nA.style.left = PX.A + 'px';
      var nR = AW.el('div', 'node'); nR.textContent = '路由器'; nR.style.left = PX.R + 'px';
      var nB = AW.el('div', 'node'); nB.textContent = '乙'; nB.style.left = PX.B + 'px';
      d.appendChild(nA); d.appendChild(nR); d.appendChild(nB);
      var c1 = AW.el('div', 'cap', '10Mbps'); c1.style.left = '60px';
      var c2 = AW.el('div', 'cap', '10Mbps'); c2.style.left = '300px';
      d.appendChild(c1); d.appendChild(c2);
      inner.appendChild(d);
      return d;
    }

    var laneEl = lane('<b>传输线路</b>（存储转发：整段收完才能向下一跳转发）');

    // 大报文盒子 + 4 个分组盒子（按需显隐）
    var msg = AW.el('div', 'pkt big', '8Mb 报文');
    laneEl.appendChild(msg);
    var pkts = {};
    ['P1', 'P2', 'P3', 'P800'].forEach(function(id){
      var p = AW.el('div', 'pkt small off', id);
      laneEl.appendChild(p);
      pkts[id] = p;
    });

    wrap.appendChild(inner);
    stage.appendChild(wrap);
    this._msg = msg;
    this._pkts = pkts;
  },

  // msg: '甲'|'L1'|'R'|'L2'|'乙'|null ；pk: {P1:位置, ...}
  snaps: [
    { cls:'shift', tag:'场景',      msg:'甲', pk:{}, count:0,
      log:'主机甲经 1 个路由器（存储转发）与乙互联，两段链路均 10Mbps。先看报文交换：8Mb 整段传输' },
    { cls:'step',  tag:'链路1 发送', msg:'R', pk:{}, count:800,
      log:'报文在链路 1 上发送：8Mb ÷ 10Mbps = 800ms，路由器必须整段收完才能向链路 2 转发' },
    { cls:'ok',    tag:'报文交换完', msg:'乙', pk:{}, count:1600, ribbon:{k:1, ok:true},
      log:'报文在链路 2 上发送：又 800ms → 报文交换总时间 = 2 × 800 = 1600ms' },
    { cls:'shift', tag:'换分组交换', msg:null, pk:{P1:'甲', P2:'甲', P3:'甲'}, count:1600,
      log:'改用分组交换：8Mb ÷ 10kb = 800 个分组，每个分组发送时延 = 10kb ÷ 10Mbps = 1ms' },
    { cls:'step',  tag:'首分组出发', msg:null, pk:{P1:'L1', P2:'甲', P3:'甲'}, count:1,
      log:'t = 0：P1 上链路 1；t = 1ms：P1 到达路由器（首分组走第 1 段用 1ms）' },
    { cls:'ok',    tag:'流水线并行', msg:null, pk:{P1:'乙', P2:'R', P3:'L1'}, count:2,
      log:'t = 2ms：P1 到乙；此后路由器转发与甲发送并行，每过 1ms 乙就多收 1 个分组' },
    { cls:'ok',    tag:'分组交换完', msg:null, pk:{P800:'乙'}, count:801, ribbon:{k:2, ok:true},
      log:'最后一个分组 P800：t = 799ms 开始发送，t = 799 + 2 = 801ms 到乙 → 分组交换总时间 = (800 + 2 − 1) × 1ms = 801ms' },
    { cls:'done',  tag:'对比结论',  msg:null, pk:{P800:'乙'}, count:801, done:true,
      log:'报文交换 1600ms，分组交换 801ms → 选 D' },
  ],

  render: function(stage, sn, i){
    var pos = { '甲':PX.A, 'L1':PX.L1, 'R':PX.R, 'L2':PX.L2, '乙':PX.B };
    var msg = this._msg, pkts = this._pkts;
    // 报文盒
    if (sn.msg){
      msg.style.opacity = '1';
      msg.style.left = pos[sn.msg] + 'px';
      msg.className = 'pkt big' + (sn.msg === '乙' ? ' arrive' : '');
    } else {
      msg.style.opacity = '0';
      msg.className = 'pkt big off';
    }
    // 分组盒
    ['P1','P2','P3','P800'].forEach(function(id){
      var p = pkts[id];
      if (sn.pk[id]){
        p.style.opacity = '1';
        p.style.left = pos[sn.pk[id]] + 'px';
        p.className = 'pkt small' + (sn.pk[id] === '乙' ? ' arrive' : '');
      } else {
        p.style.opacity = '0';
        p.className = 'pkt small off';
      }
    });
  },

  result: {
    big: '1600ms · 801ms（选 D）',
    html: '<b>报文交换</b>：每段链路整段重发，2 × (8Mb/10Mbps) = <b>1600ms</b>。<b>分组交换</b>：800 个分组流水传输，首分组 2ms 走完 + 其余 799 个每 1ms 到达 1 个 → (N + k − 1) × 1ms = <b>801ms</b>。流水线让两段链路并行，是分组交换省时的关键。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
