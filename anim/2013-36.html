<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-36 动画 · 介质访问控制：谁可能冲突</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：冲突从哪里来',
    cls: 'key',
    tag: '审题',
    body: '<p>冲突 = 两个发送者的信号在同一信道上叠加。所以判据只有一条：信道资源是<b>预先划分</b>的（人人各得一份，无从冲突），还是<b>动态争用</b>的（大家抢，可能撞上）。</p>' },
  { title: 'TDMA：切时间，各占一段',
    cls: 'bad',
    tag: 'C 无冲突',
    body: '<p>C（TDMA 时分复用）：把时间划成时间片轮流使用，任一时刻<b>只有一个站点</b>在发送——时间上不会撞，<b>不可能冲突</b>。</p>' },
  { title: 'FDMA：切频率，各占一段',
    cls: 'bad',
    tag: 'D 无冲突',
    body: '<p>D（FDMA 频分复用）：把频带划给各用户，各自在自己的频段上发送——频率上不会撞，<b>不可能冲突</b>。</p>' },
  { title: 'CDMA：切码型，正交区分',
    cls: 'bad',
    tag: 'A 无冲突',
    body: '<p>A（CDMA 码分多址）：所有用户<b>同一时间、同一频率</b>通信，靠相互<b>正交的码型</b>区分——接收端按码型分离出各自信号，数学上互不干扰，<b>不可能冲突</b>。</p>' },
  { title: 'CSMA：先听后发，随机争用',
    cls: 'good',
    tag: 'B 可能冲突 ✓',
    body: '<p>B（CSMA 载波侦听多路访问）：发送前侦听信道、空闲才发，但信号有<b>传播时延</b>——甲的信号还没到乙时，乙也侦听到「空闲」同时发送，两路信号叠加即<b>冲突</b>。CSMA 只听不检，<b>可能冲突</b>。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '答案 B',
    body: '<p>TDMA、FDMA、CDMA 都是<b>划分信道</b>（切时间/切频率/切码型），无冲突；CSMA 是<b>随机争用</b>信道，可能冲突 → 答案选 <b>B</b>。记忆锚点：<b>划分不冲突，争用才冲突</b>。</p>' },
];

var CLSMAP = { key: 'shift', bad: 'miss', good: 'ok' };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (CLSMAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title + ' —— ' + s.tag,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '哪种介质访问控制方法可能冲突（2013·36）',
  subtitle: '考点：<code>划分信道 vs 随机争用</code> · TDMA / FDMA / CDMA / CSMA 逐项辨析',
  counterLabel: '已推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（CSMA）',
    html: '<b>TDMA 切时间、FDMA 切频率、CDMA 切码型</b>——信道资源预先划分，物理上无从冲突；<b>CSMA 随机争用</b>，传播时延让「先听后发」不可靠，可能冲突。CSMA/CD 靠边发边检测、CSMA/CA 靠退避来应对冲突，但「可能冲突」是 CSMA 家族的共同起点。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
