<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-40 动画 · SMTP 的能力边界</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：四条叙述考什么',
    cls: 'key',
    tag: '审题',
    body: '<p>四条叙述问的都是 SMTP 的<b>能力边界</b>。判据两条：① SMTP 是「<b>推</b>」协议，只管发信方向；② 它只能传 <b>7 比特 ASCII</b> 内容。</p>' },
  { title: '判据展开：推与拉的分界',
    cls: '',
    tag: '判据',
    body: '<p>邮件全流程：用户代理 →(SMTP)→ 发送方服务器 →(SMTP)→ 接收方服务器 →(POP3/IMAP)→ 用户代理。前两段是「推」（SMTP），最后一段是「拉」（POP3/IMAP，由收件人发起）。</p>' },
  { title: '判定 I：只支持 7 比特 ASCII',
    cls: 'good',
    tag: 'I 对',
    body: '<p>I：<b>对</b>。SMTP 报文只能传 7 位 ASCII 码；传中文、图片、附件要靠 <b>MIME</b> 扩展数据表示——但传输仍走 SMTP，所以「SMTP 本身只支持 ASCII」成立。</p>' },
  { title: '判定 II：服务器之间发送',
    cls: 'good',
    tag: 'II 对',
    body: '<p>II：<b>对</b>。发送方邮件服务器 → 接收方邮件服务器的中转是 SMTP 最经典的用途（服务器在端口 25 监听），全程「推」。</p>' },
  { title: '判定 III：用户代理 → 服务器',
    cls: 'good',
    tag: 'III 对',
    body: '<p>III：<b>对</b>。发件人投递邮件就是用户代理把邮件<b>推</b>给自己的发送方邮件服务器，用的也是 SMTP。</p>' },
  { title: '判定 IV：服务器 → 用户代理',
    cls: 'bad',
    tag: 'IV 错',
    body: '<p>IV：<b>错</b>。收信由用户<b>主动拉取</b>，何时取信、怎么取由用户决定，用 <b>POP3 / IMAP</b>——SMTP 的「推」模式管不了这一段。</p>' },
  { title: '匹配选项：仅 I、II、III',
    cls: 'good',
    tag: '选 A',
    body: '<p>正确的只有 I、II、III——含 IV 的 B、C、D 全部排除 → 答案选 <b>A</b>。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '答案 A',
    body: '<p>记忆锚点：<b>SMTP 只管「推」——UA→服务器、服务器→服务器；「拉」交给 POP3/IMAP；内容只支持 7 位 ASCII（多媒体靠 MIME 扩展表示）</b>。</p>' },
];

var CLSMAP = { key: 'shift', bad: 'miss', good: 'ok' };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (CLSMAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title + ' —— ' + s.tag,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '关于 SMTP 的四条叙述，哪些正确（2013·40）',
  subtitle: '考点：<code>SMTP 推 / POP3 拉</code> + <code>7 位 ASCII 限制</code> · 逐条判定',
  counterLabel: '已判定',
  intro: '点击「▶ 播放」逐条判定四条叙述。',
  snaps: snaps,
  result: {
    big: '答案 A（仅 I、II 和 III）',
    html: 'I 对（SMTP 只传 7 位 ASCII，多媒体靠 MIME 扩展表示）；II 对（服务器间中转走 SMTP）；III 对（UA 投递走 SMTP）；<b>IV 错</b>（服务器→用户代理是「拉」，用 POP3/IMAP）。凡是把「拉」算进 SMTP 的选项都是错的。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
