<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2013-46 页表项地址、页框号与页面物理地址推演</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .hxrow{ display:flex; gap:6px; width:max-content; margin: 4px 0; }
  .hxcol{ width: 54px; display:flex; flex-direction:column; align-items:center; }
  .hxbox{ width:54px; height:44px; border:2px solid #cbd5e1; border-radius:10px;
          display:flex; align-items:center; justify-content:center;
          font-family:"SF Mono",Menlo,monospace; font-weight:700; font-size:18px;
          background:#fff; transition: background .2s, border-color .2s, color .2s; }
  .hxbox.dim{ opacity:.4; }
  .hxbox.ok{ background:#e8f0fe; border-color:#3b82f6; color:#1e40af; }
  .hxbox.amber{ background:#fef3c7; border-color:#d97706; color:#92400e; }
  .hxbox.hit{ background:var(--green); border-color:var(--green); color:#fff; }
  .hxidx{ margin-top:4px; font-size:10px; color:#94a3b8; font-family:monospace; }
  .ptrow{ display:flex; gap:14px; width:max-content; margin: 6px 0 2px; align-items:flex-end; }
  .ptcell{ width:120px; border:2px solid #cbd5e1; border-radius:10px; background:#fff;
           overflow:hidden; transition: border-color .2s; }
  .ptcell .addr{ font-size:10.5px; color:#64748b; font-family:monospace; text-align:center;
                 padding:3px 0; background:#f8fafc; border-bottom:1px solid #eef2f7; min-height:20px; }
  .ptcell .fr{ height:40px; display:flex; align-items:center; justify-content:center;
               font-family:"SF Mono",Menlo,monospace; font-weight:700; font-size:15px; color:#94a3b8; }
  .ptcell.on{ border-color:var(--green); }
  .ptcell.on .fr{ color:#14532d; background:var(--green-bg); }
  .ptell{ width:34px; height:52px; display:flex; align-items:flex-end; justify-content:center;
          font-size:16px; color:#94a3b8; padding-bottom:8px; }
  .legend{ font-size:11.5px; color:#64748b; margin-top:6px; }
  .legend .dot{ display:inline-block; width:10px; height:10px; border-radius:3px; margin:0 4px 0 10px; vertical-align:middle; }
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var S = {};

/* 逻辑地址 0000 8000H 的 8 个十六进制位（高位在前） */
var DIGITS = ['0', '0', '0', '0', '8', '0', '0', '0'];

/* 每步的数字着色：p=页号段 amber / o=偏移段 ok / h=命中 hit / d=灰 */
function digitCls(i){
  if (i === 0) return ['d','d','d','d','d','d','d','d'];
  if (i === 1) return ['d','d','d','d','d','o','o','o'];
  if (i === 2) return ['p','p','p','p','p','d','d','d'];
  if (i === 3) return ['p','p','p','p','p','o','o','o'];
  if (i === 4) return ['h','h','h','h','h','o','o','o'];
  return ['h','h','h','h','h','o','o','o'];
}

function drawDigits(i){
  var cls = digitCls(i);
  var row = AW.el('div', 'hxrow');
  var idxName = ['位7', '位6', '位5', '位4', '位3', '位2', '位1', '位0'];
  DIGITS.forEach(function(ch, k){
    var col = AW.el('div', 'hxcol');
    col.appendChild(AW.el('div', 'hxbox ' + cls[k], ch));
    col.appendChild(AW.el('div', 'hxidx', idxName[k]));
    row.appendChild(col);
  });
  return row;
}

/* 页表片段：页 8 与 页 9 两个页表项 */
function drawPT(i){
  var row = AW.el('div', 'ptrow');
  row.appendChild(AW.el('div', 'ptell', '…'));
  var pt8 = AW.el('div', 'ptcell' + (i >= 6 ? ' on' : ''),
    '<div class="addr">' + (i >= 6 ? '0020 0020H' : '') + '</div>' +
    '<div class="fr">' + (i >= 7 ? '00900H' : '—') + '</div>');
  var pt9 = AW.el('div', 'ptcell' + (i >= 6 ? ' on' : ''),
    '<div class="addr">' + (i >= 6 ? '0020 0024H' : '') + '</div>' +
    '<div class="fr">' + (i >= 7 ? '00901H' : '—') + '</div>');
  row.appendChild(pt8); row.appendChild(pt9);
  row.appendChild(AW.el('div', 'ptell', '…'));
  return row;
}

var SUMS = {
  0: '<h4>题目参数</h4><p>逻辑/物理地址均 32 位；页表项 4B；页表存放在物理 <code>0020 0000H</code> 开始处；代码段起始逻辑地址 <code>0000 8000H</code>、长 8KB，装载到物理 <code>0090 0000H</code> 开始的连续空间。</p>',
  1: '<h4>（1）页大小</h4><p>一级页表：20 位页号 + 12 位页内偏移 → 页大小 = 2<sup>12</sup> = <b>4KB</b>。</p>',
  2: '<h4>（1）页表最大占用</h4><p>页号 20 位 → 页表项最多 2<sup>20</sup> 个，每项 4B → 页表最大 = 2<sup>20</sup> × 4B = <b>4MB</b>。</p>',
  3: '<h4>（2）二级页表表达式</h4><p>10 位页目录号 + 10 位页表索引 + 12 位页内偏移：页目录号 = <code>LA &gt;&gt; 22</code>；页表索引 = <code>(LA &gt;&gt; 12) &amp; 0x3FF</code>。</p>',
  4: '<h4>（3）拆逻辑地址 0000 8000H</h4><p>页号 = 高 20 位 = <code>00008H</code>（十进制 <b>8</b>）；页内偏移 = 低 12 位 = <code>000H</code>。8KB = 2 页 → 代码占<b>页 8 和页 9</b> 两页。</p>',
  5: '<h4>（3）页表项地址公式</h4><p>页表项物理地址 = 页表基址 + 页号 × 每项大小 = <code>0020 0000H + 页号 × 4B</code>（主存按字节编址，必须 ×4）。</p>',
  6: '<h4>（3）两个页表项的物理地址</h4><p>页 8：<code>0020 0000H + 8×4 = 0020 0020H</code>；页 9：<code>0020 0000H + 9×4 = 0020 0024H</code>。</p>',
  7: '<h4>（3）页框号（页表项的内容）</h4><p>代码装载基址 <code>0090 0000H</code> → 页面 1 页框 = <b>00900H</b>，页面 2 连续装载 → 页框 = <b>00901H</b>。</p>',
  8: '<h4>（3）代码页面 2 的起始物理地址</h4><p>页框号 00901H 拼接 12 位页内偏移 000H → <b>0090 1000H</b>。</p>',
  9: '<h4>最终答案</h4><p>（1）页 4KB、页表最大 4MB；（2）页目录号 <code>LA&gt;&gt;22</code>、页表索引 <code>(LA&gt;&gt;12)&amp;0x3FF</code>；（3）页表项物理地址 <code>0020 0020H</code> / <code>0020 0024H</code>，页框号 <code>00900H</code> / <code>00901H</code>，代码页面 2 起始物理地址 <b>0090 1000H</b>。</p>',
};

AW.init({
  title: '【2013-46】页表项地址 / 页框号 / 页面物理地址推演',
  subtitle: '地址 <code>32 位</code> · 页表项 <code>4B</code> · 代码段 <code>0000 8000H</code> 长 <code>8KB</code> · 装到 <code>0090 0000H</code> · 页表在 <code>0020 0000H</code>',
  counterLabel: '完成步',
  ribbonTitle: '关键步骤（✓ 已完成）',
  intro: '点击「▶ 播放」：按（1）（2）（3）问的顺序推演地址映射。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    S.labA = AW.el('div', 'aw-row-label', '<b>逻辑地址 0000 8000H</b>（32 位 = 8 个十六进制位）');
    inner.appendChild(S.labA);
    S.digits = AW.el('div', '');
    inner.appendChild(S.digits);
    S.legend = AW.el('div', 'legend',
      '<span class="dot" style="background:#fef3c7;border:1px solid #d97706"></span>页号（高 20 位）' +
      '<span class="dot" style="background:#e8f0fe;border:1px solid #3b82f6"></span>页内偏移（低 12 位）');
    inner.appendChild(S.legend);
    S.labB = AW.el('div', 'aw-row-label', '<b>页表片段</b>（基址 0020 0000H；格中上=页表项物理地址，下=页框号）');
    inner.appendChild(S.labB);
    S.pt = AW.el('div', '');
    inner.appendChild(S.pt);
    S.sum = AW.el('div', 'aw-stepcard', '');
    inner.appendChild(S.sum);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    S.digits.innerHTML = '';
    S.digits.appendChild(drawDigits(i));
    S.pt.innerHTML = '';
    S.pt.appendChild(drawPT(i));
    S.sum.innerHTML = SUMS[i] || '';
    var labels = {
      0: '先记参数：32 位地址、页表项 4B、代码段 0000 8000H 长 8KB、装载基址 0090 0000H、页表基址 0020 0000H。',
      1: '（1）12 位页内偏移 → 页大小 4KB。',
      2: '（1）20 位页号 × 4B/项 → 页表最大 4MB。',
      3: '（2）二级页表 10+10+12 拆分：页目录号 = LA>>22；页表索引 = (LA>>12)&0x3FF。',
      4: '（3）0000 8000H：页号 00008H=8、偏移 000H；8KB 跨页 8、页 9。',
      5: '（3）页表项地址 = 0020 0000H + 页号 × 4B。',
      6: '（3）页 8 → 0020 0020H；页 9 → 0020 0024H。',
      7: '（3）页框号 = 页表项内容：00900H / 00901H。',
      8: '（3）页面 2 起始物理地址 = 00901H||000H = 0090 1000H。',
      9: '全部结论齐了，对照右下结果卡复核。',
    };
    S.labA.innerHTML = '<b>逻辑地址 0000 8000H</b>' + (labels[i] ? ' —— ' + labels[i] : '');
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'32 位地址、页表项 4B；代码段 0000 8000H 长 8KB，装到 0090 0000H；页表在 0020 0000H', count:0 },
    { cls:'step',  tag:'(1) 页大小', log:'一级页表：12 位页内偏移 → 页大小 = 2^12 = 4KB', count:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'(1) 页表大小', log:'20 位页号 → 2^20 项 × 4B = 4MB', count:2, ribbon:{k:2, ok:true} },
    { cls:'step',  tag:'(2) 表达式', log:'二级页表 10+10+12：页目录号 = LA>>22；页表索引 = (LA>>12)&0x3FF', count:3, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'(3) 拆地址', log:'0000 8000H：页号 00008H（=8）、偏移 000H；8KB 跨页 8 和页 9', count:4, ribbon:{k:4, ok:true} },
    { cls:'step',  tag:'页表项公式', log:'页表项物理地址 = 0020 0000H + 页号 × 4B（字节编址要 ×4）', count:5, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'页表项地址', log:'页 8：0020 0000H + 8×4 = 0020 0020H；页 9：+9×4 = 0020 0024H', count:6, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'页框号', log:'页表项内容（页框号）：00900H / 00901H（装载基址 0090 0000H 起、连续）', count:7, ribbon:{k:7, ok:true} },
    { cls:'ok',    tag:'页面2 物理址', log:'代码页面 2 起始物理地址 = 00901H 拼 12 位偏移 000H = 0090 1000H', count:8, ribbon:{k:8, ok:true} },
    { cls:'done',  tag:'完成', log:'页 4KB；页表 4MB；LA>>22 与 (LA>>12)&0x3FF；0020 0020H/0020 0024H；00900H/00901H；0090 1000H', count:9, done:true },
  ],

  result: {
    big: '页 4KB · 页表 4MB · 0090 1000H',
    html: '<b>（1）</b>页大小 <b>4KB</b>；页表最大 2<sup>20</sup>×4B = <b>4MB</b>。<b>（2）</b>页目录号 = <code>LA &gt;&gt; 22</code>；页表索引 = <code>(LA &gt;&gt; 12) &amp; 0x3FF</code>。<b>（3）</b>页面 1/2 的页表项物理地址 = <code>0020 0020H</code> / <code>0020 0024H</code>（基址 + 页号×4B）；页框号 = <code>00900H</code> / <code>00901H</code>；代码页面 2 起始物理地址 = <b>0090 1000H</b>。记忆锚点：<b>页表项地址 = 基址 + 页号×4B；物理地址 = 页框号拼 12 位偏移</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
