<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-01 时间复杂度分析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 概念/推理链类：双层循环执行次数 → O(n·log2 n) -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>外层 <code>k *= 2</code>：k 每轮翻倍，走 1,2,4,8,…；内层 <code>j++</code>：固定走 n 次。考点：<b>嵌套循环 = 各层次数相乘</b>。</p>' },
  { title: '外层循环跑多少次',
    cls: '',
    body: '<p>k 的取值序列：1 → 2 → 4 → 8 → … → 2^t，只要 <code>k &lt;= n</code> 就继续。满足 <code>2^t &lt;= n</code> 的 t 最大为 <code>log2 n</code> 下取整，故外层执行 <b>⌊log2 n⌋ + 1 次</b>，量级 <code>O(log2 n)</code>。</p>' },
  { title: '内层循环跑多少次',
    cls: '',
    body: '<p>外层每进入一轮，内层 <code>j</code> 都从 1 数到 n，固定执行 <b>n 次</b> <code>count++</code>。内层次数与 k 无关，量级 <code>O(n)</code>。</p>' },
  { title: '相乘：乘法法则',
    cls: '',
    body: '<p><code>count++</code> 总执行次数 ≈ <code>(log2 n + 1) × n = n·log2 n + n</code>。举例 n = 16：外层 k 取 1,2,4,8,16 共 5 轮，内层每轮 16 次，共 <b>80 次</b> ≈ 16×4。</p>' },
  { title: '只保留最高阶',
    cls: 'good',
    body: '<p>去掉常数 +1 与低阶项 n，得 <code>O(n·log2 n)</code>。<b>选 C</b>。</p>' },
  { title: '逐项排错',
    cls: 'bad',
    body: '<p>A <code>O(log2 n)</code>：只数了外层，漏掉内层。B <code>O(n)</code>：把两层"相加"了（n + log2 n），嵌套循环是相乘不是相加。D <code>O(n^2)</code>：机械套"双层循环=平方"，忽视外层只走 log2 n 轮。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：循环变量<b>翻倍跳</b> → 次数是 <code>log2 n</code>；嵌套循环复杂度 = 外层次数 × 内层次数。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2014-01　双层循环的时间复杂度',
  subtitle: '<code>for(k=1;k&lt;=n;k*=2)</code> 套 <code>for(j=1;j&lt;=n;j++)</code> · 乘法法则推理链',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '总次数 = 外层 <b>⌊log2 n⌋+1</b> × 内层 <b>n</b> ≈ <code>n·log2 n</code>。<br>干扰项来源：只数外层 → A；两层相加 → B；见双层就平方 → D。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
