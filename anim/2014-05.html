<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-05 森林 F 转二叉树 T · 叶结点的对应关系</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
  .f2b-svg{width:100%;max-width:660px;display:block;margin:0 auto 6px;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px;transition:opacity .5s}
  .f2b-svg.dimmed{opacity:.35}
  .f2b-svg .fnode circle{fill:#1b3a4b;transition:fill .3s,opacity .4s}
  .f2b-svg .fnode text{font-family:"SF Mono",Menlo,monospace;font-weight:800;font-size:14px;
    fill:#fff;text-anchor:middle;dominant-baseline:central;transition:opacity .4s}
  .f2b-svg .fnode.leafy circle{fill:#2f9e44}
  .f2b-svg .fnode.lnull circle{stroke:#2f9e44;stroke-width:4px}
  .f2b-svg .fnode.nope circle{stroke:#e63946;stroke-width:4px;fill:#e6394620}
  .f2b-svg .fnode.nope text{fill:#a02830}
  .f2b-svg .eline{stroke:#5a7d8c;stroke-width:2.2px;transition:opacity .4s,stroke .3s}
  .f2b-svg .eline.lft{stroke:#2f9e44;stroke-width:2.6px}
  .f2b-svg .eline.rgt{stroke:#1b3a4b;stroke-width:2.6px}
  .f2b-svg .eline.cut{stroke-dasharray:4 4;stroke-opacity:.25}
  .f2b-svg .sib{stroke:#e07a2f;stroke-width:3px;stroke-dasharray:7 5}
  .f2b-svg .rootlnk{stroke:#1b3a4b;stroke-width:3px;stroke-dasharray:7 5}
  .f2b-svg .grp{font-size:12.5px;font-weight:700;fill:#b9cbd0}
  .f2b-svg .legend{font-size:12px;fill:#586e72}
  .hidden-el{opacity:0}
  .f2b-cap{text-align:center;font-size:12.5px;color:#586e72;margin-bottom:4px}
  .hformula{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9;min-height:28px}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 2014-05 森林转二叉树动画（SVG） ==================
 * 示例森林：树1 = A(B,C,D)，树2 = E(F)，树3 = G。叶结点 B,C,D,F,G 共 5 个。
 * 演示：左孩子右兄弟转换全过程 → 验证 F 的叶数 = T 中左指针为空的结点数（答案 C）。 */

var FPOS = { A:[110,42], B:[40,128], C:[110,128], D:[180,128], E:[370,42], F:[370,128], G:[545,42] };
var FEDGES = [ ['A','B','AB'], ['A','C','AC'], ['A','D','AD'], ['E','F','EF'] ];
var SIBS = [ ['B','C'], ['C','D'] ];
var ROOTLNK = [ ['A','E'], ['E','G'] ];
var BPOS = { A:[320,30], B:[185,100], C:[140,170], D:[100,240], E:[470,100], F:[410,170], G:[530,170] };
var BEDGES = [
  ['A','B','left','ABl'], ['B','C','right','BCr'], ['C','D','right','CDr'],
  ['A','E','right','AEr'], ['E','F','left','EFl'], ['E','G','right','EGr']
];
var LEAVES = ['B','C','D','F','G'];

var SNAPS = [
  { cls:'step', tag:'审题', count:0,
    log:'示例森林 F：树1 = A(B,C,D)，树2 = E(F)，树3 = G。叶结点（没有任何孩子）：B、C、D、F、G，共 5 个。目标：看这 5 个叶子转换后变成 T 里的什么。',
    fx:'森林 F 的叶结点：B、C、D、F、G → <code>5</code> 个' },
  { cls:'step', tag:'转换规则', count:0,
    log:'「左孩子、右兄弟」规则：结点的左指针放它在森林中的第一个孩子；右指针放它的下一个兄弟；各树根依次互为兄弟。',
    fx:'左指针 = 第一个孩子 · 右指针 = 下一兄弟' },
  { cls:'step', tag:'① 连兄弟', count:1,
    log:'第一步：给同双亲的兄弟从左到右加连线（橙色虚线）：B–C–D；E 是独苗没有兄弟，树3 的 G 也是孤根。',
    fx:'兄弟连线：B–C、C–D' },
  { cls:'shift', tag:'② 留头去尾', count:2, cut:true,
    log:'第二步：只保留「双亲 → 第一个孩子」的连线（A–B、E–F）；到其余孩子的连线 A–C、A–D 剪掉（变虚）。原来 B、C、D 的联系全靠兄弟线维持。',
    fx:'保留 A–B、E–F；剪掉 A–C、A–D' },
  { cls:'shift', tag:'③ 树根相连', count:3,
    log:'第三步：森林中各棵树的根视为兄弟，依次连线 A–E–G（墨青虚线）——它们将成为二叉树右指针上的链条。',
    fx:'树根连线：A–E、E–G' },
  { cls:'shift', tag:'④ 旋转成 T', count:4,
    log:'把整幅图顺时针转 45°整理，得到二叉树 T：A 的左孩子 B、右孩子 E；B 右孩子 C；C 右孩子 D；E 左孩子 F、右孩子 G。绿=左孩子（第一个孩子），蓝=右孩子（兄弟/下一树根）。',
    fx:'转换完成：左 = 第一个孩子，右 = 兄弟' },
  { cls:'ok', tag:'数 F 的叶', count:5, fLeaf:true,
    log:'数森林 F 的叶结点（绿色）：B、C、D、F、G → 5 个。它们在森林里都没有任何孩子。',
    fx:'F 的叶结点数 = <code>5</code>', ribbon:{k:1, ok:true} },
  { cls:'ok', tag:'数 T 的左空', count:6, lnull:true,
    log:'数 T 中左孩子指针为空的结点（绿圈）：B、C、D、F、G → 也是 5 个！原因：左指针 = 第一个孩子，森林里"没有孩子" ⟺ 二叉树里"左指针为空"，一一对应。',
    fx:'T 中左空结点数 = <code>5</code> = F 的叶数 ✓', ribbon:{k:2, ok:true} },
  { cls:'miss', tag:'A ✗（T 的叶）', count:7, nope:['D','F','G'],
    log:'选项 A：T 的叶结点要左右指针都为空——本例只有 D、F、G 共 3 个（B、C 还挂着右孩子），3 ≠ 5，对不上。',
    fx:'T 的叶（左右都空）= <code>3</code> ≠ 5 ✗', ribbon:{k:3, ok:false} },
  { cls:'miss', tag:'D ✗（右空）', count:8, nope:['D','F','G'],
    log:'选项 D：右指针为空只代表"森林中是最后一个兄弟/独苗"（本例恰好也是 D、F、G 3 个），与是不是叶没有必然关系，对不上。',
    fx:'T 中右空结点数 = <code>3</code> ≠ 5 ✗', ribbon:{k:4, ok:false} },
  { cls:'miss', tag:'B ✗（度 1）', count:9, nope:['B','C'],
    log:'选项 B：T 中度为 1（只有一个孩子）的结点：B（只有右孩子 C）、C（只有右孩子 D）共 2 个，2 ≠ 5，对不上。',
    fx:'T 中度 1 结点数 = <code>2</code> ≠ 5 ✗', ribbon:{k:5, ok:false} },
  { cls:'done', done:true, tag:'完成', count:10, fLeaf:true, lnull:true,
    log:'结论：F 中叶结点的个数 = T 中左孩子指针为空的结点个数 → 选 C。记忆锚点：左指针 = 第一个孩子，森林的「无孩子」⟺ 二叉树的「左空」。',
    fx:'答案 C：叶结点 ⟺ 左孩子指针为空' }
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var cap1 = AW.el('div', 'f2b-cap', '森林 F（树1：A(B,C,D)　树2：E(F)　树3：G）');
  stage.appendChild(cap1);
  var svgF = document.createElementNS(svgNS, 'svg');
  svgF.setAttribute('viewBox', '0 0 640 178');
  svgF.setAttribute('class', 'f2b-svg');
  var svgB = document.createElementNS(svgNS, 'svg');
  svgB.setAttribute('viewBox', '0 0 640 278');
  svgB.setAttribute('class', 'f2b-svg hidden-el');
  function el(svg, name, attrs, txt, step){
    var n = document.createElementNS(svgNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (txt != null) n.textContent = txt;
    if (step != null) n.dataset.step = step;
    svg.appendChild(n);
    return n;
  }
  // ---- 森林面板 ----
  el(svgF, 'text', { x:36, y:22, 'class':'grp' }, '树 1');
  el(svgF, 'text', { x:340, y:22, 'class':'grp' }, '树 2');
  el(svgF, 'text', { x:516, y:22, 'class':'grp' }, '树 3');
  FEDGES.forEach(function(e){
    var a = FPOS[e[0]], b = FPOS[e[1]];
    var ln = el(svgF, 'line', { x1:a[0], y1:a[1], x2:b[0], y2:b[1], 'class':'eline' }, null, 0);
    ln.dataset.eid = e[2];
  });
  SIBS.forEach(function(e){
    var a = FPOS[e[0]], b = FPOS[e[1]];
    el(svgF, 'line', { x1:a[0], y1:a[1], x2:b[0], y2:b[1], 'class':'sib' }, null, 2);
  });
  ROOTLNK.forEach(function(e){
    var a = FPOS[e[0]], b = FPOS[e[1]];
    el(svgF, 'line', { x1:a[0], y1:a[1], x2:b[0], y2:b[1], 'class':'rootlnk' }, null, 3);
  });
  Object.keys(FPOS).forEach(function(id){
    var p = FPOS[id];
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'fnode');
    g.dataset.step = 0; g.dataset.id = 'F' + id;
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 19);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', p[0]); t.setAttribute('y', p[1]); t.textContent = id;
    g.appendChild(c); g.appendChild(t);
    svgF.appendChild(g);
  });
  stage.appendChild(svgF);
  var cap2 = AW.el('div', 'f2b-cap', '二叉树 T（绿边 = 左孩子＝第一个孩子　蓝边 = 右孩子＝兄弟/下一树根）');
  stage.appendChild(cap2);
  // ---- 二叉树面板 ----
  BEDGES.forEach(function(e){
    var a = BPOS[e[0]], b = BPOS[e[1]];
    var ln = el(svgB, 'line', { x1:a[0], y1:a[1], x2:b[0], y2:b[1],
      'class':'eline ' + (e[2] === 'left' ? 'lft' : 'rgt') }, null, 4);
    ln.dataset.eid = e[3];
  });
  Object.keys(BPOS).forEach(function(id){
    var p = BPOS[id];
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'fnode');
    g.dataset.step = 4; g.dataset.id = 'T' + id;
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 19);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', p[0]); t.setAttribute('y', p[1]); t.textContent = id;
    g.appendChild(c); g.appendChild(t);
    svgB.appendChild(g);
  });
  stage.appendChild(svgB);
  var formulaBox = AW.el('div', 'hformula');
  stage.appendChild(formulaBox);
  this._svgF = svgF; this._svgB = svgB; this._formula = formulaBox;
}

function render(stage, sn, i){
  var self = this;
  [].forEach.call(this._svgF.querySelectorAll('[data-step]'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  [].forEach.call(this._svgB.querySelectorAll('[data-step]'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  this._svgF.classList.toggle('dimmed', i >= 6);
  this._svgB.classList.toggle('hidden-el', i < 4);
  // 森林边：剪掉 A-C、A-D
  [].forEach.call(this._svgF.querySelectorAll('.eline'), function(ln){
    ln.classList.toggle('cut', !!sn.cut && (ln.dataset.eid === 'AC' || ln.dataset.eid === 'AD'));
  });
  // 结点状态
  function paint(svg, prefix, leafy, lnull, nope){
    [].forEach.call(svg.querySelectorAll('.fnode'), function(g){
      var id = g.dataset.id.slice(1);
      g.classList.toggle('leafy', !!leafy && LEAVES.indexOf(id) >= 0);
      g.classList.toggle('lnull', !!lnull && LEAVES.indexOf(id) >= 0);
      g.classList.toggle('nope', !!nope && nope.indexOf(id) >= 0);
    });
  }
  paint(this._svgF, 'F', sn.fLeaf, false, []);
  paint(this._svgB, 'T', false, sn.lnull, sn.nope);
  this._formula.innerHTML = sn.fx || '';
}

AW.init({
  title: '2014-05　森林的叶结点 ⟷ 二叉树的左空结点',
  subtitle: '转换规则：左孩子 = 第一个孩子 · 右孩子 = 下一兄弟 · 用最小示例森林全程演示再逐项排除',
  counterLabel: '推理步',
  ribbonTitle: '各选项个数 vs 叶数 5（✓ 相等 / ✗ 不等）',
  intro: '点击「▶ 播放」看森林如何一步步变成二叉树，再数一数各选项对应几个结点。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 C',
    html: '森林 → 二叉树用「左孩子、右兄弟」表示：<b>左指针 = 第一个孩子</b>。森林中的叶结点没有孩子 → 转换后左指针必为空；反之左指针为空 ⟺ 森林中无孩子。<br>' +
      '所以 F 中叶结点个数 = T 中<b>左孩子指针为空</b>的结点个数。易错：T 的叶（左右都空）只对应"无孩子且无兄弟"的结点；右指针为空只代表"最后一个兄弟"。'
  }
});
</script>
</body>
</html>
