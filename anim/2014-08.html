<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-08 哈希堆积动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 概念/推理链类：堆积 → 探测序列变长 → ASL 受直接影响 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：什么是堆积（聚集）',
    cls: 'key',
    body: '<p>开放定址法（尤其线性探测）处理冲突时，<b>非同义词</b>也会抢同一个后继地址：k1 占了本属于 k2 的位置，把 k2 挤到更后面。探测序列越滚越长、"堆"成一片，这就是堆积现象。</p>' },
  { title: '堆积的直接后果：探测变长',
    cls: '',
    body: '<p>查找/插入必须<b>沿探测序列逐个比较</b>直到碰到空位或命中。堆积 → 探测序列变长 → <b>比较次数增多</b>。而"平均比较次数"正是散列表的<b>平均查找长度（ASL）</b>。</p>' },
  { title: '逐项排错 A：存储效率',
    cls: 'bad',
    body: '<p>堆积只改变元素"落在哪一格"，表长和元素个数都没变，存储效率<b>不受直接影响</b>。</p>' },
  { title: '逐项排错 B：散列函数',
    cls: 'bad',
    body: '<p>堆积由<b>冲突处理方法</b>（线性探测等）引起，不是散列函数的锅；散列函数选定后固定，堆积不会反过来改变它。</p>' },
  { title: '逐项排错 C：装填因子',
    cls: 'bad',
    body: '<p>装填因子 α = 表中记录数 ÷ 表长，只由数据量和表长决定，与冲突怎么处理、堆积多严重<b>无关</b>。α 影响的是 ASL 的整体水平，但它本身不因堆积而变。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D：平均查找长度</b>。因果链：堆积 → 探测序列变长 → 比较次数变多 → ASL 直接变大。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2014-08　哈希堆积直接影响什么',
  subtitle: '开放定址法 · 堆积（聚集）现象 · 因果链推理',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '堆积使探测序列变长，比较次数增多，<b>平均查找长度（ASL）</b>直接变大。<br>干扰项：存储效率（不改变占用）、散列函数（不被堆积改变）、装填因子（= 记录数/表长，与处理冲突方法无关）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
