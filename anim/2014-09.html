<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-09 4阶B树结点数动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 概念/推理链类：4阶B树关键字上下限 → 结点数最大值 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：4 阶 B 树的限制',
    cls: 'key',
    body: '<p>m 阶 B 树：每结点<b>至多 m 棵子树（m-1 个关键字）</b>；非根结点<b>至少 ⌈m/2⌉ 棵子树（⌈m/2⌉-1 个关键字）</b>；根至少 2 棵子树。m=4 → 每个结点关键字数都在 <b>1～3</b> 之间。</p>' },
  { title: '问"最多"该怎么想',
    cls: '',
    body: '<p>15 个关键字是固定的，<b>每个结点装得越少，需要的结点越多</b>。所以上限 = 15 ÷ 每结点最少关键字数。</p>' },
  { title: '非根结点最少 1 个关键字',
    cls: '',
    body: '<p>⌈4/2⌉-1 = <b>1</b>：非根结点至少 2 棵子树，即最少 1 个关键字（根也至少 1 个）。</p>' },
  { title: '相除得 15 个结点',
    cls: 'good',
    body: '<p>15 个关键字 × 每结点 1 个 → <b>15 个结点</b>。此时每个结点 2 棵子树，15 个结点排成满二叉树形态（1+2+4+8=15，16 个失败叶同层），2 棵子树满足"非根至少 2、至多 4"→ 结构<b>合法</b>。</p>' },
  { title: '反向验证：最少是 5',
    cls: '',
    body: '<p>反方向：每结点装满 3 个关键字 → ⌈15/3⌉ = <b>5 个结点</b>。选项 A 正是这个"最少值"陷阱——题目问的是<b>最多</b>。</p>' },
  { title: '逐项排错',
    cls: 'bad',
    body: '<p><b>A（5）</b>：关键字装满时的最少结点数，方向反了。<b>B（6）</b>、<b>C（10）</b>：无对应规则的乱凑（B+ 树叶子存关键字等概念错套到 B 树上——B 树的失败叶不含关键字）。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D：15 个</b>。记忆锚点：关键字固定时，结点数上限 = 关键字数 ÷ 每结点关键字下限（⌈m/2⌉-1）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2014-09　15 个关键字的 4 阶 B 树：结点最多几个',
  subtitle: '4 阶：每结点 1～3 个关键字 · 想结点多 → 每结点装得少',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D：15 个',
    html: '每结点最少 1 个关键字（非根至少 ⌈4/2⌉=2 棵子树）→ 15 ÷ 1 = <b>15 个结点</b>，构成满二叉树形态、每结点 2 棵子树，合法。<br>陷阱：A 的 5 是"每结点装满 3 个"时的<b>最少</b>结点数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
