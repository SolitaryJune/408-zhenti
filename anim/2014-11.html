<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-11 快速排序第2趟判定动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- 概念/推理链类：第k趟至少k个元素归位 → 数归位数 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var FINAL = [2, 3, 4, 5, 6, 7, 9];

function cmpHtml(arr){
  var rows = '';
  var okCount = 0;
  for (var i = 0; i < arr.length; i++){
    var ok = arr[i] === FINAL[i];
    if (ok) okCount++;
    rows += '<tr><td>第 ' + (i + 1) + ' 位</td><td>' + arr[i] + '</td><td>' + FINAL[i] + '</td><td>' +
            (ok ? '✓ 归位' : '✗') + '</td></tr>';
  }
  return '<table><tr><th>位置</th><th>选项值</th><th>最终值</th><th>比对</th></tr>' + rows +
         '</table><p><b>归位元素：' + okCount + ' 个</b></p>';
}

var STEPS = [
  { title: '审题眼：判定准则',
    cls: 'key',
    body: '<p>快排每趟把<b>至少一个枢轴</b>放到最终位置 → 第 1 趟后 ≥1 个元素归位，第 2 趟后 <b>≥2 个元素归位</b>。最终有序序列为 <code>2,3,4,5,6,7,9</code>，逐位比对数"归位数"。</p>' },
  { title: '选项 A：2,3,5,4,6,7,9',
    cls: 'good',
    body: cmpHtml([2,3,5,4,6,7,9]) + '<p>归位 5 个 ≥ 2 → <b>可能是第 2 趟结果</b>（排除）。</p>' },
  { title: '选项 B：2,7,5,6,4,3,9',
    cls: 'good',
    body: cmpHtml([2,7,5,6,4,3,9]) + '<p>归位 4 个 ≥ 2 → <b>可能</b>（排除）。注意 9 前面的部分并未整体有序，这不违反快排性质。</p>' },
  { title: '选项 C：3,2,5,4,7,6,9',
    cls: 'bad',
    body: cmpHtml([3,2,5,4,7,6,9]) + '<p>归位仅 1 个（只有最大值 9 归位）&lt; 2 → <b>不可能是第 2 趟结果</b>。</p>' },
  { title: '选项 D：4,2,3,5,7,6,9',
    cls: 'good',
    body: cmpHtml([4,2,3,5,7,6,9]) + '<p>归位 2 个（5 和 9）≥ 2 → <b>可能</b>（排除）。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：第 k 趟快排后至少 k 个元素在最终位置；归位元素不必连续、不必有序相邻，只数个数。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2014-11　不可能是快排第 2 趟结果的选项',
  subtitle: '准则：第 2 趟后至少 2 个元素在最终位置 · 最终序列 <code>2,3,4,5,6,7,9</code>',
  intro: '点击「▶ 播放」逐项比对。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '<code>3,2,5,4,7,6,9</code> 中只有 <b>9</b> 一个元素在最终位置，不满足"第 2 趟后 ≥2 个归位"。<br>A 归位 5 个、B 归位 4 个、D 归位 2 个，均可能。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
