<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-12 执行时间三要素倍率合成</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 模板：概念/推理链类（纯计算推理） · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    log: '抓公式：执行时间 = 指令数 × CPI × 时钟周期',
    body: '<p>CPU 执行时间由三要素决定：<code>时间 = 指令数 × CPI × 时钟周期</code>。优化只改了前两个，题干未提主频 → 时钟周期不变。</p>' },
  { title: '基准：优化前 20 秒', cls: '',
    log: '程序 P 原来在机器 M 上执行 20 秒',
    body: '<p>优化前 P 在 M 上的执行时间是 <b>20 秒</b>，这是合成倍率的基准。</p>' },
  { title: '因子①：指令数 ×0.7', cls: '',
    log: '指令数减少到原来的 70% → 时间乘 0.7',
    body: '<p>编译优化后指令数减少到原来的 70%，指令数与时间成正比 → 时间 <b>× 0.7</b>。</p>' },
  { title: '因子②：CPI ×1.2', cls: '',
    log: 'CPI 增加到原来的 1.2 倍 → 时间乘 1.2',
    body: '<p>CPI 增加到原来的 1.2 倍，CPI 与时间成正比 → 时间 <b>× 1.2</b>。减少指令数往往使每条指令更复杂，这是代价。</p>' },
  { title: '合成倍率', cls: 'good',
    log: '20 × 0.7 × 1.2 = 16.8 秒',
    body: '<p>新时间 = 20 × 0.7 × 1.2 = 20 × 0.84 = <b>16.8 秒</b>，对应选项 <b>D</b>。</p>' },
  { title: '逐项排错', cls: 'bad',
    log: 'A、B 倍率组合错误；C 漏乘 CPI 因子',
    body: '<p>A 8.4 秒、B 11.7 秒：把 0.7 与 1.2 之外的错误系数组合相乘；C 14 秒 = 20 × 0.7：只乘了指令数因子，<b>漏乘 CPI 的 1.2</b>。</p>' },
  { title: '结论', cls: 'good',
    log: '答案 D：执行时间变为原来的 84%',
    body: '<p>答案选 <b>D</b>（16.8 秒）。记忆锚点：三要素各自乘倍率，时间是<b>倍率之积 × 原时间</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : (s.cls === 'key' ? 'shift' : 'step'))),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2014-12 · 程序执行时间的倍率合成',
  subtitle: '指令数 ×0.7 · CPI ×1.2 · 原时间 20 秒 —— 三要素公式推理',
  counterLabel: '步骤',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '16.8 秒（D）',
    html: '执行时间 = 指令数 × CPI × 时钟周期：20 × 0.7 × 1.2 = <b>16.8 秒</b>，选 <b>D</b>。干扰项 C 的 14 秒 = 20 × 0.7，漏乘了 CPI 增大的因子 1.2。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
