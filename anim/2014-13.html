<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-13 8位补码运算溢出判断</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 模板：算法/过程类（逐表达式补码运算与溢出判定） · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 四个表达式的补码运算与判定数据（val=真值, ok=是否不溢出）
var EXPS = [
  { key:'A', name:'x + y',      bin:'0110 0111 + 1110 0111 = 0100 1110', val:'78',   ok:true,  why:'正 + 负不会溢出' },
  { key:'B', name:'−x + y',     bin:'1001 1001 + 1110 0111 = 1000 0000', val:'−128', ok:true,  why:'恰为补码最小值，可表示（陷阱）' },
  { key:'C', name:'x − y',      bin:'0110 0111 + 0001 1001 = 1000 0000', val:'128',  ok:false, why:'正 + 正得"负"，真值 128 > 127，溢出！' },
  { key:'D', name:'−x − y',     bin:'1001 1001 + 0001 1001 = 1011 0010', val:'−78',  ok:true,  why:'在 −128 ~ 127 内' },
];

// 每步的展示状态：x/y 两行补码是否显示、已判定到第几个表达式
var ST = [
  { x:false, y:false, show:0 },
  { x:true,  y:false, show:0 },
  { x:true,  y:true,  show:0 },
  { x:true,  y:true,  show:1 },
  { x:true,  y:true,  show:2 },
  { x:true,  y:true,  show:3 },
  { x:true,  y:true,  show:4 },
  { x:true,  y:true,  show:4 },
];

AW.init({
  title: '2014-13 · 8 位补码运算：谁会溢出？',
  subtitle: 'x = 103，y = −25 · 8 位补码范围 <code>−128 ~ +127</code> · 逐个表达式判定',
  counterLabel: '已判定表达式',
  ribbonTitle: '选项核验（✓ 不溢出 / ✗ 溢出）',
  intro: '点击「▶ 播放」：先写出两个数的补码，再逐个验算四个表达式。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    var lb1 = AW.el('div', 'aw-row-label', '<b>x = 103</b> 的 8 位补码（正数，原码即补码）');
    var rowX = AW.cellRow(['0','1','1','0','0','1','1','1'], ['ok','ok','ok','ok','ok','ok','ok','ok'], null, 7);
    var lb2 = AW.el('div', 'aw-row-label', '<b>y = −25</b> 的 8 位补码（[y]补 = 256 − 25 = 231）');
    var rowY = AW.cellRow(['1','1','1','0','0','1','1','1'], ['ok','ok','ok','ok','ok','ok','ok','ok'], null, 7);

    var range = AW.el('div', '');
    range.style.cssText = 'font-size:13px;color:#213e48;background:#f8edcb;border:1.5px solid #1b3a4b26;border-radius:10px;padding:8px 12px;margin:10px 0';
    range.innerHTML = '8 位补码表示范围：<b style="color:#1b3a4b">−128 ~ +127</b>（256 个数，负端多 1），运算结果越界即溢出。';

    // 四个表达式判定卡
    var cards = [];
    EXPS.forEach(function(e){
      var c = AW.el('div', '');
      c.style.cssText = 'display:none;border:2px solid #1b3a4b26;border-radius:12px;padding:10px 14px;margin-top:10px;font-size:13.5px;line-height:1.9;color:#213e48;transition:all .3s';
      c.innerHTML = '<b style="font-size:14.5px">' + e.key + '. ' + e.name + '</b><br>' +
        '<code style="background:#f8edcb;padding:2px 8px;border-radius:6px;font-family:Menlo,Consolas,monospace;font-size:12.5px">' + e.bin + '</code><br>' +
        '<span class="v">真值 = ' + e.val + '，' + e.why + '</span>';
      cards.push(c);
      inner.appendChild(c);
    });

    inner.appendChild(lb1); inner.appendChild(rowX);
    inner.appendChild(lb2); inner.appendChild(rowY);
    inner.appendChild(range);
    // 卡片插到最前面（按 A~D 顺序倒序插入）
    for (var i = 3; i >= 0; i--) inner.insertBefore(cards[i], inner.firstChild);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
    this._rowX = rowX; this._rowY = rowY;
    this._lb1 = lb1; this._lb2 = lb2; this._range = range;
    this._cards = cards;
  },

  snaps: [
    { cls:'step', tag:'题面',   log:'x = 103，y = −25，用 8 位定点补码运算：A x+y、B −x+y、C x−y、D −x−y，谁会溢出？', count:0 },
    { cls:'shift', tag:'x 的补码', log:'x = 103 = 0110 0111B（正数，符号位 0）。', count:0 },
    { cls:'shift', tag:'y 的补码', log:'y = −25：[y]补 = 256 − 25 = 231 = 1110 0111B；减法统一变加法，[−y]补 = [25]补 = 0001 1001B。', count:0 },
    { cls:'ok',  tag:'A 不溢出',  log:'x+y = 103+(−25) = 78，在 −128 ~ 127 内 → 不溢出。', count:1, ribbon:{k:1, ok:true} },
    { cls:'ok',  tag:'B 不溢出',  log:'−x+y = −103+(−25) = −128，恰好是 8 位补码能表示的最小值 → 可表示，不溢出（最大陷阱！）。', count:2, ribbon:{k:2, ok:true} },
    { cls:'miss', tag:'C 溢出！', log:'x−y = 103−(−25) = 103+25 = 128 > 127，超出上限 → 溢出。硬件上 [x]补+[−y]补 = 0110 0111 + 0001 1001 = 1000 0000，正+正却得"负"，正是溢出特征。', count:3, ribbon:{k:3, ok:false} },
    { cls:'ok',  tag:'D 不溢出',  log:'−x−y = −103+25 = −78，在范围内 → 不溢出。', count:4, ribbon:{k:4, ok:true} },
    { cls:'done', tag:'结论',    log:'四个表达式只有 x−y 溢出 → 答案 C。', count:4, done:true },
  ],

  render: function(stage, sn, i){
    var st = ST[i];
    this._lb1.style.display = st.x ? 'block' : 'none';
    this._rowX.style.display = st.x ? 'flex' : 'none';
    this._lb2.style.display = st.y ? 'block' : 'none';
    this._rowY.style.display = st.y ? 'flex' : 'none';
    var cards = this._cards;
    for (var k = 0; k < 4; k++){
      var c = cards[k], e = EXPS[k];
      if (k >= st.show){ c.style.display = 'none'; continue; }
      c.style.display = 'block';
      if (!e.ok){
        c.style.borderColor = '#e63946'; c.style.background = '#fff8f8';
        c.querySelector('.v').innerHTML = '<b style="color:#a02830">真值 = ' + e.val + '，' + e.why + '</b>';
      } else {
        c.style.borderColor = '#2f9e44'; c.style.background = '#f6fef9';
        c.querySelector('.v').innerHTML = '<span style="color:#276942">真值 = ' + e.val + '，' + e.why + '</span>';
      }
    }
  },

  result: {
    big: 'C（x−y 溢出）',
    html: 'x−y = 103−(−25) = <b>128</b>，超出 8 位补码上限 127 → 溢出，选 <b>C</b>。<br>记忆锚点：8 位补码范围 <b>−128 ~ +127</b>；−x+y = −128 恰在边界上、<b>不溢出</b>（B 项陷阱）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
