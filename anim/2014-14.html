<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-14 IEEE754 单精度解码与比较</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 模板：算法/过程类（位段解码过程） · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// CC900000H / B0C00000H 的 32 个二进制位
var B1 = '11001100100100000000000000000000'.split('');
var B2 = '10110000110000000000000000000000'.split('');

// 每步状态：两行是否显示、当前高亮段(null/'sign'/'exp'/'man')、已解码字段数
var ST = [
  { r1:false, h1:null, r2:false, h2:null, n:0 },
  { r1:true,  h1:null, r2:false, h2:null, n:0 },
  { r1:true,  h1:'sign', r2:false, h2:null, n:1 },
  { r1:true,  h1:'exp',  r2:false, h2:null, n:2 },
  { r1:true,  h1:'man',  r2:false, h2:null, n:3 },
  { r1:true,  h1:null,   r2:true,  h2:null, n:3 },
  { r1:true,  h1:null,   r2:true,  h2:'sign', n:4 },
  { r1:true,  h1:null,   r2:true,  h2:'exp',  n:5 },
  { r1:true,  h1:null,   r2:true,  h2:'man',  n:6 },
  { r1:true,  h1:null,   r2:true,  h2:null, n:6 },
  { r1:true,  h1:null,   r2:true,  h2:null, n:6 },
  { r1:true,  h1:null,   r2:true,  h2:null, n:6 },
];

AW.init({
  title: '2014-14 · IEEE 754 单精度：x 与 y 谁大？',
  subtitle: '(f1) = CC900000H，(f2) = B0C00000H · 1 符号 + 8 阶码（偏置 127）+ 23 尾数',
  counterLabel: '已解码字段',
  ribbonTitle: '比较要点（✓ 成立）',
  intro: '点击「▶ 播放」：逐段解码两个浮点数，再比较符号与大小。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.style.setProperty('--cell', '26px');
    inner.style.setProperty('--gap', '1px');
    inner.style.minWidth = '700px';

    function mkRow(labelTxt, bits, refName){
      var lb = AW.el('div', 'aw-row-label', labelTxt);
      var cls = bits.map(function(){ return ''; });
      var row = AW.cellRow(bits, cls, null, 31);
      row.dataset.ref = refName;
      inner.appendChild(lb); inner.appendChild(row);
      return { lb: lb, row: row };
    }

    var f1 = mkRow('<b>f1 = CC900000H</b> → [符号 1 位][阶码 8 位][尾数 23 位]', B1, 'f1');
    var v1 = AW.el('div', '');
    v1.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px';
    var c1a = AW.el('div', '', '符号 = 1 → 负数');
    var c1b = AW.el('div', '', '阶码 10011001B = 153 → 指数 153−127 = 26');
    var c1c = AW.el('div', '', '尾数 1.001B = 1.125 → x = −1.125 × 2<sup>26</sup>');
    [c1a, c1b, c1c].forEach(function(c, k){
      c.style.cssText = 'display:none;padding:5px 10px;border-radius:9px;font-size:12px;font-weight:700;background:#f8edcb;border:1.5px solid #e07a2f;color:#92400e';
      v1.appendChild(c);
    });

    var f2 = mkRow('<b>f2 = B0C00000H</b> → [符号 1 位][阶码 8 位][尾数 23 位]', B2, 'f2');
    var v2 = AW.el('div', '');
    v2.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px';
    var c2a = AW.el('div', '', '符号 = 1 → 负数');
    var c2b = AW.el('div', '', '阶码 01100001B = 97 → 指数 97−127 = −30');
    var c2c = AW.el('div', '', '尾数 1.1B = 1.5 → y = −1.5 × 2<sup>−30</sup>');
    [c2a, c2b, c2c].forEach(function(c){
      c.style.cssText = 'display:none;padding:5px 10px;border-radius:9px;font-size:12px;font-weight:700;background:#d9e3df;border:1.5px solid #1b3a4b;color:#1b3a4b';
      v2.appendChild(c);
    });

    var cmp = AW.el('div', '');
    cmp.style.cssText = 'display:none;font-size:14px;line-height:1.9;color:#213e48;background:#f6fef9;border:2px solid #2f9e44;border-radius:12px;padding:10px 14px';
    cmp.innerHTML = '两数符号位都是 <b>1</b> → <b style="color:#276942">符号相同</b>；<br>|x| = 1.125×2<sup>26</sup> ≫ |y| = 1.5×2<sup>−30</sup>，负数绝对值大者小 → <b style="color:#276942">x &lt; y</b> → 选 A。';

    inner.appendChild(f1.lb); inner.appendChild(f1.row); inner.appendChild(v1);
    inner.appendChild(f2.lb); inner.appendChild(f2.row); inner.appendChild(v2);
    inner.appendChild(cmp);
    wrap.appendChild(inner);
    stage.appendChild(wrap);

    this._f1 = f1; this._f2 = f2;
    this._v1chips = [c1a, c1b, c1c];
    this._v2chips = [c2a, c2b, c2c];
    this._cmp = cmp;
  },

  snaps: [
    { cls:'step',  tag:'题面',      log:'x、y 是两个 float，分别存在 f1、f2 中：(f1)=CC900000H，(f2)=B0C00000H。按 1+8+23 拆位段即可比较。', count:0 },
    { cls:'shift', tag:'展开 f1',   log:'f1 = CC900000H = 1100 1100 1001 0000 …（低 16 位全 0）。', count:0 },
    { cls:'shift', tag:'f1 符号位', log:'f1 最高位 = 1 → x 为负数。', count:1 },
    { cls:'shift', tag:'f1 阶码',   log:'f1 阶码 = 1001 1001B = 153，真实指数 = 153 − 127 = 26。', count:2 },
    { cls:'ok',    tag:'f1 完整值', log:'尾数 1.001B = 1.125 → x = −1.125 × 2^26，绝对值很大。', count:3 },
    { cls:'shift', tag:'展开 f2',   log:'f2 = B0C00000H = 1011 0000 1100 0000 …，同样按 1+8+23 拆解。', count:3 },
    { cls:'shift', tag:'f2 符号位', log:'f2 最高位 = 1 → y 也是负数。', count:4 },
    { cls:'shift', tag:'f2 阶码',   log:'f2 阶码 = 0110 0001B = 97，真实指数 = 97 − 127 = −30。', count:5 },
    { cls:'ok',    tag:'f2 完整值', log:'尾数 1.1B = 1.5 → y = −1.5 × 2^−30，绝对值极小。', count:6 },
    { cls:'ok',    tag:'符号比较',  log:'x、y 的符号位都是 1 → 符号相同。', count:6, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'大小比较',  log:'|x| = 1.125×2^26 远大于 |y| = 1.5×2^−30；同为负数，绝对值大者小 → x < y。', count:6, ribbon:{k:2, ok:true} },
    { cls:'done',  tag:'结论',      log:'x < y 且符号相同 → 答案 A。', count:6, done:true },
  ],

  render: function(stage, sn, i){
    var st = ST[i];
    var self = this;
    function paint(f, bits, show, hl, chips, on){
      f.lb.style.display = show ? 'block' : 'none';
      f.row.style.display = show ? 'flex' : 'none';
      var boxes = f.row.querySelectorAll('.aw-box');
      bits.forEach(function(_, k){
        var seg = k === 0 ? 'sign' : (k <= 8 ? 'exp' : 'man');
        var done = (seg === 'sign' && (on[0] || hl === 'sign')) ||
                   (seg === 'exp' && (on[1] || hl === 'exp')) ||
                   (seg === 'man' && (on[2] || hl === 'man'));
        boxes[k].className = 'aw-box' + (done ? (hl === seg ? ' hit' : ' ok') : '');
      });
      chips[0].style.display = (on[0] || hl === 'sign') ? 'block' : 'none';
      chips[1].style.display = (on[1] || hl === 'exp') ? 'block' : 'none';
      chips[2].style.display = (on[2] || hl === 'man') ? 'block' : 'none';
    }
    paint(this._f1, B1, st.r1, st.h1, this._v1chips, [st.n >= 1 && st.h1 !== 'sign', st.n >= 2 && st.h1 !== 'exp', st.n >= 3 && st.h1 !== 'man']);
    paint(this._f2, B2, st.r2, st.h2, this._v2chips, [st.n >= 4 && st.h2 !== 'sign', st.n >= 5 && st.h2 !== 'exp', st.n >= 6 && st.h2 !== 'man']);
    this._cmp.style.display = (i >= 9) ? 'block' : 'none';
    void self;
  },

  result: {
    big: 'x &lt; y 且符号相同（A）',
    html: 'f1 符号 1、阶码 153−127=26、尾数 1.125 → x = <b>−1.125 × 2^26</b>；f2 符号 1、阶码 97−127=−30、尾数 1.5 → y = <b>−1.5 × 2^−30</b>。同为负数、|x| 远大于 |y| → <b>x &lt; y 且符号相同</b>，选 <b>A</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
