<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-16 指令Cache与数据Cache分离的目的</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- 模板：概念/推理链类（概念辨析） · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：流水线里的两路访存', cls: 'key',
    log: 'IF 取指与 MEM 取数可能同周期发生，都要访问 Cache',
    body: '<p>流水线中 <b>IF（取指）</b>与 <b>MEM（取操作数）</b>可能出现在同一时钟周期，两者都要访问 Cache——冲突的根源在这里。</p>' },
  { title: '共用一个 Cache 会怎样', cls: 'bad',
    log: '共用 Cache：取指与取数争用同一端口，流水线停顿（结构相关）',
    body: '<p>若指令、数据共用一个 Cache，同周期的两次访问要<b>争用同一个端口</b>，只能一个等一个 → 流水线阻塞，这就是<b>结构相关（资源冲突）</b>。</p>' },
  { title: '分离方案（正确答案 D）', cls: 'good',
    log: '分离后 IF 走指令 Cache、MEM 走数据 Cache，两路并行 → 减少流水线资源冲突',
    body: '<p>拆成<b>指令 Cache + 数据 Cache</b> 后，IF 与 MEM 各走各的通路、并行访问 → <b>减少指令流水线资源冲突</b>，这就是主要目的。</p>' },
  { title: '排除 A：降低缺失损失', cls: 'bad',
    log: 'A 错：缺失损失由调块/写回开销决定，与分离无关',
    body: '<p>缺失损失取决于缺失处理（写回主存、调块）的开销，分离 Cache 不改变它 → A 不符。</p>' },
  { title: '排除 B：提高命中率', cls: 'bad',
    log: 'B 错：命中率由容量/映射/块大小决定，分离不直接提高命中率',
    body: '<p>命中率取决于<b>容量、映射方式、块大小、替换算法</b>，与指令数据是否分开存放无直接关系 → B 不符。</p>' },
  { title: '排除 C：降低平均访存时间', cls: 'bad',
    log: 'C 不选：是间接好处，不是"主要目的"的表述',
    body: '<p>降低 CPU 平均访存时间是分离带来的<b>间接效果</b>，题干问的是"主要目的"——直接目的是消除取指与取数的资源冲突 → C 不选。</p>' },
  { title: '结论', cls: 'good',
    log: '答案 D：减少指令流水线资源冲突',
    body: '<p>答案选 <b>D</b>。记忆锚点：分离 Cache 的关键词是<b>流水线</b>——IF 与 MEM 同周期并行，解决<b>结构相关</b>。</p>' },
];

var RIB = { 2:{k:1, ok:true}, 3:{k:2, ok:false}, 4:{k:3, ok:false}, 5:{k:4, ok:false} };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : (s.cls === 'key' ? 'shift' : 'step'))),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    ribbon: RIB[i],
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2014-16 · 为什么要分离指令 Cache 与数据 Cache',
  subtitle: '考点：Cache 分立与流水线结构相关 · 选项逐项推演',
  counterLabel: '步骤',
  ribbonTitle: '选项核验（✓ 正确 / ✗ 不符）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '分离指令/数据 Cache 的主要目的是<b>减少指令流水线资源冲突</b>：IF 取指与 MEM 取数同周期并行访问，消除结构相关。A、B 与分离无直接关系，C 只是间接效果。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
