<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-21 I/O接口概念辨析（找错误项）</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 模板：概念/推理链类（概念辨析） · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：找"错误"项', cls: 'key',
    log: '先立标准：统一编址用访存指令访 I/O，独立编址用专门 I/O 指令',
    body: '<p>本题选<b>错误</b>项。判断标尺：<b>统一编址</b>（存储器映射）用普通访存指令访问 I/O 端口；<b>独立编址</b>用专门的 I/O 指令、地址空间独立。</p>' },
  { title: 'B：端口 = CPU 可访问的寄存器（对）', cls: 'good',
    log: 'B 表述正确：I/O 端口即接口中 CPU 可访问的寄存器',
    body: '<p>I/O 接口中 CPU 能直接访问的寄存器称为 <b>I/O 端口</b>（数据端口、状态端口、控制端口）→ B 表述正确，不选。</p>' },
  { title: 'A：状态/控制端口可合用（对）', cls: 'good',
    log: 'A 表述正确：同一寄存器"读=状态、写=控制"，靠读写命令区分',
    body: '<p>状态端口和控制端口<b>可以合用同一个寄存器</b>：读命令读出状态信息，写命令写入控制信息，互不冲突 → A 表述正确，不选。</p>' },
  { title: 'C：独立编址地址可能相同（对）', cls: 'good',
    log: 'C 表述正确：独立编址两空间各自编号，端口地址与主存地址可能相同',
    body: '<p>独立编址方式下 I/O 地址空间与主存地址空间<b>相互独立</b>、各自从 0 编号，端口地址与主存地址<b>可能相同</b>，靠专门 I/O 指令区分 → C 表述正确，不选。</p>' },
  { title: 'D：统一编址恰恰用访存指令（错）', cls: 'bad',
    log: 'D 表述错误：统一编址方式下 CPU 正是用访存指令访问 I/O 端口',
    body: '<p>统一编址方式下 I/O 端口占用主存地址空间，CPU <b>正是用访存指令</b>访问 I/O 端口的——D 说"不能用访存指令"，与事实相反；不能用访存指令访问 I/O 的是<b>独立编址</b> → D 是错误项，选 D。</p>' },
  { title: '结论', cls: 'good',
    log: '答案 D：统一编址 = 用访存指令访问 I/O 端口',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>统一编址 = 访存指令访 I/O；独立编址 = 专门 I/O 指令 + 专用地址空间</b>。</p>' },
];

var RIB = { 1:{k:2, ok:true}, 2:{k:1, ok:true}, 3:{k:3, ok:true}, 4:{k:4, ok:false} };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : (s.cls === 'key' ? 'shift' : 'step'))),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    ribbon: RIB[i],
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2014-21 · I/O 接口四句话辨析（找错误项）',
  subtitle: '考点：I/O 端口 / 状态与控制端口合用 / 独立编址 / 统一编址 · 选项逐项推演',
  counterLabel: '步骤',
  ribbonTitle: '选项核验（✓ 表述正确 / ✗ 表述错误）',
  intro: '点击「▶ 播放」逐项检验四个选项的表述。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '<b>统一编址</b>方式下 I/O 端口占主存地址空间，CPU 恰恰<b>用访存指令</b>访问 I/O 端口 → D 的说法正好相反，是错误项。A、B、C 都是正确表述：端口可合用读写区分，独立编址两空间地址可能相同。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
