<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-22 中断方式下 CPU 的 I/O 时间占比</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：算法/过程类（时间轴占比演示） · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 每步：3 个周期条的显示、绿色服务段显示、结论卡显示
var ST = [
  { bars:false, green:false, pct:false, delay:false, wrong:false },
  { bars:true,  green:false, pct:false, delay:false, wrong:false },
  { bars:true,  green:true,  pct:false, delay:false, wrong:false },
  { bars:true,  green:true,  pct:false, delay:false, wrong:false },
  { bars:true,  green:true,  pct:true,  delay:false, wrong:false },
  { bars:true,  green:true,  pct:true,  delay:true,  wrong:false },
  { bars:true,  green:true,  pct:true,  delay:true,  wrong:true  },
  { bars:true,  green:true,  pct:true,  delay:true,  wrong:true  },
];

AW.init({
  title: '2014-22 · 中断方式下 CPU 的 I/O 时间占比',
  subtitle: '每 400ns 请求一次 · 响应+处理 100ns · 允许的最长响应延迟 50ns',
  counterLabel: 'I/O 时间占比',
  ribbonTitle: '占比核验（✓ 正确 / ✗ 误算）',
  intro: '点击「▶ 播放」：画出 400ns 周期时间轴，看绿色服务段占多少。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.style.minWidth = '560px';

    var barsWrap = AW.el('div', '');
    var barEls = [];
    for (var c = 0; c < 3; c++){
      var cap = AW.el('div', 'aw-row-label', '周期 ' + (c + 1) + '（400 ns）');
      var bar = AW.el('div', '');
      bar.style.cssText = 'display:flex;width:100%;max-width:560px;height:40px;border:2px solid #cbd5e1;border-radius:10px;overflow:hidden;margin-top:4px;opacity:0;transition:opacity .4s';
      var g = AW.el('div', '');
      g.style.cssText = 'width:25%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:#dcfce7;border-right:1.5px solid #16a34a;color:#15803d;opacity:0;transition:opacity .4s;white-space:nowrap';
      g.innerHTML = '100 ns<br>响应+处理';
      var gray = AW.el('div', '');
      gray.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#64748b;background:#f1f5f9;white-space:nowrap';
      gray.innerHTML = '300 ns · CPU 执行原程序';
      bar.appendChild(g); bar.appendChild(gray);
      barsWrap.appendChild(cap); barsWrap.appendChild(bar);
      barEls.push(bar); barEls.push(g);
    }

    var pct = AW.el('div', '');
    pct.style.cssText = 'display:none;font-size:14.5px;line-height:1.8;color:#14532d;background:#dcfce7;border:2px solid #16a34a;border-radius:12px;padding:10px 14px;margin:14px 0 4px';
    pct.innerHTML = '占比 = 100 ÷ 400 = <b style="color:#15803d;font-size:18px">25%</b> → 选 <b style="color:#15803d">B</b>。';

    var delay = AW.el('div', '');
    delay.style.cssText = 'display:none;font-size:13.5px;line-height:1.8;color:#92400e;background:#fffbeb;border:1.5px solid #d97706;border-radius:10px;padding:9px 13px;margin:10px 0';
    delay.innerHTML = '<b>50 ns 是"允许的最长响应延迟"</b>：设备允许 CPU 最迟 50 ns 内开始响应，这是<b>约束</b>不是开销——等待期间 CPU 并未服务该设备，不计入 I/O 时间。';

    var wrong = AW.el('div', '');
    wrong.style.cssText = 'display:none;font-size:13.5px;line-height:1.8;color:#b91c1c;background:#fff8f8;border:1.5px solid #dc2626;border-radius:10px;padding:9px 13px;margin:10px 0';
    wrong.innerHTML = '常见误算：(100+50)/400 = <b>37.5%</b>（错选 C，误加延迟）；50/400 = <b>12.5%</b>（错选 A）；200/400 = <b>50%</b>（错选 D，无依据）。';

    inner.appendChild(barsWrap); inner.appendChild(pct); inner.appendChild(delay); inner.appendChild(wrong);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    this._barEls = barEls; this._pct = pct; this._delay = delay; this._wrong = wrong;
  },

  snaps: [
    { cls:'step',  tag:'题面',        log:'设备每 400ns 发一次中断请求，CPU 每次响应并处理用 100ns；中断响应允许的最长延迟 50ns。求 CPU 用于该设备 I/O 的时间占比至少是多少。', count:0 },
    { cls:'shift', tag:'画时间轴',    log:'以 400ns 为一个周期画出时间轴（图中 3 个周期）：每 400ns 到来一次中断请求。', count:0 },
    { cls:'ok',    tag:'服务段',      log:'每个周期里，CPU 用开头 100ns 响应并处理该设备的中断（绿色段）——这才是"用于该设备 I/O 的时间"。', count:0 },
    { cls:'step',  tag:'其余时间',    log:'其余 300ns CPU 继续执行原程序，不属于该设备的 I/O 时间。', count:0 },
    { cls:'shift', tag:'算占比',      log:'占比 = 100 ÷ 400 = 25% → 选 B。', count:25, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'50ns 延迟辨析', log:'50ns 只是允许的最迟响应时限：等待期间 CPU 没在服务该设备，不计入 I/O 时间 → 占比与 50ns 无关，"至少" 25%。', count:25 },
    { cls:'miss',  tag:'误算排除',    log:'(100+50)/400 = 37.5%（C）、50/400 = 12.5%（A）、200/400 = 50%（D）都是误加误减的结果。', count:25, ribbon:{k:2, ok:false} },
    { cls:'done',  tag:'结论',        log:'答案 B：CPU 用于该设备 I/O 的时间占比至少 25%。', count:25, done:true },
  ],

  render: function(stage, sn, i){
    var st = ST[i];
    var barEls = this._barEls;
    for (var k = 0; k < 3; k++){
      barEls[k * 2].style.opacity = st.bars ? '1' : '0';
      barEls[k * 2 + 1].style.opacity = st.green ? '1' : '0';
    }
    this._pct.style.display = st.pct ? 'block' : 'none';
    this._delay.style.display = st.delay ? 'block' : 'none';
    this._wrong.style.display = st.wrong ? 'block' : 'none';
  },

  result: {
    big: '25%（B）',
    html: '每 400ns 周期中，CPU 服务该设备的只有响应+处理的 <b>100 ns</b> → 占比 = 100/400 = <b>25%</b>，选 <b>B</b>。50 ns 是"允许的最长响应延迟"，是约束不是开销，不计入。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
