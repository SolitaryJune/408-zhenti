<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-26 读盘完成后进程必经的状态转换</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var BOXES = [
  { key: 'ready',  label: '就绪态',    sub: '等待被调度' },
  { key: 'run',    label: '运行态',    sub: '正在 CPU 上' },
  { key: 'block',  label: '阻塞态',    sub: '等待 I/O 等事件' },
];

// 每步：活动状态 + 转换说明 + 结论行
var S = [
  { act:'run',   trans:'',                                          tail:'' },
  { act:'block', trans:'运行 → 阻塞：执行读盘系统调用，P 主动让出 CPU', tail:'' },
  { act:'block', trans:'阻塞中：磁盘控制器读数据，P 在阻塞队列等待',  tail:'' },
  { act:'block', trans:'I/O 完成：磁盘向 CPU 发中断，进入中断处理程序', tail:'' },
  { act:'ready', trans:'阻塞 → 就绪（必做）：事件已发生，OS 把 P 改成就绪态、挂入就绪队列',
                 tail:'<b style="color:#15803d">这就是必做动作 → 对应选项 A</b>' },
  { act:'ready', trans:'唤醒 ≠ 运行：P 只是回到就绪队列，能否上 CPU 由进程调度程序决定', tail:'' },
  { act:'ready', trans:'对照 B：是否动态调优先级取决于调度策略，不是必做', tail:'' },
  { act:'ready', trans:'对照 C / D：内存分配发生在创建时；时间片是调度参数，都不必改', tail:'' },
  { act:'ready', trans:'结论：I/O 完成后必做 = 状态改为就绪态', tail:'<b style="color:#15803d">答案：A</b>' },
];

var STATE_BOXES, TRANS_LINE, TAIL_LINE;

AW.init({
  title: '【2014-26】读磁盘操作完成后，操作系统对该进程必做的事',
  subtitle: '考点：进程状态转换（五态模型核心三态）· 跟随进程 P 走一遍',
  counterLabel: '已演示',
  ribbonTitle: '关键结论（✓ 已确认）',
  intro: '点击「▶ 播放」，观察进程 P 从运行到阻塞、再被唤醒的全过程。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    var row = AW.el('div', '');
    row.style.cssText = 'display:flex;gap:14px;align-items:center;margin:14px 0 6px;justify-content:flex-start';
    STATE_BOXES = {};
    var self = this;
    BOXES.forEach(function(b, idx){
      if(idx > 0){
        var ar = AW.el('div', '', '⟶');
        ar.style.cssText = 'font-size:22px;color:#94a3b8;flex:0 0 auto';
        row.appendChild(ar);
      }
      var box = AW.el('div', 'aw-box', b.label);
      box.style.cssText = 'width:170px;height:86px;flex:0 0 auto;font-size:17px;flex-direction:column;line-height:1.3';
      row.appendChild(box);
      STATE_BOXES[b.key] = box;
    });
    inner.appendChild(row);

    var legend = AW.el('div', 'aw-row-label',
      '就绪 → 运行：被调度选中　|　运行 → 阻塞：请求 I/O 等事件　|　阻塞 → 就绪：事件发生（I/O 完成）被唤醒');
    legend.style.cssText = 'margin-top:4px';
    inner.appendChild(legend);

    TRANS_LINE = AW.el('div', 'aw-row-label', '');
    TRANS_LINE.style.cssText = 'margin-top:14px;font-size:14.5px;color:#334155;line-height:1.7';
    inner.appendChild(TRANS_LINE);

    TAIL_LINE = AW.el('div', 'aw-row-label', '');
    TAIL_LINE.style.cssText = 'margin-top:6px;font-size:15px;line-height:1.7';
    inner.appendChild(TAIL_LINE);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    var st = S[Math.min(i, S.length - 1)];
    var self = this;
    BOXES.forEach(function(b){
      var box = STATE_BOXES[b.key];
      var active = st.act === b.key;
      box.className = 'aw-box' + (active ? ' hit' : '');
      box.innerHTML = b.label +
        (active ? '<div style="font-size:13px;font-weight:700;margin-top:4px">进程 P ●</div>'
                : '<div style="font-size:11px;font-weight:400;color:#94a3b8">' + b.sub + '</div>');
    });
    TRANS_LINE.innerHTML = st.trans;
    TAIL_LINE.innerHTML = st.tail;
  },

  snaps: [
    { cls:'shift', tag:'开始', log:'进程 P 正在 CPU 上运行（运行态），接下来它要读一块磁盘数据', count:0 },
    { cls:'step', tag:'运行→阻塞', log:'P 执行读盘系统调用：I/O 慢，P 主动让出 CPU，进入阻塞态', count:1 },
    { cls:'step', tag:'阻塞中', log:'磁盘控制器把数据读入缓冲区；P 停在阻塞队列里等数据', count:2 },
    { cls:'step', tag:'中断到来', log:'I/O 完成：磁盘向 CPU 发中断，CPU 转入中断处理程序', count:3 },
    { cls:'ok', tag:'必做动作', log:'OS 发现 P 等待的事件已发生 → 必做：把 P 状态改为就绪态，挂入就绪队列', count:4, ribbon:{k:1, ok:true} },
    { cls:'step', tag:'唤醒≠运行', log:'P 只是回到就绪队列，能否立刻运行由进程调度程序决定', count:5, ribbon:{k:2, ok:true} },
    { cls:'step', tag:'对照 B', log:'降低优先级：是否动态调级取决于调度策略，不是 I/O 完成的必做动作', count:6 },
    { cls:'step', tag:'对照 C/D', log:'分配用户内存发生在创建时；时间片大小是调度参数——I/O 完成都不必改', count:7 },
    { cls:'done', tag:'完成', log:'结论：读盘完成后必做的是把进程状态改为就绪态 → 选 A', count:8, done:true },
  ],

  result: {
    big: '答案 A',
    html: 'I/O 完成的中断处理中，OS 把等待该 I/O 的进程<b>由阻塞态改成就绪态</b>——这是"唤醒"的必做动作。<br>记忆点：<b>唤醒 ≠ 运行</b>：能否上 CPU 由调度程序决定；降优先级（B）、分配内存（C）、加时间片（D）都不是 I/O 完成的必然动作。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
