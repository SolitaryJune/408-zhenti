<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-28 哪些措施能加快虚实地址转换</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：地址转换慢在哪',
    cls: 'key',
    tag: '审题',
    body: '<p>虚实地址转换 = 查页表把<b>虚拟页号 → 物理页框号</b>。慢点：TLB 不中要<b>访存查页表</b>；请求分页下页表本身还可能被换出，得先调页表再查。加快手段必然围绕：<b>多命中快表、少访内存次数</b>。</p>' },
  { title: 'I 增大快表（TLB）容量：加快 ✓',
    cls: 'good',
    tag: '措施 I',
    body: '<p>TLB 容量变大 → 能缓存更多页表项 → <b>命中率提高</b>，更多地址转换直接在 TLB 内完成、无需访存 → <b>加快转换</b>。</p>' },
  { title: 'II 让页表常驻内存：加快 ✓',
    cls: 'good',
    tag: '措施 II',
    body: '<p>页表常驻内存后，省去"页表被换出 → 先调页表入内存 → 再查页表"的额外开销（甚至页表缺页），查表路径变短 → <b>加快转换</b>。</p>' },
  { title: 'III 增大交换区（swap）：无关 ✗',
    cls: 'bad',
    tag: '措施 III',
    body: '<p>交换区只是换出页面的<b>后备空间</b>。它变大只影响"能容纳多少换出页"，与每次地址转换要走的路径、访存次数<b>无关</b> → 不能加快转换。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '结论',
    body: '<p>I、II 有效，III 无关 → 答案选 <b>C（仅 I、II）</b>。记忆锚点：<b>快表管"命中率"，常驻管"查表路径"，swap 管"换出的仓库"——仓库再大也不让查表变快</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : 'step',
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2014-28】加快虚实地址转换的措施',
  subtitle: 'I 增大 TLB · II 页表常驻内存 · III 增大交换区 · 逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C（仅 I、II）',
    html: '<b>增大 TLB</b> → 命中率↑；<b>页表常驻内存</b> → 查表路径变短。二者都减少查页表开销；<b>增大交换区</b>只扩充换出页面的后备空间，与转换速度无关。<br>记忆点：转换快慢看"查表"，不看"仓库"。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
