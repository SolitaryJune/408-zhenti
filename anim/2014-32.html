<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-32 多级页表的优点</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

function twoLevelPic(){
  return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0">' +
    '<div style="border:2px solid #e07a2f;background:#f8edcb;border-radius:8px;padding:8px 12px;font-size:13px;color:#92400e"><b>页目录</b>（外层页表）</div>' +
    '<div style="color:#b9cbd0;font-size:18px">→</div>' +
    '<div style="display:flex;gap:6px">' +
      '<div style="border:2px solid #2f9e44;background:#2f9e4424;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#1e4d33">小页表 A<br><span style="font-weight:400">离散存放</span></div>' +
      '<div style="border:2px solid #1b3a4b;background:#d9e3df;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#1e3a8a">小页表 B<br><span style="font-weight:400">离散存放</span></div>' +
      '<div style="border:2px dashed #b9cbd0;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#586e72">小页表 C<br><span style="font-weight:400">未建立/未调入</span></div>' +
    '</div></div>';
}

function singlePic(){
  return '<div style="display:flex;gap:10px;align-items:center;margin:8px 0">' +
    '<div style="border:2px solid #e63946;background:#e6394620;border-radius:8px;padding:8px 14px;font-size:13px;color:#a02830"><b>单级页表</b>：4MB 必须一整块连续内存</div>' +
    '</div>';
}

var STEPS = [
  { title: '审题眼：多级页表为何而生',
    cls: 'key',
    tag: '审题',
    body: singlePic() + '<p>单级页表必须<b>整块连续存放</b>：32 位系统、4KB 页时页表 = 2^20 × 4B = 4MB 连续空间，难分配；多数进程还用不满整个地址空间。多级页表就是来解决这个<b>空间</b>问题的。</p>' },
  { title: '多级页表怎么存',
    cls: 'good',
    tag: '原理',
    body: twoLevelPic() + '<p>大页表切成许多小页表<b>离散存放</b>，页目录逐级指向；用不到的部分连小页表都不必建立、也不必调入内存。</p>' },
  { title: 'A 加快地址变换速度：✗',
    cls: 'bad',
    tag: '选项 A',
    body: '<p>每多一级页表，就<b>多一次访存</b>查表，地址变换<b>更慢</b>而不是更快；TLB 是用来弥补这个代价的。</p>' },
  { title: 'B 减少缺页中断次数：✗',
    cls: 'bad',
    tag: '选项 B',
    body: '<p>缺页率由进程访问行为与置换策略决定，跟页表分几级<b>没有关系</b>。</p>' },
  { title: 'C 减少页表项所占字节数：✗',
    cls: 'bad',
    tag: '选项 C',
    body: '<p>页表项大小由地址结构（页框号位数）决定，<b>分级不改变每项的大小</b>。变的是组织方式，不是项的大小。</p>' },
  { title: 'D 减少页表所占的连续内存空间：✓ 正确',
    cls: 'good',
    tag: '选项 D',
    body: '<p>小页表<b>离散存放</b>，不再要求一整块连续大空间；不需要的部分还可以不建。这正是多级页表唯一的优点。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '结论',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>多级页表省的是"连续整块空间"，代价是"多一次访存"——省空间、费时间</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : 'step',
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '【2014-32】多级页表的优点',
  subtitle: '考点：多级页表的空间收益与时间代价 · 逐项辨析',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '多级页表把大页表切块<b>离散存放</b>，减少页表所占的<b>连续内存空间</b>（D 对）；代价是多一级就多一次访存（A 反而更慢）、与缺页次数（B）和页表项大小（C）无关。<br>记忆点：<b>省空间、费时间</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
