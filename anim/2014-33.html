<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-33 动画 · OSI 谁直接为会话层服务</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// OSI 七层，自上而下；index 2 = 会话层，index 3 = 传输层
function layerStrip(){
  var names = ['应用层', '表示层', '会话层', '传输层', '网络层', '数据链路层', '物理层'];
  var h = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px">';
  for (var i = 0; i < 7; i++){
    var bg = '#f8edcb', bd = '#5a7d8c66', fg = '#213e48';
    if (i === 2){ bg = '#f8edcb'; bd = '#e07a2f'; fg = '#92400e'; }
    if (i === 3){ bg = '#2f9e4424'; bd = '#2f9e44'; fg = '#1e4d33'; }
    h += '<div style="border:2px solid ' + bd + ';background:' + bg + ';color:' + fg +
         ';border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px">' + names[i] + '</div>';
  }
  return h + '</div>';
}

var STEPS = [
  { title: '审题眼：服务是谁给谁的',
    cls: 'key',
    tag: '审题',
    body: '<p>OSI 的铁律：<b>下层向上层提供服务</b>，上层是服务使用者。问"直接为会话层提供服务"，就是找<b>会话层正下方相邻的那一层</b>。</p>' },
  { title: '先排七层，锁定会话层的位置',
    cls: 'key',
    tag: '排层次',
    body: layerStrip() +
      '<p style="margin-top:8px">自上而下：应用 → 表示 → <b>会话</b> → <b>传输</b> → 网络 → 数据链路 → 物理。会话层（琥珀色）下面紧挨着的就是传输层（绿色）。</p>' },
  { title: '逐项辨析 A：应用层',
    cls: 'bad',
    tag: 'A 错',
    body: '<p>A 应用层：在会话层<b>之上两层</b>，是服务的<b>使用者</b>，不是提供者——方向完全反了。</p>' },
  { title: '逐项辨析 B：表示层',
    cls: 'bad',
    tag: 'B 错',
    body: '<p>B 表示层：紧挨会话层的<b>上一层</b>，是被会话层服务的对象。"上一层"不等于"下一层"，方向错。</p>' },
  { title: '逐项辨析 C：传输层',
    cls: 'good',
    tag: 'C 对',
    body: '<p>C 传输层：会话层<b>正下方相邻</b>的一层，向会话层提供端到端的报文传输服务——<b>正是"直接"的提供者</b>。</p>' },
  { title: '逐项辨析 D：网络层',
    cls: 'bad',
    tag: 'D 错',
    body: '<p>D 网络层：隔了传输层一层，它直接服务的是<b>传输层</b>；对会话层只是间接支撑，不符合"直接"。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '答案 C',
    body: '<p>答案选 <b>C（传输层）</b>。记忆锚点：<b>下层干活、上层享受</b>——会话层的直接下手是传输层；反过来，会话层直接为表示层服务。</p>' },
];

var CLSMAP = { key: 'shift', bad: 'miss', good: 'ok' };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (CLSMAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'OSI 参考模型 · 谁直接为会话层提供服务（2014·33）',
  subtitle: '考点：<code>下层向上层提供服务 · 相邻层关系</code> · 逐项辨析 A~D',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C（传输层）',
    html: '服务方向永远是<b>下层 → 上层</b>：传输层直接为会话层服务，会话层直接为表示层服务。干扰项方向感：<b>应用/表示</b>在会话层之上（是被服务方），<b>网络</b>隔了一层（只间接支撑）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
