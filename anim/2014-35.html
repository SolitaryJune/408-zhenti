<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-35 动画 · 谁不影响信道数据传输速率</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：速率公式里没有的量才"不影响"',
    cls: 'key',
    tag: '审题',
    body: '<p>信道速率的两条天花板：<b>奈奎斯特准则</b>（限制码元速率：与带宽、调制有关）与<b>香农定理</b>（限制极限速率：与带宽、信噪比有关）。逐项往公式里"对号"。</p>' },
  { title: 'A 信噪比：影响',
    cls: 'good',
    tag: 'A 影响',
    body: '<p>香农定理：<code>C = W·log2(1 + S/N)</code>。信噪比 S/N 直接决定无噪信道之外的极限速率——信噪比越大，速率上限越高。<b>影响。</b></p>' },
  { title: 'B 频率带宽：影响',
    cls: 'good',
    tag: 'B 影响',
    body: '<p>两个公式里都有带宽 W：奈奎斯特给码元速率上限 2W 波特，香农给信息速率上限 W·log2(1+S/N)。带宽越宽上限越高。<b>影响。</b></p>' },
  { title: 'C 调制速率：影响',
    cls: 'good',
    tag: 'C 影响',
    body: '<p>数据速率 = 调制速率（波特率）× 每码元携带的比特数（log2 N）。波特率是乘法里的直接因子。<b>影响。</b></p>' },
  { title: 'D 信号传播速度：不影响',
    cls: 'bad',
    tag: 'D 不影响',
    body: '<p>传播速度由<b>传输介质</b>决定（铜线/光纤中约 2×10^8 m/s 量级），它只决定<b>传播时延 = 信道长度 ÷ 传播速度</b>——比特"走得多快"，而不是"每秒注入多少比特"。速率公式里根本没有它。<b>不影响。</b></p>' },
  { title: '辨析："速率"与"时延"别混淆',
    cls: 'key',
    tag: '对比',
    body: '<p>传播速度慢 → 比特<b>到得晚</b>（传播时延大）；但信道每秒仍能注入同样多的比特（速率不变）。时延指标与速率指标是两套账。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '答案 D',
    body: '<p>答案选 <b>D（信号传播速度）</b>。记忆锚点：<b>写进速率公式的才影响速率</b>——带宽、信噪比、调制方式/波特率；传播速度只进"时延 = 距离 ÷ 速度"。</p>' },
];

var CLSMAP = { key: 'shift', bad: 'miss', good: 'ok' };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (CLSMAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '通信基础 · 谁不影响信道数据传输速率（2014·35）',
  subtitle: '考点：<code>奈奎斯特 · 香农 · 速率 vs 传播时延</code> · 逐项辨析 A~D',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（信号传播速度）',
    html: '影响速率的都写在公式里：<b>带宽 W、信噪比 S/N（香农）</b>与<b>带宽、调制（奈氏）</b>，数据速率 = 波特率 × log2 N。传播速度只决定<b>传播时延</b>——别被两个"速"字骗了。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
