<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-40 动画 · 访问 Web 主页用不到的协议</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：抓"不可能"三个字',
    cls: 'key',
    tag: '审题',
    body: '<p>先还原访问 Web 主页的完整链路：<b>DNS 域名解析 → （接入链路）→ ARP 找网关 MAC → TCP 三次握手 → HTTP 取回网页</b>。再把 A~D 逐个对号入座，找出链路上"没有座位"的那一个。</p>' },
  { title: '选项 A：PPP',
    cls: 'good',
    tag: 'A 可能',
    body: '<p><b>可能。</b>主机若经电话线/ADSL 拨号接入，接入链路的数据链路层协议就是 PPP（点对点协议，含 PAP/CHAP 认证、动态分配 IP）。</p>' },
  { title: '选项 B：ARP',
    cls: 'good',
    tag: 'B 可能',
    body: '<p><b>可能。</b>IP 分组下一跳是网关（或同网段的服务器）时，必须先知道它的 MAC 地址才能封装以太网帧——ARP 广播解析是上网的常规前奏。</p>' },
  { title: '选项 C：UDP',
    cls: 'good',
    tag: 'C 可能',
    body: '<p><b>可能。</b>输入网址后第一件事是 DNS 域名解析，DNS 查询报文默认封装在 <b>UDP（53 端口）</b>里。看漏这一步，就会误以为浏览网页用不到 UDP。</p>' },
  { title: '选项 D：SMTP',
    cls: 'bad',
    tag: 'D 不可能',
    body: '<p><b>不可能。</b>SMTP 是<b>发送电子邮件</b>的协议（用户代理 → 发送方服务器、服务器之间"推"信）。浏览网页既不发信也不收信，链路上没有它的位置。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '答案 D',
    body: '<p>答案选 <b>D（SMTP）</b>。记忆锚点：上网一条链——<b>PPP 接入、ARP 找门、DNS(UDP) 查名、TCP/HTTP 取页</b>；SMTP 是寄信的，与浏览无关。</p>' },
];

var CLSMAP = { key: 'shift', bad: 'miss', good: 'ok' };

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (CLSMAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '万维网 · 访问 Web 主页不可能用到的协议（2014·40）',
  subtitle: '考点：<code>DNS 走 UDP · ARP · PPP 接入 · SMTP 只管发邮件</code>',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（SMTP）',
    html: '浏览网页的链路：PPP 接入（可能）→ ARP 解析（可能）→ DNS 查询走 <b>UDP 53</b>（可能）→ TCP + HTTP 取页。SMTP 只负责<b>发送电子邮件</b>——最大陷阱是把 UDP 排除掉，忘了 DNS。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
