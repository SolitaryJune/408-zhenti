<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-42 OSPF 最短路径动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 算法/过程类：Dijkstra 从 R1 求到各子网最短路径（拓扑与费用全部取自题42表/图） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 结点表：N1=192.1.1.0/24, N5=192.1.5.0/24, N6=192.1.6.0/24, N7=192.1.7.0/24, R2, R3, R4
var NAMES = ['192.1.1.0/24', '192.1.5.0/24', '192.1.6.0/24', '192.1.7.0/24', 'R2', 'R3', 'R4'];
var INF = '∞';

// 每个快照：7 个行 {d:距离, p:路径, st:''|'fixed'|'new'|'pick'}；extra 中的字段（ribbon/done）并入快照顶层
function mk(rows, log, cls, tag, extra){
  var s = { rows: rows, log: log, cls: cls || 'step', tag: tag };
  if (extra){ Object.keys(extra).forEach(function(k){ s[k] = extra[k]; }); }
  return s;
}

var snaps = [
  mk(
    [{d:'1',p:'R1 直接',st:''},{d:INF,p:'',st:''},{d:INF,p:'',st:''},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:''},{d:'2',p:'R1-R3',st:''},{d:INF,p:'',st:''}],
    '初始：按题42表，R1 直连得到 192.1.1.0/24 费用 1、到 R3 链路费用 2、到 R2 链路费用 3，其余 ∞（边：R1-R2:3、R1-R3:2、R2-R4:4、R3-R4:6、各路由器到子网:1）',
    'step', '初始化'),
  mk(
    [{d:'1',p:'R1 直接',st:'pick'},{d:INF,p:'',st:''},{d:INF,p:'',st:''},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:''},{d:'2',p:'R1-R3',st:''},{d:INF,p:'',st:''}],
    '选距离最小者：192.1.1.0/24（1）→ 定案：直接到达，费用 1',
    'ok', '定 N1', { ribbon:{k:1, ok:true} }),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:INF,p:'',st:''},{d:INF,p:'',st:''},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:''},{d:'2',p:'R1-R3',st:'pick'},{d:INF,p:'',st:''}],
    '再选最小：R3（2）→ 定案，准备从 R3 松弛它的邻居',
    'ok', '定 R3'),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'new'},{d:INF,p:'',st:''},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:''},{d:'2',p:'R1-R3',st:'fixed'},{d:'8',p:'R1-R3-R4',st:'new'}],
    '经 R3 松弛：到子网 N5 = 2+1 = 3；到 R4 = 2+6 = 8（琥珀=本轮更新）',
    'shift', '经 R3 松弛'),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'pick'},{d:INF,p:'',st:''},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:''},{d:'2',p:'R1-R3',st:'fixed'},{d:'8',p:'R1-R3-R4',st:''}],
    '最小距离 3：选定 192.1.5.0/24 → 路径 R1-R3-192.1.5.0/24，费用 3',
    'ok', '定 N5', { ribbon:{k:2, ok:true} }),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'fixed'},{d:INF,p:'',st:''},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:'pick'},{d:'2',p:'R1-R3',st:'fixed'},{d:'8',p:'R1-R3-R4',st:''}],
    '另一并列最小：R2（3）→ 定案，准备从 R2 松弛',
    'ok', '定 R2'),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'fixed'},{d:'4',p:'R1-R2-192.1.6.0/24',st:'new'},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:'fixed'},{d:'2',p:'R1-R3',st:'fixed'},{d:'7',p:'R1-R2-R4',st:'new'}],
    '经 R2 松弛：N6 = 3+1 = 4；R4 = 3+4 = 7，比原来经 R3 的 8 更小 → 更新为 7（走 R1-R2-R4）',
    'shift', '经 R2 松弛'),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'fixed'},{d:'4',p:'R1-R2-192.1.6.0/24',st:'pick'},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:'fixed'},{d:'2',p:'R1-R3',st:'fixed'},{d:'7',p:'R1-R2-R4',st:''}],
    '最小距离 4：选定 192.1.6.0/24 → 路径 R1-R2-192.1.6.0/24，费用 4',
    'ok', '定 N6', { ribbon:{k:3, ok:true} }),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'fixed'},{d:'4',p:'R1-R2-192.1.6.0/24',st:'fixed'},{d:INF,p:'',st:''},
     {d:'3',p:'R1-R2',st:'fixed'},{d:'2',p:'R1-R3',st:'fixed'},{d:'7',p:'R1-R2-R4',st:'pick'}],
    '选定 R4（7）→ 定案，准备从 R4 松弛',
    'ok', '定 R4'),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'fixed'},{d:'4',p:'R1-R2-192.1.6.0/24',st:'fixed'},{d:'8',p:'R1-R2-R4-192.1.7.0/24',st:'new'},
     {d:'3',p:'R1-R2',st:'fixed'},{d:'2',p:'R1-R3',st:'fixed'},{d:'7',p:'R1-R2-R4',st:'fixed'}],
    '经 R4 松弛：到子网 N7 = 7+1 = 8（注意另一条路 R1-R3-R4-N7 = 2+6+1 = 9 更大，不走）',
    'shift', '经 R4 松弛'),
  mk(
    [{d:'1',p:'R1 直接',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'fixed'},{d:'4',p:'R1-R2-192.1.6.0/24',st:'fixed'},{d:'8',p:'R1-R2-R4-192.1.7.0/24',st:'pick'},
     {d:'3',p:'R1-R2',st:'fixed'},{d:'2',p:'R1-R3',st:'fixed'},{d:'7',p:'R1-R2-R4',st:'fixed'}],
    '选定 192.1.7.0/24（8）→ 四个子网全部定案',
    'ok', '定 N7', { ribbon:{k:4, ok:true} }),
  mk(
    [{d:'1',p:'直接到达',st:'fixed'},{d:'3',p:'R1-R3-192.1.5.0/24',st:'fixed'},{d:'4',p:'R1-R2-192.1.6.0/24',st:'fixed'},{d:'8',p:'R1-R2-R4-192.1.7.0/24',st:'fixed'},
     {d:'3',p:'R1-R2',st:'fixed'},{d:'2',p:'R1-R3',st:'fixed'},{d:'7',p:'R1-R2-R4',st:'fixed'}],
    'Dijkstra 结束：R1 到 192.1.1.0/24、192.1.5.0/24、192.1.6.0/24、192.1.7.0/24 的最短费用分别为 1、3、4、8，与参考答案一致',
    'done', '完成', { done:true })
];

// 每步已定案的顶点数（含路由器），供计数 chip 显示
var FIXED_COUNTS = [0, 1, 2, 2, 3, 4, 4, 5, 6, 6, 7, 7];
snaps.forEach(function(s, j){ s.count = FIXED_COUNTS[j]; });

function rowHtml(r, name){
  var bg = '#ffffff', color = '#334155', mark = '';
  if (r.st === 'pick'){ bg = '#dcfce7'; mark = ' ✓'; color = '#14532d'; }
  else if (r.st === 'fixed'){ bg = '#f0fdf4'; color = '#14532d'; }
  else if (r.st === 'new'){ bg = '#fef3c7'; color = '#92400e'; }
  else if (r.d === INF){ color = '#94a3b8'; }
  return '<tr style="background:' + bg + '"><td style="text-align:left">' + name + '</td>' +
         '<td style="font-weight:700;color:' + color + '">' + r.d + '</td>' +
         '<td style="text-align:left;font-family:monospace;font-size:12px;color:' + color + '">' + r.p + '</td></tr>';
}

AW.init({
  title: '2014-42　Dijkstra 求 R1 到各子网的最短路径',
  subtitle: '拓扑（题42图）：R1-R2 费 3 · R1-R3 费 2 · R2-R4 费 4 · R3-R4 费 6 · 各路由器到直连子网费 1',
  counterLabel: '已定案',
  ribbonTitle: '子网定案次序（✓ 最短费用）',
  intro: '点击「▶ 播放」逐步执行 Dijkstra。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    this._extra = AW.el('div', 'aw-row-label', '');
    var holder = AW.el('div', '');
    holder.id = 'djTable';
    wrap.appendChild(this._extra);
    wrap.appendChild(holder);
    stage.appendChild(wrap);
    this._holder = holder;
  },
  render: function(stage, sn, i){
    var html = '<table style="border-collapse:collapse;min-width:560px;font-size:13.5px">' +
      '<thead><tr><th style="background:#f1f5f9;border:1px solid #e2e8f0;padding:6px 12px;text-align:left">结点</th>' +
      '<th style="background:#f1f5f9;border:1px solid #e2e8f0;padding:6px 12px">最短距离</th>' +
      '<th style="background:#f1f5f9;border:1px solid #e2e8f0;padding:6px 12px;text-align:left">路径</th></tr></thead><tbody>';
    NAMES.forEach(function(n, j){ html += rowHtml(sn.rows[j], n); });
    html += '</tbody></table>' +
      '<p style="font-size:12px;color:#64748b;margin-top:8px">绿=已定案　深绿✓=本轮选定　琥珀=本轮松弛更新　∞=尚未可达</p>';
    this._holder.innerHTML = html;
    this._extra.innerHTML = sn.cls === 'done'
      ? '<b>结论（答案表）</b>：192.1.1.0/24 → 直接到达，费用 1　|　192.1.5.0/24 → R1-R3，费用 3　|　192.1.6.0/24 → R1-R2，费用 4　|　192.1.7.0/24 → R1-R2-R4，费用 8'
      : '';
  },
  snaps: snaps,
  result: {
    big: '1 / 3 / 4 / 8',
    html: 'R1 到四个子网的最短费用：<code>192.1.1.0/24</code> 直接到达 <b>1</b>；<code>192.1.5.0/24</code> 经 R1-R3 <b>3</b>；<code>192.1.6.0/24</code> 经 R1-R2 <b>4</b>；<code>192.1.7.0/24</code> 经 R1-R2-R4 <b>8</b>（另一路 R1-R3-R4 为 9，舍弃）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
