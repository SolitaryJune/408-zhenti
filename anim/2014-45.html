<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2014-45 Cache 命中率、异常与访盘/TLB 次数</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- 模板：概念/推理链类（按问推理 + 计数） · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '题面条件', cls: 'key',
    log: 'R1=R2=0、R6=1000；机器代码在主存不在 Cache；A 不在主存，同一页同一扇区',
    body: '<p>(R1)=(R2)=0、(R6)=<code>1000</code>；机器代码<b>已调入主存但不在 Cache</b>；数组 A <b>未调入主存</b>，所有元素在同一页、磁盘同一扇区。</p>' },
  { title: '(1) R2 = 1000', cls: 'good',
    log: '循环 1000 次，i=1000 时 R2=R6、bne 不再跳转 → R2 = 1000（3E8H）',
    body: '<p>R2 存 i，从 0 每轮加 1；i 增到 <b>1000</b> 时 bne 判断 (R2)=(R6)、不再跳转，循环结束 → R2 = <b>1000</b>（3E8H）。</p>' },
  { title: '(2) 数据区容量 512B', cls: 'good',
    log: '16 行 × 每块 32B = 512B',
    body: '<p>指令 Cache 共 16 行，与主存交换的块大小 32 B → 数据区容量 = 16 × 32 B = <b>512 B</b>。</p>' },
  { title: '(2) 6 条指令同在一个块', cls: '',
    log: '08048100H 是 32B 块首，6 条指令共 24B 全在块内 → 一次调块全部可用',
    body: '<p>6 条指令共 <b>24 B</b>；起始地址 08048100H 低 5 位为 0，恰为 32 B 块的块首 → 6 条指令（08048100H~08048117H）<b>全在同一个块</b>内，调入一次即可。</p>' },
  { title: '(2) 命中率 99.98%', cls: 'good',
    log: '取指 6000 次，第 1 次缺失、5999 次命中 → 5999/6000 ≈ 99.98%',
    body: '<p>取指总数 = 1000 轮 × 6 条 = <b>6000 次</b>；第 1 次取指 Cache 为空（题干明说不在 Cache 中）→ 缺失并调块，其余 <b>5999 次</b>命中 → 命中率 = 5999/6000 ≈ <b>99.98%</b>。</p>' },
  { title: '(3) 溢出异常：指令 4', cls: '',
    log: '指令4 add R1,R1,R5 累加 sum，结果可能超范围 → 溢出异常',
    body: '<p>指令 4 <code>add R1, R1, R5</code> 逐轮累加 sum，1000 个元素之和<b>可能超出机器数表示范围</b> → 可能发生<b>溢出异常</b>的是指令 4。</p>' },
  { title: '(3) 缺页异常：指令 3', cls: '',
    log: '指令3 load R5,0(R4) 是唯一访问数组 A 的访存指令 → 首次访问必缺页',
    body: '<p>指令 3 <code>load R5, 0(R4)</code> 是唯一访问数组 A 的访存指令，A 所在页未调入主存 → 首次访问发生<b>缺页异常</b>的是指令 3。</p>' },
  { title: '(3) 读磁盘 1 次', cls: 'good',
    log: 'A 同页且同一扇区：缺页调一次整页即可 → 至少读盘 1 次',
    body: '<p>A 的所有元素<b>在同一页、同一扇区</b>：缺页处理一次 I/O 就把整页调入 → 至少<b>读磁盘 1 次</b>（不是每轮一次）。</p>' },
  { title: '(3) TLB 1001 次', cls: 'good',
    log: 'TLB 初始为空：第 1 次取指查 1 次 + 每轮 load 查 1 次 × 1000 = 1001 次',
    body: '<p>TLB 初始为空：<b>第 1 次取指令</b>要查 TLB（1 次），其后 6 条指令同页、取指直接命中；每轮循环指令 3 取 A[i] 都要做虚→实地址变换、<b>查 TLB 一次</b>，共 1000 次 → 合计至少 <b>1001 次</b>。</p>' },
  { title: '结论', cls: 'good',
    log: 'R2=1000；512B；99.98%；溢出→指令4；缺页→指令3；读盘 1 次；TLB 1001 次',
    body: '<p>(1) R2 = <b>1000</b>；(2) 数据区 <b>512 B</b>、命中率 <b>99.98%</b>；(3) 溢出：<b>指令 4</b>、缺页：<b>指令 3</b>；读磁盘至少 <b>1 次</b>、TLB 至少 <b>1001 次</b>。</p>' },
];

var COUNTS = [0, 1, 2, 3, 4, 5, 6, 7, 8, 8];
var RIBS  = [null, 1, 2, 3, 4, 5, 6, 7, 8, null];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : (s.cls === 'key' ? 'shift' : 'step'))),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: COUNTS[i],
    ribbon: RIBS[i] ? { k: RIBS[i], ok: true } : null,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2014-45 · 程序 P 的 Cache 命中率、异常与访盘/TLB 次数',
  subtitle: '循环 1000 次 · 6 条指令 24B 同块 · 指令 Cache 16 行 × 32B · 数组 A 同页同扇区',
  counterLabel: '已解决要点',
  ribbonTitle: '要点（✓ 已解决）',
  intro: '点击「▶ 播放」按问逐步推理。',
  snaps: snaps,
  result: {
    big: 'R2 = 1000 · 512B · 99.98%',
    html: '(1) R2 = <b>1000</b>；(2) 数据区 <b>16×32B = 512B</b>，命中率 = 5999/6000 ≈ <b>99.98%</b>；(3) 溢出异常：<b>指令 4</b>（add 累加 sum），缺页异常：<b>指令 3</b>（load 访问 A 所在页）；读磁盘至少 <b>1 次</b>（同页同扇区），TLB 至少 <b>1001 次</b>（首取指 1 次 + 1000 次 load 地址变换）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
