<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-02 动画 · 先序 a,b,c,d 的二叉树个数</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先序固定 → 数的是"树形"',
    cls: 'key',
    body: '<p>先序序列固定为 <code>a,b,c,d</code>：任意给定一个 4 结点的树形，按先序次序依次填入 a、b、c、d，标号方式<b>唯一</b>。' +
          '所以"不同的二叉树个数" = <b>4 个结点的二叉树形态数</b>。考点指向：卡特兰计数。</p>' },
  { title: '建立递推：按左右子树划分',
    cls: '',
    body: '<p>设 f(n) 为 n 个结点的二叉树形态数。根占 1 个结点，左子树 i 个、右子树 n−1−i 个：</p>' +
          '<p><code>f(n) = f(0)·f(n−1) + f(1)·f(n−2) + … + f(n−1)·f(0)</code>，边界 <code>f(0)=1</code>（空树也算 1 种）。</p>' },
  { title: '从小到大算 f(1)~f(4)',
    cls: '',
    body: '<table style="border-collapse:collapse;font-size:13.5px;margin-top:4px">' +
          '<tr><th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">n</th>' +
          '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">0</td><td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">1</td>' +
          '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">2</td><td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">3</td>' +
          '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center"><b>4</b></td></tr>' +
          '<tr><th style="border:1px solid #e2e8f0;padding:3px 10px;background:#f1f5f9">f(n)</th>' +
          '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">1</td><td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">1</td>' +
          '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">2</td><td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center">5</td>' +
          '<td style="border:1px solid #e2e8f0;padding:3px 10px;text-align:center;color:#15803d"><b>14</b></td></tr></table>' +
          '<p style="margin-top:6px">f(4) = f0·f3 + f1·f2 + f2·f1 + f3·f0 = 5 + 2 + 2 + 5 = <b>14</b>。</p>' },
  { title: '卡特兰数公式复核',
    cls: '',
    body: '<p>n 个结点的二叉树形态数就是卡特兰数：<code>f(n) = C(2n, n) / (n+1)</code>。' +
          '代入 n=4：<code>C(8,4)/5 = 70/5 = 14</code>，与递推结果一致。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B（14 个）</b>。记忆锚点：先序固定 → 每种树形唯一对应一棵树 → 形态数 = 卡特兰数 C(2n,n)/(n+1)，n=4 时为 14。' +
          '干扰项 15/16 来自"忘记 f(0)=1"或混入其他计数对象。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2015-02 · 先序为 a,b,c,d 的不同二叉树个数',
  subtitle: '考点：树形计数（卡特兰数） · 先序固定 → 标号唯一 → 数形态',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: 'B · 14 个',
    html: '记忆锚点：<b>n 个结点的二叉树形态数 = 卡特兰数 C(2n,n)/(n+1)</b>，本题先序固定所以标号不放大计数，' +
          'f(4) = 14。易错：递推时漏掉 f(0)=1，会得出 15/16 等错误值。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
