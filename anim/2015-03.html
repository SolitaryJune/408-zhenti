<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-03 动画 · 同一棵哈夫曼树的路径判定</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 选项 D 的哈夫曼树示意（根 24 → 10/14 → 叶 5,5 / 6,8）
function treeDSVG(){
  var s = '<svg viewBox="0 0 380 215" width="380" height="215" style="max-width:100%">';
  var edges = [[180,52,90,122],[180,52,270,122],[90,158,40,196],[90,158,140,196],[270,158,220,196],[270,158,320,196]];
  edges.forEach(function(e){
    s += '<line x1="' + e[0] + '" y1="' + e[1] + '" x2="' + e[2] + '" y2="' + e[3] +
         '" stroke="#94a3b8" stroke-width="2.5"/>';
  });
  function node(x, y, v, leaf){
    s += '<circle cx="' + x + '" cy="' + y + '" r="' + (leaf ? 19 : 22) +
         '" fill="' + (leaf ? '#dcfce7' : '#dbeafe') + '" stroke="#334155" stroke-width="2.5"/>' +
         '<text x="' + x + '" y="' + (y + 6) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">' + v + '</text>';
  }
  node(180, 30, '24', false);
  node(90, 140, '10', false);
  node(270, 140, '14', false);
  node(40, 205, '5', true);
  node(140, 205, '5', true);
  node(220, 205, '6', true);
  node(320, 205, '8', true);
  s += '<text x="345" y="18" font-size="11" fill="#64748b">叶=5,5,6,8</text></svg>';
  return s;
}

var STEPS = [
  { title: '审题眼：权值序列 = 根到叶经过的结点权',
    cls: 'key',
    body: '<p>路径序列 <code>24,10,5</code> 表示根→…→叶依次经过权 24、10、5 的结点。三条判定规则：</p>' +
          '<p>① 两条路径的<b>公共前缀是同一个结点</b>，分叉之后才是不同结点；' +
          '② 哈夫曼树中<b>父结点权 = 两孩子权之和</b>；' +
          '③ 树中不含权为 0 的结点，叶子集合应能自底向上<b>反演出这棵哈夫曼树</b>。</p>' },
  { title: '选项 A：5+7 ≠ 10，矛盾',
    cls: 'bad',
    body: '<p>A 给出 <code>24,10,5</code> 与 <code>24,10,7</code>：前两段相同，5 和 7 是<b>同一个父结点 10</b> 的两个孩子，' +
          '但 5+7=12≠10，违反"父权=孩子权之和"。A 错。</p>' },
  { title: '选项 B：10+12 ≠ 24，矛盾',
    cls: 'bad',
    body: '<p>B 给出 <code>24,10,5</code> 与 <code>24,12,7</code>：两条路径只在根后分叉，根 24 的两个孩子是 10 和 12，' +
          '但 10+12=22≠24。B 错。</p>' },
  { title: '选项 C：会出现 0 权结点，矛盾',
    cls: 'bad',
    body: '<p>C 给出 <code>24,10,10</code>：权 10 的结点的孩子又是 10 → 另一个孩子的权只能是 10−10=0，' +
          '哈夫曼树不允许 0 权结点。（另一路径 <code>24,14,11</code> 本身虽自洽，救不了整棵树。）C 错。</p>' },
  { title: '选项 D：无矛盾，且可反演还原',
    cls: 'good',
    body: '<p>D 给出 <code>24,10,5</code> 与 <code>24,14,6</code>：根 24 的两个孩子是 10 与 14，10+14=24 ✓；' +
          '10 的孩子是 5 与 5（10=5+5 ✓）；14 的孩子是 6 与 8（14=6+8 ✓）。</p>' +
          '<p>反演验证：叶子集合 {5,5,6,8}，哈夫曼构造：5+5=10，6+8=14，10+14=24 —— 与右图完全一致。</p>' + treeDSVG() },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。判断口诀：<b>同父孩子权相加、公共前缀同结点、叶子反演哈夫曼构造</b>，三关都过才算"能属于同一棵哈夫曼树"。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2015-03 · 哪两条根到叶路径能同属一棵哈夫曼树',
  subtitle: '考点：哈夫曼树性质（父权=孩子权之和 · 叶子反演构造）',
  intro: '点击「▶ 播放」逐项排查四个选项。',
  snaps: snaps,
  result: {
    big: 'D',
    html: '记忆锚点：先查<b>公共前缀同结点、同父孩子权相加</b>排除 A/B/C；再对 D 用叶子 {5,5,6,8} ' +
          '<b>反演哈夫曼构造（5+5=10，6+8=14，10+14=24）</b>验证成立。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
