<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-04 动画 · 中序降序 AVL 树的性质判断</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：中序降序 → 镜像 BST',
    cls: 'key',
    body: '<p>中序遍历（左→根→右）得到<b>降序</b>序列，说明这是"镜像"的二叉排序树：' +
          '对任一结点，<b>左子树所有结点 &gt; 根 &gt; 右子树所有结点</b>；且是 AVL 树，任一结点左右子树高度差不超过 1。' +
          '四个选项逐一举反例或证明。</p>' },
  { title: '选项 A：根的度一定为 2？',
    cls: 'bad',
    body: '<p>度 = 孩子数。树上只有 <b>1 个结点</b>时根的度为 0；<b>2 个结点</b>时度为 1，都满足题设。' +
          '"一定为 2"不成立。A 错。</p>' },
  { title: '选项 B：最小元素一定是叶结点？',
    cls: 'bad',
    body: '<p>最小元沿<b>最右链</b>走：它必无右孩子（否则右子树还有更小的），但<b>可以有左孩子</b>（左孩子比它大，不违反性质）。' +
          '反例：根 10、右孩子 5、5 的左孩子 7 → 中序 10,7,5 降序 ✓，最小元 5 带着左孩子 7，不是叶。B 错。</p>' },
  { title: '选项 C：最后插入的元素一定是叶结点？',
    cls: 'bad',
    body: '<p>新结点插入时确实是叶，但 <b>AVL 失衡会旋转</b>，新结点可能被顶上去。反例：空树依次插入 3、1、2 → ' +
          '3 处发生 LR 失衡，双旋后 2 成为根，<b>最后插入的 2 带着两个孩子 1 和 3</b>，不是叶。C 错。</p>' },
  { title: '选项 D：最大元素一定无左子树？',
    cls: 'good',
    body: '<p>最大元沿<b>最左链</b>走：若它还有左孩子，左子树里全是比它大的元素，与"它最大"矛盾 → ' +
          '<b>左子树必不存在</b>；右孩子可有可无（右子树全是更小的元素）。命题恒成立。D 对。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：降序 BST 中，<b>最右链末端（最小元）必无右孩子，最左链末端（最大元）必无左孩子</b>；' +
          '"无左子树"≠"是叶"，D 的表述更弱所以恒真，而 C 被 AVL 旋转否决。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2015-04 · 中序遍历为降序序列的 AVL 树',
  subtitle: '考点：镜像 BST 性质 + AVL 旋转 · 逐项举反例 / 证明',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：降序 BST 中<b>最大元在最左链末端、必无左子树</b>（右孩子可有可无）。' +
          'A 被"单结点/两结点"否决，B 被"最小元可带左孩子"否决，C 被"AVL 旋转把新结点顶成内结点"否决。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
