<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-06 动画 · Kruskal 与 Prim 第 2 条边对比</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 图：V1-V2=10, V1-V3=8, V1-V4=5, V2-V3=8, V2-V4=11, V3-V4=8
var NS = 'http://www.w3.org/2000/svg';
var NODES = { V1: [110, 80], V2: [390, 80], V3: [110, 300], V4: [390, 300] };
var EDGES = [
  { k:'12', a:'V1', b:'V2', w:10, lx:250, ly:58 },
  { k:'13', a:'V1', b:'V3', w:8,  lx:62,  ly:190 },
  { k:'14', a:'V1', b:'V4', w:5,  lx:158, ly:158 },
  { k:'23', a:'V2', b:'V3', w:8,  lx:342, ly:158 },
  { k:'24', a:'V2', b:'V4', w:11, lx:448, ly:190 },
  { k:'34', a:'V3', b:'V4', w:8,  lx:250, ly:318 },
];
var SORTED = ['14','13','23','34','12','24'];   // 按权排序
var NAME = { '12':'(V1,V2)', '13':'(V1,V3)', '14':'(V1,V4)', '23':'(V2,V3)', '24':'(V2,V4)', '34':'(V3,V4)' };
var edgeEls = {}, cellEls = {}, listRow = null;

function build(stage){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var flex = AW.el('div', '');
  flex.style.display = 'flex';
  flex.style.gap = '16px';
  flex.style.flexWrap = 'wrap';
  flex.style.alignItems = 'flex-start';

  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 500 360');
  svg.setAttribute('width', '440');
  svg.setAttribute('height', '318');
  EDGES.forEach(function(e){
    var p = NODES[e.a], q = NODES[e.b];
    var ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', p[0]); ln.setAttribute('y1', p[1]);
    ln.setAttribute('x2', q[0]); ln.setAttribute('y2', q[1]);
    ln.setAttribute('stroke', '#5a7d8c66'); ln.setAttribute('stroke-width', '5');
    svg.appendChild(ln);
    edgeEls[e.k] = ln;
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', e.lx); t.setAttribute('y', e.ly);
    t.setAttribute('font-size', '17'); t.setAttribute('font-weight', '700');
    t.setAttribute('fill', '#213e48');
    t.textContent = String(e.w);
    svg.appendChild(t);
  });
  ['V1','V2','V3','V4'].forEach(function(n){
    var p = NODES[n];
    var g = document.createElementNS(NS, 'g');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 30);
    c.setAttribute('fill', '#ffffff'); c.setAttribute('stroke', '#213e48'); c.setAttribute('stroke-width', '2.5');
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', p[0]); t.setAttribute('y', p[1] + 6);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '17'); t.setAttribute('font-weight', '700'); t.setAttribute('fill', '#1b3a4b');
    t.textContent = n;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
  });
  flex.appendChild(svg);

  var right = AW.el('div', '');
  right.style.flex = '1';
  right.style.minWidth = '250px';
  var lab = AW.el('div', 'aw-row-label', '<b>按权排序的边</b>（绿=已选 / 琥珀=当前候选 / 红=被否决）');
  right.appendChild(lab);
  listRow = AW.el('div', 'aw-cells');
  var W = { '14':'5', '12':'10', '24':'11', '13':'8', '23':'8', '34':'8' };
  SORTED.forEach(function(k){
    var col = AW.el('div', 'aw-col');
    col.style.width = '72px';
    var b = AW.el('div', 'aw-box', NAME[k] + '<br><span style="font-size:13px;color:#1b3a4b">' + W[k] + '</span>');
    b.style.width = '72px';
    b.style.fontSize = '11px';
    b.style.lineHeight = '1.25';
    b.style.flexDirection = 'column';
    col.appendChild(b);
    listRow.appendChild(col);
    cellEls[k] = b;
  });
  right.appendChild(listRow);
  var note = AW.el('div', 'aw-row-label',
    'Kruskal：全局选最小、不成环的边<br>Prim（从 V4）：只看树集的横切边，选其中最小');
  note.style.marginTop = '10px';
  right.appendChild(note);
  flex.appendChild(right);

  wrap.appendChild(flex);
  stage.appendChild(wrap);
}

function render(stage, sn){
  var hl = sn.hl || {};
  EDGES.forEach(function(e){
    var c = hl[e.k] || '';
    var ln = edgeEls[e.k];
    if(c === 'ok'){ ln.setAttribute('stroke', '#2f9e44'); ln.setAttribute('stroke-width', '6'); }
    else if(c === 'cand'){ ln.setAttribute('stroke', '#e07a2f'); ln.setAttribute('stroke-width', '6'); }
    else if(c === 'no'){ ln.setAttribute('stroke', '#e63946'); ln.setAttribute('stroke-width', '4'); }
    else if(c === 'ans'){ ln.setAttribute('stroke', '#2f9e44'); ln.setAttribute('stroke-width', '8'); }
    else { ln.setAttribute('stroke', '#5a7d8c66'); ln.setAttribute('stroke-width', '5'); }
  });
  SORTED.forEach(function(k){
    var c = hl[k] || '';
    var b = cellEls[k];
    b.className = 'aw-box' + (c === 'ok' ? ' ok' : c === 'cand' ? '' : c === 'no' ? ' miss' : c === 'ans' ? ' hit' : '');
    if(c === 'cand'){ b.style.borderColor = '#e07a2f'; b.style.background = '#f8edcb'; }
    else { b.style.borderColor = ''; b.style.background = ''; }
  });
}

AW.init({
  title: '2015-06 · Kruskal 第 2 条边 vs Prim（从 V4）第 2 条边',
  subtitle: '边权：5 &lt; 8=8=8 &lt; 10 &lt; 11 · 找"可能是 Kruskal 第 2 条、但不是 Prim 第 2 条"的边',
  counterLabel: '推进步',
  ribbonTitle: '关键边核对（✓ 满足题意）',
  intro: '点击「▶ 播放」对比两个最小生成树算法的选边过程。',

  build: build,
  render: render,

  snaps: [
    { cls:'step', tag:'准备',
      log:'6 条边按权排序：(V1,V4)=5 &lt; (V1,V3)=(V2,V3)=(V3,V4)=8 &lt; (V1,V2)=10 &lt; (V2,V4)=11。权 8 的三条边是并列候选',
      count:0, hl:{} },
    { cls:'ok', tag:'两条算法的第 1 条边',
      log:'Kruskal 取全局最小 (V1,V4)=5；Prim 从 V4 出发，邻边 (V4,V1)=5 最小，也选 (V1,V4)。第 1 条两家一致，不是答案',
      count:1, ribbon:{k:1, ok:true}, hl:{ '14':'ok' } },
    { cls:'shift', tag:'Kruskal 的第 2 条候选',
      log:'Kruskal 轮到权 8：(V1,V3)、(V2,V3)、(V3,V4) 与 (V1,V4) 都不成环 → 三条都可能成为第 2 条（并列时取决于边序）',
      count:2, hl:{ '14':'ok', '13':'cand', '23':'cand', '34':'cand' } },
    { cls:'shift', tag:'Prim（从 V4）的第 2 条候选',
      log:'Prim 树集={V1,V4}，横切边只有 (V1,V3)=8、(V4,V3)=8、(V1,V2)=10、(V4,V2)=11 → 第 2 条只能选 (V1,V3) 或 (V3,V4)，(V2,V3) 两端都在树外、根本不在候选里',
      count:3, ribbon:{k:2, ok:true}, hl:{ '14':'ok', '13':'cand', '34':'cand', '23':'no' } },
    { cls:'step', tag:'逐项核对选项',
      log:'A (V1,V3)：两家都可能第 2 条 ✗；B (V1,V4)：两家都是第 1 条 ✗；D (V3,V4)：两家都可能第 2 条 ✗；C (V2,V3)：Kruskal 可能、Prim 不可能 ✓',
      count:4, hl:{ '14':'ok', '13':'cand', '34':'cand', '23':'ans' } },
    { cls:'done', tag:'完成',
      log:'差集 = {Kruskal 第 2 候选} − {Prim 第 2 候选} = (V2,V3)，选 C',
      count:5, done:true, hl:{ '23':'ans' } },
  ],

  result: {
    big: 'C · (V2,V3)',
    html: 'Kruskal 按<b>全局最小且不成环</b>选边，权 8 的三条边都可能排第 2；Prim 按<b>横切边最小</b>选边，树集 {V1,V4} 的横切边里权 8 只有 ' +
          '(V1,V3) 与 (V3,V4)。差集恰为 <b>(V2,V3)</b> → 选 <b>C</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
