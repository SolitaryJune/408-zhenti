<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-07 动画 · 折半查找比较序列判定</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 四个候选比较序列
var ROWS = [
  { letter:'A', vals:['500','200','450','180'] },
  { letter:'B', vals:['500','450','200','180'] },
  { letter:'C', vals:['180','500','200','450'] },
  { letter:'D', vals:['180','200','500','450'] },
];
var rowEls = {};   // letter -> [box...]

function build(stage){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var note0 = AW.el('div', 'aw-row-label',
    '<b>判定规则</b>：每比较一次，"可能区间"缩小一半；<b>下一个被比较的关键字必须落在当前可能区间内</b>（绿=合法 / 红=越界）');
  wrap.appendChild(note0);
  ROWS.forEach(function(r){
    var lab = AW.el('div', 'aw-row-label', '<b>选项 ' + r.letter + '</b>');
    wrap.appendChild(lab);
    var row = AW.cellRow(r.vals, ['','','',''], null, 1);
    var boxes = [];
    for(var i = 0; i < row.children.length; i++){
      boxes.push(row.children[i].querySelector('.aw-box'));
    }
    rowEls[r.letter] = boxes;
    wrap.appendChild(row);
  });
  var zone = AW.el('div', 'aw-row-label', '');
  zone.id = 'awZone';
  zone.style.marginTop = '10px';
  zone.style.fontSize = '13.5px';
  zone.style.color = '#334155';
  wrap.appendChild(zone);
  stage.appendChild(wrap);
  this._zone = zone;
}

function render(stage, sn){
  var marks = sn.mark || {};
  ROWS.forEach(function(r){
    var boxes = rowEls[r.letter];
    var mk = marks[r.letter] || ['', '', '', ''];
    mk.forEach(function(c, i){
      boxes[i].className = 'aw-box' + (c ? ' ' + c : '');
    });
  });
  this._zone.innerHTML = sn.zone || '';
}

AW.init({
  title: '2015-07 · 哪个序列不能是折半查找的比较序列',
  subtitle: '考点：折半查找的区间收缩 · 下一个比较对象必须落在当前可能区间内',
  counterLabel: '核对步',
  ribbonTitle: '序列判定（✓ 合法 / ✗ 不可能）',
  intro: '点击「▶ 播放」逐项核对四个候选序列。',

  build: build,
  render: render,

  snaps: [
    { cls:'step', tag:'规则',
      log:'折半查找每次比较后范围减半：若 x&lt;当前值走左半、x&gt;当前值走右半。逐项检查每个序列是否存在一组"左右走向"使关键字都落在区间内',
      count:0, mark:{}, zone:'当前关注：<b>选项 A</b>：500 → 200 → 450 → 180' },
    { cls:'ok', tag:'A·第1次',
      log:'与 500 比较：无论 x 大小，先假设 x&lt;500，可能区间缩到 (−∞, 500)；200 在其中 ✓',
      count:1, mark:{ A:['ok','','',''] }, zone:'A：区间 (−∞, 500)，下一个 200 ∈ 区间 ✓' },
    { cls:'ok', tag:'A·第2次',
      log:'与 200 比较：若 x&lt;200 → (−∞,200)，450 进不去；要比较 450 就必须 x&gt;200 → 区间 (200,500)',
      count:2, mark:{ A:['ok','ok','',''] }, zone:'A：走右支，区间 (200, 500)，下一个 450 ∈ 区间 ✓' },
    { cls:'ok', tag:'A·第3次',
      log:'与 450 比较：x&lt;450，可能区间缩到 (200, 450)',
      count:3, mark:{ A:['ok','ok','ok',''] }, zone:'A：区间收缩为 (200, 450)' },
    { cls:'miss', tag:'A·第4次 越界',
      log:'第 4 次要与 180 比较，但 180 ∉ (200,450)：区间里根本轮不到 180 —— A 的比较序列不可能出现',
      count:4, ribbon:{k:1, ok:false}, mark:{ A:['ok','ok','ok','miss'] },
      zone:'A：<b>180 ∉ (200,450)</b>，越界 → A 不可能 ✗' },
    { cls:'ok', tag:'B 合法',
      log:'B：500→450→200→180 全程向左：区间 (−∞,500)→(−∞,450)→(−∞,200)，180 ∈ (−∞,200) ✓ 合法',
      count:5, ribbon:{k:2, ok:true}, mark:{ B:['ok','ok','ok','ok'] },
      zone:'B：一路向左，180 ∈ (−∞,200) ✓' },
    { cls:'ok', tag:'C 合法',
      log:'C：180→(180,∞)；500→(180,500)；200→取 x&gt;200 → (200,500)；450 ∈ (200,500) ✓ 合法（走向：右、左、右）',
      count:6, ribbon:{k:3, ok:true}, mark:{ C:['ok','ok','ok','ok'] },
      zone:'C：右→左→右，450 ∈ (200,500) ✓' },
    { cls:'ok', tag:'D 合法',
      log:'D：180→(180,∞)；200→取 x&gt;200 → (200,∞)；500→(200,500)；450 ∈ (200,500) ✓ 合法（走向：右、右、左）',
      count:7, ribbon:{k:4, ok:true}, mark:{ D:['ok','ok','ok','ok'] },
      zone:'D：右→右→左，450 ∈ (200,500) ✓' },
    { cls:'done', tag:'完成',
      log:'只有 A 在第 4 步越界（180 不在 (200,450) 内），不能构成折半查找的比较序列 → 选 A',
      count:8, done:true, mark:{ A:['ok','ok','ok','miss'] },
      zone:'结论：<b>A 不可能</b>，B/C/D 都存在合法走向 ✓' },
  ],

  result: {
    big: 'A',
    html: '判定标准：<b>每个被比较的关键字都必须落在前面所有比较共同缩出的可能区间内</b>。' +
          'A 走到 (200,450) 后第 4 个比较对象 180 越界；B 靠"一路向左"、C/D 靠"右左右/右右左"都能自洽。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
