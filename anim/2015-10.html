<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-10 动画 · 小根堆删除堆顶并重建</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 小根堆（1~7 号）：8,15,10,21,34,16,12；删除 8 后用尾元素 12 补顶并下沉
var NS = 'http://www.w3.org/2000/svg';
var POS = { 1:[240,45], 2:[135,145], 3:[345,145], 4:[70,245], 5:[200,245], 6:[290,245], 7:[420,245] };
var EDGES = [ [1,2],[1,3],[2,4],[2,5],[3,6],[3,7] ];
var nodeEls = {}, edgeEls = {}, arrBox = null;

function build(stage){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 500 300');
  svg.setAttribute('width', '470');
  svg.setAttribute('height', '282');
  EDGES.forEach(function(e){
    var a = POS[e[0]], b = POS[e[1]];
    var ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', a[0]); ln.setAttribute('y1', a[1]);
    ln.setAttribute('x2', b[0]); ln.setAttribute('y2', b[1]);
    ln.setAttribute('stroke', '#cbd5e1'); ln.setAttribute('stroke-width', '3');
    svg.appendChild(ln);
    edgeEls[e[0] + '-' + e[1]] = ln;
  });
  [1,2,3,4,5,6,7].forEach(function(n){
    var p = POS[n];
    var g = document.createElementNS(NS, 'g');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 24);
    c.setAttribute('fill', '#ffffff'); c.setAttribute('stroke', '#334155'); c.setAttribute('stroke-width', '2.5');
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', p[0]); t.setAttribute('y', p[1] + 7);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '19'); t.setAttribute('font-weight', '700'); t.setAttribute('fill', '#0f172a');
    t.textContent = '';
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
    nodeEls[n] = { c: c, t: t };
  });
  wrap.appendChild(svg);
  wrap.appendChild(AW.el('div', 'aw-row-label', '<b>层序数组</b>（绿=已就位 / 红=当前比较）'));
  arrBox = AW.el('div', '');
  wrap.appendChild(arrBox);
  wrap.appendChild(AW.el('div', 'aw-row-label',
    '绿底=参与比较 / 红底=违反堆性质被交换 / 灰=已移出堆'));
  stage.appendChild(wrap);
}

// 每步：vals（7 个或 null）、cls（节点底色：''|'ok'|'miss'|'hit'|'gone'）
function render(stage, sn){
  var vals = sn.vals, cls = sn.clsArr || {};
  [1,2,3,4,5,6,7].forEach(function(n){
    var ne = nodeEls[n];
    var v = vals[n - 1];
    var c = cls[n] || '';
    ne.t.textContent = (v == null) ? '' : String(v);
    var fill = '#ffffff', stroke = '#334155', txt = '#0f172a';
    if(c === 'ok'){ fill = '#dcfce7'; stroke = '#16a34a'; }
    else if(c === 'miss'){ fill = '#fee2e2'; stroke = '#dc2626'; txt = '#b91c1c'; }
    else if(c === 'hit'){ fill = '#16a34a'; stroke = '#16a34a'; txt = '#ffffff'; }
    else if(c === 'gone'){ fill = '#f1f5f9'; stroke = '#cbd5e1'; txt = '#94a3b8'; }
    ne.c.setAttribute('fill', fill);
    ne.c.setAttribute('stroke', stroke);
    ne.t.setAttribute('fill', txt);
  });
  var e37 = edgeEls['3-7'];
  e37.setAttribute('visibility', vals[6] == null ? 'hidden' : 'visible');
  // 层序数组行
  arrBox.innerHTML = '';
  var chars = vals.map(function(v){ return v == null ? '∅' : String(v); });
  var classes = vals.map(function(v, i){
    var c = cls[i + 1] || '';
    if(v == null) return 'gone';
    return c === 'hit' ? 'hit' : c === 'miss' ? 'miss' : c === 'ok' ? 'ok' : c === 'gone' ? 'gone' : '';
  });
  arrBox.appendChild(AW.cellRow(chars, classes, null, 1));
}

var INIT = [8,15,10,21,34,16,12];
var AFTER_DEL = [12,15,10,21,34,16,null];
var AFTER_SWAP = [10,15,12,21,34,16,null];

AW.init({
  title: '2015-10 · 小根堆删除堆顶 8 后的重建比较次数',
  subtitle: '初始堆 <code>8, 15, 10, 21, 34, 16, 12</code> · 尾元素补顶 + 下沉',
  counterLabel: '比较次数',
  ribbonTitle: '比较（✓ 满足性质 / ✗ 违反）',
  intro: '点击「▶ 播放」逐步观察删除堆顶后的下沉重建过程。',

  build: build,
  render: render,

  snaps: [
    { cls:'step', tag:'初始堆',
      log:'小根堆 8,15,10,21,34,16,12：每个父结点 ≤ 孩子；现在删除堆顶 8',
      count:0, vals:INIT, clsArr:{} },
    { cls:'shift', tag:'尾元素补顶',
      log:'删除 8：为保持完全二叉树形态，把最后一个元素 12 放到堆顶（7 号位出堆），再把 12 下沉',
      count:0, vals:AFTER_DEL, clsArr:{ 1:'ok' } },
    { cls:'ok', tag:'比较 ①：15 vs 10',
      log:'12 的两个孩子 15 与 10 先互比，挑较小者：10 更小（第 1 次比较）',
      count:1, ribbon:{k:1, ok:true}, vals:AFTER_DEL, clsArr:{ 2:'ok', 3:'hit' } },
    { cls:'miss', tag:'比较 ②：12 vs 10',
      log:'12 与较小孩子 10 比：12>10 违反小根堆 → 12 与 10 交换（第 2 次比较）',
      count:2, ribbon:{k:2, ok:false}, vals:AFTER_DEL, clsArr:{ 1:'miss', 3:'hit' } },
    { cls:'step', tag:'12 下沉一层',
      log:'交换后 12 落到原 10 的位置（下标 3）；size=6，它只剩左孩子 16，右孩子已不存在',
      count:2, vals:AFTER_SWAP, clsArr:{ 1:'ok', 3:'ok', 6:'ok' } },
    { cls:'ok', tag:'比较 ③：12 vs 16',
      log:'12 与唯一的孩子 16 比：12<16 满足小根堆性质，下沉结束（第 3 次比较）',
      count:3, ribbon:{k:3, ok:true}, vals:AFTER_SWAP, clsArr:{ 3:'ok', 6:'hit' } },
    { cls:'done', tag:'完成',
      log:'重建后的堆为 10,15,12,21,34,16；比较次数 = ①15vs10 + ②12vs10 + ③12vs16 = 3 次 → 选 C',
      count:3, done:true, vals:AFTER_SWAP, clsArr:{ 1:'ok' } },
  ],

  result: {
    big: '3 次 · 选 C',
    html: '比较构成：<b>①孩子互比（15 vs 10）+ ②与较小孩子比（12 vs 10）+ ③下一层与唯一孩子比（12 vs 16）</b>。' +
          '易错：漏数孩子互比那次；或忘记 size=6 后 12 只剩一个孩子、无需再比。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
