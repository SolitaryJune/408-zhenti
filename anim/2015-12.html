<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-12 动画 · 硬件能直接执行的程序类型</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2015-12（计算机组成原理·计算机系统层次结构）
     概念辨析类：三种语言程序哪些能被硬件直接执行
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>题干给出三种程序：<code>I 机器语言程序</code>、<code>II 汇编语言程序</code>、<code>III 硬件描述语言程序</code>。考点：<b>计算机层次结构——硬件直接解释执行的只有机器语言</b>。</p>' },
  { title: '逐项分析 I：机器语言程序',
    cls: 'good',
    body: '<p><b>能</b>直接执行。机器语言程序是 0/1 编码的指令序列，CPU 的取指、译码、执行部件就是为解释它而设计的，无需任何翻译。</p>' },
  { title: '逐项分析 II：汇编语言程序',
    cls: 'bad',
    body: '<p><b>不能</b>。汇编语言用助记符（如 <code>mov</code>、<code>add</code>）书写，必须先由<b>汇编程序</b>翻译成机器语言目标程序才能运行。汇编语句与机器指令一一对应只是翻译关系，不是执行关系。</p>' },
  { title: '逐项分析 III：硬件描述语言程序',
    cls: 'bad',
    body: '<p><b>不能</b>。硬件描述语言（Verilog/VHDL 类）用于<b>描述和设计硬件电路本身</b>，供仿真、综合使用；它不在指令系统之内，CPU 无法取指执行。</p>' },
  { title: '层次定位',
    cls: 'key',
    body: '<p>层次结构自底向上：硬件电路 → <b>机器语言层</b>（微程序/硬布线直接解释）→ 汇编/高级语言层（虚拟机器，靠翻译或解释下沉）。任何高于机器语言的程序都要先变成机器码。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有 I 能被硬件直接执行，II、III 都要先翻译 → 答案选 <b>A（仅 I）</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '硬件能直接执行的程序是哪类？（2015·12）',
  subtitle: '考点：计算机系统层次结构 · I 机器语言 / II 汇编语言 / III 硬件描述语言 · 选项逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（仅 I）',
    html: '记忆锚点：硬件直接执行的只有<b>机器语言程序</b>。汇编程序须经<b>汇编程序翻译</b>；硬件描述语言是<b>造硬件</b>用的，不是给硬件跑的。干扰项 B 误在把"一一对应"当"直接执行"，C 误在把 HDL 当可执行程序。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
