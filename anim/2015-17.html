<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-17 动画 · 哪种存储器需要周期性刷新</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     2015-17（计算机组成原理·主存储器）
     概念辨析：SRAM / SDRAM / ROM / FLASH 是否需要刷新
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：抓关键词',
    cls: 'key',
    body: '<p>"工作期间需要<b>周期性刷新</b>"——这是<b>电容存电荷</b>的 DRAM 家族的标志：电荷会泄漏，必须每隔几毫秒读出放大、重写一遍。</p>' },
  { title: '逐项分析 A：SRAM',
    cls: 'bad',
    body: '<p><b>不需刷新</b>。SRAM 用双稳态触发器锁存 0/1，只要供电就稳定——"静态"正是此意。它快而贵，用作 Cache。</p>' },
  { title: '逐项分析 B：SDRAM',
    cls: 'good',
    body: '<p><b>需要刷新</b>。SDRAM = <b>S</b>ynchronous <b>DRAM</b>：同步时序 + 动态存储，电容存电荷，靠周期刷新维持数据。它是主存（内存条）的主流形态。</p>' },
  { title: '逐项分析 C：ROM',
    cls: 'bad',
    body: '<p><b>不需刷新</b>。ROM（掩模/一次性编程）数据固化，非易失，读出不影响内容。</p>' },
  { title: '逐项分析 D：FLASH',
    cls: 'bad',
    body: '<p><b>不需周期刷新</b>。FLASH 用浮栅晶体管存电荷，掉电不丢；它按<b>块擦写</b>，与 DRAM 的周期刷新完全不同。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有 SDRAM（DRAM 家族）需要周期性刷新 → 答案选 <b>B</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '哪种存储器需要周期性刷新？（2015·17）',
  subtitle: '考点：刷新 = DRAM（电容存电荷）专属 · SRAM / SDRAM / ROM / FLASH 逐项辨析',
  intro: '点击「▶ 播放」逐项推演。',
  snaps: snaps,
  result: {
    big: '答案 B（SDRAM）',
    html: '记忆锚点：见 <b>DRAM</b>（含 SDRAM、DDR 系列）就要<b>周期刷新</b>；SRAM"静态"= 不需刷新；ROM、FLASH 非易失、不工作也保数据。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
