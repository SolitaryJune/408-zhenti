<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-19 动画 · 总线定时方式辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     2015-19（计算机组成原理·总线事务和定时）
     概念辨析：四个选项找"错误"叙述
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>考点：<b>总线定时方式</b>（同步 / 异步 / 半同步），本题选<b>错误</b>叙述。先记住主轴：同步统一时钟、异步握手应答、半同步时钟加 WAIT。</p>' },
  { title: '选项 A：异步全互锁最慢',
    cls: 'good',
    body: '<p><b>说法正确</b>（不是答案）。全互锁的握手链最长："请求 → 应答 → 再确认"，每一环都要等待对方，速度最慢但可靠性最高。</p>' },
  { title: '选项 B：异步非互锁可靠性最差',
    cls: 'good',
    body: '<p><b>说法正确</b>（不是答案）。非互锁：发完信号不等确认就走，信号丢失或过快到达都无法察觉 → 可靠性最差，但最快。口诀：<b>越互锁越可靠、越不互锁越快</b>。</p>' },
  { title: '选项 C：同步时钟可由各设备提供',
    cls: 'bad',
    body: '<p><b>说法错误</b>（答案）。同步通信的前提是<b>统一时钟</b>：全总线共用一个公共时钟（由总线控制器/CPU 统一发出）。若各设备各自发时钟，节拍对不齐，同步无从谈起——设备只能"服从"时钟，不能"提供"时钟。</p>' },
  { title: '选项 D：半同步采样由同步时钟控制',
    cls: 'good',
    body: '<p><b>说法正确</b>（不是答案）。半同步 = 同步定时 + WAIT 应答：仍用公共时钟定节拍，设备来不及完成就在固定节拍上采样 WAIT，插入等待周期。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>错误的是 C：同步时钟必须统一提供，不能各设备自行提供 → 答案选 <b>C</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '总线定时方式辨析，哪条错误？（2015·19）',
  subtitle: '考点：<code>同步 = 统一时钟 · 异步 = 握手应答 · 半同步 = 时钟 + WAIT</code> · 逐项推演',
  intro: '点击「▶ 播放」逐项判定 A~D。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：<b>同步通信的时钟由统一的公共时钟（总线控制器）提供</b>，各设备不可各自供时钟；异步口诀<b>越互锁越可靠、越不互锁越快</b>（全互锁最慢最可靠，非互锁最快最不可靠）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
