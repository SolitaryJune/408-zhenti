<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-20 动画 · 磁盘访问一个扇区的平均存取时间</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2015-20（计算机组成原理·外部存储器）
     纯计算推理：寻道 + 半圈 + 传输
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>条件：转速 <code>7200 rpm</code>、平均寻道 <code>8 ms</code>、每道 <code>1000 个扇区</code>。求访问<b>一个扇区</b>的平均存取时间。公式：<b>寻道 + 平均旋转延迟 + 传输时间</b>。</p>' },
  { title: '第一步：转速换算',
    cls: 'key',
    body: '<p>7200 ÷ 60 = 120 转/秒 → 转一圈 = 1000 ÷ 120 ≈ <b>8.33 ms</b>。这一圈时间既是旋转延迟、也是"读整道"的传输基准。</p>' },
  { title: '第二步：平均旋转延迟',
    cls: 'good',
    body: '<p>平均要等半圈：8.33 ÷ 2 ≈ <b>4.17 ms</b>。<b>除以 2 是本题最大的坑</b>——忘了除 2 就会得到干扰项 16.3 ms。</p>' },
  { title: '第三步：传输一个扇区',
    cls: 'key',
    body: '<p>一圈 8.33 ms 转过 1000 个扇区 → 一个扇区 = 8.33 ÷ 1000 ≈ <b>0.008 ms</b>。（若读一整磁道才是 8.33 ms——那会凑出干扰项 20.5 ms。）</p>' },
  { title: '求和',
    cls: 'good',
    body: '<p>8（寻道）+ 4.17（半圈）+ 0.008（传输）≈ <b>12.2 ms</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B（12.2 ms）</b>。对照干扰项：C = 16.3（忘除 2）、D = 20.5（传输按整道算），都是典型错法。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '磁盘访问一个扇区的平均存取时间（2015·20）',
  subtitle: '7200 rpm · 寻道 8 ms · 每道 1000 扇区 · 公式 <code>寻道 + 半圈 + 传输</code>',
  intro: '点击「▶ 播放」逐步计算。',
  snaps: snaps,
  result: {
    big: '约 12.2 ms（答案 B）',
    html: '记忆锚点：<code>8 + 4.17 + 0.008 ≈ 12.2</code>。<b>半圈 = 60000 ÷（rpm × 2）ms</b>；忘除 2 → 16.3（C），传输按整道 → 20.5（D）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
