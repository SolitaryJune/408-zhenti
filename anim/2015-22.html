<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-22 动画 · 内部异常三类辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2015-22（计算机组成原理·异常和中断机制）
     概念辨析：fault / trap / abort，找错误叙述
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>内部异常三类：<code>fault 故障</code>、<code>trap 陷阱</code>、<code>abort 终止</code>。本题选<b>错误</b>叙述——重点盯住"处理后返回到哪"。</p>' },
  { title: '选项 A：异常的产生与当前指令相关',
    cls: 'good',
    body: '<p><b>说法正确</b>（不是答案）。内部异常由当前正在执行的指令引发：缺页发生在该指令访存时、除 0 发生在该指令执行时——与指令强相关。</p>' },
  { title: '选项 B：检测由 CPU 内部逻辑实现',
    cls: 'good',
    body: '<p><b>说法正确</b>（不是答案）。异常的检测与识别由 CPU 内部的状态标志与异常检测电路完成，不需要外部设备发请求。</p>' },
  { title: '选项 C：响应发生在指令执行过程中',
    cls: 'good',
    body: '<p><b>说法正确</b>（不是答案）。内部异常在<b>一条指令执行过程中</b>被检测并响应；外中断则是在指令周期末的"中断扫描"点才响应。</p>' },
  { title: '选项 D：处理后返回发生异常的指令继续执行',
    cls: 'bad',
    body: '<p><b>说法错误</b>（答案）。三类返回行为各不相同：<b>fault</b>（如缺页）排除故障后返回<b>当前指令</b>重新执行；<b>trap</b>（如 INT 指令）返回<b>下一条指令</b>；<b>abort</b>（硬件故障）根本<b>无法继续执行</b>。笼统说"返回原指令"不成立。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>错误的是 D → 答案选 <b>D</b>。口诀：<b>fault 重来、trap 下一条、abort 回不去</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '内部异常三类辨析，哪条错误？（2015·22）',
  subtitle: '考点：<code>fault 故障 · trap 陷阱 · abort 终止</code> · 三类的返回行为不同',
  intro: '点击「▶ 播放」逐项判定 A~D。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：<b>fault 重来（返回当前指令重执行）、trap 下一条（返回下条指令）、abort 回不去（终止进程）</b>。A/B/C 三条都是内部异常的正确性质。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
