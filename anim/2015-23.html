<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-23 外部中断时由操作系统保存的内容</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    log: '外部中断随机到来，响应中断要"保存现场"：断点谁存？现场谁存？',
    body: '<p>外部中断（时钟、I/O 完成等）随机到来，响应它必须保存<b>断点</b>和<b>现场</b>。考点：<b>这两样分别由硬件还是操作系统保存？</b></p>' },
  { title: '硬件自动保存 PC 与 PSW', cls: 'bad',
    log: '中断隐指令由硬件自动保存 PC（断点）与 PSW → A 是硬件干的，不是 OS',
    body: '<p>中断隐指令由<b>硬件</b>自动完成：保存断点 PC（A 项）和程序状态字 PSW。它发生在 OS 接管之前，<b>不算操作系统的动作</b> → A 错。</p>' },
  { title: '操作系统保存通用寄存器', cls: 'good',
    log: 'OS 的中断处理程序负责保存通用寄存器等现场 → B 正确',
    body: '<p>硬件只管断点；<b>通用寄存器</b>等现场信息由<b>操作系统的中断处理程序</b>压栈（或存入 PCB）保存，处理完再恢复 → <b>B 正确</b>。</p>' },
  { title: '排除 C：TLB 内容', cls: 'bad',
    log: 'TLB 是对 OS 透明的硬件部件，内容自动维护，OS 不保存 → C 错',
    body: '<p>快表 TLB 是对 OS <b>透明的硬件部件</b>，内容由硬件自动维护，中断现场不包括它，OS 既不保存也不恢复 → C 错。</p>' },
  { title: '排除 D：Cache 内容', cls: 'bad',
    log: 'Cache 同样由硬件自动管理，与进程现场无关 → D 错',
    body: '<p>Cache 也由硬件自动管理，其内容与进程现场无关，不需要 OS 保存 → D 错。</p>' },
  { title: '结论', cls: 'good',
    log: '答案 B：硬件存 PC/PSW（断点），操作系统存通用寄存器（现场）',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>硬件存 PC/PSW（断点），操作系统存通用寄存器（现场）</b>；TLB/Cache 由硬件透明管理。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '【2015-23】处理外部中断时，由操作系统保存的是什么',
  subtitle: '考点：中断响应中的"保存现场"分工（硬件 vs 操作系统）· 选项逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '外部中断的响应分工：<b>硬件</b>（中断隐指令）自动保存断点 <code>PC</code> 与 <code>PSW</code>；<b>操作系统</b>（中断处理程序）保存<code>通用寄存器</code>等现场。干扰项：<b>A</b>（PC 是硬件存的）、<b>C/D</b>（TLB、Cache 由硬件透明管理，与现场无关）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
