<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-24 哪条指令不可能使用户态变为内核态</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：切态的唯一入口', cls: 'key',
    log: '用户态 → 内核态只有一条路：发生中断或异常（陷入内核）',
    body: '<p>CPU 从用户态切到内核态，唯一途径是发生<b>中断或异常</b>（如系统调用、缺页、除零）。所以题目等价于：<b>哪条指令绝不会产生异常或中断？</b></p>' },
  { title: 'A：DIV R0, R1', cls: 'bad',
    log: 'A 除法：除数为 0 抛出除零异常 → 可能切态，排除',
    body: '<p>除数为 0 时硬件产生<b>除零异常</b>，CPU 陷入内核态处理 → A <b>可能</b>引起切态，排除。</p>' },
  { title: 'B：INT n（软中断）', cls: 'bad',
    log: 'B 软中断指令：执行即主动陷入内核 → 必然切态，排除',
    body: '<p><code>INT n</code> 本身就是<b>软中断（陷阱）指令</b>，一执行就主动陷入内核——系统调用正是这么进内核的 → B <b>必然</b>切态，排除。</p>' },
  { title: 'C：NOT R0（取反）', cls: 'good',
    log: 'C 取反：纯寄存器操作，不访存、不出异常 → 不可能切态 ✓',
    body: '<p>对寄存器 R0 取反：<b>不访存、不会除零、不产生任何异常或中断</b>，无论 R0 是什么值都顺利执行完 → <b>不可能</b>切态 → 选 C。</p>' },
  { title: 'D：MOV R0, addr', cls: 'bad',
    log: 'D 访存：可能缺页/地址越界 → 可能切态，排除',
    body: '<p>要访问内存 addr：在请求分页系统中可能<b>缺页</b>，也可能<b>地址越界</b>，这些异常都会陷入内核 → D 可能切态，排除。</p>' },
  { title: '结论', cls: 'good',
    log: '答案 C：判断切态看指令会不会"出事"（异常/中断）',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>会不会切态，看这条指令会不会"出事"</b>——除零、访存（缺页/越界）、软中断都可能出事；纯寄存器运算最安全。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '【2015-24】执行时不可能使 CPU 从用户态变为内核态的指令',
  subtitle: '考点：用户态/内核态切换条件（中断与异常）· 四条指令逐条排查',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '切态的唯一入口是<b>中断/异常</b>。<code>DIV</code> 可能除零、<code>INT n</code> 必然陷入、<code>MOV</code> 可能缺页/越界——都可能切态；只有 <code>NOT R0</code> 是<b>纯寄存器操作</b>，绝不出事。记忆点：判据是"指令会不会产生异常或中断"。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
