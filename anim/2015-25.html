<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-25 执行态变为就绪态的事件</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var BOXES = [
  { key: 'ready',  label: '就绪态', sub: '只差一个 CPU' },
  { key: 'run',    label: '运行态', sub: '正在 CPU 上' },
  { key: 'block',  label: '阻塞态', sub: '等资源/等事件' },
];

// 每步：活动状态 + 转换说明 + 结论行
var S = [
  { act:'run',   opt:'', trans:'进程 P 正在 CPU 上运行。题问：哪种事件让它"下台"后进入<b>就绪</b>而不是<b>阻塞</b>？', tail:'' },
  { act:'run',   opt:'', trans:'判据：进程自己<b>等资源/等事件</b> → 阻塞；进程随时可运行、只是 CPU 被拿走 → 就绪。', tail:'' },
  { act:'block', opt:'A', trans:'A：执行 P(wait) 操作——信号量值不足，申请失败，P 只能等待其他进程 V 它。', tail:'<b style="color:#a02830">等资源 → 运行→阻塞 ✗</b>' },
  { act:'block', opt:'B', trans:'B：申请内存失败——在等"内存可用"这一事件。', tail:'<b style="color:#a02830">等资源 → 运行→阻塞 ✗</b>' },
  { act:'block', opt:'C', trans:'C：启动 I/O 设备——发出 I/O 命令后要等 I/O 完成。', tail:'<b style="color:#a02830">等事件 → 运行→阻塞 ✗</b>' },
  { act:'ready', opt:'D', trans:'D：被高优先级进程抢占——可剥夺调度下 CPU 被夺走，但 P 自身随时可运行。', tail:'<b style="color:#276942">被抢 CPU → 运行→就绪 ✓ 对应选项 D</b>' },
  { act:'ready', opt:'', trans:'同类场景：时间片用完也是 运行→就绪。就绪进程"没毛病，就差一个 CPU"。', tail:'' },
  { act:'ready', opt:'', trans:'结论：执行态 → 就绪态的事件是"被高优先级进程抢占"。', tail:'<b style="color:#276942">答案：D</b>' },
];

var STATE_BOXES, TRANS_LINE, TAIL_LINE;

AW.init({
  title: '【2015-25】导致进程从执行态变为就绪态的事件',
  subtitle: '考点：进程状态转换（运行 → 就绪 / 运行 → 阻塞 的分水岭）· 四个选项逐一归类',
  counterLabel: '已分析',
  ribbonTitle: '选项判定（✓ 对 / ✗ 错）',
  intro: '点击「▶ 播放」，跟随进程 P 把四个选项逐一放到状态图上验证。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    var row = AW.el('div', '');
    row.style.cssText = 'display:flex;gap:14px;align-items:center;margin:14px 0 6px;justify-content:flex-start';
    STATE_BOXES = {};
    BOXES.forEach(function(b, idx){
      if(idx > 0){
        var ar = AW.el('div', '', '⟷');
        ar.style.cssText = 'font-size:22px;color:#b9cbd0;flex:0 0 auto';
        row.appendChild(ar);
      }
      var box = AW.el('div', 'aw-box', b.label);
      box.style.cssText = 'width:170px;height:86px;flex:0 0 auto;font-size:17px;flex-direction:column;line-height:1.3';
      row.appendChild(box);
      STATE_BOXES[b.key] = box;
    });
    inner.appendChild(row);

    var legend = AW.el('div', 'aw-row-label',
      '就绪 → 运行：被调度选中　|　运行 → 阻塞：请求资源/等事件（主动）　|　阻塞 → 就绪：事件发生被唤醒　|　运行 → 就绪：时间片到 / 被剥夺（被动）');
    legend.style.cssText = 'margin-top:4px';
    inner.appendChild(legend);

    TRANS_LINE = AW.el('div', 'aw-row-label', '');
    TRANS_LINE.style.cssText = 'margin-top:14px;font-size:14.5px;color:#213e48;line-height:1.7';
    inner.appendChild(TRANS_LINE);

    TAIL_LINE = AW.el('div', 'aw-row-label', '');
    TAIL_LINE.style.cssText = 'margin-top:6px;font-size:15px;line-height:1.7';
    inner.appendChild(TAIL_LINE);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    var st = S[Math.min(i, S.length - 1)];
    BOXES.forEach(function(b){
      var box = STATE_BOXES[b.key];
      var active = st.act === b.key;
      box.className = 'aw-box' + (active ? ' hit' : '');
      box.innerHTML = b.label +
        (active ? '<div style="font-size:13px;font-weight:700;margin-top:4px">进程 P ●</div>'
                : '<div style="font-size:11px;font-weight:400;color:#b9cbd0">' + b.sub + '</div>');
    });
    TRANS_LINE.innerHTML = (st.opt ? '<b>选项 ' + st.opt + '</b>　' : '') + st.trans;
    TAIL_LINE.innerHTML = st.tail;
  },

  snaps: [
    { cls:'shift', tag:'开始',   log:'进程 P 在运行态：哪种事件让它回到"就绪"而不是"阻塞"？', count:0 },
    { cls:'step',  tag:'判据',   log:'分水岭：等资源/等事件 → 阻塞；随时可运行只是没了 CPU → 就绪', count:1 },
    { cls:'miss',  tag:'选项 A', log:'执行 P(wait)：信号量不足申请失败 → 等资源，运行→阻塞', count:2, ribbon:{k:1, ok:false} },
    { cls:'miss',  tag:'选项 B', log:'申请内存失败：等内存资源 → 运行→阻塞', count:3, ribbon:{k:2, ok:false} },
    { cls:'miss',  tag:'选项 C', log:'启动 I/O 设备：等 I/O 完成 → 运行→阻塞', count:4, ribbon:{k:3, ok:false} },
    { cls:'ok',    tag:'选项 D', log:'被高优先级进程抢占：CPU 被夺走但随时可运行 → 运行→就绪 ✓', count:5, ribbon:{k:4, ok:true} },
    { cls:'step',  tag:'同类',   log:'时间片用完同样触发 运行→就绪；就绪进程只差一个 CPU', count:6 },
    { cls:'done',  tag:'完成',   log:'结论：执行态→就绪态的事件 = 被高优先级进程抢占 → 选 D', count:7, done:true },
  ],

  result: {
    big: '答案 D',
    html: '运行态进程"下台"有两条路：<b>等资源/等事件 → 阻塞</b>（P 操作失败、申请内存失败、启动 I/O 都是），<b>被剥夺 CPU → 就绪</b>（被高优先级进程抢占、时间片用完）。记忆点：<b>就绪 = 没毛病只差 CPU；阻塞 = 有事没办完</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
