<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-28 设置磁盘缓冲区的主要目的</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：磁盘缓冲区是什么', cls: 'key',
    log: '磁盘缓冲区＝在内存中缓存磁盘块内容的一块区域',
    body: '<p>磁盘缓冲区是在<b>内存</b>中开辟的、缓存磁盘块内容的区域。考点：设置它<b>主要图什么</b>？</p>' },
  { title: '读路径：命中就不碰盘', cls: 'good',
    log: '读盘前先查缓冲区：命中 → 直接从内存拿，一次磁盘 I/O 都不做',
    body: '<p>读磁盘前先查缓冲区：<b>命中</b> → 直接从内存取数据，<b>一次磁盘 I/O 都不用做</b>；未命中才真正读盘，并把该块放入缓冲区供下次使用。</p>' },
  { title: '写路径：延迟写、合并写', cls: 'good',
    log: '写操作可先写缓冲区，延迟/合并写回磁盘 → 也减少 I/O 次数',
    body: '<p>写操作可以先写入缓冲区，<b>延迟写 / 合并写</b>回磁盘（多次逻辑写合并成一次物理写）→ 同样减少磁盘 I/O 次数。</p>' },
  { title: '排除 B：寻道时间', cls: 'bad',
    log: '寻道是磁头机械移动，靠调度算法（SSTF/SCAN）优化 → 缓冲帮不上',
    body: '<p>平均寻道时间由<b>磁头机械移动</b>决定，靠磁盘调度算法（SSTF、SCAN 等）优化；内存缓冲改变不了磁头怎么走 → B 错。</p>' },
  { title: '排除 C：可靠性 / 排除 D：设备无关性', cls: 'bad',
    log: '可靠性靠冗余备份（RAID）；设备无关性靠设备独立性软件（LUT）→ 都与缓冲无关',
    body: '<p>数据<b>可靠性</b>靠冗余与备份（RAID、定期备份），缓冲区掉电反而可能丢数据；<b>设备无关性</b>靠设备独立性软件的逻辑设备表（LUT）等机制 → C、D 都错。</p>' },
  { title: '结论', cls: 'good',
    log: '答案 A：主要目的＝减少磁盘 I/O 次数（能不碰盘就不碰盘）',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>缓冲区设在内存里，图的就是"能不碰盘就不碰盘"——减少磁盘 I/O 次数</b>，速度提升只是它的结果。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '【2015-28】在内存中设置磁盘缓冲区的主要目的',
  subtitle: '考点：缓冲管理（I/O 性能）· 机制拆解 + 干扰项排除',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '磁盘缓冲区缓存磁盘块：<b>读命中免读盘</b>、<b>写可延迟/合并</b>，核心效果是<code>减少磁盘 I/O 次数</code>。干扰项：<b>B</b> 寻道靠磁盘调度算法、<b>C</b> 可靠性靠冗余备份、<b>D</b> 设备无关性靠设备独立性软件（LUT）——都与缓冲无关。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
