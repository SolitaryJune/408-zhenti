<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-39 TCP 发送窗口推演动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 算法/过程类动画：外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var ROWS = [
  { t: '建立连接',       c: '1 KB',  buf: 0,  r: '16 KB', w: '1 KB' },
  { t: '第 1 个 RTT 后', c: '2 KB',  buf: 1,  r: '15 KB', w: '2 KB' },
  { t: '第 2 个 RTT 后', c: '4 KB',  buf: 3,  r: '13 KB', w: '4 KB' },
  { t: '第 3 个 RTT 后', c: '8 KB',  buf: 7,  r: '9 KB',  w: '8 KB' },
  { t: '第 4 个 RTT 后', c: '16 KB', buf: 15, r: '1 KB',  w: '1 KB' },
];
var BUFSEQ = [0, 0, 1, 3, 7, 15, 15];
var TB = null, FILL = null, BUFTXT = null, FXT = null;

var FXS = [
  '发送窗口 = <b>min(拥塞窗口 cwnd, 接收窗口 rwnd)</b>。慢开始：cwnd 从 1 MSS = 1 KB 起、每 RTT 翻倍（阈值 32 KB 未触及）；乙缓存 16 KB，且收到的数据<b>从不取走</b> → rwnd = 16 − 累计缓存。',
  '建立连接时：cwnd = 1 KB，rwnd = 16 KB → 发送窗口 = min(1, 16) = <b>1 KB</b>，先发 1 个段。',
  '第 1 个 RTT：甲发 1 KB，乙收进缓存（不取走）并逐段确认，确认通告 rwnd = 15 KB；RTT 结束 cwnd 翻倍到 2 KB → 发送窗口 = min(2, 15) = <b>2 KB</b>。',
  '第 2 个 RTT：甲发 2 KB，累计缓存 3 KB → rwnd = 13 KB；cwnd = 4 KB → 发送窗口 = <b>4 KB</b>。',
  '第 3 个 RTT：甲发 4 KB，累计缓存 7 KB → rwnd = 9 KB；cwnd = 8 KB → 发送窗口 = <b>8 KB</b>。',
  '第 4 个 RTT：甲发 8 KB，累计缓存 15 KB → rwnd = <b>1 KB</b>；cwnd = 16 KB → 发送窗口 = min(16, 1) = <b>1 KB</b>——cwnd 涨得再快，也被接收窗口卡死！',
  '结论：4 个 RTT 后甲的发送窗口 = <b>1 KB</b>，选 <b>A</b>。',
];

AW.init({
  title: '2015-39 TCP 发送窗口：4 个 RTT 推演',
  subtitle: 'cwnd 慢开始翻倍 · 乙缓存 16 KB 且数据不取走 · 发送窗口 = <code>min(cwnd, rwnd)</code>',
  counterLabel: '已经过 RTT',
  ribbonTitle: 'RTT 里程碑（✓ 已推进）',
  intro: '点击「▶ 播放」，逐 RTT 观察两个窗口此消彼长。',

  build: function(stage){
    if (!document.getElementById('rt39-style')){
      var st = document.createElement('style');
      st.id = 'rt39-style';
      st.textContent = '.t39{border-collapse:collapse;font-size:13.5px;font-family:Menlo,Consolas,monospace}' +
        '.t39 th{background:#f8edcb;color:#47616c;font-weight:600}' +
        '.t39 th,.t39 td{border:1px solid #1b3a4b26;padding:6px 14px;text-align:center}' +
        '.t39 tr.r39{transition:background .25s}' +
        '.t39 tr.r39.cur{background:#f8edcb}' +
        '.t39 tr.r39.pick{background:#2f9e4424;font-weight:700}';
      document.head.appendChild(st);
    }
    stage.innerHTML = '';
    var wrap = AW.el('div', '');
    var tb = AW.el('div', '');
    tb.innerHTML = '<table class="t39"><tr><th>时刻</th><th>拥塞窗口 cwnd</th><th>接收窗口 rwnd</th><th>发送窗口 = min</th></tr><tbody id="rt39tb"></tbody></table>';
    TB = tb.querySelector('#rt39tb');
    wrap.appendChild(tb);
    BUFTXT = AW.el('div', 'aw-row-label', '');
    wrap.appendChild(BUFTXT);
    var outer = AW.el('div', '');
    outer.style.cssText = 'height:24px;background:#f8edcb;border:1px solid #1b3a4b26;border-radius:8px;overflow:hidden;max-width:480px';
    FILL = AW.el('div', '');
    FILL.style.cssText = 'height:100%;width:0;background:#1b3a4b;transition:width .5s ease, background .4s ease';
    outer.appendChild(FILL);
    wrap.appendChild(outer);
    FXT = AW.el('div', '');
    FXT.style.cssText = 'margin-top:12px;background:#f8edcb;border:1px solid #1b3a4b26;border-radius:10px;padding:10px 14px;font-size:13.5px;color:#213e48;line-height:1.8';
    wrap.appendChild(FXT);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'审题', log:'发送窗口 = <b>min(cwnd, rwnd)</b>：cwnd 慢开始从 1 KB 起每 RTT 翻倍；乙缓存 16 KB、数据从不取走 → rwnd 一路收缩。', count:0 },
    { cls:'step', tag:'建立连接', log:'cwnd = 1 KB（1 个 MSS），rwnd = 16 KB → 发送窗口 = min(1, 16) = <b>1 KB</b>，甲先发 1 个数据段。', count:0 },
    { cls:'step', tag:'RTT 1', log:'甲发 1 KB，乙存入缓存并确认，确认通告 rwnd = 15 KB；cwnd 翻倍到 2 KB → 发送窗口 = min(2, 15) = <b>2 KB</b>。', count:1, ribbon:{k:1, ok:true} },
    { cls:'step', tag:'RTT 2', log:'甲发 2 KB，累计缓存 3 KB → rwnd = 13 KB；cwnd = 4 KB → 发送窗口 = min(4, 13) = <b>4 KB</b>。', count:2, ribbon:{k:2, ok:true} },
    { cls:'step', tag:'RTT 3', log:'甲发 4 KB，累计缓存 7 KB → rwnd = 9 KB；cwnd = 8 KB → 发送窗口 = min(8, 9) = <b>8 KB</b>。', count:3, ribbon:{k:3, ok:true} },
    { cls:'miss', tag:'缓存将满', log:'甲发 8 KB，累计缓存 15 KB → rwnd = <b>1 KB</b>；cwnd = 16 KB → 发送窗口 = min(16, 1) = <b>1 KB</b>——cwnd 涨到 16 KB 也被接收窗口卡死！', count:4, ribbon:{k:4, ok:true} },
    { cls:'done', tag:'完成', log:'结论：4 个 RTT 后甲的发送窗口 = <b>1 KB</b>，选 <b>A</b>。', count:4, done:true },
  ],

  render: function(stage, sn, i){
    var n = (i >= 1 && i <= 6) ? Math.min(i, 5) : 0;
    var h = '';
    for (var k = 0; k < n; k++){
      var r = ROWS[k];
      var cls = 'r39';
      if (k === n - 1){ cls += (i >= 6) ? ' pick' : ' cur'; }
      h += '<tr class="' + cls + '"><td>' + r.t + '</td><td>' + r.c + '</td><td>' + r.r + '</td><td>' + r.w + '</td></tr>';
    }
    TB.innerHTML = h;
    var buf = BUFSEQ[i] || 0;
    FILL.style.width = (buf / 16 * 100) + '%';
    FILL.style.background = (buf >= 15) ? '#e63946' : '#1b3a4b';
    BUFTXT.innerHTML = '<b>乙的接收缓存</b>：已积压 ' + buf + ' KB / 16 KB，接收窗口 rwnd = ' + (16 - buf) + ' KB';
    FXT.innerHTML = FXS[i] || '';
  },

  result: {
    big: '答案 A：1 KB',
    html: '发送窗口 = <b>min(cwnd, rwnd)</b>：cwnd 按慢开始 1→2→4→8→16 KB 翻倍，但乙的 16 KB 缓存被塞到 15 KB，rwnd 收缩到 <b>1 KB</b>，4 个 RTT 后发送窗口被卡在 <b>1 KB</b>。<br>易错：只算拥塞窗口会误选 C（16 KB）——题干「数据不被取走」才是本题的胜负手。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
