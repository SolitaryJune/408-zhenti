<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-43 动画 · 单总线 CPU 数据通路六问</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2015-43（计算机组成原理·CPU 数据通路，大题）
     按问揭示：6 个小问逐问展开
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：单总线 CPU 结构',
    cls: 'key',
    body: '<p>16 位机、主存<b>按字节编址</b>、16 位定长指令；CPU 内部<b>单总线</b>。部件：R0~R3、T（暂存器）、SR（移位寄存器，SRout 控其输出）、ALU（A 端口接 T，B 端口接 MUX 输出）、MUX（输入端 = 常数 2 和 ① 端点）、PC/MAR/MDR/IR、控制部件。端点 ①~⑨ 散布在通路上。</p>' },
  { title: '第 1 问：程序员可见寄存器 / 为何设 T',
    cls: 'key',
    body: '<p><b>可见</b>：通用寄器 R0~R3 和 PC（可寻址、可编程）。MAR/MDR/IR/T/SR 为内部工作寄存器，不可见。<br><b>T 的作用</b>：单总线一次只传一个数，ALU 要同时拿到两个操作数 → 先把总线数据暂存进 T（A 端口），B 端口再从 MUX 取另一路数据。</p>' },
  { title: '第 2 问：ALUop、SRop 的位数',
    cls: 'good',
    body: '<p>ALU 有 <code>mova/add/sub/and/or/not/inc</code> <b>7 种</b>操作：3 位编 8 种 ≥ 7 → <b>至少 3 位</b>；SR 有 <code>mov/left/right</code> <b>3 种</b>操作：2 位编 4 种 ≥ 3 → <b>至少 2 位</b>。公式：n 种操作至少 ⌈log2 n⌉ 位。</p>' },
  { title: '第 3 问：SRout 控制什么部件',
    cls: 'good',
    body: '<p>SRout 控制<b>三态门</b>——位于移位寄存器 SR 输出与 CPU 内总线之间：为 1 时导通，把移位结果送上总线；为 0 时呈高阻断开。</p>' },
  { title: '第 4 问：哪些端点连控制部件输出端',
    cls: 'good',
    body: '<p>控制信号端点 <b>①（SRout）、②（SRop）、③（ALUop）、⑤（Tin）、⑧（MUXop）</b>须连控制部件输出端——它们分别控制三态门、移位操作、ALU 操作、T 写入、MUX 选择。而 ④⑥⑦⑨ 是数据端点，不接控制器。</p>' },
  { title: '第 5 问：补哪两条连线',
    cls: 'key',
    body: '<p><b>连线 1：⑥ → ⑨</b>：把 CPU 内总线数据引到 MUX 的输入端 1（另一输入端是常数 2）。<br><b>连线 2：⑦ → ④</b>：把 MUX 输出引到 ALU 的 B 端口。<br>打通后 MUX 才能把"2"或总线数据供到 B 端口，与 T（A 端口）配合完成如 (PC)+2 的运算。</p>' },
  { title: '第 6 问：MUX 输入端为什么是 2',
    cls: 'good',
    body: '<p>指令 16 位定长、按字节编址 → 顺序执行时下条指令地址 = (PC) + <b>2</b>。MUX 输入端接常数 2，经 ALU 加法实现 (PC)+2 → PC。</p>' },
  { title: '结论：六问答案汇总',
    cls: 'good',
    body: '<p>① 可见：R0~R3、PC，T 暂存 A 端口数据；② ALUop 3 位、SRop 2 位；③ SRout 控三态门；④ 端点 1、2、3、5、8 接控制器；⑤ 连线 ⑥→⑨、⑦→④；⑥ MUX 输入 2 用于 (PC)+2。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '单总线 CPU 数据通路六问（2015·43）',
  subtitle: '16 位定长指令 · 按字节编址 · 单总线 · <code>T 暂存 A 口 + MUX 喂 B 口</code>',
  intro: '点击「▶ 播放」逐问展开答题链。',
  snaps: snaps,
  result: {
    big: '六问汇总（13 分框架）',
    html: '① <b>R0~R3、PC</b> 可见，T 为 ALU 分离两操作数；② ALUop <b>3 位</b>、SRop <b>2 位</b>；③ SRout 控<b>三态门</b>；④ 端点 <b>1、2、3、5、8</b> 接控制器；⑤ 连线 <b>⑥→⑨、⑦→④</b>；⑥ MUX 输入 2 = (PC)+2（按字节编址 + 16 位指令）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
