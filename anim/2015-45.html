<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-45 信箱辩论：信号量设计与 P/V 过程</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .mb{ width:250px; border:2px solid #5a7d8c66; border-radius:14px; padding:12px 14px; background:#fff; transition:all .2s; }
  .mb h5{ font-size:13.5px; color:#213e48; margin-bottom:6px; }
  .mb .cnt{ font-size:20px; font-weight:800; color:#1b3a4b; font-family:"SF Mono",Menlo,monospace; }
  .mb .emp{ font-size:12px; color:#586e72; margin-top:3px; }
  .mb.on{ border-color:#e07a2f; background:#fffbeb; }
  .sem{ display:inline-flex; align-items:center; gap:6px; border:2px solid #1b3a4b26; border-radius:999px;
    padding:4px 11px; font-size:12.5px; font-family:"SF Mono",Menlo,monospace; color:#47616c;
    background:#f8edcb; transition:all .2s; margin:3px 4px 0 0; }
  .sem.on{ border-color:#e07a2f; background:#f8edcb; color:#92400e; font-weight:700; }
  .pv{ color:#1b3a4b; font-family:"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var SEMS = ['Full_A', 'Empty_A', 'Full_B', 'Empty_B', 'mutex_A', 'mutex_B'];
var SEMV = ['初值 x', '初值 M−x', '初值 y', '初值 N−y', '初值 1', '初值 1'];

// 每步：信箱数量（符号表达式）、点亮的信号量、说明
var ST = [
  { a:'x 封',   ea:'M−x',   b:'y 封',   eb:'N−y',   sem:[],           on:'',
    note:'初始状态：A 信箱有 <code>x</code> 封邮件（空 <code>M−x</code> 位），B 信箱有 <code>y</code> 封（空 <code>N−y</code> 位），0 &lt; x &lt; M、0 &lt; y &lt; N。A、B 循环：取邮件 → 回答并提出新问题 → 放入对方信箱。' },
  { a:'x 封',   ea:'M−x',   b:'y 封',   eb:'N−y',   sem:[0,1,2,3,4,5], on:'',
    note:'<b>定义 6 个信号量</b>：每个信箱一对"满/空"（<code>Full_A=x、Empty_A=M−x、Full_B=y、Empty_B=N−y</code>）＋一个互斥（<code>mutex_A=1、mutex_B=1</code>）。这是本题第 1 采分点。' },
  { a:'x 封',   ea:'M−x',   b:'y 封',   eb:'N−y',   sem:[0],          on:'A',
    note:'A 先 <code class="pv">P(Full_A)</code>：等 A 信箱有邮件（x &gt; 0 成立，通过）。<b>同步 P 必须放在互斥 P 之前</b>。' },
  { a:'x 封',   ea:'M−x',   b:'y 封',   eb:'N−y',   sem:[4],          on:'A',
    note:'A 再 <code class="pv">P(mutex_A)</code>：进入 A 信箱的临界区（取邮件要与其他访客互斥）。' },
  { a:'x−1 封', ea:'M−x+1', b:'y 封',   eb:'N−y',   sem:[4,1],        on:'A',
    note:'取出邮件：A 信箱减为 <code>x−1</code> 封。然后 <code class="pv">V(mutex_A)</code> 退出临界区、<code class="pv">V(Empty_A)</code> 空位加 1（<code>M−x+1</code>）。<b>取邮件 → V 空位；放邮件 → V 满量</b>，别配错。' },
  { a:'x−1 封', ea:'M−x+1', b:'y 封',   eb:'N−y',   sem:[],           on:'A',
    note:'回答问题并提出一个新问题——纯思考，不碰信箱，<b>不需要任何信号量</b>。' },
  { a:'x−1 封', ea:'M−x+1', b:'y 封',   eb:'N−y',   sem:[3],          on:'A',
    note:'A 要把新邮件放入 B 信箱：先 <code class="pv">P(Empty_B)</code> 等 B 信箱有空位（N−y &gt; 0 成立）。' },
  { a:'x−1 封', ea:'M−x+1', b:'y+1 封', eb:'N−y−1', sem:[5,2],        on:'A',
    note:'<code class="pv">P(mutex_B)</code> 进临界区 → 放入新邮件（B 变 <code>y+1</code>）→ <code class="pv">V(mutex_B)</code> 退出 → <code class="pv">V(Full_B)</code> 邮件数加 1。A 的循环到此完整。' },
  { a:'x−1 封', ea:'M−x+1', b:'y 封',   eb:'N−y',   sem:[2,5,3],      on:'B',
    note:'B 对称执行：<code class="pv">P(Full_B)</code> → <code class="pv">P(mutex_B)</code> → 取出邮件（B 回到 <code>y</code>）→ <code class="pv">V(mutex_B)</code> → <code class="pv">V(Empty_B)</code>。' },
  { a:'x 封',   ea:'M−x',   b:'y 封',   eb:'N−y',   sem:[1,4,0],      on:'B',
    note:'B 处理完：<code class="pv">P(Empty_A)</code> → <code class="pv">P(mutex_A)</code> → 放入 A（A 回到 <code>x</code>）→ <code class="pv">V(mutex_A)</code> → <code class="pv">V(Full_A)</code>——恰好回到初始状态，<code>while(TRUE)</code> 循环往复。' },
  { a:'x 封',   ea:'M−x',   b:'y 封',   eb:'N−y',   sem:[],           on:'',
    note:'<b>采分点提醒</b>：① 同步 P（Full/Empty）必须在互斥 P（mutex）之前，否则可能"抱着锁等资源"而死锁；② 每个信箱的取/放都包在 mutex 临界区内；③ 取出后 V 空位、放入后 V 满量。' },
  { a:'x 封',   ea:'M−x',   b:'y 封',   eb:'N−y',   sem:[0,1,2,3,4,5], on:'',
    note:'完整答案 = <b>6 个信号量定义与初值</b> ＋ <b>A、B 两个对称过程</b>。这就是本题（9 分）的完整采分框架。' }
];

var S = { mbA:null, mbB:null, chips:[] };

AW.init({
  title: '【2015-45】A、B 信箱辩论的信号量同步（9 分大题）',
  subtitle: 'A 信箱容量 <code>M</code> 初始 <code>x</code> 封 · B 信箱容量 <code>N</code> 初始 <code>y</code> 封 · 考点：生产者-消费者成对变体',
  counterLabel: '过程步',
  ribbonTitle: '关键步骤（✓ 已完成）',
  intro: '点击「▶ 播放」：先定义信号量，再跟 A、B 各走一轮 P/V，观察信箱邮件数与信号量的联动。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    var row = AW.el('div', '');
    row.style.cssText = 'display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px';

    S.mbA = AW.el('div', 'mb', '<h5>A 的信箱（容量 M）</h5><div class="cnt" id="cntA"></div><div class="emp" id="empA"></div>');
    S.mbB = AW.el('div', 'mb', '<h5>B 的信箱（容量 N）</h5><div class="cnt" id="cntB"></div><div class="emp" id="empB"></div>');
    row.appendChild(S.mbA);
    row.appendChild(S.mbB);
    inner.appendChild(row);

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>信号量</b>（琥珀色 = 本步正在操作）'));
    var semRow = AW.el('div', '');
    S.chips = SEMS.map(function(nm, i){
      var c = AW.el('span', 'sem', nm + ' <b>' + SEMV[i] + '</b>');
      semRow.appendChild(c);
      return c;
    });
    inner.appendChild(semRow);

    S.who = AW.el('div', 'aw-row-label', '');
    S.who.style.cssText = 'margin-top:10px;font-size:14px;font-weight:700';
    inner.appendChild(S.who);

    S.note = AW.el('div', 'aw-row-label', '');
    S.note.style.cssText = 'margin-top:4px;font-size:14px;color:#213e48;line-height:1.75';
    inner.appendChild(S.note);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    var st = ST[Math.min(i, ST.length - 1)];
    S.mbA.querySelector('#cntA').innerHTML = st.a;
    S.mbA.querySelector('#empA').innerHTML = '空位：' + st.ea;
    S.mbB.querySelector('#cntB').innerHTML = st.b;
    S.mbB.querySelector('#empB').innerHTML = '空位：' + st.eb;
    S.mbA.className = 'mb' + (st.on === 'A' ? ' on' : '');
    S.mbB.className = 'mb' + (st.on === 'B' ? ' on' : '');
    S.chips.forEach(function(c, k){
      c.className = 'sem' + (st.sem.indexOf(k) >= 0 ? ' on' : '');
    });
    S.who.innerHTML = st.on ? ('本轮执行者：<b style="color:#b45309">' + st.on + '</b>') : '观察初始状态与信号量设计';
    S.note.innerHTML = st.note;
  },

  snaps: [
    { cls:'shift', tag:'初始',     log:'A 信箱 x 封（空 M−x 位），B 信箱 y 封（空 N−y 位）', count:0 },
    { cls:'shift', tag:'定义信号量', log:'6 个信号量：Full_A=x、Empty_A=M−x、Full_B=y、Empty_B=N−y、mutex_A=1、mutex_B=1', count:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'A 取 ①',   log:'A：P(Full_A) 等 A 信箱有邮件（同步 P 在互斥 P 之前）', count:2 },
    { cls:'step',  tag:'A 取 ②',   log:'A：P(mutex_A) 进入 A 信箱临界区', count:3 },
    { cls:'ok',    tag:'A 取出',   log:'取邮件（A 变 x−1）→ V(mutex_A) → V(Empty_A) 空位加 1', count:4, ribbon:{k:2, ok:true} },
    { cls:'step',  tag:'A 思考',   log:'回答问题并提出新问题：纯计算，不需要信号量', count:5 },
    { cls:'step',  tag:'A 放 ①',   log:'A：P(Empty_B) 等 B 信箱有空位', count:6 },
    { cls:'ok',    tag:'A 放入',   log:'P(mutex_B) → 放入（B 变 y+1）→ V(mutex_B) → V(Full_B) —— A 一轮完成', count:7, ribbon:{k:3, ok:true} },
    { cls:'step',  tag:'B 取出',   log:'B：P(Full_B) → P(mutex_B) → 取邮件（B 回到 y）→ V(mutex_B) → V(Empty_B)', count:8, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'B 放入',   log:'B：P(Empty_A) → P(mutex_A) → 放入（A 回到 x）→ V(mutex_A) → V(Full_A) —— 回到初始，循环往复', count:9, ribbon:{k:5, ok:true} },
    { cls:'step',  tag:'采分点',   log:'同步 P 在互斥 P 之前（防抱锁死锁）；取出 V 空、放入 V 满；取/放都在 mutex 临界区内', count:10 },
    { cls:'done',  tag:'完成',     log:'完整答案 = 6 个信号量定义与初值 + A/B 两个对称过程', count:11, done:true },
  ],

  result: {
    big: '6 个信号量 + 两个对称过程',
    html: '<code>Full_A=x、Empty_A=M−x、Full_B=y、Empty_B=N−y、mutex_A=1、mutex_B=1</code>。<br>A：P(Full_A) → P(mutex_A) → 取邮件 → V(mutex_A) → V(Empty_A) → 思考 → P(Empty_B) → P(mutex_B) → 放邮件 → V(mutex_B) → V(Full_B)；B 完全对称。<br>记忆锚点：<b>一个信箱 = 一对"满/空" + 一个 mutex；同步 P 在互斥 P 之前；取出 V 空位、放入 V 满量</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
