<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015-47 综合大题：DHCP / ARP / 默认网关 三问推演</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 概念/推理链类动画（大题按问推演）：外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '盘点拓扑（答题前先把地址摆齐）',
    cls: 'key',
    body: '<p>静态配置：路由器内网口 <code>111.123.15.1/24</code>（MAC <code>00-a1-a1-a1-a1-a1</code>）、DHCP 服务器 <code>111.123.15.2/24</code>、WWW 服务器 <code>111.123.15.3/24</code>、主机 1 <code>111.123.15.4/24</code>；主机 2～N 走 DHCP 动态获取。整个内网是 <code>111.123.15.0/24</code>。</p>' },
  { title: '问 1 · DHCP 可分配的最大范围',
    cls: 'good',
    body: '<p>静态已占用 .1～.4；<code>.0</code> 是网络地址、<code>.255</code> 是广播地址，都不能分配 → 动态分配最大范围 <b>111.123.15.5 ～ 111.123.15.254</b>。</p>' },
  { title: '问 1 · DHCP Discover 的 IP 封装',
    cls: 'good',
    body: '<p>主机 2 刚开机<b>还没有 IP</b>：源 IP 只能填 <b>0.0.0.0</b>；也不知道 DHCP 服务器在哪 → 只能本网广播，目的 IP <b>255.255.255.255</b>。</p>' },
  { title: '问 2 · 第一个以太网帧（ARP 请求）',
    cls: 'key',
    body: '<p>发往 Internet 的分组下一跳是网关 <code>111.123.15.1</code>，但主机 2 的 ARP 表为空 → 第一个帧是 <b>ARP 请求广播帧</b>，目的 MAC = <b>FF-FF-FF-FF-FF-FF</b>。</p>' },
  { title: '问 2 · 承载 IP 分组的帧',
    cls: 'good',
    body: '<p>学到网关 MAC 后，真正携带 IP 分组的帧按「<b>下一跳</b>」封装：目的 MAC = <b>00-a1-a1-a1-a1-a1</b>（路由器内网接口）。注意：帧里目的 MAC 写网关，IP 分组头里的目的 IP 仍是 Internet 上的服务器。</p>' },
  { title: '问 3 · 主机 1 的配置核对',
    cls: 'key',
    body: '<p>掩码 <code>255.255.255.0</code> 与 /24 网络一致；但默认网关配成了 <code>111.123.15.2</code>——那是 <b>DHCP 服务器</b>，正确网关应是路由器内网口 <code>111.123.15.1</code>。</p>' },
  { title: '问 3 · 能访问谁？',
    cls: 'good',
    body: '<p>访问 WWW 服务器 <code>111.123.15.3</code>：与主机 1 同子网，直接交付、不走网关 → <b>能访问</b>。访问 Internet：跨网段必须经网关，分组被交给错误网关 .2（DHCP 服务器不转发）→ <b>不能访问</b>。</p>' },
  { title: '三问结论汇总',
    cls: 'good',
    body: '<p>① 地址池 <b>111.123.15.5～111.123.15.254</b>；Discover 源 <b>0.0.0.0</b>、目的 <b>255.255.255.255</b>。② 第一个帧（ARP 请求）目的 MAC <b>FF-FF-FF-FF-FF-FF</b>；载 IP 分组的帧目的 MAC <b>00-a1-a1-a1-a1-a1</b>。③ 能访问 WWW 服务器、<b>不能</b>访问 Internet（默认网关配错）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2015-47 综合大题：DHCP / ARP / 默认网关',
  subtitle: '考点：<code>IPv4</code> · DHCP 与 ARP · 按问逐问推演（9 分）',
  intro: '点击「▶ 播放」，按三问顺序逐步展开答题链。',
  snaps: snaps,
  result: {
    big: '三问答案齐了',
    html: '① 地址池 <b>111.123.15.5～254</b>，Discover：<b>0.0.0.0 → 255.255.255.255</b>；② ARP 请求帧 = 全 F 广播 <b>FF-FF-FF-FF-FF-FF</b>，载数据帧的目的 MAC = 网关 <b>00-a1-a1-a1-a1-a1</b>；③ 同网段可达 WWW 服务器，网关配错 → <b>不能</b>访问 Internet。<br>记忆锚点：Discover = 0.0.0.0 → 255.255.255.255；ARP 请求 = 全 F 广播；跨网段的帧永远封装「下一跳」的 MAC。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
