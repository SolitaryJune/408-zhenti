<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-05 森林的树的棵数 · 小森林数数演示</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .forest-svg{width:100%;max-width:680px;display:block;margin:0 auto;background:#f8fafc;
    border:1px solid #1b3a4b38;border-radius:12px}
  .forest-svg .fedge{stroke:#5a7d8c;stroke-width:2.5px;transition:opacity .4s}
  .forest-svg .fnode circle{fill:#1b3a4b;transition:fill .3s, opacity .4s}
  .forest-svg .fnode text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:14px;
    text-anchor:middle;dominant-baseline:central;fill:#fff;transition:fill .3s, opacity .4s}
  .forest-svg .hot .fnode circle{fill:#e07a2f}
  .forest-svg .hot .fedge{stroke:#e07a2f;stroke-width:4px}
  .forest-svg .dim-el{opacity:.3}
  .stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;justify-content:center}
  .stats .qchip{background:#5a7d8c26;color:#1b3a4b;border:1.5px solid #5a7d8c66;border-radius:999px;
    padding:4px 13px;font-weight:800;font-family:JetBrains Mono,Menlo,monospace;font-size:13.5px;transition:opacity .4s}
  .stats .qchip.hidden-el{opacity:0}
  .hformula{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 2016-05 森林中树的棵数（SVG 结构演示） ==================
 * 题：森林 F 有 15 条边、25 个结点，求包含树的个数。（答案 C = 10）
 * 演示：先在 3 棵树的小森林上逐棵验证"结点数 = 边数 + 1"，
 *       合账推广到"森林总结点 = 总边数 + 树数"，再代回题设求解。 */

var TREES = [
  { id:'T1',
    nodes:[ {id:'r1',x:150,y:70},{id:'t1a',x:85,y:170},{id:'t1b',x:215,y:170},{id:'t1c',x:215,y:255} ],
    edges:[ {a:'r1',b:'t1a'},{a:'r1',b:'t1b'},{a:'t1b',b:'t1c'} ] },
  { id:'T2',
    nodes:[ {id:'r2',x:390,y:70},{id:'t2d',x:455,y:170} ],
    edges:[ {a:'r2',b:'t2d'} ] },
  { id:'T3',
    nodes:[ {id:'r3',x:600,y:140} ],
    edges:[] },
];
var STAT_CHIPS = [
  { t:'T₁：结点 4 · 边 3', step:1 },
  { t:'T₂：结点 2 · 边 1', step:2 },
  { t:'T₃：结点 1 · 边 0', step:3 },
  { t:'合计 7 = 4 + 3', step:4 },
  { t:'题设 25 = 15 + t', step:5 },
];
var SNAPS = [
  { cls:'shift', tag:'小森林', count:0, hot:'T1',
    log:'森林 = 多棵互不相交的树的集合。关键恒等式：树里除根以外，每个结点都恰好对应一条来自父亲的边 → 一棵树的边数 = 结点数 − 1。先在 3 棵树的小森林上数一遍。',
    formula:'一棵树：边数 = 结点数 − 1' },
  { cls:'ok', tag:'数 T₁', count:1, hot:'T1', ribbon:{k:1, ok:true},
    log:'T₁（橙色）：4 个结点、3 条边 → 4 = 3 + 1 ✓。',
    formula:'T₁：结点 4 = 边 3 + 1' },
  { cls:'ok', tag:'数 T₂', count:2, hot:'T2', ribbon:{k:2, ok:true},
    log:'T₂：2 个结点、1 条边 → 2 = 1 + 1 ✓。',
    formula:'T₂：结点 2 = 边 1 + 1' },
  { cls:'ok', tag:'数 T₃', count:3, hot:'T3', ribbon:{k:3, ok:true},
    log:'T₃ 只有 1 个结点、0 条边 —— 单结点也是一棵树：1 = 0 + 1 ✓。数树的棵数时最容易漏掉它。',
    formula:'T₃：结点 1 = 边 0 + 1' },
  { cls:'step', tag:'合账推广', count:4, hot:null, ribbon:{k:4, ok:true},
    log:'小森林总账：结点 4+2+1 = 7，边 3+1+0 = 4，树 3 棵 → 7 = 4 + 3。推广到任何森林：总结点数 = 总边数 + 树的棵数。',
    formula:'森林：总结点数 = 总边数 + 树数' },
  { cls:'ok', tag:'代入题设', count:5, hot:null, ribbon:{k:5, ok:true},
    log:'题设森林 F：结点 25、边 15 → 25 = 15 + t → t = 25 − 15 = 10。',
    formula:'25 = 15 + t　→　t = 10' },
  { cls:'done', tag:'完成', count:6, hot:null, done:true,
    log:'树的棵数 = 结点数 − 边数 = 25 − 15 = 10，选 C。校验：5 棵单结点树 + 5 棵 4 结点树 → 结点 5+20 = 25 ✓、边 0+15 = 15 ✓、共 10 棵 ✓。',
    formula:'树的棵数 = 25 − 15 = 10（选 C）' },
];

var svg, chipEls = [], formulaBox;
function build(stage){
  stage.innerHTML = '';
  var NS = 'http://www.w3.org/2000/svg';
  svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 680 300');
  svg.setAttribute('class', 'forest-svg');
  TREES.forEach(function(tr){
    tr.edges.forEach(function(e){
      var A = null, B = null;
      tr.nodes.forEach(function(n){ if(n.id === e.a) A = n; if(n.id === e.b) B = n; });
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y);
      ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
      ln.setAttribute('class', 'fedge');
      ln.dataset.tree = tr.id;
      svg.appendChild(ln);
    });
    tr.nodes.forEach(function(n){
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'fnode');
      g.dataset.tree = tr.id;
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 19);
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', n.x); t.setAttribute('y', n.y);
      t.textContent = '';
      g.appendChild(c); g.appendChild(t);
      svg.appendChild(g);
    });
    var lab = document.createElementNS(NS, 'text');
    lab.setAttribute('x', tr.nodes[0].x);
    lab.setAttribute('y', 292);
    lab.setAttribute('text-anchor', 'middle');
    lab.setAttribute('font-size', '14');
    lab.setAttribute('font-weight', '700');
    lab.setAttribute('fill', '#334155');
    lab.textContent = tr.id === 'T1' ? 'T₁（4 结点 / 3 边）' : tr.id === 'T2' ? 'T₂（2 结点 / 1 边）' : 'T₃（单结点）';
    lab.dataset.tree = tr.id;
    svg.appendChild(lab);
  });
  stage.appendChild(svg);

  var stats = AW.el('div', 'stats');
  STAT_CHIPS.forEach(function(sc){
    var ch = AW.el('span', 'qchip hidden-el', sc.t);
    ch.dataset.step = sc.step;
    stats.appendChild(ch);
    chipEls.push(ch);
  });
  stage.appendChild(stats);
  formulaBox = AW.el('div', 'hformula');
  stage.appendChild(formulaBox);
}

function render(stage, sn){
  /* 按树整体 hot / dim：结点、边用类切换，文字标签用透明度 */
  TREES.forEach(function(tr){
    var hot = sn.hot === tr.id;
    var dim = sn.hot && !hot;
    [].forEach.call(svg.querySelectorAll('[data-tree="' + tr.id + '"]'), function(elm){
      if(elm.tagName === 'line'){
        elm.setAttribute('class', 'fedge' + (hot ? ' hot' : '') + (dim ? ' dim-el' : ''));
      } else if(elm.tagName === 'g'){
        elm.setAttribute('class', 'fnode' + (hot ? ' hot' : '') + (dim ? ' dim-el' : ''));
      } else {
        elm.setAttribute('opacity', dim ? '0.3' : '1');
      }
    });
  });
  chipEls.forEach(function(c){
    c.classList.toggle('hidden-el', +c.dataset.step > sn.count);
  });
  formulaBox.innerHTML = sn.formula || '';
}

AW.init({
  title: '2016-05 · 森林 F 有 15 条边、25 个结点，包含几棵树？',
  subtitle: '先在小森林上验证「结点数 = 边数 + 1」，再合账推广到整片森林',
  counterLabel: '推进步',
  ribbonTitle: '数树进度（✓ 完成）',
  intro: '点击「▶ 播放」：逐棵数小森林 → 合账推广 → 代回题设求解。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: 'C · 10 棵树',
    html: '每棵树 边数 = 结点数 − 1 → 森林里 <b>总结点数 = 总边数 + 树的棵数</b>。t = 25 − 15 = <b>10</b>。' +
      '记忆锚点：<code>树数 = 结点数 − 边数</code>；单结点树（0 条边）也是树，别漏数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
