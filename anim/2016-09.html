<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-09 跳跃查找与折半查找的比较次数</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域 ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n + '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>本题算法是<b>步长为 3 的跳跃查找</b>；n 大于 1000。折半查找约需 <code>log2(n)</code> ≈ <b>10 次左右</b>比较，且与 x 的位置关系不大。要找“可能更少”的情形，就看本题算法的比较次数何时变小。</p>' },
  { title: '拆解本题算法的次数构成',
    cls: 'good',
    body: '<p><code>while (k&lt;n 且 A[k]&lt;x) k+=3;</code> 每轮比较一次；结束后最多再比较 <code>A[k]</code>、<code>A[k-1]</code>、<code>A[k-2]</code> 三次。设 while 跑了 t 轮，总数 ≈ <code>t + 3</code>。<b>t 由 x 的位置决定：x 越靠前 t 越小。</b></p>' },
  { title: 'B：x 接近开头 → 更少',
    cls: 'good',
    body: '<p>x 接近数组开头：while 只跑 0~1 轮，总数约 <code>1~5</code> 次，小于折半的约 10 次 → <b>可能更少，选 B ✓</b></p>' },
  { title: 'C、D：靠后或居中 → 更多',
    cls: 'bad',
    body: '<p>x 在中间：t ≈ n/6 ≈ 170 以上；x 接近结尾：t ≈ n/3 ≈ 340 以上 → 总次数远超折半的约 10 次 ✗。</p>' },
  { title: 'A：x 不在数组中 → 不占便宜',
    cls: 'bad',
    body: '<p>若 x 比所有元素都大，while 要一路加 3 跑到底（约 n/3 轮），总次数约 n/3+3，反而更多 ✗。“不在数组中”并不让算法获得结构性优势。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案 <b>B</b>。记忆锚点：跳跃查找“<b>靠前快、靠后慢</b>”；折半查找“对谁都约 log2n 次”。循环条件里每次 <code>A[k] 与 x</code> 的比较都要计入。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2016·步长为 3 的跳跃查找：何时可能比折半更少次？',
  subtitle: '升序数组 n 大于 1000 · 折半 ≈ log2(n) 次 · 跳跃查找 ≈ while 轮数 t + 3',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（x 接近数组开头处）',
    html: 'while 只跑 0~1 轮 → 总比较约 1~5 次，少于折半的约 10 次。x 在中后段要跑 n/6 ~ n/3 轮（上百次）；x 比所有元素大时同样要多跑 n/3 轮。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
