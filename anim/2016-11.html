<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-11 10TB 数据文件的排序方法</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域 ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n + '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：10TB 意味着什么',
    cls: 'key',
    body: '<p>内存容量通常只有 GB 量级，10TB 的数据文件<b>不可能整体装入内存</b>——凡要求全部数据驻留内存的排序方法都直接出局。考点指向<b>外部排序</b>。</p>' },
  { title: '排除内部排序 A/B/C',
    cls: 'bad',
    body: '<p>希尔排序、堆排序、快速排序都是典型的<b>内部排序</b>：过程中要反复<b>随机访问</b>全部记录，前提是数据在内存。对 10TB 文件它们无从下手 ✗。</p>' },
  { title: '归并排序的天然优势',
    cls: 'good',
    body: '<p>归并只需<b>顺序读取</b>两个有序段并合并——正好扬外存之长（顺序 I/O 快）、避其短（随机访问慢），是外部排序的标准骨架。</p>' },
  { title: '外部排序两步走',
    cls: 'good',
    body: '<p>① <b>生成初始归并段</b>：分批读入能装进内存的一段数据，用任意内部排序方法排好序后写回外存；② <b>多路归并</b>：逐趟把多个有序段归并成更大的有序段，直到整个文件有序。</p>' },
  { title: '别把“段内排序”当整体方法',
    cls: 'step',
    body: '<p>生成初始归并段时，段内部用什么内部排序都可以（快排也行）——但<b>整体框架</b>必须是归并。题目问的是对 10TB 文件的整体排序方法。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案 <b>D（归并排序）</b>。记忆锚点：数据装不下内存 → 外部排序 → 归并思想（生成归并段 + 多路归并）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2016·对 10TB 的数据文件排序，用什么方法？',
  subtitle: '考点：内部排序与外部排序的分界 · 外部排序的标准做法',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D：归并排序',
    html: '10TB 装不进内存 → 必须外部排序；外排靠<b>顺序 I/O</b> 吃饭，归并恰好只需顺序读两个有序段 → “生成归并段 + 多路归并”是标准答案。希尔/堆/快排都是内排，出局。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
