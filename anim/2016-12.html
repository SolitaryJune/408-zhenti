<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-12 动画 · 谁把高级语言源程序变成目标代码文件</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/推理类：汇编、链接、编译、解释四个角色逐项对照
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：两个限定条件',
    cls: 'key',
    body: '<p>题干限定：<b>输入 = 高级语言源程序</b>，<b>输出 = 机器级目标代码文件</b>。四个选项是翻译链条上的四个角色，逐一核对「输入是什么、输出是什么」。</p>' },
  { title: '对照 A 汇编程序',
    cls: 'bad',
    body: '<p>汇编程序把<b>汇编语言（符号助记符）源程序</b>翻译成机器级目标代码。它的输入是 <code>ADD R1,R2</code> 这类助记符程序，<b>不是高级语言</b> → 排除。✗</p>' },
  { title: '对照 B 链接程序',
    cls: 'bad',
    body: '<p>链接程序把<b>多个目标代码文件和库</b>拼装成可执行文件。它的输入已经是目标代码，工作在编译<b>之后</b>，不负责「源程序 → 目标代码」 → 排除。✗</p>' },
  { title: '对照 C 编译程序',
    cls: 'good',
    body: '<p>编译程序把<b>高级语言源程序</b>整体翻译成<b>机器级目标代码文件</b>（如 .o / .obj），两个限定条件全部满足 → <b>正确</b>。✓</p>' },
  { title: '对照 D 解释程序',
    cls: 'bad',
    body: '<p>解释程序对高级语言源程序<b>逐句翻译并立即执行，不生成目标代码文件</b>。题干要求产出「目标代码文件」 → 排除。✗</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C（编译程序）</b>。完整链条：<code>高级语言源程序 --编译--> 目标代码文件 --链接--> 可执行文件</code>；汇编程序处理的是汇编语言源程序。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '谁把高级语言源程序变成机器级目标代码文件？',
  subtitle: '考点：计算机系统层次结构 · 翻译程序三角色（汇编 / 编译 / 解释）+ 链接 · 逐项对照（2016-12）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 符合 / ✗ 排除）',
  intro: '点击「▶ 播放」逐个角色对照输入与输出。',
  snaps: snaps,
  result: {
    big: '答案 C（编译程序）',
    html: '记忆锚点：<b>汇编 = 助记符 → 机器码；编译 = 高级语言 → 目标代码文件；链接 = 目标文件 → 可执行文件；解释 = 不落盘、边翻译边执行</b>。题干两个限定（高级语言输入 + 目标代码文件输出）只有编译程序同时满足。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
