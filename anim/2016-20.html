<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-20 动画 · 单周期处理器四特征辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     概念/推理类：单周期处理器的四个叙述逐项判对错
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：单周期的定义',
    cls: 'key',
    body: '<p><b>单周期处理器 = 每条指令在一个时钟周期内完成</b>。取指、读寄存器、运算、访存、写回的全部传送都要挤进同一个周期。题干要求选出<b>错误</b>的叙述。</p>' },
  { title: 'A 单总线结构？——错',
    cls: 'bad',
    body: '<p>单总线同一时刻<b>只能一个部件发送、一个部件接收</b>；而单周期内取指、读寄存器、ALU 运算必须<b>并行</b>进行，一次一传的单总线排不进一个周期 → 单周期必须用<b>多总线/专用通路</b>。<b>叙述错误</b> → 这就是答案。✗</p>' },
  { title: 'B 时钟频率较低——对',
    cls: 'good',
    body: '<p>时钟周期必须容纳<b>最慢指令</b>的全部操作，周期长 → 主频必然低。CPI = 1 是用「拉长周期」换来的。叙述正确。✓</p>' },
  { title: 'C 控制信号不变——对',
    cls: 'good',
    body: '<p>一个周期内，控制信号由指令译码经<b>组合逻辑</b>一次性产生，直到周期结束保持不变（不像多周期那样分拍变化）。叙述正确。✓</p>' },
  { title: 'D 每条指令 CPI 为 1——对',
    cls: 'good',
    body: '<p>这是单周期处理器的定义本身：一条指令恰好占一个时钟周期。叙述正确。✓</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>单周期四特征——CPI=1、周期长主频低、控制信号全程不变、数据通路必须支持并行传送（不能单总线）</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2016-20 单周期处理器的特征辨析',
  subtitle: '考点：单周期处理器 · 数据通路结构 · CPI · 控制信号 · 时钟频率（选错误叙述）',
  counterLabel: '推理进度',
  ribbonTitle: '逐项判定（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」逐项核对四个叙述。',
  snaps: snaps,
  result: {
    big: '答案 A（单总线说法错误）',
    html: '记忆锚点：单总线<b>一次只能传一个数据</b>，无法在一个周期内并行完成指令所需的多个传送 → 单周期不能采用单总线结构。<br>其余三项正确：<b>CPI=1（定义）、频率低（周期容纳最慢指令）、控制信号不变（组合逻辑一次产生）</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
