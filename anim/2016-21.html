<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-21 动画 · 总线设计四说法辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     概念/推理类：并行/串行、复用、突发、分离事务逐项判定
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：选"错误"的那一个',
    cls: 'key',
    body: '<p>四个说法涉及总线设计的四个知识点：<b>串/并行</b>、<b>信号线复用</b>、<b>突发传输</b>、<b>分离事务</b>。B、C、D 是教材原话式优化手段，A 是"想当然"的说法，需重点推敲。</p>' },
  { title: 'A 并行一定比串行快？——错',
    cls: 'bad',
    body: '<p>并行总线多根数据线<b>线间串扰与时钟偏移（skew）</b>随频率升高急剧恶化，频率提不上去；现代高速总线（PCIe、SATA、USB）普遍改用<b>串行</b>、靠高频率取胜，速度反超并行。<b>说法错误</b> → 这就是答案。✗</p>' },
  { title: 'B 信号线复用——对',
    cls: 'good',
    body: '<p>地址线/数据线<b>分时复用</b>同一组信号线，先传地址再传数据 → 减少信号线数量与芯片引脚。说法正确。✓</p>' },
  { title: 'C 突发（猝发）传输——对',
    cls: 'good',
    body: '<p><b>一次寻址后连续传送多个数据</b>，地址只需给一次 → 单位时间传输的数据更多，提高数据传输率。说法正确。✓</p>' },
  { title: 'D 分离事务通信——对',
    cls: 'good',
    body: '<p>主设备发出请求后<b>释放总线</b>，从设备准备好再重新申请总线传数据；等待期间总线可供其他主设备使用 → 提高总线利用率。说法正确。✓</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>并行总线受串扰与偏移限制、频率上不去</b>；"并行永远比串行快"在高速时代不成立——高速总线几乎全是串行。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2016-21 总线设计四个说法的对错辨析',
  subtitle: '考点：串行/并行总线 · 信号线复用 · 突发传输 · 分离事务（选错误叙述）',
  counterLabel: '推理进度',
  ribbonTitle: '逐项判定（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」逐项核对四个说法。',
  snaps: snaps,
  result: {
    big: '答案 A（并行更快说法错误）',
    html: '记忆锚点：<b>并行总线的线间串扰与时钟偏移限制了工作频率</b>，现代高速总线（PCIe/USB/SATA）都用串行；<br>B 复用省信号线、C 突发省地址阶段提速率、D 分离事务让总线等待期不空转——三者都是正确表述。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
