<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-25 死锁环最少进程数</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>3 个临界资源各 1 个：p1 要 <code>R1+R2</code>，p2 要 <code>R2+R3</code>，p3 要 <code>R1+R3</code>，p4 只要 <code>R2</code>。问：死锁进程数<b>至少</b>几个？死锁 = 占有资源 + 等待 + <b>循环等待环</b>。</p>' },
  { title: '先排除 p4', cls: 'bad',
    body: '<p>p4 只申请 <b>1 个</b>资源 R2：拿到就不等任何东西；拿不到只是在等 R2、自己手里什么也没占。它只能当等待链的<b>终点</b>，进不了环 → 死锁者只能在 p1、p2、p3 中。</p>' },
  { title: '两个进程成不了环', cls: 'bad',
    body: '<p>两两检查：p1 等 R2、p2 等 R3、p3 等 R1。要成 2 元环需「互等对方占的资源」：p1 等 R2 但对方不等 R1；p2 等 R3 但 p3 不等 R2；p3 等 R1 但 p1 不等 R3。本题需求下<b>不存在 2 元环</b>。</p>' },
  { title: '三个进程恰好成环', cls: 'good',
    body: '<p>p1 占 R1 等 R2，p2 占 R2 等 R3，p3 占 R3 等 R1：<code>p1 → p2 → p3 → p1</code>，循环等待成立，3 个进程全部死锁。这 3 个资源分给这 3 个进程、每个再等下一个，请求完全可行。</p>' },
  { title: '逐项排除', cls: 'step',
    body: '<p>A（1 个）：死锁至少 2 个进程，错。B（2 个）：本题需求矩阵下 2 元环不存在，错。D（4 个）：p4 无资源纠葛、不必卷入，"至少"不要求全部，错。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>死锁进程数至少 <b>3</b>，答案选 <b>C</b>。记忆点：先排除"单资源申请者"，再从 2 元环试起，逐级放大到可行的最小环。</p>' }
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '死锁环最少要几个进程',
  subtitle: '资源 R1/R2/R3 各 1 个 · 四个进程的申请矩阵 · 求最小死锁环',
  intro: '点击「▶ 播放」，一步步缩小死锁进程的范围。',
  snaps: snaps,
  result: {
    big: '至少 3 个（选 C）',
    html: '推理链：<b>p4 单资源申请 → 进不了环</b>；<b>三对两两组合都不互等 → 无 2 元环</b>；<b>p1 占 R1 等 R2、p2 占 R2 等 R3、p3 占 R3 等 R1 → 三元环成立</b>。干扰项 B 来自"默认最小环是 2"，但它忽略了本题的具体需求矩阵。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
