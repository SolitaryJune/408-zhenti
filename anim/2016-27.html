<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-27 TSL 忙等式互斥辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>伪代码核心：<code>while (TSL(&amp;lock));</code>——TSL 一条指令内<b>原子</b>完成「读 lock 旧值 + 置 lock=TRUE」。读回 TRUE（有人持锁）就<b>继续空转</b>，读回 FALSE 才进临界区。考点：这是<b>忙等式（自旋）互斥</b>。</p>' },
  { title: '逐项 A：错', cls: 'bad',
    body: '<p>「退出临界区的进程负责唤醒阻塞态进程」——<b>错</b>。这套机制<b>没有阻塞队列</b>：等待者从不进入阻塞态，退出者只做 <code>lock = FALSE</code>，没有人需要被"唤醒"。</p>' },
  { title: '逐项 B：对', cls: 'good',
    body: '<p>「等待进入临界区的进程不会主动放弃 CPU」——<b>对</b>。等待进程在 while 里反复执行 TSL 测试，是典型的<b>忙等（自旋）</b>：CPU 一直被它占着，不主动让出。</p>' },
  { title: '逐项 C：错', cls: 'bad',
    body: '<p>「满足让权等待」——<b>错</b>。"让权等待"要求进不了临界区就<b>释放 CPU 去阻塞</b>；忙等恰恰是抱着 CPU 空转，直接违背这条同步准则。</p>' },
  { title: '逐项 D：错', cls: 'bad',
    body: '<p>「while(TSL(&amp;lock)) 应在关中断状态下执行」——<b>错</b>。TSL 本身就是一条<b>硬件原子指令</b>（如通过锁内存总线实现），原子性由硬件保证，不需要再关中断。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆点：TSL 互斥 = <b>忙等自旋</b>——不放弃 CPU（B 对）、无阻塞无唤醒（A 错）、违背让权等待（C 错）、原子性靠硬件不靠关中断（D 错）。</p>' }
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: 'TSL 实现互斥：忙等还是阻塞？',
  subtitle: '考点：<code>TSL 原子指令</code> · 自旋等待 · 与让权等待准则的关系',
  intro: '点击「▶ 播放」，先读懂伪代码再逐项辨析。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：TSL 是<b>忙等（自旋）互斥</b>——等待进程<b>占着 CPU 反复测试、不主动放弃</b>。它与信号量机制的区别：没有阻塞队列、退出者不唤醒任何人（A 错）、违背让权等待（C 错）；TSL 的原子性由硬件单条指令保证，无需关中断（D 错）。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
