<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-30 线程并发：谁需要互斥</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>P1 内 Thread1：<code>a = 1; x += 1;</code>，Thread2：<code>a = 2; x += 2;</code>；P2 内 Thread3：<code>a = x; x += 3;</code>，Thread4：<code>b = x; x += 4;</code>。判断依据：并发双方对<b>同一个变量</b>有<b>写</b>且可能交叠才需互斥。</p>' },
  { title: '关键前提：变量归属', cls: 'key',
    body: '<p><code>a</code>、<code>b</code> 是各线程函数里声明的<b>局部变量</b>（线程私有）。<code>x</code>：P1 与 P2 是<b>两个进程</b>，地址空间独立——P1 的 x 和 P2 的 x 是<b>两份不同变量</b>；真正共享的 x 只存在于<b>同一进程的两个线程间</b>。</p>' },
  { title: '逐项 A：不需要', cls: 'bad',
    body: '<p>「a = 1 与 a = 2」——两个线程各自的<b>局部变量 a</b>，各写各的，互不可见 → 不需要互斥。</p>' },
  { title: '逐项 B：不需要', cls: 'bad',
    body: '<p>「a = x 与 b = x」——同属 P2 的 Thread3 与 Thread4，都在<b>读</b> x；读-读不冲突 → 不需要互斥。</p>' },
  { title: '逐项 C：需要！', cls: 'good',
    body: '<p>「x += 1 与 x += 2」——P1 内两个线程对<b>同一个 x</b> 并发执行"读-改-写"，可能丢更新（如都基于旧值 0，结果得 2 而不是 3）→ <b>必须互斥</b>。</p>' },
  { title: '逐项 D：不需要', cls: 'bad',
    body: '<p>「x += 1 与 x += 3」——分属 <b>P1 和 P2 两个进程</b>，动的是各自地址空间里两份不同的 x，互不影响 → 不需要互斥。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆点：先问<b>变量归谁</b>（局部变量私有、跨进程隔离），再问<b>有无写冲突</b>（读-读不用互斥）。</p>' }
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '线程并发：哪些操作需要互斥',
  subtitle: 'P1（Thread1/Thread2）· P2（Thread3/Thread4）· 判据：同一变量 + 写冲突',
  intro: '点击「▶ 播放」，先理清变量归属再逐项判断。',
  snaps: snaps,
  result: {
    big: '答案 C（x += 1 与 x += 2）',
    html: '两个思维关卡：<b>① 变量归谁</b>——a/b 是局部变量、跨进程的 x 互不可见（A、D 直接排除）；<b>② 有无写冲突</b>——读 x 与读 x 不冲突（B 排除），只有同一进程内对 x 的两个"读-改-写"（C）必须互斥。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
