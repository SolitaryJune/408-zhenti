<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-31 SPOOLing 技术辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>SPOOLing（假脱机）= 磁盘上的<b>输入井/输出井</b> + 系统的<b>假脱机输入/输出进程</b>，把一台独占设备改造成可共享的"虚拟设备"。本题要找出<b>错误</b>的一项。</p>' },
  { title: '逐项 A：正确', cls: 'good',
    body: '<p>「需要外存的支持」——<b>对</b>。输入井/输出井就是磁盘上的外存区域，没有外存就无法为多作业排队缓冲。</p>' },
  { title: '逐项 B：正确', cls: 'good',
    body: '<p>「需要多道程序设计技术的支持」——<b>对</b>。井 + 假脱机进程 + 多道作业并发运行，正是多道程序设计技术的典型应用。</p>' },
  { title: '逐项 C：正确', cls: 'good',
    body: '<p>「可以让多个作业共享一台独占设备」——<b>对</b>。多个作业的输出在输出井排队，由系统依次送至打印机，宏观上多作业<b>共享一台独占设备</b>——这正是 SPOOLing 的目的。</p>' },
  { title: '逐项 D：错误（答案）', cls: 'good',
    body: '<p>「由用户作业控制设备与输入/输出井之间的数据传送」——<b>错</b>。设备与井之间的传送由<b>系统假脱机进程</b>负责；用户作业只能请求 I/O、在井里排队，<b>不能直接操纵设备</b>。本题选 <b>D</b>。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案 <b>D</b>。记忆点：两段通路要分清——<b>作业 ↔ 井</b>（用户可见的请求与排队）与<b>设备 ↔ 井</b>（系统假脱机进程负责的实际传送）。</p>' }
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: 'SPOOLing 技术：组成与分工',
  subtitle: '输入井/输出井 · 假脱机进程 · 独占设备改共享 · 找出错误项',
  intro: '点击「▶ 播放」，逐项核对四个说法。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: 'SPOOLing 三件套：<b>外存井（A 对）</b>、<b>多道程序技术（B 对）</b>、<b>共享独占设备（C 对）</b>。唯一错误的是 D——设备与井之间的数据传送由<b>系统假脱机进程</b>控制，SPOOLing 的意义恰恰是把设备管理权收归系统，用户作业被隔离在设备之外。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
