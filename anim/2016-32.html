<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-32 管程概念辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>管程 = <b>共享数据结构 + 对它的操作过程 + 初始化代码</b> 封装成的模块；互斥由<b>编译器</b>自动保证；另有<b>条件变量</b> wait/signal 实现同步。本题要找出<b>错误</b>的一项。</p>' },
  { title: '逐项 A：错误（答案）', cls: 'good',
    body: '<p>「管程只能用于实现进程的互斥」——<b>错</b>。管程<b>天然互斥</b>进入，还能通过<b>条件变量的 wait/signal 实现同步</b>（阻塞与唤醒）。"只能用于互斥"以偏概全，本题选 <b>A</b>。</p>' },
  { title: '逐项 B：正确', cls: 'good',
    body: '<p>「管程是由编程语言支持的进程同步机制」——<b>对</b>。管程是<b>语言级</b>机制，进入/退出管程的互斥代码由编译器自动生成（如 Java 的 synchronized），不靠程序员手工 PV。</p>' },
  { title: '逐项 C：正确', cls: 'good',
    body: '<p>「任何时候只能有一个进程在管程中执行」——<b>对</b>。同一时刻至多一个进程在管程内运行，这正是管程互斥性的体现。</p>' },
  { title: '逐项 D：正确', cls: 'good',
    body: '<p>「管程中定义的变量只能被管程内的过程访问」——<b>对</b>。管程内的共享数据被封装，外界只能通过调用管程内的过程间接操作。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案 <b>A</b>。记忆点：管程 = <b>互斥 + 同步</b> 双功能、<b>语言级</b>保证、单进程在管程内执行、数据只经管程内过程访问。</p>' }
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '管程：四个说法逐个辨',
  subtitle: '封装 + 语言级互斥 + 条件变量同步 · 找出错误项',
  intro: '点击「▶ 播放」，逐项核对四个说法。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: 'B、C、D 都是管程的正确属性：<b>语言级机制</b>、<b>单进程在管程内执行</b>、<b>数据只被管程内过程访问</b>。A 错在"只能"——管程还有<b>条件变量 wait/signal 的同步功能</b>，不只是互斥。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
