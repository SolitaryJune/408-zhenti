<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-36 动画 · 争用期约束下 H3 与 H4 的最远距离</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/计算推理类：争用期 5.12μs → 扣两次 Hub 延时 → 205m
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：冲突检测的约束',
    cls: 'key',
    body: '<p>H3、H4 都接在 <b>Hub（100Base-T，速率 100Mb/s）</b>上，共用一个冲突域。以太网规定<b>争用期 = 512 比特时间</b>：为能在发完帧之前检测到冲突，端到端<b>往返</b>时延（含设备延时）不得超过争用期。</p>' },
  { title: '第一步：算出争用期',
    cls: 'step',
    body: '<p>争用期 = <code>512bit ÷ 100Mb/s = 5.12μs</code>。这是往返时延的总预算。</p>' },
  { title: '第二步：扣除 Hub 的再生延时',
    cls: 'step',
    body: '<p>信号 H3 → Hub → H4 过 <b>1 次</b> Hub，再生延时 <code>1.535μs</code>；冲突信号从 H4 经 Hub 回 H3 再过 <b>1 次</b>。往返共过 <b>2 次</b> Hub：<code>2 × 1.535μs = 3.07μs</code>。</p>' },
  { title: '第三步：剩余给传播时延',
    cls: 'good',
    body: '<p>往返传播时延 ≤ <code>5.12 − 3.07 = 2.05μs</code>，单程 <code>1.025μs</code>。</p>' },
  { title: '第四步：换算成距离',
    cls: 'good',
    body: '<p>信号传播速度 <code>200m/μs</code>，最远距离 = <code>200m/μs × 1.025μs = 205m</code>。</p>' },
  { title: '对照四个选项',
    cls: 'step',
    body: '<p>A（200m）：单程粗略取整 1μs ✗；<b>B（205m）✓</b>；C（359m）：只扣了一次 1.535μs，忘了往返过两次 Hub ✗；D（512m）：按 5.12μs÷2×200 直接算，没扣 Hub 延时 ✗。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B（205m）</b>。约束式：<code>2×(d ÷ 200m/μs) + 2×1.535μs ≤ 5.12μs</code> → d = 205m。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'H3 与 H4 理论上可以相距的最远距离是多少？',
  subtitle: '考点：介质访问控制 CSMA/CD · 争用期 512 比特时间 · Hub 再生延时（2016-36）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 正确 / ✗ 易错点）',
  intro: '点击「▶ 播放」逐步推演最远距离。',
  snaps: snaps,
  result: {
    big: '答案 B（205m）',
    html: '计算链：<b>争用期 512bit ÷ 100Mb/s = 5.12μs → 往返过 Hub 两次共 3.07μs → 剩 2.05μs 往返传播 → 单程 1.025μs × 200m/μs = 205m</b>。干扰项 C 是只扣一次 Hub 延时（359m），D 是完全没扣（512m）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
