<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-37 动画 · RIP 收到坏消息后的一次更新</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     算法/过程类：RIP 路由更新——R3 通告不可达，R2 改选经 R1
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var nodeEls = {};
var msgEl = null;

/* 两行路线卡片：label=路线说明，badge=距离值；state 决定配色 */
var ST = {
  cur:  { bg:'#1b3a4b14', bd:'#1b3a4b', fg:'#1b3a4b' },  /* 当前使用的路由 */
  cand: { bg:'#f8edcb', bd:'#5a7d8c66', fg:'#213e48' },  /* 备用路线 */
  bad:  { bg:'#e6394620', bd:'#e63946', fg:'#a02830' },  /* 不可达 */
  good: { bg:'#2f9e4424', bd:'#2f9e44', fg:'#1e4d33' },  /* 被选中 */
  dim:  { bg:'#f8edcb', bd:'#1b3a4b26', fg:'#b9cbd0' }   /* 弃用 */
};

function build(stage){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var inner = AW.el('div', '');
  inner.style.cssText = 'width:660px;';

  var title = AW.el('div', 'aw-row-label', '<b>R2 到 201.1.2.0/25 的两条可能路线</b>（RIP：16 = 不可达）');
  inner.appendChild(title);

  function row(id, label){
    var r = AW.el('div', '');
    r.style.cssText = 'display:flex;align-items:stretch;gap:12px;margin:10px 0;';
    var lab = AW.el('div', '');
    lab.style.cssText = 'flex:0 0 auto;width:280px;border:2px solid #5a7d8c66;border-radius:12px;' +
      'background:#fff;padding:10px 14px;font-size:13.5px;font-weight:700;color:#1b3a4b;transition:all .25s;';
    lab.innerHTML = label;
    var bd = AW.el('div', '');
    bd.style.cssText = 'flex:0 0 auto;min-width:150px;border:2px solid #5a7d8c66;border-radius:12px;' +
      'padding:10px 14px;font-size:15px;font-weight:800;font-family:Menlo,Consolas,monospace;color:#1b3a4b;transition:all .25s;';
    nodeEls[id] = { lab: lab, badge: bd };
    r.appendChild(lab);
    r.appendChild(bd);
    inner.appendChild(r);
  }
  row('R3', '经 R3（R2 当前下一跳）<span style="display:block;font-size:11px;font-weight:400;color:#586e72;">R3 直连 201.1.2.0/25，距离 1</span>');
  row('R1', '经 R1（备用下一跳）<span style="display:block;font-size:11px;font-weight:400;color:#586e72;">R1 经 R3 到该网络距离 2</span>');

  msgEl = AW.el('div', '');
  msgEl.style.cssText = 'margin-top:12px;width:100%;background:#f8edcb;border:1px solid #1b3a4b26;' +
    'border-radius:10px;padding:9px 12px;font-size:13px;color:#213e48;min-height:40px;';
  inner.appendChild(msgEl);

  wrap.appendChild(inner);
  stage.appendChild(wrap);
}

function setRow(id, st, badgeText){
  var o = nodeEls[id], c = ST[st];
  o.lab.style.background = c.bg;
  o.lab.style.borderColor = c.bd;
  o.badge.style.background = c.bg;
  o.badge.style.borderColor = c.bd;
  o.badge.style.color = c.fg;
  o.badge.innerHTML = badgeText;
}

function render(stage, sn){
  setRow('R3', sn.r3st || 'cand', sn.r3txt || '距离 2');
  setRow('R1', sn.r1st || 'cand', sn.r1txt || '距离 3（备用）');
  msgEl.innerHTML = sn.msg || '';
}

var snaps = [
  { cls:'step', tag:'初始（已收敛）', count:0, r3st:'cur', r3txt:'距离 2（当前路由）',
    msg:'收敛后：R3 直连 201.1.2.0/25（距离 1）→ R1 经 R3 距离 2 → R2 经 R3 距离 2。',
    log:'初始状态：R2 的当前路由 = 经 R3，距离 2（R3 直连距离 1，R1 经 R3 距离 2）。' },
  { cls:'step', tag:'备用路线', count:1, r3st:'cur', r3txt:'距离 2（当前路由）', r1st:'cand', r1txt:'2 + 1 = 3（备用）',
    msg:'R1 的周期性通告早已到过 R2：R1 自报距离 2 → R2 若改经 R1 转发，距离 = 2 + 1 = 3。',
    log:'R1 的旧通告给出一条备用路线：经 R1 = 2 + 1 = 3。' },
  { cls:'miss', tag:'坏消息', count:2, r3st:'bad', r3txt:'R3 通告：16', r1st:'cand', r1txt:'2 + 1 = 3（备用）',
    msg:'R3 检测到 201.1.2.0/25 不可达，向 R2 通告距离 <b style="color:#a02830">16</b>（RIP 用 16 表示不可达）。',
    log:'R3 检测到网络不可达，向 R2 通告距离 16（RIP 中 16 = 不可达）。' },
  { cls:'miss', tag:'必须接受', count:3, r3st:'bad', r3txt:'16 + 1 = 17（不可达）', r1st:'cand', r1txt:'2 + 1 = 3（备用）',
    msg:'RIP 规则：新信息来自当前下一跳 R3，必须先接受 → 「经 R3」= 16 + 1 = 17，已不可达。',
    log:'R3 是当前下一跳，坏消息必须照单接受：经 R3 = 16 + 1 = 17（≥16，不可达）。' },
  { cls:'ok', tag:'改选经 R1', count:4, r3st:'dim', r3txt:'17（弃用）', r1st:'good', r1txt:'距离 3 ✓',
    msg:'比较备用路线：经 R1 = 2 + 1 = 3 &lt; 17 → R2 改选经 R1 转发。',
    log:'再比较其他下一跳的旧信息：经 R1 = 2 + 1 = 3，远小于 17 → 选经 R1。' },
  { cls:'done', tag:'完成', count:5, done:true, r3st:'dim', r3txt:'17（弃用）', r1st:'good', r1txt:'距离 3（最终）',
    msg:'R2 更新后：目的 201.1.2.0/25，下一跳 R1，距离 <b style="color:#276942">3</b>。',
    log:'R2 更新后距离 = 3（下一跳 R1）→ 选 B。坏消息传得慢：R2 暂时绕道 R1，随后全网逐步收敛。' },
];

AW.init({
  title: 'R2 更新后到 201.1.2.0/25 的距离是多少？',
  subtitle: '考点：RIP 距离向量算法 · 16 = 不可达 · 来自下一跳的通告必须接受（2016-37）',
  counterLabel: '更新步骤',
  ribbonTitle: '更新过程（✓ 正常 / ✗ 坏消息）',
  intro: '点击「▶ 播放」逐步演示 R2 的路由更新。',
  snaps: snaps,
  build: build,
  render: render,
  result: {
    big: '距离 3（选 B）',
    html: '更新规则：<b>来自当前下一跳（R3）的坏消息必须照单接受</b>（经 R3 = 16 + 1 = 17，不可达）；再把其他路线的距离各加 1 跳比较——<b>经 R1 = 2 + 1 = 3</b> 最小，被选中。干扰项 C（16）只抄了坏消息，D（17）忘了还有经 R1 的备选路线。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
