<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-43 集合划分：快排划分演示</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域 ================== */
var S = {};

AW.init({
  title: '2016·集合划分：用快排划分把最小的一半换到前半段',
  subtitle: '示例 a = [4,1,9,3,7,8,2,6]，n=8，k = n/2 = 4 · 目标：枢轴归位到下标 k−1 = 3',
  counterLabel: '步数',
  intro: '点击「▶ 播放」演示一轮划分如何让最小的 4 个数落进 a[0..3]。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var lab = AW.el('div', 'aw-row-label', '<b>数组 a</b>（下标 0~7）');
    S.row = AW.el('div', '');
    S.cap = AW.el('div', 'aw-row-label', '');
    wrap.appendChild(lab);
    wrap.appendChild(S.row);
    wrap.appendChild(S.cap);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'审题', count:0,
      a:[4,1,9,3,7,8,2,6], cls:[], ptr:{},
      cap:'目标：|n1−n2| 最小 → 各取一半（k=4）；|S1−S2| 最大 → A1 装最小的 4 个数（1,2,3,4）',
      log:'例：a = [4,1,9,3,7,8,2,6]，n=8，k = n/2 = 4。做法：用快排划分反复找“枢轴归位到下标 k−1 = 3”，不必完整排序。' },
    { cls:'shift', tag:'high左扫', count:1,
      a:[2,1,9,3,7,8,2,6], cls:['ok','','','','','','',''], ptr:{0:'low·坑', 6:'high'},
      cap:'枢轴 pivokey = a[0] = 4；high 端找到第一个比 4 小的 a[6]=2 → 填入 a[0]',
      log:'取枢轴 4（原 a[0]），low=0、high=7。high 端先左移：a[7]=6 ≥ 4 跳过，a[6]=2 < 4 → 把 2 填到 a[0]，坑留在 low 侧。' },
    { cls:'shift', tag:'low右扫', count:2,
      a:[2,1,9,3,7,8,9,6], cls:['','','ok','','','','ok',''], ptr:{2:'low', 6:'high·坑'},
      cap:'low 端找到第一个比 4 大的 a[2]=9 → 填入 a[6]',
      log:'low 端右移：a[0]=2、a[1]=1 都 ≤ 4 跳过，a[2]=9 > 4 → 把 9 填到 a[6]，坑移到 high 侧。' },
    { cls:'shift', tag:'high左扫', count:3,
      a:[2,1,3,3,7,8,9,6], cls:['','','ok','','','','',''], ptr:{2:'low·坑', 3:'high'},
      cap:'high 端找到 a[3]=3 < 4 → 填入 a[2]',
      log:'high 继续左移：a[6]=9、a[5]=8、a[4]=7 都 ≥ 4 跳过，a[3]=3 < 4 → 把 3 填到 a[2]，坑又回到 low 侧。' },
    { cls:'shift', tag:'相遇', count:4,
      a:[2,1,3,3,7,8,9,6], cls:['','','','ok','','','',''], ptr:{3:'low=high'},
      cap:'low 端：a[2]=3 ≤ 4 → low 前进到 3，与 high 相遇',
      log:'low 继续右移：a[2]=3 ≤ 4 → low 到 3，与 high 相遇，扫描结束，坑就是 a[3]。' },
    { cls:'ok', tag:'枢轴归位', count:5,
      a:[2,1,3,4,7,8,9,6], cls:['','','','hit','','','',''], ptr:{3:'枢轴归位'},
      cap:'a[3] = 4——左边全 ≤ 4，右边全 ≥ 4',
      log:'枢轴 4 归位到下标 3：a = [2,1,3,4,7,8,9,6]，一轮划分完成。' },
    { cls:'shift', tag:'判位置', count:6,
      a:[2,1,3,4,7,8,9,6], cls:['ok','ok','ok','hit','','','',''], ptr:{3:'= k−1 ✓'},
      cap:'下标 3 恰为 k−1：a[0..3] = [2,1,3,4] 正是最小的 4 个数',
      log:'枢轴位置 3 == k−1 → 一次到位。若枢轴落在 3 左侧就去右段继续划分，落在右侧就去左段——非递归收缩区间（low0/high0 记边界），重复直到命中。' },
    { cls:'ok', tag:'求和', count:7,
      a:[2,1,3,4,7,8,9,6], cls:['ok','ok','ok','ok','ok','ok','ok','ok'], ptr:{},
      cap:'s1 = 2+1+3+4 = 10，s2 = 7+8+9+6 = 30',
      log:'分别累加：A1 = a[0..3] 和为 10，A2 = a[4..7] 和为 30。' },
    { cls:'done', tag:'结论', count:8, done:true,
      a:[2,1,3,4,7,8,9,6], cls:['ok','ok','ok','hit','ok','ok','ok','ok'], ptr:{},
      cap:'返回 s2 − s1 = 20 · 平均时间 O(n) · 空间 O(1)',
      log:'返回 s2−s1 = 20（本例）。平均时间复杂度 O(n)、辅助空间 O(1)——正是“尽可能高效”的划分算法。' },
  ],

  render: function(stage, sn){
    S.row.innerHTML = '';
    S.row.appendChild(AW.cellRow(sn.a, sn.cls || [], sn.ptr || {}, 0));
    S.cap.innerHTML = sn.cap || '';
  },

  result: {
    big: 's2 − s1（例中 = 20）',
    html: '设计思想：快排划分把<b>最小的 ⌊n/2⌋ 个数</b>换到 a[0..k−1]，枢轴归位到下标 k−1 即停；偏左去右段、偏右去左段，非递归收缩区间。平均时间 <b>O(n)</b>，辅助空间 <b>O(1)</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
