<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-45 动画 · 虚存 + Cache 地址字段划分与块映射</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     算法/过程类：虚地址/物理地址/TLB/Cache 字段逐段切分 + 块 4099 映射
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function wrap(label, html){
  return '<div class="aw-row-label">' + label + '</div>' + html;
}

function card(cls, html){
  return '<div class="aw-stepcard ' + cls + '"><p>' + html + '</p></div>';
}

// 字段行：[{n:'名称', b:位数, c:[背景,字色]}]，块宽按位数比例
function fieldRow(fields){
  var s = '<div style="display:flex;width:100%;border-radius:10px;overflow:hidden;font-size:12px;text-align:center;line-height:1.45">';
  fields.forEach(function(f){
    s += '<div style="flex:' + f.b + ';padding:8px 2px;background:' + f.c[0] + ';color:' + f.c[1] +
         ';font-weight:700;border-right:1px solid #fff">' + f.n + '<br><span style="font-weight:400">' + f.b + ' 位</span></div>';
  });
  return s + '</div>';
}

var BLUE  = ['#d9e3df', '#1b3a4b'];
var AMBER = ['#f8edcb', '#92400e'];
var GREEN = ['#2f9e4424', '#276942'];
var GRAY  = ['#f8edcb', '#586e72'];
var HOT   = ['#fde68a', '#92400e'];   // 高亮（正在计算的字段）

function f(n, b, c){ return { n: n, b: b, c: c }; }

function vRow(hlA, hlD){   // 虚地址行
  return fieldRow([ f('A · TLB 标记（虚页号）', 19, hlA ? HOT : AMBER), f('D · 页内偏移', 13, hlD ? HOT : BLUE) ]);
}
function pRow(hlC, hlD){   // 物理地址行
  return fieldRow([ f('C · 页框号', 11, hlC ? HOT : GREEN), f('D · 页内偏移', 13, hlD ? HOT : BLUE) ]);
}
function tRow(){           // TLB 表项行
  return fieldRow([ f('B · TLB 标记（存虚页号）', 19, AMBER), f('C · 页框号', 11, GREEN) ]);
}
function caRow(hlE, hlF, hlG){  // Cache 地址行
  return fieldRow([ f('E · Cache 标记', 9, hlE ? HOT : AMBER), f('F · 组索引', 9, hlF ? HOT : GREEN), f('G · 块内偏移', 6, hlG ? HOT : BLUE) ]);
}
function hRow(){           // Cache 行标记 H
  return fieldRow([ f('H · Cache 行标记 = 0 0000 1000B（= 8）', 9, GREEN) ]);
}

var snaps = [
  { cls:'step', tag:'审题', count:0,
    log:'虚地址 32 位、物理地址 24 位、页 8KB；TLB 全相联；Cache 数据区 64KB、2 路组相联、块 64B',
    html: card('key', '先切<b>偏移</b>，再切<b>页号/页框号</b>，最后按 Cache 组织方式切<b>标记/组号/块内偏移</b>。全部字段位 = log2(大小)。<br>已知：页 8KB = 2<sup>13</sup>B；块 64B = 2<sup>6</sup>B；Cache 64KB ÷ (2 路 × 64B) = <b>512 组</b>。') },

  { cls:'shift', tag:'D = 页内偏移', count:1, ribbon:{k:1, ok:true},
    log:'D = log2(8KB) = 13 位：虚地址与物理地址的低 13 位都是页内偏移',
    html: wrap('虚地址 32 位', vRow(0, 1)) +
          wrap('物理地址 24 位', pRow(0, 1)) +
          card('key', '页大小 8KB = 2<sup>13</sup> → <b>D = 13 位</b>。页内变换不改偏移，虚/物地址共用这 13 位。') },

  { cls:'step', tag:'A 与 B', count:2, ribbon:{k:2, ok:true},
    log:'A = 32 − 13 = 19 位（虚页号）；TLB 全相联 → 标记字段 B 必须存完整虚页号，B = 19 位',
    html: wrap('虚地址 32 位', vRow(1, 0)) +
          wrap('TLB 表项（全相联）', tRow()) +
          card('key', '<b>A = 32 − 13 = 19 位</b>（虚页号）。TLB <b>全相联</b>：任一表项可与任意虚页比较，无法用索引定位 → 标记 B 必须存<b>完整虚页号</b>（19 位）。') },

  { cls:'step', tag:'C = 页框号', count:3, ribbon:{k:3, ok:true},
    log:'C = 24 − 13 = 11 位：物理地址去掉 13 位偏移，剩下的就是页框号',
    html: wrap('物理地址 24 位', pRow(1, 0)) +
          card('key', '<b>C = 24 − 13 = 11 位</b>。TLB 命中时用它替换虚地址中的 A，拼出 24 位物理地址。') },

  { cls:'step', tag:'E / F / G', count:4, ribbon:{k:4, ok:true},
    log:'G = log2(64B) = 6 位；组数 64KB/(2×64B)=512 → F = 9 位；E = 24 − 9 − 6 = 9 位',
    html: wrap('Cache 地址划分（物理地址 24 位）', caRow(1, 1, 1)) +
          card('key', '块 64B = 2<sup>6</sup> → <b>G = 6 位</b>；数据区 64KB、2 路组相联 → 组数 = 64KB ÷ (2 × 64B) = 512 = 2<sup>9</sup> → <b>F = 9 位</b>（别忘除路数 2！）；<b>E = 24 − 9 − 6 = 9 位</b>。') },

  { cls:'ok', tag:'全景核对', count:5, ribbon:{k:5, ok:true},
    log:'(1) A=19、B=19、C=11、D=13、E=9、F=9、G=6；B 存虚页号',
    html: wrap('虚地址 32 位', vRow(0, 0)) +
          wrap('物理地址 24 位', pRow(0, 0)) +
          wrap('TLB 表项', tRow()) +
          wrap('Cache 地址（物理地址 24 位）', caRow(0, 0, 0)) },

  { cls:'step', tag:'(2) 组号', count:6, ribbon:{k:6, ok:true},
    log:'(2) 块号 4099 → 组号 = 4099 mod 512 = 3（512×8 = 4096，余 3）',
    html: card('key', '组相联映射：<code>组号 = 主存块号 mod 组数</code>。<br>4099 ÷ 512 = 8 余 3 → 该块映射到 <b>组号 3</b>（组内 2 路任选一行装入）。') +
          wrap('Cache 地址划分', caRow(0, 1, 0)) },

  { cls:'ok', tag:'(2) H = 标记', count:7, ribbon:{k:7, ok:true},
    log:'H = 块号的高位部分 = 4099 ÷ 512 = 8 → 9 位二进制 0 0000 1000B',
    html: wrap('Cache 行标记字段', hRow()) +
          card('good', '行标记 H = 4099 ÷ 512 = <b>8</b>，写成 9 位二进制 = <b>0 0000 1000B</b>。低位（mod 512）给组号，高位（÷ 512）给标记，两者别颠倒。') },

  { cls:'step', tag:'(3) 两种缺失', count:8, ribbon:{k:8, ok:true},
    log:'(3) 缺页处理开销大：缺页要访问磁盘（毫秒级），Cache 缺失只访问主存（几十纳秒级）',
    html: card('good', '<b>缺页处理的时间开销大</b>。缺页要<b>访问磁盘</b>（毫秒级，还要可能的页面调度），Cache 缺失只需<b>访问主存</b>（几十纳秒级），相差多个数量级。') },

  { cls:'step', tag:'(4) 写策略', count:9, ribbon:{k:9, ok:true},
    log:'(4) Cache—主存快，直写可接受；主存—外存磁盘极慢，回写减少写盘次数',
    html: card('key', '<b>Cache—主存</b>：速度接近，直写同时更新主存代价可接受、实现简单一致性好 → 用<b>直写</b>。<br><b>主存—外存</b>：磁盘访问极慢，每次修改都写盘代价巨大；<b>回写</b>只在页面被替换时才写盘，大幅减少磁盘访问次数。') },

  { cls:'done', tag:'完成', count:10, ribbon:{k:10, ok:true},
    log:'(1) A=19,B=19,C=11,D=13,E=9,F=9,G=6；(2) 组号 3，H=0 0000 1000B；(3) 缺页开销大；(4) 直写/回写理由',
    done:true,
    html: wrap('虚地址 32 位', vRow(0, 0)) +
          wrap('物理地址 24 位', pRow(0, 0)) +
          wrap('Cache 地址', caRow(0, 0, 0)) +
          card('good', '答案：<b>(1)</b> A=19、B=19（存虚页号）、C=11、D=13、E=9、F=9、G=6；<b>(2)</b> 组号 3，H = 0 0000 1000B；<b>(3)</b> 缺页开销大（访问磁盘 vs 主存）；<b>(4)</b> Cache—主存快用直写，主存—外存慢用回写减少写盘。') },
];

AW.init({
  title: '2016-45 虚存 + Cache 的地址划分与块映射',
  subtitle: '页 8KB · TLB 全相联 · Cache 64KB 2 路组相联 · 块 64B · 考点：地址字段划分 + 组相联映射',
  counterLabel: '推演步',
  ribbonTitle: '推演进度（✓ 完成）',
  intro: '点击「▶ 播放」逐段切分地址字段。',
  snaps: snaps,
  result: {
    big: 'A=19 B=19 C=11 D=13 E=9 F=9 G=6 · 组号 3',
    html: '记忆锚点：<b>偏移位 = log2(页/块大小)；页号 = 地址位 − 偏移位；组数 = Cache 数据区 ÷ (路数 × 块大小)；标记 = 剩余高位</b>。<br>块 4099：组号 = 4099 mod 512 = <b>3</b>，标记 = 4099 ÷ 512 = 8 = <b>0 0000 1000B</b>。缺页（磁盘）≫ Cache 缺失（主存）；快层次用直写、慢层次用回写。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
