<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016-47 FAT 链接分配：读第 5000 字节的访盘链</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
/* 链接分配 + FAT：簇 4KB；dir(dir1→48)，dir1(file1→100, file2→200)；file1 链 100→106→108 */

var td = 'border:1px solid #5a7d8c66;padding:5px 12px;';

function dirCard(title, rows, hlRow, inMem){
  var h = '<div style="display:inline-block;vertical-align:top;margin:0 8px;text-align:center">' +
          '<div class="aw-row-label"><b>' + title + '</b>' + (inMem ? ' <span style="color:#1b3a4b">（已在内存）</span>' : '') + '</div>' +
          '<table style="border-collapse:collapse;font-size:13.5px;margin:0 auto">' +
          '<tr><th style="' + td + 'background:#f8edcb">文件名</th><th style="' + td + 'background:#f8edcb">首簇号</th></tr>';
  rows.forEach(function(r, i){
    var hl = (i === hlRow);
    h += '<tr><td style="' + td + 'background:' + (hl ? '#2f9e4424' : '#fff') + ';' + (hl ? 'font-weight:700' : '') + '">' + r[0] + '</td>' +
         '<td style="' + td + 'background:' + (hl ? '#2f9e4424' : '#fff') + ';' + (hl ? 'font-weight:700' : '') + '">' + r[1] + '</td></tr>';
  });
  return h + '</table></div>';
}

function fatTable(hlRow, hlCol){
  var rows = [[100, 106], [106, 108], [200, 201], [201, 202]];
  var h = '<div style="display:inline-block;vertical-align:top;margin:0 8px;text-align:center">' +
          '<div class="aw-row-label"><b>FAT</b> <span style="color:#1b3a4b">（已在内存）</span></div>' +
          '<table style="border-collapse:collapse;font-size:13.5px;margin:0 auto">' +
          '<tr><th style="' + td + 'background:#f8edcb">表项号（本簇）</th><th style="' + td + 'background:#f8edcb">下一簇号</th></tr>';
  rows.forEach(function(r, i){
    var hl0 = (i === hlRow && hlCol === 0), hl1 = (i === hlRow && hlCol === 1);
    h += '<tr><td style="' + td + 'background:' + (hl0 ? '#2f9e4424' : '#fff') + ';' + (hl0 ? 'font-weight:700' : '') + '">' + r[0] + '</td>' +
         '<td style="' + td + 'background:' + (hl1 ? '#f8edcb' : '#fff') + ';' + (hl1 ? 'font-weight:700' : '') + '">' + r[1] + '</td></tr>';
  });
  return h + '</table></div>';
}

function note(text){
  return '<div class="aw-row-label" style="margin-top:10px">' + text + '</div>';
}

function stageHtml(kind){
  var h = '<div style="text-align:center">';
  if(kind === 0){
    h += dirCard('dir 目录文件', [['dir1', 48]], -1, true);
    h += dirCard('簇 48 · dir1 目录文件', [['file1', 100], ['file2', 200]], -1, false);
    h += fatTable(-1, null);
    h += note('目标：读 dir/dir1/file1 的第 5000 个字节 · file1 的簇链：100 → 106 → 108');
  } else if(kind === 1){
    h += dirCard('dir 目录文件', [['dir1', 48]], 0, true);
    h += dirCard('簇 48 · dir1 目录文件', [['file1', 100], ['file2', 200]], -1, false);
    h += fatTable(-1, null);
    h += note('按名查找：dir 目录文件里 dir1 → 首簇号 48（内存命中，未访盘）');
  } else if(kind === 2){
    h += dirCard('dir 目录文件', [['dir1', 48]], -1, true);
    h += dirCard('簇 48 · dir1 目录文件', [['file1', 100], ['file2', 200]], 0, false);
    h += fatTable(-1, null);
    h += note('<b>第 1 次访盘：读簇 48</b> → dir1 的目录文件 → file1 首簇号 100');
  } else if(kind === 3){
    h += '<div style="margin:8px 0"><span style="display:inline-block;border:1px solid #e07a2f;border-radius:8px;padding:8px 16px;font-size:14.5px;background:#f8edcb">' +
         '5000 ÷ 4096 = 1 余 904 → 第 5000 字节在 file1 的<b>链上第 2 个簇</b>（第 1 簇：0–4095，第 2 簇：4096–8191）</span></div>';
    h += dirCard('dir 目录文件', [['dir1', 48]], -1, true);
    h += dirCard('簇 48 · dir1 目录文件', [['file1', 100], ['file2', 200]], 0, false);
    h += note('从目录项拿到首簇号 100，沿链找第 2 簇');
  } else if(kind === 4){
    h += fatTable(0, 1);
    h += note('FAT[100] = 106 → 链上第 2 簇号是 <b>106</b>（FAT 在内存命中，未访盘）');
  } else if(kind === 5){
    h += '<div style="margin:6px 0"><div class="aw-cells" style="justify-content:center">' +
         '<div class="aw-col"><div class="aw-ptr">第 5000 字节 = 簇内偏移 904</div><div class="aw-box ok" style="font-size:18px">簇 106</div><div class="aw-idx">file1 数据簇（链上第 2 个）</div></div>' +
         '</div></div>';
    h += fatTable(0, 1);
    h += note('<b>第 2 次访盘：读簇 106</b> → 取得含第 5000 字节的数据块 ✓');
  } else {
    h += '<div style="margin:8px 0"><span style="display:inline-block;border:1px solid #2f9e44;border-radius:8px;padding:8px 16px;font-size:14.5px;background:#2f9e4424">' +
         '全程访问的簇：<b>48</b>（dir1 目录）与 <b>106</b>（file1 数据），共 2 次访盘</span></div>';
    h += dirCard('dir 目录文件', [['dir1', 48]], -1, true);
    h += dirCard('簇 48 · dir1 目录文件', [['file1', 100], ['file2', 200]], -1, false);
    h += fatTable(0, 1);
    h += note('dir 与 FAT 均内存命中；磁盘上真正被读的只有簇 48 和簇 106');
  }
  return h + '</div>';
}

var snaps = [
  { cls:'step', tag:'开始', count:0, html:stageHtml(0),
    log:'仅 FAT 和 dir 目录文件已读入内存；目标：读 dir/dir1/file1 的第 5000 个字节' },
  { cls:'ok', tag:'内存命中', count:0, html:stageHtml(1),
    log:'在内存的 dir 目录文件中按名查 dir1 → 得到首簇号 48（没有访问磁盘）' },
  { cls:'shift', tag:'访盘 ①', count:1, ribbon:{k:1, ok:true}, html:stageHtml(2),
    log:'第 1 次访问磁盘：读簇 48 —— 它是 dir1 的目录文件，内容：file1→100、file2→200' },
  { cls:'step', tag:'算偏移', count:1, html:stageHtml(3),
    log:'定位字节：5000 ÷ 4096 = 1 余 904 → 第 5000 字节在 file1 的链上第 2 个簇' },
  { cls:'ok', tag:'内存命中', count:1, html:stageHtml(4),
    log:'查内存 FAT：FAT[100] = 106 → 链上第 2 簇号 = 106（FAT 已在内存，未访盘）' },
  { cls:'shift', tag:'访盘 ②', count:2, ribbon:{k:2, ok:true}, html:stageHtml(5),
    log:'第 2 次访问磁盘：读簇 106，簇内偏移 904 处正是第 5000 字节 ✓' },
  { cls:'done', tag:'完成', count:2, done:true, html:stageHtml(6),
    log:'结论：需要访问簇 48 和簇 106 两个簇（共 2 次访盘）；dir 与 FAT 全程内存命中' }
];

AW.init({
  title: '链接分配 + FAT：读 dir/dir1/file1 第 5000 字节',
  subtitle: '簇 4KB · 目录项 =（文件名, 首簇号）· file1 簇链 100→106→108 · FAT 与 dir 已在内存',
  counterLabel: '已访盘次数',
  ribbonTitle: '磁盘访问（✓ 完成一次访盘）',
  intro: '点击「▶ 播放」，走一遍按名存取 → 算偏移 → 查 FAT 链 → 读数据簇的完整链路。',
  snaps: snaps,
  result: {
    big: '访问簇 48、簇 106（共 2 次访盘）',
    html: '完整链路：<b>内存 dir（dir1→48）→ 访盘读簇 48（file1→100）→ 内存 FAT[100]=106 → 访盘读簇 106</b>。5000 = 1×4096 + 904，落在链上第 2 簇。第(2)问相关：FAT 表项 2B → 最大 65536 表项 → FAT 最大 128KB、文件最大 256MB；第(3)问：106 在 FAT[100]、108 在 FAT[106]。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
