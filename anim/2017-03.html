<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-03 动画：稀疏矩阵的压缩存储</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 2017-03 稀疏矩阵压缩存储辨析（概念/推理链类） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>稀疏矩阵：<b>非零元素很少</b>且分布无规律。压缩存储的目标是只存非零元及其行列位置，跳过大量零元素。题目要凑齐「两种」适合的存储结构，逐项排队。</p>' },
  { title: '三元组表：适合', cls: 'good',
    body: '<p>每个非零元存成 <code>(行, 列, 值)</code> 三元组，另附行列维数与非零元个数。顺序存储、结构简单，是稀疏矩阵压缩的<b>标准结构之一</b>。</p>' },
  { title: '十字链表：适合', cls: 'good',
    body: '<p>每个非零元一个结点，同时挂在<b>所在行的行链表</b>和<b>所在列的列链表</b>上，适合非零元动态增删的运算场合（矩阵加法、乘法）。同样是稀疏矩阵压缩的<b>标准结构</b>。</p>' },
  { title: '排除干扰项', cls: 'bad',
    body: '<p><b>邻接矩阵</b>：图的存储结构，n 个顶点要开 n×n 矩阵，稀疏结构照样浪费，不是压缩存储；<b>二叉链表</b>：二叉树的存储结构，与矩阵无关。含邻接矩阵的 B、D，含二叉链表的 C，全部排除。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>两个正选结构 = <b>三元组表 ＋ 十字链表</b> → 选 <b>A</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2017-03　稀疏矩阵的两种压缩存储结构',
  subtitle: '考点：<code>数组和特殊矩阵 · 稀疏矩阵</code> · 逐项匹配与排除',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '记忆锚点：稀疏矩阵压缩 = <b>三元组表（顺序）＋ 十字链表（链式）</b>。其他结构各归其主：邻接矩阵 → 图；二叉链表 → 二叉树。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
