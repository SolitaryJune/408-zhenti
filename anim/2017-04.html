<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-04 动画：先序与中序序列相同的条件</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 2017-04 先序=中序条件推理（概念/推理链类） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>先序 = <b>根·左·右</b>；中序 = <b>左·根·右</b>。要求两序列完全相同，等价于对每个非叶结点提出统一条件——从两种遍历「走法」的差异入手。</p>' },
  { title: '关键推理：差异在第二位', cls: 'key',
    body: '<p>两序列都以根开头；分歧从第二个位置开始：先序第二位是<b>左子树的根</b>，中序第二位是<b>左子树最左下的结点</b>。只要某个结点的左子树非空，这两个位置就不同。所以必须：<b>每个结点的左子树为空</b>。</p>' },
  { title: '验证 B：右链成立', cls: 'good',
    body: '<p>所有非叶结点只有右子树 → 整棵树是向右下的链 N1→N2→N3：先序 = <code>N1 N2 N3</code>，中序 = <code>N1 N2 N3</code>，逐位相同 ✓。</p>' },
  { title: '排除 A / C / D', cls: 'bad',
    body: '<p><b>A 只有左子树</b>：先序 N1 N2 N3、中序 N3 N2 N1，恰好<b>相反</b> ✗；<b>C 度均为 1</b>：度 1 结点可能只带左孩子，不保险 ✗；<b>D 度均为 2</b>：左子树非空，直接违反上一步推理 ✗。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>选 <b>B</b>——先序与中序相同 ⇔ 树无左孩子（所有非叶结点只有右子树）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2017-04　先序序列 = 中序序列 的树形条件',
  subtitle: '考点：<code>二叉树的遍历</code> · 遍历走法推理 + 小链验证',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：先序 = 中序 ⇔ <b>无左孩子（右链）</b>；对称地，中序 = 后序 ⇔ 无右孩子（左链）。做「两序列相同/相反」题的通用套路：拿 2～3 个结点的小链条各走一遍遍历。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
