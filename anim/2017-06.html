<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-06 动画：哈夫曼编码译码</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 2017-06 哈夫曼译码逐段切分（算法/过程类） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var BITS = '0100011001001011110101'.split('');
var SEGS = [
  { ch:'a', s:0, cd:4 },
  { ch:'f', s:4, cd:3 },
  { ch:'e', s:7, cd:3 },
  { ch:'e', s:10, cd:3 },
  { ch:'f', s:13, cd:3 },
  { ch:'g', s:16, cd:2 },
  { ch:'d', s:18, cd:4 },
];
var codeRow, outRow;

function setBoxes(row, cls, texts){
  for (var j = 0; j < row.children.length; j++){
    var col = row.children[j];
    var box = col.children[1];
    if (texts && texts[j] != null) box.innerHTML = texts[j];
    box.className = 'aw-box' + (cls && cls[j] ? ' ' + cls[j] : '');
  }
}
function setPtrs(row, ptr){
  for (var j = 0; j < row.children.length; j++){
    row.children[j].children[0].innerHTML = (ptr && ptr[j]) || '';
  }
}

AW.init({
  title: '2017-06　哈夫曼编码译码：前缀码逐段切分',
  subtitle: '编码表 a=0100 · b=10 · c=0000 · d=0101 · e=001 · f=011 · g=11 · h=0001',
  counterLabel: '已译字符',
  ribbonTitle: '译码进度（✓ 已译出一个字符）',
  intro: '点击「▶ 播放」，从第 1 位开始逐段切分编码串。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>编码序列</b>（22 位，从左往右读到叶子就切一段）'));
    codeRow = AW.cellRow(BITS, [], null);
    inner.appendChild(codeRow);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>译码结果</b>（7 个字符）'));
    outRow = AW.cellRow(['·','·','·','·','·','·','·'], [], null);
    inner.appendChild(outRow);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'开始', log:'编码串共 22 位；哈夫曼编码是前缀码（任一编码不是其他编码的前缀）→ 从第 1 位起读到叶子就切一段', count:0, k:0 },
    { cls:'ok', tag:'译出 a', log:'第 1 段：读入 0100 → 恰是 a 的编码，译出 a；下一段从第 5 位开始', count:1, k:1, ribbon:{k:1,ok:true} },
    { cls:'ok', tag:'译出 f', log:'第 5 位起：011 → f', count:2, k:2, ribbon:{k:2,ok:true} },
    { cls:'ok', tag:'译出 e', log:'第 8 位起：001 → e', count:3, k:3, ribbon:{k:3,ok:true} },
    { cls:'ok', tag:'译出 e', log:'第 11 位起：001 → e（第二次出现，别数错位）', count:4, k:4, ribbon:{k:4,ok:true} },
    { cls:'ok', tag:'译出 f', log:'第 14 位起：011 → f', count:5, k:5, ribbon:{k:5,ok:true} },
    { cls:'ok', tag:'译出 g', log:'第 17 位起：11 → g（只有 2 位的短码）', count:6, k:6, ribbon:{k:6,ok:true} },
    { cls:'ok', tag:'译出 d', log:'第 19 位起：0101 → d，22 位恰好用完', count:7, k:7, ribbon:{k:7,ok:true} },
    { cls:'done', tag:'完成', log:'译码结果 a f e e f g d = afeefgd → 选 D', count:7, k:7, done:true },
  ],

  render: function(stage, sn){
    var k = sn.k || 0;
    var cls = [], ptr = [];
    var end = (k === 0) ? -1 : SEGS[k-1].s + SEGS[k-1].cd;
    var start = (k === 0) ? -1 : SEGS[k-1].s;
    var allDone = !!sn.done;
    for (var j = 0; j < BITS.length; j++){
      if (allDone) cls.push('ok');
      else if (j < start) cls.push('ok');
      else if (j < end) cls.push('hit');
      else cls.push('');
    }
    for (var t = 0; t < BITS.length; t++) ptr.push('');
    for (var i = 0; i < k; i++) ptr[SEGS[i].s] = SEGS[i].ch;
    setBoxes(codeRow, cls);
    setPtrs(codeRow, ptr);
    var oc = [], ot = [];
    for (var m = 0; m < 7; m++){
      if (m < k - 1) oc.push('ok');
      else if (m === k - 1 && !allDone) oc.push('hit');
      else if (m < k) oc.push('ok');
      else oc.push('');
      ot.push(m < k ? SEGS[m].ch : '·');
    }
    setBoxes(outRow, oc, ot);
  },

  result: {
    big: 'afeefgd　选 D',
    html: '切分过程：<code>0100|011|001|001|011|11|0101</code> → <code>a f e e f g d</code>。记忆锚点：哈夫曼编码是<b>前缀码</b>（任一编码都不是其他编码的前缀），从左到右「读到叶子就切断」，结果唯一。注意 e 与 f 各出现两次，别数串位。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
