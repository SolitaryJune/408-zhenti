<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-07 动画：握手定理求最少顶点数</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 2017-07 度数守恒推理（概念/推理链类） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>无向图 G：16 条边；度为 4 的顶点 3 个，度为 3 的顶点 4 个，其余顶点的度均小于 3。求顶点数<b>至少</b>多少——方向：让其余顶点的度数<b>尽量大</b>，顶点才尽量少。</p>' },
  { title: '第一步：握手定理（度数守恒）', cls: 'key',
    body: '<p>无向图所有顶点的度数之和 = 2 × 边数：<code>Σdeg = 2 × 16 = 32</code>。每条边给两个端点各贡献 1 度。</p>' },
  { title: '第二步：已知顶点占用的度数', cls: 'step',
    body: '<p>3 个 4 度顶点：3 × 4 = 12；4 个 3 度顶点：4 × 3 = 12；合计 <b>24</b>。剩余 <code>32 − 24 = 8</code> 度，由「度 &lt; 3」的其余顶点承担。</p>' },
  { title: '第三步：剩余顶点顶格取 2 度', cls: 'good',
    body: '<p>要顶点最少，每个剩余顶点度数顶格取 2 → <code>8 ÷ 2 = 4</code> 个。总顶点数 = 3 + 4 + 4 = <b>11</b>。（度序列 4,4,4,3,3,3,3,2,2,2,2 可以画出 16 条边的图，11 可以取到。）</p>' },
  { title: '结论', cls: 'good',
    body: '<p>顶点数至少 <b>11</b> → 选 <b>B</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2017-07　握手定理：度数和守恒求最少顶点',
  subtitle: '考点：<code>图的基本概念 · 度与边数关系</code> · Σ度 = 2E',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（11 个）',
    html: '记忆锚点：<b>Σ度 = 2E = 32</b>。「至少」型问题 = 剩余度数分配越满越好：每个剩余顶点顶格 2 度 → 8 ÷ 2 = 4 个。若把剩余顶点按 1 度算会错得 15（干扰项 D）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
