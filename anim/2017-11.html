<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-11 动画：链式存储下哪些排序变慢</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 2017-11 顺序/链式存储对排序的影响（概念/推理链类） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：链表损失了什么', cls: 'key',
    body: '<p>顺序存储 → 链式存储，损失的是<b>按下标随机存取</b>的能力，只剩顺序访问。凡是依赖「按序号直接定位」的算法都会掉速；只靠顺序扫描的比较类算法不受影响。</p>' },
  { title: 'Ⅰ 插入排序 / Ⅱ 选择排序 / Ⅲ 起泡排序：不降', cls: 'good',
    body: '<p>插入排序在已排序区<b>边找边插</b>（顺序访问即可，链表插入还免搬移元素）；选择排序每趟<b>顺序扫描</b>找最值；起泡排序<b>相邻两两比较</b>——都不需要随机存取 → 效率不降。</p>' },
  { title: 'Ⅳ 希尔排序：降', cls: 'bad',
    body: '<p>按增量 d 分组做插入排序，要访问 <code>i、i+d、i+2d…</code>，必须<b>按下标跳着取</b> → 链表做不到 → 效率降。</p>' },
  { title: 'Ⅴ 堆排序：降', cls: 'bad',
    body: '<p>建堆与筛选按完全二叉树<b>下标 i 与 2i、2i+1</b> 随机定位 → 链表做不到 → 效率降。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>时间效率降低的是 <b>Ⅳ、Ⅴ</b> → 选 <b>D</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2017-11　换链式存储，哪些排序会变慢？',
  subtitle: '考点：<code>存储结构对算法效率的影响</code> · 随机存取 vs 顺序访问',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（仅 Ⅳ、Ⅴ）',
    html: '记忆锚点：链表毁掉的只有<b>「按下标跳着取」</b>的算法——希尔（增量跳访）与堆（2i / 2i+1 下标跳访）。插入 / 选择 / 起泡只靠顺序扫描，链式照样干。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
