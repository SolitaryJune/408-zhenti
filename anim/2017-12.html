<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-12 主频与 CPI 折算运行时间</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：同 ISA、比时间',
    cls: 'key',
    body: '<p>同一 ISA → 程序 P 的指令条数 IC 相同。运行时间 <code>T = IC × CPI × 时钟周期 = IC × CPI ÷ 主频</code>。已知：M1 主频 <b>1.5GHz</b>、平均 CPI <b>2</b>；M2 主频 <b>1.2GHz</b>、平均 CPI <b>1</b>。求 T(M1) : T(M2)。</p>' },
  { title: '分别算每条指令的耗时',
    cls: 'step',
    body: '<p>M1：每条指令 <code>2 ÷ 1.5G ≈ 1.33ns</code>；M2：每条指令 <code>1 ÷ 1.2G ≈ 0.83ns</code>。IC 相同，直接比较这两个数即可。</p>' },
  { title: '求运行时间之比',
    cls: 'step',
    body: '<p>T1 : T2 = (2/1.5) : (1/1.2) = (2 × 1.2) : (1.5 × 1) = 2.4 : 1.5 = <b>1.6</b>。方向别放反：题目问"M1 和 M2 上运行时间的比值"，M1 在前。</p>' },
  { title: '直觉检验',
    cls: 'step',
    body: '<p>每秒执行指令数：M1 = 1.5G ÷ 2 = <b>0.75G</b> 条；M2 = 1.2G ÷ 1 = <b>1.2G</b> 条。M2 更快，M1 耗时应是 M2 的 1.2 ÷ 0.75 = <b>1.6</b> 倍，与比值一致。</p>' },
  { title: '排除干扰项',
    cls: 'bad',
    body: '<p>A（0.4）、D（2.5）：只看主频或只看 CPI 的错误组合；B（0.625）：把比值颠倒成了 T2 : T1。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<code>T = IC × CPI / f</code> —— 高主频 ≠ 高性能，还要看 CPI。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'M1 与 M2 运行时间之比',
  subtitle: '同 ISA · 主频 1.5GHz / 1.2GHz · 平均 CPI 2 / 1 · 公式 <code>T = IC × CPI / f</code>',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C（1.6）',
    html: 'T1 : T2 = (2/1.5) ÷ (1/1.2) = <b>1.6</b>。干扰项：0.625 是把比值倒过来；0.4 与 2.5 来自只看主频或只看 CPI。高主频不等于高性能。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
