<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-14 数组访问的局部性判断</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链
var STEPS = [
  { title: '审题眼：两种局部性的定义',
    cls: 'key',
    body: '<p><b>时间局部性</b>：刚访问过的数据很快又被再次访问；<b>空间局部性</b>：与其相邻地址的数据被顺序访问。代码中外层 <code>i</code> 控制轮数，内层 <code>j</code> 从 0 扫到 i 依次访问 <code>a[j]</code>。</p>' },
  { title: '内层循环 → 空间局部性',
    cls: 'step',
    body: '<p>第 i 轮内层依次访问 <code>a[0]、a[1]、…、a[i]</code>，地址连续递增：访问 a[j] 之后紧接着访问 a[j+1] → <b>空间局部性</b>成立。</p>' },
  { title: '外层循环 → 时间局部性',
    cls: 'step',
    body: '<p>i 从 0 增到 9，每轮都会重新访问 <code>a[0..i]</code>：上一轮刚访问过的元素这一轮又被访问 → <b>时间局部性</b>成立。</p>' },
  { title: '访问序列对照',
    cls: 'step',
    body: '<p>i=2 轮：a[0]、a[1]、a[2]；i=3 轮：a[0]、a[1]、a[2]、a[3] —— 前三个都是重访（时间局部性），新增的 a[3] 紧跟 a[2]（空间局部性）。</p>' },
  { title: '逐项排除',
    cls: 'bad',
    body: '<p>B（无时间局部性）：漏看跨外层循环的重访；C（无空间局部性）：漏看内层顺序扫描；D（皆无）：两个特征都视而不见。只有 A 两者皆有。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>顺序扫描给空间局部性、重复扫描给时间局部性</b>，本程序两样都占。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '数组 a 的访问局部性',
  subtitle: '二重循环：外层 <code>i</code> · 内层 <code>j</code> 扫 <code>a[0..i]</code> · 时间局部性 vs 空间局部性',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '内层<b>顺序</b>访问 a[0..i] → 空间局部性；外层每轮<b>重复</b>访问 a[0..i] → 时间局部性，两者皆有。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
