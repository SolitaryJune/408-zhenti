<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-15 按下标顺序访问数组选哪种寻址方式</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：数组地址怎么变',
    cls: 'key',
    body: '<p>一维数组元素地址 = <b>数组首地址 + 下标 × 元素长度</b>。"按下标顺序访问"要求：首址固定、下标自动变化，只改下标就能遍历。</p>' },
  { title: '变址寻址的机制',
    cls: 'step',
    body: '<p>变址寻址：<code>EA = (IX) + A</code>。形式地址 A 指向数组首地址（写在指令里），变址寄存器 IX 存下标；IX 加 1 就指向下一个元素，一条指令配合 IX 自增即可扫过整个数组 —— 这正是变址寻址的典型应用（数组、循环程序）。</p>' },
  { title: '排除 A：相对寻址',
    cls: 'bad',
    body: '<p><code>EA = (PC) + A</code>，以当前指令位置为基准，面向程序转移与代码浮动；基准是"程序在哪"，不是"数组首址在哪"。</p>' },
  { title: '排除 B 与 C',
    cls: 'bad',
    body: '<p>寄存器寻址：操作数就在寄存器里，不生成访存地址，谈不上按地址扫数组。直接寻址：<code>EA = A</code> 地址写死在指令里，每换一个下标就得换一条指令。</p>' },
  { title: '对照小结',
    cls: 'good',
    body: '<p>只有变址寻址做到"<b>首址放指令、下标放寄存器</b>"：首址不变、IX 递增，正好匹配"按下标顺序访问数组"。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：数组/循环 → 变址寻址；程序转移/浮动 → 相对寻址。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '哪种寻址方式最适合按下标顺序访问一维数组',
  subtitle: '变址 / 相对 / 寄存器 / 直接 · 抓住"首址固定 + 下标可变"',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '变址寻址 <code>EA = (IX) + A</code>：A 给数组首址、IX 给下标，改 IX 即按下标顺序遍历。相对寻址基准是 PC（面向程序位置），别混淆。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
