<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-16 扩展操作码推最小指令字长</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：位分配',
    cls: 'key',
    body: '<p>指令字长固定、只有两种格式；三地址 29 条、二地址 107 条，地址字段各 6 位。设指令字长 L 位：三地址操作码占 <code>L−18</code> 位，二地址操作码占 <code>L−12</code> 位（恰好多出一个地址字段的位置）。</p>' },
  { title: '三地址指令的空间需求',
    cls: 'step',
    body: '<p>29 条三地址指令需要 <code>2^(L−18) ≥ 29</code> → 操作码至少 <b>5 位</b>（2<sup>5</sup> = 32 ≥ 29），理论最短 L = 5 + 18 = <b>23 位</b>。</p>' },
  { title: '二地址靠扩展操作码补齐',
    cls: 'step',
    body: '<p>三地址用剩 <code>32 − 29 = 3</code> 个操作码前缀，每个前缀再接 6 位编码，可扩展 <code>3 × 64 = 192</code> 条二地址 ≥ 107 ✓，空间够用。</p>' },
  { title: '按字节对齐取整',
    cls: 'step',
    body: '<p>机器按字节编址、指令按字节存放，指令字长应为 <b>8 的倍数</b>：23 位向上取整 → <b>24 位</b>。</p>' },
  { title: '验证 L = 24',
    cls: 'good',
    body: '<p>三地址：2<sup>6</sup> = 64 ≥ 29 ✓；剩余前缀 35 个 × 64 = 2240 ≥ 107 ✓。24 位同时满足两种格式且最省，其余选项 26/28/32 都不是最小。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：操作码位数看条数（2 的 k 次方 ≥ 条数），字长 = 操作码 + 地址字段，最后向上取整到字节边界。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '两种指令格式下的最小指令字长',
  subtitle: '三地址 29 条 · 二地址 107 条 · 地址字段 6 位 · 扩展操作码 + 字节对齐',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（24 位）',
    html: '5 位操作码容纳 29 条三地址（理论 23 位）；剩余 3 前缀 × 64 = 192 ≥ 107 条二地址；按字节编址取 8 的倍数 → <b>24 位</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
