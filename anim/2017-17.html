<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-17 超标量流水线特性判断</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：超标量是什么',
    cls: 'key',
    body: '<p>超标量流水线 = 处理器内配置多条流水线、多个功能部件，<b>在一个时钟周期内发射并执行多条指令</b>。它改变的是"每拍发射几条"（宽度），不改变单条指令在各功能段里的处理时间（深度）。</p>' },
  { title: '判断 I：缩短功能段处理时间？',
    cls: 'bad',
    body: '<p>"能缩短流水线功能段的处理时间"——<b>错</b>。功能段时间由电路延迟与时钟周期决定，超标量缩短不了它；把段切得更细、靠提高主频提速的是<b>超流水线</b>。</p>' },
  { title: '判断 II：一拍多发射？',
    cls: 'good',
    body: '<p>"能在一个时钟周期内同时发射多条指令"——<b>对</b>，这正是超标量的定义（空间上的多发射）。</p>' },
  { title: '判断 III：结合动态调度？',
    cls: 'good',
    body: '<p>"能结合动态调度技术提高指令执行并行性"——<b>对</b>。超标量常与动态调度（乱序执行、记分牌、Tomasulo 等）配合，挖掘指令级并行。</p>' },
  { title: '组合判断',
    cls: 'step',
    body: '<p>II、III 对，I 错 → 选"仅 II、III"。含 I 的 B、D 排除；仅 II 的 A 漏掉了 III。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>超标量管宽度（一次几条），超流水管深度（段更细）</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '超标量流水线的三个论断',
  subtitle: 'I 缩短段时间 · II 一拍多发射 · III 配合动态调度 · 辨析超标量 vs 超流水',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C（仅 II、III）',
    html: 'II（一拍多发射）与 III（可配动态调度）正确；I 错——超标量不缩短功能段处理时间。超标量 = 宽度，超流水 = 深度。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
