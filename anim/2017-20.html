<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-20 多总线结构特性判断</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：多总线结构',
    cls: 'key',
    body: '<p>多总线结构按速度分层挂接：越靠近 CPU 的总线越快（存储器总线最快），越往外越慢。本题要挑出<b>错误</b>的叙述。</p>' },
  { title: '核对 A：速度分层',
    cls: 'good',
    body: '<p>"靠近 CPU 的总线速度较快"——<b>对</b>。分层设计正是为了让高速部件走高速总线、慢速设备走扩展总线，互不拖累。</p>' },
  { title: '核对 B、C',
    cls: 'good',
    body: '<p>存储器总线可支持<b>突发（burst）传送</b>：给出一个首地址后连续传送一串数据 ✓；总线之间必须通过<b>桥接器</b>相连，完成协议与速度的转换 ✓。</p>' },
  { title: 'D 错在哪',
    cls: 'bad',
    body: '<p>"PCI-Express×16 采用并行传输方式"——<b>错</b>。PCIe 是<b>串行</b>点对点传输标准，×16 表示 16 条 lane，每条 lane 都是独立的串行差分线路；并行传输是传统 PCI/ISA 的方式。</p>' },
  { title: '易混辨析',
    cls: 'step',
    body: '<p>PCI（并行、共享总线）vs PCI-Express（串行、点对点）：别被"×16"骗成 16 位并行总线，lane 数只是通道条数。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>PCIe = 串行</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '多总线结构：哪个说法错了',
  subtitle: '速度分层 · 突发传送 · 桥接器 · PCI-Express 的传输方式',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: 'PCI-Express 采用<b>串行</b>传输（×16 = 16 条串行 lane），不是并行传输。A、B、C 均为多总线结构的正确描述。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
