<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-21 I/O 指令的数据传送双方</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：三个对象要分清',
    cls: 'key',
    body: '<p><b>I/O 设备</b>（外设本身）→ <b>I/O 接口 / 端口</b>（接口中的可访问寄存器）→ <b>CPU</b>。问：I/O 指令的数据传送发生在哪两端之间？</p>' },
  { title: 'I/O 指令能碰到谁',
    cls: 'step',
    body: '<p>CPU 执行 I/O 指令（IN/OUT）只能访问<b>I/O 端口</b>：IN 把端口内容读入通用寄存器，OUT 把通用寄存器内容写入端口。</p>' },
  { title: '排除 A、C',
    cls: 'bad',
    body: '<p>I/O 设备与端口之间的数据交换由<b>接口内部硬件</b>完成，不是 I/O 指令的直接任务；端口与端口之间也不直接互相传送。</p>' },
  { title: '排除 B',
    cls: 'bad',
    body: '<p>"通用寄存器和 I/O 设备之间"——CPU 不能越过接口直接访问设备，这种说法跳过了<b>端口</b>这一层。</p>' },
  { title: 'D 正确',
    cls: 'good',
    body: '<p>I/O 指令实现的传送正是 <b>通用寄存器 ↔ I/O 端口</b>：读端口进寄存器、写寄存器出端口。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>CPU ↔ 端口 ↔ 设备</b>，I/O 指令只负责第一段。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'I/O 指令的数据传送发生在哪两端',
  subtitle: 'I/O 设备 · I/O 端口 · 通用寄存器 · 分清"端口"与"设备"',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: 'I/O 指令（IN/OUT）在<b>通用寄存器</b>与 <b>I/O 端口</b>之间传送数据；设备与端口之间由接口硬件完成，CPU 不能直接访问设备。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
