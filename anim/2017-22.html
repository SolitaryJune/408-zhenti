<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-22 多重中断系统的开关中断</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：多重中断 = 可嵌套',
    cls: 'key',
    body: '<p>多重中断：处理某中断服务程序的过程中，若出现更高级别的请求，可暂停当前服务、转去响应 —— 嵌套成立的前提是<b>处理期间允许中断（开中断）</b>。本题挑<b>错误</b>项。</p>' },
  { title: '核对 A、C、D',
    cls: 'good',
    body: '<p>A：CPU 在一条指令执行结束时采样并响应中断 ✓；C：外中断请求由外设随机产生，与当前指令的执行无关 ✓；D：CPU 通过采样中断请求信号检测中断 ✓。</p>' },
  { title: 'B 错在哪',
    cls: 'bad',
    body: '<p>"中断处理期间 CPU 处于关中断状态"——<b>错</b>。若全程关中断，更高优先级的请求永远进不来，<b>嵌套无从谈起</b>。关中断只应存在于"保存现场、设置屏蔽字"等临界区，之后必须开中断。</p>' },
  { title: '单级 vs 多重对比',
    cls: 'step',
    body: '<p>单级中断可以在处理期间一直关中断；多重中断的处理流程：响应 → 关中断、保存现场/设屏蔽字 → <b>开中断</b> → 执行服务 → 关中断、恢复现场 → 开中断返回。</p>' },
  { title: '陷阱溯源',
    cls: 'step',
    body: '<p>把单级中断的"全程关中断"或"保护现场要关中断"错误推广到整个处理期间，就会误判 B 正确 —— 这正是命题人埋的坑。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>多重中断的关键就是"处理期间开中断"</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '多重中断系统：哪个说法错了',
  subtitle: '中断嵌套 · 响应时机 · 请求的随机性 · 开/关中断的位置',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '多重中断系统在保存现场后必须<b>开中断</b>，才能响应更高级请求实现嵌套；"处理期间一直关中断"是错误说法。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
