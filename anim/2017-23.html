<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-23 · 作业调度：FCFS 与 SJF</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：算法/过程类（tools/anim_algo_template.html）· 只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var UI = {};
AW.init({
  title: '2017-23 · t=2 开始作业调度：FCFS 与 SJF 各选中谁',
  subtitle: 'J₁ 到达0 运行3 ｜ J₂ 到达1 运行3 ｜ J₃ 到达1 运行2 ｜ J₄ 到达3 运行1 · 调度时刻 <code>t=2</code>',
  counterLabel: '推演步',
  ribbonTitle: '作业筛查（✓ 已到达 / ✗ 未到达）',
  intro: '点击「▶ 播放」或「下一步」：先筛出 t=2 已到达的作业，再看两种算法各选谁。',

  build: function(stage){
    stage.innerHTML = '';
    var row = AW.el('div', '');
    row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap';
    var data = [
      { name:'J₁', arr:0, run:3 },
      { name:'J₂', arr:1, run:3 },
      { name:'J₃', arr:1, run:2 },
      { name:'J₄', arr:3, run:1 }
    ];
    UI.cards = [];
    data.forEach(function(d){
      var c = AW.el('div', 'aw-stepcard');
      c.style.cssText = 'flex:1 1 150px;min-width:150px;margin-bottom:0;border-color:#1b3a4b26';
      c.innerHTML = '<h4 style="margin-bottom:4px"><span class="n">' + d.name + '</span>到达 ' + d.arr +
                    ' · 运行 ' + d.run + '</h4><div class="st" style="font-size:13px;color:#586e72">等待筛查</div>';
      row.appendChild(c);
      UI.cards.push({ el: c, st: c.querySelector('.st') });
    });
    stage.appendChild(row);
    UI.fcfs = AW.el('div', '', '<b>FCFS（先来先服务）</b>：待定…');
    UI.sjf  = AW.el('div', '', '<b>SJF（短作业优先）</b>：待定…');
    UI.fcfs.style.cssText = 'margin-top:12px;font-size:14px;padding:10px 14px;border:1px solid #1b3a4b26;border-radius:12px;background:#f8edcb';
    UI.sjf.style.cssText  = 'margin-top:8px;font-size:14px;padding:10px 14px;border:1px solid #1b3a4b26;border-radius:12px;background:#f8edcb';
    stage.appendChild(UI.fcfs);
    stage.appendChild(UI.sjf);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'调度发生在 t=2：本轮只能在「已到达」的作业中挑选', count:0 },
    { cls:'ok',    tag:'已到达', log:'J₁ 到达时刻 0 ≤ 2，已进入系统，参与本轮调度', count:1, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'已到达', log:'J₂ 到达时刻 1 ≤ 2，已进入系统，参与本轮调度', count:2, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'已到达', log:'J₃ 到达时刻 1 ≤ 2，已进入系统，参与本轮调度', count:3, ribbon:{k:3, ok:true} },
    { cls:'miss',  tag:'未到达', log:'J₄ 到达时刻 3 > 2，此刻还没来，本轮不可能被选中', count:4, ribbon:{k:4, ok:false} },
    { cls:'shift', tag:'FCFS',  log:'先来先服务按到达时刻排队：J₁(0) → J₂(1) → J₃(1)，队头最早是 J₁ → FCFS 选中 J₁', count:5 },
    { cls:'ok',    tag:'SJF',   log:'短作业优先比运行时间：J₁=3、J₂=3、J₃=2，最短是 J₃ → SJF 选中 J₃', count:6 },
    { cls:'done',  tag:'完成',   log:'FCFS 选 J₁、SJF 选 J₃，对照选项只有 D（J1、J3）符合', count:7, done:true }
  ],

  render: function(stage, sn, i){
    UI.cards.forEach(function(c, k){
      var el = c.el, st = c.st;
      var pick = (i >= 5 && k === 0) || (i >= 6 && k === 2);
      if (pick){
        el.style.borderColor = '#e07a2f'; el.style.background = '#f8edcb';
        st.textContent = (k === 0 ? 'FCFS 选中（到达最早）' : 'SJF 选中（运行最短）');
        st.style.color = '#92400e';
      } else if (k === 3 && i >= 4){
        el.style.borderColor = '#e63946'; el.style.background = '#fff8f8';
        st.textContent = '未到达，出局'; st.style.color = '#a02830';
      } else if (i >= k + 1){
        el.style.borderColor = '#2f9e44'; el.style.background = '#f6fef9';
        st.textContent = '已到达，参与调度'; st.style.color = '#276942';
      } else {
        el.style.borderColor = '#1b3a4b26'; el.style.background = '#fff';
        st.textContent = '等待筛查'; st.style.color = '#586e72';
      }
    });
    UI.fcfs.innerHTML = '<b>FCFS（先来先服务）</b>：' + (i >= 5 ? '按到达时刻 J₁(0)→J₂(1)→J₃(1)，选中 <b style="color:#92400e">J₁</b>' : '待定…');
    UI.sjf.innerHTML  = '<b>SJF（短作业优先）</b>：' + (i >= 6 ? '运行时间 3/3/2，选中 <b style="color:#92400e">J₃</b>' : '待定…');
  },

  result: {
    big: '答案 D：FCFS 选 J₁，SJF 选 J₃',
    html: '两步走：① 先按到达时刻筛掉 <b>J₄</b>（t=2 还没来）；② <b>FCFS 看到达时刻</b> → J₁；<b>SJF 看运行时间</b> → J₃（2 最短）。记忆点：作业调度的候选集永远只含已到达的作业。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
