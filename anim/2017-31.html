<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-31 · 硬链接与打开文件结构</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- 模板：概念/分析类（tools/anim_concept_template.html）· 只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

function layersHTML(){
  var box = function(txt, bg, bd){
    return '<div style="border:2px solid ' + bd + ';background:' + bg + ';border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;flex:1 1 150px;min-width:150px;text-align:center">' + txt + '</div>';
  };
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0">' +
    box('目录项 f1、f2', '#fff', '#1b3a4b26') + '<span style="color:#b9cbd0">→</span>' +
    box('同一个内存 inode', '#f6fef9', '#2f9e44') + '<span style="color:#b9cbd0">→</span>' +
    box('唯一的一份文件数据', '#f6fef9', '#2f9e44') +
  '</div>' +
  '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0">' +
    box('进程A：fd1 → 用户打开文件表项①（读写指针A）', '#f8edcb', '#e07a2f') + '<span style="color:#b9cbd0">→</span>' +
    box('内存 inode', '#f6fef9', '#2f9e44') +
  '</div>' +
  '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0">' +
    box('进程B：fd2 → 用户打开文件表项②（读写指针B）', '#f8edcb', '#e07a2f') + '<span style="color:#b9cbd0">→</span>' +
    box('内存 inode', '#f6fef9', '#2f9e44') +
  '</div>';
}

var STEPS = [
  { title: '审题眼：硬链接是什么',
    cls: 'key',
    log: 'f1、f2 两个目录项指向同一个 inode，数据只有一份',
    body: '<p>f2 是 f1 的<b>硬链接</b>：目录中有两个<b>目录项</b>，但都指向<b>同一个索引结点（inode）</b>，文件数据只有一份。</p>' },
  { title: '打开文件的三层结构',
    cls: 'step',
    log: '目录项 → inode → 数据；打开表项 → 读写指针 → inode',
    body: '<p>' + layersHTML() + '</p><p>两个进程分别打开 f1 和 f2：各得一个 <code>fd</code>，指向<b>各自进程的用户打开文件表项</b>；表项经共享的内存 inode 到达同一份数据。</p>' },
  { title: 'I. 读写指针保持相同 ✗',
    cls: 'bad',
    log: 'I 错：读写指针在各自的打开表项里，互不相干',
    ribbon: { k:1, ok:false },
    body: '<p>读写指针属于<b>各自的打开文件表项</b>（fd1 一份、fd2 一份），随各自的打开动作和读/写进度变化，<b>不会自动保持相同</b>。I 错误。</p>' },
  { title: 'II. 共享同一个内存索引结点 ✓',
    cls: 'good',
    log: 'II 对：硬链接共享同一 inode',
    ribbon: { k:2, ok:true },
    body: '<p>f1、f2 的目录项指向<b>同一个 inode</b>，打开时内存中也只保留<b>同一份内存索引结点</b>。II 正确。</p>' },
  { title: 'III. fd 各指各的表项 ✓',
    cls: 'good',
    log: 'III 对：fd1、fd2 是各自进程用户打开文件表中的表项',
    ribbon: { k:3, ok:true },
    body: '<p>fd 是<b>进程级</b>用户打开文件表的表项编号。两个进程各有一张表，fd1、fd2 <b>分别指向各自的表项</b>。III 正确。</p>' },
  { title: '结论',
    cls: 'good',
    log: '仅 II、III 正确 → 答案 B',
    body: '<p>答案选 <b>B（仅 II、III）</b>。记忆锚点：<b>目录项 → inode 多对一；打开表项 → 读写指针一对一</b>。指针跟"打开动作"走，不跟文件走。</p>' }
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.cls === 'bad' ? 'miss' : s.cls === 'good' ? 'ok' : 'step'),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last
  };
});

AW.init({
  title: '2017-31 · 硬链接 f1/f2 同时打开后的 fd 与 inode',
  subtitle: '陈述：I 读写指针相同 ｜ II 共享内存 inode ｜ III fd 各指各的表项',
  ribbonTitle: '陈述判定（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B：仅 II、III',
    html: '硬链接 = <b>多个目录项 → 同一 inode</b>，所以 II 对；打开是<b>进程私有</b>的动作，fd 和读写指针都随打开表项走，所以 I 错、III 对。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
