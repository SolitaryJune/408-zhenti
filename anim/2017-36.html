<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-36 · 只能作源 IP 地址的辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：找"只能作源、不能作目的"的地址',
    cls: 'key',
    body: '<p>四个候选：<code>0.0.0.0</code>、<code>127.0.0.1</code>、<code>200.10.10.3</code>、<code>255.255.255.255</code>。逐项检查"作源 / 作目的"两个方向。</p>' },
  { title: 'A 项：0.0.0.0 ✓',
    cls: 'good',
    body: '<p><code>0.0.0.0</code> 表示"本主机还没有 IP"。典型场景：开机时发 DHCP 发现报文，<b>源 = 0.0.0.0、目的 = 255.255.255.255</b>。它不会被当作交付目标 → <b>只能作源</b> ✓。</p>' },
  { title: 'B 项：127.0.0.1 ✗',
    cls: 'bad',
    body: '<p>环回地址：数据不出本机，本机既是源也是目的（ping 127.0.0.1 能通）→ 不是"只能作源"。</p>' },
  { title: 'C 项：200.10.10.3 ✗',
    cls: 'bad',
    body: '<p>普通 C 类单播地址，作源、作目的都合法 → 不符合题意。</p>' },
  { title: 'D 项：255.255.255.255 ✗（方向相反）',
    cls: 'bad',
    body: '<p>受限广播地址：<b>只能作目的</b>（发给本网络所有主机），不能作源——与题目要求的方向正好相反。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：0.0.0.0 只源不目的；255.255.255.255 只目的不源；127.0.0.1 双可但不出网。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2017-36 · 哪个 IP 只能作源地址、不能作目的地址',
  subtitle: '特殊 IP 地址辨析 · 逐项推演',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐项排查四个特殊地址。',
  snaps: snaps,
  result: {
    big: '答案 A · 0.0.0.0',
    html: '<code>0.0.0.0</code> 是"本主机尚未获得 IP"时的源地址（DHCP 场景），不能作目的。<code>255.255.255.255</code> 方向相反（只能作目的）；<code>127.0.0.1</code> 与普通单播地址则双向都可用。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
