<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-37 · RIP / OSPF / BGP 的封装位置</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：三个路由协议各"骑"在谁上面',
    cls: 'key',
    body: '<p>题目问 RIP、OSPF、BGP 报文分别被<b>谁直接封装</b>。逐个回忆它们的端口与封装位置。</p>' },
  { title: 'RIP → UDP（520）',
    cls: '',
    body: '<p>RIP 是应用层协议，基于 <b>UDP</b>（端口 520）周期性广播距离向量；报文短、靠周期重发兜底，UDP 足够。</p>' },
  { title: 'OSPF → IP（协议字段 89）',
    cls: '',
    body: '<p>OSPF 直接封装在 <b>IP</b> 之上（IP 首部协议字段 = 89），不经过 UDP/TCP；可靠性、确认由 OSPF 自己实现。</p>' },
  { title: 'BGP → TCP（179）',
    cls: '',
    body: '<p>BGP 基于 <b>TCP</b>（端口 179）：域间路由要长时间、可靠、有序地交换大量路由信息，必须用 TCP。</p>' },
  { title: '对照选项',
    cls: '',
    body: '<p>依次为 <b>UDP、IP、TCP</b> → 选项 <b>D</b>。补充记忆：同样直接封装在 IP 上的还有 ICMP（协议字段 1）。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。干扰项 A/B/C 都是三者位置记混：RIP 用 UDP 而非 TCP；OSPF 用 IP 而非 TCP/UDP；BGP 用 TCP 而非 UDP。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2017-37 · 直接封装 RIP、OSPF、BGP 报文的协议',
  subtitle: 'RIP / OSPF / BGP · 封装位置记忆链',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐个回忆三个协议的封装位置。',
  snaps: snaps,
  result: {
    big: '答案 D · UDP、IP、TCP',
    html: 'RIP→<b>UDP</b>（520）、OSPF→<b>IP</b>（协议字段 89）、BGP→<b>TCP</b>（179）。记忆锚点：RIP-UDP、OSPF-IP、BGP-TCP。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
