<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-40 · FTP 双连接机制辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：FTP 的双连接模型',
    cls: 'key',
    body: '<p>FTP 在客户端与服务器之间建两条 TCP 连接：<b>控制连接</b>（贯穿整个会话）+ <b>数据连接</b>（每次传输临时建立）。本题要找<b>错误</b>项。</p>' },
  { title: '控制连接：21 端口、常开',
    cls: 'good',
    body: '<p>客户端主动连接<b>服务器的 TCP 21 端口</b>建立控制连接，<b>整个会话期间保持打开</b> → 说法 B、D 都正确。</p>' },
  { title: '数据连接：一次性',
    cls: 'good',
    body: '<p>每次传输文件时才建立数据连接，<b>传输完毕立即关闭</b>，下次传输再重新建 → 说法 A 正确。</p>' },
  { title: 'C 项错在哪：20 端口的归属',
    cls: 'bad',
    body: '<p>主动（PORT）模式：是<b>服务器用自己的 TCP 20 端口作源端口</b>，去连接"客户端通过控制连接告知的临时端口"。20 端口在<b>服务器侧</b>，客户端没有 20 端口 → "服务器与客户端的 TCP 20 端口建立数据连接"说反了，错误。</p>' },
  { title: '被动模式佐证',
    cls: '',
    body: '<p>被动（PASV）模式下服务器甚至不用 20 端口（改用临时端口监听数据连接）——更说明 C 的说法不成立。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：控制 21 常开；数据 20（服务器侧、主动模式）"一次性"。别把 20、21 的归属记反。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2017-40 · FTP 控制连接与数据连接，哪个说法错误',
  subtitle: '控制连接 21 · 数据连接 20（主动模式，服务器侧源端口）· 逐项核对',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐项核对四个说法。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: 'A/B/D 正确：数据连接传完即关、控制连接贯穿会话、控制连接连向服务器 21 端口。C 错误：<b>20 端口是服务器侧发起数据连接的源端口</b>（主动模式），不是客户端的端口。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
