<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017-44 CISC 判定 · 代码长度 · CF 标志 · shl 与 float</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：四问的骨架',
    cls: 'key',
    body: '<p>机器 M 按字节编址，f1 的机器级代码从 <code>00401020H</code> 到 <code>0040107FH</code>（末条 <code>ret</code>）。四问分别考察：指令系统风格、代码长度、CF 标志、浮点与移位。</p>' },
  { title: '问(1)：CISC 判定',
    cls: 'step',
    body: '<p>图中机器指令<b>长短不一</b>（不同指令占的字节数不同），不符合 RISC"指令定长、格式少、以 Load/Store 访存"的特征 → M 是 <b>CISC</b>。</p>' },
  { title: '问(2)：代码总长 = 地址差 + 1',
    cls: 'step',
    body: '<p>首条 <code>00401020H</code>，末条 <code>0040107FH</code>：总字节数 = <code>0040107FH − 00401020H + 1 = 60H = 96</code> 字节。地址相减得到的是"间隔数"，首尾两条都要算，别忘 <b>+1</b>。</p>' },
  { title: '问(3) 前置：cmp 到底在比什么',
    cls: 'key',
    body: '<p>执行 f1(0)：n=0（unsigned），循环条件先算 <code>n−1</code> → 0−1 下溢 = <code>FFFFFFFFH</code>；此时 i=0。cmp 指令实现 <code>i − (n−1)</code> = <code>0 − FFFFFFFFH</code>。</p>' },
  { title: '问(3)：补码加减器求 CF',
    cls: 'step',
    body: '<p>减法化成"加补"：<code>00000000H + 00000000H（FFFFFFFFH 取反）+ 1 = 00000001H</code>，最高位无进位，进位输出 C = 0；减法的借位标志 <code>CF = C̄ = 1</code>（不够减、有借位）。</p>' },
  { title: '问(4)：shl 用不到 float 上',
    cls: 'bad',
    body: '<p>f2 中 power 是 <b>float</b>：32 位按"符号 + 8 位阶码 + 23 位尾数"解释。shl 是整数移位指令，把整个位串左移 1 位会破坏阶码与符号的语义，得不到 2 倍的浮点值 → <b>不能</b>用 shl 实现 power × 2。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>四问结论：<b>CISC</b>；代码共 <b>96 字节</b>；CF = <b>1</b>；<b>不能</b>用 shl 实现 float 的乘 2。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'f1 的机器级代码：四问推演',
  subtitle: 'RISC/CISC 判别 · 地址差算长度 · 补码加减器与 CF · 浮点数与整数移位',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: 'CISC · 96 字节 · CF=1 · 不能',
    html: '长短不一 → CISC；0040107FH − 00401020H + 1 = 60H = <b>96 字节</b>；0 − FFFFFFFFH 化为 0 + 0 + 1 无进位 → <b>CF = 1</b>；float 含阶码，整体左移不等于乘 2。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
