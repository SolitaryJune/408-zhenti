<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-02 队列+栈混合输出判定</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/推理链类题目动画：逐项推演输出序列是否可得
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：输出只能来自两处',
    cls: 'key',
    body: '<p>队列 <code>1,2,3,4,5,6</code>（1 在队头），栈 S 空。操作①<b>直接输出队头</b>；操作②把队头<b>压入栈</b>（不输出）；操作③<b>弹出栈顶并输出</b>。队列 FIFO、栈 LIFO——想输出队尾方向的元素，前面的元素必须先离队：要么直接输出，要么进栈暂存。</p>' },
  { title: 'A 可行：栈暂存中段元素',
    cls: 'good',
    body: '<p><code>1,2,5,6,4,3</code>：①出 1、①出 2 → ②3 入栈、②4 入栈 → ①出 5、①出 6 → 栈内剩 3(底),4(顶)，③弹 4、③弹 3。输出恰为 1,2,5,6,4,3 ✓</p>' },
  { title: 'B、D 可行：全压栈即可逆',
    cls: 'good',
    body: '<p><code>2,3,4,5,6,1</code>：②1 入栈，①依次出 2,3,4,5,6，③弹 1 ✓。<code>6,5,4,3,2,1</code>：②把 1~5 依次入栈，①出 6，再③依次弹出 5,4,3,2,1 ✓</p>' },
  { title: 'C 第一步：输出 3 的代价',
    cls: 'bad',
    body: '<p>C 是 <code>3,4,5,6,1,2</code>。想第一个输出 3：1、2 既不能被输出，就必须先经②压入栈。此时栈内自底向上是 <b>1、2</b>——<b>栈顶是 2</b>，1 被压在最下面。</p>' },
  { title: 'C 的矛盾：1 被 2 压死',
    cls: 'bad',
    body: '<p>随后 4,5,6 从队头直接输出（不经过栈）。剩下必须输出 <code>1,2</code>，但栈顶是 2：操作③只能先弹 2，得到 <code>...,2,1</code>；想让 1 先出，必须先弹出压着它的 2——<b>矛盾</b>，C 无法实现。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>队列保序、栈逆转</b>；栈里「下面的元素」不可能先于「压着它的元素」输出。判可行性时三种操作可任意穿插，逐个序列模拟一遍。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018·数据结构（二） 队列 + 栈能输出哪些序列',
  subtitle: '队列 <code>1,2,3,4,5,6</code> · 操作：①出队输出 ②出队入栈 ③出栈输出 · 判四个选项',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: 'A、B、D 都能通过「直接出队 + 入栈暂存 + 弹栈输出」的恰当组合得到；C 中 1、2 入栈后 <b>2 压在 1 上面</b>，后续输出只能是 ...,2,1。记忆锚点：<b>队列保序、栈逆转，栈内次序不可穿越</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
