<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-03 上三角对称矩阵下标计算</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];   // 6 行卡片 DOM
var CALC;        // 底部累计说明

function buildRowCard(){
  var row = AW.el('div', 'aw-cells');
  var b1 = AW.el('div', 'aw-box', '');
  var b2 = AW.el('div', 'aw-box', '');
  var b3 = AW.el('div', 'aw-box', '');
  var wrap = AW.el('div', '');
  wrap.appendChild(row);
  row.appendChild(AW.el('div','aw-col')).appendChild(AW.el('div','aw-box','行'));
  row.appendChild(AW.el('div','aw-col')).appendChild(b1);
  row.appendChild(AW.el('div','aw-col')).appendChild(b2);
  row.appendChild(AW.el('div','aw-col')).appendChild(b3);
  return { wrap: wrap, b1: b1, b2: b2, b3: b3 };
}

// snap.rows: [ [行label, 个数, 范围/下标, cls] x6 ]
function paintRows(sn){
  for(var i = 0; i < 6; i++){
    var r = ROWS[i];
    var d = sn.rows[i];
    r.b1.innerHTML = d[0];
    r.b2.innerHTML = d[1];
    r.b3.innerHTML = d[2];
    var c = d[3] || '';
    r.b1.className = 'aw-box ' + (c === 'hit' ? 'hit' : (c ? 'ok' : 'dim'));
    r.b2.className = 'aw-box ' + (c === 'hit' ? '' : (c ? 'ok' : 'dim'));
    r.b3.className = 'aw-box ' + (c === 'hit' ? 'ok' : (c ? 'ok' : 'dim'));
    if(c === 'hit'){
      r.b2.className = 'aw-box hit';
    }
  }
}

AW.init({
  title: '2018·数据结构（三） 上三角对称矩阵的压缩下标',
  subtitle: '12×12 对称矩阵 M · 只存上三角 m(i,j)（1≤i≤j≤12） · 行优先存入 C 语言数组 N（下标从 0 开始）',
  counterLabel: '已累计行数',
  intro: '点击「▶ 播放」，逐行累加元素个数，定位 m(6,6)。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>上三角逐行存放</b>：第 i 行共 13−i 个元素'));
    for(var i = 0; i < 6; i++){
      var card = buildRowCard();
      ROWS.push(card);
      wrap.appendChild(card.wrap);
    }
    CALC = AW.el('div', 'aw-row-label', '&nbsp;');
    wrap.appendChild(CALC);
    stage.appendChild(wrap);
    paintRows({ rows: [
      ['','','',''], ['','','',''], ['','','',''],
      ['','','',''], ['','','',''], ['','','',''],
    ]});
    CALC.innerHTML = '点击「下一步」开始逐行累加。';
  },

  render: function(stage, sn){
    paintRows(sn);
    CALC.innerHTML = sn.calc || '&nbsp;';
  },

  snaps: [
    { cls:'step', tag:'初始', log:'只存上三角：行 i 存 m(i,j)，j 从 i 到 12，共 13−i 个', count:0, calc:'m(6,6) 的下标 = 前 5 行元素总个数 + 0（C 语言 0 起下标）',
      rows:[['行1','','','dim'],['行2','','','dim'],['行3','','','dim'],['行4','','','dim'],['行5','','','dim'],['行6','','','dim']] },
    { cls:'step', tag:'行 1', log:'行 1 存 (1,1)~(1,12)：12 个，占 N[0..11]', count:1, calc:'累计 12 个 → 行 2 从 N[12] 开始',
      rows:[['行1','12 个','N[0..11]','hit'],['行2','','','dim'],['行3','','','dim'],['行4','','','dim'],['行5','','','dim'],['行6','','','dim']] },
    { cls:'step', tag:'行 2', log:'行 2 存 (2,2)~(2,12)：11 个，占 N[12..22]', count:2, calc:'累计 12+11=23 个 → 行 3 从 N[23] 开始',
      rows:[['行1','12 个','N[0..11]','ok'],['行2','11 个','N[12..22]','hit'],['行3','','','dim'],['行4','','','dim'],['行5','','','dim'],['行6','','','dim']] },
    { cls:'step', tag:'行 3', log:'行 3 存 (3,3)~(3,12)：10 个，占 N[23..32]', count:3, calc:'累计 23+10=33 个 → 行 4 从 N[33] 开始',
      rows:[['行1','12 个','N[0..11]','ok'],['行2','11 个','N[12..22]','ok'],['行3','10 个','N[23..32]','hit'],['行4','','','dim'],['行5','','','dim'],['行6','','','dim']] },
    { cls:'step', tag:'行 4', log:'行 4 存 (4,4)~(4,12)：9 个，占 N[33..41]', count:4, calc:'累计 33+9=42 个 → 行 5 从 N[42] 开始',
      rows:[['行1','12 个','N[0..11]','ok'],['行2','11 个','N[12..22]','ok'],['行3','10 个','N[23..32]','ok'],['行4','9 个','N[33..41]','hit'],['行5','','','dim'],['行6','','','dim']] },
    { cls:'step', tag:'行 5', log:'行 5 存 (5,5)~(5,12)：8 个，占 N[42..49]', count:5, calc:'前 5 行共 12+11+10+9+8 = 50 个 → 行 6 从 N[50] 开始',
      rows:[['行1','12 个','N[0..11]','ok'],['行2','11 个','N[12..22]','ok'],['行3','10 个','N[23..32]','ok'],['行4','9 个','N[33..41]','ok'],['行5','8 个','N[42..49]','hit'],['行6','','','dim']] },
    { cls:'ok', tag:'行 6 定位', log:'行 6 存 (6,6)~(6,12)：m(6,6) 是行 6 第 1 个元素 → 落在 N[50]', count:6, calc:'m(6,6) = 行 6 的第 1 个元素 → N[50]',
      rows:[['行1','12 个','N[0..11]','ok'],['行2','11 个','N[12..22]','ok'],['行3','10 个','N[23..32]','ok'],['行4','9 个','N[33..41]','ok'],['行5','8 个','N[42..49]','ok'],['行6','7 个','m66 是第 1 个 → N[50]','hit']] },
    { cls:'done', tag:'完成', log:'C 语言下标从 0 开始：m(6,6) 的下标 = 50 → 答案 A', count:6, done:true, calc:'答案：50 → 选 A',
      rows:[['行1','12 个','N[0..11]','ok'],['行2','11 个','N[12..22]','ok'],['行3','10 个','N[23..32]','ok'],['行4','9 个','N[33..41]','ok'],['行5','8 个','N[42..49]','ok'],['行6','7 个','N[50..56]','hit']] },
  ],

  result: {
    big: '下标 50',
    html: 'm(6,6) 前共 <b>12+11+10+9+8 = 50</b> 个元素，且 m(6,6) 是行 6 第 1 个元素；C 语言数组下标从 0 开始，故下标 = <b>50</b>，答案 <b>A</b>。记忆锚点：上三角行 i 共 <b>13−i</b> 个元素；0 起下标 = 前面元素总个数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
