<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-04 满形态二叉树结点总数 · 数树动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
  .tsvg{width:100%;max-width:560px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .tsvg .tedge{stroke:#5a7d8c;stroke-width:2.5px;transition:opacity .4s}
  .tsvg .tnode circle{transition:opacity .4s, fill .3s, stroke .3s}
  .tsvg .tnode text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:15px;
    text-anchor:middle;dominant-baseline:central;fill:#fff;transition:opacity .4s}
  .tsvg .tnode.leaf circle{fill:#2f9e44}
  .tsvg .tnode.internal circle{fill:#1b3a4b}
  .tsvg .tnode.hot circle{fill:#e07a2f;stroke:#b45309;stroke-width:3px}
  .tsvg .tnode.root circle{fill:#e63946}
  .tsvg .hidden-el{opacity:0}
  .counts{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .counts .cchip{background:#5a7d8c26;color:#1b3a4b;border:1.5px solid #5a7d8c66;border-radius:999px;
    padding:5px 15px;font-weight:800;font-size:14px;transition:opacity .4s}
  .counts .cchip.hot{background:#e07a2f1f;border-color:#e07a2f;color:#e07a2f}
  .counts .cchip.hidden-el{opacity:0}
  .tformula{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .tformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 2018-04 满形态二叉树 · 数结点动画（SVG） ==================
 * 题：非空完全二叉树，所有叶同层、每个非叶恰有 2 个孩子；k 个叶 → 结点总数？（答案 A：2k−1）
 * 演示：画一棵 4 叶的小树，数叶子、数度 2 结点，得 7 = 2×4−1，再推广成公式。 */

var NODES = [
  { id:'R',  x:260, y:50,  leaf:false, root:true, step:0 },
  { id:'P',  x:150, y:145, leaf:false, step:0 },
  { id:'Q',  x:370, y:145, leaf:false, step:0 },
  { id:'LL', x:85,  y:245, leaf:true,  step:0 },
  { id:'LR', x:215, y:245, leaf:true,  step:0 },
  { id:'RL', x:305, y:245, leaf:true,  step:0 },
  { id:'RR', x:435, y:245, leaf:true,  step:0 },
];
var EDGES = [
  { a:'R', b:'P',  step:0 }, { a:'R', b:'Q',  step:0 },
  { a:'P', b:'LL', step:0 }, { a:'P', b:'LR', step:0 },
  { a:'Q', b:'RL', step:0 }, { a:'Q', b:'RR', step:0 },
];
var SNAPS = [
  { cls:'shift', tag:'题设', count:0,
    log:'条件：所有叶结点在同一层、每个非叶结点都恰有 2 个孩子 → 每个结点要么是叶（度 0）要么是度 2，n₁ = 0。先拿一棵 4 叶小树实际数一遍。' },
  { cls:'ok', tag:'数叶子', count:1,
    log:'叶子在最底层（绿色）：LL、LR、RL、RR 共 k = 4 个。' },
  { cls:'ok', tag:'数度 2', count:2,
    log:'非叶结点每个恰有 2 个孩子 → 全是度 2 结点：P、Q 共 2 个，加上根 R 共 3 个 = k − 1，没有度 1 结点。' },
  { cls:'step', tag:'求和', count:3,
    log:'总结点 = 4 个叶子 + 3 个度 2 结点 = 7 = 2×4 − 1。' },
  { cls:'shift', tag:'找规律', count:3,
    log:'二叉树恒等式 n₀ = n₂ + 1 对任何二叉树成立；本题 n₁ = 0 → n₂ = k − 1。' },
  { cls:'shift', tag:'推广', count:3,
    log:'总结点 = n₀ + n₂ = k + (k − 1) = 2k − 1（与树高无关，只由叶数决定）。' },
  { cls:'step', tag:'排除选项', count:4,
    log:'A 2k−1 ✓；B 2k ✗（7 ≠ 8，丢了 −1）；C k² ✗（7 ≠ 16）；D 2^k−1 ✗ —— 那是把「叶数 k」错当「树高 h」：总结点 = 2^h − 1，而 k = 2^(h−1)，代回来仍是 2k−1。' },
  { cls:'done', tag:'完成', count:4, done:true,
    log:'T 的结点总数 = 2k − 1，选 A。' },
];

var svgEl, countBox, formulaBox;

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 520 300');
  svg.setAttribute('class', 'tsvg');
  EDGES.forEach(function(e){
    var A = null, B = null;
    NODES.forEach(function(n){ if (n.id === e.a) A = n; if (n.id === e.b) B = n; });
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y);
    ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
    ln.setAttribute('class', 'tedge');
    svg.appendChild(ln);
  });
  NODES.forEach(function(n){
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'tnode ' + (n.leaf ? 'leaf' : 'internal'));
    g.dataset.id = n.id; g.dataset.leaf = n.leaf ? '1' : '0'; g.dataset.root = n.root ? '1' : '0';
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 23);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y);
    t.textContent = n.id;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
  });
  stage.appendChild(svg);
  countBox = AW.el('div', 'counts');
  [
    { k:'leaf',  html:'叶子 k = 4', step:1 },
    { k:'deg2',  html:'度 2 结点 = 3', step:2 },
    { k:'total', html:'总结点 = 7', step:3 },
  ].forEach(function(o){
    var d = AW.el('div', 'cchip hidden-el', o.html);
    d.dataset.step = o.step; d.dataset.k = o.k;
    countBox.appendChild(d);
  });
  stage.appendChild(countBox);
  formulaBox = AW.el('div', 'tformula');
  stage.appendChild(formulaBox);
  svgEl = svg;
}

function render(stage, sn, i){
  [].forEach.call(svgEl.querySelectorAll('.tnode'), function(el){
    el.classList.remove('hot', 'root');
    if (i === 1 && el.dataset.leaf === '1') el.classList.add('hot');
    if (i === 2 && el.dataset.leaf === '0' && el.dataset.root === '0') el.classList.add('hot');
    if (i === 3 && el.dataset.root === '1') el.classList.add('root');
    if (i >= 4 && el.dataset.root === '1') el.classList.add('root');
  });
  [].forEach.call(countBox.querySelectorAll('.cchip'), function(el){
    var st = +el.dataset.step;
    el.classList.toggle('hidden-el', st > i);
    el.classList.remove('hot');
    if ((i === 1 && el.dataset.k === 'leaf') || (i === 2 && el.dataset.k === 'deg2') ||
        (i >= 3 && el.dataset.k === 'total' && i === 3)) el.classList.add('hot');
  });
  var formulas = [
    '',
    '',
    '',
    '总结点 = 4 + 3 = <code>7 = 2×4 − 1</code>',
    'n₁ = 0，且 n₀ = n₂ + 1　→　n₂ = k − 1',
    '总结点 = n₀ + n₂ = k + (k−1) = <code>2k − 1</code>',
    '2k − 1',
    'k 个叶 → <b>2k − 1</b> 个结点（选 A）',
  ];
  formulaBox.innerHTML = formulas[Math.min(i, formulas.length - 1)] || '';
}

AW.init({
  title: '2018-04　叶结点 k 个的满形态二叉树，结点总数？',
  subtitle: '考点：<code>二叉树的概念 · n₀ = n₂ + 1</code> · 所有叶同层 + 每个非叶恰 2 个孩子 → 只有度 0 / 度 2 结点',
  counterLabel: '步数',
  intro: '点击「▶ 播放」：数一棵 4 叶小树的叶子与度 2 结点，得 7 = 2×4−1，再推广到一般的 k。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '2k − 1（选 A）',
    html: '每个非叶结点都有 2 个孩子 ⇒ n₁ = 0；由二叉树恒等式 <code>n₀ = n₂ + 1</code> 得 n₂ = k − 1，<br>' +
      '总结点 = n₀ + n₂ = k + (k−1) = <b>2k − 1</b>。锚点：<b>只有度 0 / 度 2 结点的二叉树，总结点数 = 2×叶子数 − 1</b>（必为奇数）；D 的 2^k−1 是把叶数错当树高。',
  },
});
</script>
</body>
</html>
