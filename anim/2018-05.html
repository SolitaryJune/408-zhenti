<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-05 哈夫曼树构造与编码</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 当前森林：字符串数组 + 类别数组（'' 普通绿框 / 'ok' 新结点 / 'hit' 即将合并）
function forestHtml(items, cls){
  var row = AW.el('div', 'aw-cells');
  items.forEach(function(ch, i){
    var col = AW.el('div', 'aw-col');
    col.appendChild(AW.el('div', 'aw-ptr', ''));
    col.appendChild(AW.el('div', 'aw-box' + (cls && cls[i] ? ' ' + cls[i] : ''), ch));
    col.appendChild(AW.el('div', 'aw-idx', ''));
    row.appendChild(col);
  });
  return row.outerHTML;
}

function codeTable(){
  var rows = [
    ['a=6', '2', '00'], ['b=3', '4', '1011'], ['c=8', '2', '01'],
    ['d=2', '4', '1010'], ['e=10', '2', '11'], ['f=4', '3', '100'],
  ];
  var h = '<table style="border-collapse:collapse;margin:8px auto;font-size:13.5px">';
  h += '<tr><th style="border:1px solid #cbd5e1;padding:3px 10px;background:#f1f5f9">字符（权）</th>' +
       '<th style="border:1px solid #cbd5e1;padding:3px 10px;background:#f1f5f9">码长</th>' +
       '<th style="border:1px solid #cbd5e1;padding:3px 10px;background:#f1f5f9">编码</th></tr>';
  rows.forEach(function(r){
    h += '<tr><td style="border:1px solid #cbd5e1;padding:3px 10px">' + r[0] + '</td>' +
         '<td style="border:1px solid #cbd5e1;padding:3px 10px">' + r[1] + '</td>' +
         '<td style="border:1px solid #cbd5e1;padding:3px 10px"><b>' + r[2] + '</b></td></tr>';
  });
  h += '</table>';
  return h;
}

function mergeLine(text){
  return '<div style="text-align:center;font-size:13.5px;color:#334155;margin-top:8px">' + text + '</div>';
}

AW.init({
  title: '2018·数据结构（五） 哈夫曼树构造与编码',
  subtitle: '权值 a=6 b=3 c=8 d=2 e=10 f=4 · 每次合并权值最小的两棵 · 左 0 右 1',
  counterLabel: '已合并次数',
  intro: '点击「▶ 播放」，逐步合并构造哈夫曼树并写出编码。',

  snaps: [
    { cls:'step', tag:'初始', log:'6 个权值结点：a6、b3、c8、d2、e10、f4，等成一排待合并', count:0,
      html: forestHtml(['a6','b3','c8','d2','e10','f4']) + mergeLine('每次取当前权值<b>最小的两个</b>合并，新结点放回森林') },
    { cls:'shift', tag:'合并 1', log:'最小的两个：d2 与 b3 → 合并出新结点 5', count:1,
      html: forestHtml(['5','a6','c8','e10','f4'], ['ok','','','','']) + mergeLine('第 1 次合并：d2 + b3 → <b>5</b>') },
    { cls:'shift', tag:'合并 2', log:'剩下最小的两个：f4 与新结点 5 → 合并出新结点 9', count:2,
      html: forestHtml(['a6','c8','9','e10'], ['','','ok','']) + mergeLine('第 2 次合并：f4 + 5 → <b>9</b>（注意 4 要与刚合并出的 5 结合）') },
    { cls:'shift', tag:'合并 3', log:'a6 与 c8 合并出新结点 14', count:3,
      html: forestHtml(['9','e10','14'], ['','','ok']) + mergeLine('第 3 次合并：a6 + c8 → <b>14</b>') },
    { cls:'shift', tag:'合并 4', log:'9 与 e10 合并出新结点 19', count:4,
      html: forestHtml(['14','19'], ['','ok']) + mergeLine('第 4 次合并：9 + e10 → <b>19</b>') },
    { cls:'shift', tag:'合并 5', log:'14 与 19 合并出根 33，哈夫曼树建成', count:5,
      html: forestHtml(['33'], ['ok']) + mergeLine('第 5 次合并：14 + 19 → 根 <b>33</b>') },
    { cls:'ok', tag:'编码', log:'左分支为 0、右分支为 1，从根走到各字符写出编码', count:5,
      html: codeTable() + mergeLine('结构：33 →（14：a6、c8）｜（19：9：f4、5：d2、b3｜e10）') },
    { cls:'ok', tag:'对照选项', log:'按 a,b,c,d,e,f 顺序：00, 1011, 01, 1010, 11, 100，与选项 A 一致', count:5,
      html: codeTable() + mergeLine('WPL = 6×2 + 3×4 + 8×2 + 2×4 + 10×2 + 4×3 = <b>80</b>（最优）') },
    { cls:'done', tag:'完成', log:'WPL=80 为最优且是前缀码 → 答案 A', count:5, done:true,
      html: codeTable() + mergeLine('B 的 WPL=99、D 的 WPL=86 均非最优；C 中 a=10 是 b=1011 的前缀') },
  ],

  result: {
    big: '答案 A',
    html: '合并序列：2+3→5、4+5→9、6+8→14、9+10→19、14+19→33；编码 <b>00, 1011, 01, 1010, 11, 100</b>，WPL = 80 最优。记忆锚点：哈夫曼编码必为<b>前缀码</b>，且 WPL 最小——两条都验才算数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
