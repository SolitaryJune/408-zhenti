<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-06 二叉排序树的大小关系</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/推理链类题目动画：BST 中序定序推理链
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：中序遍历即升序',
    cls: 'key',
    body: '<p>二叉排序树的定义：左子树所有结点 &lt; 根 &lt; 右子树所有结点（递归成立）。因此 <b>中序遍历（左·根·右）得到严格递增序列</b>——求大小关系就是求中序序列，不必逐对猜。</p>' },
  { title: '从图读出树形',
    cls: 'key',
    body: '<p>按层高与横向位置：最高处 <code>x1</code> 是根；<code>x2</code> 在其右下 → x1 的<b>右</b>孩子；<code>x3</code> 在 x2 左下 → x2 的<b>左</b>孩子；<code>x4</code> 在 x3 右下 → x3 的<b>右</b>孩子；<code>x5</code> 在 x4 左下 → x4 的<b>左</b>孩子。整棵树是一条之字形链。</p>' },
  { title: '中序遍历',
    cls: 'good',
    body: '<p>左·根·右走一遍：x1（根，无左子树）→ x2 的左子树出 x3 → x3 的右子树里先 x4 的左孩子 <b>x5</b>、再 <b>x4</b> → 最后 x2。<br>中序序列：<code>x1, x3, x5, x4, x2</code><br>即 <b>x1 &lt; x3 &lt; x5 &lt; x4 &lt; x2</b></p>' },
  { title: '排除 A、B',
    cls: 'bad',
    body: '<p>A <code>x1&lt;x2&lt;x5</code>：x5 在 x2 的子树里，而 x5 最终落在 x2 左子树一侧的深处——x5 &lt; x2，错。<br>B <code>x1&lt;x4&lt;x5</code>：x5 是 x4 的<b>左</b>孩子，x5 &lt; x4，错。</p>' },
  { title: '排除 D、确认 C',
    cls: 'good',
    body: '<p>D <code>x4&lt;x3&lt;x5</code>：x4 在 x3 的右子树，x3 &lt; x4，错。<br>C <code>x3&lt;x5&lt;x4</code>：x5 是 x4 左孩子（x5 &lt; x4）且在 x3 右子树（x3 &lt; x5），与排序完全一致 ✓</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>BST 的大小关系一律用中序序列裁决</b>——先写出完整中序，再逐条核对选项；祖先—后代的大小关系由「在谁的左/右子树里」决定。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018·数据结构（六） 二叉排序树中谁大谁小',
  subtitle: 'BST 一条之字形链：x1—x2—x3—x4—x5 · 用中序遍历定序',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '中序序列 <b>x1 &lt; x3 &lt; x5 &lt; x4 &lt; x2</b>，唯一正确的选项是 C <code>x3&lt;x5&lt;x4</code>。记忆锚点：BST + 大小关系 → <b>先求中序，再核对</b>；x5 在 x2 左子树里所以 x5 &lt; x2，A 因此必错。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
