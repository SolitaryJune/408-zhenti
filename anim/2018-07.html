<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-07 拓扑序列判定</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var INDROW, EDGEBOX, OUTROW, CALC;

// 有向边与初始入度（顶点 1~6）
var EDGES = [[1,2],[1,3],[2,3],[2,6],[3,4],[5,2],[5,4],[6,4]];

function buildInRow(){
  var row = AW.el('div', 'aw-cells');
  for(var v = 1; v <= 6; v++){
    var col = AW.el('div', 'aw-col');
    col.appendChild(AW.el('div', 'aw-ptr', ''));
    var box = AW.el('div', 'aw-box', '');
    box.id = 'indBox' + v;
    col.appendChild(box);
    col.appendChild(AW.el('div', 'aw-idx', '点' + v));
    row.appendChild(col);
  }
  return row;
}

function buildEdgeBox(){
  var box = AW.el('div', 'aw-cells');
  box.id = 'edgeBox';
  return box;
}

function buildOutRow(){
  var row = AW.el('div', 'aw-cells');
  row.id = 'outRow';
  return row;
}

function renderAll(sn){
  // 入度行
  for(var v = 1; v <= 6; v++){
    var b = document.getElementById('indBox' + v);
    b.innerHTML = String(sn.indeg[v - 1]);
    b.className = 'aw-box' + (sn.removed[v - 1] ? ' dim' : '') + (sn.bad === v ? ' miss' : (sn.cur === v ? ' hit' : ''));
  }
  // 边状态
  var eb = document.getElementById('edgeBox');
  eb.innerHTML = '';
  EDGES.forEach(function(e, i){
    var s = AW.el('div', 'aw-col');
    s.appendChild(AW.el('div', 'aw-ptr', ''));
    var cls = sn.edgeDel[i] ? ' ok' : (sn.edgeCur[i] ? ' hit' : '');
    s.appendChild(AW.el('div', 'aw-box' + cls, e[0] + '→' + e[1]));
    s.appendChild(AW.el('div', 'aw-idx', ''));
    eb.appendChild(s);
  });
  // 输出序列
  var orow = document.getElementById('outRow');
  orow.innerHTML = '';
  (sn.out || []).forEach(function(ch, i){
    var col = AW.el('div', 'aw-col');
    col.appendChild(AW.el('div', 'aw-ptr', ''));
    col.appendChild(AW.el('div', 'aw-box hit', String(ch)));
    col.appendChild(AW.el('div', 'aw-idx', String(i + 1)));
    orow.appendChild(col);
  });
  if(!(sn.out || []).length){
    var col = AW.el('div', 'aw-col');
    col.appendChild(AW.el('div', 'aw-ptr', ''));
    col.appendChild(AW.el('div', 'aw-box dim', '&nbsp;'));
    col.appendChild(AW.el('div', 'aw-idx', '1'));
    orow.appendChild(col);
  }
  CALC.innerHTML = sn.calc || '&nbsp;';
}

AW.init({
  title: '2018·数据结构（七） 哪个不是拓扑序列',
  subtitle: '边：1→2, 1→3, 2→3, 2→6, 3→4, 5→2, 5→4, 6→4 · 每步只能输出<b>入度为 0</b> 的顶点',
  counterLabel: '已输出顶点数',
  intro: '点击「▶ 播放」，用入度法模拟 D 断链、A 走通。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>各顶点当前入度</b>（灰 = 已输出，红 = 本步不可输出，实心 = 当前尝试）'));
    INDROW = buildInRow();
    wrap.appendChild(INDROW);
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>边状态</b>（绿 = 已删除）'));
    EDGEBOX = buildEdgeBox();
    wrap.appendChild(EDGEBOX);
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>输出序列</b>'));
    OUTROW = buildOutRow();
    wrap.appendChild(OUTROW);
    CALC = AW.el('div', 'aw-row-label', '&nbsp;');
    wrap.appendChild(CALC);
    stage.appendChild(wrap);
    renderAll({
      indeg: [0,2,2,3,0,1], removed: [0,0,0,0,0,0],
      edgeDel: [0,0,0,0,0,0,0,0], edgeCur: [0,0,0,0,0,0,0,0],
      out: [], calc: '初始入度：1:0、2:2、3:2、4:3、5:0、6:1 → 可选顶点只有 1 和 5',
    });
  },

  render: function(stage, sn){ renderAll(sn); },

  snaps: [
    { cls:'step', tag:'初始', log:'初始入度 1:0、2:2、3:2、4:3、5:0、6:1，只能先输出 1 或 5', count:0,
      indeg:[0,2,2,3,0,1], removed:[0,0,0,0,0,0],
      edgeDel:[0,0,0,0,0,0,0,0], edgeCur:[0,0,0,0,0,0,0,0], out:[],
      calc:'拓扑排序规则：每步输出当前入度为 0 的顶点，并删除其全部出边' },
    { cls:'step', tag:'D·第 1 步', log:'D 先输出 5：删 5→2、5→4，2 的入度降为 1', count:1,
      indeg:[0,1,2,2,0,1], removed:[0,0,0,0,1,0],
      edgeDel:[0,0,0,0,0,1,1,0], edgeCur:[0,0,0,0,0,1,1,0], out:[5],
      calc:'输出 5 ✓（删除边 5→2、5→4）' },
    { cls:'miss', tag:'D·断链', log:'D 下一个要输出 2：但 2 的入度 = 1（边 1→2 还在）→ 不可输出！', count:1,
      indeg:[0,1,2,2,0,1], removed:[0,0,0,0,1,0],
      edgeDel:[0,0,0,0,0,1,1,0], edgeCur:[0,0,0,0,0,0,0,0], out:[5],
      calc:'轮到顶点 2：入度 1 ≠ 0 → 无法输出，D 不是拓扑序列 ✗',
      bad:2 },
    { cls:'step', tag:'A·第 1 步', log:'换 A 检验：先输出 1，删 1→2、1→3', count:1,
      indeg:[0,1,1,3,0,1], removed:[1,0,0,0,0,0],
      edgeDel:[1,1,0,0,0,0,0,0], edgeCur:[1,1,0,0,0,0,0,0], out:[1],
      calc:'输出 1 ✓（2 剩 1→2 未删前的入度：1；3 剩 1）' },
    { cls:'step', tag:'A·第 2 步', log:'A 第二个输出 5：删 5→2、5→4，2 的入度归 0', count:2,
      indeg:[0,0,1,2,0,1], removed:[1,0,0,0,1,0],
      edgeDel:[1,1,0,0,0,1,1,0], edgeCur:[0,0,0,0,0,1,1,0], out:[1,5],
      calc:'输出 5 ✓（删 5→2、5→4）→ 2 可选' },
    { cls:'step', tag:'A·第 3 步', log:'A 第三个输出 2：删 2→3、2→6，3、6 的入度归 0', count:3,
      indeg:[0,0,0,2,0,0], removed:[1,1,0,0,1,0],
      edgeDel:[1,1,1,1,0,1,1,0], edgeCur:[0,0,1,1,0,0,0,0], out:[1,5,2],
      calc:'输出 2 ✓（删 2→3、2→6）→ 3、6 可选' },
    { cls:'step', tag:'A·第 4~6 步', log:'3 → 6 → 4 依次输出（每次 4 的入度减 1），全部输出完毕', count:6,
      indeg:[0,0,0,0,0,0], removed:[1,1,1,1,1,1],
      edgeDel:[1,1,1,1,1,1,1,1], edgeCur:[0,0,0,0,1,0,0,1], out:[1,5,2,3,6,4],
      calc:'输出 3（删 3→4）→ 6（删 6→4）→ 4 ✓，A 是拓扑序列' },
    { cls:'done', tag:'完成', log:'A、B、C 均可走通；D 在输出 2 时断链 → 答案 D', count:6, done:true,
      indeg:[0,0,0,0,0,0], removed:[1,1,1,1,1,1],
      edgeDel:[1,1,1,1,1,1,1,1], edgeCur:[0,0,0,0,0,0,0,0], out:[1,5,2,3,6,4],
      calc:'结论：D 不是拓扑序列 → 答案 D' },
  ],

  result: {
    big: '答案 D',
    html: '拓扑序列每步必须输出<b>当前入度为 0</b> 的顶点。D 第一步输出 5 后，顶点 2 的入度仍为 1（<b>1→2 未删</b>），下一步却要输出 2 —— 断链。A、B、C 逐步模拟均可行。记忆锚点：<b>判拓扑序列 = 逐步删边模拟入度</b>，不是只看相邻元素有没有边。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
