<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-07 拓扑序列判定 · 删边模拟动画</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .dsvg{width:100%;max-width:720px;display:block;margin:0 auto;background:#f8fafc;
    border:1px solid #1b3a4b38;border-radius:12px}
  .dsvg .aedge{stroke:#5a7d8c;stroke-width:2.4px;transition:stroke .3s, opacity .3s}
  .dsvg .aedge.del{stroke:#cbd5e1;opacity:.5}
  .dsvg .aedge.bad{stroke:#dc2626;stroke-width:3px}
  .dsvg .dnode circle{fill:#fff;stroke:#1b3a4b;stroke-width:2.5px;transition:fill .3s}
  .dsvg .dnode text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:16px;
    text-anchor:middle;dominant-baseline:central;fill:#1b3a4b;transition:fill .3s}
  .dsvg .dnode.done circle{fill:#16a34a;stroke:#16a34a}
  .dsvg .dnode.done text{fill:#fff}
  .dsvg .dnode.hit circle{fill:#e07a2f;stroke:#e07a2f}
  .dsvg .dnode.hit text{fill:#fff}
  .dsvg .dnode.viol circle{fill:#dc2626;stroke:#dc2626}
  .dsvg .dnode.viol text{fill:#fff}
  .dsvg .ind{font-family:JetBrains Mono,Menlo,monospace;font-size:12.5px;font-weight:800;
    text-anchor:middle;fill:#2563eb}
  .dsvg .ind.ok{fill:#16a34a}
  .dsvg .ind.viol{fill:#dc2626}
  .opthead{margin-top:4px;text-align:center;font-size:15px;font-weight:800;color:#1b3a4b}
  .opthead .vd{padding:2px 12px;border-radius:999px;margin-left:10px;font-size:13.5px}
  .opthead .vd.pend{background:#ede9fe;color:#6d28d9}
  .opthead .vd.ok{background:#dcfce7;color:#15803d}
  .opthead .vd.miss{background:#fee2e2;color:#b91c1c}
  .cells-wrap{display:flex;justify-content:center;margin-top:8px}
  .statline{margin-top:8px;text-align:center;font-size:13.5px;font-weight:700;color:#334155}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 2018-07 拓扑序列判定（SVG 有向图 + cellRow 删边模拟） ==================
 * 题：8 条边 1→2,1→3,2→3,2→6,3→4,5→2,5→4,6→4，哪个不是拓扑序列？（答案 D）
 * 演示：Kahn 判定法 —— 每个位置的顶点在输出那一刻入度必须为 0；逐选项模拟，D 在第 2 位断链。 */

var VERTS = [
  { id:'1', x:110, y:80 },
  { id:'3', x:560, y:80 },
  { id:'2', x:330, y:215 },
  { id:'4', x:600, y:300 },
  { id:'5', x:110, y:360 },
  { id:'6', x:360, y:385 },
];
var ARCS = [
  { u:'1', v:'3' }, { u:'1', v:'2' }, { u:'2', v:'3' }, { u:'2', v:'6' },
  { u:'3', v:'4' }, { u:'5', v:'2' }, { u:'5', v:'4' }, { u:'6', v:'4' },
];
var OPTS = {
  'A': { seq:['1','5','2','3','6','4'] },
  'B': { seq:['5','1','2','6','3','4'] },
  'C': { seq:['5','1','2','3','6','4'] },
  'D': { seq:['5','2','1','6','3','4'] },
};
/* 每步：opt=null 显示初始图；否则模拟 OPTS[opt] 前 shown 个位置 */
var SNAPS = [
  { cls:'shift', tag:'题面 · 初始入度', count:0, opt:null, shown:0,
    log:'有向图 8 条边。初始入度：1:0、2:2（1→2、5→2）、3:2（1→3、2→3）、4:3（3→4、5→4、6→4）、5:0、6:1（2→6）。入度为 0 的只有 1 和 5。' },
  { cls:'step', tag:'判定规则', count:0, opt:null, shown:0,
    log:'拓扑序判定（Kahn 法）：每输出一个顶点就删掉它的全部出边；序列中每个位置的顶点，在输出那一刻入度必须已是 0。下面逐选项模拟。' },
  { cls:'step', tag:'A · 前半', count:3, opt:'A', shown:3,
    log:'A = 1,5,2,3,6,4。输出 1（入度 0 ✓，删 1→2、1→3）→ 输出 5（✓，删 5→2、5→4）→ 输出 2（1、5 都已删，入度 0 ✓）。前 3 位合法。' },
  { cls:'ok', tag:'A · 后半 ✓', count:6, opt:'A', shown:6,
    log:'删 2→3、2→6 后 3、6 入度归 0 → 输出 3（删 3→4）→ 输出 6（删 6→4）→ 输出 4 ✓。A 是合法拓扑序列。', ribbon:{k:1,ok:true} },
  { cls:'step', tag:'B · 前半', count:3, opt:'B', shown:3,
    log:'B = 5,1,2,6,3,4。输出 5（入度 0 ✓）→ 输出 1（✓）→ 输出 2（1、5 已删 ✓）。前 3 位合法。' },
  { cls:'ok', tag:'B · 后半 ✓', count:6, opt:'B', shown:6,
    log:'输出 6（2→6 已删 ✓）→ 输出 3（1→3、2→3 已删 ✓）→ 输出 4 ✓。B 合法。', ribbon:{k:2,ok:true} },
  { cls:'step', tag:'C · 前半', count:3, opt:'C', shown:3,
    log:'C = 5,1,2,3,6,4。输出 5（✓）→ 输出 1（✓）→ 输出 2（✓）。前 3 位合法。' },
  { cls:'ok', tag:'C · 后半 ✓', count:6, opt:'C', shown:6,
    log:'输出 3（✓ —— 3 先于 6 也行，二者互不依赖）→ 输出 6（✓）→ 输出 4 ✓。C 合法。', ribbon:{k:3,ok:true} },
  { cls:'miss', tag:'D · 断链 ✗', count:2, opt:'D', shown:2,
    log:'D = 5,2,1,6,3,4。输出 5（✓，删 5→2、5→4）。轮到 2：此时 1 还没输出，边 1→2 还在 → 2 的入度 = 1 ≠ 0，不能输出！', ribbon:{k:4,ok:false} },
  { cls:'miss', tag:'D · 结论', count:2, opt:'D', shown:2,
    log:'D 在第 2 位就断链，后面不用再看 —— D 不是该图的拓扑序列。' },
  { cls:'done', tag:'完成', count:6, opt:'D', shown:2, done:true,
    log:'A、B、C 模拟全部走通，D 断链 → 答案 D。' },
];

var svgEl, nodeEls = {}, indEls = {}, edgeEls = [], headBox, cellsBox, statBox;

function indeg(v, removed){
  var d = 0;
  ARCS.forEach(function(e){ if (e.v === v && removed.indexOf(e.u) < 0) d++; });
  return d;
}
/* 模拟某选项前 shown 个位置：返回已确认输出的 removed、断链位置 violation */
function optState(optKey, shown){
  var seq = OPTS[optKey].seq;
  var removed = [], violation = -1;
  for (var t = 0; t < shown; t++){
    if (indeg(seq[t], removed) !== 0){ violation = t; break; }
    removed.push(seq[t]);
  }
  return { seq: seq, removed: removed, violation: violation };
}

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 700 430');
  svg.setAttribute('class', 'dsvg');
  var defs = document.createElementNS(svgNS, 'defs');
  [['idle', '#5a7d8c'], ['del', '#cbd5e1'], ['bad', '#dc2626']].forEach(function(m){
    var mk = document.createElementNS(svgNS, 'marker');
    mk.setAttribute('id', 'arr-' + m[0]);
    mk.setAttribute('viewBox', '0 0 10 10');
    mk.setAttribute('refX', '9'); mk.setAttribute('refY', '5');
    mk.setAttribute('markerWidth', '6.5'); mk.setAttribute('markerHeight', '6.5');
    mk.setAttribute('orient', 'auto');
    var p = document.createElementNS(svgNS, 'path');
    p.setAttribute('d', 'M0,0 L10,5 L0,10 z');
    p.setAttribute('fill', m[1]);
    mk.appendChild(p); defs.appendChild(mk);
  });
  svg.appendChild(defs);
  var byId = {};
  VERTS.forEach(function(v){ byId[v.id] = v; });
  var R = 24;
  ARCS.forEach(function(e){
    var U = byId[e.u], V = byId[e.v];
    var dx = V.x - U.x, dy = V.y - U.y, len = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / len, uy = dy / len;
    var x1 = U.x + ux * R, y1 = U.y + uy * R;
    var x2 = V.x - ux * (R + 7), y2 = V.y - uy * (R + 7);
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
    ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
    ln.setAttribute('class', 'aedge');
    ln.setAttribute('marker-end', 'url(#arr-idle)');
    ln.dataset.u = e.u; ln.dataset.v = e.v;
    svg.appendChild(ln);
    edgeEls.push(ln);
  });
  VERTS.forEach(function(v){
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'dnode');
    g.dataset.id = v.id;
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', v.x); c.setAttribute('cy', v.y); c.setAttribute('r', R);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', v.x); t.setAttribute('y', v.y);
    t.textContent = v.id;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
    nodeEls[v.id] = g;
    var ind = document.createElementNS(svgNS, 'text');
    ind.setAttribute('x', v.x - 30); ind.setAttribute('y', v.y - 26);
    ind.setAttribute('class', 'ind');
    ind.dataset.id = v.id;
    svg.appendChild(ind);
    indEls[v.id] = ind;
  });
  stage.appendChild(svg);
  headBox = AW.el('div', 'opthead', '&nbsp;');
  stage.appendChild(headBox);
  cellsBox = AW.el('div', 'cells-wrap');
  stage.appendChild(cellsBox);
  statBox = AW.el('div', 'statline', '&nbsp;');
  stage.appendChild(statBox);
  svgEl = svg;
}

function render(stage, sn, i){
  var st = sn.opt ? optState(sn.opt, sn.shown) : null;
  var removed = st ? st.removed : [];
  var violation = st ? st.violation : -1;
  var curKey = st ? (violation >= 0 ? st.seq[violation] : (removed.length ? removed[removed.length - 1] : null)) : null;
  // 顶点状态与入度徽章
  VERTS.forEach(function(v){
    var g = nodeEls[v.id];
    g.classList.remove('done', 'hit', 'viol');
    var ind = indEls[v.id];
    ind.classList.remove('ok', 'viol');
    if (!st){
      ind.textContent = '入度' + indeg(v.id, []);
      return;
    }
    if (removed.indexOf(v.id) >= 0){ g.classList.add('done'); ind.textContent = '✓'; ind.classList.add('ok'); }
    else if (violation >= 0 && v.id === st.seq[violation]){ g.classList.add('viol'); ind.textContent = '入度' + indeg(v.id, removed) + '≠0'; ind.classList.add('viol'); }
    else { ind.textContent = '入度' + indeg(v.id, removed); }
  });
  // 边状态：起点已输出 → 删除；指向断链顶点且起点未输出 → 红
  edgeEls.forEach(function(ln){
    ln.classList.remove('del', 'bad');
    var mk = 'idle';
    if (st){
      if (removed.indexOf(ln.dataset.u) >= 0){ ln.classList.add('del'); mk = 'del'; }
      else if (violation >= 0 && ln.dataset.v === st.seq[violation]){ ln.classList.add('bad'); mk = 'bad'; }
    }
    ln.setAttribute('marker-end', 'url(#arr-' + mk + ')');
  });
  // 选项标题 + 序号格 + 状态行
  if (!sn.opt){
    headBox.innerHTML = '初始：入度为 0 的顶点 = {1, 5}';
    cellsBox.innerHTML = '';
    statBox.innerHTML = '规则：每输出一个顶点 → 删除其全部出边（灰）。绿 = 已输出，红 = 输出时断链。';
    return;
  }
  var seq = st.seq;
  var vd = violation >= 0 ? '<span class="vd miss">✗ 第 ' + (violation + 1) + ' 位断链</span>'
                          : (removed.length === seq.length ? '<span class="vd ok">✓ 合法拓扑序列</span>' : '<span class="vd pend">模拟中…</span>');
  headBox.innerHTML = '选项 <b>' + sn.opt + '</b>：' + seq.join(', ') + vd;
  var classes = seq.map(function(_, t){
    if (violation >= 0 && t === violation) return 'miss';
    if (t < removed.length) return 'ok';
    return '';
  });
  var ptrPos = violation >= 0 ? violation : removed.length - 1;
  cellsBox.innerHTML = '';
  var ptrMap = ptrPos >= 0 ? {} : null;
  if (ptrMap) ptrMap[ptrPos + 1] = '▼ 检查';
  cellsBox.appendChild(AW.cellRow(seq, classes, ptrMap, 1));
  var stats = [];
  stats.push('已输出 {' + (removed.join(', ') || '—') + '}');
  if (violation >= 0) stats.push('顶点 ' + seq[violation] + ' 当前入度 = ' + indeg(seq[violation], removed) + ' ≠ 0 → 断链（红边 ' + redArcOf(seq[violation], removed) + ' 未删）');
  else stats.push('每个位置输出时入度都为 0 → ' + (removed.length === seq.length ? '合法 ✓' : '继续…'));
  statBox.innerHTML = stats.join('　｜　');
}

function redArcOf(v, removed){
  var names = [];
  ARCS.forEach(function(e){ if (e.v === v && removed.indexOf(e.u) < 0) names.push(e.u + '→' + e.v); });
  return names.join('、');
}

AW.init({
  title: '2018-07　哪个不是拓扑序列？',
  subtitle: '考点：<code>图的应用 · 拓扑排序</code> · 边：1→2, 1→3, 2→3, 2→6, 3→4, 5→2, 5→4, 6→4 —— 逐选项删边模拟',
  counterLabel: '已核对位置',
  ribbonTitle: '选项判定（✓ 合法 / ✗ 违规）',
  intro: '点击「▶ 播放」：A/B/C 逐位核对入度，看 D 在第 2 位如何断链。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 D',
    html: '拓扑序列的判定：每输出一个顶点就删其全部出边，<b>每个位置输出时入度必须为 0</b>。<br>' +
      'A、B、C 逐步模拟均走通（3 与 6 谁先都行）；D 第 1 位输出 5 后，顶点 2 的入度仍是 1（<b>1→2 未删</b>），第 2 位却要输出 2 —— 断链。<br>' +
      '锚点：判拓扑序列 = <b>逐步删边模拟入度</b>，不能只看相邻元素有没有边。',
  },
});
</script>
</body>
</html>
