<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-12 冯·诺依曼机为什么用二进制</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：三条说法是不是"二进制的理由"',
    cls: 'key',
    body: '<p>冯·诺依曼机数据用二进制编码，题干给了三条理由 I、II、III，要求逐条核对真伪再组合选项。这类题的陷阱是混进一条"听着像但站不住"的伪理由，所以要一条一条过。</p>' },
  { title: '判断 I：二进制的运算规则简单',
    cls: 'good',
    body: '<p><b>成立</b>。只有 <code>0</code>、<code>1</code> 两个数码，加法只有"逢二进一"一种套路，运算规则远比十进制简单，开关电路就能实现。</p>' },
  { title: '判断 II：制造两个稳态的器件较容易',
    cls: 'good',
    body: '<p><b>成立</b>。让器件稳定处于"高电平/低电平"两个状态容易做到且抗干扰强；要造十个稳定状态的器件非常困难。物理上"两稳态"最省事，这是最根本的一条。</p>' },
  { title: '判断 III：便于用逻辑门实现算术运算',
    cls: 'good',
    body: '<p><b>成立</b>。0/1 恰好对应逻辑代数的"假/真"，加、减、乘、除都能化成与、或、非等门电路的组合，算术与逻辑运算共用一套电路。</p>' },
  { title: '组合选项：三条全成立',
    cls: 'step',
    body: '<p>三条没有一条是伪命题，全选 → <code>I、II和III</code>。A（仅I、II）漏 III，B（仅I、III）漏 II，C（仅II、III）漏 I，逐一排除。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>规则简单 + 器件易造 + 门电路可实现</b>——同一件事的三个侧面，缺一不可。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '冯·诺依曼机采用二进制的三大原因',
  subtitle: '考点：计算机系统层次结构 · 逐条核对 I / II / III',
  counterLabel: '推理步',
  ribbonTitle: '推理进度（✓ 成立 / ✗ 不成立）',
  intro: '点击「▶ 播放」逐条核对三个说法。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: 'I、II、III <b>三条全部正确</b>。记忆锚点：<b>运算规则简单 + 双稳态器件易造 + 逻辑门实现算术运算</b>，缺一不可，A、B、C 全排除。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
