<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-13 补码真值还原与 x−y 的机器数</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先还原真值，再做减法',
    cls: 'key',
    body: '<p>x 的机器数 <code>FFFF FFDFH</code>、y 的机器数 <code>0000 0041H</code>，都是 32 位补码。路线：求 x、y 的真值 → 算 x−y → 把结果写回补码机器数。</p>' },
  { title: '还原 x：取反加一',
    cls: 'good',
    body: '<p><code>FFFF FFDFH</code> 最高位是 1，负数。对全 32 位取反：<code>0000 0020H</code>，加一：<code>0000 0021H</code> = 33 → x = <b>−33</b>。（选项 A、D 的 x = −65 是求补出错；−65 的补码其实是 <code>FFFF FFBFH</code>。）</p>' },
  { title: '还原 y：正数直接读',
    cls: 'good',
    body: '<p><code>0000 0041H</code> 最高位 0，正数照抄：41H = 4×16 + 1 = <b>65</b>。</p>' },
  { title: '算 x − y = −98',
    cls: 'step',
    body: '<p>x − y = −33 − 65 = <b>−98</b>。int 范围约 −21 亿 ～ +21 亿，−98 远在界内，<b>不会溢出</b>——选项 A 的"溢出"是干扰。</p>' },
  { title: '−98 写回 32 位补码',
    cls: 'step',
    body: '<p>98 = <code>0000 0062H</code>；按位取反 → <code>FFFF FF9DH</code>；末位加一 → <code>FFFF FF9EH</code>。选项 B 的 <code>FFFF FF9DH</code> 正是"忘了加一"的错值。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>x = −33，y = 65，x−y 的机器数 <code>FFFF FF9EH</code>，答案选 <b>C</b>。记忆锚点：机器数 ↔ 真值，两个方向都是"取反加一"。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '补码真值还原与 x−y 的机器数',
  subtitle: 'x = <code>FFFF FFDFH</code> · y = <code>0000 0041H</code> · 32 位补码',
  counterLabel: '推理步',
  ribbonTitle: '推理进度（✓ 成立 / ✗ 不成立）',
  intro: '点击「▶ 播放」逐步推演。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: 'x = <b>−33</b>，y = <b>65</b>，x−y = −98，补码机器数 <code>FFFF FF9EH</code>。易错点：<code>FFDF</code> 不是 −65；取反之后<b>必须加一</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
