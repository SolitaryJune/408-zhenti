<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-14 IEEE 754 单精度最小规格化正数</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：盯住"规格化"三个字',
    cls: 'key',
    body: '<p>单精度格式 = 1 位数符 + 8 位阶码（移码，偏置 127）+ 23 位尾数，规格化数隐含首位 1，写成 <code>1.M × 2^E</code>。要"最小的正数"：指数尽量小、尾数取最小 1.0。</p>' },
  { title: '阶码字段全 0 不能用',
    cls: 'bad',
    body: '<p>8 位阶码字段有两个保留值：全 0 保留给 <b>±0 和非规格化小数</b>，全 1 保留给 <b>±∞ 和 NaN</b>。所以规格化数的阶码字段最小只能取 <code>0000 0001</code>，不能是 0。</p>' },
  { title: '换算真实指数 E = −126',
    cls: 'good',
    body: '<p>阶码字段 = 1，偏置 127：真实指数 E = 1 − 127 = <b>−126</b>。尾数位全 0 时尾数最小 = 1.0。于是最小规格化正数 = <code>1.0 × 2^-126</code>。</p>' },
  { title: '排除 B：2^-127 的来历',
    cls: 'bad',
    body: '<p><code>2^-127</code> 错在把"字段全 0"当成可用指数（0 − 127 = −127），或者把偏置关系弄反——字段 0 根本不表示规格化数。</p>' },
  { title: '排除 D：2^-149 是非规格化的答案',
    cls: 'bad',
    body: '<p><code>2^-149 = 2^-126 × 2^-23</code>，是<b>最小非规格化正数</b>（尾数最小 0.00…01）。题目问规格化数，D 是"答到了隔壁题"。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A</b>：<code>1.0 × 2^-126</code>。记忆锚点：单精度规格化指数范围 <b>−126 ～ +127</b>，下限对应阶码字段 0000 0001。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'IEEE 754 单精度的最小规格化正数',
  subtitle: '1 数符 + 8 阶码（偏置 127）+ 23 尾数 · 保留值：阶码全 0 / 全 1',
  counterLabel: '推理步',
  ribbonTitle: '推理进度（✓ 成立 / ✗ 不成立）',
  intro: '点击「▶ 播放」逐步推演。',
  snaps: snaps,
  result: {
    big: '答案 A（1.0×2^-126）',
    html: '最小规格化正数 = <code>1.0 × 2^-126</code>（阶码字段 1，E = 1 − 127 = −126）。对照记忆：<code>2^-149</code> 是最小<b>非规格化</b>正数，<code>2^-127</code> 来自"把字段 0 当指数"的误解。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
