<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-21 提高同步总线数据传输率的手段</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：传输率的三个因子',
    cls: 'key',
    body: '<p>同步总线数据传输率 ≈ <b>工作频率 × 总线宽度 × 有效数据占比</b>。判断四条措施，就看它是否做大其中一个因子；为省资源做的妥协通常不提速。</p>' },
  { title: 'I. 增加总线宽度 → 有效',
    cls: 'good',
    body: '<p>数据线从 32 根加到 64 根，一个总线周期并行传送的位数翻倍 → <b>能提高</b>传输率。</p>' },
  { title: 'II. 提高总线工作频率 → 有效',
    cls: 'good',
    body: '<p>单位时间内的总线周期数增多，每秒传的"批数"更多 → <b>能提高</b>传输率。</p>' },
  { title: 'III. 支持突发传输 → 有效',
    cls: 'good',
    body: '<p>一次地址相位之后连续传送多个数据字，省掉反复传地址的开销，提高有效数据占比 → <b>能提高</b>传输率。</p>' },
  { title: 'IV. 地址/数据线复用 → 无效',
    cls: 'bad',
    body: '<p>同一组信号线分时传地址和数据，目的是<b>减少引脚、降低成本</b>；地址相位期间数据线传不了数据，非但不提速，反而可能拖慢 → <b>不能提高</b>传输率。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>I、II、III 有效，IV 无效 → 答案选 <b>B</b>（仅 I、II、III）。记忆锚点：复用省引脚不省时间；A 的错误是漏了突发传输，D 的错误是把复用当提速手段。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '提高同步总线数据传输率的手段',
  subtitle: '传输率 ≈ 频率 × 宽度 × 有效数据占比 · 逐条判断 I ～ IV',
  counterLabel: '推理步',
  ribbonTitle: '推理进度（✓ 能提高 / ✗ 不能）',
  intro: '点击「▶ 播放」逐条判断四个措施。',
  snaps: snaps,
  result: {
    big: '答案 B（仅 I、II、III）',
    html: '<b>加宽度、提频率、突发传输</b>都提速；<b>地址/数据线复用</b>省引脚降成本，不提速。选 D 的人把"复用"当成了提速手段。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
