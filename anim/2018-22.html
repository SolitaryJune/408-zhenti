<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-22 外部 I/O 中断的正确说法</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先背下响应全流程',
    cls: 'key',
    body: '<p>外设请求 → 控制器按<b>优先级</b>排队 → CPU 在<b>一条指令执行结束时</b>查询 → 处于<b>开中断</b>状态且未被屏蔽才响应 → 执行<b>中断隐指令</b>（关中断、保断点、取向量）→ 转服务程序，由<b>软件</b>保护通用寄存器。四个选项各卡一道关卡。</p>' },
  { title: 'A：按请求先后排队？',
    cls: 'bad',
    body: '<p><b>错</b>。中断控制器按预先规定的<b>优先级</b>排队（硬件排队器实现），与请求到达的先后次序无关。"先来先服务"是干扰说法。</p>' },
  { title: 'B：隐指令保护通用寄存器？',
    cls: 'bad',
    body: '<p><b>错</b>。中断隐指令是硬件固定动作，只完成<b>关中断、保存断点（PC）和程序状态字、取中断向量</b>；通用寄存器的保护由<b>中断服务程序（软件）</b>按需压栈完成。</p>' },
  { title: 'C：开中断才能响应？',
    cls: 'good',
    body: '<p><b>对</b>。CPU 只有处于<b>中断允许状态</b>（开中断，IF = 1）时才能响应外部设备（可屏蔽中断）的请求；关中断期间请求只能挂起等待。</p>' },
  { title: 'D：有请求就立即暂停？',
    cls: 'bad',
    body: '<p><b>错</b>。CPU 不能在指令中途停下，必须等<b>一条指令执行完毕</b>（执行周期结束）才检查中断请求并响应，保证指令执行的完整性。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>一条指令执行完 → 开中断 → 按优先级 → 隐指令保断点 → 服务程序保现场</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '外部 I/O 中断：四个说法逐项排查',
  subtitle: '考点：异常和中断机制 · 排队 / 隐指令 / 中断允许 / 响应时机',
  counterLabel: '推理步',
  ribbonTitle: '判断结果（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」逐项核对四个说法。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '排队看<b>优先级</b>不看先后（A 错）；隐指令只保<b>断点 PC/PSW</b>，通用寄存器由服务程序保护（B 错）；<b>开中断才能响应</b>（C 对）；响应等<b>指令执行完</b>（D 错）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
