<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-23 多任务操作系统特性辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>多任务操作系统要同时推进多个作业，围绕三条叙述设问：Ⅰ 并发与并行、Ⅱ 共享资源保护、Ⅲ 是否必须多 CPU。考点：<b>并发 / 并行的区别与多任务系统的实现条件</b>。</p>' },
  { title: 'Ⅰ：具有并发和并行的特点 —— 正确',
    cls: 'good',
    body: '<p>多任务系统在<b>单 CPU</b> 上让多道程序交替占用 CPU（<b>并发</b>执行）；当硬件有多个处理机时，多个任务还可<b>同一时刻</b>各自运行（<b>并行</b>）。所以多任务操作系统兼具并发和并行的特点。<b>Ⅰ 正确</b>。</p>' },
  { title: 'Ⅱ：需要实现对共享资源的保护 —— 正确',
    cls: 'good',
    body: '<p>多个任务并发地共享内存、文件、打印机等资源，若不加保护，程序结果将<b>不可再现</b>。系统必须提供共享资源保护（互斥 / 同步）机制。<b>Ⅱ 正确</b>。</p>' },
  { title: 'Ⅲ：需要运行在多 CPU 硬件平台上 —— 错误',
    cls: 'bad',
    body: '<p>单 CPU 上依靠<b>时间片轮转</b>就能让多个任务“同时”推进，这正是多任务的实现方式。多 CPU 只是让并行成为可能，<b>不是必要条件</b>。<b>Ⅲ 错误</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>仅 Ⅰ、Ⅱ 正确 → 选 <b>C</b>。记忆锚点：<b>并发 ≠ 并行；并发不需要多 CPU；共享必须保护</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018·23 多任务操作系统的特性辨析（2 分选择题）',
  subtitle: '判断 Ⅰ 并发+并行 · Ⅱ 共享资源保护 · Ⅲ 必须多 CPU —— 三条叙述的真假',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '<b>Ⅰ ✓</b> 单 CPU 并发、多 CPU 并行，两者兼有；<b>Ⅱ ✓</b> 并发共享必须加以保护；<b>Ⅲ ✗</b> 时间片轮转即可实现多任务，多 CPU 并非必要。记忆锚点：<b>并发 ≠ 并行</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
