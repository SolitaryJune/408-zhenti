<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-28 管程条件变量 x.wait() 的语义</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：管程与条件变量的分工',
    cls: 'key',
    body: '<p>管程保证<b>互斥</b>：任一时刻只允许一个进程在管程内活动。管程内的条件变量 <code>x</code> 只有两个专用操作：<code>x.wait()</code>（等待）与 <code>x.signal()</code>（唤醒）。问：<code>x.wait()</code> 做什么？</p>' },
  { title: 'A：实现对变量 x 的互斥访问 —— 错',
    cls: 'bad',
    body: '<p>互斥由<b>管程机制</b>（进入 / 退出管程）自动保证，与条件变量操作无关。<b>A ✗</b></p>' },
  { title: 'B：唤醒一个在 x 上阻塞的进程 —— 错',
    cls: 'bad',
    body: '<p>唤醒 x 阻塞队列上的进程是 <code>x.signal()</code> 的职责，不是 wait 的。<b>B ✗</b></p>' },
  { title: 'C：根据 x 的值判断是否阻塞 —— 错',
    cls: 'bad',
    body: '<p>条件变量<b>不是普通变量</b>，它没有可供判断的“值”，内部只有等待队列和 wait / signal 两个操作。需要判断的是进程自己的条件表达式，而不是 x 的值。<b>C ✗</b></p>' },
  { title: 'D：阻塞该进程并插入 x 的阻塞队列 —— 对',
    cls: 'good',
    body: '<p><code>x.wait()</code> 的工作：把当前进程<b>阻塞</b>，并把它插入 <code>x</code> 的<b>阻塞（等待）队列</b>，同时释放管程使用权让其他进程进入。<b>D ✓</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>wait = 阻塞 + 入队；signal = 唤醒</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018·28 管程内执行 x.wait() 时做的工作（2 分选择题）',
  subtitle: '条件变量 <code>x</code> · wait / signal 两个操作 · 四个选项逐一排除',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '<code>x.wait()</code> = <b>阻塞该进程并插入 x 的阻塞队列</b>（同时让出管程使用权）。干扰项：A 是管程本身的职责；B 是 <code>x.signal()</code> 的职责；C 把条件变量误当普通变量。记忆锚点：<b>wait 阻塞入队，signal 唤醒出队</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
