<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-29 时钟中断服务程序更新的内容</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：时钟中断是系统的“心跳”',
    cls: 'key',
    body: '<p>时钟定时产生中断（节拍），每次节拍 CPU 转入<b>时钟中断服务程序</b>，完成一组“记账 + 控制”工作。三条叙述是否都在这组工作之内？</p>' },
  { title: 'Ⅰ：内核中时钟变量的值 —— 会更新',
    cls: 'good',
    body: '<p>每来一个节拍，内核的时钟变量（系统时间 / 开机时间）都要<b>累加更新</b>，这是系统走时的基础。<b>Ⅰ ✓</b></p>' },
  { title: 'Ⅱ：当前进程占用 CPU 的时间 —— 会更新',
    cls: 'good',
    body: '<p>时钟中断给当前进程的“已占用 CPU 时间”<b>记账</b>，用于统计和调度决策。<b>Ⅱ ✓</b></p>' },
  { title: 'Ⅲ：时间片内的剩余执行时间 —— 会更新',
    cls: 'good',
    body: '<p>时间片轮转靠“剩余时间片”判断是否到点：每过一个节拍<b>减 1</b>，减到 0 就剥夺 CPU 重新调度。递减正是时钟中断处理中完成的。<b>Ⅲ ✓</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>Ⅰ、Ⅱ、Ⅲ 都由时钟中断服务程序更新 → 选 <b>D</b>。记忆锚点：<b>时钟中断 = 走时 + 记账 + 时间片控制</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018·29 时钟中断服务程序更新哪些内容（2 分选择题）',
  subtitle: 'Ⅰ 内核时钟变量 · Ⅱ 当前进程占用 CPU 时间 · Ⅲ 时间片内剩余执行时间',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（三项都更新）',
    html: '时钟中断服务程序每拍做三件事：<b>走时</b>（Ⅰ 时钟变量）、<b>记账</b>（Ⅱ 进程占用 CPU 时间）、<b>时间片控制</b>（Ⅲ 剩余时间片减 1，减到 0 触发调度）。干扰思路是“时钟中断只管系统时间”——错，它同时承担记账与时间片控制。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
