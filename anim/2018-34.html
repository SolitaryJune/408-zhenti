<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念/分析类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2018-34：不属于物理层接口规范定义范畴的选项
     模板：概念 / 分析推理类（逐步揭示推理链卡片）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：物理层接口规范的四个特性',
    cls: 'key',
    body: '<p>物理层接口规范（DTE–DCE 接口标准）定义四个特性：<b>机械、电气、功能、规程</b>。题目给的是 4 个具体例子，要一一"对号入座"，找出不属于任何一个特性的。</p>' },
  { title: '四特性速览',
    cls: '',
    body: '<p><b>机械特性</b>：接口形状、尺寸、引脚数目与排列；<b>电气特性</b>：信号电平、电压范围；<b>功能特性</b>：每根引脚的信号功能；<b>规程特性</b>：信号先后时序的规程关系。</p>' },
  { title: '逐项分析 A（接口形状）',
    cls: 'bad',
    body: '<p>接口的形状、尺寸、引脚排列 → <b>机械特性</b>。属于接口规范定义范畴，排除。</p>' },
  { title: '逐项分析 B（引脚功能）、D（信号电平）',
    cls: 'bad',
    body: '<p>引脚功能的定义 → <b>功能特性</b>；信号电平、电压范围 → <b>电气特性</b>。两者都属于接口规范定义范畴，排除。</p>' },
  { title: '逐项分析 C（物理地址）',
    cls: 'good',
    body: '<p><b>物理地址（MAC 地址）是数据链路层</b>的寻址概念，标识的是网卡接口；物理层只管比特与信号，接口规范不定义任何"地址"。<b>不属于物理层接口规范范畴，对。</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>机（形状）·电（电平）·功（引脚）·规（时序）</b>——四个特性全在"接口"上做文章；"物理地址"只是一个名字里带"物理"的链路层地址。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018-34：不属于物理层接口规范定义范畴的选项',
  subtitle: '考点：物理层接口四特性（机械/电气/功能/规程）· 例子对号入座',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C：物理地址',
    html: '记忆锚点：<b>机（形状）·电（电平）·功（引脚功能）·规（时序规程）</b>，A/B/D 恰好各落在一个特性里。<br>"物理地址"只是名字带"物理"，它是<b>数据链路层</b>的 MAC 地址，与物理层接口规范无关。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
