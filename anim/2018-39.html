<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念/分析类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2018-39：UDP 分用（demultiplexing）依据的头部字段
     模板：概念 / 分析推理类（逐步揭示推理链卡片）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：什么是分用',
    cls: 'key',
    body: '<p><b>分用（demultiplexing）</b>：接收主机的传输层把收到的报文段<b>交付给正确的应用进程（套接字）</b>。题目问：UDP 靠头部哪个字段完成这件事。</p>' },
  { title: 'UDP 头部只有 4 个字段',
    cls: '',
    body: '<p><code>源端口号 · 目的端口号 · 长度 · 校验和</code>。能标识"交给哪个进程"的，只有<b>端口</b>类字段——端口号就是应用进程在传输层的"门牌号"。</p>' },
  { title: 'B（目的端口号）：分用依据',
    cls: 'good',
    body: '<p>目的端口号指明报文段要交给<b>接收方本地</b>的哪个端口/进程。UDP 收到报文段后按<b>目的端口号</b>把数据交给对应套接字。<b>对。</b></p>' },
  { title: '排除 A（源端口号）',
    cls: 'bad',
    body: '<p>源端口号是发送方填的"<b>回信地址</b>"，供接收方回送报文时填目的端口用；若按它分用，多个客户端并发时就会送错进程。方向搞反了。</p>' },
  { title: '排除 C（长度）、D（校验和）',
    cls: 'bad',
    body: '<p>长度字段只是本 UDP 报文段的字节数（首部 + 数据）；校验和用于<b>差错检测</b>，查出有错就丢弃。都与"交给谁"无关。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>"去哪儿"看目的端口，"从哪儿来"看源端口</b>；TCP 分用要靠四元组（源 IP、源端口、目的 IP、目的端口），UDP 只看目的端口号。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018-39：UDP 分用依据的头部字段',
  subtitle: '考点：UDP 报文段结构 · 分用（demultiplexing）· 选项逐项推演',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B：目的端口号',
    html: '记忆锚点：<b>"去哪儿"看目的端口，"从哪儿来"看源端口</b>——接收方分用按<b>目的端口号</b>把报文段交给对应进程。<br>干扰项：源端口号是"回信地址"（A），长度只是字节数（C），校验和只管差错检测（D）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
