<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念/分析类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2018-40：无须转换即可由 SMTP 直接传输的内容
     模板：概念 / 分析推理类（逐步揭示推理链卡片）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：SMTP 的先天限制',
    cls: 'key',
    body: '<p>SMTP 只能传送 <b>7 位 ASCII 码文本</b>。"无须转换即可直接传输"的内容，必须本来就是 ASCII 文本。</p>' },
  { title: '为什么 SMTP 只认 ASCII',
    cls: '',
    body: '<p>SMTP 按<b>行</b>组织报文，还用特殊字符串（如单独一行的句点）表示邮件结束；8 位二进制内容会被误解释甚至截断，所以二进制文件不能直接交给 SMTP 传送。</p>' },
  { title: 'D（ASCII 文本）：直接传',
    cls: 'good',
    body: '<p>ASCII 文本本身就是 SMTP 认识的 7 位编码，<b>无须任何转换</b>即可传输。<b>对。</b></p>' },
  { title: '排除 A（JPEG）、B（MPEG）、C（EXE）',
    cls: 'bad',
    body: '<p>JPEG 图像、MPEG 视频、EXE 可执行文件全是<b>二进制</b>内容 → 必须先经 <b>MIME</b> 转换（如 Base64 编码成 ASCII）才能交给 SMTP 传输，都不满足"无须转换"。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>SMTP 天生只认 ASCII，二进制内容靠 MIME "翻译"</b>——邮件能发图片附件是 MIME 的功劳，不是 SMTP 的。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018-40：无须转换即可由 SMTP 直接传输的内容',
  subtitle: '考点：电子邮件 · SMTP 的 ASCII 限制与 MIME 扩展 · 选项逐项推演',
  counterLabel: '步数',
  ribbonTitle: '推理步（✓ 结论 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D：ASCII 文本',
    html: '记忆锚点：<b>SMTP 只认 7 位 ASCII 文本；JPEG/MPEG/EXE 都是二进制，须经 MIME（如 Base64）转成 ASCII 才能传</b>。<br>易错：邮件能发附件是 MIME 的功劳，"无须转换"的永远只有 ASCII 文本本身。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
