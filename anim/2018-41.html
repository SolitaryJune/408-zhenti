<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-41 找未出现的最小正整数</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var AROW, BROW, CALC;

function paintArr(row, chars, cls, idxStart, ptr){
  row.innerHTML = '';
  for(var i = 0; i < chars.length; i++){
    var col = AW.el('div', 'aw-col');
    col.appendChild(AW.el('div', 'aw-ptr', (ptr && ptr[i]) || ''));
    col.appendChild(AW.el('div', 'aw-box' + (cls && cls[i] ? ' ' + cls[i] : ''), chars[i] === '' ? '&nbsp;' : String(chars[i])));
    col.appendChild(AW.el('div', 'aw-idx', String(idxStart + i)));
    row.appendChild(col);
  }
}

AW.init({
  title: '2018·综合题 41 找出未出现的最小正整数',
  subtitle: '标记数组 B[n]：<code>B[j]=1</code> 表示正整数 j+1 出现过 · 答案必在 1~n+1 · 例：A = {-5,3,2,3}',
  counterLabel: '已扫描元素',
  intro: '点击「▶ 播放」，在题干示例 {-5,3,2,3} 上完整演算一遍。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    AROW = AW.el('div', 'aw-cells');
    BROW = AW.el('div', 'aw-cells');
    CALC = AW.el('div', 'aw-row-label', '&nbsp;');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>数组 A</b>（n=4，上方为扫描指针）'));
    wrap.appendChild(AROW);
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>标记数组 B</b>（下标 0~3，对应正整数 1~4）'));
    wrap.appendChild(BROW);
    wrap.appendChild(CALC);
    stage.appendChild(wrap);
    paintArr(AROW, ['-5','3','2','3'], [], 0, {});
    paintArr(BROW, ['0','0','0','0'], [], 1, {});
    CALC.innerHTML = '思想：答案只可能在 1~n+1 —— B[j]=1 表示值 j+1 出现过，第一个 B[j]=0 给出答案 j+1';
  },

  render: function(stage, sn){
    paintArr(AROW, sn.a, sn.ac, 0, sn.aptr || {});
    paintArr(BROW, sn.b, sn.bc, 1, sn.bptr || {});
    CALC.innerHTML = sn.calc || '&nbsp;';
  },

  snaps: [
    { cls:'step', tag:'初始化', log:'A = {-5,3,2,3}，标记数组 B 全置 0', count:0,
      a:['-5','3','2','3'], ac:[], b:['0','0','0','0'], bc:[],
      calc:'第一步：for 循环把 B[0..3] 全部置 0（B[j]=1 表示正整数 j+1 出现过）' },
    { cls:'miss', tag:'A[0]=-5', log:'A[0] = -5：不在 1~4 → 越界值直接忽略', count:1,
      a:['-5','3','2','3'], ac:['miss','dim','dim','dim'], aptr:{0:'i=0'}, b:['0','0','0','0'], bc:['dim','dim','dim','dim'],
      calc:'if (A[i] > 0 && A[i] <= n) 不成立 → 不标记' },
    { cls:'ok', tag:'A[1]=3', log:'A[1] = 3：在 1~4 内 → 标记 B[3-1] = B[2] = 1', count:2,
      a:['-5','3','2','3'], ac:['dim','hit','dim','dim'], aptr:{1:'i=1'}, b:['0','0','1','0'], bc:['dim','dim','ok','dim'],
      calc:'a = A[1] = 3；B[a-1] = B[2] = 1（值 3 出现过）' },
    { cls:'ok', tag:'A[2]=2', log:'A[2] = 2：标记 B[2-1] = B[1] = 1', count:3,
      a:['-5','3','2','3'], ac:['dim','dim','hit','dim'], aptr:{2:'i=2'}, b:['0','1','1','0'], bc:['dim','ok','ok','dim'],
      calc:'a = 2；B[1] = 1（值 2 出现过）' },
    { cls:'step', tag:'A[3]=3 重复', log:'A[3] = 3：与 A[1] 重复，再次标记 B[2] = 1（无影响）', count:4,
      a:['-5','3','2','3'], ac:['dim','dim','dim','hit'], aptr:{3:'i=3'}, b:['0','1','1','0'], bc:['dim','ok','ok','dim'],
      calc:'a = 3；B[2] 已是 1，重复出现不影响结果' },
    { cls:'shift', tag:'扫描 B', log:'标记完毕：值 2、3 出现，值 1、4 未出现；扫 B 找第一个 0', count:4,
      a:['-5','3','2','3'], ac:['dim','dim','dim','dim'], b:['0','1','1','0'], bc:['hit','ok','ok','dim'],
      calc:'第二步：for (i=0; i<n; i++) if (B[i]==0) break; —— 第一个 0 在 B[0]' },
    { cls:'ok', tag:'返回 1', log:'B[0] = 0：下标 i=0 → 返回 i+1 = 1，即 {-5,3,2,3} 中未出现的最小正整数', count:4,
      a:['-5','3','2','3'], ac:[], b:['0','1','1','0'], bc:['hit','ok','ok','dim'],
      calc:'return i + 1 = 0 + 1 = 1 ✓（与题干第一例一致）' },
    { cls:'step', tag:'再看 {1,2,3}', log:'第二例 A = {1,2,3}（n=3）：1、2、3 全出现 → B[0..2] 全 1', count:4,
      a:['1','2','3',''], ac:['ok','ok','ok','dim'], b:['1','1','1','—'], bc:['ok','ok','ok','dim'],
      calc:'注意 n=3：B 只有 B[0..2] 三个槽位（对应值 1~3），第 4 格只是上例残留的示意，不参与' },
    { cls:'shift', tag:'扫完无 0？', log:'扫描循环结束 i = n = 3：B[0..2] 全 1，找不到 0，循环自然退出', count:4,
      a:['1','2','3',''], ac:['ok','ok','ok','dim'], b:['1','1','1','—'], bc:['ok','ok','ok','dim'],
      calc:'for (i=0; i<n; i++) if (B[i]==0) break; —— 一次也没 break，i 走到 3' },
    { cls:'done', tag:'返回 n+1', log:'return i + 1 = 4：{1,2,3} 的答案是 4；时间 O(n)、空间 O(n)', count:4, done:true,
      a:['1','2','3',''], ac:['ok','ok','ok','dim'], b:['1','1','1','—'], bc:['ok','ok','ok','hit'],
      calc:'return 3 + 1 = 4 ✓（1~n 全出现时答案为 n+1）；各扫一遍 → O(n) 时间、O(n) 空间' },
  ],

  result: {
    big: '1 和 4（两个例子）',
    html: '答案必在 <b>1~n+1</b>：标记数组 B 记「值 j+1 是否出现过」（O(n) 空间），先扫 A 标记、再扫 B 找第一个 0，返回 <b>i+1</b>；扫完无 0 返回 <b>n+1</b>。两例分别得 1、4。时间 <b>O(n)</b>、空间 <b>O(n)</b>——比双重循环的 O(n²) 高效得多。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
