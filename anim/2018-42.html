<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-42 光通信骨干网 · Kruskal 求 MST 与 TTL 判定</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
<style>
  .mst-svg{width:100%;max-width:880px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .mst-svg .medge{transition:stroke .35s, stroke-width .35s}
  .mst-svg .mnode circle{transition:fill .3s, stroke .3s}
  .mst-svg .mnode text{font-weight:800;font-size:16px;text-anchor:middle;dominant-baseline:central}
  .mst-svg .mnode .city{fill:#1b3a4b}
  .mcost{margin-top:8px;text-align:center;font-size:14.5px;font-weight:700;color:#1b3a4b;line-height:1.8}
  .mcost code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
  .mttl{margin-top:12px}
  .mttl .cap{font-size:13px;color:#586e72;margin-bottom:4px}
  .mttl .row{display:flex;gap:4px;width:max-content}
  .mttl .col{width:52px;display:flex;flex-direction:column;align-items:center}
  .mttl .ptr{height:20px;font-size:11.5px;font-weight:700;color:#1b3a4b;white-space:nowrap}
  .mttl .box{width:52px;height:34px;border:2px solid #5a7d8c66;border-radius:9px;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:15px;background:#fff;
    font-family:"SF Mono",Menlo,monospace}
  .mttl .box.ok{background:#2f9e4424;border-color:#2f9e44;color:#1e4d33}
  .mttl .box.hit{background:#2f9e44;border-color:#2f9e44;color:#fff}
  .mttl .box.miss{background:#e6394620;border-color:#e63946;color:#a02830}
  .mttl .box.dim{opacity:.45}
  .mttl .hop{margin-top:3px;font-size:11px;color:#b9cbd0;font-family:monospace}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 2018-42 光通信骨干网（SVG） ==================
 * 问(1)：8 城市 12 条备选边 → Kruskal 逐步选边求 MST，桥边二选一 → 两棵 MST，总费用均 16；
 * 问(2)：邻接矩阵/邻接表 + Prim/Kruskal；
 * 问(3)：TTL=5 的分组 H1(TL) → H2(BJ)：方案 2 一跳可达 ✓，方案 1 五跳在 XA 处 TTL 归零被丢弃 ✗。 */

var NP = { XA:[90,70], BJ:[400,70], TL:[760,70], WH:[120,330], JN:[770,330], CS:[110,500], QD:[440,500], NJ:[790,500] };
// [端点1, 端点2, 权, 标签x, 标签y]
var EDGES = [
  ['XA','BJ', 2, 245, 58],   // 0
  ['XA','WH', 2, 78, 200],   // 1
  ['TL','JN', 2, 798, 200],  // 2
  ['QD','JN', 2, 605, 415],  // 3
  ['QD','NJ', 2, 615, 488],  // 4
  ['BJ','TL', 3, 580, 58],   // 5
  ['WH','BJ', 3, 260, 200],  // 6
  ['WH','QD', 3, 280, 418],  // 7
  ['CS','QD', 3, 275, 488],  // 8
  ['JN','NJ', 3, 812, 415],  // 9
  ['BJ','JN', 4, 585, 205],  // 10
  ['WH','CS', 4, 88, 418],   // 11
];

function edgeSet(list){
  var m = {};
  if (list) for (var i = 0; i < list.length; i++) m[list[i]] = 1;
  return m;
}
function sumSel(sel){
  var s = 0;
  (sel || []).forEach(function(i){ s += EDGES[i][2]; });
  return s;
}

var snaps = [
  { cls:'step',  tag:'审题', sel:[], count:0,
    log:'8 个城市、12 条备选边（5 条权 2、5 条权 3、2 条权 4）。连通 8 个城市至少要 7 条边 → 最经济方案 = 最小生成树。用 Kruskal：按权从小到大选边，成环则舍。' },
  { cls:'ok',    tag:'选 XA–BJ(2)', sel:[0], count:1, ribbon:{k:1, ok:true},
    log:'最小的权是 2：XA–BJ 两端不在同一块 → 选入（第 1 条）。' },
  { cls:'ok',    tag:'选 XA–WH(2)', sel:[0,1], count:2, ribbon:{k:2, ok:true},
    log:'XA–WH(2) 也不成环 → 选入。左侧块 {XA, BJ, WH} 成形。' },
  { cls:'ok',    tag:'选 TL–JN(2)', sel:[0,1,2], count:3, ribbon:{k:3, ok:true},
    log:'TL–JN(2) → 选入，右侧块开始生长。' },
  { cls:'ok',    tag:'选 QD–JN(2)', sel:[0,1,2,3], count:4, ribbon:{k:4, ok:true},
    log:'QD–JN(2) → {TL, JN, QD}。' },
  { cls:'ok',    tag:'选 QD–NJ(2)', sel:[0,1,2,3,4], count:5, ribbon:{k:5, ok:true},
    log:'QD–NJ(2) → {TL, JN, QD, NJ}。权 2 的 5 条边全部选入，图分成互不连通的两大块。' },
  { cls:'ok',    tag:'桥边 BJ–TL(3)', sel:[0,1,2,3,4,5], count:6, ribbon:{k:6, ok:true},
    log:'权 3 的 BJ–TL 恰好是连接两大块的桥 → 选入。7 个城市连通，只差 CS。' },
  { cls:'miss',  tag:'成环舍去 ×2', sel:[0,1,2,3,4,5], rej:[6,7], count:6,
    log:'WH–BJ(3)、WH–QD(3)：两端已在同一块 → 成环，舍去。注意：WH–QD 马上会"复活"——它是另一棵 MST 的桥边。' },
  { cls:'ok',    tag:'接入 CS · 树成', sel:[0,1,2,3,4,5,8], rej:[6,7], count:7, ribbon:{k:7, ok:true},
    log:'CS–QD(3) 把最后一个城市 CS 接入 → 7 条边齐，最小生成树建成！总费用 = 2×5 + 3 + 3 = <b>16</b>。' },
  { cls:'shift', tag:'收尾三边', sel:[0,1,2,3,4,5,8], rej:[6,7,9], skip:[10,11], count:7,
    log:'JN–NJ(3) 成环舍去；BJ–JN(4)、WH–CS(4) 比已选桥边贵且树已连通，不需要。' },
  { cls:'step',  tag:'两种方案', sel:[0,1,2,3,4,7,8], rej:[6,9], skip:[5,10,11], count:7,
    log:'桥接两大块的权 3 边有两条：BJ–TL 和 WH–QD（BJ–JN 权 4 太贵）。换桥 → <b>第二棵 MST</b>：XA–BJ、XA–WH、WH–QD、TL–JN、QD–JN、QD–NJ、CS–QD。两棵 MST 总费用都是 16 → 共两种最经济方案。' },
  { cls:'step',  tag:'问(2) 存储/算法', sel:[0,1,2,3,4,5,8], rej:[6,7,9], skip:[10,11], count:7,
    log:'题图是无向带权图 → 邻接矩阵（对称矩阵）或邻接表均可存储；求最小生成树 → Prim（每次加点）或 Kruskal（每次加边）。' },
  { cls:'ok',    tag:'问(3) 方案 2 可达', sel:[0,1,2,3,4,5,8], rej:[6,7,9], skip:[10,11], path:[5], count:7,
    ttl:{ cap:'方案 2（桥边 BJ–TL）：H1 连在 TL，H2 连在 BJ —— TTL=5，主机发出时不减、路由器「转发」时才减 1',
      cities:['TL','BJ'], ttls:['转发后 4','收到→交付 ✓'], cls:['ok','hit'] },
    log:'方案 2 中 TL 与 BJ 相邻：TL 路由器转发 TTL 5→4，BJ 路由器收到即交付 H2 → <b>H2 可以收到 ✓</b>。' },
  { cls:'miss',  tag:'问(3) 方案 1 丢弃', sel:[0,1,2,3,4,7,8], rej:[6,9], skip:[5,10,11], path:[2,3,7,1,0], count:7,
    ttl:{ cap:'方案 1（桥边 WH–QD）：TL→JN→QD→WH→XA→BJ 共 5 跳 —— 每转发一次减 1',
      cities:['TL','JN','QD','WH','XA','BJ'], ttls:['转发后 4','转发后 3','转发后 2','转发后 1','转发后 0 ✗丢弃','收不到'], cls:['ok','ok','ok','ok','miss','dim'] },
    log:'方案 1 中 TL→JN→QD→WH→XA→BJ 共 5 跳，转发 5 次：4→3→2→1→<b>0</b> —— TTL 在 XA 归零，分组被丢弃 → <b>H2 收不到 ✗</b>。' },
  { cls:'done',  tag:'完成', sel:[0,1,2,3,4,5,8], rej:[6,9], skip:[10,11], alt:[7], count:7, done:true,
    log:'结论：(1) 两棵 MST（桥边 BJ–TL 或 WH–QD 二选一），总费用均 16；(2) 邻接矩阵/邻接表 + Prim/Kruskal；(3) 方案 2 可送达、方案 1 在 XA 处 TTL=0 被丢弃。' },
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var wrap = AW.el('div', 'aw-scroll');
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 880 560');
  svg.setAttribute('class', 'mst-svg');
  function el2(tag, attrs){
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  EDGES.forEach(function(e, i){
    var a = NP[e[0]], b = NP[e[1]];
    var dx = b[0]-a[0], dy = b[1]-a[1], len = Math.sqrt(dx*dx + dy*dy);
    var ux = dx/len, uy = dy/len, r = 30;
    var ln = el2('line', { x1:a[0]+ux*r, y1:a[1]+uy*r, x2:b[0]-ux*r, y2:b[1]-uy*r,
      stroke:'#5a7d8c66', 'stroke-width':2 });
    ln.setAttribute('class', 'medge');
    ln.id = 'me' + i;
    svg.appendChild(ln);
    var lab = el2('text', { x:e[3], y:e[4], 'text-anchor':'middle', 'font-size':15,
      'font-weight':700, fill:'#47616c' });
    lab.textContent = e[2];
    lab.id = 'ml' + i;
    svg.appendChild(lab);
  });
  for (var name in NP){
    var p = NP[name];
    var g = el2('g', {});
    g.setAttribute('class', 'mnode');
    var c = el2('circle', { cx:p[0], cy:p[1], r:30, fill:'#ffffff', stroke:'#586e72', 'stroke-width':2.5 });
    c.id = 'mn' + name;
    var t = el2('text', { x:p[0], y:p[1] });
    t.textContent = name;
    t.setAttribute('class', 'city');
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
  }
  wrap.appendChild(svg);
  stage.appendChild(wrap);
  var costLine = AW.el('div', 'mcost');
  stage.appendChild(costLine);
  var ttlBox = AW.el('div', 'mttl');
  stage.appendChild(ttlBox);
  this._costLine = costLine; this._ttlBox = ttlBox;
}

function render(stage, sn, i){
  var sel = edgeSet(sn.sel), rej = edgeSet(sn.rej), skip = edgeSet(sn.skip);
  var path = edgeSet(sn.path), alt = edgeSet(sn.alt);
  EDGES.forEach(function(e, k){
    var col = '#5a7d8c66', w = 2, labCol = '#47616c';
    if (skip[k]){ col = '#1b3a4b26'; labCol = '#5a7d8c66'; }
    if (rej[k]){ col = '#e63946'; w = 2.5; labCol = '#e63946'; }
    if (sel[k]){ col = '#2f9e44'; w = 3.5; labCol = '#276942'; }
    if (alt[k]){ col = '#e07a2f'; w = 3.5; labCol = '#92400e'; }
    if (path[k]){ col = '#1b3a4b'; w = 4; labCol = '#1b3a4b'; }
    var ln = document.getElementById('me' + k);
    ln.setAttribute('stroke', col); ln.setAttribute('stroke-width', w);
    document.getElementById('ml' + k).setAttribute('fill', labCol);
  });
  var touched = {};
  (sn.sel || []).concat(sn.path || [], sn.alt || []).forEach(function(k){
    touched[EDGES[k][0]] = 1; touched[EDGES[k][1]] = 1;
  });
  for (var name in NP){
    var c = document.getElementById('mn' + name);
    if (touched[name]){
      c.setAttribute('fill', '#2f9e4424'); c.setAttribute('stroke', '#2f9e44');
    } else {
      c.setAttribute('fill', '#ffffff'); c.setAttribute('stroke', '#586e72');
    }
  }
  // 费用行
  var n = (sn.sel || []).length;
  var html = '已选 <b>' + n + '</b> / 7 条边 · 当前费用 <code>' + sumSel(sn.sel) + '</code>';
  if (sn.path) html += ' · <span style="color:#1b3a4b">墨青 = TTL 转发路径</span>';
  else if (sn.alt) html += ' · <span style="color:#92400e">琥珀 = 另一棵 MST 的桥边 WH–QD</span>';
  this._costLine.innerHTML = html;
  // TTL 演算行
  var box = this._ttlBox;
  box.innerHTML = '';
  if (sn.ttl){
    box.appendChild(AW.el('div', 'cap', sn.ttl.cap));
    var row = AW.el('div', 'row');
    sn.ttl.cities.forEach(function(city, k){
      var col = AW.el('div', 'col');
      col.appendChild(AW.el('div', 'ptr', sn.ttl.ttls[k]));
      col.appendChild(AW.el('div', 'box ' + sn.ttl.cls[k], city));
      col.appendChild(AW.el('div', 'hop', '第' + (k + 1) + '跳'));
      row.appendChild(col);
    });
    box.appendChild(row);
  }
}

AW.init({
  title: '2018-42 光通信骨干网：最经济方案（MST）与 TTL 判定',
  subtitle: '8 城市 12 条备选边 · Kruskal 逐步选边 · 桥边二选一得两棵 MST（总费用均 16）· TTL=5 能否送达',
  counterLabel: '已选边数',
  ribbonTitle: '已选边（✓ 选入）',
  intro: '点击「▶ 播放」按 Kruskal 流程看最小生成树怎么长出来，再分方案追踪 TTL。',
  build: build,
  render: render,
  snaps: snaps,
  result: {
    big: '两棵 MST 均为 16；方案 2 可达、方案 1 被丢弃',
    html: '问(1)：权 2 的 5 条边全选，桥边 <b>BJ–TL 或 WH–QD 二选一</b>，再加 CS–QD(3) → 两棵最小生成树，总费用均为 <b>16</b>。' +
      '问(2)：存储用<b>邻接矩阵或邻接表</b>，算法 <b>Prim 或 Kruskal</b>。' +
      '问(3)：TTL 只在路由器<b>转发</b>时减 1：方案 2 一跳转发（5→4）即交付 <b>✓</b>；方案 1 五跳 4→3→2→1→<b>0</b>，在 XA 归零被丢弃 <b>✗</b>。',
  },
});
</script>
</body>
</html>
