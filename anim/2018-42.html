<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018-42 光通信骨干网：MST 与 TTL</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 12 条备选边（按权升序展示）：[端点1, 端点2, 权]
var EDGE = [
  ['XA','BJ',2], ['XA','WH',2], ['TL','JN',2], ['QD','JN',2], ['QD','NJ',2],
  ['BJ','TL',3], ['WH','BJ',3], ['WH','QD',3], ['CS','QD',3], ['JN','NJ',3],
  ['BJ','JN',4], ['WH','CS',4],
];

// status: 0 未考虑(dim) 1 候选(普通) 2 选入(ok) 3 舍去(miss)
function edgeTable(status){
  var h = '<table style="border-collapse:collapse;margin:6px auto;font-size:12.5px">';
  h += '<tr>';
  EDGE.forEach(function(e, i){
    var bg = '#f8fafc', fg = '#334155', bd = '#cbd5e1';
    if(status[i] === 2){ bg = '#dcfce7'; bd = '#22c55e'; fg = '#14532d'; }
    else if(status[i] === 3){ bg = '#fee2e2'; bd = '#ef4444'; fg = '#b91c1c'; }
    else if(status[i] === 0){ bg = '#f1f5f9'; fg = '#94a3b8'; }
    else if(status[i] === 1){ bg = '#fef3c7'; bd = '#f59e0b'; fg = '#92400e'; }
    h += '<td style="border:1px solid ' + bd + ';background:' + bg + ';color:' + fg +
         ';padding:3px 7px;margin:1px">' + e[0] + '–' + e[1] + '<br><b>' + e[2] + '</b></td>';
  });
  h += '</tr></table>';
  return h;
}

function note(text, color){
  return '<div style="text-align:center;font-size:13.5px;color:' + (color || '#334155') + ';margin-top:6px">' + text + '</div>';
}

function mstCard(title, edges, w){
  var h = '<div style="display:inline-block;border:1.5px solid #22c55e;border-radius:8px;background:#f6fef9;padding:8px 14px;margin:6px 10px;vertical-align:top">';
  h += '<div style="font-weight:700;color:#15803d;margin-bottom:4px">' + title + '</div>';
  h += '<div style="font-size:12.5px;color:#334155;line-height:1.9">' + edges + '</div>';
  h += '<div style="font-size:13px;color:#14532d;margin-top:4px"><b>总费用 ' + w + '</b></div>';
  h += '</div>';
  return h;
}

function st(all){ return EDGE.map(function(_, i){ return all.indexOf(i) >= 0 ? 2 : 0; }); }

AW.init({
  title: '2018·综合题 42 光通信骨干网：最经济方案与 TTL',
  subtitle: '8 城市 12 条备选边 · 连通需 7 条边 · 求最小生成树 · 再判 TTL=5 能否送达',
  counterLabel: '已选边数',
  intro: '点击「▶ 播放」，按 Kruskal 流程选边，再分方案讨论 TTL。',

  snaps: [
    { cls:'step', tag:'审题', log:'8 个城市要连通：至少 7 条边；最经济 = 最小生成树', count:0,
      html: edgeTable(st([])) + note('边权：五条 2、五条 3、两条 4 —— Kruskal 思路：按权从小到大选，成环则舍') },
    { cls:'shift', tag:'权 2 全选', log:'权 2 的 5 条边互不成环，全部选入：{XA,BJ,WH} 与 {TL,JN,QD,NJ} 两大块', count:5,
      html: edgeTable(st([0,1,2,3,4])) + note('XA–BJ、XA–WH 连成 {XA,BJ,WH}；TL–JN、QD–JN、QD–NJ 连成 {TL,JN,QD,NJ}') },
    { cls:'ok', tag:'桥边 BJ–TL', log:'权 3 的 BJ–TL 恰好连接两大块 → 选入（第 6 条边）', count:6,
      html: edgeTable(st([0,1,2,3,4,5])) + note('BJ–TL(3)：把 8 个城市中的 7 个连为一体') },
    { cls:'miss', tag:'成环舍去', log:'WH–BJ(3)、WH–QD(3) 两端已连通 → 成环舍去', count:6,
      html: edgeTable([2,2,2,2,2,2,3,3,0,0,0,0]) + note('注意：WH–QD 是「另一棵 MST 的桥边」，成环只对当前已选集合而言') },
    { cls:'ok', tag:'接入 CS', log:'CS–QD(3) 把最后一个城市 CS 接入 → 7 条边齐，树成！', count:7,
      html: edgeTable([2,2,2,2,2,2,3,3,2,0,0,0]) + note('剩余：JN–NJ(3) 成环舍、BJ–JN(4)、WH–CS(4) 不需要 → 总费用 2+2+2+2+2+3+3 = <b>16</b>', '#15803d') },
    { cls:'shift', tag:'两种方案', log:'桥接两大块的权 3 边有 BJ–TL 和 WH–QD 两条 → 两棵 MST，总费用均 16', count:7,
      html: mstCard('方案 1（桥边 WH–QD）', 'XA–BJ(2)、XA–WH(2)、WH–QD(3)、QD–CS(3)、QD–JN(2)、QD–NJ(2)、TL–JN(2)', 16) +
            mstCard('方案 2（桥边 BJ–TL）', 'XA–BJ(2)、XA–WH(2)、BJ–TL(3)、TL–JN(2)、JN–QD(2)、QD–NJ(2)、QD–CS(3)', 16) },
    { cls:'step', tag:'问 (2)', log:'存储结构：邻接矩阵 / 邻接表均可；求 MST 算法：Prim / Kruskal', count:7,
      html: note('无向带权图 → 邻接矩阵（对称）或邻接表；最小生成树 → Prim（加点）或 Kruskal（加边）', '#1d4ed8') },
    { cls:'ok', tag:'问 (3) 方案 2', log:'方案 2 中 TL 与 BJ 相邻：TL 转发后 TTL=4，BJ 路由器交付 H2 → 可以收到', count:7,
      html: mstCard('方案 2 的 TL → BJ', 'TL → BJ：1 跳<br>TTL：5 →（TL 转发）4 → BJ 收到交付 H2', '✓ 可达') +
            note('路由器转发时才减 1：H1 发出时 TTL=5 未减', '#15803d') },
    { cls:'miss', tag:'问 (3) 方案 1', log:'方案 1 中 TL→JN→QD→WH→XA→BJ 共 5 跳：TTL 5→4→3→2→1→0，XA 处归零被丢弃 → 收不到', count:7,
      html: mstCard('方案 1 的 TL → BJ', 'TL → JN → QD → WH → XA → BJ：5 跳<br>TTL：5 →4（TL）→3（JN）→2（QD）→1（WH）→<b>0（XA 丢弃）</b>', '✗ 不可达') +
            note('TTL 减为 0 的数据报被路由器丢弃，永远到不了 BJ 路由器', '#b91c1c') },
    { cls:'done', tag:'完成', log:'两种 MST 总费用均 16；方案 2 可送达、方案 1 在 XA 处 TTL=0 被丢弃', count:7, done:true,
      html: mstCard('方案 1（桥边 WH–QD）', '总费用 16', '✗ H2 收不到') +
            mstCard('方案 2（桥边 BJ–TL）', '总费用 16', '✓ H2 可收到') +
            note('问(1) 两方案各 16；问(2) 邻接矩阵/邻接表 + Prim/Kruskal；问(3) 方案 2 可达、方案 1 不可达') },
  ],

  result: {
    big: '两方案均 16；方案 2 可达',
    html: '权 2 的 5 条边全选，桥边 <b>BJ–TL 或 WH–QD</b> 二选一（另加 CS–QD）→ <b>两棵最小生成树，总费用均 16</b>。存储用邻接矩阵/邻接表，算法 Prim/Kruskal。TTL=5：<b>方案 2</b> TL 与 BJ 相邻可送达；<b>方案 1</b> 路径 5 跳，TTL 在 XA 路由器归零被丢弃，H2 收不到。记忆锚点：<b>路由器转发时 TTL 减 1，减到 0 即丢弃</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
