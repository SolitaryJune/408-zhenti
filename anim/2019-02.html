<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-02 树的后根遍历 = 二叉树的中序遍历</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域 ================== */
var NS = 'http://www.w3.org/2000/svg';
var ORDER = ['D','E','A','B','C','R'];                 // T 后根遍历（= BT 中序）的访问顺序

var T_POS = { R:[125,28], A:[55,115], B:[125,115], C:[195,115], D:[30,200], E:[80,200] };
var T_EDGE = [ ['R','A'], ['R','B'], ['R','C'], ['A','D'], ['A','E'] ];
var B_POS = { R:[120,28], A:[72,110], D:[38,190], B:[152,190], E:[80,258], C:[188,258] };
var B_EDGE = [ ['R','A'], ['A','D'], ['A','B'], ['D','E'], ['B','C'] ];

function el2(tag, attrs){
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function drawTree(svg, pos, edges, prefix){
  edges.forEach(function(ed, i){
    var a = pos[ed[0]], b = pos[ed[1]];
    var dx = b[0]-a[0], dy = b[1]-a[1], len = Math.sqrt(dx*dx+dy*dy);
    var ux = dx/len, uy = dy/len, r = 21;
    var l = el2('line', { x1:a[0]+ux*r, y1:a[1]+uy*r, x2:b[0]-ux*r, y2:b[1]-uy*r,
      stroke:'#5a7d8c66', 'stroke-width':2 });
    l.id = prefix + 'e' + i;
    svg.appendChild(l);
  });
  for (var name in pos){
    var c = el2('circle', { cx:pos[name][0], cy:pos[name][1], r:21,
      fill:'#ffffff', stroke:'#b9cbd0', 'stroke-width':2.5 });
    c.id = prefix + 'n' + name;
    svg.appendChild(c);
    var t = el2('text', { x:pos[name][0], y:pos[name][1]+5.5, 'text-anchor':'middle',
      'font-size':16, 'font-weight':700, fill:'#1b3a4b' });
    t.textContent = name;
    t.id = prefix + 't' + name;
    svg.appendChild(t);
  }
}
function edgeIdx(edges, key){          // key 形如 'R-A'
  for (var i = 0; i < edges.length; i++)
    if (edges[i][0] + '-' + edges[i][1] === key) return i;
  return -1;
}

var snaps = [
  { cls:'step',  tag:'准备',     visit:0, count:0,
    log:'初始：左树 T（根 R，孩子 A、B、C；A 的孩子 D、E），右树是按「左孩子·右兄弟」规则转成的二叉树 BT。目标：T 的后根遍历对应 BT 的哪种遍历。' },
  { cls:'shift', tag:'转换规则', visit:0, count:0, edges:['R-A','A-B','B-C','A-D','D-E'],
    log:'对应关系（琥珀色）：T 中 R 的孩子链 A→B→C，在 BT 里变成 R 的左孩子 A、A 的右孩子 B、B 的右孩子 C；A 的孩子 D、E 变成 A 的左孩子 D、D 的右孩子 E。BT 根无右孩子。' },
  { cls:'step',  tag:'两种遍历同步走', visit:0, count:0,
    log:'T 的后根遍历 = 先依次后根遍历各子树、最后访问根 → 先深入最左子树；BT 的中序 = 左 → 根 → 右，同样先走到最左下结点。两种遍历从这里开始同步进行。' },
  { cls:'ok',    tag:'访问 D', visit:1, count:1, ribbon:{k:1, ok:true},
    log:'访问 D：D 是叶子，无子树 → 输出 D。（BT 中：R 的左子树一路向左走到 D，中序第一个输出它）' },
  { cls:'ok',    tag:'访问 E', visit:2, count:2, ribbon:{k:2, ok:true},
    log:'访问 E：D 的兄弟（BT 中 D 的右孩子）→ 序列 D E。' },
  { cls:'ok',    tag:'访问 A', visit:3, count:3, ribbon:{k:3, ok:true},
    log:'A 的子树全部访问完 → 访问 A。序列 D E A。（BT 中：D、E 都在 A 的左子树里，左子树走完才轮到 A）' },
  { cls:'ok',    tag:'访问 B', visit:4, count:4, ribbon:{k:4, ok:true},
    log:'访问 B：B 无子树（BT 中是 A 的右孩子）。序列 D E A B。' },
  { cls:'ok',    tag:'访问 C', visit:5, count:5, ribbon:{k:5, ok:true},
    log:'访问 C。序列 D E A B C。' },
  { cls:'ok',    tag:'访问 R', visit:6, count:6, ribbon:{k:6, ok:true},
    log:'最后访问根 R → 序列 D E A B C R。在 BT 上按「左→根→右」走中序，得到的也是完全相同的序列。' },
  { cls:'done',  tag:'序列一致', visit:6, count:6, done:true,
    log:'对比完成：T 的后根遍历序列 = BT 的中序遍历序列 = D E A B C R。同理：T 的先根遍历对应 BT 的先序遍历。答案选 B（中序遍历）。' },
];

AW.init({
  title: '2019-02 · 树的后根遍历 对应 二叉树的中序遍历',
  subtitle: '转换规则：<code>左孩子·右兄弟</code> · 示例树 T = R(A(D,E), B, C)',
  counterLabel: '已访问结点数',
  ribbonTitle: '访问序号（T 后根 ≡ BT 中序）',
  intro: '点击「▶ 播放」同步走一遍 T 的后根遍历与 BT 的中序遍历。',
  snaps: snaps,

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.style.minWidth = '560px';
    var flex = AW.el('div', '');
    flex.style.cssText = 'display:flex;gap:30px;flex-wrap:wrap;justify-content:center';
    function treeBlock(pos, edges, prefix, cap){
      var box = AW.el('div', '');
      var capEl = AW.el('div', 'aw-row-label', cap);
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('width', 245);
      svg.setAttribute('height', prefix === 'B' ? 292 : 232);
      box.appendChild(capEl);
      box.appendChild(svg);
      drawTree(svg, pos, edges, prefix);
      return box;
    }
    flex.appendChild(treeBlock(T_POS, T_EDGE, 'T', '<b>树 T</b>　R(A(D,E), B, C)'));
    flex.appendChild(treeBlock(B_POS, B_EDGE, 'B', '<b>二叉树 BT</b>（左孩子·右兄弟）'));
    inner.appendChild(flex);
    var seqLabel = AW.el('div', 'aw-row-label', '<b>访问序列</b>（T 的后根 ≡ BT 的中序）');
    seqLabel.style.marginTop = '12px';
    var seq = AW.el('div', 'aw-cells');
    seq.id = 'seqRow';
    inner.appendChild(seqLabel);
    inner.appendChild(seq);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    var v = sn.visit || 0;
    function paint(prefix, pos){
      for (var name in pos){
        var c = document.getElementById(prefix + 'n' + name);
        var t = document.getElementById(prefix + 't' + name);
        var idx = ORDER.indexOf(name);
        if (idx > -1 && idx < v - 1){
          c.setAttribute('fill', '#2f9e4424'); c.setAttribute('stroke', '#2f9e44');
          t.setAttribute('fill', '#1e4d33');
        } else if (idx > -1 && idx === v - 1){
          c.setAttribute('fill', '#2f9e44'); c.setAttribute('stroke', '#2f9e44');
          t.setAttribute('fill', '#ffffff');
        } else {
          c.setAttribute('fill', '#ffffff'); c.setAttribute('stroke', '#b9cbd0');
          t.setAttribute('fill', '#1b3a4b');
        }
      }
    }
    paint('T', T_POS);
    paint('B', B_POS);
    // 边高亮（只高亮 BT 的转换对应边）
    B_EDGE.forEach(function(ed, k){
      var l = document.getElementById('Be' + k);
      var on = sn.edges && edgeIdx(B_EDGE, ed[0] + '-' + ed[1]) === k && sn.edges.indexOf(ed[0] + '-' + ed[1]) >= 0;
      l.setAttribute('stroke', on ? '#e07a2f' : '#5a7d8c66');
      l.setAttribute('stroke-width', on ? 3.5 : 2);
    });
    // 访问序列行
    var seq = document.getElementById('seqRow');
    var h = '';
    if (v === 0){
      h = '<span style="font-size:12.5px;color:#b9cbd0;align-self:center">（尚未开始，序列将随访问逐个长出）</span>';
    } else {
      for (var k = 0; k < v; k++){
        var cur = (k === v - 1);
        h += '<div class="aw-col"><div class="aw-ptr"></div>' +
             '<div class="aw-box' + (cur ? ' hit' : ' ok') + '" style="width:40px;height:40px;font-size:16px">' +
             ORDER[k] + '</div><div class="aw-idx">' + (k + 1) + '</div></div>';
      }
    }
    seq.innerHTML = h;
  },

  result: {
    big: '答案 B（中序遍历）',
    html: '树转二叉树（左孩子·右兄弟）后：<b>后根遍历 → 中序遍历</b>、先根遍历 → 先序遍历。记忆锚点：BT 根的右子树为空，中序「左 → 根 → 右」恰好就是「先各子树、最后根」。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
