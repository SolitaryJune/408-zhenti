<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-04 AVL 删除 v 再插入 v · 三例实证动画</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .avl-svg{display:block;margin:0 auto;background:#f8fafc;border:1px solid #1b3a4b26;border-radius:10px}
  .avl-svg .aedge{stroke:#cbd5e1;stroke-width:2;transition:opacity .35s}
  .avl-svg .anode circle{transition:fill .3s, stroke .3s, opacity .35s}
  .avl-svg .anode text{font-weight:800;font-size:13px;text-anchor:middle;dominant-baseline:central;
    transition:fill .3s, opacity .35s}
  .avl-svg .anode.norm circle{fill:#ffffff;stroke:#94a3b8;stroke-width:2.2}
  .avl-svg .anode.norm text{fill:#334155}
  .avl-svg .anode.vmark circle{fill:#fee2e2;stroke:#dc2626;stroke-width:3}
  .avl-svg .anode.vmark text{fill:#b91c1c}
  .avl-svg .anode.bad circle{fill:#dc2626;stroke:#dc2626}
  .avl-svg .anode.bad text{fill:#fff}
  .avl-svg .anode.hot circle{fill:#e07a2f;stroke:#e07a2f}
  .avl-svg .anode.hot text{fill:#fff}
  .avl-svg .anode.good circle{fill:#16a34a;stroke:#16a34a}
  .avl-svg .anode.good text{fill:#fff}
  .avl-svg .abf{font-size:10.5px;font-weight:700;fill:#92400e;text-anchor:middle;transition:opacity .35s}
  .avl-svg .hidden-el{opacity:0}
  .avl-cap{font-size:13px;color:#334155;font-weight:700;margin:12px 0 6px}
  .avl-flex{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .avl-panel .pcap{font-size:11.5px;color:#64748b;margin-top:3px;text-align:center}
  .propbox{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .propchip{border:1.5px solid #cbd5e1;border-radius:999px;padding:4px 12px;font-size:13px;
    font-weight:700;color:#475569;transition:all .3s}
  .propchip.ok{border-color:#16a34a;background:#dcfce7;color:#15803d}
  .propchip.miss{border-color:#dc2626;background:#fee2e2;color:#b91c1c}
  .verdict{margin:10px auto 0;max-width:640px;border-radius:10px;padding:8px 14px;font-size:13.5px;
    font-weight:700;text-align:center;display:none}
  .verdict.show{display:block}
  .verdict.same{border:1.5px solid #16a34a;background:#f6fef9;color:#15803d}
  .verdict.diff{border:1.5px solid #dc2626;background:#fff8f8;color:#b91c1c}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 2019-04 AVL 删除 v 再插入 v（SVG 实证） ==================
 * 题：T1 —删 v→ T2 —插 v→ T3（都是 AVL）。I：v 是叶 → T1 与 T3 可能不相同（✓）；
 * II：v 非叶 → 一定不相同（✗，例 B 复原）；III：v 非叶 → 一定相同（✗，例 C 旋转）。
 * 演示：三个最小 AVL 实例，逐步删除 → 修复 → 插回，直接比较 T1 与 T3。 */

var MINI = {
  A1: { nodes:{ '8':[100,28], '4':[56,84], '12':[146,84], '2':[30,140], '6':[82,140], '7':[108,182], '14':[170,140] },
        edges:[ ['8','4'], ['8','12'], ['4','2'], ['4','6'], ['6','7'], ['12','14'] ],
        bf:{ '4':'bf=−1' }, cap:'T₁（删除前）' },
  A2: { nodes:{ '8':[100,28], '6':[56,84], '12':[146,84], '4':[30,140], '7':[82,140], '14':[170,140] },
        edges:[ ['8','6'], ['8','12'], ['6','4'], ['6','7'], ['12','14'] ], cap:'T₂（左旋后）' },
  A3: { nodes:{ '8':[100,28], '6':[56,84], '12':[146,84], '4':[30,140], '7':[82,140], '14':[170,140], '2':[14,182] },
        edges:[ ['8','6'], ['8','12'], ['6','4'], ['6','7'], ['12','14'], ['4','2'] ], cap:'T₃（插回 v 后）' },
  B1: { nodes:{ '8':[100,28], '4':[56,84], '12':[146,84], '2':[30,140], '6':[82,140], '5':[56,182], '14':[170,140] },
        edges:[ ['8','4'], ['8','12'], ['4','2'], ['4','6'], ['6','5'], ['12','14'] ], cap:'T₁（删除前）' },
  B2: { nodes:{ '8':[100,28], '4':[56,84], '12':[146,84], '2':[30,140], '5':[82,140], '14':[170,140] },
        edges:[ ['8','4'], ['8','12'], ['4','2'], ['4','5'], ['12','14'] ], cap:'T₂（孩子顶替）' },
  B3: { nodes:{ '8':[100,28], '4':[56,84], '12':[146,84], '2':[30,140], '6':[82,140], '5':[56,182], '14':[170,140] },
        edges:[ ['8','4'], ['8','12'], ['4','2'], ['4','6'], ['6','5'], ['12','14'] ], cap:'T₃（插回 v 后）' },
  C1: { nodes:{ '8':[100,28], '4':[56,84], '12':[146,84], '2':[30,140], '6':[82,140], '7':[108,182], '14':[170,140] },
        edges:[ ['8','4'], ['8','12'], ['4','2'], ['4','6'], ['6','7'], ['12','14'] ], cap:'T₁（删除前）' },
  C2i:{ nodes:{ '8':[100,28], '2':[56,84], '12':[146,84], '6':[82,140], '7':[108,182], '14':[170,140] },
        edges:[ ['8','2'], ['8','12'], ['2','6'], ['6','7'], ['12','14'] ],
        bf:{ '2':'bf=−2' }, cap:'删 v 后（前驱 2 顶替）' },
  C2: { nodes:{ '8':[100,28], '6':[56,84], '12':[146,84], '2':[30,140], '7':[82,140], '14':[170,140] },
        edges:[ ['8','6'], ['8','12'], ['6','2'], ['6','7'], ['12','14'] ], cap:'T₂（左旋后）' },
  C3: { nodes:{ '8':[100,28], '6':[56,84], '12':[146,84], '2':[30,140], '7':[82,140], '14':[170,140], '4':[52,182] },
        edges:[ ['8','6'], ['8','12'], ['6','2'], ['6','7'], ['12','14'], ['2','4'] ], cap:'T₃（插回 v 后）' },
};
var ROWS = { A:['A1','A2','A3'], B:['B1','B2','B3'], C:['C1','C2i','C2','C3'] };
var ROW_CAP = {
  A:'例 A：v = 2 是<b>叶结点</b> —— 检验命题 I（T₁ 与 T₃ 可能不相同）',
  B:'例 B：v = 6 只<b>有一个孩子</b> —— 命题 II 的反例',
  C:'例 C：v = 4 有<b>两个孩子</b> —— 命题 III 的反例',
};

var snaps = [
  { cls:'step',  tag:'审题', rows:[], st:{}, props:{}, count:0,
    log:'链条：T₁ —删除 v→ T₂ —插入 v→ T₃，三棵都是平衡二叉树。关键机制：<b>删除可能触发旋转、改变树形；插入只按 BST 规则挂到叶位，不会把旋转"转回去"</b>。策略：对命题 I 造一个"不相同"的实例，对 II、III 各找一个反例。' },
  { cls:'shift', tag:'例A · 删叶前', rows:['A'], st:{ A1:{ mode:'show', v:['2'], bfShow:['4'] } }, props:{}, count:1,
    log:'例 A：取 v = 2（叶结点）。删除前父结点 4 的右子树更高（bf = −1），而 v 恰好挂在 4 的<b>左</b>子树里 —— 删掉它，左边会更短。' },
  { cls:'miss',  tag:'例A · 删除失衡', rows:['A'], st:{ A1:{ mode:'show', gone:['2'], bad:['4'] } },
    bft:{ 'A1-4':'bf=−2' }, props:{}, count:2,
    log:'删掉叶 v = 2：结点 4 的左子树变空 → bf 由 −1 变 <b>−2，失衡！</b>AVL 必须旋转修复。' },
  { cls:'ok',    tag:'例A · 左旋修复', rows:['A'], st:{ A1:{ mode:'dim' }, A2:{ mode:'show', hot:['6'] } },
    props:{}, count:3,
    log:'RR 型 → <b>左旋</b>：6 上移作子树根，4 下沉为 6 的左孩子。树恢复平衡，得到 T₂ —— 但形状已经变了。' },
  { cls:'ok',    tag:'例A · 插回 v', rows:['A'], st:{ A1:{ mode:'dim' }, A2:{ mode:'dim' }, A3:{ mode:'show', good:['2'] } },
    props:{ 1:'ok' }, va:true, count:4, ribbon:{k:1, ok:true},
    log:'把 v = 2 按 BST 规则插回：2<8 走左、2<6 走左、2<4 → 挂到 4 的左孩子。全程无需旋转 → T₃ 定格在新形状：<b>T₃ ≠ T₁</b>。v 是叶、两树<b>可能</b>不相同 —— 命题 I 成立 ✓（它只说"可能"，措辞严谨）。' },
  { cls:'shift', tag:'例B · 单孩结点', rows:['B'], st:{ B1:{ mode:'show', v:['6'] } },
    props:{ 1:'ok' }, va:true, count:5,
    log:'例 B（检验 II）：取 v = 6 —— 不是叶，但<b>只有一个孩子</b>（左孩子 5）。看它删除+插回后能否复原。' },
  { cls:'ok',    tag:'例B · 孩子顶替', rows:['B'], st:{ B1:{ mode:'dim' }, B2:{ mode:'show', hot:['5'] } },
    props:{ 1:'ok' }, va:true, count:6,
    log:'删除只有一个孩子的 v：<b>孩子 5 直接顶替</b> 6 的位置，全程无旋转，各结点仍平衡 → T₂。' },
  { cls:'ok',    tag:'例B · 插回复原', rows:['B'], st:{ B2:{ mode:'dim' }, B3:{ mode:'show', good:['6'] } },
    props:{ 1:'ok', 2:'miss' }, va:true, vb:true, count:7, ribbon:{k:2, ok:false},
    log:'再插回 6：6<8 走左、6>4 走右、6>5 → 挂到 5 的右孩子 —— <b>恰好落回原位</b>，树形完全复原 → <b>T₃ = T₁</b>。"一定不相同"被反例推翻 → 命题 II 错 ✗。' },
  { cls:'shift', tag:'例C · 双孩结点', rows:['C'], st:{ C1:{ mode:'show', v:['4'] } },
    props:{ 1:'ok', 2:'miss' }, va:true, vb:true, count:8,
    log:'例 C（检验 III）：取 v = 4 —— 内部结点，<b>有两个孩子</b>（2 和 6）。' },
  { cls:'miss',  tag:'例C · 顶替又失衡', rows:['C'], st:{ C1:{ mode:'dim' }, C2i:{ mode:'show', bad:['2'] } },
    props:{ 1:'ok', 2:'miss' }, va:true, vb:true, count:9,
    log:'删除有两个孩子的 v：用<b>中序前驱 2 顶替</b>到 4 的位置；2 的左孩子没了 → bf = −2 <b>再次失衡</b>。' },
  { cls:'ok',    tag:'例C · 左旋修复', rows:['C'], st:{ C2i:{ mode:'dim' }, C2:{ mode:'show', hot:['6'] } },
    props:{ 1:'ok', 2:'miss' }, va:true, vb:true, count:10,
    log:'左旋：6 上移、2 下沉 → T₂ 恢复平衡。' },
  { cls:'ok',    tag:'例C · 插回 v', rows:['C'], st:{ C2:{ mode:'dim' }, C3:{ mode:'show', good:['4'] } },
    props:{ 1:'ok', 2:'miss', 3:'miss' }, va:true, vb:true, vc:true, count:11, ribbon:{k:3, ok:false},
    log:'插回 4：4<8 走左、4<6 走左、4>2 → 挂到 2 的右孩子。树形已变 → <b>T₃ ≠ T₁</b>。"一定相同"被反例推翻 → 命题 III 错 ✗。' },
  { cls:'done',  tag:'结论', rows:['A','B','C'],
    st:{ A3:{ mode:'show', good:['2'] }, B3:{ mode:'show', good:['6'] }, C3:{ mode:'show', good:['4'] } },
    props:{ 1:'ok', 2:'miss', 3:'miss' }, va:true, vb:true, vc:true, count:12, done:true,
    log:'三个实验齐了：I ✓（删叶可能旋转 → T₃ 可能不同）；II ✗（单孩删除无旋转，插回复原）；III ✗（双孩删除可能旋转，插不回去）。仅 I 正确 → 选 <b>A（仅 I）</b>。' },
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var root = AW.el('div', '');
  for (var r in ROWS){
    var row = AW.el('div', '');
    row.id = 'row' + r;
    row.style.display = 'none';
    var cap = AW.el('div', 'avl-cap', ROW_CAP[r]);
    var flex = AW.el('div', 'avl-flex');
    ROWS[r].forEach(function(mid){
      var m = MINI[mid];
      var panel = AW.el('div', 'avl-panel');
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 200 205');
      svg.setAttribute('width', '200');
      svg.setAttribute('height', '205');
      svg.setAttribute('class', 'avl-svg');
      m.edges.forEach(function(ed){
        var a = m.nodes[ed[0]], b = m.nodes[ed[1]];
        var dx = b[0]-a[0], dy = b[1]-a[1], len = Math.sqrt(dx*dx + dy*dy);
        var ux = dx/len, uy = dy/len, rr = 14;
        var ln = document.createElementNS(svgNS, 'line');
        ln.setAttribute('x1', a[0]+ux*rr); ln.setAttribute('y1', a[1]+uy*rr);
        ln.setAttribute('x2', b[0]-ux*rr); ln.setAttribute('y2', b[1]-uy*rr);
        ln.setAttribute('class', 'aedge');
        ln.id = 'E-' + mid + '-' + ed[0] + '-' + ed[1];
        svg.appendChild(ln);
      });
      for (var name in m.nodes){
        var p = m.nodes[name];
        var g = document.createElementNS(svgNS, 'g');
        g.setAttribute('class', 'anode norm');
        g.id = 'N-' + mid + '-' + name;
        var c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 14);
        var t = document.createElementNS(svgNS, 'text');
        t.setAttribute('x', p[0]); t.setAttribute('y', p[1]);
        t.textContent = name;
        g.appendChild(c); g.appendChild(t);
        svg.appendChild(g);
      }
      for (var bn in (m.bf || {})){
        var bt = document.createElementNS(svgNS, 'text');
        bt.setAttribute('x', m.nodes[bn][0]); bt.setAttribute('y', m.nodes[bn][1] + 28);
        bt.setAttribute('class', 'abf hidden-el');
        bt.textContent = m.bf[bn];
        bt.id = 'BF-' + mid + '-' + bn;
        svg.appendChild(bt);
      }
      panel.appendChild(svg);
      panel.appendChild(AW.el('div', 'pcap', m.cap));
      flex.appendChild(panel);
    });
    var vd = AW.el('div', 'verdict');
    vd.id = 'vd' + r;
    row.appendChild(cap);
    row.appendChild(flex);
    row.appendChild(vd);
    root.appendChild(row);
  }
  var propBox = AW.el('div', 'propbox');
  propBox.id = 'propBox';
  propBox.innerHTML =
    '<span class="propchip" id="prop1">I．v 为叶 → 可能不相同</span>' +
    '<span class="propchip" id="prop2">II．v 非叶 → 一定不相同</span>' +
    '<span class="propchip" id="prop3">III．v 非叶 → 一定相同</span>';
  root.appendChild(propBox);
  stage.appendChild(root);
  this._rows = { A:1, B:1, C:1 };
}

var VERDICT_TXT = {
  A: ['same', '例 A 结论：T₃ ≠ T₁ —— v 是叶，删除引发旋转、插回落在新叶位。命题 I「可能不相同」成立 ✓'],
  B: ['same', '例 B 结论：T₃ = T₁ —— 单孩删除无旋转，插回恰好复原。命题 II「一定不相同」被推翻 ✗'],
  C: ['diff', '例 C 结论：T₃ ≠ T₁ —— 双孩删除经前驱顶替引发旋转。命题 III「一定相同」被推翻 ✗'],
};

function render(stage, sn, i){
  var st = sn.st || {};
  for (var r in ROWS){
    document.getElementById('row' + r).style.display = (sn.rows && sn.rows.indexOf(r) >= 0) ? '' : 'none';
  }
  for (var mid in MINI){
    var m = MINI[mid];
    var s = st[mid];
    var gone = (s && s.gone) || {};
    var stMap = {};
    if (s){ (s.v || []).forEach(function(n){ stMap[n] = 'vmark'; });
            (s.bad || []).forEach(function(n){ stMap[n] = 'bad'; });
            (s.hot || []).forEach(function(n){ stMap[n] = 'hot'; });
            (s.good || []).forEach(function(n){ stMap[n] = 'good'; }); }
    for (var name in m.nodes){
      var g = document.getElementById('N-' + mid + '-' + name);
      var op;
      if (!s) op = '0';
      else if (s.mode === 'dim') op = '0.35';
      else op = (gone[name] != null) ? '0' : '1';
      g.setAttribute('class', 'anode ' + (stMap[name] || 'norm'));
      g.style.opacity = op;
    }
    m.edges.forEach(function(ed){
      var ln = document.getElementById('E-' + mid + '-' + ed[0] + '-' + ed[1]);
      var op;
      if (!s) op = '0';
      else if (s.mode === 'dim') op = '0.35';
      else op = (gone[ed[0]] != null || gone[ed[1]] != null) ? '0' : '1';
      ln.style.opacity = op;
    });
    for (var bf in (m.bf || {})){
      var bt = document.getElementById('BF-' + mid + '-' + bf);
      bt.textContent = (sn.bft && sn.bft[mid + '-' + bf]) || m.bf[bf];
      var show = !!(s && s.mode === 'show' &&
        (stMap[bf] === 'bad' || stMap[bf] === 'hot' || stMap[bf] === 'vmark' ||
         (s.bfShow && s.bfShow.indexOf(bf) >= 0)));
      bt.style.opacity = show ? '1' : '0';
    }
  }
  var props = sn.props || {};
  for (var pi = 1; pi <= 3; pi++){
    document.getElementById('prop' + pi).setAttribute('class', 'propchip ' + (props[pi] || ''));
  }
  var vmap = { A: sn.va, B: sn.vb, C: sn.vc };
  for (var vr in vmap){
    var vd = document.getElementById('vd' + vr);
    if (vmap[vr]){
      vd.setAttribute('class', 'verdict show ' + VERDICT_TXT[vr][0]);
      vd.innerHTML = VERDICT_TXT[vr][1];
    } else {
      vd.setAttribute('class', 'verdict');
    }
  }
}

AW.init({
  title: '2019-04 AVL 删除 v 再插入 v，T₁ 与 T₃ 相同吗？',
  subtitle: 'T₁ —删除 v→ T₂ —插入 v→ T₃ · 三个命题用三个最小实例逐一验证',
  counterLabel: '推演步',
  ribbonTitle: '三个命题（✓ 成立 / ✗ 推翻）',
  intro: '点击「▶ 播放」逐例删除 → 修复 → 插回，直接对比 T₁ 与 T₃ 的形状。',
  build: build,
  render: render,
  snaps: snaps,
  result: {
    big: '答案 A（仅 I）',
    html: '<b>I 对</b>：v 是叶时删除<b>可能</b>引发旋转（例 A），插回只挂新叶位、不撤销旋转 → T₃ 可能不相同。' +
      '<b>II 错</b>：v 只有一个孩子时删除无旋转（例 B），插回复原 → T₃ = T₁ 也会发生。' +
      '<b>III 错</b>：v 有两个孩子时前驱顶替可能引发旋转（例 C）→ T₃ ≠ T₁ 也会发生。' +
      '记忆锚点：<b>删除会"变形"，插入只"长叶"，二者不互逆；"一定相同/一定不相同"都要找反例</b>。',
  },
});
</script>
</body>
</html>
