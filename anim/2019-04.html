<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-04 AVL 删除后插入 · 推理动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域 ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：删除与插入不互逆', cls: 'key',
    body: '<p>链条：T1（AVL）—删除 v→ T2（AVL）—插入 v→ T3（AVL）。问 T1 与 T3 的关系。核心机制：<b>删除可能触发旋转改变树形；插入只把新结点挂到叶位，不会把旋转过的树"转回去"</b>。</p>' },
  { title: '机制：插入不会撤销旋转', cls: '',
    body: '<p>插入按二叉排序树规则落到叶层，插入后最多引发一次旋转且只影响插入路径。所以 T3 是否等于 T1，取决于<b>删除阶段有没有转动结构</b>——这是判定三个命题的钥匙。</p>' },
  { title: '命题 I：v 是叶 → 可能不相同', cls: 'good',
    body: '<p>"<b>可能</b>不相同"是存在性命题，举一例即可。设 T1 中 v 是叶，其父结点另一棵子树更高：删除 v 后父结点失衡 → <b>旋转</b>，树形改变；再插入 v，落回叶层后即恢复平衡、不再旋转 → T3 ≠ T1。I 成立。</p>' },
  { title: 'I 的另一面：也可能相同', cls: '',
    body: '<p>若删除 v 没引起旋转（父结点仍平衡），插入 v 回原位，T3 = T1 也可能发生。所以 I 只说"可能不相同"，措辞严谨、<b>判断准确</b>。</p>' },
  { title: '命题 II：非叶 → 一定不相同', cls: 'bad',
    body: '<p>反例：v 只有一个孩子，删除时用该孩子接替 v 的位置，<b>全程无旋转</b>；再插入 v，按 BST 性质恰好落回原来的叶位置，树形完全复原 → T3 = T1。"一定不相同"错。</p>' },
  { title: '命题 III：非叶 → 一定相同', cls: 'bad',
    body: '<p>反例：v 是内部结点，删除时用前驱/后继填补，引发<b>旋转</b>；插入 v 后不再转回 → T3 ≠ T1。"一定相同"错。删除内部结点可能旋转、也可能不旋转，两个"一定"都站不住。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>仅 I 正确，答案选 <b>A（仅 I）</b>。记忆锚点：<b>删除会"变形"，插入只"长叶"，二者不互逆</b>；凡"一定相同/一定不相同"的绝对化说法，先找反例。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2019-04 · AVL 删除 v 再插入 v，树形是否复原',
  subtitle: 'T1 —删除 v→ T2 —插入 v→ T3 · 三个命题逐项推演',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（仅 I）',
    html: 'I 对：叶结点删除<b>可能</b>引发旋转，插入不撤销旋转 → T3 可能不同。II、III 错：非叶删除既可能无旋转（T3 复原相同）、也可能旋转（T3 不同）。记忆：<b>删除变形、插入长叶、不互逆</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
