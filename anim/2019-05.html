<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-05 AOE 网 · 活动 d 的最早/最迟开始时间</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域 ================== */
var NS = 'http://www.w3.org/2000/svg';

// 事件结点坐标
var NP = { 1:[70,170], 2:[330,70], 3:[330,270], 4:[590,70], 5:[590,270], 6:[800,170] };
// 活动：[名称, 尾事件, 头事件, 时长, 标签坐标]
var EDGES = [
  ['a', 1, 2, 3,  [185,100]],
  ['c', 1, 3, 8,  [168,235]],
  ['b', 3, 2, 4,  [360,172]],
  ['d', 2, 4, 7,  [460,48]],
  ['e', 2, 5, 6,  [430,158]],
  ['f', 3, 5, 10, [460,304]],
  ['g', 4, 6, 6,  [708,106]],
  ['h', 5, 6, 9,  [708,242]],
];

function el2(tag, attrs){
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function arrowPts(x1, y1, x2, y2){
  var ang = Math.atan2(y2 - y1, x2 - x1), L = 9, W = 6.5;
  var ax = x2, ay = y2;
  return ax + ',' + ay + ' ' +
    (ax - L*Math.cos(ang) + W*Math.sin(ang)) + ',' + (ay - L*Math.sin(ang) - W*Math.cos(ang)) + ' ' +
    (ax - L*Math.cos(ang) - W*Math.sin(ang)) + ',' + (ay - L*Math.sin(ang) + W*Math.cos(ang));
}

function edgeSet(list){
  var m = {};
  if (list) for (var i = 0; i < list.length; i++) m[list[i]] = 1;
  return m;
}

var snaps = [
  { cls:'step', tag:'读题', log:'AOE 网：8 个活动 a~h、6 个事件。活动 d 从事件 2 指向事件 4、历时 7。目标：求 d 的最早开始时间与最迟开始时间。规则预告：最早开始 = 弧尾事件的 ve；最迟开始 = 弧头事件的 vl − 活动时长。' },
  { cls:'ok', tag:'ve(1)=0', ve:{1:0}, cur:1,
    log:'源点（工程开始事件）1：ve(1) = 0。' },
  { cls:'ok', tag:'ve(3)=8', ve:{1:0,3:8}, cur:3, edges:['c'],
    log:'事件 3 只有一条入边 c=8：ve(3) = ve(1) + 8 = 8。' },
  { cls:'ok', tag:'ve(2)=12', ve:{1:0,3:8,2:12}, cur:2, edges:['a','b','c'],
    log:'事件 2 有两条入边：ve(1)+a = 3、ve(3)+b = 12，多入边取最大 → ve(2) = 12。（1→3→2 这条路更长，a=3 被淘汰）' },
  { cls:'ok', tag:'ve(4)=19', ve:{1:0,3:8,2:12,4:19}, cur:4, edges:['d'],
    log:'事件 4 只有入边 d=7：ve(4) = ve(2) + 7 = 19。' },
  { cls:'ok', tag:'ve(5)=18', ve:{1:0,3:8,2:12,4:19,5:18}, cur:5, edges:['e','f'],
    log:'事件 5：ve(2)+e = 18、ve(3)+f = 18，取最大 → ve(5) = 18。' },
  { cls:'ok', tag:'工期 27 · 关键路径', ve:{1:0,3:8,2:12,4:19,5:18,6:27}, cur:6, edges:['g','h'], crit:['c','b','e','h'],
    log:'事件 6：ve(4)+g = 25、ve(5)+h = 27 → ve(6) = 27，即工期 27。绿色标出关键路径 1→3→2→5→6（活动 c、b、e、h）。' },
  { cls:'shift', tag:'开始倒推 vl', ve:{1:0,3:8,2:12,4:19,5:18,6:27}, vl:{6:27}, cur:6,
    log:'求各事件最迟发生时间 vl：从汇点倒推、多出边取最小。汇点不影响工期：vl(6) = ve(6) = 27。' },
  { cls:'shift', tag:'vl(4)=21', ve:{1:0,3:8,2:12,4:19,5:18,6:27}, vl:{6:27,4:21}, cur:4, edges:['g'],
    log:'vl(4) = vl(6) − g = 27 − 6 = 21。' },
  { cls:'shift', tag:'vl(5)=18', ve:{1:0,3:8,2:12,4:19,5:18,6:27}, vl:{6:27,4:21,5:18}, cur:5, edges:['h'],
    log:'vl(5) = vl(6) − h = 27 − 9 = 18（与 ve(5) 相等，说明 f、e、b、c 都是关键活动）。' },
  { cls:'shift', tag:'vl(2)=12', ve:{1:0,3:8,2:12,4:19,5:18,6:27}, vl:{6:27,4:21,5:18,2:12}, cur:2, edges:['d','e'],
    log:'事件 2 有两条出边，取最小：vl(2) = min{ vl(4)−d = 14, vl(5)−e = 12 } = 12。' },
  { cls:'shift', tag:'vl(3)=8 · vl(1)=0', ve:{1:0,3:8,2:12,4:19,5:18,6:27}, vl:{6:27,4:21,5:18,2:12,3:8,1:0}, cur:3, edges:['b','f'],
    log:'vl(3) = min{ vl(2)−b = 8, vl(5)−f = 8 } = 8；源点 vl(1) = 0。所有 vl 就位。' },
  { cls:'shift', tag:'锁定活动 d', ve:{1:0,3:8,2:12,4:19,5:18,6:27}, vl:{6:27,4:21,5:18,2:12,3:8,1:0}, edges:['d'],
    log:'活动 d（2→4，d=7）：最早开始 = ve(弧尾 2) = 12；最迟开始 = vl(弧头 4) − 7 = 21 − 7 = 14。时间余量 14 − 12 = 2 > 0 → d 不是关键活动。' },
  { cls:'done', tag:'完成', ve:{1:0,3:8,2:12,4:19,5:18,6:27}, vl:{6:27,4:21,5:18,2:12,3:8,1:0}, edges:['d'], done:true,
    log:'活动 d 的最早开始时间为 12、最迟开始时间为 14 → 选 C（12 和 14）。' },
];

AW.init({
  title: '2019-05 · AOE 网中活动 d 的最早 / 最迟开始时间',
  subtitle: '8 个活动 · 规则：最早 = <code>ve(弧尾)</code>，最迟 = <code>vl(弧头) − 时长</code>',
  counterLabel: '计算步',
  intro: '点击「▶ 播放」先正推 ve、再倒推 vl，最后锁定活动 d。',
  snaps: snaps,

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', 850);
    svg.setAttribute('height', 330);
    EDGES.forEach(function(e){
      var a = NP[e[1]], b = NP[e[2]];
      var dx = b[0]-a[0], dy = b[1]-a[1], len = Math.sqrt(dx*dx + dy*dy);
      var ux = dx/len, uy = dy/len, r = 23;
      var sx = a[0] + ux*r, sy = a[1] + uy*r;
      var ex = b[0] - ux*(r + 7), ey = b[1] - uy*(r + 7);
      var line = el2('line', { x1:sx, y1:sy, x2:ex, y2:ey, stroke:'#5a7d8c66', 'stroke-width':2 });
      line.id = 'le' + e[0];
      svg.appendChild(line);
      var tri = el2('polygon', { points:arrowPts(ex, ey, ex + ux*7, ey + uy*7), fill:'#5a7d8c66' });
      tri.id = 'pe' + e[0];
      svg.appendChild(tri);
      var lab = el2('text', { x:e[4][0], y:e[4][1], 'text-anchor':'middle', 'font-size':15, 'font-weight':700, fill:'#47616c' });
      lab.textContent = e[0] + ' = ' + e[3];
      svg.appendChild(lab);
    });
    for (var n = 1; n <= 6; n++){
      var p = NP[n];
      var c = el2('circle', { cx:p[0], cy:p[1], r:23, fill:'#ffffff', stroke:'#b9cbd0', 'stroke-width':2.5 });
      c.id = 'n' + n;
      svg.appendChild(c);
      var t = el2('text', { x:p[0], y:p[1]+5.5, 'text-anchor':'middle', 'font-size':16, 'font-weight':700, fill:'#1b3a4b' });
      t.textContent = n;
      t.id = 'tn' + n;
      svg.appendChild(t);
      var ve = el2('text', { x:p[0], y:p[1]+46, 'text-anchor':'middle', 'font-size':13.5, 'font-weight':700, fill:'#1b3a4b' });
      ve.textContent = 've = ?';
      ve.id = 've' + n;
      svg.appendChild(ve);
      var vl = el2('text', { x:p[0], y:p[1]-34, 'text-anchor':'middle', 'font-size':13.5, 'font-weight':700, fill:'#92400e' });
      vl.textContent = 'vl = ?';
      vl.id = 'vl' + n;
      svg.appendChild(vl);
    }
    wrap.appendChild(svg);
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    for (var n = 1; n <= 6; n++){
      var ve = (sn.ve && sn.ve[n] != null) ? 've = ' + sn.ve[n] : 've = ?';
      var vl = (sn.vl && sn.vl[n] != null) ? 'vl = ' + sn.vl[n] : 'vl = ?';
      document.getElementById('ve' + n).textContent = ve;
      document.getElementById('vl' + n).textContent = vl;
      var c = document.getElementById('n' + n);
      var t = document.getElementById('tn' + n);
      var computed = sn.ve && sn.ve[n] != null;
      if (sn.cur === n){
        c.setAttribute('fill', '#2f9e44'); c.setAttribute('stroke', '#2f9e44');
        t.setAttribute('fill', '#ffffff');
      } else if (computed){
        c.setAttribute('fill', '#2f9e4424'); c.setAttribute('stroke', '#2f9e44');
        t.setAttribute('fill', '#1e4d33');
      } else {
        c.setAttribute('fill', '#ffffff'); c.setAttribute('stroke', '#b9cbd0');
        t.setAttribute('fill', '#1b3a4b');
      }
    }
    var amber = edgeSet(sn.edges), green = edgeSet(sn.crit);
    EDGES.forEach(function(e){
      var id = e[0], col = '#5a7d8c66', w = 2;
      if (green[id]){ col = '#2f9e44'; w = 3.5; }
      else if (amber[id]){ col = '#e07a2f'; w = 3.5; }
      document.getElementById('le' + id).setAttribute('stroke', col);
      document.getElementById('le' + id).setAttribute('stroke-width', w);
      document.getElementById('pe' + id).setAttribute('fill', col);
    });
  },

  result: {
    big: '12 和 14（答案 C）',
    html: '活动 d（2→4，d=7）：<b>最早开始 = ve(2) = 12</b>；<b>最迟开始 = vl(4) − 7 = 21 − 7 = 14</b>。余量 2 说明 d 非关键活动。口诀：最早看弧尾 ve，最迟 = 弧头 vl − 活动时长。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
