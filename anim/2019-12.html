<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-12 冯·诺依曼结构基本思想辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key', tag: '审题',
    body: '<p>选<b>错误</b>项。考点：冯·诺依曼结构的"存储程序"思想——程序与数据预先存入存储器、都用二进制表示、机器按地址自动逐条取指执行。</p>' },
  { title: '选项 A：程序的功能都通过 CPU 执行指令实现', cls: 'good', tag: 'A 正确',
    body: '<p>对。冯·诺依曼机是<b>指令驱动</b>的：任何程序功能都分解为指令序列，由中央处理器逐条执行完成。</p>' },
  { title: '选项 B：指令和数据都用二进制表示，形式上无差别', cls: 'good', tag: 'B 正确',
    body: '<p>对。指令与数据都以二进制形式、同等地位存放在存储器中，CPU 靠<b>取指 / 取数阶段</b>来区分它们，这正是"存储程序"的重要特征。</p>' },
  { title: '选项 C：指令按地址访问，数据都在指令中直接给出', cls: 'bad', tag: 'C 错误',
    body: '<p><b>错在后半句。</b>数据同样存放在存储器中、<b>按地址访问</b>；指令的地址码给出的是操作数的<b>地址（或寻址方式信息）</b>，操作数本身并不一定直接写在指令里——寄存器寻址、存储器间接寻址等都不是"直接给出"。</p>' },
  { title: '选项 D：程序执行前，指令和数据需预先存放在存储器中', cls: 'good', tag: 'D 正确',
    body: '<p>对。"存储程序"思想的核心：程序（指令 + 数据）事先放入存储器，机器开机后自动逐条取出执行。</p>' },
  { title: '结论：答案 C', cls: 'good', tag: '完成',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>指令按地址访问，数据同样按地址访问</b>；指令里给的是操作数的"住址"，不是操作数本身。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  var logCls = s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : (s.cls === 'key' ? 'shift' : 'step'));
  return {
    cls: last ? 'done' : logCls,
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2019·12 冯·诺依曼结构基本思想——找错误项',
  subtitle: '考点：<code>存储程序</code>思想 · 逐项辨析',
  intro: '点击「▶ 播放」逐项展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：冯·诺依曼机中<b>指令按地址访问，数据同样按地址访问</b>。指令的地址码给出的是操作数的地址或寻址方式，<b>操作数不一定"直接给出"</b>。A、B、D 三项都是"存储程序"思想的标准表述。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
