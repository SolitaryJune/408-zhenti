<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-14 缺页处理的流程与返回点</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key', tag: '审题',
    body: '<p>选<b>错误</b>项。考点：缺页异常的产生（谁检测）、处理（谁做、依据什么）与返回点（回到哪条指令）。</p>' },
  { title: '选项 A：缺页是在地址转换时 CPU 检测到的一种异常', cls: 'good', tag: 'A 正确',
    body: '<p>对。虚地址转换查页表时发现有效位（存在位）为 0——要访问的页不在主存，CPU 产生<b>页故障异常</b>。</p>' },
  { title: '选项 B：缺页处理由操作系统提供的缺页处理程序来完成', cls: 'good', tag: 'B 正确',
    body: '<p>对。CPU 只负责"发现并转交"；调页、更新页表等都由<b>操作系统的缺页处理程序</b>完成。</p>' },
  { title: '选项 C：缺页处理程序根据页故障地址从外存读入所缺失的页', cls: 'good', tag: 'C 正确',
    body: '<p>对。由页故障地址得到缺页的虚页号，在外存上找到该页调入主存，并更新页表。</p>' },
  { title: '选项 D：缺页处理完成后回到发生缺页指令的下一条指令执行', cls: 'bad', tag: 'D 错误',
    body: '<p><b>错。</b>发生缺页的那条指令<b>并没有执行成功</b>，缺页处理完成后必须<b>回到该指令重新执行</b>；返回"下一条"会使这次访存凭空丢失。</p>' },
  { title: '结论：答案 D', cls: 'good', tag: '完成',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>缺页属"故障"类异常——处理完重执本条指令</b>；自陷（trap）才是"执行完本条再转、返回下一条"。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  var logCls = s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : (s.cls === 'key' ? 'shift' : 'step'));
  return {
    cls: last ? 'done' : logCls,
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2019·14 缺页处理——找错误项',
  subtitle: '考点：<code>缺页异常</code>的产生 · 处理 · 返回点',
  intro: '点击「▶ 播放」逐项展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '缺页处理完成后应<b>重新执行发生缺页的那条指令</b>（此时页已调入，访存才能成功）。干扰核心：把缺页当成"执行完再处理"的自陷，误以为返回下一条指令。A、B、C 是缺页处理链路的标准描述。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
