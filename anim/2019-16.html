<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-16 时钟脉冲信号相关概念辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key', tag: '审题',
    body: '<p>选<b>错误</b>项。考点：时钟脉冲信号的产生、时钟周期与主频的定义、时钟周期与指令执行的关系。</p>' },
  { title: '选项 A：时钟脉冲信号由机器脉冲源发出的脉冲信号经整形和分频后形成', cls: 'good', tag: 'A 正确',
    body: '<p>对。脉冲源产生原始脉冲，经<b>整形、分频</b>后得到处理器使用的时钟脉冲信号。</p>' },
  { title: '选项 B：时钟脉冲信号的宽度称为时钟周期，时钟周期的倒数为机器主频', cls: 'good', tag: 'B 正确',
    body: '<p>对。时钟脉冲的宽度（一个稳定节拍）即时钟周期 T，主频 f = 1/T。</p>' },
  { title: '选项 C：时钟周期以相邻状态单元间组合逻辑电路的最大延迟为基准确定', cls: 'good', tag: 'C 正确',
    body: '<p>对。一个时钟周期内信号必须走完两级状态单元之间的组合逻辑并保持稳定，故时钟周期 ≥ 该<b>最大延迟</b>。</p>' },
  { title: '选项 D：处理器总是在每来一个时钟脉冲信号时就开始执行一条新的指令', cls: 'bad', tag: 'D 错误',
    body: '<p><b>错。</b>一条指令的执行要占用<b>多个时钟周期</b>（取指、译码、取数、执行、访存、写回）；采用流水线也只是每个时钟周期<b>流出</b>一条指令，绝不是"每来一个脉冲就开始执行一条新指令"。</p>' },
  { title: '结论：答案 D', cls: 'good', tag: '完成',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>一拍一步，一指令多拍</b>；主频 = 1/时钟周期。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  var logCls = s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : (s.cls === 'key' ? 'shift' : 'step'));
  return {
    cls: last ? 'done' : logCls,
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2019·16 处理器时钟脉冲信号——找错误项',
  subtitle: '考点：<code>时钟周期 · 主频 · 指令执行</code> 的关系辨析',
  intro: '点击「▶ 播放」逐项展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '指令执行与时钟脉冲<b>不是一对一</b>：一条指令占多个时钟周期；流水线是"每拍流出一条"，不是"每拍开始一条"。A（整形分频）、B（周期定义与主频倒数）、C（按组合逻辑最大延迟定周期）均为标准表述。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
