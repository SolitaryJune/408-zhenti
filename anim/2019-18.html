<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-18 五段流水线的数据冒险判定</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
<style>
  .rt{ border-collapse: collapse; width: 100%; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; margin-bottom: 12px; }
  .rt th, .rt td{ border: 1px solid #1b3a4b26; padding: 7px 10px; text-align: center; }
  .rt th{ background: #f8edcb; color: #47616c; }
  .rt tr.hl td{ background: #f8edcb; }
  .rt span.conf{ background: var(--red-bg); border: 1px solid var(--red); color: #a02830; border-radius: 6px; padding: 1px 7px; font-weight: 700; }
  .rt span.same{ background: var(--amber-bg); border: 1px solid var(--amber); color: #92400e; border-radius: 6px; padding: 1px 7px; font-weight: 700; }
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [
  { name: 'I1: add s2, s1, s0', rd: ['s1', 's0'], wr: ['s2'] },
  { name: 'I2: load s3, 0(t2)', rd: ['t2'], wr: ['s3'] },
  { name: 'I3: add s2, s2, s3', rd: ['s2', 's3'], wr: ['s2'] },
  { name: 'I4: store s2, 0(t2)', rd: ['s2', 't2'], wr: [] }
];

function tok(t, c){ return '<span class="' + (c || '') + '">' + t + '</span>'; }

function tableHtml(a, b, confRed, confSame){
  var h = '<table class="rt"><tr><th>指令</th><th>读取的寄存器</th><th>写入的寄存器</th></tr>';
  for (var i = 0; i < 4; i++){
    var hl = (i === a || i === b);
    var rd = ROWS[i].rd.map(function(t){
      var c = (hl && confRed === t) ? 'conf' : ((hl && confSame === t) ? 'same' : '');
      return tok(t, c);
    }).join(' ');
    var wr = ROWS[i].wr.length
      ? ROWS[i].wr.map(function(t){ return tok(t, (hl && confRed === t) ? 'conf' : ''); }).join(' ')
      : '<span style="color:#b9cbd0">—（写主存）</span>';
    h += '<tr' + (hl ? ' class="hl"' : '') + '><td>' + ROWS[i].name + '</td><td>' + rd + '</td><td>' + wr + '</td></tr>';
  }
  return h + '</table>';
}

function verdictCard(good, title, body){
  return '<div class="aw-stepcard ' + (good ? 'good' : 'bad') + '"><h4>' + title + '</h4>' + body + '</div>';
}

function pairSnap(a, b, confRed, confSame, good, title, body){
  return tableHtml(a, b, confRed, confSame) + verdictCard(good, title, body);
}

var STEPS = [
  { title: '建表：每条指令读、写哪些寄存器', log: '先列写 4 条指令的读/写寄存器——数据冒险 = 对同一寄存器的"先写后读/先写后写"冲突',
    html: tableHtml(-1, -1, null, null) +
      '<div class="aw-stepcard key"><h4>判定标准</h4><p>数据冒险看<b>寄存器</b>上的时序冲突：前一条<b>写</b>某寄存器、后一条<b>读/写</b>同一寄存器（RAW / WAW）→ 有冒险；两条指令都只是<b>读</b>同一寄存器 → 不冲突。</p></div>' },
  { title: 'I1 ↔ I3：有冒险', log: 'I1 写 s2，I3 又读又写 s2：RAW + WAW 双重冲突', ribbon: { k: 1, ok: false },
    html: pairSnap(0, 2, 's2', null, false, 'I1 ↔ I3：存在数据冒险',
      '<p>I1 <b>写</b> s2 → I3 <b>读</b> s2（写后读 RAW），且 I3 还要<b>写</b> s2（写后写 WAW）——同一寄存器 s2 上双重冲突。</p>') },
  { title: 'I2 ↔ I3：有冒险', log: 'I2 写 s3，I3 读 s3：RAW', ribbon: { k: 2, ok: false },
    html: pairSnap(1, 2, 's3', null, false, 'I2 ↔ I3：存在数据冒险',
      '<p>I2 <b>写</b> s3 → I3 <b>读</b> s3：RAW。若 I3 在 I2 写回前读 s3，会拿到旧值。</p>') },
  { title: 'I2 ↔ I4：无数据冒险', log: 'I2 只碰 s3/t2，I4 只读 s2、t2 并写主存：没有"写→读"的公共寄存器', ribbon: { k: 3, ok: true },
    html: pairSnap(1, 3, null, 't2', true, 'I2 ↔ I4：不存在数据冒险',
      '<p>I2 写 s3；I4 读 s2、t2 并把结果写入<b>主存</b>——两者<b>没有公共的"写→读"寄存器</b>。t2 被两条指令都<b>读</b>，多个读者互不冲突。</p>') },
  { title: 'I3 ↔ I4：有冒险', log: 'I3 写 s2，I4（store）要从 s2 取数据：RAW', ribbon: { k: 4, ok: false },
    html: pairSnap(2, 3, 's2', null, false, 'I3 ↔ I4：存在数据冒险',
      '<p>I3 <b>写</b> s2 → I4 <b>读</b> s2（store 需要从 s2 取出要存的数据）：RAW。</p>') },
  { title: '结论：I2 和 I4', log: '不存在数据冒险的指令对是 I2 和 I4 → 答案 C',
    html: tableHtml(1, 3, null, 't2') +
      '<div class="aw-stepcard good"><h4>结论：答案 C</h4><p>四个指令对中只有 <b>I2 和 I4</b> 不存在数据冒险。记忆锚点：<b>有人"先写后读/先写后写"同一寄存器才有冒险；全都只读不冲突；store 写主存不写寄存器。</b></p></div>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (i === 0 ? 'shift' : (s.ribbon && s.ribbon.ok ? 'ok' : 'miss')),
    tag: last ? '完成' : (i === 0 ? '建表' : ('第 ' + i + ' 对')),
    log: s.log,
    html: s.html,
    count: i,
    ribbon: s.ribbon,
    done: last,
  };
});

AW.init({
  title: '2019·18 五段流水线：哪一对指令没有数据冒险',
  subtitle: '流水线：<code>取指 → 译码/取数 → 执行 → 访存 → 写回</code> · 判定依据：寄存器的写/读时序冲突',
  counterLabel: '已检查指令对',
  ribbonTitle: '指令对（✓ 无冒险 / ✗ 有冒险）',
  intro: '点击「▶ 播放」逐对检查寄存器冲突。',
  snaps: snaps,
  result: {
    big: '答案 C（I2 和 I4）',
    html: 'I1↔I3 冲突在 <b>s2</b>，I2↔I3 冲突在 <b>s3</b>，I3↔I4 冲突在 <b>s2</b>；只有 I2↔I4 没有公共的"写→读"寄存器（t2 被两条指令都读，只读不冲突；I4 的目的在主存）。<b>store 指令也要读寄存器</b>——这是漏判 I3↔I4 的常见原因。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
