<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-20 磁盘存储器概念辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key', tag: '审题',
    body: '<p>选<b>错误</b>项。考点群：磁盘容量（格式化/非格式化）、扇区结构、读写单位、磁盘存储器的组成。</p>' },
  { title: '选项 A：磁盘的格式化容量比非格式化容量小', cls: 'good', tag: 'A 正确',
    body: '<p>对。格式化时要在盘面预留扇区间隙、写入地址与校验等控制信息，有效的可用容量减少，故<b>格式化容量 &lt; 非格式化容量</b>。</p>' },
  { title: '选项 B：扇区中包含数据、地址和校验等信息', cls: 'good', tag: 'B 正确',
    body: '<p>对。一个扇区 = 头部（磁道号、扇区号等<b>地址</b>信息）+ <b>数据</b>段 + <b>校验</b>位等。</p>' },
  { title: '选项 C：磁盘存储器的最小读写单位为一字节', cls: 'bad', tag: 'C 错误',
    body: '<p><b>错。</b>磁盘与主存交换数据以<b>扇区（数据块）</b>为单位——一次至少读写一个扇区。"按字节编址"是主存的概念，编址单位 ≠ 磁盘的读写单位。</p>' },
  { title: '选项 D：磁盘存储器由磁盘控制器、磁盘驱动器和盘片组成', cls: 'good', tag: 'D 正确',
    body: '<p>对。磁盘存储器 = 磁盘控制器（接口控制逻辑）+ 磁盘驱动器（含盘片、磁头、主轴与驱动机构）。</p>' },
  { title: '结论：答案 C', cls: 'good', tag: '完成',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>磁盘的最小物理读写单位是扇区</b>，不是字节。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  var logCls = s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : (s.cls === 'key' ? 'shift' : 'step'));
  return {
    cls: last ? 'done' : logCls,
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2019·20 磁盘存储器——找错误项',
  subtitle: '考点：<code>格式化容量 · 扇区结构 · 读写单位 · 磁盘组成</code>',
  intro: '点击「▶ 播放」逐项展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '磁盘读写以<b>扇区</b>为单位（扇区内含地址、校验等控制信息）；格式化要预留这些控制信息，所以<b>格式化容量比非格式化容量小</b>。常见误区：把主存"按字节编址"套到磁盘的读写单位上。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
