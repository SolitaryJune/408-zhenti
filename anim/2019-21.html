<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-21 中断方式下 CPU 用于 I/O 的时间占比</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题：四个条件各就各位', cls: 'key', tag: '审题',
    body: '<p>CPU 主频 <b>1 GHz</b>；接口数据缓冲寄存器 <b>32 位</b>；设备数据传输率 <b>50 kB/s</b>；每次中断开销（响应 + 处理）<b>1000 个时钟周期</b>。求：CPU 用于该设备 I/O 的时间占比（最多多少）。</p>' },
  { title: '第一步：一次中断传多少数据', cls: '', tag: '每次数据量',
    body: '<p>缓冲寄存器 32 位 = 32 ÷ 8 = <b>4 B</b>。设备每攒满 4 B 就向 CPU 发一次中断请求。</p>' },
  { title: '第二步：每秒中断多少次', cls: 'key', tag: '中断频率',
    body: '<p>设备每秒传 50 kB = 50000 B：<br><b>12500 次/s</b> = 50000 B ÷ 4 B。</p>' },
  { title: '第三步：每秒中断开销合计', cls: '', tag: '开销周期',
    body: '<p>12500 次/s × 1000 周期/次 = <b>1.25 × 10<sup>7</sup> 个时钟周期/s</b>。</p>' },
  { title: '第四步：除以 CPU 每秒总周期数', cls: 'good', tag: '算占比',
    body: '<p>主频 1 GHz = 10<sup>9</sup> 周期/s：<br>占比 = 1.25 × 10<sup>7</sup> ÷ 10<sup>9</sup> = 0.0125 = <b>1.25%</b>。</p>' },
  { title: '结论：答案 A', cls: 'good', tag: '完成',
    body: '<p>CPU 用于该设备 I/O 的时间占比最多约 <b>1.25%</b>，选 <b>A</b>。干扰项：把 32 位当成 32 B（约 0.16%）、漏乘每次 1000 周期等都会跑偏。记忆锚点：<b>占比 = 每秒中断次数 × 每次开销周期 ÷ 主频周期数</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  var logCls = s.cls === 'good' ? 'ok' : (s.cls === 'key' ? 'shift' : 'step');
  return {
    cls: last ? 'done' : logCls,
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    count: i + 1,
    done: last,
  };
});

AW.init({
  title: '2019·21 中断方式：CPU 的 I/O 时间占比',
  subtitle: '主频 <code>1 GHz</code> · 缓冲寄存器 <code>32 位</code> · 传输率 <code>50 kB/s</code> · 每次中断 <code>1000</code> 周期',
  counterLabel: '推演步',
  intro: '点击「▶ 播放」逐步完成占比计算。',
  snaps: snaps,
  result: {
    big: '1.25%（答案 A）',
    html: '计算链：<b>32 位 = 4 B → 50000 ÷ 4 = 12500 次/s → × 1000 = 1.25×10<sup>7</sup> 周期/s → ÷ 10<sup>9</sup> = 1.25%</b>。关键在第一步：缓冲寄存器 32 位是 <b>4 字节</b>不是 32 字节。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
