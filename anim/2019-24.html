<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-24 什么事件会唤醒进程</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：「唤醒」的确切含义',
    cls: 'key',
    body: '<p>唤醒 = 把<b>阻塞态</b>的进程改为<b>就绪态</b>，只发生在"进程所等待的事件已经发生"时。<b>运行态 → 就绪态</b>（被剥夺 CPU）不叫唤醒。</p>' },
  { title: '叙述 I：I/O 结束',
    cls: 'good',
    ribbon: { k: 1, ok: true },
    body: '<p>进程请求 I/O 后<b>阻塞</b>等待；I/O 完成发出中断，中断处理程序把等待该 I/O 的进程<b>唤醒</b>（阻塞 → 就绪）。<b>√ 能引起唤醒</b></p>' },
  { title: '叙述 II：某进程退出临界区',
    cls: 'good',
    ribbon: { k: 2, ok: true },
    body: '<p>想进入该临界区而不得的进程<b>阻塞</b>在互斥信号量上；占用者退出临界区时执行 <code>V</code> 操作，唤醒其中一个等待者。<b>√ 能引起唤醒</b></p>' },
  { title: '叙述 III：当前进程的时间片用完',
    cls: 'bad',
    ribbon: { k: 3, ok: false },
    body: '<p>时间片用完，当前进程由<b>运行态 → 就绪态</b>：它并没有阻塞，只是被剥夺 CPU 重新排队，谈不上"唤醒"。<b>× 不是唤醒</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>可能将进程唤醒的是 <b>I、II</b> → 答案选 <b>C（仅 I、II）</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var o = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (s.ribbon) o.ribbon = s.ribbon;
  return o;
});

AW.init({
  title: '2019-24 · 哪些事件可能将进程唤醒',
  subtitle: '考点：进程状态转换（阻塞 → 就绪 才叫唤醒） · 三句叙述逐项判断',
  counterLabel: '推理步',
  ribbonTitle: '叙述判断（✓ 能唤醒 / ✗ 不能）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '「唤醒」只作用于<b>阻塞态</b>进程：I/O 结束（中断处理程序唤醒等待者）、退出临界区（V 操作唤醒等待者）都能引起唤醒；时间片用完是<b>运行 → 就绪</b>的剥夺，进程本来就活着，不是唤醒。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
