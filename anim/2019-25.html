<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-25 系统调用四句判断</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：系统调用的定位',
    cls: 'key',
    body: '<p>系统调用是操作系统内核<b>为应用程序提供服务</b>的接口，也是用户程序获得内核服务的<b>唯一合法入口</b>；执行时要<b>从用户态转入内核态</b>。用这个定位去核对四句话。</p>' },
  { title: '叙述 I：执行系统调用服务程序时 CPU 处于内核态',
    cls: 'good',
    ribbon: { k: 1, ok: true },
    body: '<p>系统调用服务程序属于<b>内核代码</b>，执行期间 CPU 必然处于<b>内核态</b>（核心态）。<b>√ 正确</b></p>' },
  { title: '叙述 II：通过系统调用避免用户程序直接访问外设',
    cls: 'good',
    ribbon: { k: 2, ok: true },
    body: '<p>外设是关键资源，用户程序无权直接操作，只能通过系统调用<b>间接</b>使用——这正是系统调用的保护作用。<b>√ 正确</b></p>' },
  { title: '叙述 III：不同 OS 提供统一的系统调用接口',
    cls: 'bad',
    ribbon: { k: 3, ok: false },
    body: '<p>不同操作系统的系统调用<b>各不相同</b>（调用号、参数、功能都有差异，如 Linux 与 Windows），并不存在"统一接口"。<b>× 错误</b></p>' },
  { title: '叙述 IV：系统调用是内核为应用程序提供服务的接口',
    cls: 'good',
    ribbon: { k: 4, ok: true },
    body: '<p>这正是系统调用的定义本身。<b>√ 正确</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>正确的是 <b>I、II、IV</b> → 答案选 <b>C</b>。干扰项 III 的坑：把"C 标准库"这类统一封装误当成系统调用接口本身。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var o = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (s.ribbon) o.ribbon = s.ribbon;
  return o;
});

AW.init({
  title: '2019-25 · 系统调用的本质（判断四句正误）',
  subtitle: '考点：系统调用与用户态/内核态 · 逐项推演',
  counterLabel: '推理步',
  ribbonTitle: '叙述判断（✓ 对 / ✗ 错）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '正确组合 <b>I、II、IV</b>。系统调用 = 内核提供的<b>服务接口</b>；执行服务程序时 CPU 处于<b>内核态</b>；外设必须经系统调用<b>间接</b>使用。<b>III 错</b>：各操作系统的系统调用接口互不相同，谈不上统一。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
