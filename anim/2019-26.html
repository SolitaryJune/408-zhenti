<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-26 空闲磁盘块管理结构辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：管"空闲块"还是管"文件"？',
    cls: 'key',
    body: '<p>空闲块管理要回答的问题是：<b>哪些磁盘块还没被占用</b>。带着这个问题核对四个候选结构，注意区分"管文件的结构"与"管空闲块的结构"。</p>' },
  { title: '叙述 I：位图（位示图）',
    cls: 'good',
    ribbon: { k: 1, ok: true },
    body: '<p>每个磁盘块对应 <b>1 个比特</b>，0/1 表示空闲/占用，扫描位图即可分配连续或离散的空闲块。<b>√ 可用</b></p>' },
  { title: '叙述 II：索引结点',
    cls: 'bad',
    ribbon: { k: 2, ok: false },
    body: '<p>索引结点（inode）存放的是<b>文件自身的信息</b>：文件大小、属主、时间戳、数据块指针等元数据，与"哪些块空闲"无关。<b>× 不可用</b></p>' },
  { title: '叙述 III：空闲磁盘块链',
    cls: 'good',
    ribbon: { k: 3, ok: true },
    body: '<p>把所有空闲块用链接指针串成<b>空闲链表</b>，分配时摘链、回收时入链。<b>√ 可用</b></p>' },
  { title: '叙述 IV：文件分配表（FAT）',
    cls: 'good',
    ribbon: { k: 4, ok: true },
    body: '<p>FAT 是显式链接结构，表项与物理盘块一一对应；表项标记为<b>空闲</b>的盘块即空闲块，因此 FAT 可同时承担空闲块管理。<b>√ 可用</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>可用的有 <b>I、III、IV</b> → 答案选 <b>B</b>。记忆锚点：<b>位图、空闲链、FAT 管空闲，索引结点管文件</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var o = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (s.ribbon) o.ribbon = s.ribbon;
  return o;
});

AW.init({
  title: '2019-26 · 哪些结构可用于管理空闲磁盘块',
  subtitle: '考点：文件存储空间管理 · 四个候选逐项判断',
  counterLabel: '推理步',
  ribbonTitle: '候选判断（✓ 可用 / ✗ 不可用）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '能管理空闲盘块的：<b>位图（I）</b>、<b>空闲磁盘块链（III）</b>、<b>FAT（IV）</b>；<b>索引结点（II）</b>存文件元数据，与空闲块无关。易错：<b>漏选 FAT</b>——FAT 的空闲表项本身就是空闲块登记。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
