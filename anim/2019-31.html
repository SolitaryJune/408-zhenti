<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-31 二级分页虚拟地址切分动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：算法/过程类（地址映射） · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var HEX  = ['2','0','5','0','1','2','2','5'];
var BITS = ['0010','0000','0101','0000','0001','0010','0010','0101'];

// 分组：0 = 页目录号(第 0~9 位) · 1 = 页号(第 10~19 位) · 2 = 页内偏移(第 20~31 位)
function grpOfBit(b){ return b < 10 ? 0 : (b < 20 ? 1 : 2); }

var GCOL = [
  { bg:'#f8edcb', bd:'#e07a2f', tx:'#92400e', name:'页目录号（10 位）' },
  { bg:'#d9e3df', bd:'#1b3a4b', tx:'#1b3a4b', name:'页号（10 位）' },
  { bg:'#2f9e4424', bd:'#2f9e44', tx:'#276942', name:'页内偏移（12 位）' },
];

// 每步聚焦哪个组（null = 全部正常显示）与解说条文字
var FOCUS = [null, null, null, 0, 1, 2, null];
var VALS = [
  '地址结构：[ 页目录号 10 位 | 页号 10 位 | 页内偏移 12 位 ]。虚拟地址 2050 1225H，求页目录号、页号。',
  '逐位展开后共 32 位：0010 0000 0101 0000 0001 0010 0010 0101。',
  '按 10 / 10 / 12 位切分。切分线正好落在第 3 个十六进制位 <b>5 = 0101</b> 内部：高 2 位归页目录号，低 2 位归页号。',
  '高 10 位 = <code>0010 0000 01</code> = <b style="color:#e07a2f">081H</b> → 页目录号。',
  '中 10 位 = <code>01 0000 0001</code> = <b style="color:#1b3a4b">101H</b> → 页号。',
  '低 12 位 = <code>0010 0010 0101</code> = <b style="color:#2f9e44">225H</b> → 页内偏移（本题不问，用于校验）。',
  '三段拼回恰为 20501225H，校验无误 → 页目录号 <b>081H</b>、页号 <b>101H</b>，选 <b>A</b>。',
];

AW.init({
  title: '2019-31 · 二级分页：拆分虚拟地址 2050 1225H',
  subtitle: '地址结构 <code>[页目录号 10 位 | 页号 10 位 | 页内偏移 12 位]</code> · 主存按字节编址',
  counterLabel: '步骤',
  intro: '点击「▶ 播放」，先把地址展开成二进制，再按 10/10/12 位切分。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.style.minWidth = '560px';

    var cap = AW.el('div', 'aw-row-label', '<b>虚拟地址 2050 1225H</b>（上行 = 十六进制位，下行 = 对应的 4 位二进制）');
    var cols = AW.el('div', '');
    cols.style.cssText = 'display:flex;gap:6px;margin:6px 0 12px';
    var colEls = [];
    for (var d = 0; d < 8; d++){
      var col = AW.el('div', '');
      col.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px';
      var hb = AW.el('div', 'aw-box', HEX[d]);
      hb.style.cssText = 'width:40px;height:40px;font-size:17px';
      var bits = AW.el('div', '');
      bits.style.cssText = 'display:flex;gap:2px';
      var bitEls = [];
      for (var b = 0; b < 4; b++){
        var bb = AW.el('div', '', BITS[d].charAt(b));
        bb.style.cssText = 'width:18px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-weight:700;font-size:12px;border:1.5px solid #5a7d8c66;background:#fff;color:#213e48;transition:opacity .25s';
        bitEls.push(bb);
        bits.appendChild(bb);
      }
      col.appendChild(hb); col.appendChild(bits);
      colEls.push({ hex: hb, bits: bitEls });
      cols.appendChild(col);
    }

    // 三段括号条（宽度按 10/10/12 位比例）
    var bracket = AW.el('div', '');
    bracket.style.cssText = 'position:relative;height:24px;margin-bottom:12px;font-size:11.5px;font-weight:700';
    var segEls = [];
    for (var g = 0; g < 3; g++){
      var seg = AW.el('div', '', GCOL[g].name);
      var left = (g === 0 ? 0 : g === 1 ? 10 / 32 : 20 / 32) * 100;
      var w = (g === 0 ? 10 / 32 : g === 1 ? 10 / 32 : 12 / 32) * 100;
      seg.style.cssText = 'position:absolute;left:' + left + '%;width:' + w + '%;height:22px;line-height:20px;text-align:center;border-radius:8px;background:' + GCOL[g].bg + ';border:1.5px solid ' + GCOL[g].bd + ';color:' + GCOL[g].tx + ';transition:opacity .25s';
      segEls.push(seg);
      bracket.appendChild(seg);
    }

    var val = AW.el('div', '');
    val.style.cssText = 'font-size:14px;line-height:1.8;color:#213e48;background:#f8edcb;border-radius:10px;padding:10px 14px;min-height:46px';

    inner.appendChild(cap); inner.appendChild(cols); inner.appendChild(bracket); inner.appendChild(val);
    wrap.appendChild(inner);
    stage.appendChild(wrap);

    this._colEls = colEls; this._segEls = segEls; this._val = val;
  },

  snaps: [
    { cls:'step',  tag:'审题',     log:'二级分页：虚拟地址高 10 位是页目录号、中 10 位是页号、低 12 位是页内偏移。待拆地址：2050 1225H。', count:0 },
    { cls:'shift', tag:'展开',     log:'把 8 个十六进制位逐位展开成 4 位二进制，共 32 位：0010 0000 0101 0000 0001 0010 0010 0101。', count:1 },
    { cls:'step',  tag:'切分',     log:'按 10 / 10 / 12 位切三段。注意：10 位不是十六进制整位，第 3 位的 5(0101) 要拆成两半。', count:2 },
    { cls:'ok',    tag:'页目录号', log:'高 10 位 = 0010 0000 01 = 081H，即页目录号。', count:3 },
    { cls:'ok',    tag:'页号',     log:'中 10 位 = 01 0000 0001 = 101H，即页号（开头的 01 来自 5 的低 2 位）。', count:4 },
    { cls:'step',  tag:'页内偏移', log:'低 12 位 = 0010 0010 0101 = 225H，即页内偏移（校验：三段拼回 = 20501225H）。', count:5 },
    { cls:'done',  tag:'结论',     log:'页目录号 081H、页号 101H → 选 A。', count:6, done:true },
  ],

  render: function(stage, sn, i){
    var focus = FOCUS[i];
    var colEls = this._colEls;
    for (var d = 0; d < 8; d++){
      var groups = [];
      for (var b = 0; b < 4; b++) groups.push(grpOfBit(4 * d + b));
      var allIn = (focus === null) ? false : groups.every(function(g){ return g === focus; });
      var hex = colEls[d].hex;
      hex.style.opacity = (focus === null || allIn || groups.indexOf(focus) >= 0) ? '1' : '.3';
      if (allIn){
        hex.style.borderColor = GCOL[focus].bd;
        hex.style.background = GCOL[focus].bg;
        hex.style.color = GCOL[focus].tx;
      } else {
        hex.style.borderColor = '#5a7d8c66';
        hex.style.background = '#fff';
        hex.style.color = '#1b3a4b';
      }
      for (var b2 = 0; b2 < 4; b2++){
        var g = groups[b2];
        var bb = colEls[d].bits[b2];
        bb.style.background = GCOL[g].bg;
        bb.style.borderColor = GCOL[g].bd;
        bb.style.color = GCOL[g].tx;
        bb.style.opacity = (focus === null || g === focus) ? '1' : '.25';
      }
    }
    var segEls = this._segEls;
    for (var s = 0; s < 3; s++){
      segEls[s].style.opacity = (focus === null || focus === s) ? '1' : '.3';
    }
    this._val.innerHTML = VALS[i];
  },

  result: {
    big: '答案 A：081H、101H',
    html: '切法：32 位二进制按 <b>10 / 10 / 12</b> 切 → 页目录号 <code>081H</code>、页号 <code>101H</code>、页内偏移 <code>225H</code>。<br><b>易错</b>：不能按十六进制整位切——10 位要跨界，<code>5 = 0101</code> 拆开：高 2 位 01 并入页目录号结尾（→081H），低 2 位 01 作为页号开头（→101H）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
