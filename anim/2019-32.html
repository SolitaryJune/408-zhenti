<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-32 动态分区分配算法与碎片</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：什么叫"最容易产生碎片"',
    cls: 'key',
    body: '<p>动态分区按作业大小<b>切割</b>空闲分区。"碎片（外部碎片）"= 分配后剩下的、小到难以再利用的空闲块。问：哪种算法切出来的这种零头<b>最多</b>。</p>' },
  { title: '选项 A：首次适应算法',
    cls: 'step',
    body: '<p>从低地址起顺序找<b>第一个</b>够大的空闲区切割。低地址端被不断细分，但高地址端保留大块空间，整体碎片相对较少。</p>' },
  { title: '选项 B：最坏适应算法',
    cls: 'step',
    body: '<p>每次挑<b>最大</b>的空闲区切割，剩余部分仍然比较大、还能继续分配；缺点是大分区被快速消耗完。</p>' },
  { title: '选项 C：最佳适应算法（当选）',
    cls: 'good',
    body: '<p>每次挑<b>容量最小</b>、刚好够用的空闲区切割。切完剩下的零头<b>极小</b>，几乎装不下任何作业，日积月累产生<b>大量外部碎片</b>。</p>' },
  { title: '选项 D：循环首次适应算法',
    cls: 'step',
    body: '<p>首次适应 + 从<b>上次分配位置</b>继续向后查找，使空闲区分布更均匀，碎片情况与首次适应相当。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>最容易产生内存碎片的是<b>最佳适应算法</b> → 答案选 <b>C</b>。记忆锚点：<b>"最佳"其实是"最抠"——每次都抠最小的块，剩下的全是渣</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2019-32 · 动态分区：哪种算法碎片最多',
  subtitle: '考点：动态分区分配算法对比 · 四种算法逐项推演',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '<b>最佳适应</b>每次选最小的可用分区切割，剩余零头极小、几乎无法再分配 → 外部碎片最多。首次适应 / 循环首次适应碎片较少，最坏适应剩余仍较大。对比口诀：<b>首次留大、最坏留中、最佳留渣</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
