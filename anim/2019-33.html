<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-33 OSI 第 5 层辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：自下而上数层',
    cls: 'key',
    body: '<p>题干问 OSI 参考模型<b>第 5 层（自下而上）</b>完成的主要功能。考点：<b>OSI 七层划分与各层职责</b>。</p>' +
          '<p><code>1 物理 · 2 数据链路 · 3 网络 · 4 传输 · 5 会话 · 6 表示 · 7 应用</code></p>' },
  { title: '数出第 5 层：会话层',
    cls: 'good',
    body: '<p>从物理层开始数：物理(1) → 数据链路(2) → 网络(3) → 传输(4) → <b>会话(5)</b>。第 5 层是<b>会话层</b>：负责会话的建立、管理、终止，插入同步点，控制对话次序。</p>' },
  { title: '选项 A：差错控制 ✗',
    cls: 'bad',
    body: '<p>差错控制主要是<b>数据链路层</b>（帧校验、重传）与<b>传输层</b>（端到端确认重传）的职责，不属于第 5 层。</p>' },
  { title: '选项 B：路由选择 ✗',
    cls: 'bad',
    body: '<p>路由选择、分组转发是<b>网络层（第 3 层）</b>的典型功能。</p>' },
  { title: '选项 C：会话管理 ✓',
    cls: 'good',
    body: '<p><b>会话层</b>的核心功能正是<b>会话管理</b>：建立、管理、终止进程之间的会话——与第 5 层完全对应。</p>' },
  { title: '选项 D：数据表示转换 ✗',
    cls: 'bad',
    body: '<p>数据格式转换、加密、压缩属于<b>表示层（第 6 层）</b>。这是最强干扰项：见到"转换/表示"字样要归第 6 层。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>5 会话管"对话"，6 表示管"翻译"</b>；差错控制偏链路/传输层，路由选择在网络层。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var st = i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step'));
  return {
    cls: st,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2019·33 OSI 参考模型第 5 层的主要功能',
  subtitle: '考点：OSI 七层模型 · 自下而上第 5 层 → 四个选项逐项辨析',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '自下而上第 5 层是<b>会话层</b>，主要功能是<b>会话管理</b>。干扰项：A 差错控制（数据链路/传输层）、B 路由选择（网络层）、D 数据表示转换（表示层）。记忆锚点：<b>5 会话管对话、6 表示管翻译</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
