<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-34 100BaseT 介质辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：以太网命名三段式',
    cls: 'key',
    body: '<p>100BaseT 问的是"用什么导向传输介质"。IEEE 802.3 命名格式：<b>数据率(Mb/s) - 信令方式 - 介质</b>。</p>' +
          '<p><code>100 Base T</code> → 速率 100 Mb/s · Base = 基带传输 · <b>T = 介质代码</b></p>' },
  { title: '介质代码是题眼',
    cls: 'step',
    body: '<p>前两段只说明"100 Mb/s、基带"，不含介质信息；<b>第三段才指明介质</b>。T = Twisted Pair，即<b>双绞线</b>。</p>' },
  { title: '选项 A：双绞线 ✓',
    cls: 'good',
    body: '<p><b>对</b>。100BaseTX 用 2 对 5 类 UTP（或 STP），100BaseT4 用 4 对 3 类 UTP——都以 <b>T（双绞线）</b>命名，100BaseT 正是双绞线快速以太网。</p>' },
  { title: '选项 B/C：单模/多模光纤 ✗',
    cls: 'bad',
    body: '<p>光纤对应的介质代码是 <b>F</b>（如 100BaseFX），不是 T。B、C 都错。</p>' },
  { title: '选项 D：同轴电缆 ✗',
    cls: 'bad',
    body: '<p>同轴电缆出现在 10 Mb/s 时代：<code>10Base5（粗缆）· 10Base2（细缆）</code>，介质代码是数字。100 Mb/s 快速以太网标准不再使用同轴电缆。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A（双绞线）</b>。记忆锚点：命名第三段 <b>T=双绞线，F/L/S=光纤，数字=同轴电缆</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var st = i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step'));
  return {
    cls: st,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2019·34 100BaseT 快速以太网的传输介质',
  subtitle: '考点：IEEE 802.3 以太网命名规则 · 介质代码辨析',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '100BaseT 的 <b>T = Twisted Pair（双绞线）</b>。干扰项：B/C 光纤对应 F（100BaseFX）；D 同轴电缆是 10Base5/10Base2 时代的介质。记忆锚点：<b>T=双绞线、F=光纤、数字=同轴电缆</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
