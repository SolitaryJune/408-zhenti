<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-39 三次握手确认序列号</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var hsBox = null, ledger = null;

var BLUE = ['#1b3a4b14', '#1b3a4b'], AMBER = ['#f8edcb', '#e07a2f'], GREEN = ['#f0f7e6', '#2f9e44'];

function hsRow(dir, meta, bg, bd, bold){
  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:9px 12px;' +
    'border-radius:10px;background:' + bg + ';border-left:4px solid ' + bd + ';' +
    (bold ? 'font-weight:700;' : '') + 'font-size:13.5px;line-height:1.55;">' +
    '<span style="font-family:Menlo,monospace;white-space:nowrap;color:#1b3a4b">' + dir + '</span>' +
    (meta ? '<span style="font-size:12.5px;color:#47616c">' + meta + '</span>' : '') +
    '</div>';
}

// 3 条握手段（snap 显示条数由 LOOK 控制）
var ROWS = [
  hsRow('甲 ──① SYN=1, seq=2018──▶ 乙', '第一次握手：SYN 段占用序号 2018', BLUE[0], BLUE[1], false),
  hsRow('甲 ◀──② SYN=1, ACK=1, seq=2046, ack=2019── 乙', '第二次握手：乙的 SYN 占用 2046；确认甲的 SYN → ack = 2018+1', AMBER[0], AMBER[1], false),
  hsRow('甲 ──③ ACK=1, seq=2019, ack=2047──▶ 乙', '第三次握手：<b>确认乙的 SYN → ack = 2046+1 = 2047</b>', GREEN[0], GREEN[1], true),
];

// 每步：可见握手段数 + 序号账本文案/颜色
var LOOK = [
  { vis: 0, text: '已知：甲初始序号 <b>2018</b>，乙初始序号 <b>2046</b>。问：第三次握手段的确认序列号 = ?', c: '#213e48' },
  { vis: 0, text: '两条规则：<b>SYN 段消耗一个序号</b>；<b>确认号 ack = 对方刚用掉的序号 + 1</b>', c: '#92400e' },
  { vis: 1, text: '甲发出 SYN（占用序号 2018）→ 甲下一个可用序号 = 2019', c: '#213e48' },
  { vis: 1, text: '乙收到 SYN：确认号 = 2018 + 1 = <b>2019</b>', c: '#276942' },
  { vis: 2, text: '乙发出 SYN（占用序号 2046）→ 乙下一个可用序号 = 2047', c: '#213e48' },
  { vis: 2, text: '甲收到 SYN：确认号 = 2046 + 1 = <b>2047</b>', c: '#276942' },
  { vis: 3, text: '第三次握手段：seq = 2019，ack = <b>2047</b> → 确认序列号是 2047，选 D', c: '#276942' },
];

AW.init({
  title: '2019·39 三次握手：第三次握手段的确认序列号？',
  subtitle: '甲主动发起连接 · 甲初始序号 <code>2018</code> · 乙初始序号 <code>2046</code>',
  counterLabel: '已完成握手段',
  intro: '点击「▶ 播放」，沿三次握手逐步推 seq 与 ack。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    var head = AW.el('div', '');
    head.style.cssText = 'display:flex;align-items:center;gap:12px;margin-bottom:12px;';
    var mk = function(t, sub){
      var d = AW.el('div', '');
      d.style.cssText = 'padding:8px 16px;border:2px solid #b9cbd0;border-radius:12px;background:#fff;' +
        'font-weight:700;font-size:14px;color:#213e48;text-align:center;';
      d.innerHTML = t + '<div style="font-size:11.5px;font-weight:400;color:#586e72;margin-top:2px">' + sub + '</div>';
      return d;
    };
    head.appendChild(mk('主机甲', '初始序号 ISN = 2018'));
    var arrow = AW.el('div', '');
    arrow.style.cssText = 'flex:1;text-align:center;font-size:12.5px;color:#b9cbd0;';
    arrow.innerHTML = '—— TCP 连接 ——';
    head.appendChild(arrow);
    head.appendChild(mk('主机乙', '初始序号 ISN = 2046'));
    inner.appendChild(head);

    hsBox = AW.el('div', '');
    inner.appendChild(hsBox);

    ledger = AW.el('div', '');
    ledger.style.cssText = 'margin-top:4px;padding:10px 14px;border-radius:10px;background:#f8edcb;' +
      'border:1px solid #1b3a4b26;font-size:13.5px;line-height:1.7;';
    inner.appendChild(ledger);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'题面', log:'甲主动发起与乙的 TCP 连接：甲初始序号 2018，乙初始序号 2046。求第三次握手段的确认序列号', count:0 },
    { cls:'step',  tag:'规则', log:'两条规则：SYN 报文消耗一个序号；确认号 = 对方刚用掉的序号 + 1', count:0 },
    { cls:'step',  tag:'第一次握手', log:'甲→乙：SYN=1, seq=2018（SYN 占用序号 2018）', count:1 },
    { cls:'ok',    tag:'乙算确认号', log:'乙确认甲的 SYN：ack = 2018 + 1 = 2019', count:1 },
    { cls:'step',  tag:'第二次握手', log:'乙→甲：SYN=1, ACK=1, seq=2046, ack=2019（乙的 SYN 占用序号 2046）', count:2 },
    { cls:'ok',    tag:'甲算确认号', log:'甲确认乙的 SYN：ack = 2046 + 1 = 2047', count:2 },
    { cls:'done',  tag:'完成', log:'第三次握手：甲→乙 ACK=1, seq=2019, ack=2047 → 确认序列号是 2047，选 D', count:3, done:true },
  ],

  render: function(stage, sn, i){
    var st = LOOK[i] || LOOK[0];
    var html = '';
    for(var k = 0; k < st.vis; k++) html += ROWS[k];
    hsBox.innerHTML = html;
    ledger.style.color = st.c;
    ledger.innerHTML = st.text;
  },

  result: {
    big: '确认序列号 = 2047',
    html: '确认号 = 对方初始序号 + 1：第三次握手 ack = <b>2046 + 1 = 2047</b>，选 <b>D</b>。顺带记牢：第二次握手 ack = 2018+1 = 2019；第三次握手 seq = 2019。干扰项 C（2046）忘了 +1；B（2019）是第三次握手的发送序号；A（2018）是甲的初始序号。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
