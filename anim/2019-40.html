<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019-40 网络应用模型辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：选"错误"项',
    cls: 'key',
    body: '<p>先明确两种模型的定义：<b>C/S 模型</b>——服务器提供服务、被动等待，客户主动发起请求；<b>P2P 模型</b>——无中央服务器，对等结点直接通信，每个结点既是客户又是服务器。</p>' +
          '<p>题目要求选出<b>错误</b>的叙述。</p>' },
  { title: '选项 A：P2P 结点对等 ✓（叙述正确）',
    cls: 'good',
    body: '<p><b>正确</b>。P2P 模型中结点之间具有对等关系，角色不固定，通信双方地位平等。</p>' },
  { title: '选项 B：C/S 客户之间直接通信 ✗（本题答案）',
    cls: 'bad',
    body: '<p><b>错误</b>。C/S 模型中客户与客户之间<b>不能直接通信</b>，必须经过服务器中转（如两台主机互发邮件也要经邮件服务器转交）。这正是 C/S 与 P2P 的分界线。</p>' },
  { title: '选项 C：客户主动、服务器被动 ✓（叙述正确）',
    cls: 'good',
    body: '<p><b>正确</b>。C/S 模型的定义：主动发起通信的是客户，被动等待并提供服务的是服务器。</p>' },
  { title: '选项 D：P2P 分发文件通常更快 ✓（叙述正确）',
    cls: 'good',
    body: '<p><b>正确</b>。P2P 分发文件时每个结点既是接收者又是分发者，结点越多总上传能力越强，向多用户分发一个文件所需时间<b>通常</b>比 C/S 短。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>C/S 一切经服务器中转，客户之间不直连；P2P 才是结点直接通信</b>。注意审题——本题选错误项。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var st = i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step'));
  return {
    cls: st,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2019·40 网络应用模型：C/S 与 P2P 辨析',
  subtitle: '考点：客户/服务器模型与 P2P 模型的特性对比 · 选错误项',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '<b>C/S 模型中客户之间不能直接通信</b>，必须经服务器中转——B 叙述错误，当选。A（P2P 对等）、C（客户主动/服务器被动）、D（P2P 分发通常更快）都是正确叙述。易错：漏看"错误的是"三个字。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
