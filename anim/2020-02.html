<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-02 栈操作混合序列模拟动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2020-02 空栈执行 Push Push Pop Push Pop Push Push Pop，得出栈序列
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var OPS = ['Push a', 'Push b', 'Pop', 'Push c', 'Pop', 'Push d', 'Push e', 'Pop'];
var opsRow, stackRow, outRow, noteLine;

function drawOps(cur){
  // cur = 当前执行到第几步（1..8）
  opsRow.innerHTML = '';
  OPS.forEach(function(op, idx){
    var col = AW.el('div', 'aw-col');
    col.style.width = '66px';
    var cls = '';
    if(idx + 1 === cur){ cls = 'hit'; }
    else if(idx + 1 < cur){ cls = 'ok'; }
    var b = AW.el('div', 'aw-box' + (cls ? ' ' + cls : ''), op);
    b.style.width = '66px';
    b.style.fontSize = '12.5px';
    col.appendChild(b);
    col.appendChild(AW.el('div', 'aw-idx', String(idx + 1)));
    opsRow.appendChild(col);
  });
}

function drawStack(stack){
  stackRow.innerHTML = '';
  var slots = 5;
  for(var t = 0; t < slots; t++){
    var col = AW.el('div', 'aw-col');
    var isTop = stack.length > 0 && t === stack.length - 1;
    col.appendChild(AW.el('div', 'aw-ptr', isTop ? '↑栈顶' : (t === 0 ? '栈底' : '')));
    var has = t < stack.length;
    var cls = has ? (isTop ? ' hit' : ' ok') : ' dim';
    col.appendChild(AW.el('div', 'aw-box' + cls, has ? stack[t] : '·'));
    col.appendChild(AW.el('div', 'aw-idx', '槽' + (t + 1)));
    stackRow.appendChild(col);
  }
}

function drawOut(out){
  outRow.innerHTML = '';
  var slots = 3;
  for(var t = 0; t < slots; t++){
    var col = AW.el('div', 'aw-col');
    var isNew = out.length > 0 && t === out.length - 1;
    col.appendChild(AW.el('div', 'aw-ptr', isNew ? '←新弹出' : ''));
    var has = t < out.length;
    var cls = has ? (isNew ? ' hit' : ' ok') : ' dim';
    col.appendChild(AW.el('div', 'aw-box' + cls, has ? out[t] : '·'));
    col.appendChild(AW.el('div', 'aw-idx', '第' + (t + 1) + '个'));
    outRow.appendChild(col);
  }
}

AW.init({
  title: '栈的混合操作模拟：出栈序列是什么？',
  subtitle: '空栈 S · 操作序列 <code>Push Push Pop Push Pop Push Push Pop</code> · 入栈依次 a b c d e',
  counterLabel: '已执行',
  ribbonTitle: '出栈序号（✓ 已出栈）',
  intro: '点击「▶ 播放」逐步执行 8 次操作，栈是后进先出：Pop 只弹栈顶。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>操作序列</b>（琥珀 = 当前正在执行，绿 = 已执行）'));
    opsRow = AW.el('div', 'aw-cells');
    inner.appendChild(opsRow);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>栈 S</b>（左底 → 右顶）'));
    stackRow = AW.el('div', 'aw-cells');
    inner.appendChild(stackRow);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>出栈序列</b>'));
    outRow = AW.el('div', 'aw-cells');
    inner.appendChild(outRow);
    noteLine = AW.el('div', 'aw-row-label', '');
    noteLine.style.marginTop = '12px';
    inner.appendChild(noteLine);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'初始', log:'空栈开始。操作序列：Push a → Push b → Pop → Push c → Pop → Push d → Push e → Pop。', count:0 },
    { cls:'step', tag:'入栈', log:'第 1 步 Push：入栈序列取 a 压入 → 栈内 [a]。', count:1 },
    { cls:'step', tag:'入栈', log:'第 2 步 Push：b 压入栈顶 → 栈内 [a, b]。', count:2 },
    { cls:'ok',   tag:'出栈', log:'第 3 步 Pop：弹出栈顶 b → 出栈序列 [b]；栈内剩 [a]。', count:3, ribbon:{k:1, ok:true} },
    { cls:'step', tag:'入栈', log:'第 4 步 Push：c 压入栈顶 → 栈内 [a, c]。', count:4 },
    { cls:'ok',   tag:'出栈', log:'第 5 步 Pop：弹出栈顶 c → 出栈序列 [b, c]；栈内剩 [a]。', count:5, ribbon:{k:2, ok:true} },
    { cls:'step', tag:'入栈', log:'第 6 步 Push：d 压入栈顶 → 栈内 [a, d]。', count:6 },
    { cls:'step', tag:'入栈', log:'第 7 步 Push：e 压入栈顶 → 栈内 [a, d, e]，e 压在 d 上面。', count:7 },
    { cls:'ok',   tag:'出栈', log:'第 8 步 Pop：弹出栈顶 e（不是 d！）→ 出栈序列 [b, c, e]；栈内剩 [a, d]。', count:8, ribbon:{k:3, ok:true} },
    { cls:'done', tag:'完成', log:'8 次操作执行完毕：出栈序列 = b, c, e → 选 D。a、d 仍留在栈中。', count:8, done:true },
  ],

  render: function(stage, sn, i){
    var cur = sn.count;
    var stack = [], out = [];
    if(i >= 1){ stack = ['a']; }
    if(i >= 2){ stack = ['a', 'b']; }
    if(i >= 3){ out = ['b']; stack = ['a']; }
    if(i >= 4){ stack = ['a', 'c']; }
    if(i >= 5){ out = ['b', 'c']; stack = ['a']; }
    if(i >= 6){ stack = ['a', 'd']; }
    if(i >= 7){ stack = ['a', 'd', 'e']; }
    if(i >= 8){ out = ['b', 'c', 'e']; stack = ['a', 'd']; }
    drawOps(cur);
    drawStack(stack);
    drawOut(out);
    if(i === 0){ noteLine.innerHTML = '要点：Push 只取入栈序列的下一个元素；Pop 只弹当前栈顶。'; }
    else if(i === 3){ noteLine.innerHTML = '第 3 步 Pop 弹的是<b>后进栈的 b</b>，不是 a——后进先出。'; }
    else if(i === 7){ noteLine.innerHTML = '此时栈内 d 上压着 e：下一次 Pop 必然弹出 e。'; }
    else if(i === 8){ noteLine.innerHTML = 'd 入栈在 e 之前，只能等 e 先出栈——<b>d 留在栈里</b>。'; }
    else if(i >= 9){ noteLine.innerHTML = '<b>出栈序列 = b, c, e，选 D。</b> 干扰项 A/B 少了 c 或 e，C 把 b、c 顺序颠倒。'; }
    else { noteLine.innerHTML = '继续执行下一步操作…'; }
  },

  result: {
    big: 'b, c, e',
    html: '<b>答案选 D。</b>三次 Pop 依次弹出 <code>b → c → e</code>；第 8 步 Pop 弹的是栈顶 e 而不是 d（后进先出）。操作结束后 a、d 仍留在栈中。记忆锚点：<b>Push 按序进、Pop 只看顶，严格照操作序列模拟即可</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
