<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-05 二叉排序树插入序列判定动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2020-05 哪个序列不能生成给定的二叉排序树（逐个插入模拟选项 B）
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var SEQ = ['4', '5', '1', '2', '3'];
var seqRowEl, treeBox, noteLine;

// 选项 B 插入过程中树的形状：4 根；5 右孩子；1 左孩子；2 落到 1 的右孩子
var POS = { n4:[330, 40], n1:[200, 140], n5:[460, 140], n2:[270, 240] };
var EDGES = [ ['n4','n5'], ['n4','n1'], ['n1','n2'] ];

function edgeLine(p1, p2){
  var x1 = POS[p1][0], y1 = POS[p1][1], x2 = POS[p2][0], y2 = POS[p2][1];
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy);
  var ang = Math.atan2(dy, dx);
  var d = AW.el('div', '');
  d.style.position = 'absolute';
  d.style.left = x1 + 'px';
  d.style.top = y1 + 'px';
  d.style.width = len + 'px';
  d.style.height = '2px';
  d.style.background = '#b9cbd0';
  d.style.transformOrigin = '0 0';
  d.style.transform = 'rotate(' + ang + 'rad)';
  return d;
}

function drawTree(present, hiNodes){
  treeBox.innerHTML = '';
  EDGES.forEach(function(e){
    if(present.indexOf(e[0]) >= 0 && present.indexOf(e[1]) >= 0){
      treeBox.appendChild(edgeLine(e[0], e[1]));
    }
  });
  present.forEach(function(k){
    var label = k.slice(1);
    var cls = hiNodes && hiNodes[k] ? hiNodes[k] : 'ok';
    var d = AW.el('div', 'aw-box' + (cls ? ' ' + cls : ''), label);
    d.style.position = 'absolute';
    d.style.left = (POS[k][0] - 22) + 'px';
    d.style.top = (POS[k][1] - 22) + 'px';
    d.style.borderRadius = '50%';
    treeBox.appendChild(d);
  });
}

function drawSeq(cur){
  var classes = [];
  for(var t = 0; t < SEQ.length; t++){
    if(t + 1 === cur){ classes.push('hit'); }
    else if(t + 1 < cur){ classes.push('ok'); }
    else { classes.push(''); }
  }
  var row = AW.el('div', '');
  row.appendChild(AW.el('div', 'aw-row-label', '<b>选项 B 的插入序列</b>（琥珀 = 正在插入）'));
  row.appendChild(AW.cellRow(SEQ, classes));
  return row;
}

AW.init({
  title: '哪个序列不能生成这棵二叉排序树？',
  subtitle: '目标 BST：根 4，左孩子 2（孩子 1、3），右孩子 5 · 插入规则：小沿左走、大沿右走，落在空位成为叶子',
  counterLabel: '已插入',
  ribbonTitle: '插入序号（✓ 符合目标 / ✗ 违背目标）',
  intro: '点击「▶ 播放」：逐个插入选项 B 的序列 4, 5, 1, 2, 3，看哪一步与目标树矛盾。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    seqRowEl = drawSeq(0);
    inner.appendChild(seqRowEl);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>按选项 B 逐个插入生成的 BST</b>（绿 = 正常落点，红 = 与目标树矛盾）'));
    treeBox = AW.el('div', '');
    treeBox.style.position = 'relative';
    treeBox.style.width = '660px';
    treeBox.style.height = '300px';
    inner.appendChild(treeBox);
    noteLine = AW.el('div', 'aw-row-label', '');
    inner.appendChild(noteLine);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'审题',   log:'目标树：根 4，左孩子 2（孩子 1、3），右孩子 5。逐个插入选项 B：4, 5, 1, 2, 3。', count:0 },
    { cls:'ok',   tag:'插 4',   log:'插入 4：树为空 → 4 作根。', count:1, ribbon:{k:1, ok:true} },
    { cls:'ok',   tag:'插 5',   log:'插入 5：5>4 → 4 的右孩子，与目标树一致。', count:2, ribbon:{k:2, ok:true} },
    { cls:'ok',   tag:'插 1',   log:'插入 1：1<4 → 4 的左孩子。落点暂时"合法"，但记住：目标里 4 的左孩子应是 2。', count:3, ribbon:{k:3, ok:true} },
    { cls:'miss', tag:'插 2',   log:'插入 2：2<4 进左子树，左子树根是 1，2>1 → 1 的右孩子。目标树中 2 应是 4 的左孩子、1 是 2 的左孩子 → 结构矛盾。', count:4, ribbon:{k:4, ok:false} },
    { cls:'step', tag:'不可恢复', log:'BST 插入只增不删、不旋转：已经形成的父子关系不会因后续插入改变 → 序列 B 永远长不成目标树。', count:4 },
    { cls:'ok',   tag:'验证其余', log:'快速验证：A（4,5,2,1,3）、C（4,2,5,3,1）、D（4,2,1,3,5）都能生成目标树。', count:5 },
    { cls:'done', tag:'完成',   log:'不能生成目标树的输入序列是 B（4, 5, 1, 2, 3）→ 选 B。', count:5, done:true },
  ],

  render: function(stage, sn, i){
    var present = [], hiNodes = {};
    if(i >= 1){ present = ['n4']; hiNodes.n4 = 'hit'; }
    if(i >= 2){ present = ['n4', 'n5']; hiNodes.n4 = 'ok'; hiNodes.n5 = 'hit'; }
    if(i >= 3){ present = ['n4', 'n5', 'n1']; hiNodes.n5 = 'ok'; hiNodes.n1 = 'hit'; }
    if(i >= 4){
      present = ['n4', 'n5', 'n1', 'n2'];
      hiNodes.n1 = 'ok';
      hiNodes.n2 = (i === 4) ? 'miss' : 'ok';
    }
    if(i >= 6){ hiNodes = { n4:'hit', n5:'ok', n1:'ok', n2:'hit' }; }

    var newSeq = drawSeq(Math.min(i >= 4 ? 4 : i, 4));
    seqRowEl.parentNode.replaceChild(newSeq, seqRowEl); seqRowEl = newSeq;
    drawTree(present, hiNodes);

    if(i === 0){ noteLine.innerHTML = '四个选项的元素集合完全相同，差别只在<b>插入次序</b>。'; }
    else if(i === 3){ noteLine.innerHTML = '插 1 落在 4 的左孩子位——这本来是 2 的位置，先记下疑点。'; }
    else if(i === 4){ noteLine.innerHTML = '<b>矛盾暴露</b>：2 只能挂在 1 的右边，而目标里 1 在 2 的下面。'; }
    else if(i === 5){ noteLine.innerHTML = '树形一旦形成不会自动调整——没有旋转、没有重排。'; }
    else if(i >= 6){ noteLine.innerHTML = '<b>答案选 B。</b> 其他三个序列插入时每个落点都与目标树一致。'; }
    else { noteLine.innerHTML = '…'; }
  },

  result: {
    big: '答案 B',
    html: '<b>选 B（4, 5, 1, 2, 3）。</b>插 2 时：2<4 进左子树、2>1 只能落到 1 的右孩子，而目标树中 2 是 4 的左孩子、1 是 2 的左孩子——结构矛盾且不可恢复。A、C、D 的每个落点都与目标树一致。记忆锚点：<b>BST 树形由插入序列唯一决定，矛盾以"落点不对"为准</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
