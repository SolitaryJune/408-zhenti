<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-08 AOE 网关键路径概念辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2020-08 概念辨析：AOE 网估算工程进度，四个叙述正误判断
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先回到关键路径的定义',
    cls: 'key',
    body: '<p>AOE 网：边表示活动（有权值 = 持续时间），结点表示事件；<b>源点</b>是入度为 0 的起点，<b>汇点</b>是出度为 0 的终点。</p>' +
          '<p><b>路径长度</b> = 路径上所有活动的持续时间之和——"长"看权的累加，不看边数。</p>' },
  { title: '判定 B：路径长度最长',
    cls: 'good',
    body: '<p><b>关键路径 = 从源点到汇点路径长度最长的路径</b>，它的长度就是工程的最短完工时间（总工期）。</p>' +
          '<p>这正是定义本身，B 对。</p>' },
  { title: '排除 A：不是"边数最多"',
    cls: 'bad',
    body: '<p>关键与"边数"无关：一条边数多但每边耗时很短的路径，总长度可能很小。</p>' +
          '<p>"关键"衡量的是<b>时间</b>，不是路径上的边数，A 错。</p>' },
  { title: '排除 C：增加关键活动时间必延长工期',
    cls: 'bad',
    body: '<p>关键活动都在关键路径上，它的持续时间加进关键路径的长度里。</p>' +
          '<p>关键活动耗时增加 → 关键路径变长 → <b>工程工期必然延长</b>，"不会延长"说反了，C 错。</p>' },
  { title: '排除 D：缩短关键活动未必缩短工期',
    cls: 'bad',
    body: '<p>工程可能存在<b>多条关键路径</b>：只缩短其中一条上关键活动的时间，工期仍由另一条关键路径决定。</p>' +
          '<p>而且关键活动不能无限压缩，压过头时关键路径会发生转移。"任一……将会"太绝对，D 错。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>正确的是 <b>B：关键路径是从原点到汇点路径长度最长的路径</b>。</p>' +
          '<p>记忆锚点：<b>关键 = 长度最长；增关键活动必延工，减关键活动未必省工</b>（多关键路径时）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    count: i + 1,
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'AOE 网估算工程进度：哪个叙述正确？',
  subtitle: '考点：关键路径定义 · 关键活动与工期的关系 · 四个选项逐项推演',
  counterLabel: '进度',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '<b>关键路径 = 源点到汇点路径长度（各活动耗时之和）最长的路径。</b>A 错在拿"边数"当标准；C 错——增关键活动时间工期必延长；D 错——存在多条关键路径时，缩短单条路径上的关键活动不改变总工期，且关键活动不能无限压缩。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
