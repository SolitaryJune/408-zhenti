<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-09 大根堆四命题正误判定动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     2020-09 概念辨析：大根堆（≥2 个元素）的四条叙述逐条判定
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先立准堆的定义',
    cls: 'key',
    body: '<p>大根堆：按<b>完全二叉树</b>的层序存放，且每个结点的值 <b>≥ 其左右孩子</b>。</p>' +
          '<p>注意堆只约束<b>父子</b>关系，<b>左右孩子之间</b>没有大小约束——这一条能同时决定 III 的错与 IV 的对。</p>' },
  { title: '命题 I：可视为完全二叉树 —— 对',
    cls: 'good',
    body: '<p>堆本来就是按完全二叉树的形态定义的：除最下层外每层填满，最下层结点靠左排列。</p>' +
          '<p>命题 I 正确。</p>' },
  { title: '命题 II：可顺序存储 —— 对',
    cls: 'good',
    body: '<p>完全二叉树按层序编号连续、没有"空洞"，正好一一下标存进数组：i 号的孩子是 <code>2i</code> 与 <code>2i+1</code>。</p>' +
          '<p>这也是堆排序用数组实现的原因，命题 II 正确。</p>' },
  { title: '命题 III：可视为二叉排序树 —— 错',
    cls: 'bad',
    body: '<p>BST 要求 <b>左 &lt; 根 &lt; 右</b>；堆的左右孩子之间<b>无序</b>。</p>' +
          '<p>反例：根 9、左 6、右 5，与根 9、左 5、右 6——两种都是大根堆，但后者右孩子 5 &lt; 根，违反 BST；且堆的中序遍历不单调。</p>' +
          '<p>命题 III 错误。</p>' },
  { title: '命题 IV：次大值一定在根的下一层 —— 对',
    cls: 'good',
    body: '<p>次大值只可能"输给"最大值（根）。反证：若它在深度 ≥ 2，其父结点不是根，而父 ≥ 它——与它"第二大"矛盾。</p>' +
          '<p>所以次大值只能是<b>根的孩子</b>（深度 1，即"根的下一层"），命题 IV 正确。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>正确的是 I、II、IV，错误的是 III → 选 <b>C</b>。</p>' +
          '<p>记忆锚点：<b>堆 = 完全二叉树 + 父≥子；左右无序（非 BST）；次大值必是根的孩子</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    count: i + 1,
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '大根堆的四个叙述，哪些正确？',
  subtitle: '考点：堆的定义与性质 · 逐条判定 I / II / III / IV',
  counterLabel: '进度',
  intro: '点击「▶ 播放」逐条判定四个命题。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '<b>仅 I、II 和 IV 正确。</b>I：堆是完全二叉树形态；II：完全二叉树可顺序存储；III 错——堆只有"父≥子"，左右孩子无序，不满足 BST 的"左<根<右"；IV 对——次大值只输给根，若更深则其父（非根）≥它，矛盾。记忆锚点：<b>堆只管上下，不管左右</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
