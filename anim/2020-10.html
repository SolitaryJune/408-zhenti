<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-10 4阶B树插入与分裂 · 结点生长动画</title>
<link rel="stylesheet" href="../assets/anim.css">
<style>
  .bsvg{width:100%;max-width:660px;display:block;margin:0 auto;background:#f8fafc;
    border:1px solid #1b3a4b38;border-radius:12px}
  .bnote{margin-top:10px;text-align:center;font-size:14.5px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .bnote code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 2020-10 4 阶 B 树插入分裂（SVG 逐步生长） ==================
 * 题：依次把 5,6,9,13,8,2,12,15 插入空 4 阶 B 树，问根结点中的关键字。（答案 B）
 * 演示：每插一个关键字树长一步；满 4 个关键字就分裂——第 ⌈4/2⌉ = 2 个上移父结点。 */

var RY = 60, LY = 225;                 // 根 / 叶两层的高度
var SX = { R:320, L:150, M:320, R2:490 }; // 结点槽位
// 每个状态：nodes=[{id,x,y,keys,kind,hotIdx,overflow,ghost}]，links=[[父,子]...]
var STATES = [
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[], kind:'root', ghost:true}], links:[] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[5], kind:'root', hotIdx:0}], links:[] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[5,6], kind:'root', hotIdx:1}], links:[] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[5,6,9], kind:'root', hotIdx:2}], links:[] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[5,6,9,13], kind:'root', overflow:true}], links:[] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[6], kind:'root', hotIdx:0, cap:'根'},
           {id:'L', x:SX.L, y:LY, keys:[5], kind:'leaf', cap:'叶'},
           {id:'R2', x:SX.R2, y:LY, keys:[9,13], kind:'leaf', cap:'叶'}],
    links:[['R','L'], ['R','R2']] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[6], kind:'root', cap:'根'},
           {id:'L', x:SX.L, y:LY, keys:[5], kind:'leaf', cap:'叶'},
           {id:'R2', x:SX.R2, y:LY, keys:[8,9,13], kind:'leaf', hotIdx:0, cap:'叶'}],
    links:[['R','L'], ['R','R2']] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[6], kind:'root', cap:'根'},
           {id:'L', x:SX.L, y:LY, keys:[2,5], kind:'leaf', hotIdx:0, cap:'叶'},
           {id:'R2', x:SX.R2, y:LY, keys:[8,9,13], kind:'leaf', cap:'叶'}],
    links:[['R','L'], ['R','R2']] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[6], kind:'root', cap:'根'},
           {id:'L', x:SX.L, y:LY, keys:[2,5], kind:'leaf', cap:'叶'},
           {id:'R2', x:SX.R2, y:LY, keys:[8,9,12,13], kind:'leaf', overflow:true, cap:'叶'}],
    links:[['R','L'], ['R','R2']] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[6,9], kind:'root', hotIdx:1, cap:'根'},
           {id:'L', x:SX.L, y:LY, keys:[2,5], kind:'leaf', cap:'叶'},
           {id:'M', x:SX.M, y:LY, keys:[8], kind:'leaf', cap:'叶'},
           {id:'R2', x:SX.R2, y:LY, keys:[12,13], kind:'leaf', cap:'叶'}],
    links:[['R','L'], ['R','M'], ['R','R2']] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[6,9], kind:'root', cap:'根'},
           {id:'L', x:SX.L, y:LY, keys:[2,5], kind:'leaf', cap:'叶'},
           {id:'M', x:SX.M, y:LY, keys:[8], kind:'leaf', cap:'叶'},
           {id:'R2', x:SX.R2, y:LY, keys:[12,13,15], kind:'leaf', hotIdx:2, cap:'叶'}],
    links:[['R','L'], ['R','M'], ['R','R2']] },
  { nodes:[{id:'R', x:SX.R, y:RY, keys:[6,9], kind:'root', hotIdx:0, hotIdx2:1, cap:'根'},
           {id:'L', x:SX.L, y:LY, keys:[2,5], kind:'leaf', cap:'叶'},
           {id:'M', x:SX.M, y:LY, keys:[8], kind:'leaf', cap:'叶'},
           {id:'R2', x:SX.R2, y:LY, keys:[12,13,15], kind:'leaf', cap:'叶'}],
    links:[['R','L'], ['R','M'], ['R','R2']] },
];
var SNAPS = [
  { cls:'step', tag:'规则', count:0,
    log:'空 4 阶 B 树：每结点<b>至多 3 个关键字、至多 4 棵子树</b>（至少 1 个关键字、2 棵子树）。新关键字总是插进叶结点。' },
  { cls:'ok', tag:'插 5', count:1, ribbon:{k:1, ok:true},
    log:'插入 5 → 落到根（根就是叶）：[5]。' },
  { cls:'ok', tag:'插 6', count:2, ribbon:{k:2, ok:true},
    log:'插入 6 → [5, 6]，仍 ≤ 3 个关键字，合法。' },
  { cls:'ok', tag:'插 9', count:3, ribbon:{k:3, ok:true},
    log:'插入 9 → [5, 6, 9]，正好达到关键字上限，但还没超。' },
  { cls:'miss', tag:'插 13', count:4, ribbon:{k:4, ok:true},
    log:'插入 13 → [5, 6, 9, <b>13</b>]：4 个关键字 &gt; 3，<b>溢出</b>，必须分裂。' },
  { cls:'shift', tag:'分裂 ①', count:4,
    log:'分裂：取第 ⌈4/2⌉ = 2 个关键字 <b>6</b> 上移作新根；左边 [5]、右边 [9, 13] 成为它的两棵子树。' },
  { cls:'ok', tag:'插 8', count:5, ribbon:{k:5, ok:true},
    log:'插入 8：8 在 6~9 之间 → 走右子树，落到叶 [9,13] → [8, 9, 13]。' },
  { cls:'ok', tag:'插 2', count:6, ribbon:{k:6, ok:true},
    log:'插入 2：2 &lt; 6 → 走左子树，落到叶 [5] → [2, 5]。' },
  { cls:'miss', tag:'插 12', count:7, ribbon:{k:7, ok:true},
    log:'插入 12：6 &lt; 12 → 右子树，落到叶 [8,9,13] → [8, 9, 12, <b>13</b>]：又 4 个关键字，<b>再次溢出</b>。' },
  { cls:'shift', tag:'分裂 ②', count:7,
    log:'分裂：取第 2 个关键字 <b>9</b> 上移 → 根长成 [6, <b>9</b>]；孩子变为 [2,5]、[8]、[12,13]。' },
  { cls:'ok', tag:'插 15', count:8, ribbon:{k:8, ok:true},
    log:'插入 15：15 &gt; 9 → 最右子树，落到叶 [12,13] → [12, 13, 15]，不超限，结束。' },
  { cls:'done', tag:'完成', count:8, done:true,
    log:'8 个关键字全部插完：根结点 = [6, 9] → 选 B。' },
];

// 画一个 B 树结点：外框 + 关键字格
function bnodeSvg(n, pos){
  var CW = 46, CH = 46, GAP = 4, PAD = 7;
  var keys = n.keys;
  var w = keys.length * CW + Math.max(0, keys.length - 1) * GAP + PAD * 2;
  var h = CH + PAD * 2;
  var x0 = n.x - w / 2, y0 = n.y - h / 2;
  var stroke = n.kind === 'root' ? '#1b3a4b' : '#16a34a';
  var cap = n.cap ? '<text x="' + n.x + '" y="' + (y0 - 9) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">' + n.cap + '</text>' : '';
  if(n.ghost){
    return '<rect x="' + (n.x - 70) + '" y="' + (n.y - 28) + '" width="140" height="56" rx="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>' +
           '<text x="' + n.x + '" y="' + n.y + '" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#94a3b8">（空）</text>' + cap;
  }
  var s = '<rect x="' + x0 + '" y="' + y0 + '" width="' + w + '" height="' + h + '" rx="10" fill="#fff" stroke="' + stroke + '" stroke-width="2.5"/>' + cap;
  keys.forEach(function(k, idx){
    var cx = x0 + PAD + idx * (CW + GAP);
    var fill = '#fff', sc = '#cbd5e1', tc = '#0f172a';
    if(n.overflow){ fill = '#fee2e2'; sc = '#dc2626'; tc = '#b91c1c'; }
    else if(n.hotIdx === idx || n.hotIdx2 === idx){ fill = '#fef3c7'; sc = '#d97706'; tc = '#92400e'; }
    s += '<rect x="' + cx + '" y="' + (y0 + PAD) + '" width="' + CW + '" height="' + CH + '" rx="8" fill="' + fill + '" stroke="' + sc + '" stroke-width="2"/>' +
         '<text x="' + (cx + CW/2) + '" y="' + (y0 + PAD + CH/2) + '" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="800" fill="' + tc + '" font-family="JetBrains Mono,Menlo,monospace">' + k + '</text>';
  });
  return s;
}

function stateSvg(st){
  var byId = {};
  st.nodes.forEach(function(n){ byId[n.id] = n; });
  var s = '<svg class="bsvg" viewBox="0 0 640 300">';
  st.links.forEach(function(lk){
    var A = byId[lk[0]], B = byId[lk[1]];
    s += '<line x1="' + A.x + '" y1="' + (A.y + 29) + '" x2="' + B.x + '" y2="' + (B.y - 29) + '" stroke="#5a7d8c" stroke-width="2.5"/>';
  });
  st.nodes.forEach(function(n){ s += bnodeSvg(n); });
  return s + '</svg>';
}

var NOTES = [
  '4 阶 = 最多 4 棵子树 = 最多 <b>3 个关键字</b>；下面逐个插入，看根结点最后剩什么。',
  '', '', '',
  '[5, 6, 9, 13] 有 4 个关键字 &gt; 3 → 违反 B 树定义，触发分裂。',
  '分裂口诀：取第 <code>⌈4/2⌉ = 2</code> 个关键字上移，左 1 个、右 2 个，各不超限。',
  '', '',
  '[8, 9, 12, 13] 又是 4 个关键字 → 再次分裂。',
  '根从 [6] 长成 [6, <b>9</b>]。',
  '',
  '<b>答案：根 = [6, 9]，选 B。</b> 干扰项 A(8)、C(8,13)、D(9,12) 分别是取错上移关键字或忘记分裂的结果。',
];

AW.init({
  title: '2020-10 4 阶 B 树的插入与分裂：根结点里剩哪些关键字？',
  subtitle: '依次插入 5, 6, 9, 13, 8, 2, 12, 15 · 4 阶 B 树每结点<b>至多 3 个关键字</b>，满 4 个就分裂——第 <code>⌈4/2⌉ = 2</code> 个关键字上移',
  counterLabel: '已插入',
  ribbonTitle: '插入序号（✓ 完成）',
  intro: '点击「▶ 播放」逐个插入关键字，重点看两次分裂。',
  snaps: SNAPS.map(function(sn, i){
    var html = stateSvg(STATES[i]) +
      '<div class="bnote">' + (NOTES[i] || '') + '</div>';
    var s = { cls:sn.cls, tag:sn.tag, log:sn.log, count:sn.count, html:html };
    if(sn.ribbon) s.ribbon = sn.ribbon;
    if(sn.done) s.done = true;
    return s;
  }),
  result: {
    big: '根结点关键字 = {6, 9}　（选 B）',
    html: '两个分裂点决定答案：插 13 → [5,6,9,13] 溢出，第 2 个关键字 <b>6</b> 上移；插 12 → [8,9,12,13] 溢出，第 2 个关键字 <b>9</b> 上移 → 根 [6, 9]，孩子为 [2,5]、[8]、[12,13,15]。记忆锚点：<code>m 阶 B 树结点至多 m−1 个关键字；分裂取第 ⌈m/2⌉ 个关键字上移父结点</code>。选项 C(8,13) 是把两次上移的都记成"最大值"，选项 D(9,12) 把 12 误当成上移关键字。',
  },
});
</script>
<script>/* aw-ok */</script>
</body>
</html>
