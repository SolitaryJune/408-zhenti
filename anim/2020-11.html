<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-11 基本有序时插入排序 vs 选择排序 动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2020-11 概念辨析：大部分元素已有序时，直接插入排序为何比简单选择排序高效
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：场景是"大部分元素已有序"',
    cls: 'key',
    body: '<p>"基本有序"意味着<b>逆序对很少</b>：每个元素向前挪一两步就能到位。</p>' +
          '<p>两类排序的代价来源不同：插入排序的代价随逆序对减少而下降；简单选择排序的代价与初始状态<b>完全无关</b>。要比较的是：比较次数（I）、辅助空间（II）、移动次数（III）。</p>' },
  { title: '命题 I：比较次数更少 —— 是原因',
    cls: 'good',
    body: '<p>简单选择排序无论数据多有序，第 i 趟都要扫完 <code>A[i..n]</code> 找最小值，总比较次数<b>固定为 n(n−1)/2</b>。</p>' +
          '<p>直接插入排序每趟从后往前比，遇到不比它大的元素就停——基本有序时每趟只比几次，总比较次数接近 <b>O(n)</b>，远小于 n(n−1)/2。</p>' +
          '<p>命题 I 成立，正是效率更高的原因。</p>' },
  { title: '命题 II：辅助空间更少 —— 不成立',
    cls: 'bad',
    body: '<p>直接插入排序用 1 个暂存变量，简单选择排序用 1 个暂存变量（记录最小值下标），两者辅助空间都是 <b>O(1)</b>。</p>' +
          '<p>一样多，谈不上"更少"，II 不是原因。</p>' },
  { title: '命题 III：移动次数更少 —— 不成立',
    cls: 'bad',
    body: '<p>直接插入排序每趟至少"取出暂存 + 放回"2 次移动，n 个元素至少约 <code>2(n−1)</code> 次；</p>' +
          '<p>简单选择排序只在"最小值不在当前位置"时才交换（每次 3 次移动），基本有序时常常<b>一次交换都不发生</b>（0 次移动）。</p>' +
          '<p>所以插入排序的移动次数<b>未必更少</b>，III 不是原因。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有 I 成立 → 选 <b>A</b>。</p>' +
          '<p>记忆锚点：<b>基本有序时，插入排序省的是"比较次数"</b>——选择排序的比较次数与初始状态无关；空间两者同为 O(1)；移动次数上选择排序反而可能更少。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    count: i + 1,
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '基本有序的数组：插入排序为何比选择排序高效？',
  subtitle: '考点：直接插入排序与简单选择排序的比较/移动/空间开销 · 逐条判定 I / II / III',
  counterLabel: '进度',
  intro: '点击「▶ 播放」逐条分析三个命题。',
  snaps: snaps,
  result: {
    big: '答案 A（仅 I）',
    html: '<b>原因只有比较次数。</b>选择排序固定比较 <code>n(n−1)/2</code> 次与数据无关；插入排序在基本有序时每趟几次比较就到位，接近 O(n)。II 错——两者空间都是 O(1)；III 错——插入每趟至少暂存+放回 2 次移动，选择排序基本有序时可能 0 次交换。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
