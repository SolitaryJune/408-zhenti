<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-12 机器字长与部件位数</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2020-12：哪些部件的位数一定与机器字长相同（概念辨析）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：机器字长是什么',
    cls: 'key',
    body: '<p>机器字长 = CPU <b>一次能处理的二进制位数</b>（定点数据通路宽度）。题目问哪些部件的位数<b>一定</b>等于它——"一定"二字意味着只要能举出反例就不算。</p>' },
  { title: '部件 I：ALU —— 一定相同',
    cls: 'good',
    body: '<p>ALU 是定点运算核心，一次运算处理一个机器字，输入输出宽度与机器字长一致 → <b>I 属于</b>。</p>' },
  { title: '部件 II：指令寄存器 IR —— 不一定',
    cls: 'bad',
    body: '<p>IR 存放当前指令，位数 = <b>指令字长</b>。指令字长可以不等于机器字长（32 位机上放 16 位指令、变长指令系统都是反例）→ "一定相同"不成立，<b>II 排除</b>。</p>' },
  { title: '部件 III：通用寄存器 —— 一定相同',
    cls: 'good',
    body: '<p>通用寄存器要能一次存放一个机器字的操作数，位数 = 机器字长 → <b>III 属于</b>。</p>' },
  { title: '部件 IV：浮点寄存器 —— 不一定',
    cls: 'bad',
    body: '<p>浮点寄存器按浮点数格式设计，常见 64 位、80 位，与机器字长无关 → <b>IV 排除</b>。</p>' },
  { title: '结论：仅 I、III → 选 B',
    cls: 'good',
    body: '<p>一定与机器字长相同的是 <b>ALU 和通用寄存器</b>，答案 <b>B</b>。选项 A、C 多了 II（指令寄存器），选项 D 多了 IV（浮点寄存器）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2020-12 · 部件位数与机器字长',
  subtitle: '考点：机器字长 · ALU / IR / 通用寄存器 / 浮点寄存器 逐个辨析',
  intro: '点击「▶ 播放」或「下一步」，逐个部件判断。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：跟<b>定点数据</b>打交道的部件（ALU、通用寄存器）位数 = 机器字长；<br>' +
      'IR 跟着<b>指令字长</b>走、浮点寄存器跟着<b>浮点格式</b>走，都不必等于机器字长。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
