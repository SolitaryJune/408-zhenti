<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-13 机器数 C800 0000H 的两种身份</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2020-13：C800 0000H 按 int / float 两种方式解释（位串解码演示）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var HEXC = ['C', '8', '0', '0', '0', '0', '0', '0'];
var BITS = '11001000000000000000000000000000'.split('');

var SIGN_CSS = 'border-color:#e63946;background:#e6394620;color:#a02830;';
var EXP_CSS  = 'border-color:#e07a2f;background:#f8edcb;color:#92400e;';
var FRAC_CSS = 'border-color:#1b3a4b;background:#d9e3df;color:#1b3a4b;';

function fieldStyles(){
  var s = [], i;
  for (i = 0; i < 32; i++){
    if (i === 0) s.push(SIGN_CSS);
    else if (i < 9) s.push(EXP_CSS);
    else s.push(FRAC_CSS);
  }
  return s;
}

// 小号二进制格行（32 位，窄格）
function binRow(classes, styles){
  var row = AW.el('div', 'aw-cells');
  BITS.forEach(function(b, i){
    var col = AW.el('div', 'aw-col');
    col.style.width = '30px';
    var box = AW.el('div', 'aw-box' + (classes && classes[i] ? ' ' + classes[i] : ''), b);
    box.style.width = '28px';
    box.style.height = '36px';
    box.style.fontSize = '14px';
    box.style.borderRadius = '7px';
    if (styles && styles[i]) box.style.cssText += styles[i];
    col.appendChild(box);
    col.appendChild(AW.el('div', 'aw-idx', i === 0 ? '位31' : (i === 31 ? '位0' : '')));
    row.appendChild(col);
  });
  return row;
}

function noteCard(html){
  return AW.el('div', 'aw-stepcard key', '<p>' + html + '</p>');
}

// IEEE 754 三字段划分条（hiExp=true 时阶码段高亮）
function fieldBar(hiExp){
  var bar = AW.el('div', '');
  bar.style.cssText = 'display:flex;gap:6px;width:max-content;margin:2px 0 8px;';
  function seg(w, bg, bd, colr, txt){
    var d = AW.el('div', '', txt);
    d.style.cssText = 'width:' + w + 'px;height:48px;display:flex;align-items:center;justify-content:center;' +
      'font-weight:700;font-size:12.5px;border-radius:9px;border:2px solid ' + bd + ';background:' + bg +
      ';color:' + colr + ';text-align:center;line-height:1.45;';
    return d;
  }
  bar.appendChild(seg(56, '#e6394620', '#e63946', '#a02830', '数符 1 位<br>1'));
  bar.appendChild(seg(160, hiExp ? '#fbbf24' : '#f8edcb', '#e07a2f', '#92400e',
                      hiExp ? '阶码字段 8 位<br>1001 0000B = 144' : '阶码字段 8 位<br>1001 0000B'));
  bar.appendChild(seg(330, '#d9e3df', '#1b3a4b', '#1b3a4b', '尾数 23 位：全 0（隐含 1.0）'));
  return bar;
}

function render(stage, sn){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var inner = AW.el('div', '');
  inner.style.minWidth = '640px';
  inner.appendChild(AW.el('div', 'aw-row-label', '<b>机器数 x</b>（32 位）＝ <code>C800 0000H</code>'));
  inner.appendChild(AW.cellRow(HEXC, sn.hexC));
  inner.appendChild(AW.el('div', 'aw-row-label', '<b>二进制展开</b>（左高位、右低位）'));
  inner.appendChild(binRow(sn.binC, sn.binS));
  if (sn.mode === 'int'){
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>身份一：int（补码整数）</b>'));
    inner.appendChild(noteCard(sn.note));
  } else if (sn.mode === 'float'){
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>身份二：float（IEEE 754 单精度）</b>'));
    inner.appendChild(fieldBar(sn.hiExp));
    inner.appendChild(noteCard(sn.note));
  } else if (sn.note){
    inner.appendChild(noteCard(sn.note));
  }
  wrap.appendChild(inner);
  stage.appendChild(wrap);
}

AW.init({
  title: '2020-13 · 同一个机器数 C800 0000H 的两种身份',
  subtitle: 'x 只可能是 <code>int</code>（补码）或 <code>float</code>（IEEE 754）——分别读出它',
  counterLabel: '推演步',
  ribbonTitle: '选项核对（✓ 成立 / ✗ 排除）',
  intro: '点击「▶ 播放」或「下一步」：先按 int 读一遍，再按 float 读一遍。',
  render: render,
  snaps: [
    { cls:'step', tag:'开始', count:0,
      log:'机器数 C800 0000H 摆在面前，x 的类型未知：可能是 int，也可能是 float。',
      hexC:[], binC:[], binS:null },
    { cls:'step', tag:'展开', count:1,
      log:'先展开成 32 位二进制：1100 1000 0000 … 0000，最高位是 1。',
      hexC:['hit'], binC:[], binS:null,
      note:'十六进制一位 = 二进制四位：C → 1100，8 → 1000，后面全是 0。' },
    { cls:'miss', tag:'按 int 读', count:2, mode:'int',
      log:'身份一 int（补码）：最高位（符号位）= 1 → x 是负数。',
      hexC:['hit'], binC:['miss'], binS:null,
      note:'符号位 = 1 → <b>负数</b>；补码真值 = −(2<sup>32</sup> − C800 0000H)，即对数值部分取反加 1。' },
    { cls:'shift', tag:'求真值', count:3, mode:'int',
      log:'符号位以外取反加 1：数值部分变成 3800 0000H = 7 × 2 的 27 次方。',
      hexC:['hit'], binC:['miss'], binS:null,
      note:'数值部分 = <code>3800 0000H</code> = 7 × 2<sup>27</sup> → x = <b>−7 × 2<sup>27</sup></b>。' },
    { cls:'ok', tag:'命中 A', count:4, mode:'int',
      log:'x = −7×2^27，与选项 A 完全一致 —— int 身份成立。',
      hexC:['hit'], binC:['miss'], binS:null,
      note:'x = <b>−7 × 2<sup>27</sup></b> ＝ 选项 <b>A</b>。', ribbon:{k:1, ok:true} },
    { cls:'step', tag:'按 float 读', count:5, mode:'float', hiExp:false,
      log:'身份二 float（IEEE 754）：切成 数符 1 位 | 阶码 8 位 | 尾数 23 位。',
      hexC:['hit'], binC:[], binS:fieldStyles(),
      note:'数符 = 1；阶码字段 = 1001 0000B = 144；尾数全 0。' },
    { cls:'shift', tag:'算阶码', count:6, mode:'float', hiExp:true,
      log:'真阶码 = 阶码字段 144 − 偏置 127 = 17；尾数全 0 → 有效数字 1.0。',
      hexC:['hit'], binC:[], binS:fieldStyles(),
      note:'阶码 = 144 − 127 = <b>17</b>；尾数全 0，IEEE 754 隐含前导 1 → 有效数字 1.0。' },
    { cls:'ok', tag:'float 的值', count:7, mode:'float', hiExp:true,
      log:'x = (−1) × 1.0 × 2^17 = −2^17。',
      hexC:['hit'], binC:[], binS:fieldStyles(),
      note:'float 身份读出：<b>x = −2<sup>17</sup></b>（注意不是选项 B 的 −2<sup>16</sup>）。' },
    { cls:'miss', tag:'排除 B', count:8,
      log:'选项 B 说 −2^16：float 读出的是 −2^17，差了一个 2 的幂 → B 排除。',
      hexC:['hit'], binC:[], binS:fieldStyles(), mode:'float', hiExp:true,
      note:'B（−2<sup>16</sup>）✗：与 float 结果 −2<sup>17</sup> 的阶码差 1。', ribbon:{k:2, ok:false} },
    { cls:'miss', tag:'排除 C', count:9,
      log:'选项 C 说 +2^17：无论按 int 还是 float 读，最高位都是 1，值必为负 → C 排除。',
      hexC:['hit'], binC:['miss'], binS:null, mode:'int',
      note:'C（+2<sup>17</sup>）✗：符号位为 1，值不可能是正数。', ribbon:{k:3, ok:false} },
    { cls:'miss', tag:'排除 D', count:10,
      log:'选项 D 说 25×2^27，也是正数，同样与符号位 1 矛盾 → D 排除。',
      hexC:['hit'], binC:['miss'], binS:null, mode:'int',
      note:'D（25×2<sup>27</sup>）✗：正数，与符号位矛盾。', ribbon:{k:4, ok:false} },
    { cls:'done', tag:'完成', count:11,
      log:'只有「int：−7×2^27」能对上选项 → 答案 A。',
      hexC:['hit'], binC:['miss'], binS:null, mode:'int',
      note:'结论：x 按 int 读 = −7×2<sup>27</sup>（选 A）；按 float 读 = −2<sup>17</sup>（选项中没有）。', done:true },
  ],
  result: {
    big: '答案 A',
    html: '同一个 32 位串两种读法：<code>int</code> → <b>−7×2<sup>27</sup></b>（A）；<code>float</code> → <b>−2<sup>17</sup></b>（无此选项）。<br>' +
      '记忆锚点：IEEE 754 别忘了<b>偏置 127</b> 和尾数<b>隐含的 1.0</b>；B 差一阶（−2^16），C、D 丢负号。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
