<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-23 多进程共享文件的打开文件表</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>题干关键条件：<b>多个进程共享同一个文件 F</b>。这指向考点：打开文件时的<b>两级表结构</b>——全系统一张「系统打开文件表」，每个进程一张「用户打开文件表」，两者分工不同。</p>' },
  { title: '逐项分析 A',
    cls: 'bad',
    body: '<p>A（各进程只能用「读」方式打开 F）：<b>错</b>。打开方式是各进程自己的选择，读、写都可以；「共享」不等于「只读」。A 把共享误解成了只读共享。</p>' },
  { title: '逐项分析 B',
    cls: 'good',
    body: '<p>B（系统打开文件表中仅有一个表项包含 F 的属性）：<b>对</b>。文件 F 在全系统只登记一次：属性、共享计数、读写函数入口都放在这一个表项里，各进程的表项都用指针指向它。进程越多，只是共享计数越大，表项不会变多。</p>' },
  { title: '逐项分析 C',
    cls: 'bad',
    body: '<p>C（各进程用户打开文件表中关于 F 的表项内容相同）：<b>错</b>。用户表表项记录<b>各进程自己的</b>打开方式与读写指针，完全可以不同——A 进程只读、B 进程可写，读的位置也各走各的。</p>' },
  { title: '逐项分析 D',
    cls: 'bad',
    body: '<p>D（进程关闭 F 时，系统删除 F 在系统打开文件表中的表项）：<b>错</b>。某进程关闭 F 只是把共享计数<b>减 1</b>；计数减到 0（再没人用 F）时，系统才删除该表项。「一关就删」会把其他还开着 F 的进程坑掉。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。核心记忆点：<b>文件级信息全局一份（系统打开文件表），进程级信息各留一份（用户打开文件表）</b>。关闭 = 计数减 1，减到 0 才真正删除。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '多进程共享文件 F：两张打开文件表怎么分工',
  subtitle: '考点：<code>文件系统 · 打开文件表</code> · 选项逐项推演',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '系统打开文件表按「文件」登记：共享 F 的进程再多，F 的表项<b>始终只有一个</b>（靠共享计数维持）。用户打开文件表按「进程 × 文件」登记，各进程的表项内容<b>互不相同</b>。A 错在「只能读」，C 错在「内容相同」，D 错在「一关就删」——正确做法是计数减 1、减到 0 才删。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
