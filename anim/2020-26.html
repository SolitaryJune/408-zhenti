<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-26 多级反馈队列的设计参数</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先搭算法骨架',
    cls: 'key',
    body: '<p>多级反馈队列的骨架：<b>多个就绪队列</b>，优先级递减、时间片递增；新进程进最高级队列，本级用完时间片未完成就降入下一级；高级队列空了才轮到低级队列。骨架上的每个"接头"都是设计者要定的参数。</p>' },
  { title: '因素 I：就绪队列的数量',
    cls: 'good',
    body: '<p>I「就绪队列的数量」：<b>需要考虑</b>。「多级」到底设几级？设 3 级还是 5 级直接影响响应时间与开销，是第一个要拍板的参数。</p>' },
  { title: '因素 II：就绪队列的优先级',
    cls: 'good',
    body: '<p>II「就绪队列的优先级」：<b>需要考虑</b>。各级队列之间谁先被调度（优先次序）必须明确规定，否则调度无从下手。</p>' },
  { title: '因素 III：各就绪队列的调度算法',
    cls: 'good',
    body: '<p>III「各就绪队列的调度算法」：<b>需要考虑</b>。各级内部用什么算法（通常是 RR，但时间片多大、是否 FCFS）都是设计出来的，不是天生的。</p>' },
  { title: '因素 IV：队列间的迁移条件',
    cls: 'good',
    body: '<p>IV「进程在就绪队列间的迁移条件」：<b>需要考虑</b>。「反馈」体现在迁移规则：何时降级（用完本级时间片）、长期等待是否允许升级。不定迁移条件，就没有"反馈"二字。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>I、II、III、IV <b>全部需要考虑</b>，答案选 <b>D</b>。核心记忆点：<b>「多级」＝ I＋II＋III，「反馈」＝ IV，名字里带的全都要设计</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '设计多级反馈队列调度算法要考虑哪些因素',
  subtitle: '考点：<code>CPU 调度 · 多级反馈队列</code> · 四个因素逐项核对',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（全部需要）',
    html: '队列设几级（I）、优先级怎么排（II）、各级用什么算法和时间片（III）、进程怎么在队列间降级/升级（IV）——这四个参数凑齐才是完整的多级反馈队列。漏掉 IV 是最常见的错误：没有迁移规则就没有「反馈」。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
