<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-27 银行家算法安全性检测</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var P = {
  P1: { alloc: [2, 3], total: [4, 4], need: [2, 1] },
  P2: { alloc: [2, 1], total: [3, 1], need: [1, 0] },
  P3: { alloc: [1, 2], total: [3, 4], need: [2, 2] }
};
var ORDER = ['P1', 'P2', 'P3'];
var R = {};

var STATE = {
  idle: { text: '待检测', bg: '#ffffff', fg: '#b9cbd0', rowBg: '#ffffff' },
  no:   { text: '✗ 暂不能完成', bg: '#e6394620', fg: '#a02830', rowBg: '#fff8f8' },
  done: { text: '✓ 已完成', bg: '#2f9e4424', fg: '#276942', rowBg: '#f6fef9' }
};

function buildTable(){
  var t = AW.el('table');
  t.style.cssText = 'border-collapse:collapse;font-size:13.5px;margin:0 auto 12px';
  var head = AW.el('tr');
  var HEADS = ['进程', '已分配 A', '已分配 B', '需求 A', '需求 B', '还需 A', '还需 B', '检测结果'];
  HEADS.forEach(function(h){
    var th = AW.el('th', null, h);
    th.style.cssText = 'border:1px solid #1b3a4b26;background:#f8edcb;color:#47616c;padding:6px 13px;font-weight:600';
    head.appendChild(th);
  });
  t.appendChild(head);
  R.rows = {};
  ORDER.forEach(function(k){
    var tr = AW.el('tr');
    var cells = [];
    var vals = [k, P[k].alloc[0], P[k].alloc[1], P[k].total[0], P[k].total[1], P[k].need[0], P[k].need[1], '待检测'];
    vals.forEach(function(v, idx){
      var td = AW.el('td', null, String(v));
      td.style.cssText = 'border:1px solid #1b3a4b26;padding:6px 13px;text-align:center;font-family:Menlo,monospace;transition:background .25s,color .25s';
      tr.appendChild(td);
      cells.push(td);
    });
    t.appendChild(tr);
    R.rows[k] = { tr: tr, cells: cells, stateTd: cells[7] };
  });
  return t;
}

AW.init({
  title: '银行家算法：t 时刻安全性检测',
  subtitle: 'A、B 两类资源各 6 个 · 剩余 Available=(1,0) · 找安全序列',
  counterLabel: '试探步',
  ribbonTitle: '试探顺序（✓ 可完成 / ✗ 暂不能）',
  intro: '点击「▶ 播放」逐步执行安全性检测：谁能被现有剩余资源喂饱，谁先完成并归还资源。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(buildTable());
    R.avail = AW.el('div', '');
    R.avail.style.cssText = 'font-size:14px;padding:8px 12px;border-radius:10px;background:#f8edcb;border:1px solid #1b3a4b26;margin-bottom:8px';
    R.seq = AW.el('div', '');
    R.seq.style.cssText = 'font-size:14px;padding:8px 12px;border-radius:10px;background:#f8edcb;border:1px solid #1b3a4b26';
    inner.appendChild(R.avail);
    inner.appendChild(R.seq);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls: 'shift', tag: '初始化',
      log: '总量 (6,6)，已分配 A 合计 2+2+1=5、B 合计 3+1+2=6 → 剩余 Available=(1,0)；各进程「还需」= 需求总量 − 已分配',
      count: 0, avail: [1, 0], st: {}, seq: [] },
    { cls: 'miss', tag: '试 P1',
      log: '试 P1：还需 (2,1)，而剩余 B 只有 0，1 > 0 不够 → P1 暂不能完成，先搁置',
      count: 1, ribbon: { k: 1, ok: false }, avail: [1, 0], st: { P1: 'no' }, seq: [] },
    { cls: 'ok', tag: 'P2 完成',
      log: '试 P2：还需 (1,0) ≤ (1,0) ✓ → P2 可完成，归还它占有的 (2,1)，剩余变 (3,1)',
      count: 2, ribbon: { k: 2, ok: true }, avail: [3, 1], st: { P1: 'no', P2: 'done' }, seq: ['P2'] },
    { cls: 'ok', tag: 'P1 完成',
      log: '回头再试 P1：还需 (2,1) ≤ (3,1) ✓ → P1 可完成，归还 (2,3)，剩余变 (5,4)',
      count: 3, ribbon: { k: 3, ok: true }, avail: [5, 4], st: { P1: 'done', P2: 'done' }, seq: ['P2', 'P1'] },
    { cls: 'ok', tag: 'P3 完成',
      log: '最后 P3：还需 (2,2) ≤ (5,4) ✓ → P3 可完成，归还 (1,2)，剩余变 (6,6)，全部恢复',
      count: 4, ribbon: { k: 4, ok: true }, avail: [6, 6], st: { P1: 'done', P2: 'done', P3: 'done' }, seq: ['P2', 'P1', 'P3'] },
    { cls: 'done', tag: '安全',
      log: '三个进程都能依次完成 → 存在安全序列 P2 → P1 → P3，答案 B',
      count: 4, avail: [6, 6], st: { P1: 'done', P2: 'done', P3: 'done' }, seq: ['P2', 'P1', 'P3'], done: true },
  ],

  render: function(stage, sn){
    ORDER.forEach(function(k){
      var st = sn.st[k] || 'idle';
      var s = STATE[st];
      var r = R.rows[k];
      r.tr.style.background = s.rowBg;
      r.stateTd.textContent = s.text;
      r.stateTd.style.background = s.bg;
      r.stateTd.style.color = s.fg;
      r.stateTd.style.fontFamily = 'inherit';
    });
    R.avail.innerHTML = '剩余资源 Available =（A, B）= <b>(' + sn.avail[0] + ', ' + sn.avail[1] + ')</b>';
    R.seq.innerHTML = sn.seq.length
      ? '安全序列：<b>' + sn.seq.join(' → ') + '</b>'
      : '安全序列：（推导中…）';
  },

  result: {
    big: '答案 B：安全序列 P2 → P1 → P3',
    html: '初始剩余只有 <code>(1,0)</code>：P1 需 (2,1) 被卡（A 错在此），P2 需 (1,0) 正好满足 → 归还 (2,1) 剩余变 (3,1)，P1 需 (2,1) 满足 → 剩余 (5,4)，P3 需 (2,2) 满足 → 全部完成。C 选项卡在 P2 后轮 P3（B 只剩 1）。记忆点：<b>谁「还需」不超过剩余谁先走，走完把已分配的全还回来</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
