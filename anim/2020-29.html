<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-29 父进程与子进程</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：创建子进程时发生了什么',
    cls: 'key',
    body: '<p>系统创建子进程时做两件事：<b>① 新建一个 PCB</b>；<b>② 分配独立的虚拟地址空间</b>（复制父进程的，配合写时复制）。所以父子是两个完全独立的进程——本题是<b>选错误项</b>。</p>' },
  { title: '逐项分析 A',
    cls: 'good',
    body: '<p>A（父进程与子进程可以并发执行）：<b>对</b>。父子是两个独立进程，创建后谁先谁后、是否同时运行都没有绑定关系，可以并发执行。</p>' },
  { title: '逐项分析 B',
    cls: 'bad',
    body: '<p>B（父进程与子进程共享虚拟地址空间）：<b>错</b>。子进程拥有<b>独立的</b>（复制来的）虚拟地址空间，父子互不侵扰。把「共享地址空间」安到进程头上，混淆了进程与线程——这是本题要选的错误项。</p>' },
  { title: '逐项分析 C',
    cls: 'good',
    body: '<p>C（父进程与子进程有不同的进程控制块）：<b>对</b>。创建子进程时系统分配了新 PCB，各自的 PID、状态、资源清单分别记录。</p>' },
  { title: '逐项分析 D',
    cls: 'good',
    body: '<p>D（父进程与子进程不能同时使用同一临界资源）：<b>对</b>。临界资源一次只允许一个进程使用，父与子同样要互斥进入，谁也不能例外。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>错误的是 <b>B</b>。核心记忆点：<b>进程之间隔离（地址空间、PCB 各自一份），线程之内才谈共享</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '父进程与子进程：共享什么、不共享什么',
  subtitle: '考点：<code>进程与线程 · 进程创建</code> · 找出错误叙述',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（错误项）',
    html: '父子进程<b>不共享虚拟地址空间</b>：子进程的地址空间是复制来的独立一份（写时复制）。共享地址空间的是<b>同一进程内的线程</b>。父子各自有 PCB（C 对）、可并发（A 对）、同受临界资源互斥约束（D 对）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
