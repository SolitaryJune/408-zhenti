<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-31 文件数量的上限</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：拆开目录项',
    cls: 'key',
    body: '<p>目录项 64 字节 = <b>4 字节索引结点号 + 60 字节文件名</b>。每个文件必须对应一个索引结点，文件名只是给人看的别名——所以文件数上限取决于：<b>索引结点号能表示多少个不同值</b>。</p>' },
  { title: '第一步：算索引结点号的空间',
    cls: 'step',
    body: '<p>索引结点号占 4 字节 = 32 位二进制 → 最多表示 <code>2^32</code> 个不同编号（2 的 32 次方）。每个编号对应一个索引结点，一个索引结点对应一个文件。</p>' },
  { title: '第二步：算文件名的空间',
    cls: 'step',
    body: '<p>文件名 60 字节、由小写英文字母构成 → 组合数 26^60（约等于 2^282），远大于 2^32。文件名的「名字空间」根本用不完，<b>不是瓶颈</b>。</p>' },
  { title: '第三步：取瓶颈',
    cls: 'good',
    body: '<p>上限 = min(名字空间, 结点号空间) = <code>2^32</code>。木桶由最短的板决定：<b>索引结点号的 32 位就是那块短板</b>，答案选 <b>B</b>。</p>' },
  { title: '易错对照',
    cls: 'bad',
    body: '<p>选 C（2^60）：把文件名的 60 字节当成编号空间，忘了文件必须挂在索引结点上。选 D（2^64）：把 64 字节目录项整体当编号。选 A（2^26）：把「小写字母 26 种」误当位数来源。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案 <b>B（2^32）</b>。核心记忆点：<b>目录项里唯一标识文件的是索引结点号；4 字节 → 32 位 → 最多 2^32 个文件</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '该文件系统能创建的文件数量上限',
  subtitle: '考点：<code>文件系统 · 目录项与索引结点</code> · 纯计算推理链',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（2^32）',
    html: '目录项 64B = 4B 索引结点号 + 60B 文件名。文件数上限由<b>索引结点号的位数</b>决定：4 字节 = 32 位 → <code>2^32</code> 个不同编号；26^60 的文件名空间是天文数字，不是瓶颈。木桶短板：结点号 32 位。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
