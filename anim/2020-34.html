<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-34 虚电路网络的叙述辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     概念/分析类动画：虚电路工作方式 + 逐项判断找"错误"项
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：找"错误"的那一项',
    cls: 'key',
    body: '<p>虚电路三步走：<b>建立</b>（沿途结点选路、登记表项）→ <b>传输</b>（分组只带虚电路号 VCID、沿同一路径按序转发）→ <b>释放</b>。先按这套流程核对 A、C、D，再看 B 卡在哪。</p>' },
  { title: 'A、C、D 为什么都对',
    cls: 'good',
    body: '<p><b>A 对</b>：同一条虚电路的分组走同一路由，必然按发送顺序到达，无须重排。<b>C 对</b>：建立虚电路时要在沿途各结点做路由选择、登记表项。<b>D 对</b>：分组首部只填 VCID，结点按 VCID 查表转发，还省去了完整目的地址的开销。</p>' },
  { title: 'B 错在哪：它是"电路交换"的特征',
    cls: 'bad',
    body: '<p>"为每条虚电路<b>预分配带宽</b>"是电路交换（独占物理线路）的做法。虚电路是<b>逻辑连接</b>：不独占线路，同一条物理线路上可以同时运行多条虚电路、<b>共享线路带宽</b>，网络按需分配资源即可，并不要求为每条虚电路固定预分配带宽。</p>' },
  { title: '易混对比：虚电路 vs 电路交换 vs 数据报',
    cls: 'step',
    body: '<p><b>电路交换</b>：独占资源、预分配带宽；<b>虚电路</b>：逻辑连接、按 VCID 转发、按序到达、线路共享；<b>数据报</b>：无连接、每个分组独立选路、可能乱序。B 项把虚电路错当成了电路交换。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>虚电路"占结点表项，不占线路带宽"</b>——需要建路与路由选择（C 对）、按 VCID 转发（D 对）、按序到达（A 对），唯独不需要预分配带宽。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '关于虚电路网络，哪一项是错的？',
  subtitle: '考点：虚电路工作方式 · 逐项核对 A「按序」B「预分配带宽」C「建路路由选择」D「按 VCID 转发」',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：<b>虚电路占结点表项、不占线路带宽</b>。"预分配带宽"是电路交换的特征；A/C/D 分别对应虚电路按序到达、建路路由选择、按 VCID 转发三个标准特征。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
