<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-36 停等协议的最大信道利用率</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     过程演示类动画：一个"发送—确认"周期的时间轴逐段点亮
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var segBars, accBox;

var SEGS = [
  { n1: '甲发数据帧', n2: '800 ms', w: 40, c: '#1b3a4b' },
  { n1: '传播→乙',   n2: '200 ms', w: 10, c: '#5a7d8c' },
  { n1: '乙发确认帧', n2: '800 ms', w: 40, c: '#2f9e44' },
  { n1: '传播→甲',   n2: '200 ms', w: 10, c: '#4ade80' },
];

AW.init({
  title: '停等协议：一个周期里到底花掉多少时间',
  subtitle: '数据帧 = 确认帧 = 1000 B · 速率 10 kbps · 单向传播 200 ms · 利用率 U = 发数据时间 ÷ 整个周期',
  counterLabel: '累计时延(ms)',
  ribbonTitle: '周期片段（✓ 已计入）',
  intro: '点击「▶ 播放」，把一个周期的时间轴一段一段点亮。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.style.cssText = 'padding:6px 2px 2px;';

    var lbl = AW.el('div', 'aw-row-label', '<b>一个「发送—确认」周期</b>（宽度按时长等比：2000 ms = 100%）');
    inner.appendChild(lbl);

    var track = AW.el('div', '');
    track.style.cssText = 'display:flex;width:640px;max-width:100%;height:66px;border-radius:12px;overflow:hidden;border:2px solid #5a7d8c66;';
    segBars = [];
    SEGS.forEach(function(s){
      var b = AW.el('div', '');
      b.style.cssText = 'width:' + s.w + '%;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'font-size:11.5px;font-weight:700;color:#fff;background:' + s.c + ';opacity:.16;transition:opacity .4s;text-align:center;line-height:1.4;';
      b.innerHTML = '<span>' + s.n1 + '</span><span>' + s.n2 + '</span>';
      track.appendChild(b);
      segBars.push(b);
    });
    inner.appendChild(track);

    accBox = AW.el('div', '');
    accBox.style.cssText = 'margin-top:12px;font-size:15px;font-weight:700;color:#1b3a4b;';
    accBox.innerHTML = '一个周期累计 = <code>0 ms</code>';
    inner.appendChild(accBox);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'审题',   log:'停等协议：甲发 1 帧 → 等乙确认 → 才发下一帧。帧长 1000B、速率 10kbps、单向传播 200ms', count:0, acc:0 },
    { cls:'step', tag:'算发送时延', log:'数据帧发送时延 = 1000 × 8 bit ÷ 10 kbps = 8000 bit ÷ 10000 bit/s = 800 ms', count:800, acc:800, ribbon:{k:1, ok:true} },
    { cls:'step', tag:'去程传播', log:'数据帧再经单向传播 200 ms 到达乙 → 已用 1000 ms', count:1000, acc:1000, ribbon:{k:2, ok:true} },
    { cls:'shift', tag:'确认帧也要发', log:'乙收到后立即回确认帧；确认帧同为 1000B，发送时延也是 800 ms（最易漏！）→ 已用 1800 ms', count:1800, acc:1800, ribbon:{k:3, ok:true} },
    { cls:'step', tag:'回程传播', log:'确认帧再花 200 ms 传回甲 → 完整周期 T = 800 + 200 + 800 + 200 = 2000 ms', count:2000, acc:2000, ribbon:{k:4, ok:true} },
    { cls:'done', tag:'完成',   log:'甲一个周期内只发 1 个数据帧：U = 800 ÷ 2000 = 40%', count:2000, acc:2000, done:true },
  ],

  render: function(stage, sn, i){
    for(var j = 0; j < segBars.length; j++){
      segBars[j].style.opacity = (i >= 1 + j) ? 1 : .16;
    }
    accBox.innerHTML = '一个周期累计 = <code>' + sn.acc + ' ms</code>' +
      (i >= 5 ? '　→　U = 800 / 2000 = <b style="color:#2f9e44">40%</b>' : '');
  },

  result: {
    big: 'U = 40%',
    html: '利用率 = 发送数据帧的时间 ÷ 完整周期 = <code>800 / 2000</code> = <b>40%</b>，选 <b>D</b>。干扰项来源：漏算确认帧发送时延得 66.7%（B）；漏算回程传播得 44.4%（C）；只算一半周期得 80%（A）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
