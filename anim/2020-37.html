<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-37 802.11 中最长的帧间间隔 IFS</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/分析类动画：四个 IFS 逐个对号入座（SIFS 还是 DIFS）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：四个 IFS 各站在哪帧前面',
    cls: 'key',
    body: '<p>对照题图的帧交换序列：<b>IFS1</b> 在 H 发 <code>RTS</code> 之前；<b>IFS2</b> 在 AP 回 <code>CTS</code> 之前；<b>IFS3</b> 在 H 发 <code>DATA</code> 之前；<b>IFS4</b> 在 AP 回 <code>ACK</code> 之前。要判断长短，先给每个 IFS 找到它服务的帧。</p>' },
  { title: '802.11 的两类帧间间隔',
    cls: 'step',
    body: '<p><b>SIFS</b>（短帧间间隔）：最短，用来分隔<b>属于同一次对话的各帧</b>——ACK、CTS、分片后的数据帧等都用它。<b>DIFS</b>（DCF 帧间间隔）：在 SIFS 基础上再加 2 个时隙，<b>最长</b>，站点<b>主动发起新的帧交换</b>（发数据帧、RTS 等管理帧）之前必须等 DIFS。</p>' },
  { title: 'IFS2 / IFS3 / IFS4：都是"接话"',
    cls: 'step',
    body: '<p><code>RTS → CTS → DATA → ACK</code> 是<b>同一次对话</b>的四个帧。CTS 是对 RTS 的回应、DATA 是拿到 CTS 后才发的、ACK 是对 DATA 的回应——三者都是对话的<b>后续帧</b>，前面只等最短的 SIFS：IFS2 = IFS3 = IFS4 = SIFS。</p>' },
  { title: 'IFS1：H 在"开口"发起新对话',
    cls: 'good',
    body: '<p>RTS 是 H <b>主动发起新的帧交换</b>的第一帧（争用信道前先预约），发它之前必须等最长的 <b>DIFS</b>，即 IFS1 = DIFS。所以 IFS1 最长——题图上 IFS1 的空白段也明显画得比其他三个长。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A（IFS1）</b>。记忆锚点：<b>"开口"要等 DIFS，"接话"只用 SIFS</b>——RTS 是开口，CTS/DATA/ACK 都是接话。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'H 与 AP 的帧交换中，哪个 IFS 最长？',
  subtitle: 'IEEE 802.11 CSMA/CA · 序列：IFS1→RTS→IFS2→CTS→IFS3→DATA→IFS4→ACK',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（IFS1）',
    html: '记忆锚点：<b>"开口"等 DIFS（最长），"接话"用 SIFS（最短）</b>。RTS 主动发起新的帧交换 → IFS1 = DIFS；CTS/DATA/ACK 是同一次对话的后续帧 → IFS2 = IFS3 = IFS4 = SIFS。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
