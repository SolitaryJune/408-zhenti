<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-42 前缀编码的二叉树保存、译码与判定动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     2020-42 概念/过程题：前缀特性的不等长编码——二叉树保存、译码、判定
     外壳与控件全部由 assets/anim-engine.js 提供，只改下面的 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '问 1：选什么数据结构？—— 二叉树',
    cls: 'key',
    body: '<p>前缀特性：任一字符的编码都不是其他字符编码的前缀。把每个编码看成<b>从根到叶的一条 0/1 路径</b>：</p>' +
          '<ul><li>左分支记 <code>0</code>，右分支记 <code>1</code>；</li><li><b>字符只保存在叶结点</b>上。</li></ul>' +
          '<p>于是"保存编码表"就等于保存这棵二叉树。</p>' },
  { title: '问 1：为什么天然满足前缀特性',
    cls: 'good',
    body: '<p>字符只在<b>叶子</b>上：从根到某个叶子的路径，不可能恰好是到另一个叶子路径的<b>开头一段</b>（那段的中途结点只存放指针，不存放字符）。</p>' +
          '<p>所以"任一编码不是其他编码的前缀"由结构自动保证。</p>' },
  { title: '问 2：译码过程（0/1 串 → 字符串）',
    cls: 'key',
    body: '<p>四步循环：</p>' +
          '<ol><li>从<b>根结点</b>出发，读 0/1 串的当前位；</li>' +
          '<li>该位为 <code>0</code> 走左孩子，为 <code>1</code> 走右孩子；</li>' +
          '<li>到达<b>叶结点</b>：输出叶上的字符，然后<b>回到根</b>；</li>' +
          '<li>重复上述过程，直到 0/1 串读完。</li></ol>' +
          '<p>根到叶路径唯一 → 译码结果唯一。</p>' },
  { title: '问 3：判定前缀特性 = 边建树边检查',
    cls: 'step',
    body: '<p>判定过程同时就是<b>构建二叉树</b>的过程：初始只有根结点，左右指针均为空。</p>' +
          '<p>逐个读入编码 <code>C</code>，按 C 的每一位沿相应分支向下走，<b>遇到空指针就创建新结点</b>。</p>' },
  { title: '问 3：两种违规情形（任一出现即无前缀特性）',
    cls: 'bad',
    body: '<p><b>情形① 撞叶</b>：还没扫描完 <code>C</code> 就到达了一个已有叶结点——说明某个已有编码是 <code>C</code> 的前缀。</p>' +
          '<p><b>情形② 空转</b>：扫描完 <code>C</code> 时一个新结点都没创建——说明 <code>C</code> 走的全是旧路，<code>C</code> 是某个已有编码的前缀。</p>' +
          '<p>两种情形都表明不具有前缀特性。</p>' },
  { title: '问 3：通过条件',
    cls: 'good',
    body: '<p>只有<b>在处理 <code>C</code> 的最后一位时创建了新叶结点</b>，<code>C</code> 才与已有编码互不为前缀——通过检查，继续处理下一个编码。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>1）用<b>二叉树</b>保存编码（左 0 右 1、字符在叶）；2）译码从根出发按位走分支、到叶输出字符后回根；3）判定 = 建树过程：撞叶或空转即无前缀特性，<b>全部编码都在最后一位新建叶结点</b>才具有前缀特性。</p>' +
          '<p>记忆锚点：<b>编码在叶、译码走根到叶、判定边建树边查"撞叶/空转"</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    count: i + 1,
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '前缀编码：二叉树保存、译码与前缀特性判定',
  subtitle: '考点：前缀特性 · 编码树（左 0 右 1、字符在叶）· 三问逐个展开',
  counterLabel: '进度',
  intro: '点击「▶ 播放」按问展开推理链。',
  snaps: snaps,
  result: {
    big: '二叉树（字符在叶）',
    html: '<b>三问要点：</b>1）用二叉树保存——左分支 0、右分支 1，叶结点存字符，前缀特性由结构自动保证；2）译码从根出发按位走分支，到叶输出字符并<b>回到根</b>，重复到串读完；3）判定即建树——没扫完就<b>撞上已有叶</b>（别人是 C 的前缀）或扫完却<b>没新建结点</b>（C 是别人的前缀）都无前缀特性，只有最后一位新建了叶结点才通过。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
