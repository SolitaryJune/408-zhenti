<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-45 前趋关系的信号量同步</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var OPS = ['A', 'B', 'C', 'D', 'E'];
var SEMS = ['S_AC', 'S_BC', 'S_CE', 'S_DE'];
var R = {};

var LINES = [
  ['A', 'A; signal(S_AC);'],
  ['B', 'B; signal(S_BC);'],
  ['C', 'wait(S_AC); wait(S_BC); C; signal(S_CE);'],
  ['D', 'D; signal(S_DE);'],
  ['E', 'wait(S_CE); wait(S_DE); E;']
];

AW.init({
  title: '前趋图 A、B → C → E（D → E）的信号量同步',
  subtitle: '四个同步信号量 <code>S_AC S_BC S_CE S_DE</code> 初值均为 0 · 前驱完 signal、后继始前 wait',
  counterLabel: '已发 signal',
  ribbonTitle: '前趋边满足（✓ 已 signal）',
  intro: '点击「▶ 播放」逐步推演五个操作如何靠 wait/signal 被同步。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>五个操作</b>（cobegin…coend 并发启动）'));
    var opsRow = AW.el('div', 'aw-cells');
    R.op = {};
    OPS.forEach(function(o){
      var col = AW.el('div', 'aw-col');
      col.style.width = '68px';
      col.appendChild(AW.el('div', 'aw-ptr', ''));
      var box = AW.el('div', 'aw-box', o);
      box.style.width = '64px';
      col.appendChild(box);
      col.appendChild(AW.el('div', 'aw-idx', '操作 ' + o));
      opsRow.appendChild(col);
      R.op[o] = box;
    });
    inner.appendChild(opsRow);

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>四个同步信号量</b>（初值均为 0，前驱完成后加 1）'));
    var semRow = AW.el('div', 'aw-cells');
    R.sem = {};
    SEMS.forEach(function(s){
      var col = AW.el('div', 'aw-col');
      col.style.width = '82px';
      var box = AW.el('div', 'aw-box', '0');
      box.style.width = '78px';
      box.style.height = '38px';
      box.style.fontSize = '15px';
      col.appendChild(box);
      col.appendChild(AW.el('div', 'aw-idx', s));
      semRow.appendChild(col);
      R.sem[s] = box;
    });
    inner.appendChild(semRow);

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>同步伪代码</b>（wait 即 P，signal 即 V）'));
    R.code = {};
    LINES.forEach(function(l){
      var d = AW.el('div', null,
        '<b style="display:inline-block;width:18px;color:#1b3a4b">' + l[0] + '：</b><span style="color:#213e48">' + l[1] + '</span>');
      d.style.cssText = 'font-family:Menlo,monospace;font-size:13px;line-height:2;padding:2px 10px;border-radius:8px;transition:background .25s';
      inner.appendChild(d);
      R.code[l[0]] = d;
    });

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls: 'shift', tag: '初始',
      log: '四个同步信号量 S_AC、S_BC、S_CE、S_DE 初值均为 0（许可尚未产生）；A、B、C、D、E 由 cobegin 并发启动',
      count: 0, op: {}, sems: [0, 0, 0, 0], lines: [] },
    { cls: 'ok', tag: 'A 完成',
      log: '执行 A，末尾 signal(S_AC)：S_AC 由 0 → 1，前趋边 A→C 满足',
      count: 1, ribbon: { k: 1, ok: true }, op: { A: 'done' }, sems: [1, 0, 0, 0], lines: ['A'] },
    { cls: 'ok', tag: 'B 完成',
      log: '执行 B，末尾 signal(S_BC)：S_BC 由 0 → 1，前趋边 B→C 满足',
      count: 2, ribbon: { k: 2, ok: true }, op: { A: 'done', B: 'done' }, sems: [1, 1, 0, 0], lines: ['B'] },
    { cls: 'ok', tag: 'C 开跑',
      log: 'C 先 wait(S_AC)（1→0）、再 wait(S_BC)（1→0），两个许可都拿到 → 才执行 C',
      count: 2, op: { A: 'done', B: 'done', C: 'run' }, sems: [0, 0, 0, 0], lines: ['C'] },
    { cls: 'ok', tag: 'C 完成',
      log: 'C 执行完 signal(S_CE)：S_CE 由 0 → 1，前趋边 C→E 满足',
      count: 3, ribbon: { k: 3, ok: true }, op: { A: 'done', B: 'done', C: 'done' }, sems: [0, 0, 1, 0], lines: ['C'] },
    { cls: 'ok', tag: 'D 完成',
      log: '执行 D，末尾 signal(S_DE)：S_DE 由 0 → 1，前趋边 D→E 满足',
      count: 4, ribbon: { k: 4, ok: true }, op: { A: 'done', B: 'done', C: 'done', D: 'done' }, sems: [0, 0, 1, 1], lines: ['D'] },
    { cls: 'ok', tag: 'E 开跑',
      log: 'E 先 wait(S_CE)（1→0）、再 wait(S_DE)（1→0），C、D 的许可都到手 → 才执行 E',
      count: 4, op: { A: 'done', B: 'done', C: 'done', D: 'done', E: 'run' }, sems: [0, 0, 0, 0], lines: ['E'] },
    { cls: 'done', tag: '全部完成',
      log: '五个操作按同步关系完成：每条前趋边「前驱做完 signal、后继开跑前 wait」；执行完四个信号量都回到 0，本题只有同步、没有互斥',
      count: 4, op: { A: 'done', B: 'done', C: 'done', D: 'done', E: 'done' }, sems: [0, 0, 0, 0], lines: [], done: true },
  ],

  render: function(stage, sn){
    OPS.forEach(function(o){
      var b = R.op[o];
      b.className = 'aw-box';
      b.style.background = '';
      b.style.borderColor = '';
      var st = sn.op[o] || 'idle';
      if(st === 'done'){ b.className = 'aw-box ok'; }
      else if(st === 'run'){
        b.style.background = '#f8edcb';
        b.style.borderColor = '#e07a2f';
      }
    });
    SEMS.forEach(function(s, j){
      R.sem[s].textContent = String(sn.sems[j]);
    });
    OPS.forEach(function(o){ R.code[o].style.background = ''; });
    (sn.lines || []).forEach(function(o){
      R.code[o].style.background = '#fef9c3';
    });
  },

  result: {
    big: '4 个信号量，初值均为 0',
    html: '设 <code>S_AC、S_BC、S_CE、S_DE</code>，初值均为 <b>0</b>，分别描述 A→C、B→C、C→E、D→E。前驱操作<b>做完</b> <code>signal()</code>，后继操作<b>开跑前</b> <code>wait()</code>：C 要等到 A、B 两个信号，E 要等到 C、D 两个信号。注意：同步信号量初值是 0（互斥才是 1）；本题只有同步关系，没有互斥关系。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
