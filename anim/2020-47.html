<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-47 NAT 配置与数据报 P 的逐跳地址变换</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     过程演示类动画：拓扑图 + IP 数据报 P 的源/目的地址逐跳变换
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var ND = {}, srcBox, dstBox, posLabel, natCells;

function mkNode(name, ip, sub){
  var d = AW.el('div', '');
  d.style.cssText = 'border:2px solid #586e72;border-radius:10px;padding:6px 8px;background:#fff;text-align:center;' +
    'transition:all .35s;flex:0 0 auto;';
  var html = '<div style="font-size:12.5px;font-weight:700;color:#1b3a4b;white-space:nowrap;">' + name + '</div>';
  if(ip){ html += '<div style="font-size:10px;color:#47616c;font-family:monospace;white-space:nowrap;">' + ip + '</div>'; }
  d.innerHTML = html;
  if(sub){
    var s = AW.el('div', '', sub);
    s.style.cssText = 'font-size:9.5px;color:#92400e;font-weight:700;white-space:nowrap;';
    d.appendChild(s);
  }
  return d;
}
function mkLink(txt){
  var d = AW.el('div', '');
  d.style.cssText = 'display:flex;flex-direction:column;align-items:center;flex:0 0 auto;';
  var bar = AW.el('div', '');
  bar.style.cssText = 'width:16px;height:5px;background:#47616c;border-radius:3px;';
  d.appendChild(bar);
  if(txt){
    var t = AW.el('div', '', txt);
    t.style.cssText = 'font-size:9px;color:#586e72;font-family:monospace;white-space:nowrap;';
    d.appendChild(t);
  }
  return d;
}
function hlNode(n, border, bg){
  n.style.borderColor = border;
  n.style.background = bg;
  n.style.boxShadow = '0 0 0 3px rgba(37,99,235,.10)';
}

AW.init({
  title: 'H2 访问 Web 服务器：P 的地址怎么变',
  subtitle: '两个局域网都用私网段 192.168.1.0/24 · R2、R3 均启用 NAT · Web 服务器用默认端口 80',
  counterLabel: 'P 已过节点',
  ribbonTitle: '关键环节（✓ 已完成）',
  intro: '点击「▶ 播放」：先解决第 1 问的 NAT 配置，再逐跳跟踪第 2 问的地址变化。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.style.cssText = 'padding:6px 2px 2px;';

    var lbl = AW.el('div', 'aw-row-label', '<b>拓扑</b>（注意：Web服务器 与 H2 的私网地址相同，都是 192.168.1.2）');
    inner.appendChild(lbl);

    var row = AW.el('div', '');
    row.style.cssText = 'display:flex;align-items:center;gap:5px;width:max-content;padding:4px 0;';

    ND.web = mkNode('Web服务器', '192.168.1.2');
    var h1 = mkNode('H1', '192.168.1.3');
    var s1 = mkNode('S1', '以太网交换机');
    ND.r2 = mkNode('R2', '外 203.10.2.2 · 内 192.168.1.1', 'NAT');
    var r1 = mkNode('R1', '203.10.2.1 · 203.10.2.5', '上联 Internet');
    ND.r3 = mkNode('R3', '外 203.10.2.6 · 内 192.168.1.1', 'NAT');
    var s2 = mkNode('S2', '以太网交换机');
    ND.h2 = mkNode('H2', '192.168.1.2');
    var h3 = mkNode('H3', '192.168.1.3');

    row.appendChild(ND.web); row.appendChild(h1); row.appendChild(s1); row.appendChild(mkLink());
    row.appendChild(ND.r2); row.appendChild(mkLink('203.10.2.0/30')); row.appendChild(r1);
    row.appendChild(mkLink('203.10.2.4/30')); row.appendChild(ND.r3); row.appendChild(mkLink());
    row.appendChild(s2); row.appendChild(ND.h2); row.appendChild(h3);
    inner.appendChild(row);

    var pWrap = AW.el('div', '');
    pWrap.style.cssText = 'margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;';
    var pTitle = AW.el('div', '', '<b>IP 数据报 P</b>');
    pTitle.style.cssText = 'font-size:13.5px;';
    pWrap.appendChild(pTitle);
    srcBox = AW.el('div', '', '源 IP：？');
    srcBox.style.cssText = 'border:2px solid #5a7d8c66;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;' +
      'font-family:monospace;background:#f8edcb;transition:all .35s;';
    dstBox = AW.el('div', '', '目的 IP：？');
    dstBox.style.cssText = 'border:2px solid #5a7d8c66;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;' +
      'font-family:monospace;background:#f8edcb;transition:all .35s;';
    pWrap.appendChild(srcBox); pWrap.appendChild(dstBox);
    posLabel = AW.el('div', '', '');
    posLabel.style.cssText = 'font-size:12.5px;color:#213e48;font-weight:700;';
    pWrap.appendChild(posLabel);
    inner.appendChild(pWrap);

    var natWrap = AW.el('div', '');
    natWrap.style.cssText = 'margin-top:12px;';
    var natTtl = AW.el('div', 'aw-row-label', '<b>R2 的静态 NAT 转换表</b>（第 1 问的配置）');
    natWrap.appendChild(natTtl);
    var grid = AW.el('div', '');
    grid.style.cssText = 'display:grid;grid-template-columns:100px 74px 110px 74px;gap:4px;width:max-content;';
    ['外网 IP', '外网端口', '内网 IP', '内网端口'].forEach(function(h){
      var c = AW.el('div', '', h);
      c.style.cssText = 'background:#1b3a4b26;border-radius:6px;padding:5px 6px;font-size:11px;font-weight:700;color:#213e48;text-align:center;';
      grid.appendChild(c);
    });
    natCells = [];
    ['203.10.2.2', '80', '192.168.1.2', '80'].forEach(function(v){
      var c = AW.el('div', '', v);
      c.style.cssText = 'border:1.5px solid #5a7d8c66;border-radius:6px;padding:5px 6px;font-size:12px;font-family:monospace;' +
        'text-align:center;background:#fff;opacity:.25;transition:all .35s;';
      grid.appendChild(c);
      natCells.push(c);
    });
    natWrap.appendChild(grid);
    inner.appendChild(natWrap);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'读图', log:'两个局域网各自用私网段 192.168.1.0/24 静态配置；公网侧只有 203.10.2.x。Web 服务器和 H2 的私网地址都是 192.168.1.2', count:0 },
    { cls:'miss',  tag:'矛盾点', log:'H2/H3 想访问 Web 服务器，但 192.168.1.2 是私网地址、不能进公网——必须靠 R2 的公网地址 203.10.2.2 把服务器「暴露」出去', count:0 },
    { cls:'ok',    tag:'第 1 问', log:'在 R2 上配置静态 NAT 端口映射：外网 203.10.2.2:80 ⇄ 内网 192.168.1.2:80（HTTP 默认端口 80）', count:0, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'第 2 问·H2 发出', log:'H2 发 P：源 = 192.168.1.2（自己），目的 = 203.10.2.2（服务器对外的公网地址）', count:1 },
    { cls:'shift', tag:'经过 R3', log:'R3 做源地址替换（源 NAT）：源 192.168.1.2 → 203.10.2.6，目的不变 203.10.2.2', count:2, ribbon:{k:2, ok:true} },
    { cls:'shift', tag:'经过 R2', log:'R2 查静态 NAT 表做目的替换：目的 203.10.2.2 → 192.168.1.2，源保持 203.10.2.6', count:3, ribbon:{k:3, ok:true} },
    { cls:'done',  tag:'完成', log:'三处地址：H2 发出（192.168.1.2 → 203.10.2.2）；过 R3（203.10.2.6 → 203.10.2.2）；过 R2（203.10.2.6 → 192.168.1.2）', count:3, done:true },
  ],

  render: function(stage, sn, i){
    ['web', 'r2', 'r3', 'h2'].forEach(function(k){
      ND[k].style.borderColor = '#586e72';
      ND[k].style.background = '#fff';
      ND[k].style.boxShadow = 'none';
    });
    if(i === 1){ hlNode(ND.web, '#e63946', '#e6394620'); hlNode(ND.h2, '#e63946', '#e6394620'); }
    if(i === 2){ hlNode(ND.r2, '#e07a2f', '#f8edcb'); }
    if(i === 3){ hlNode(ND.h2, '#1b3a4b', '#d9e3df'); }
    if(i === 4){ hlNode(ND.r3, '#e07a2f', '#f8edcb'); }
    if(i >= 5){ hlNode(ND.r2, '#e07a2f', '#f8edcb'); }
    if(i >= 5){ hlNode(ND.web, '#2f9e44', '#f0f7e6'); }

    natCells.forEach(function(c){
      c.style.opacity = (i >= 2) ? 1 : .25;
      c.style.borderColor = (i >= 2) ? '#2f9e44' : '#5a7d8c66';
      c.style.background = (i >= 2) ? '#f0f7e6' : '#fff';
    });

    var src = '源 IP：？', dst = '目的 IP：？', pos = '';
    if(i >= 3){ src = '源 IP：192.168.1.2'; dst = '目的 IP：203.10.2.2'; pos = 'P 从 H2 发出（目的填服务器的公网地址）'; }
    if(i >= 4){ src = '源 IP：203.10.2.6'; pos = 'P 经过 R3 转发后：源被 R3 改写（源 NAT）'; }
    if(i >= 5){ dst = '目的 IP：192.168.1.2'; pos = 'P 经过 R2 转发后：目的按静态映射被改写'; }
    if(i >= 6){ pos = 'P 送达 Web 服务器（三处地址变化完毕）'; }
    srcBox.innerHTML = src; dstBox.innerHTML = dst;
    srcBox.style.background = (i === 3 || i === 4) ? '#f8edcb' : (i >= 6 ? '#2f9e4424' : '#f8edcb');
    srcBox.style.borderColor = (i === 4) ? '#e07a2f' : '#5a7d8c66';
    dstBox.style.background = (i === 3 || i === 5) ? '#f8edcb' : (i >= 6 ? '#2f9e4424' : '#f8edcb');
    dstBox.style.borderColor = (i === 5) ? '#e07a2f' : '#5a7d8c66';
    posLabel.innerHTML = pos;
  },

  result: {
    big: 'R2 静态 NAT：203.10.2.2:80 ⇄ 192.168.1.2:80',
    html: '口诀：<b>R3 出口改源，R2 入口改目的</b>。H2 发出：192.168.1.2 → 203.10.2.2；过 R3：源变 <code>203.10.2.6</code>、目的不变；过 R2：目的变 <code>192.168.1.2</code>、源不变。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
