<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-02 输出受限双端队列</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>一端<b>仅能入队</b>，另一端<b>可入可出</b>；入队顺序固定 <code>1,2,3,4,5</code>。要点：<b>出队只发生在"可入可出"的一端</b>（下称右端），插入可在左、右端任选，出队随时可进行。</p>' },
  { title: '解题策略',
    cls: '',
    body: '<p>出队先后只由元素在队列里"左→右"的相对位置决定。判断"能得到"——给出一组插入端选择即可；判断"不能得到"——找一个<b>必要条件</b>让它不成立。</p>' },
  { title: '验证 A：5,4,3,1,2',
    cls: 'good',
    body: '<p>插入选择：1 右、2 左、3/4/5 右 → 队列（左→右）<code>2,1,3,4,5</code>，右端依次出队 <code>5,4,3,1,2</code> —— <b>能得到</b> ✓。</p>' },
  { title: '验证 B：5,3,1,2,4',
    cls: 'good',
    body: '<p>插入选择：1 右、2 左、3 右、4 左、5 右 → 队列 <code>4,2,1,3,5</code>，出队 <code>5,3,1,2,4</code> —— <b>能得到</b> ✓。</p>' },
  { title: '验证 C：4,2,1,3,5',
    cls: 'good',
    body: '<p>插入选择：1 右、2 右、3 左、4 右、5 左 → 队列 <code>5,3,1,2,4</code>，出队 <code>4,2,1,3,5</code> —— <b>能得到</b> ✓。</p>' },
  { title: '验证 D：4,1,3,2,5',
    cls: 'bad',
    body: '<p>4 第一个出队 ⇒ 1、2、3 都在 4 出队前入队且不能出队 ⇒ 插入完 1,2,3 后队列必须排成 <code>2,3,1</code>（左→右），才能接着出 1、3、2。但按 1→2→3 顺序向两端插入，可达排列只有 <code>1,2,3 / 2,1,3 / 3,1,2 / 3,2,1</code> 四种 —— <code>2,3,1</code> 排不出来，<b>不能得到</b> ✗。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：输出受限双端队列 = 删单端、插两端；"不可能"要靠<b>枚举可达排列</b>来证明，而不是"没试出来"。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '输出受限双端队列：哪个出队序列得不到？',
  subtitle: '一端仅入队 · 另一端可入可出 · 入队序列 <code>1,2,3,4,5</code>',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: 'D 需要 1,2,3 先排成 <code>2,3,1</code>，而两端插入只能得到 <code>123 / 213 / 312 / 321</code> 四种排列。A、B、C 的构造方案见推理卡。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
