<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-08 Dijkstra · dist 数组更新动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
<style>
  .dsvg{width:100%;max-width:620px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .dsvg .dedge line{stroke:#8ba3b0;stroke-width:2.5px;transition:stroke .35s, stroke-width .35s}
  .dsvg .dedge polygon{fill:#8ba3b0;transition:fill .35s}
  .dsvg .dedge .wlabel{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:15px;
    text-anchor:middle;fill:#213e48}
  .dsvg .dvtx circle{fill:#1b3a4b;transition:fill .3s}
  .dsvg .dvtx text{fill:#fff;font-weight:800;font-size:16px;font-family:JetBrains Mono,Menlo,monospace;
    text-anchor:middle;dominant-baseline:central}
  .dsvg .dvtx.src circle{fill:#1b3a4b}
  .dsvg .dvtx.hot circle{fill:#e07a2f}
  .dsvg .dvtx.det circle{fill:#2f9e44}
  .dformula{margin-top:10px;text-align:center;font-size:14.5px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .dformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 2021-08 Dijkstra 求 dist（SVG 图 + dist 数组行） ==================
 * 题：用 Dijkstra 求顶点 1 到其余各顶点最短路径，问「求出第二条最短路径后」
 *     dist[2..5] 的内容。（答案 C = 21, 3, 14, 6）
 * 演示：初始化 → 第一轮确定顶点 3 并松弛 → 第二轮确定顶点 5 并松弛 → 停。 */

var VTX = [
  { id:'1', x:320, y:48,  src:true },
  { id:'5', x:75,  y:180 },
  { id:'2', x:560, y:175 },
  { id:'4', x:185, y:298 },
  { id:'3', x:450, y:298 },
];
var EDGES = [
  { a:'1', b:'5', w:6,  lx:185, ly:95  },
  { a:'1', b:'2', w:26, lx:455, ly:92  },
  { a:'1', b:'3', w:3,  lx:398, ly:160 },
  { a:'5', b:'2', w:15, lx:298, ly:156 },
  { a:'5', b:'4', w:8,  lx:100, ly:237 },
  { a:'5', b:'3', w:6,  lx:240, ly:262 },
  { a:'4', b:'2', w:1,  lx:408, ly:242 },
  { a:'4', b:'3', w:6,  lx:317, ly:322 },
  { a:'3', b:'2', w:22, lx:533, ly:240 },
];
// 每步：cls=顶点类 det=已确定 rel=正在松弛的边 noimp=松弛无效的边 dist=数组值 dcls=格子状态 ptr=格上标注
var STATES = [
  { hot:'', det:[], rel:[], noimp:[], dist:['26','3','∞','6'], dcls:['','','',''], ptr:{}, detSet:'{1}' },
  { hot:'3', det:[], rel:[], noimp:[], dist:['26','3','∞','6'], dcls:['','ok','',''], ptr:{2:'✓ 确定'}, detSet:'{1, 3}' },
  { hot:'', det:[3], rel:['3-2'], noimp:[], dist:['25','3','∞','6'], dcls:['hit','ok','',''], ptr:{1:'3+22=25'}, detSet:'{1, 3}' },
  { hot:'5', det:[3], rel:[], noimp:[], dist:['25','3','∞','6'], dcls:['','ok','','ok'], ptr:{4:'✓ 确定'}, detSet:'{1, 3, 5}' },
  { hot:'', det:[3,5], rel:['5-2'], noimp:[], dist:['21','3','∞','6'], dcls:['hit','ok','','ok'], ptr:{1:'6+15=21'}, detSet:'{1, 3, 5}' },
  { hot:'', det:[3,5], rel:['5-4'], noimp:[], dist:['21','3','14','6'], dcls:['','ok','hit','ok'], ptr:{3:'6+8=14'}, detSet:'{1, 3, 5}' },
  { hot:'', det:[3,5], rel:[], noimp:['5-3'], dist:['21','3','14','6'], dcls:['','ok','','ok'], ptr:{2:'6+6=12 ✗'}, detSet:'{1, 3, 5}' },
  { hot:'', det:[3,5], rel:[], noimp:[], dist:['21','3','14','6'], dcls:['ok','ok','ok','ok'], ptr:{}, detSet:'{1, 3, 5}' },
];
var SNAPS = [
  { cls:'step', tag:'初始化', count:1,
    log:'dist 初值 = 顶点 1 的直接边权：dist[2]=26、dist[3]=3、dist[4]=∞、dist[5]=6；确定集 = {1}。' },
  { cls:'ok', tag:'第 1 轮选最小', count:2, ribbon:{k:1, ok:true},
    log:'未确定顶点中 dist 最小的是<b>顶点 3（= 3）</b>→ 最终确定，第 1 条最短路径 1→3 求出。' },
  { cls:'shift', tag:'松弛顶点 3', count:2,
    log:'用 3 松弛出边 3→2（权 22）：3+22 = 25 &lt; 26 → dist[2] 由 26 更新为 <b>25</b>。此时 dist = 25, 3, ∞, 6。' },
  { cls:'ok', tag:'第 2 轮选最小', count:3, ribbon:{k:2, ok:true},
    log:'未确定顶点中 dist 最小的是<b>顶点 5（= 6）</b>→ 最终确定——<b>第二条最短路径求出</b>，到这里就该停了。' },
  { cls:'shift', tag:'松弛 5→2', count:3,
    log:'5→2（权 15）：6+15 = 21 &lt; 25 → dist[2] 更新为 <b>21</b>。' },
  { cls:'shift', tag:'松弛 5→4', count:3,
    log:'5→4（权 8）：6+8 = 14，原为 ∞ → dist[4] 更新为 <b>14</b>。' },
  { cls:'miss', tag:'松弛 5→3', count:3,
    log:'5→3（权 6）：6+6 = 12 &gt; 3 → dist[3] <b>不变</b>（已确定的更短）。' },
  { cls:'done', tag:'完成', count:3, done:true,
    log:'求出第二条最短路径后：dist = <b>21, 3, 14, 6</b>（对应顶点 2,3,4,5）→ 选 C。' },
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 640 350');
  svg.setAttribute('class', 'dsvg');
  var byId = {};
  VTX.forEach(function(v){ byId[v.id] = v; });
  EDGES.forEach(function(e){
    var A = byId[e.a], B = byId[e.b];
    var dx = B.x - A.x, dy = B.y - A.y, L = Math.sqrt(dx*dx + dy*dy);
    var ux = dx / L, uy = dy / L;
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'dedge');
    g.dataset.id = e.a + '-' + e.b;
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', A.x + ux * 26); ln.setAttribute('y1', A.y + uy * 26);
    ln.setAttribute('x2', B.x - ux * 34); ln.setAttribute('y2', B.y - uy * 34);
    g.appendChild(ln);
    var tipx = B.x - ux * 28, tipy = B.y - uy * 28;
    var bx = tipx - ux * 9, by = tipy - uy * 9;
    var px = -uy, py = ux;
    var ar = document.createElementNS(svgNS, 'polygon');
    ar.setAttribute('points', tipx + ',' + tipy + ' ' + (bx + px*5) + ',' + (by + py*5) + ' ' + (bx - px*5) + ',' + (by - py*5));
    g.appendChild(ar);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', e.lx); t.setAttribute('y', e.ly);
    t.setAttribute('class', 'wlabel');
    t.textContent = e.w;
    g.appendChild(t);
    svg.appendChild(g);
  });
  VTX.forEach(function(v){
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'dvtx' + (v.src ? ' src' : ''));
    g.dataset.id = v.id;
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', v.x); c.setAttribute('cy', v.y); c.setAttribute('r', 22);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', v.x); t.setAttribute('y', v.y);
    t.textContent = v.id;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
  });
  stage.appendChild(svg);
  var dlab = AW.el('div', 'aw-row-label', '<b>dist</b>（顶点 1 → 顶点 2,3,4,5 的当前最短路径长度）');
  dlab.style.textAlign = 'center';
  var holder = AW.el('div', '');
  holder.style.display = 'flex';
  holder.style.justifyContent = 'center';
  stage.appendChild(dlab);
  stage.appendChild(holder);
  var formula = AW.el('div', 'dformula');
  stage.appendChild(formula);
  this._svg = svg; this._holder = holder; this._formula = formula;
}

function render(stage, sn, i){
  var svg = this._svg;
  var st = STATES[Math.min(i, STATES.length - 1)];
  [].forEach.call(svg.querySelectorAll('.dedge'), function(g){
    var ln = g.querySelector('line'), ar = g.querySelector('polygon');
    ln.style.stroke = '#8ba3b0'; ln.style.strokeWidth = '2.5px'; ar.style.fill = '#8ba3b0';
    if(st.rel.indexOf(g.dataset.id) >= 0){
      ln.style.stroke = '#e07a2f'; ln.style.strokeWidth = '5px'; ar.style.fill = '#e07a2f';
    } else if(st.noimp.indexOf(g.dataset.id) >= 0){
      ln.style.stroke = '#e63946'; ln.style.strokeWidth = '3.5px'; ar.style.fill = '#e63946';
    }
  });
  // 最短路径树边：1→3、1→5、5→2、5→4（在相应步骤后染绿）
  var treeEdges = [];
  if(i >= 1 && i < 7){ treeEdges = ['1-3']; }
  if(i >= 3 && i < 7){ treeEdges = ['1-3', '1-5']; }
  if(i >= 7){ treeEdges = ['1-3', '1-5', '5-2', '5-4']; }
  [].forEach.call(svg.querySelectorAll('.dedge'), function(g){
    if(treeEdges.indexOf(g.dataset.id) >= 0){
      var ln = g.querySelector('line'), ar = g.querySelector('polygon');
      ln.style.stroke = '#2f9e44'; ln.style.strokeWidth = '4px'; ar.style.fill = '#2f9e44';
    }
  });
  [].forEach.call(svg.querySelectorAll('.dvtx'), function(g){
    g.classList.remove('hot', 'det');
    if(g.dataset.id === st.hot) g.classList.add('hot');
    if(st.det.indexOf(+g.dataset.id) >= 0) g.classList.add('det');
    if(g.dataset.id === '3' && i >= 1 || g.dataset.id === '5' && i >= 3) g.classList.add('det');
  });
  this._holder.innerHTML = '';
  this._holder.appendChild(AW.cellRow(st.dist, st.dcls, st.ptr, 2));
  var note = '';
  if(i === 0) note = '从源点 1 出发：能直接到的顶点填边权，到不了的填 ∞。';
  else if(i === 1) note = '第一轮：在未确定顶点 {2,3,4,5} 中选 dist 最小者。';
  else if(i === 2) note = '每确定一个顶点，必须立刻用它松弛其所有出边。';
  else if(i === 3) note = '<b>第二条最短路径求出（顶点 5 确定）——题目问的是这一步之后的 dist。</b>';
  else if(i === 4) note = '第二轮松弛 1/3：5→2 更新为 21。';
  else if(i === 5) note = '第二轮松弛 2/3：5→4 从 ∞ 更新为 14。';
  else if(i === 6) note = '第二轮松弛 3/3：5→3 无改善，dist 不变。';
  else note = '<b>dist = 21, 3, 14, 6 → 选 C。</b>';
  this._formula.innerHTML = '已确定：' + st.detSet + '　｜　' + note;
}

AW.init({
  title: '2021-08 Dijkstra：求出第二条最短路径后的 dist',
  subtitle: '与题图一致的有向图：1→5(6) 1→2(26) 1→3(3) 5→2(15) 5→4(8) 5→3(6) 4→2(1) 4→3(6) 3→2(22)——问「第二条最短路径求出后」dist[2..5] 的内容',
  counterLabel: '已确定顶点数',
  ribbonTitle: '轮次（✓ 确定一个顶点）',
  intro: '点击「▶ 播放」跑前两轮 Dijkstra：选最小 → 松弛。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: 'dist = 21, 3, 14, 6　（选 C）',
    html: '两轮就停：第一轮确定<b>顶点 3</b>（dist=3）→ 用 3 松弛：3+22=25 &lt; 26，dist[2]: 26→25；第二轮确定<b>顶点 5</b>（dist=6，即第二条最短路径求出）→ 用 5 松弛：6+15=21&lt;25，dist[2]: 25→<b>21</b>；6+8=14，dist[4]: ∞→<b>14</b>；5→3 无改善。干扰项：<b>B(25,…)</b> 只做完第一轮就停；<b>A(26,…)</b> 忘了用顶点 3 松弛；<b>D(15,…)</b> 把第三轮（确定 4 后 14+1=15）也算上——<b>多算一轮</b>。记忆锚点：<code>Dijkstra 每确定一个顶点必须松弛其出边；「第 k 条最短路径求出」= 第 k 轮选最小完成时</code>。',
  },
});
</script>
<script>/* aw-ok */</script>
</body>
</html>
