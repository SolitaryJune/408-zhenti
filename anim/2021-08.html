<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-08 Dijkstra 的 dist 数组</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// dist 数组一行：vals=四个值 cls=类 ptrs=上方标注（下标显示"顶点2..5"）
function distRow(vals, cls, ptrs){
  var h = '<div class="aw-cells">';
  vals.forEach(function(v, i){
    h += '<div class="aw-col"><div class="aw-ptr">' + ((ptrs && ptrs[i]) || '') + '</div>' +
         '<div class="aw-box' + (cls && cls[i] ? ' ' + cls[i] : '') + '">' + v + '</div>' +
         '<div class="aw-idx">顶点' + (i + 2) + '</div></div>';
  });
  return h + '</div>';
}
function stage8(vals, cls, ptrs, note){
  return '<div class="aw-scroll"><div class="aw-row-label"><b>dist</b>（顶点 1 到 2,3,4,5 的当前最短路径长度）</div>' +
    distRow(vals, cls, ptrs) +
    (note ? '<div style="font-size:13.5px;color:#334155;line-height:1.8;margin-top:10px">' + note + '</div>' : '') +
    '</div>';
}

AW.init({
  title: 'Dijkstra：求出第二条最短路径后的 dist',
  subtitle: '边：1→5(6) 1→2(26) 1→3(3) 5→2(15) 5→4(8) 5→3(6) 4→2(1) 4→3(6) 3→2(22)',
  counterLabel: '已确定顶点数',
  intro: '点击「▶ 播放」逐步执行 Dijkstra 的两轮选择与松弛。',

  snaps: [
    { cls:'step', tag:'初始化', log:'dist 初值 = 顶点 1 的直接边权：26, 3, ∞, 6（顶点 4 无直接边）', count:0,
      html: stage8(['26','3','∞','6'], [], [], '从顶点 1 出发。') },

    { cls:'ok', tag:'确定 3', log:'未确定顶点中 dist 最小的是顶点 3（=3）→ 第 1 条最短路径 1→3 确定', count:1,
      html: stage8(['26','3','∞','6'], ['','hit','',''], ['','','确定',''], '第一轮选最小：顶点 3 的 dist=3 最小，最终确定。') },

    { cls:'shift', tag:'松弛', log:'用 3 松弛：3→2 权 22，3+22=25 < 26 → dist[2]=25', count:1,
      html: stage8(['25','3','∞','6'], ['hit','ok','',''], ['', '', '', ''],
        '顶点 3 的邻边只有 3→2（22）：3+22=25，比 26 小，更新。此时 dist = 25, 3, ∞, 6。') },

    { cls:'ok', tag:'确定 5', log:'未确定顶点中 dist 最小的是顶点 5（=6）→ 第 2 条最短路径 1→5 确定', count:2,
      html: stage8(['25','3','∞','6'], ['','ok','','hit'], ['','','','确定'], '第二轮选最小：顶点 5 的 dist=6（∞ 和 25 都比它大），最终确定——<b>第二条最短路径求出</b>。') },

    { cls:'shift', tag:'松弛', log:'用 5 松弛：5→2：6+15=21<25 → dist[2]=21；5→4：6+8=14（原 ∞）；5→3：6+6=12>3 不变', count:2,
      html: stage8(['21','3','14','6'], ['hit','ok','hit','ok'], ['','','',''],
        '顶点 5 的三条出边全部松弛：21、14 入表，12 > 3 不动。') },

    { cls:'done', tag:'完成', log:'求出第二条最短路径后：dist = 21,3,14,6 → 答案 C', count:2, done:true,
      html: stage8(['21','3','14','6'], ['ok','ok','ok','ok'], [], '<b>dist = 21, 3, 14, 6</b>（对应顶点 2,3,4,5）。') },
  ],

  result: {
    big: 'dist = 21,3,14,6（答案 C）',
    html: '两轮就停：确定 3 → 松弛；确定 5 → 松弛。干扰项：B（25,…）只做完第一轮；A（26,…）忘了用顶点 3 松弛 dist[2]；D（15,…）是接着把顶点 4 也确定了（第三轮 14+1=15）——<b>多算了一轮</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
