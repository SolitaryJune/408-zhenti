<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-09 3 阶 B 树结点数上限</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function bnode(cx, cy, keys, c, cap){
  var w = keys === 2 ? 66 : 40, h = 34;
  var fill = '#fff', st = '#586e72', op = 1, tc = '#1b3a4b';
  if(c === 'ok'){ fill = '#2f9e4424'; st = '#2f9e44'; }
  else if(c === 'key'){ fill = '#f8edcb'; st = '#e07a2f'; }
  else if(c === 'dim'){ op = 0.35; }
  var txt = keys === 2 ? 'k│k' : 'k';
  var s = '<g opacity="'+op+'"><rect x="'+(cx-w/2)+'" y="'+(cy-h/2)+'" width="'+w+'" height="'+h+'" rx="8" fill="'+fill+'" stroke="'+st+'" stroke-width="2.4"/>' +
    '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="14" font-weight="700" font-family="Menlo,monospace" fill="'+tc+'">'+txt+'</text></g>';
  if(cap) s += '<text x="'+cx+'" y="'+(cy+h/2+15)+'" text-anchor="middle" font-size="11.5" fill="#586e72">'+cap+'</text>';
  return s;
}
function bline(p, q){
  return '<line x1="'+p[0]+'" y1="'+(p[1]+18)+'" x2="'+q[0]+'" y2="'+(q[1]-18)+'" stroke="#5a7d8c66" stroke-width="2.4"/>';
}
function layerLabel(y, t){
  return '<text x="14" y="'+y+'" font-size="12.5" fill="#b9cbd0" font-weight="700">'+t+'</text>';
}
function svg9(rootKeys, kids, leaves, note){
  var s = '<div class="aw-scroll"><svg width="480" height="268" viewBox="0 0 480 268" style="max-width:100%;background:#fff;border:1px solid #1b3a4b26;border-radius:12px">';
  s += layerLabel(46, '第1层') + layerLabel(126, '第2层') + layerLabel(216, '第3层');
  if(kids){
    var kidPos = [[110,122],[240,122],[370,122]];
    kidPos.forEach(function(k){ s += bline([240,42], k); });
  }
  if(leaves){
    var kidPos2 = [[110,122],[240,122],[370,122]];
    var leafPos = [[55,212],[115,212],[175,212],[210,212],[270,212],[340,212],[400,212]];
    kidPos2.forEach(function(k){
      var n = k[0] === 110 ? 3 : 2;
      var group = k[0] === 110 ? [0,1,2] : (k[0] === 240 ? [3,4] : [5,6]);
      group.forEach(function(gi){ s += bline(k, leafPos[gi]); });
    });
  }
  if(rootKeys != null) s += bnode(240, 42, rootKeys, 'key', '根');
  if(kids){
    s += bnode(110, 122, 2, 'key', '2 个关键字');
    s += bnode(240, 122, 1, 'key', '1 个');
    s += bnode(370, 122, 1, 'key', '1 个');
  }
  if(leaves){
    [[55],[115],[175],[210],[270],[340],[400]].forEach(function(p){ s += bnode(p[0], 212, 1, 'ok', ''); });
  }
  s += '</svg></div>';
  if(note) s += '<div style="font-size:13.5px;color:#213e48;line-height:1.8;margin-top:8px">' + note + '</div>';
  return s;
}
function ruleCard9(){
  return '<div style="font-size:14.5px;line-height:2;color:#213e48;background:#fffbeb;border:1px solid #e07a2f;border-radius:12px;padding:12px 16px">' +
    'm 阶 B 树：每结点子树数 ≤ <b>m</b>、关键字数 ≤ <b>m−1</b>，且 <b>子树数 = 关键字数 + 1</b>。<br>' +
    '本题 m = 3：每结点 ≤ <b>3</b> 棵子树、≤ <b>2</b> 个关键字；高度 3（根为第 1 层），第 2 层共 <b>4 个关键字</b>。</div>';
}

AW.init({
  title: '高度为 3 的 3 阶 B 树：结点最多几个？',
  subtitle: '根为第 1 层 · 第 2 层有 <code>4 个关键字</code> · 求结点数上限',
  counterLabel: '结点数',
  intro: '点击「▶ 播放」逐层搭建结点数最多的形态。',

  snaps: [
    { cls:'step', tag:'约束', log:'3 阶 B 树：每结点 ≤3 棵子树、≤2 个关键字，且子树数 = 关键字数 + 1', count:0,
      html: ruleCard9() },

    { cls:'step', tag:'第 1 层', log:'第 1 层：根装满 2 个关键字 → 根有 3 棵子树，即第 2 层最多 3 个结点', count:1,
      html: svg9(2, null, null, '根 2 个关键字 → 2+1 = <b>3</b> 棵子树。第 2 层结点数上限 = 3。') },

    { cls:'step', tag:'第 2 层', log:'第 2 层 3 个结点，4 个关键字分配为 2+1+1（每结点 ≤2 个）', count:4,
      html: svg9(2, true, null, '4 = 2 + 1 + 1，正好装进 3 个结点——这是使总结点最多的摆法。') },

    { cls:'ok', tag:'第 3 层', log:'子树数 = 关键字数 + 1 → 3、2、2 棵，合计 7 棵 → 第 3 层最多 7 个结点', count:11,
      html: svg9(2, true, true, '子树数 = 关键字数 + 1：2+1=3 棵、1+1=2 棵、1+1=2 棵，合计 <b>3+2+2 = 7</b>。') },

    { cls:'ok', tag:'合计', log:'合计：1（根）+ 3（第 2 层）+ 7（第 3 层）= 11 个结点', count:11,
      html: svg9(2, true, true, '1 + 3 + 7 = <b>11</b> 个结点。') },

    { cls:'done', tag:'完成', log:'结点个数最多 11 个 → 答案 A', count:11, done:true,
      html: svg9(2, true, true, '<b>最多 11 个结点 → 答案 A</b>。') },
  ],

  result: {
    big: '11 个（答案 A）',
    html: '上限形态：根 2 关键字 → 第 2 层 <b>3</b> 个结点（关键字 2+1+1）→ 子树 3+2+2 = <b>7</b> 棵 → 第 3 层 7 个结点，合计 1+3+7 = 11。若第 2 层只放 2 个结点（2+2），只有 1+2+6 = 9 个（干扰 C）——别忘了"子树数 = 关键字数 + 1"。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
