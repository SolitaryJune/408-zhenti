<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-12 PFLOPS 量级换算</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { cls: 'key', title: '审题眼：考点是 FLOPS 词头换算',
    body: '<p>题干只给了一个数：<code>93.0146 PFLOPS</code>（2017 年 TOP500 榜首"神威·太湖之光"的浮点运算速度）。它表示<b>每秒完成的浮点操作次数</b>，问"约为多少次"——考的就是词头 <code>P</code> 对应的数量级与中文说法。</p>' },
  { cls: '', title: '词头阶梯：P 排在第 5 级',
    body: '<p><code>K = 10^3</code> → <code>M = 10^6</code> → <code>G = 10^9</code> → <code>T = 10^12</code> → <code>P = 10^15</code> → <code>E = 10^18</code>。</p>' +
      '<p>P（Peta）= <b>10 的 15 次方</b>，中文说法"千万亿"。注意：10 的 12 次方是 T（Tera），不是 P。</p>' },
  { cls: '', title: '换算：93.0146 P = 9.3 × 10^16',
    body: '<p>93.0146 PFLOPS = 93.0146 × 10<sup>15</sup> 次/秒，把系数规范化：= <b>9.30146 × 10<sup>16</sup></b> ≈ <b>9.3 × 10<sup>16</sup></b> 次/秒。</p>' },
  { cls: 'good', title: '对应中文量级：亿亿 = 10^16',
    body: '<p>"亿" = 10<sup>8</sup>，所以"亿亿" = 10<sup>16</sup>。9.3 × 10<sup>16</sup> = <b>9.3 亿亿次</b>——与选项 D 完全吻合。</p>' },
  { cls: 'bad', title: '排除 B、C：它们是同一个错数',
    body: '<p>选项 C "9.3 千万亿次" = 9.3 × 10<sup>15</sup>；选项 B "9.3 × 10<sup>15</sup> 次"——两者是<b>同一个数</b>！都相当于把 93.0146 P 看成了 9.3 P，整整缩小了 10 倍。</p>' },
  { cls: 'bad', title: '排除 A：差了 3 个数量级',
    body: '<p>9.3 × 10<sup>13</sup> 次 = 93 × 10<sup>12</sup> = 93 <b>TFLOPS</b>——这是把词头 P 错当成 T 的结果，比真实值小 1000 倍。</p>' },
  { cls: 'good', title: '结论',
    body: '<p>93.0146 PFLOPS ≈ <b>9.3 × 10<sup>16</sup> 次/秒 = 9.3 亿亿次</b>，选 <b>D</b>。</p>' +
      '<p>记忆锚点：<b>P = 10 的 15 次方（千万亿）</b>；93 P ≈ 9.3 亿亿次；B、C 是同一个数，A 是把 P 记成 T 的产物。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : 'step')),
    tag: last ? '完成' : '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2021-12 · 93.0146 PFLOPS 是每秒多少次浮点操作',
  subtitle: '考点：FLOPS 词头换算 · P = 10<sup>15</sup> · 选项逐项推演',
  counterLabel: '推演步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（9.3 亿亿次）',
    html: '记忆锚点：<b>P = 10 的 15 次方（千万亿）</b>；93.0146 P = 9.3 × 10<sup>16</sup> = 9.3 亿亿次。<br>' +
      '干扰项：B 与 C 是同一个数（9.3 × 10<sup>15</sup>，少了 10 倍）；A 把 P 记成了 T（10<sup>12</sup>）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
