<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-16 直接映射 Cache 行位数</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var TAG_CSS   = 'border-color:#e07a2f;background:#f8edcb;color:#92400e;';
var IDX_CSS   = 'border-color:#1b3a4b;background:#d9e3df;color:#1b3a4b;';
var OFF_CSS   = 'border-color:#2f9e44;background:#2f9e4424;color:#1e4d33;';
var Q_CSS     = 'border-color:#5a7d8c66;background:#f8edcb;color:#b9cbd0;';

// paint: 'none' | 'off' | 'offIdx' | 'all' —— 32 位主存地址按字段点亮
function stylesFor(paint){
  var out = [], i;
  for (i = 0; i < 32; i++){
    if (paint === 'none') out.push('');
    else if (i < 17) out.push(paint === 'all' ? TAG_CSS : '');
    else if (i < 17 + 10) out.push((paint === 'offIdx' || paint === 'all') ? IDX_CSS : '');
    else out.push(paint === 'none' ? '' : OFF_CSS);
  }
  return out;
}

function bitRow(styles){
  var row = AW.el('div', 'aw-cells');
  for (var i = 0; i < 32; i++){
    var col = AW.el('div', 'aw-col');
    col.style.width = '26px';
    var box = AW.el('div', 'aw-box', '');
    box.style.cssText = 'width:24px;height:34px;border-radius:6px;' + (styles && styles[i] ? styles[i] : Q_CSS);
    col.appendChild(box);
    col.appendChild(AW.el('div', 'aw-idx', i === 0 ? 'b31' : (i === 31 ? 'b0' : '')));
    row.appendChild(col);
  }
  return row;
}

function segBar(paint){
  function seg(w, on, bd, bg, colr, txt){
    var d = AW.el('div', '', txt);
    d.style.cssText = 'width:' + w + 'px;height:28px;display:flex;align-items:center;justify-content:center;' +
      'font-size:12px;font-weight:700;border-radius:8px;border:2px solid ' + (on ? bd : '#5a7d8c66') +
      ';background:' + (on ? bg : '#f8edcb') + ';color:' + (on ? colr : '#b9cbd0') + ';';
    return d;
  }
  var bar = AW.el('div', '');
  bar.style.cssText = 'display:flex;gap:6px;width:max-content;margin:2px 0 6px;';
  bar.appendChild(seg(504, paint === 'all', '#e07a2f', '#f8edcb', '#92400e', 'Tag 标记 17 位（b31～b15）'));
  bar.appendChild(seg(294, paint === 'offIdx' || paint === 'all', '#1b3a4b', '#d9e3df', '#1b3a4b', '行号 10 位（b14～b5）'));
  bar.appendChild(seg(144, paint !== 'none', '#2f9e44', '#2f9e4424', '#1e4d33', '块内地址 5 位'));
  return bar;
}

function noteCard(html, cls){
  return AW.el('div', 'aw-stepcard ' + (cls || 'key'), '<p>' + html + '</p>');
}

function render(stage, sn){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var inner = AW.el('div', '');
  inner.style.minWidth = '880px';
  inner.appendChild(AW.el('div', 'aw-row-label', '<b>32 位主存地址</b>（按字节编址）的字段划分'));
  inner.appendChild(bitRow(sn.styles));
  inner.appendChild(segBar(sn.paint));
  if (sn.compose) {
    var c = AW.el('div', 'aw-stepcard ' + (sn.composeCls || 'key'), sn.compose);
    c.style.maxWidth = '560px';
    inner.appendChild(c);
  }
  wrap.appendChild(inner);
  stage.appendChild(wrap);
}

AW.init({
  title: '2021-16 · 直接映射 Cache 的一行至少多少位',
  subtitle: '主存地址 32 位 · 按字节编址 · Cache 数据区 32KB · 块 32B · 直接映射 · <b>回写法</b>',
  counterLabel: '推演步',
  ribbonTitle: '选项核对（✓ 成立 / ✗ 排除）',
  intro: '点击「▶ 播放」：先切地址字段，再拼一行。',
  render: render,
  snaps: [
    { cls: 'step', tag: '开始', count: 0, paint: 'none', styles: stylesFor('none'),
      log: '直接映射 Cache：32 位主存地址切成 Tag + 行号 + 块内地址；一行 = 数据区 + Tag + 控制位。',
      note: '先把 32 位地址分干净，再数一行里存了什么。' },
    { cls: 'shift', tag: '块内地址', count: 1, paint: 'off', styles: stylesFor('off'),
      log: '块大小 32B：2 的 5 次方 = 32 → 块内地址 5 位（b4～b0）。',
      note: '块内地址 = <b>log<sub>2</sub>32B = 5 位</b>。' },
    { cls: 'shift', tag: '行号', count: 2, paint: 'offIdx', styles: stylesFor('offIdx'),
      log: '行数 = Cache 数据区 32KB ÷ 32B = 1024 行 → 行号 10 位（b14～b5）。直接映射下每块只能去这一行。',
      note: '1024 = 2<sup>10</sup> → 行号 <b>10 位</b>。' },
    { cls: 'shift', tag: 'Tag 标记', count: 3, paint: 'all', styles: stylesFor('all'),
      log: 'Tag = 32 − 10 − 5 = 17 位（b31～b15），用来区分这行装的是主存哪一块。',
      note: 'Tag = <b>17 位</b>，直接映射也不能省。' },
    { cls: 'step', tag: '数据区', count: 4, paint: 'all', styles: stylesFor('all'),
      log: '一行的数据区存整块：32B × 8 = 256 位。',
      compose: '数据区 = <b>32B × 8 = 256 位</b>。' },
    { cls: 'step', tag: '控制位', count: 5, paint: 'all', styles: stylesFor('all'),
      log: '有效位 1 位（行里是否装了块）；回写法还有脏位 1 位——块被改后不立即写回主存，要靠它标记"待写回"。',
      compose: '控制位：有效位 <b>1</b> + 脏位 <b>1</b>（回写法专属）。' },
    { cls: 'ok', tag: '合计', count: 6, paint: 'all', styles: stylesFor('all'),
      log: '一行位数 = 256（数据）+ 17（Tag）+ 1（有效）+ 1（脏）= 275 位 → 选项 A。',
      compose: '<b>256 + 17 + 1 + 1 = 275 位</b> → 选 A ✓', composeCls: 'good',
      ribbon: { k: 1, ok: true } },
    { cls: 'miss', tag: '排除 B', count: 7, paint: 'all', styles: stylesFor('all'),
      log: '274 = 275 − 1：漏了脏位。回写法必须有脏位；写直达法才可以不要它。',
      compose: '274 位是<b>漏脏位</b>的结果 ✗',
      ribbon: { k: 2, ok: false } },
    { cls: 'miss', tag: '排除 C、D', count: 8, paint: 'all', styles: stylesFor('all'),
      log: '258 = 256 + 1 + 1、257 = 256 + 1：都丢了 17 位 Tag——没有 Tag，直接映射无法判断装的是哪一块。',
      compose: '258 / 257 位是<b>丢 Tag</b> 的结果 ✗',
      ribbon: { k: 3, ok: false } },
    { cls: 'done', tag: '完成', count: 9, paint: 'all', styles: stylesFor('all'),
      log: '地址切分 17+10+5，行 = 256 + 17 + 1 + 1 = 275 位。',
      compose: '结论：Cache 行至少 <b>275 位</b>，选 A。', composeCls: 'good', done: true },
  ],
  result: {
    big: '答案 A（275 位）',
    html: '地址切分：<code>Tag 17 | 行号 10 | 块内 5</code>；一行 = 数据 <b>256</b> + Tag <b>17</b> + 有效 <b>1</b> + 脏 <b>1</b> = <b>275 位</b>。<br>' +
      '回写法必须有脏位（漏掉得 274 = B）；直接映射也要 Tag（丢掉得 258/257 = C/D）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
