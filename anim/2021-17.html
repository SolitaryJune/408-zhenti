<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-17 汇编程序员可见的寄存器</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { cls: 'key', title: '审题眼：什么叫"程序员可见"',
    body: '<p>四个候选：Ⅰ 指令寄存器、Ⅱ 微指令寄存器、Ⅲ 基址寄存器、Ⅳ 标志/状态寄存器。</p>' +
      '<p>判断标准：<b>程序员能通过指令访问它，或它的内容影响程序执行</b> → 可见；CPU 内部为取指、控制服务的寄存器 → 不可见（透明）。</p>' },
  { cls: 'bad', title: 'Ⅰ 指令寄存器 IR：不可见',
    body: '<p>IR 存放<b>当前正在执行的指令</b>，由取指部件在取指周期自动装入。汇编程序员没有任何办法指定或读出 IR 的内容 → <b>不可见</b>。</p>' },
  { cls: 'bad', title: 'Ⅱ 微指令寄存器：不可见',
    body: '<p>微指令寄存器是<b>微程序控制器内部</b>的部件，存放的是实现机器指令的微指令，属于 CPU 的实现细节，对汇编程序员完全透明 → <b>不可见</b>。</p>' },
  { cls: 'good', title: 'Ⅲ 基址寄存器：可见',
    body: '<p>基址寻址：<code>EA = 基址 + 偏移量</code>，汇编指令里直接引用基址寄存器（如 8086 的 <code>BX</code>）。它通常由操作系统设置，但寄存器本身<b>在指令中出现、程序员能感知</b> → <b>可见</b>。</p>' },
  { cls: 'good', title: 'Ⅳ 标志/状态寄存器：可见',
    body: '<p>条件转移指令（如为零则转移）要<b>测试零、进位、溢出等标志位</b>来决定程序走向——程序员不直接读写它，但它的内容直接影响程序行为 → <b>可见</b>。</p>' },
  { cls: 'good', title: '结论',
    body: '<p>仅Ⅲ、Ⅳ可见 → 选 <b>D</b>。</p>' +
      '<p>记忆锚点：可见的有通用寄存器、PC（转移指令改变它）、基址/变址寄存器、标志寄存器；<b>IR、MAR、MDR、微指令寄存器</b>等 CPU 内部工作寄存器都不可见。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : 'step')),
    tag: last ? '完成' : '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2021-17 · 哪些寄存器汇编程序员可见',
  subtitle: '考点：程序员可见性 · Ⅰ 指令寄存器 Ⅱ 微指令寄存器 Ⅲ 基址寄存器 Ⅳ 标志/状态寄存器',
  counterLabel: '推演步',
  intro: '点击「▶ 播放」逐项判定。',
  snaps: snaps,
  result: {
    big: '答案 D（仅Ⅲ、Ⅳ）',
    html: '记忆锚点：<b>可见 = 指令能引用或影响程序行为</b>：通用寄存器、PC、基址/变址寄存器、标志寄存器；<br>' +
      '<b>不可见 = CPU 内部工作寄存器</b>：IR（自动装入）、MAR/MDR、微指令寄存器（控制器内部）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
