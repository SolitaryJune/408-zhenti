<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-18 数据通路的叙述辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { cls: 'key', title: '审题眼：找"错误"的那一项',
    body: '<p>数据通路 = 数据在 CPU 内流动的<b>路径与部件</b>。题中 A、B、C、D 四句话，要挑出与事实相反的一句。</p>' },
  { cls: 'good', title: 'A 对：ALU 是组合逻辑元件',
    body: '<p>ALU、多路选择器、加法器等属于<b>组合逻辑（操作）元件</b>：无记忆，输出只由当拍输入决定。它们就是数据通路的核心部件 → A 说法正确。</p>' },
  { cls: 'good', title: 'B 对：寄存器是时序逻辑元件',
    body: '<p>通用寄存器、PC、IR 等属于<b>时序逻辑（状态）元件</b>：有时钟控制、能保存状态。它们也是数据通路的组成部分 → B 说法正确。</p>' },
  { cls: 'bad', title: 'C 错：数据通路包含异常检测电路',
    body: '<p>"数据通路<b>不包含</b>异常事件检测及响应的电路"——与事实相反！<b>溢出判断、除零检测</b>等异常检测电路就放在运算通路里，先"检出"异常，再交给控制逻辑转成内中断（异常）处理 → C 说法<b>错误</b>，本题答案。</p>' },
  { cls: 'good', title: 'D 对：控制信号指挥数据流',
    body: '<p>数据走哪条路由<b>控制信号</b>决定：多路选择器的选择端、寄存器的写使能等。通路提供路径，控制信号决定当拍数据怎么流 → D 说法正确。</p>' },
  { cls: 'good', title: '结论',
    body: '<p>错误叙述是 <b>C</b>：数据通路<b>包含</b>异常事件检测及响应的电路。</p>' +
      '<p>记忆锚点：数据通路 = 组合逻辑元件 + 时序状态元件 + <b>异常检测电路</b>；流动方向由控制信号指挥。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : 'step')),
    tag: last ? '完成' : '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2021-18 · 关于数据通路，哪句说错了',
  subtitle: '考点：数据通路的组成（组合元件 / 状态元件 / 异常检测电路 / 控制信号）',
  counterLabel: '推演步',
  intro: '点击「▶ 播放」逐项核对。',
  snaps: snaps,
  result: {
    big: '答案 C（其说法错误）',
    html: '记忆锚点：数据通路<b>包含</b>异常事件检测电路（溢出判断、除零检测等），检测结果交给控制逻辑转成异常处理。<br>' +
      'A（ALU 组合元件）、B（寄存器状态元件）、D（控制信号指挥流动）都是正确叙述。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
