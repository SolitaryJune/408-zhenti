<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-19 总线叙述辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { cls: 'key', title: '审题眼：找"错误"的总线叙述',
    body: '<p>四个候选：A 总线的本质、B 同步定时、C 异步握手、D 突发传送。要挑出与事实相反的一句。</p>' },
  { cls: 'good', title: 'A 对：总线是公共传输介质',
    body: '<p>总线是连接多个部件的<b>公共传输介质</b>，各部件分时共享，在两个或多个部件之间交换信息 → A 说法正确。</p>' },
  { cls: 'good', title: 'B 对：同步总线按时钟定时',
    body: '<p>同步总线由<b>统一时钟信号</b>定时，各部件在固定时刻动作。但"时钟频率"≠"工作频率"：总线工作频率可由时钟分频/倍频得到，<b>二者不一定相等</b> → B 说法正确。</p>' },
  { cls: 'bad', title: 'C 错：一次握手不是"一位数据"',
    body: '<p>前半句对：异步总线由<b>握手信号</b>（请求—应答）定时。后半句错：一次握手完成的是<b>一次完整的数据传送（一个字或一块）</b>，不是一位数据——逐位握手开销无法接受 → C 说法<b>错误</b>，本题答案。</p>' },
  { cls: 'good', title: 'D 对：突发传送连传多个数据',
    body: '<p>突发（Burst）传送总线事务：给出一个<b>首地址</b>后，在总线上<b>连续传送多个数据</b>，后续地址自动增量，省去重复地址事务 → D 说法正确。</p>' },
  { cls: 'good', title: '结论',
    body: '<p>错误叙述是 <b>C</b>：握手管的是"一次数据传送"，不是"一位数据"。</p>' +
      '<p>记忆锚点：<b>同步看时钟，异步看握手</b>；握手以整个数据传送为单位；突发 = 一个地址 + 多个连续数据。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : 'step')),
    tag: last ? '完成' : '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2021-19 · 关于总线，哪句说错了',
  subtitle: '考点：总线本质 · 同步/异步定时 · 突发传送',
  counterLabel: '推演步',
  intro: '点击「▶ 播放」逐项核对。',
  snaps: snaps,
  result: {
    big: '答案 C（其说法错误）',
    html: '记忆锚点：异步总线由握手信号定时<b>没错</b>，但一次握手对应<b>一次完整数据传送</b>（一个字/一块），不是一位数据。<br>' +
      '突发（Burst）= 一个首地址 + 总线上连续传送多个数据。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
