<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-20 哪个不属于 I/O 接口</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { cls: 'key', title: '审题眼：接口 ≠ 设备',
    body: '<p>I/O <b>接口</b>：主机与外设之间的交接界面——做速度匹配、信号/格式转换，内有数据、状态、控制寄存器供 CPU 访问。<br>I/O <b>设备</b>：信息输入输出的实体本身。<br>经验法则："适配器 / 控制器"多为接口，"驱动器"是设备本体。</p>' },
  { cls: 'bad', title: 'A 磁盘驱动器：是设备，不是接口',
    body: '<p>磁盘驱动器 = 盘片 + 磁头 + 驱动机构，是<b>磁盘存储设备的本体</b>，直接执行读写动作；它要经磁盘接口/控制器才能与主机交换信息 → <b>不属于 I/O 接口</b>，本题答案。</p>' },
  { cls: 'good', title: 'B 打印机适配器：属于接口',
    body: '<p>"适配器"就是接口卡的另一种叫法：主机一侧与打印机交接的界面电路 → <b>属于 I/O 接口</b>。</p>' },
  { cls: 'good', title: 'C 网络控制器：属于接口',
    body: '<p>网络控制器（网卡）是主机与网络之间的接口部件，完成帧的收发、格式转换 → <b>属于 I/O 接口</b>。</p>' },
  { cls: 'good', title: 'D 可编程中断控制器：属于接口',
    body: '<p>可编程中断控制器（如 8259A）是<b>独立于 CPU 的接口芯片</b>：汇集并管理外设中断请求，CPU 通过总线访问它 → <b>属于 I/O 接口</b>。</p>' },
  { cls: 'good', title: '结论',
    body: '<p>不属于 I/O 接口的是 <b>A 磁盘驱动器</b>。</p>' +
      '<p>记忆锚点：直接面对物理介质、执行动作的是"设备"；插在主机一侧做信息交接的是"接口"。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var last = i === STEPS.length - 1;
  return {
    cls: last ? 'done' : (s.cls === 'good' ? 'ok' : (s.cls === 'bad' ? 'miss' : 'step')),
    tag: last ? '完成' : '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: last,
  };
});

AW.init({
  title: '2021-20 · 谁是 I/O 接口，谁是 I/O 设备',
  subtitle: '考点：I/O 接口与 I/O 设备的区分',
  counterLabel: '推演步',
  intro: '点击「▶ 播放」逐项判定。',
  snaps: snaps,
  result: {
    big: '答案 A（磁盘驱动器不是接口）',
    html: '记忆锚点：磁盘驱动器是<b>设备本体</b>（盘片+磁头+驱动机构），要经接口才能连主机；<br>' +
      '打印机<b>适配器</b>、网络<b>控制器</b>（网卡）、可编程<b>中断控制器</b>（8259A）都是主机一侧的接口部件。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
