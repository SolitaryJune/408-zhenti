<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-23 · 只能在内核态执行的指令</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：特权指令的判据', cls: 'key',
    body: '<p>问的是"只能在<b>内核态</b>执行"的指令。判据不是指令是否少见，而是：<b>一旦被用户程序滥用，会不会破坏系统或侵犯其他进程</b>。直接操纵硬件、影响全局的指令必须收归内核态。</p>' },
  { title: '选项 A：trap 指令 ✗', cls: 'bad',
    body: '<p>trap（访管/陷入）指令：用户程序靠它<b>发起系统调用</b>、从用户态进入内核态。它是"进入内核的门"，门槛本身在门外——用户态完全可以执行。<b>不是特权指令</b>。</p>' },
  { title: '选项 B：I/O 指令 ✓', cls: 'good',
    body: '<p>I/O 指令直接驱动设备。若用户态可用，任何程序都能绕过操作系统随意读写设备、破坏系统。<b>只能在内核态执行</b>——这就是本题要找的答案。</p>' },
  { title: '选项 C：数据传送指令 ✗', cls: 'bad',
    body: '<p>在寄存器与内存之间搬数据的普通指令，用户程序每条语句都在用，不威胁系统全局。<b>不是特权指令</b>。</p>' },
  { title: '选项 D：设置断点指令 ✗', cls: 'bad',
    body: '<p>用于程序调试，断点处的陷入<b>处理</b>由系统接管（内核态），但"下断点"这条指令本身用户态就能执行。<b>不是特权指令</b>。</p>' },
  { title: '结论：答案 B', cls: 'good',
    body: '<p>四项中只有 I/O 指令必须由内核代劳，答案选 <b>B</b>。记忆锚点：I/O、开/关中断、置时钟、清内存这类"碰硬件、动全局"的指令都是特权指令。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '只能在内核态执行的指令（2021-23）',
  subtitle: '考点：特权指令判据 · trap / I/O / 数据传送 / 设置断点 逐项辨析',
  counterLabel: '已辨析',
  ribbonTitle: '选项（✓ 正确答案 / ✗ 干扰项）',
  intro: '点击「▶ 播放」逐项检验四个选项。',
  snaps: [{ cls: 'shift', tag: '开始', log: '', html: '' }].concat(snaps),
  result: {
    big: '答案 B',
    html: '<b>I/O 指令</b>只能在内核态执行。干扰项记忆：trap 是"进入内核的门"（用户态可执行）；设置断点指令用户态可用，只是断点陷入的处理在内核态；数据传送指令是普通指令。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
