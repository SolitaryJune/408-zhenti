<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-24 · 创建进程必须完成的操作</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：创建进程 = Create 原语', cls: 'key',
    body: '<p>题目给了三个操作 Ⅰ 申请空白 PCB、Ⅱ 初始化 PCB、Ⅲ 设为执行态，问哪些是创建新进程<b>必须完成</b>的。先回忆 Create 原语的标准流程，再逐条对照。</p>' },
  { title: 'Create 原语的标准流程', cls: '',
    body: '<p>① 申请一个空白 PCB → ② 为新进程分配资源（内存等）→ ③ 初始化 PCB（填标识符、初始状态）→ ④ 把新进程<b>插入就绪队列</b>。</p>' },
  { title: 'Ⅰ. 申请空白 PCB：必须 ✓', cls: 'good',
    body: '<p>PCB 是<b>进程存在的唯一标志</b>，没有 PCB 就没有进程。申请空白 PCB 是创建的第一步——Ⅰ 必须完成。</p>' },
  { title: 'Ⅱ. 初始化 PCB：必须 ✓', cls: 'good',
    body: '<p>空白 PCB 要填入进程标识符、初始状态等信息后才有意义。初始化 PCB 是流程第 ③ 步——Ⅱ 必须完成。</p>' },
  { title: 'Ⅲ. 设为执行态：不必须 ✗', cls: 'bad',
    body: '<p>刚创建的进程只能被置为<b>就绪态</b>、插入就绪队列排队；能否上 CPU 要由<b>进程调度程序</b>决定，创建过程无权直接给它执行态。Ⅲ 不是必须的——这正是本题的陷阱。</p>' },
  { title: '结论：答案 B', cls: 'good',
    body: '<p>必须的是 Ⅰ 和 Ⅱ，仅Ⅰ、Ⅱ，答案选 <b>B</b>。记忆锚点：创建 = 申请空白 PCB → 分配资源 → 初始化 PCB → 进就绪队列（<b>就绪态</b>，不是执行态）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '创建新进程必须完成的操作（2021-24）',
  subtitle: '考点：进程创建原语 · Ⅰ 申请空白 PCB / Ⅱ 初始化 PCB / Ⅲ 设为执行态',
  counterLabel: '已核对',
  ribbonTitle: '核对项（✓ 必须完成 / ✗ 不必须）',
  intro: '点击「▶ 播放」，按创建流程逐条核对 Ⅰ、Ⅱ、Ⅲ。',
  snaps: [{ cls: 'shift', tag: '开始', log: '', html: '' }].concat(snaps),
  result: {
    big: '答案 B（仅Ⅰ、Ⅱ）',
    html: 'PCB 是进程存在的唯一标志，申请空白 PCB 与初始化 PCB 必不可少；新进程只能置为<b>就绪态</b>入队，执行态必须由调度程序授予——Ⅲ 不必须。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
