<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-29 · 二级页表的页表基址寄存器</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两个关键词', cls: 'key',
    body: '<p>页表基址寄存器（PTBR）里放什么？要回答两件事：<b>指向一级还是二级页表</b>？存的是<b>虚拟地址还是物理地址</b>？两个都答对才能锁定选项。</p>' },
  { title: '基址寄存器 = 查表链条的入口', cls: '',
    body: '<p>二级页表的变换流程：MMU 用虚拟地址高位查<b>一级页表</b> → 从表项得到二级页表位置 → 查二级页表得到页框号 → 拼物理地址。一级页表是整条链的<b>入口</b>——入口不能再依赖别的表来定位，所以寄存器必须直接指向<b>一级页表</b>（排除 C、D）。</p>' },
  { title: '为什么必须是物理地址', cls: '',
    body: '<p>页表存放在内存里，MMU 访问内存用的必须是<b>物理地址</b>。若寄存器放虚拟地址，用它之前还得先做地址变换，而这次变换又要用基址寄存器——"鸡生蛋"死循环。所以只能放<b>物理地址</b>（排除 A）。</p>' },
  { title: '二级页表的地址记在哪里', cls: '',
    body: '<p>一级页表的<b>表项</b>里存放二级页表的起始物理地址（页框号）。二级页表成千上万张，寄存器放不下也用不着；查哪张由虚拟地址的页号部分决定。</p>' },
  { title: '别忘了进程切换', cls: '',
    body: '<p>寄存器内容属于"<b>当前进程</b>"：每个进程有自己的页表，进程切换时要把它换成新进程一级页表的物理地址。这也是题目强调"当前进程"的原因。</p>' },
  { title: '结论：答案 B', cls: 'good',
    body: '<p>页表基址寄存器 = 查表链条入口 = <b>一级页表</b> + <b>物理地址</b>，答案选 <b>B</b>。记忆锚点：二级页表的地址在一级页表项里；寄存器随进程切换更新。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '二级页表下页表基址寄存器的内容（2021-29）',
  subtitle: '考点：多级页表的地址变换 · 一级页表 or 二级页表？虚拟地址 or 物理地址？',
  counterLabel: '已推演',
  ribbonTitle: '推理环节（✓ 环节闭环）',
  intro: '点击「▶ 播放」，沿地址变换流程推演基址寄存器的内容。',
  snaps: [{ cls: 'shift', tag: '开始', log: '', html: '' }].concat(snaps),
  result: {
    big: '答案 B',
    html: '基址寄存器存放<b>当前进程一级页表的起始物理地址</b>。选 D 的误区：二级页表地址记在一级页表项里；选 A/C 的误区：放虚拟地址会导致"变换又依赖寄存器"的死循环。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
