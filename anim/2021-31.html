<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-31 · 保证不死锁的最少资源数</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：问的是"至少"', cls: 'key',
    body: '<p>n（n≥2）个进程，每个都要用 2 个同类临界资源。找"保证<b>不会</b>死锁"的最少资源总数：思路是"最坏情形下仍能解围"。</p>' },
  { title: '最坏情形：n 个不够', cls: 'bad',
    body: '<p>让每个进程都"各拿 1 个、还差 1 个"：n 个资源<b>全部发出去</b>，每个进程都持有 1 个并在等第 2 个——谁也动不了，全体互相等待，<b>正是死锁</b>。所以 n 个不安全（排除 B）。</p>' },
  { title: '验证：n+1 个一定够', cls: 'good',
    body: '<p>资源总数 n+1：无论怎么分，最坏也只是"每进程各占 1 个"后<b>还剩 1 个</b>。剩下这 1 个必能分给某个进程，让它凑齐 2 个顺利跑完；它结束后<b>释放 2 个</b>，其他进程又能依次凑齐完成——任何时刻都不会全体互等，<b>不会死锁</b>。</p>' },
  { title: '公式化：最少 = Σ(需求−1)+1', cls: '',
    body: '<p>一般公式：不死锁最少资源数 = Σ(每个进程最大需求 − 1) + 1。本题每进程需求都是 2：n × (2 − 1) + 1 = <b>n + 1</b>。特例验证：n = 2 时，2 个资源可能死锁（各拿 1 个互等），3 个一定安全。</p>' },
  { title: '排除干扰项，锁定答案', cls: '',
    body: '<p>A（2）：n 很大时远远不够；B（n）：人人差一个即死锁；D（2n）：那是"每进程都能一次拿满"的<b>充分</b>条件，不是"至少"需要的量。只有 <b>n+1</b> 既必要又充分。</p>' },
  { title: '结论：答案 C', cls: 'good',
    body: '<p>答案选 <b>C（n+1）</b>。记忆锚点：最坏情形是"人人都差一个"；再多给 1 个，就必有一个进程能跑完并释放资源，系统就能继续前进。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '保证不死锁的最少资源数（2021-31）',
  subtitle: '考点：死锁预防的鸽笼论证 · n 个进程 × 每进程最大需求 2 个',
  counterLabel: '已推演',
  ribbonTitle: '推理环节（✓ 环节闭环）',
  intro: '点击「▶ 播放」，先证"不够"，再证"够"，最后公式化。',
  snaps: [{ cls: 'shift', tag: '开始', log: '', html: '' }].concat(snaps),
  result: {
    big: 'n+1（答案 C）',
    html: 'n 个资源可造成"每进程各持 1 个互等"的死锁；n+1 个时最坏也剩 1 个可救活某个进程 → 释放 2 个 → 逐个完成。公式：<b>Σ(每进程最大需求−1) + 1 = n+1</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
