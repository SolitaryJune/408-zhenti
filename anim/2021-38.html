<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-38 TCP 连接释放 · 客户收到 FIN 并回 ACK 后的状态</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     概念/推理类：先分主动/被动方，再沿状态链逐项核对四个选项
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：分清主动方与被动方',
    cls: 'key',
    body: '<p>客户<b>首先</b>发送 FIN 请求断开 → 客户是<b>主动关闭方</b>，服务器是<b>被动关闭方</b>。两方状态序列不同，选项 A 就是被动方专属状态。题问：客户<b>收到服务器的 FIN 并回 ACK 后</b>进入什么状态。</p>' },
  { title: '客户侧（主动方）状态链',
    cls: 'step',
    body: '<p>主动关闭方：<code>ESTABLISHED →(发 FIN) FIN_WAIT_1 →(收 ACK) FIN_WAIT_2 →(收对方 FIN、回 ACK) TIME_WAIT →(等 2MSL) CLOSED</code>。</p>' +
          '<p>被动关闭方：<code>ESTABLISHED →(收 FIN、回 ACK) CLOSE_WAIT →(发 FIN) LAST_ACK →(收 ACK) CLOSED</code>。</p>' },
  { title: 'A CLOSE_WAIT ✗',
    cls: 'bad',
    body: '<p>这是<b>被动关闭方</b>（服务器）收到客户的 FIN 并回 ACK 后进入的状态，客户（主动方）永远不会进入它。✗</p>' },
  { title: 'C FIN_WAIT_1 ✗',
    cls: 'bad',
    body: '<p>客户<b>刚发出 FIN</b>、还没收到任何回应时的状态。题中 ACK 和 FIN 都已收到，早已越过这一步。✗</p>' },
  { title: 'D FIN_WAIT_2 ✗',
    cls: 'bad',
    body: '<p>客户收到 ACK 但<b>尚未收到对方 FIN</b> 时的状态（半关闭：客户→服务器方向已关，服务器→客户仍可发数据）。题中服务器的 FIN 已经收到。✗</p>' },
  { title: 'B TIME_WAIT ✓',
    cls: 'good',
    body: '<p>客户<b>收到服务器的 FIN 并回送 ACK</b> 后 → 进入 <b>TIME_WAIT</b>，停留 <b>2MSL</b> 后才 CLOSED。<b>对</b>。✓</p>' },
  { title: '结论 + 记忆锚点',
    cls: 'good',
    body: '<p>答案 <b>B（TIME_WAIT）</b>。记忆锚点：<b>TIME_WAIT 只在主动关闭方</b>；<b>CLOSE_WAIT / LAST_ACK 只在被动关闭方</b>；2MSL 等待保证最后的 ACK 丢失可重传、本连接旧报文自然消亡。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'TCP 四次挥手：客户收到 FIN 并回 ACK 后的状态',
  subtitle: '考点：连接释放的状态迁移 · 主动方 vs 被动方（2021-38）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 成立 / ✗ 排除）',
  intro: '点击「▶ 播放」沿状态链逐项核对选项。',
  snaps: snaps,
  result: {
    big: '答案 B（TIME_WAIT）',
    html: '记忆锚点：主动方 <code>FIN_WAIT_1 → FIN_WAIT_2 → TIME_WAIT(2MSL) → CLOSED</code>；被动方 <code>CLOSE_WAIT → LAST_ACK → CLOSED</code>。收完对方 FIN、回完最后一个 ACK 就进 TIME_WAIT。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
