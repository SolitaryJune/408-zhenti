<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-39 UDP 与 TCP 的最大传输效率</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/计算推理类：效率定义 → UDP/TCP 分别计算 → 干扰项溯源
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：效率怎么算、为什么是"最大"',
    cls: 'key',
    body: '<p>传输效率 = <b>应用层数据 ÷ 协议总长度</b>。要效率<b>最大</b>，首部一律取<b>最小值</b>；只算 UDP 数据报 / TCP 段本身，不计 IP 及以下开销。应用层数据都是 <code>12 B</code>。</p>' },
  { title: 'UDP 数据报：60.0%',
    cls: 'good',
    body: '<p>UDP 首部固定 <code>8 B</code> → 数据报总长 = <code>12 + 8 = 20 B</code> → 效率 = <code>12 ÷ 20 = 60.0%</code>。</p>' },
  { title: 'TCP 段：37.5%',
    cls: 'good',
    body: '<p>TCP 首部 <code>20~60 B</code> 可变，求"最大"效率取最小 <code>20 B</code> → 段总长 = <code>12 + 20 = 32 B</code> → 效率 = <code>12 ÷ 32 = 37.5%</code>。</p>' },
  { title: '干扰项从哪来',
    cls: 'bad',
    body: '<p><code>16.7%</code> = 12 ÷ 72：误用 TCP 的 <b>60 B 最大首部</b>（A、C 里的错值）；把 UDP 首部记成 20 B 会得到 37.5%（B 的错值）；再把两列算反就是 A。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>UDP = <b>60.0%</b>，TCP = <b>37.5%</b> → 答案选 <b>D</b>。</p>' },
  { title: '记忆锚点',
    cls: 'key',
    body: '<p><b>UDP 首部固定 8 B</b>（源端口、目的端口、长度、校验和各 2 B）；<b>TCP 首部最小 20 B</b>（固定部分），选项最多 60 B。伪首部只用于校验和计算，不计入长度。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    ribbon: { k: i + 1, ok: s.cls !== 'bad' },
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '12 B 应用数据：UDP 与 TCP 的最大传输效率',
  subtitle: '考点：UDP 首部 8 B · TCP 首部 20~60 B · 效率 = 数据 ÷ 总长度（2021-39）',
  counterLabel: '推理进度',
  ribbonTitle: '推理步骤（✓ 成立 / ✗ 误区）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（60.0%, 37.5%）',
    html: 'UDP = <code>12/(12+8) = 60.0%</code>；TCP 取最小首部 <code>12/(12+20) = 37.5%</code>。16.7% 是误用 60 B 首部的产物。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
