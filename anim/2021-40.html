<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021-40 TCP 发送窗口 · 可继续发送的序号范围</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     过程演示类：序号轴逐段点亮（已发未确认 / 窗口 / 可继续发送）
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var CHUNKS = ['501~600', '601~700', '701~800', '801~900', '901~1000', '1001~1100'];
var chunkEls = [], noteBox, resBox;

// 每格状态：d=无关(dim)，a=已发送未确认(琥珀)，b=窗口覆盖(蓝)，g=可继续发送(绿)
var STATE = [
  ['d', 'd', 'd', 'd', 'd', 'd'],
  ['a', 'a', 'd', 'd', 'd', 'd'],
  ['a', 'a', 'b', 'b', 'b', 'd'],
  ['a', 'a', 'g', 'g', 'g', 'd'],
  ['a', 'a', 'g', 'g', 'g', 'd'],
  ['a', 'a', 'g', 'g', 'g', 'd'],
];
var STYLE = {
  d: { bg: '#f8edcb', bd: '#5a7d8c66', fg: '#b9cbd0', op: .45 },
  a: { bg: '#f8edcb', bd: '#e07a2f', fg: '#92400e', op: 1 },
  b: { bg: '#1b3a4b14', bd: '#1b3a4b', fg: '#1b3a4b', op: 1 },
  g: { bg: '#2f9e4424', bd: '#2f9e44', fg: '#1e4d33', op: 1 },
};

AW.init({
  title: 'TCP 滑动窗口：甲还能继续发送哪些序号',
  subtitle: 't0 发出 <code>seq=501、200 B</code> · t1 收到 <code>seq=601、ack_seq=501、rcvwnd=500 B</code> · 序号轴每格 100 B',
  counterLabel: '已确定要点',
  ribbonTitle: '推导要点（✓ 已完成）',
  intro: '点击「▶ 播放」，把序号轴一段一段点亮。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    var axis = AW.el('div', 'aw-row-label', '<b>甲的发送序号轴</b>（501 起，每格 100 B）');
    inner.appendChild(axis);

    var bar = AW.el('div', '');
    bar.style.cssText = 'display:flex;width:100%;max-width:760px;';
    chunkEls = [];
    CHUNKS.forEach(function(c){
      var d = AW.el('div', '');
      d.style.cssText = 'flex:1;margin:2px;padding:10px 0;border-radius:8px;text-align:center;' +
        'font-size:12.5px;font-weight:700;font-family:Menlo,monospace;border:2px solid #5a7d8c66;' +
        'background:#f8edcb;color:#b9cbd0;opacity:.45;transition:all .35s;';
      d.innerHTML = c;
      bar.appendChild(d);
      chunkEls.push(d);
    });
    inner.appendChild(bar);

    var marks = AW.el('div', 'aw-row-label');
    marks.innerHTML = '左端 501 = ack_seq（窗口左端）　·　700 = 已发数据末尾　·　1000 = 501 + rcvwnd（窗口右端）';
    inner.appendChild(marks);

    var legend = AW.el('div', 'aw-row-label');
    legend.innerHTML = '颜色：<b style="color:#e07a2f">琥珀 = 已发送未确认</b> · <b style="color:#1b3a4b">墨青 = 窗口覆盖</b> · <b style="color:#2f9e44">绿 = 可继续发送</b>';
    inner.appendChild(legend);

    noteBox = AW.el('div', '');
    noteBox.style.cssText = 'margin-top:10px;font-size:14.5px;line-height:1.75;color:#213e48;';
    inner.appendChild(noteBox);

    resBox = AW.el('div', '');
    resBox.style.cssText = 'margin-top:6px;font-size:14px;font-weight:800;color:#1b3a4b;';
    inner.appendChild(resBox);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls: 'step', tag: '审题', count: 0,
      log: '甲在 t0 发出 seq=501、封装 200 B 的段；t1 收到乙的段：seq=601、ack_seq=501、rcvwnd=500。问：收到新确认前还能继续发哪些序号' },
    { cls: 'shift', tag: '已发送未确认', count: 1, ribbon: { k: 1, ok: true },
      log: 'seq=501、200 B → 占用序号 501~700；ack_seq=501 表示乙还在等 501 号字节 → 这 200 B 全部未被确认' },
    { cls: 'step', tag: '定窗口', count: 2, ribbon: { k: 2, ok: true },
      log: 'rcvwnd=500：乙还能接收 500 B → 甲的发送窗口从 501 起共 500 B = 501~1000（此题窗口由接收窗口决定）' },
    { cls: 'ok', tag: '扣除已发', count: 3, ribbon: { k: 3, ok: true },
      log: '窗口 501~1000 内扣除已发送未确认的 501~700 → 可继续发送的新数据 = 701~1000' },
    { cls: 'step', tag: '排干扰', count: 3,
      log: '段里的 seq=601 是乙自己发送数据的序号，与甲的窗口毫无关系；不要把它当成甲的窗口起点' },
    { cls: 'done', tag: '完成', count: 3, done: true,
      log: '可继续发送的序号范围 = 701~1000 → 选 C',
      res: '可继续发送：701~1000 → 选 C' },
  ],

  render: function(stage, sn, i){
    var S = STATE[Math.min(i, STATE.length - 1)];
    for(var j = 0; j < 6; j++){
      var st = STYLE[S[j]];
      var d = chunkEls[j];
      d.style.background = st.bg;
      d.style.borderColor = st.bd;
      d.style.color = st.fg;
      d.style.opacity = st.op;
    }
    noteBox.innerHTML = sn.log || '';
    resBox.innerHTML = sn.res || '';
  },

  result: {
    big: '701~1000（答案 C）',
    html: '发送窗口 = <code>[ack_seq, ack_seq + rcvwnd) = [501, 1000)</code>；其中 <code>501~700</code> 已发送未确认 → 可继续发送 <code>701~1000</code>。干扰项：A 忘扣已发未确认部分；B/D 被乙自己的 seq=601 带偏。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
