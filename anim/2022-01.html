<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-01 循环时间复杂度：等比级数求和</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

/* 程序段：for(i=1; i<n; i*=2) for(j=0; j<i; j++) sum++;
   示例取 n=17，则 i 依次取 1,2,4,8,16 */
var IVALS = ['1', '2', '4', '8', '16'];
var ICNT  = ['1', '2', '4', '8', '16'];
var ISUM  = ['1', '3', '7', '15', '31'];

var iRow, cRow, sRow;

function paint(t){          // t=0 未开始；1~5 当前轮；6 结束
  for (var j = 0; j < 5; j++){
    var b = iRow.children[j].children[1];
    var c = cRow.children[j].children[1];
    var s = sRow.children[j].children[1];
    var st;
    if (t === 0) st = '';
    else if (t === 6) st = 'ok';
    else st = (j < t - 1) ? 'ok' : (j === t - 1 ? 'hit' : '');
    b.className = 'aw-box' + (st ? ' ' + st : '');
    c.className = 'aw-box' + (st ? ' ' + st : '');
    s.className = 'aw-box' + (st ? ' ' + st : '');
    s.textContent = (t === 0) ? '' : ((t === 6 || j <= t - 1) ? ISUM[j] : '');
    iRow.children[j].children[0].textContent = (t >= 1 && t <= 5 && j === t - 1) ? '▲i' : '';
  }
}

AW.init({
  title: '循环时间复杂度：内层次数随 i 翻倍（2022-01）',
  subtitle: '<code>for(i=1; i&lt;n; i*=2) for(j=0; j&lt;i; j++) sum++;</code> · 示例取 n=17',
  counterLabel: 'sum 累计',
  intro: '点击「▶ 播放」，逐轮累加 sum++ 的执行次数。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>外层变量 i</b>（每轮 i *= 2，取值均 &lt; n）'));
    iRow = AW.cellRow(IVALS, ['', '', '', '', ''], null, 1);
    inner.appendChild(iRow);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>本轮内层执行次数</b>（j=0..i−1，共 i 次）'));
    cRow = AW.cellRow(ICNT, ['', '', '', '', ''], null, 1);
    inner.appendChild(cRow);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>sum 累计</b>（等比级数前缀和）'));
    sRow = AW.cellRow(['', '', '', '', ''], ['', '', '', '', ''], null, 1);
    inner.appendChild(sRow);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    paint(0);
  },
  snaps: [
    { cls: 'shift', tag: '开始', log: 'sum=0。外层 i 从 1 开始每轮乘 2：i 只能取 1,2,4,8,16（示例 n=17，均小于 17）', count: 0 },
    { cls: 'step',  tag: '第 1 轮', log: 'i=1：内层 j 只跑 1 次，sum=1', count: 1 },
    { cls: 'step',  tag: '第 2 轮', log: 'i=2：内层跑 2 次，累计 1+2=3', count: 3 },
    { cls: 'step',  tag: '第 3 轮', log: 'i=4：内层跑 4 次，累计 7', count: 7 },
    { cls: 'step',  tag: '第 4 轮', log: 'i=8：内层跑 8 次，累计 15', count: 15 },
    { cls: 'step',  tag: '第 5 轮', log: 'i=16：内层跑 16 次，累计 31；下一轮 i=32 ≥ 17，外层结束', count: 31 },
    { cls: 'done',  tag: '完成', log: '总量 = 1+2+4+…+2^k = 2^(k+1)−1 < 2n−1 ⇒ 时间复杂度 O(n)，选 B', count: 31, done: true },
  ],
  render: function(stage, sn, i){ paint(i); },
  result: {
    big: 'O(n)（答案 B）',
    html: '内层总次数 = <b>1+2+4+…+2^k = 2^(k+1) − 1</b>，而最后一轮 2^k &lt; n，故总量 &lt; 2n−1，是<b>线性阶</b>。易错：拿外层 O(log n) 乘内层 O(n) 得 O(n log n) —— 错，内层每轮次数在变，要按等比级数求和。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
