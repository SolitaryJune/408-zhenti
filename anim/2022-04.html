<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-04 三叉树 244 个结点的最小高度</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>244 个结点的<b>三叉树</b>（每个结点至多 3 个孩子），叶结点高度为 1 ⇒ 高度按<b>层数</b>计（叶为 1，向上逐层 +1，根的高度 = 总层数）。「高度至少」⇒ 想让树最矮，就要<b>每层都放满</b>。</p>' },
  { title: '容量公式',
    cls: '',
    body: '<p>h 层三叉树最多容纳 1 + 3 + 9 + … + 3^(h−1) = <b>(3^h − 1) / 2</b> 个结点（等比数列求和）。</p>' },
  { title: '逐层算容量',
    cls: '',
    body: '<ul>' +
      '<li>h=1：最多 1 个；h=2：4 个；h=3：13 个；h=4：40 个</li>' +
      '<li>h=5：121 个 —— <b>装不下 244</b></li>' +
      '<li>h=6：364 个 —— <b>≥ 244，够装</b></li>' +
      '</ul>' },
  { title: '判定最小高度',
    cls: 'good',
    body: '<p>5 层最多 121 个，装不下 244 ⇒ 至少 6 层；6 层容量 364 ≥ 244，且可构造：前 5 层放满 121 个，第 6 层再放 123 个叶（第 5 层 81 个结点至多可挂 243 个孩子，足够）⇒ 最小高度 <b>6</b>。</p>' },
  { title: '易错点',
    cls: 'bad',
    body: '<ul>' +
      '<li>误用二叉树公式 2^h − 1 ≥ 244 ⇒ 得 8（选项 A 的陷阱）</li>' +
      '<li>忽略「叶结点高度为 1」的口径少算一层 ⇒ 得 5（选项 D 的陷阱）</li>' +
      '</ul>' },
  { title: '结论',
    cls: 'good',
    body: '<p>高度至少 <b>6</b>，选 <b>C</b>。记忆锚点：m 叉树 h 层最多 (m^h − 1)/(m − 1) 个结点，先算容量再卡边界。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '三叉树 244 个结点，高度至少几层？（2022-04）',
  subtitle: '考点：m 叉树的结点容量 · 高度按层数计（叶 = 1）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C（高度至少 6）',
    html: 'h 层三叉树最多 (3^h − 1)/2 个结点：5 层 121 &lt; 244 ≤ 364 = 6 层容量 ⇒ 至少 <b>6</b> 层。别拿二叉树的 2^h − 1 来算，也别忘了「叶高度为 1」的口径。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
