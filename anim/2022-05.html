<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-05 哈夫曼树 T1 与定长编码树 T2 · 对比动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
<style>
  .hsvg{width:100%;max-width:700px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .hsvg .hlv{stroke:#5a7d8c66;stroke-width:1.5px;stroke-dasharray:6 5}
  .hsvg .hlvlab{fill:#b9cbd0;font-size:12px;font-weight:700}
  .hsvg .hedgeline{stroke:#5a7d8c;stroke-width:2.5px;transition:opacity .4s, stroke .3s, stroke-width .3s}
  .hsvg .edgelab{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:14px;
    text-anchor:middle;fill:#213e48;transition:opacity .4s}
  .hsvg .hnode circle{transition:opacity .4s, fill .3s, stroke .3s}
  .hsvg .hnode text{font-family:JetBrains Mono,Menlo,monospace;font-weight:800;font-size:15px;
    text-anchor:middle;dominant-baseline:central;fill:#fff;transition:opacity .4s}
  .hsvg .hnode.internal circle{fill:#1b3a4b}
  .hsvg .hnode.leaf circle{fill:#2f9e44}
  .hsvg .hnode.hot circle{fill:#e07a2f}
  .hsvg .hnode .sub{fill:#586e72;font-size:12px;font-weight:700;font-family:inherit;
    dominant-baseline:auto;transition:opacity .4s}
  .hsvg .hidden-el{opacity:0}
  .hqueue{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;justify-content:center}
  .hqueue .qchip{background:#5a7d8c26;color:#1b3a4b;border:1.5px solid #5a7d8c66;border-radius:999px;
    padding:4px 13px;font-weight:800;font-family:JetBrains Mono,Menlo,monospace;font-size:14px}
  .hqueue .qchip.hot{background:#f8edcb;border-color:#e07a2f;color:#b45309}
  .hqueue .qchip.merged{opacity:.45;text-decoration:line-through}
  .hformula{margin-top:8px;text-align:center;font-size:14.5px;font-weight:700;color:#1b3a4b;line-height:1.9}
  .hformula .bad{color:#a02830}
  .hformula .good{color:#276942}
  .hformula code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 2022-05 哈夫曼树 T1 vs 定长编码树 T2（双树 SVG 对比） ==================
 * 题：同一字符集 S（n>2）分别得哈夫曼编码树 T1 与定长编码树 T2，判断哪个叙述正确。（答案 D）
 * 演示：自拟最小例 S = {a,b,c}，频次 1、2、4——
 *   实际建出 T1（合并 1+2 → 3，再 3+4 → 7）与 T2（⌈log₂3⌉=2 位定长码），
 *   逐项检验 A（结点数）、B（高度）、C（T1 分层）、D（T2 同层）。 */

// 层参考线（根在第 1 层）
var LEVELS = [ { y:45, lab:'层1' }, { y:145, lab:'层2' }, { y:245, lab:'层3' } ];
var NODES = [
  // T1（左）
  { id:'n7', x:170, y:45,  kind:'internal', ch:'7', step:2, tree:'T1' },
  { id:'m3', x:100, y:145, kind:'internal', ch:'3', step:1, tree:'T1' },
  { id:'c4', x:245, y:145, kind:'leaf',     ch:'c', sub:'频次4', step:2, tree:'T1' },
  { id:'a1', x:62,  y:245, kind:'leaf',     ch:'a', sub:'频次1', step:1, tree:'T1' },
  { id:'b2', x:140, y:245, kind:'leaf',     ch:'b', sub:'频次2', step:1, tree:'T1' },
  // T2（右）
  { id:'tR', x:530, y:45,  kind:'internal', ch:'',  step:3, tree:'T2' },
  { id:'tL', x:460, y:145, kind:'internal', ch:'',  step:3, tree:'T2' },
  { id:'tRt',x:600, y:145, kind:'internal', ch:'',  step:3, tree:'T2' },
  { id:'ta', x:425, y:245, kind:'leaf',     ch:'a', sub:'码00', step:3, tree:'T2' },
  { id:'tb', x:497, y:245, kind:'leaf',     ch:'b', sub:'码01', step:3, tree:'T2' },
  { id:'tc', x:600, y:245, kind:'leaf',     ch:'c', sub:'码10', step:3, tree:'T2' },
];
var EDGES = [
  { a:'m3', b:'a1',  lab:'0', lx:52,  ly:200, step:1 },
  { a:'m3', b:'b2',  lab:'1', lx:148, ly:200, step:1 },
  { a:'n7', b:'m3',  lab:'0', lx:105, ly:92,  step:2 },
  { a:'n7', b:'c4',  lab:'1', lx:232, ly:92,  step:2 },
  { a:'tR', b:'tL',  lab:'0', lx:418, ly:92,  step:3 },
  { a:'tR', b:'tRt', lab:'1', lx:592, ly:92,  step:3 },
  { a:'tL', b:'ta',  lab:'0', lx:405, ly:200, step:3 },
  { a:'tL', b:'tb',  lab:'1', lx:502, ly:200, step:3 },
  { a:'tRt',b:'tc',  lab:'0', lx:632, ly:200, step:3 },
];
// 每步：hot=高亮结点 qchips=权值队列 formula=结论行
var STATES = [
  { hot:[], qchips:{ chips:['1','2','4'], hot:[], merged:[] },
    formula:'题：同一字符集 S（n &gt; 2）分别构 <b>T1 = 哈夫曼编码树</b>、<b>T2 = 定长编码树</b>。自拟最小例：S = {a, b, c}，频次 1、2、4' },
  { hot:['m3'], qchips:{ chips:['3','4'], hot:[], merged:['1','2'] },
    formula:'建 T1 ①：取最小两个频次 1(a)、2(b) 合并 → 新结点 3，a、b 变成它的两个孩子' },
  { hot:['n7'], qchips:{ chips:['T1 完成'], hot:['T1 完成'], merged:['1','2','3','4'] },
    formula:'建 T1 ②：3 + 4 → 根 7。T1 结点数 = 2×3−1 = <code>5</code>；c 在层2，a、b 在层3' },
  { hot:['ta','tb','tc'], qchips:{ chips:['T2 完成'], hot:['T2 完成'], merged:[] },
    formula:'建 T2：⌈log₂3⌉ = 2 位定长 → a=00, b=01, c=10，<b>3 个字符全部在层3</b>；整树结点 <code>6</code> 个' },
  { hot:['n7','tR'], qchips:{ chips:['验 A'], hot:['验 A'], merged:[] },
    formula:'A：<b class="bad">T1 结点 5 ≠ T2 结点 6 → 「结点数相同」不成立，A ✗</b>（T2 形状不唯一：全满时 7 个，n=5 时更多）' },
  { hot:[], qchips:{ chips:['验 B'], hot:['验 B'], merged:[] },
    formula:'B：<b class="bad">T1 高度 3 = T2 高度 3 → 「T1 的高度大于 T2」不成立，B ✗</b>（高度按层数计，根在层1）' },
  { hot:['a1','b2'], qchips:{ chips:['验 C'], hot:['验 C'], merged:[] },
    formula:'C：<b class="bad">a(频1) 与 b(频2) 频次不同，却同在 T1 的层3 → C ✗</b>（哈夫曼「频次定深浅」，但不保证异频异层）' },
  { hot:['ta','tb','tc'], qchips:{ chips:['验 D'], hot:['验 D'], merged:[] },
    formula:'D：<b class="good">T2 中 a、b、c 频次 1、2、4 互不相同，却全部在层3 → D ✓</b>（定长码长与频次无关）' },
  { hot:['ta','tb','tc'], qchips:{ chips:['选 D ✓'], hot:['选 D ✓'], merged:[] },
    formula:'<b class="good">定长 ⇒ 码长相同 ⇒ 所有人同层，D 恒成立 → 选 D</b>' },
];
var SNAPS = [
  { cls:'step', tag:'题与示例', count:0,
    log:'题：对任意 n（n&gt;2）个字符的集合 S，用二叉树分别表示哈夫曼编码集（T1）与定长编码集（T2）。选项全是"一定 / 相同"式命题 → 自拟最小例实建两棵树逐项检验。' },
  { cls:'ok', tag:'建 T1 ①', count:0,
    log:'哈夫曼建树：取最小两个频次 1(a)、2(b) 合并 → 新结点 3。权值队列：3, 4。' },
  { cls:'ok', tag:'建 T1 ②', count:0,
    log:'再合并 3 与 4 → 根 7。T1 完成：无度 1 结点，结点数 = 2×3−1 = <b>5</b>；频次大的 c 离根近（层2），频次小的 a、b 在层3。' },
  { cls:'ok', tag:'建 T2', count:0,
    log:'定长编码：⌈log₂3⌉ = 2 位 → a=00、b=01、c=10。T2 中表示字符的结点（叶子）<b>全部落在层3</b>；整树 6 个结点。' },
  { cls:'miss', tag:'验 A', count:1, ribbon:{k:1, ok:false},
    log:'A 说「T1 与 T2 的结点数相同」：本例 T1 = 5 个、T2 = 6 个，已经不同；且 T2 形状不唯一（全满 7 个；n=5 时更多）→ <b>A ✗</b>。' },
  { cls:'miss', tag:'验 B', count:2, ribbon:{k:2, ok:false},
    log:'B 说「T1 的高度大于 T2 的高度」：本例两树都是 3 层（根在层1）——相等即反例；频次均衡时 T1 还可以更矮 → <b>B ✗</b>。' },
  { cls:'miss', tag:'验 C', count:3, ribbon:{k:3, ok:false},
    log:'C 说「频次不同的字符在 T1 中处于不同的层」：a(频1) 与 b(频2) 频次不同，却同在层3 → <b>C ✗</b>。' },
  { cls:'ok', tag:'验 D', count:4, ribbon:{k:4, ok:true},
    log:'D 说「频次不同的字符在 T2 中处于相同的层」：定长编码码长相同，表示字符的叶子必然全部同层（本例都在层3）→ <b>D ✓</b>，且对任意 S 恒成立。' },
  { cls:'done', tag:'结论', count:4, done:true,
    log:'正确的是 D：定长编码树里所有字符（叶子）必在同一层 → 选 D。' },
];

function build(stage){
  stage.innerHTML = '';
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 700 300');
  svg.setAttribute('class', 'hsvg');
  // 层参考线
  LEVELS.forEach(function(lv){
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', 30); ln.setAttribute('y1', lv.y);
    ln.setAttribute('x2', 670); ln.setAttribute('y2', lv.y);
    ln.setAttribute('class', 'hlv');
    svg.appendChild(ln);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', 8); t.setAttribute('y', lv.y + 4);
    t.setAttribute('class', 'hlvlab');
    t.textContent = lv.lab;
    svg.appendChild(t);
  });
  // 两棵树的标题
  [['T1 · 哈夫曼编码树', 170], ['T2 · 定长编码树', 530]].forEach(function(p){
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', p[1]); t.setAttribute('y', 16);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '14');
    t.setAttribute('font-weight', '800');
    t.setAttribute('fill', '#1b3a4b');
    t.textContent = p[0];
    svg.appendChild(t);
  });
  var byId = {};
  NODES.forEach(function(n){ byId[n.id] = n; });
  EDGES.forEach(function(e){
    var A = byId[e.a], B = byId[e.b];
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'hedge hidden-el');
    g.dataset.id = 'E:' + e.a + '-' + e.b;
    g.dataset.step = e.step;
    var ln = document.createElementNS(svgNS, 'line');
    ln.setAttribute('x1', A.x); ln.setAttribute('y1', A.y);
    ln.setAttribute('x2', B.x); ln.setAttribute('y2', B.y);
    ln.setAttribute('class', 'hedgeline');
    g.appendChild(ln);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', e.lx); t.setAttribute('y', e.ly);
    t.setAttribute('class', 'edgelab');
    t.textContent = e.lab;
    g.appendChild(t);
    svg.appendChild(g);
  });
  NODES.forEach(function(n){
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'hnode ' + n.kind + ' hidden-el');
    g.dataset.id = n.id;
    g.dataset.step = n.step;
    var c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); c.setAttribute('r', 20);
    g.appendChild(c);
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y);
    t.textContent = n.ch;
    g.appendChild(t);
    if(n.sub){
      var s = document.createElementNS(svgNS, 'text');
      s.setAttribute('x', n.x); s.setAttribute('y', n.y + 33);
      s.setAttribute('text-anchor', 'middle');
      s.setAttribute('class', 'sub');
      s.textContent = n.sub;
      g.appendChild(s);
    }
    svg.appendChild(g);
  });
  stage.appendChild(svg);
  var q = AW.el('div', 'hqueue');
  stage.appendChild(q);
  var f = AW.el('div', 'hformula');
  stage.appendChild(f);
  this._svg = svg; this._q = q; this._f = f;
}

function render(stage, sn, i){
  var svg = this._svg;
  var st = STATES[Math.min(i, STATES.length - 1)];
  var hot = {};
  st.hot.forEach(function(id){ hot[id] = 1; });
  [].forEach.call(svg.querySelectorAll('.hnode, .hedge'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
    if(el.classList.contains('hnode')){
      el.classList.remove('hot');
      if(hot[el.dataset.id]) el.classList.add('hot');
    } else {
      var ln = el.querySelector('.hedgeline');
      ln.style.stroke = hot[el.dataset.id] ? '#2f9e44' : '';
      ln.style.strokeWidth = hot[el.dataset.id] ? '4px' : '';
    }
  });
  var qc = st.qchips;
  this._q.innerHTML = '频次队列：' + qc.chips.map(function(c){
    var cls = 'qchip' + (qc.hot.indexOf(c) >= 0 ? ' hot' : '') + (qc.merged.indexOf(c) >= 0 ? ' merged' : '');
    return '<span class="' + cls + '">' + c + '</span>';
  }).join('');
  this._f.innerHTML = st.formula;
}

AW.init({
  title: '2022-05 哈夫曼编码树 T1 与定长编码树 T2 的对比',
  subtitle: '同一字符集 S（n &gt; 2）：T1 = 哈夫曼编码树（2n−1 个结点、频次定深浅），T2 = 定长编码树（码长相同）——四个"一定"式命题逐项检验',
  counterLabel: '已验证选项数',
  ribbonTitle: '选项判定（✓ 对 / ✗ 错）',
  intro: '点击「▶ 播放」实建 T1、T2（S = {a,b,c}，频次 1、2、4），再逐项验 A～D。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: 'D：频次不同的字符在 T2 中处于相同的层',
    html: '用 n = 3、频次 {1,2,4} 实建两棵树：<b>A ✗</b>——T1 恒为 2n−1 = 5 个结点，T2 形状不唯一（本例 6 个、全满 7 个），结点数不一定相同；<b>B ✗</b>——本例两树同为 3 层，T1 不一定更高；<b>C ✗</b>——T1 中频次 1 的 a 与频次 2 的 b 同在层3，频次不同不保证异层；<b>D ✓</b>——定长编码码长与频次无关，T2 中表示字符的叶子<b>必然全部同层</b>。记忆锚点：<code>哈夫曼：频次定深浅；定长：人人同层</code>。',
  },
});
</script>
<script>/* aw-ok */</script>
</body>
</html>
