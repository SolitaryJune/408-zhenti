<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-08 5 阶 B 树：删除根中关键字 260</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

/* 5 阶 B 树：非根结点关键字数 ∈ [2,4]，根至少 1 个。
   根 [60,90,260,350]，子树 [30,50] [70,80,85] [100,110] [280,300] [400,500]。
   类别码：0 普通 / 1 ok / 2 miss(下溢/非法) / 3 hit(变化焦点) / 4 dim(空位/不参与) */
var CH0 = ['30,50', '70,80,85', '100,110', '280,300', '400,500'];
var ST = [
  { r: ['60', '90', '260', '350'], rc: [0, 0, 3, 0],
    ch: ['30,50', '70,80,85', '100,110', '280,300', '400,500'], cc: [0, 0, 0, 0, 0] },        // 0 初始
  { r: ['60', '90', '350', ''], rc: [1, 1, 1, 4],
    ch: CH0.slice(), cc: [1, 1, 1, 1, 1] },                                                    // 1 直接删 → B
  { r: ['60', '90', '280', '350'], rc: [1, 1, 3, 1],
    ch: ['30,50', '70,80,85', '100,110', '300', '400,500'], cc: [1, 1, 1, 2, 1] },             // 2 后继替换
  { r: ['60', '90', '280', '350'], rc: [1, 1, 3, 1],
    ch: ['30,50', '70,80,85', '100,110', '300', '400,500'], cc: [1, 1, 4, 2, 4] },             // 3 借不到
  { r: ['60', '90', '280', ''], rc: [1, 1, 1, 4],
    ch: ['30,50', '70,80,85', '100,110', '300,350,400,500', ''], cc: [1, 1, 1, 3, 4] },        // 4 合并 → A
  { r: ['60', '90', '110', '350'], rc: [1, 1, 3, 1],
    ch: ['30,50', '70,80,85', '100', '280,300', '400,500'], cc: [1, 1, 2, 1, 1] },             // 5 前驱替换（D 中间态）
  { r: ['60', '90', '110', '350'], rc: [1, 1, 3, 1],
    ch: ['30,50', '70,80,85', '100', '280,300', '400,500'], cc: [1, 3, 2, 1, 1] },             // 6 左兄可借
  { r: ['60', '85', '110', '350'], rc: [1, 3, 1, 1],
    ch: ['30,50', '70,80', '90,100', '280,300', '400,500'], cc: [1, 1, 1, 1, 1] },             // 7 借 → C
  { r: ['60', '90', '350', ''], rc: [1, 1, 1, 4],
    ch: ['30,50', '70,80,85', '100,110,280,300', '400,500', ''], cc: [1, 1, 3, 1, 4] },        // 8 或合并 → B
  { r: ['60', '90', '110', '350'], rc: [2, 2, 2, 2],
    ch: ['30,50', '70,80,85', '100', '280,300', '400,500'], cc: [1, 1, 2, 1, 1] },             // 9 done：D 非法
];

var rootRow, chRow, chBox = [];

function paint(i){
  var s = ST[i], j;
  var codes = ['', ' ok', ' miss', ' hit', ' dim'];
  for (j = 0; j < 4; j++){
    var b = rootRow.children[j].children[1];
    b.textContent = s.r[j];
    b.className = 'aw-box' + (s.r[j] === '' ? ' dim' : codes[s.rc[j]] || '');
  }
  for (j = 0; j < 5; j++){
    var c = chBox[j];
    c.textContent = s.ch[j];
    c.className = 'aw-box' + (s.ch[j] === '' ? ' dim' : codes[s.cc[j]] || '');
  }
}

AW.init({
  title: '5 阶 B 树删除根中关键字 260（2022-08）',
  subtitle: '5 阶：每结点关键字数 <code>2～4</code>（根至少 1）· 三种调整路径 · 找「不可能」的根',
  counterLabel: '可行根方案',
  intro: '点击「▶ 播放」：逐条枚举删除 260 后每个合法的调整结果。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>根结点关键字</b>（4 格）'));
    rootRow = AW.cellRow(['60', '90', '260', '350'], ['', '', '', ''], null, 1);
    inner.appendChild(rootRow);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>5 棵子树</b>（自左向右）'));
    var crow = AW.el('div', 'aw-cells');
    for (var i = 0; i < 5; i++){
      var col = AW.el('div', 'aw-col');
      col.style.width = '118px';
      col.appendChild(AW.el('div', 'aw-ptr', ''));
      var b = AW.el('div', 'aw-box', '');
      b.style.width = '112px';
      b.style.fontSize = '13px';
      col.appendChild(b);
      col.appendChild(AW.el('div', 'aw-idx', '子树' + (i + 1)));
      crow.appendChild(col);
      chBox.push(b);
    }
    inner.appendChild(crow);
    chRow = crow;
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    paint(0);
  },
  snaps: [
    { cls: 'shift', tag: '开始',        log: '5 阶 B 树：非根结点关键字数 ∈ [2,4]。删根中的 260，三条路都能走，逐一看结果', count: 0 },
    { cls: 'ok',    tag: '方案一·直接删', log: '260 在根里且根有 4 个关键字 > 下限，直接删：根剩 [60,90,350]，仍合法 ⇒ 选项 B 可能', count: 1 },
    { cls: 'shift', tag: '方案二·后继替换', log: '也可「替换后再删」：260 的后继 = 右侧子树最左关键字 280。替换后根 [60,90,280,350]，子树4 剩 [300]——1 个关键字 < 2，下溢！', count: 1 },
    { cls: 'miss',  tag: '借不到',      log: '子树4 的左右兄弟 [100,110]、[400,500] 都恰有 2 个关键字（下限），都借不了 ⇒ 只能合并', count: 1 },
    { cls: 'ok',    tag: '合并 → A',    log: '子树4 与右子树5 连同分隔关键字 350 合并成 [300,350,400,500]（4 个，合法），根变 [60,90,280] ⇒ 选项 A 可能', count: 2 },
    { cls: 'shift', tag: '方案三·前驱替换', log: '用前驱 110 替换 260：根 [60,90,110,350]，子树3 剩 [100]——下溢！注意：这正是选项 D 的状态，但它还不是合法 B 树', count: 2 },
    { cls: 'miss',  tag: '看兄弟',      log: '子树3 的左兄弟 [70,80,85] 有 3 个关键字 > 2，可以借', count: 2 },
    { cls: 'ok',    tag: '借 → C',      log: '85 上移到根、90 下移到子树3：根 [60,85,110,350]，子树 [30,50] [70,80] [90,100] [280,300] [400,500] 全部合法 ⇒ 选项 C 可能', count: 3 },
    { cls: 'ok',    tag: '或合并 → B',  log: '也可把子树3 与右子树4 连同分隔 110 合并成 [100,110,280,300]，根变 [60,90,350] ⇒ 又得 B', count: 3 },
    { cls: 'done',  tag: '完成',        log: '可能的根：[60,90,350]（B）、[60,90,280]（A）、[60,85,110,350]（C）；[60,90,110,350]（D）是未修复下溢的非法中间态 ⇒ 不可能的是 D', count: 3, done: true },
  ],
  render: function(stage, sn, i){ paint(i); },
  result: {
    big: '答案 D（不可能）',
    html: 'A/B/C 都是合法终态：直接删得 <code>60,90,350</code>；后继替换 + 合并得 <code>60,90,280</code>；前驱替换 + 借得 <code>60,85,110,350</code>。而 <code>60,90,110,350</code>（D）后面跟着一个只剩 1 个关键字的叶子，<b>必须继续调整</b>，不可能是最终 T1 的根。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
