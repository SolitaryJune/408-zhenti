<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-11 何时选直接插入而不是快速排序</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两种算法的“脾气”',
    cls: 'key',
    body: '<p><b>直接插入</b>：基本有序时接近 O(n)、小规模快、稳定、辅助空间 O(1)。<b>快速排序</b>：平均 O(n log n)，但基本有序时枢轴选得差会退化到 O(n²)，不稳定，递归栈 O(log n)。题目问“选插入而不选快排”的理由，逐条对照四个短板。</p>' },
  { title: 'I. 大部分元素已有序',
    cls: 'good',
    body: '<p>插入排序此时每趟几乎不移动元素，接近 <b>O(n)</b>；快排在这种输入上容易选到端点枢轴，退化成 <b>O(n²)</b>。<b>是理由 ✓</b></p>' },
  { title: 'II. 待排序元素数量很少',
    cls: 'good',
    body: '<p>小规模下插入排序常数开销小、实现简单；快排的递归调用与枢轴选择开销反而不划算。<b>是理由 ✓</b></p>' },
  { title: 'III. 要求空间复杂度为 O(1)',
    cls: 'good',
    body: '<p>插入排序只需 1 个暂存单元（哨兵）；快排递归需要 <b>O(log n)</b> 的栈空间，达不到 O(1)。<b>是理由 ✓</b></p>' },
  { title: 'IV. 要求排序算法是稳定的',
    cls: 'good',
    body: '<p>插入排序相邻元素比较、后插不越位，<b>稳定</b>；快排的远距离交换会打乱相等元素的相对次序，<b>不稳定</b>。<b>是理由 ✓</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>四条恰好都踩在快排短板、插入排序长板上 ⇒ 答案 <b>D</b>。记忆锚点：快排的优势在<b>大规模乱序</b>；有序、小规模、要省空间、要稳定，都请出插入排序。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '为什么用直接插入而不用快速排序？（2022-11）',
  subtitle: '考点：内部排序算法的比较 · 插入排序与快排的适用场景',
  intro: '点击「▶ 播放」逐条检验 I～IV。',
  snaps: snaps,
  result: {
    big: '答案 D（四条都是理由）',
    html: 'I 基本有序：插入 O(n)、快排退化 O(n²)；II 小规模：插入常数小；III 空间 O(1)：快排要 O(log n) 递归栈；IV 稳定性：插入稳定、快排不稳定。四条全中，选 <b>D</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
