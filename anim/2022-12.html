<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-12 平均CPI与CPU执行时间</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>主频 <code>1 GHz</code>，程序 P 共执行 <code>10000</code> 条指令：80% 每条需 <b>1 个</b>时钟周期，20% 每条需 <b>10 个</b>时钟周期。求<b>平均 CPI</b> 和 <b>CPU 执行时间</b>。考点：CPI 按条数占比加权 + 时间单位换算。</p>' },
  { title: '加权求平均 CPI', cls: '',
    body: '<p>CPI 的权重是<b>指令条数占比</b>：<code>CPI = 80% × 1 + 20% × 10 = 0.8 + 2 = 2.8</code>。注意不是 (1+10)/2 = 5.5——快的指令占八成，平均结果自然偏向 1。</p>' },
  { title: '算总时钟周期数', cls: '',
    body: '<p><code>总周期数 = 指令条数 × CPI = 10000 × 2.8 = 28000</code> 个时钟周期。</p>' },
  { title: '主频换算出 1 个周期多长', cls: '',
    body: '<p>1 GHz = 每秒 <code>10^9</code> 个周期 → <b>1 个时钟周期 = 1 ns</b>。</p>' },
  { title: '得 CPU 执行时间', cls: 'good',
    body: '<p><code>CPU 时间 = 28000 × 1 ns = 28000 ns = 28 μs</code>。两个空的答案：<b>CPI = 2.8，时间 = 28 μs</b>。</p>' },
  { title: '逐项排除干扰项', cls: '',
    body: '<p><b>B</b>（28, 28 μs）：把总周期 28000 误当成 CPI；<b>C</b>（2.8, 28 ms）：CPI 对，但 28000 ns 是 28 μs 不是 28 ms，单位错；<b>D</b>：两个错都占。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：<code>CPU 时间 = 指令数 × CPI × 时钟周期长</code>，CPI 按<b>指令条数占比</b>加权平均。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-12 · 平均 CPI 与 CPU 执行时间',
  subtitle: '主频 1 GHz · 10000 条指令 · 80% 需 1 周期，20% 需 10 周期',
  counterLabel: '推理步骤',
  intro: '点击「▶ 播放」逐步展开计算推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（2.8，28 μs）',
    html: 'CPI = 0.8×1 + 0.2×10 = <b>2.8</b>；总周期 = 10000×2.8 = 28000，1 个周期 = 1 ns → CPU 时间 = <b>28 μs</b>。易错：把周期数直接平均（权重错了）、ns 与 ms 换算错。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
