<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-14 IEEE754单精度表示</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
<style>
.aw-box.amber{ background:#f8edcb; border-color:#e07a2f; color:#92400e; }
.aw-box.blue{ background:#d9e3df; border-color:#1b3a4b; color:#1b3a4b; }
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 32 位小格条（每格 20px，从左到右是位 31 ~ 位 0）
function bitRow(bits, cls){
  var row = '<div class="aw-cells" style="--cell:20px;--gap:2px">';
  for (var i = 0; i < 32; i++){
    var c = (cls && cls[i]) ? ' ' + cls[i] : '';
    var lbl = (i === 0) ? '31' : (i === 8 ? '23' : (i === 31 ? '0' : ''));
    row += '<div class="aw-col"><div class="aw-ptr"></div>' +
           '<div class="aw-box' + c + '" style="font-size:11px;border-radius:5px">' + (bits && bits[i] != null ? bits[i] : '') + '</div>' +
           '<div class="aw-idx">' + lbl + '</div></div>';
  }
  return row + '</div>';
}

// 分段标签行：S(1) 阶码(8) 尾数(23)
function segRow(){
  return '<div style="display:flex;width:max-content;font-size:11px;color:#586e72;margin:2px 0 2px">' +
         '<div style="width:22px;text-align:center;color:#e07a2f;font-weight:700">S</div>' +
         '<div style="width:176px;text-align:center;color:#1b3a4b;font-weight:700">阶码 E（8 位）</div>' +
         '<div style="width:506px;text-align:center;color:#2f9e44;font-weight:700">尾数 M（23 位）</div></div>';
}

// 十六进制结果行：8 格
function hexRow(chars, cls){
  var idx = ['31~28','27~24','23~20','19~16','15~12','11~8','7~4','3~0'];
  var row = '<div class="aw-cells">';
  for (var i = 0; i < 8; i++){
    row += '<div class="aw-col"><div class="aw-ptr"></div>' +
           '<div class="aw-box' + (cls && cls[i] ? ' ' + cls[i] : '') + '">' + chars[i] + '</div>' +
           '<div class="aw-idx">' + idx[i] + '</div></div>';
  }
  return row + '</div>';
}

function note(t){
  return '<div class="aw-row-label" style="margin-top:8px">' + t + '</div>';
}

// 各步的 32 位填充状态：[bits, cls]
var DIM32 = [];
for (var i = 0; i < 32; i++) DIM32.push('dim');
var S1B = ['1'], S1C = ['hit'];
var E_BITS = ['0','1','1','1','1','1','0','1'];
var M_BITS = ['1','1','0'];
var FULLB = ['1'].concat(E_BITS).concat(M_BITS);
for (i = 0; i < 20; i++) FULLB.push('0');

function cls32(k){
  // k: 已点亮到哪个环节 1=S 2=E 3=M
  var c = DIM32.slice();
  if (k >= 1) c[0] = 'hit';
  if (k >= 2) for (var j = 1; j <= 8; j++) c[j] = 'blue';
  if (k >= 3) for (j = 9; j <= 31; j++) c[j] = 'ok';
  return c;
}
var HEXQ = ['?','?','?','?','?','?','?','?'];
var HEXA = ['B','E','E','0','0','0','0','0'];
var HEXC = ['ok','ok','ok','ok','ok','ok','ok','ok'];

function stage(inner){
  return '<div class="aw-scroll"><div style="width:max-content;min-width:100%">' + inner + '</div></div>';
}

var snaps = [
  { cls:'step', tag:'目标', count:0,
    log:'目标：把 -0.4375 写成 IEEE 754 单精度（1 符号 + 8 阶码 + 23 尾数）。',
    html: stage(note('<b>IEEE 754 单精度</b>：32 位 = 符号 S（1 位）+ 阶码 E（8 位，偏置 127）+ 尾数 M（23 位）。先算出各段，再拼位。') + segRow() + bitRow(null, DIM32) + note('十六进制结果（拼好后逐组转换）') + hexRow(HEXQ)),
    ribbon:{k:1, ok:true} },
  { cls:'step', tag:'化二进制', count:1,
    log:'0.4375 = 1/4 + 1/8 + 1/16 = 0.0111（二进制），所以 -0.4375 = -0.0111。',
    html: stage(note('<b>十进制小数 → 二进制</b>：按 2 的负幂拆：0.4375 = 0.25 + 0.125 + 0.0625 = <code>0.0111</code>；负数先记下符号，数值为 <code>-0.0111</code>。') + segRow() + bitRow(null, DIM32) + note('十六进制结果') + hexRow(HEXQ)),
    ribbon:{k:2, ok:true} },
  { cls:'shift', tag:'规格化', count:2,
    log:'规格化：-0.0111 = -1.11 × 2^(-2)，阶码真值 -2，尾数小数部分 11。',
    html: stage(note('<b>规格化</b>：小数点右移 2 位 → <code>-1.11 × 2^(-2)</code>。得到：<b>阶码真值 = -2</b>，<b>尾数 = 1.11</b>（整数位 1 隐藏）。') + segRow() + bitRow(null, DIM32) + note('十六进制结果') + hexRow(HEXQ)),
    ribbon:{k:3, ok:true} },
  { cls:'ok', tag:'填符号位', count:3,
    log:'负数 → 符号位 S = 1（位 31 点亮）。',
    html: stage(note('<b>符号位 S</b>：负数 → <code>S = 1</code>。') + segRow() + bitRow(FULLB, cls32(1)) + note('十六进制结果') + hexRow(HEXQ)) },
  { cls:'ok', tag:'填阶码', count:4,
    log:'阶码 E = -2 + 127 = 125 = 0111 1101（位 30~23 点亮）。',
    html: stage(note('<b>阶码 E</b>：真值 -2 加偏置 127 = <b>125</b> = <code>0111 1101</code>（移码，8 位填入位 30~23）。') + segRow() + bitRow(FULLB, cls32(2)) + note('十六进制结果') + hexRow(HEXQ)) },
  { cls:'ok', tag:'填尾数', count:5,
    log:'尾数 M = 隐藏 1 后的小数部分 11，补 0 到 23 位（位 22~0 点亮）。',
    html: stage(note('<b>尾数 M</b>：规格化后的整数位 1 是隐含位，不存；只存小数点后的 <code>11</code>，后补 20 个 0，共 23 位。') + segRow() + bitRow(FULLB, cls32(3)) + note('十六进制结果') + hexRow(HEXQ)) },
  { cls:'shift', tag:'拼接完成', count:6,
    log:'32 位拼好：1011 1110 1110 0000 0000 0000 0000 0000。',
    html: stage(note('<b>拼接</b>：<code>1 | 01111101 | 11000000000000000000000</code> = <code>1011 1110 1110 0000 0000 0000 0000 0000</code>。') + segRow() + bitRow(FULLB, cls32(3)) + note('十六进制结果') + hexRow(HEXQ)),
    ribbon:{k:4, ok:true} },
  { cls:'ok', tag:'转十六进制', count:7,
    log:'每 4 位一组：1011→B，1110→E，1110→E，其余为 0 → BEE0 0000H。',
    html: stage(note('<b>按 4 位一组转十六进制</b>：<code>1011</code>→B、<code>1110</code>→E、<code>1110</code>→E、其余组全 0 → <b>BEE0 0000H</b>。') + segRow() + bitRow(FULLB, cls32(3)) + note('十六进制结果') + hexRow(HEXA, HEXC)),
    ribbon:{k:5, ok:true} },
  { cls:'done', tag:'结论', count:8, done:true,
    log:'对照选项：BEE0 0000H 是选项 A → 答案 A。',
    html: stage(note('<b>对照选项</b>：<b>BEE0 0000H</b> = 选项 <b>A</b>。干扰项：<b>B/C</b>（BF60/BF70 0000H）的阶码是 126（真值 -1）——小数点只右移了 1 位，规格化移位数错；<b>D</b>（C0E0 0000H）的阶码是 129（真值 +2）——丢光了小数点后的前导 0，把 0.4375 当成 <code>111</code> 规格化成 <code>1.11 × 2^2</code>。') + segRow() + bitRow(FULLB, cls32(3)) + note('十六进制结果') + hexRow(HEXA, HEXC)) },
];

AW.init({
  title: '2022-14 · -0.4375 的 IEEE 754 单精度表示',
  subtitle: '1 符号 + 8 阶码（偏置 127）+ 23 尾数 · 规格化 -1.11 × 2^(-2)',
  counterLabel: '转换进度',
  ribbonTitle: '转换环节（✓ 完成）',
  intro: '点击「▶ 播放」逐步点亮 32 个位格。',
  snaps: snaps,
  result: {
    big: '答案 A（BEE0 0000H）',
    html: 'S=1，E = -2 + 127 = <b>125</b> = <code>0111 1101</code>，M = <code>11</code> 后补零 → <b>BEE0 0000H</b>。易错：丢小数的前导 0（错成 C0E0 0000H）、规格化只移一位（错成 BF60/BF70）、阶码忘加偏置 127、把隐含的整数位 1 也存进尾数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
