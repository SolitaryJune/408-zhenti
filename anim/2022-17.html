<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-17 DRAM内存条辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>内存条 = <b>8 个</b> <code>8192 × 8192 × 8 位</code> DRAM 芯片，按字节编址，支持突发传送，总线宽 <b>64 位</b>，每芯片有一个行缓冲区。问<b>不正确</b>的叙述。</p>' },
  { title: 'A：容量 512 MB', cls: 'good',
    body: '<p>单芯片：<code>8192 × 8192 × 8 位 = 2^13 × 2^13 × 8 位 = 2^26 字节 = 64 MB</code>。<br>8 个芯片：<code>64 MB × 8 = 512 MB</code>。<b>正确</b>。</p>' },
  { title: 'B：多模块交叉编址', cls: 'good',
    body: '<p>每芯片数据宽度 8 位，8 芯片并行：8 × 8 位 = <b>64 位</b>，正好凑成 64 位总线的一次访存；连续地址轮流分布在不同芯片上，属多模块交叉编址。<b>正确</b>。</p>' },
  { title: 'C：地址引脚 26 位', cls: 'bad',
    body: '<p>DRAM 为省引脚，<b>行、列地址分时复用</b>同一组引脚（RAS/CAS 先后送入）：行 8192 = <code>2^13</code>，列 8192 = <code>2^13</code> → 地址引脚只需 <b>13 个</b>，不是 26 个。<b>不正确</b>——这就是要选的答案。</p>' },
  { title: 'D：行缓冲 8192 × 8 位', cls: 'good',
    body: '<p>芯片每次选中<b>一整行</b>，把一行 8192 个存储单元（每个 8 位）读入行缓冲，供突发方式快速连续取数，大小正是 <code>8192 × 8 位</code>。<b>正确</b>。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：DRAM 行列地址<b>分时复用</b>，地址引脚数 = max(行数, 列数) 的位数 = 13；SRAM 才需要全宽地址引脚。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-17 · DRAM 内存条：容量、交叉编址、地址引脚、行缓冲',
  subtitle: '8 个 8192×8192×8 位 DRAM 芯片 · 64 位总线 · 找不正确项',
  counterLabel: '分析步骤',
  intro: '点击「▶ 播放」逐项核对四个叙述。',
  snaps: snaps,
  result: {
    big: '答案 C（地址引脚 13 位而非 26 位）',
    html: '单芯片 <code>2^26 字节 = 64 MB</code>，8 片 = <b>512 MB</b>（A 对）；8 × 8 位凑成 64 位总线、交叉编址（B 对）；行缓冲 = 一整行 <code>8192 × 8 位</code>（D 对）；DRAM 行列地址<b>分时复用</b>，引脚只需 <b>13 个</b> → C 不正确。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
