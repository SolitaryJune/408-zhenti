<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-18 ISA规定的内容</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>问哪些属于 <b>ISA（指令集体系结构）</b>规定的内容。判断标准：ISA 是<b>软件与硬件的交界面</b>——汇编程序员/编译器能看见、要依赖的才由 ISA 规定；电路怎么实现的不算。</p>' },
  { title: 'I. 指令字格式和指令类型 → 属于', cls: 'good',
    body: '<p>有哪些指令类型、指令怎么编码（定长/变长、字段划分），是汇编程序员直接面对的东西，<b>由 ISA 规定</b>。✓</p>' },
  { title: 'II. CPU 的时钟周期 → 不属于', cls: 'bad',
    body: '<p>时钟周期/主频是<b>实现层</b>的参数：同一个 ISA 可以有 2 GHz 也可以有 3 GHz 的实现，程序行为不变。✗</p>' },
  { title: 'III. 通用寄存器个数和位数 → 属于', cls: 'good',
    body: '<p>通用寄存器组是<b>体系结构状态</b>：有几个寄存器、每个多少位，指令要直接编号使用，必须由 ISA 规定。✓</p>' },
  { title: 'IV. 加法器的进位方式 → 不属于', cls: 'bad',
    body: '<p>行波进位还是先行进位是 ALU 内部<b>电路实现</b>，对软件完全透明，ISA 管不着。✗</p>' },
  { title: '结论', cls: 'good',
    body: '<p>属于 ISA 的是 <b>I、III</b> → 答案选 <b>B</b>（仅 I、III）。记忆锚点：<b>程序员可见 = ISA，电路怎么搭 = 实现</b>；换实现而程序行为不变的内容都不属于 ISA。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-18 · 哪些内容由 ISA 规定',
  subtitle: 'I 指令格式与类型 · II 时钟周期 · III 寄存器个数位数 · IV 加法器进位方式',
  counterLabel: '分析步骤',
  intro: '点击「▶ 播放」逐条判断是否属于 ISA。',
  snaps: snaps,
  result: {
    big: '答案 B（仅 I、III）',
    html: 'ISA = 软硬件交界面：<b>指令字格式和类型（I）</b>、<b>通用寄存器个数和位数（III）</b>是程序员可见的，属 ISA；<b>时钟周期（II）</b>、<b>加法器进位方式（IV）</b>是实现细节，不属 ISA。误把 II、IV 算进去就选错 A/D。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
