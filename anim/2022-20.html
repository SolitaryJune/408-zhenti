<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-20 源程序到可执行文件</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>问把<b>高级语言源程序</b>变成<b>可执行目标文件</b>的主流程。四个候选顺序，考的只是各阶段先来后到与产物。</p>' },
  { title: '① 预处理', cls: '',
    body: '<p>预处理器处理 <code>#include</code>（头文件展开）、<code>#define</code>（宏替换）、删注释等，输出 <code>.i</code> 文件。它是第一步。</p>' },
  { title: '② 编译', cls: '',
    body: '<p>编译器做词法/语法/语义分析与优化，把源程序翻译成<b>汇编代码</b>，输出 <code>.s</code> 文件。注意：编译的产物是汇编级的。</p>' },
  { title: '③ 汇编', cls: '',
    body: '<p>汇编器把汇编代码逐条翻译成<b>机器指令</b>，输出 <code>.o</code> 可重定位目标文件。它排在编译之后——汇编器的输入正是编译的输出。</p>' },
  { title: '④ 链接', cls: 'good',
    body: '<p>链接器把多个 <code>.o</code> 与库文件合并，做符号解析与地址重定位，生成<b>可执行目标文件</b>。它的输入是 .o，必然排在汇编之后、位于最后。</p>' },
  { title: '逐项排除', cls: '',
    body: '<p><b>B/D</b>：把汇编放在编译前——汇编器的输入（汇编代码）还没生成，不成立；<b>C</b>：链接插在汇编前——链接的输入（.o 文件）还没生成，不成立。只有 <b>预处理 → 编译 → 汇编 → 链接</b> 顺畅。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>预 → 编 → 汇 → 链</b>； gcc 一条命令背后就是这四步，每一步的产物 <code>.i → .s → .o → 可执行</code>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-20 · 源程序到可执行文件的四个阶段',
  subtitle: '预处理 / 编译 / 汇编 / 链接 · 排序题',
  counterLabel: '分析步骤',
  intro: '点击「▶ 播放」逐步排定四个阶段。',
  snaps: snaps,
  result: {
    big: '答案 A（预处理 → 编译 → 汇编 → 链接）',
    html: '每步产物链：<code>.i → .s → .o → 可执行文件</code>。编译在前、汇编在后（汇编吃编译的汇编代码），链接最后（吃 .o 与库）。把汇编提前或把链接插到汇编前都断了产物链。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
