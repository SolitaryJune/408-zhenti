<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-21 中断I/O方式辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>关于<b>中断 I/O 方式</b>的四个叙述，找<b>不正确</b>的。先想它的骨架：CPU 启动外设后去干别的 → 外设备好数据发中断 → CPU 进中断服务程序，用 I/O 指令取数。</p>' },
  { title: 'A：适合键盘、针式打印机', cls: 'good',
    body: '<p>键盘、针式打印机这类<b>字符型设备</b>中低速、数据量小、时机随机——正好用中断方式，CPU 不必轮询空等。<b>正确</b>。</p>' },
  { title: 'B：数据传送通过软件完成', cls: 'good',
    body: '<p>取数靠 CPU <b>执行中断服务程序</b>（I/O 指令逐个传送），是软件行为；靠专用硬件通路传送的是 DMA。<b>正确</b>。</p>' },
  { title: 'D：外设准备期间 CPU 可跑其他进程', cls: 'good',
    body: '<p>CPU 启动外设后转去运行其他进程，外设备好后用中断把 CPU 拉回来——<b>CPU 与外设并行</b>正是中断方式的核心优点。<b>正确</b>。</p>' },
  { title: 'C：准备时间 < 中断处理时间 → 错', cls: 'bad',
    body: '<p>关系<b>说反了</b>。要 CPU 服务完一次中断后下一个数据刚好备好，必须：外设<b>准备数据的时间 &gt; 中断处理时间</b>。若外设准备得比 CPU 处理还快，CPU 服务不过来，数据会覆盖/丢失，中断方式失效。<b>不正确</b>——选它。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：中断 I/O 三对一错——设备合适（中低速字符型）、软件传送、CPU 并行；约束是<b>准备时间大于处理时间</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-21 · 中断 I/O 方式辨析',
  subtitle: '适用设备 · 软件传送 · CPU 并行 · 准备时间与处理时间的关系',
  counterLabel: '分析步骤',
  intro: '点击「▶ 播放」逐项核对四个叙述。',
  snaps: snaps,
  result: {
    big: '答案 C（准备时间应大于中断处理时间）',
    html: '中断 I/O：<b>适合中低速字符型设备</b>（A 对）、传送由<b>中断服务程序软件</b>完成（B 对）、外设准备数据时 <b>CPU 可运行其他进程</b>（D 对）。C 方向说反：外设准备数据时间应<b>大于</b>中断处理时间，否则 CPU 来不及取，数据丢失。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
