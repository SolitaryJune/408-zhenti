<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-22 并行处理技术辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>四个叙述涉及 <b>Flynn 分类</b>（SISD/SIMD/MISD/MIMD）、<b>硬件多线程</b>、<b>SMP</b>。找<b>不正确</b>的。</p>' },
  { title: 'A：多核 = MIMD', cls: 'good',
    body: '<p>多核处理器每个核都独立取指、执行<b>各自的指令流</b>，处理<b>不同的数据流</b>——多个指令流 × 多个数据流，是最典型的 <b>MIMD</b>。<b>正确</b>。</p>' },
  { title: 'B：向量处理器 = SIMD', cls: 'good',
    body: '<p>一条向量指令同时对一批数据分量做运算：单个指令流驱动多个数据流 = <b>SIMD</b>。<b>正确</b>。</p>' },
  { title: 'D：SMP 共享单一物理地址空间', cls: 'good',
    body: '<p>对称多处理机 SMP：所有处理器地位对等，通过<b>共享主存</b>（单一物理地址空间）通信。<b>正确</b>。</p>' },
  { title: 'C：硬件多线程"只可用于多核" → 错', cls: 'bad',
    body: '<p>硬件多线程（SMT/超线程）是在<b>一个核内</b>给多个线程各配一套体系结构状态（PC、寄存器组），共享执行部件以掩盖停顿——<b>不需要多核</b>，单核照样能用；多核 + 多线程也能叠加。「只可用于多核」说法错误，选它。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：多核 = MIMD、向量机 = SIMD、SMP 共享单一物理地址空间；<b>硬件多线程是核内技术</b>，单核可用。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-22 · 并行处理技术辨析',
  subtitle: 'Flynn 分类 · 硬件多线程 · SMP · 找不正确项',
  counterLabel: '分析步骤',
  intro: '点击「▶ 播放」逐项核对四个叙述。',
  snaps: snaps,
  result: {
    big: '答案 C（硬件多线程并非只可用于多核）',
    html: '<b>多核 = MIMD</b>（A 对）、<b>向量处理器 = SIMD</b>（B 对）、<b>SMP 共享单一物理地址空间</b>（D 对）。硬件多线程是<b>单核内</b>的多线程支持（一套执行部件、多套体系结构状态），单核可用、多核可叠加——「只可用于多核」错误。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
