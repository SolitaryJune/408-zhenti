<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-26 · 银行家算法安全性检查演示</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

/* 题 26 图数据：尚需资源数 Need；可用资源 Available=(1,3,2) */
var NAMES = ['P0', 'P1', 'P2'];
var NEED = { P0: [0, 2, 1], P1: [1, 2, 3], P2: [0, 1, 3] };

var availRow, needRows, markEls, seqA, seqB;

function fillSeq(row, names, filled){
  for (var j = 0; j < 3; j++){
    var d = row.children[j];
    if (j < filled){
      d.textContent = names[j];
      d.style.background = '#2f9e4424'; d.style.borderColor = '#2f9e44'; d.style.color = '#1e4d33';
    } else {
      d.textContent = '';
      d.style.background = '#f8edcb'; d.style.borderColor = '#5a7d8c66'; d.style.color = '#b9cbd0';
    }
  }
}

function paint(st){
  for (var j = 0; j < 3; j++){
    var d = availRow.children[j];
    d.textContent = String(st.avail[j]);
    if (st.availHi === j){ d.className = 'aw-box hit'; }
    else if (st.availSet){ d.className = 'aw-box ok'; }
    else { d.className = 'aw-box'; }
  }
  for (var r = 0; r < 3; r++){
    var m = st.marks[r];
    for (var c = 0; c < 3; c++){
      var b = needRows[r][c];
      b.textContent = String(NEED[NAMES[r]][c]);
      if (m === 'hit'){ b.className = 'aw-box hit'; }
      else if (m === 'ok' || m === 'miss'){ b.className = 'aw-box ok'; }
      else { b.className = 'aw-box'; }
    }
    markEls[r].innerHTML = m === 'ok' ? '✓ 可满足' : (m === 'miss' ? '✗ 不满足' : '—');
    markEls[r].style.color = m === 'ok' ? '#276942' : (m === 'miss' ? '#a02830' : '#b9cbd0');
  }
  fillSeq(seqA, st.seqA, st.filledA);
  fillSeq(seqB, st.seqB, st.filledB);
}

AW.init({
  title: '银行家算法安全性检查（2022-26）',
  subtitle: 'Available = (1, 3, 2) · Need：P0(0,2,1)、P1(1,2,3)、P2(0,1,3) · 数安全序列',
  counterLabel: '已检查',
  ribbonTitle: '检查序号（✓ 可满足 / ✗ 不满足）',
  intro: '点击「▶ 播放」，逐步执行安全性检查，数出安全序列个数。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');

    var avWrap = AW.el('div', '');
    avWrap.style.display = 'flex';
    avWrap.style.alignItems = 'center';
    avWrap.style.gap = '8px';
    avWrap.appendChild(AW.el('div', 'aw-row-label', '<b>可用资源 Available</b>'));
    availRow = AW.cellRow(['1', '3', '2'], ['', '', ''], null, 1);
    availRow.style.margin = '0';
    avWrap.appendChild(availRow);
    avWrap.appendChild(AW.el('div', 'aw-row-label', '（判定条件：Need 三个分量都 ≤ Available）'));
    inner.appendChild(avWrap);

    inner.appendChild(AW.el('div', 'aw-row-label',
      '<b>各进程尚需资源 Need</b>（绿色 = 满足判定，红色标记 = 本步在查）'));
    needRows = [];
    markEls = [];
    for (var r = 0; r < 3; r++){
      var line = AW.el('div', '');
      line.style.display = 'flex';
      line.style.alignItems = 'center';
      line.style.gap = '8px';
      line.style.margin = '6px 0';
      line.appendChild(AW.el('div', 'aw-row-label', '<b>' + NAMES[r] + '</b>'));
      var cells = [];
      var row = AW.el('div', 'aw-cells');
      row.style.margin = '0';
      for (var c = 0; c < 3; c++){
        var col = AW.el('div', 'aw-col');
        var b = AW.el('div', 'aw-box', String(NEED[NAMES[r]][c]));
        col.appendChild(b);
        col.appendChild(AW.el('div', 'aw-idx', ['A', 'B', 'C'][c]));
        row.appendChild(col);
        cells.push(b);
      }
      line.appendChild(row);
      var mk = AW.el('div', 'aw-row-label', '—');
      mk.style.fontWeight = '700';
      line.appendChild(mk);
      markEls.push(mk);
      needRows.push(cells);
      inner.appendChild(line);
    }

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>安全序列①</b>（P0→P1→P2）'));
    seqA = AW.el('div', 'aw-cells');
    for (var j1 = 0; j1 < 3; j1++){
      var s1 = AW.el('div', 'aw-box', '');
      s1.style.width = '64px';
      seqA.appendChild(s1);
    }
    inner.appendChild(seqA);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>安全序列②</b>（P0→P2→P1）'));
    seqB = AW.el('div', 'aw-cells');
    for (var j2 = 0; j2 < 3; j2++){
      var s2 = AW.el('div', 'aw-box', '');
      s2.style.width = '64px';
      seqB.appendChild(s2);
    }
    inner.appendChild(seqB);

    wrap.appendChild(inner);
    stage.appendChild(wrap);
    paint({ avail: [1, 3, 2], availSet: false, availHi: null,
            marks: ['', '', ''], seqA: [], seqB: [], filledA: 0, filledB: 0 });
  },

  snaps: [
    { cls: 'shift', tag: '开始',
      st: { avail: [1, 3, 2], availSet: false, availHi: null,
            marks: ['', '', ''], seqA: [], seqB: [], filledA: 0, filledB: 0 },
      log: '初始：可用资源 Available=(1,3,2)；三进程尚需 Need：P0=(0,2,1)、P1=(1,2,3)、P2=(0,1,3)。开始安全性检查',
      count: 0 },
    { cls: 'ok', tag: '查 P0',
      st: { avail: [1, 3, 2], availSet: true, availHi: null,
            marks: ['hit', '', ''], seqA: [], seqB: [], filledA: 0, filledB: 0 },
      log: '检查 P0：Need(0,2,1) 的三个分量 0≤1、2≤3、1≤2 都满足 → P0 可立即运行（此刻唯一可行的进程）',
      count: 1, ribbon: { k: 1, ok: true } },
    { cls: 'miss', tag: '查 P1',
      st: { avail: [1, 3, 2], availSet: true, availHi: null,
            marks: ['ok', 'hit', ''], seqA: [], seqB: [], filledA: 0, filledB: 0 },
      log: '检查 P1：Need(1,2,3) 的 C 分量 3 大于可用 C 2 → 不满足，P1 必须等待',
      count: 2, ribbon: { k: 2, ok: false } },
    { cls: 'miss', tag: '查 P2',
      st: { avail: [1, 3, 2], availSet: true, availHi: null,
            marks: ['ok', 'miss', 'hit'], seqA: [], seqB: [], filledA: 0, filledB: 0 },
      log: '检查 P2：Need(0,1,3) 的 C 分量 3 大于 2 → 也不满足 → 安全序列第 1 位只能是 P0',
      count: 3, ribbon: { k: 3, ok: false } },
    { cls: 'shift', tag: 'P0 完成',
      st: { avail: [3, 3, 3], availSet: true, availHi: null,
            marks: ['ok', 'miss', 'miss'], seqA: ['P0'], seqB: ['P0'], filledA: 1, filledB: 1 },
      log: 'P0 运行完成，归还全部已分配 (2,0,1)：Available (1,3,2)+(2,0,1)=(3,3,3)。P0 记入安全序列第 1 位',
      count: 3 },
    { cls: 'ok', tag: '再查 P1',
      st: { avail: [3, 3, 3], availSet: true, availHi: null,
            marks: ['ok', 'hit', 'miss'], seqA: ['P0'], seqB: ['P0'], filledA: 1, filledB: 1 },
      log: '再查 P1：Need(1,2,3) 的分量 1≤3、2≤3、3≤3 → 满足 ✓',
      count: 4, ribbon: { k: 4, ok: true } },
    { cls: 'ok', tag: '再查 P2',
      st: { avail: [3, 3, 3], availSet: true, availHi: null,
            marks: ['ok', 'ok', 'hit'], seqA: ['P0'], seqB: ['P0'], filledA: 1, filledB: 1 },
      log: '再查 P2：Need(0,1,3) 的分量 0≤3、1≤3、3≤3 → 也满足 ✓ → 后两位 P1→P2 或 P2→P1 都可行',
      count: 5, ribbon: { k: 5, ok: true } },
    { cls: 'ok', tag: '排序列',
      st: { avail: [3, 3, 3], availSet: true, availHi: null,
            marks: ['ok', 'ok', 'ok'], seqA: ['P0', 'P1', 'P2'], seqB: ['P0', 'P2', 'P1'],
            filledA: 3, filledB: 3 },
      log: '得到两个安全序列：① P0→P1→P2　② P0→P2→P1',
      count: 5 },
    { cls: 'done', tag: '完成',
      st: { avail: [3, 3, 3], availSet: true, availHi: null,
            marks: ['ok', 'ok', 'ok'], seqA: ['P0', 'P1', 'P2'], seqB: ['P0', 'P2', 'P1'],
            filledA: 3, filledB: 3 },
      log: '共 2 个安全序列，系统处于安全状态 → 答案 B',
      count: 5, done: true },
  ],

  render: function(stage, sn, i){
    paint(sn.st);
  },

  result: {
    big: '2 个（答案 B）',
    html: '安全序列 <b>P0→P1→P2</b> 与 <b>P0→P2→P1</b>。记忆点：判定用<b>尚需量 Need</b>；C 类资源只剩 2 个，P1、P2 各尚需 3 个，首位只能排 P0；P0 归还 (2,0,1) 后 Available 变 (3,3,3)，P1、P2 都满足 → 两种先后顺序都安全，共 <b>2</b> 个。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
