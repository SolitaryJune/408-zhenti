<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-28 · 执行态变阻塞态的判断</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：执行态 → 阻塞态 还是 → 就绪态', cls: 'key',
    body: '<p>核心区分：进程<b>等 CPU</b> → 就绪态；进程<b>等 CPU 之外的某事件</b>（I/O 完成、资源可用、信号量通知）→ 阻塞态。题目问「可能导致」，逐项核对 I~IV。</p>' },
  { title: 'I 读文件 → 阻塞', cls: 'good',
    body: '<p>文件在磁盘上，读文件要<b>启动 I/O 并等待数据到达</b>，进程在此期间无法推进 → 执行态变<b>阻塞态</b>。计入。</p>' },
  { title: 'II 时间片用完 → 只变就绪', cls: 'bad',
    body: '<p>时间片用完是被剥夺 CPU，进程<b>没有等待任何事件</b>，转<b>就绪态</b>排队等下次调度，不进阻塞态。排除。</p>' },
  { title: 'III 申请外设 → 阻塞', cls: 'good',
    body: '<p>外设可能正被其他进程占用，<b>申请不到就必须等待</b>该设备空闲 → 执行态变阻塞态。计入。</p>' },
  { title: 'IV 执行 wait() → 可能阻塞', cls: 'good',
    body: '<p>wait() 在<b>信号量值不足</b>（资源不可用）时，进程自我阻塞、挂到该信号量的等待队列 → 可能转阻塞态。题目只问「可能导致」，计入。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>I、III、IV 可能导致执行态→阻塞态，II 只会导致执行态→就绪态 → 答案选 <b>D（仅 I、III、IV）</b>。记忆锚点：<b>等 CPU → 就绪；等别的事件 → 阻塞</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '执行态变为阻塞态的判断（2022-28）',
  subtitle: '考点：三状态转换 · 就绪（等 CPU）与阻塞（等事件）的区别',
  counterLabel: '已推演',
  ribbonTitle: '推理环节（✓ 环节闭环）',
  intro: '点击「▶ 播放」，逐项核对 I~IV 是否可能导致执行态→阻塞态。',
  snaps: snaps,
  result: {
    big: '答案 D（仅 I、III、IV）',
    html: '记忆锚点：<b>等 CPU → 就绪；等别的事件 → 阻塞</b>。读文件（I/O）、申请外设（资源忙）、wait()（信号量不足）都在等 CPU 之外的事件 → 阻塞；时间片用完只等 CPU → 就绪。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
