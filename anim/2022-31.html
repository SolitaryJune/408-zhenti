<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-31 · 系统调用过程中软硬件分工</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：硬件自动完成 vs OS 软件完成', cls: 'key',
    body: '<p>系统调用流程：传递参数 → 执行<b>陷入（trap）指令</b> → 转内核态执行<b>服务例程</b> → 返回。判别标准：这件事有没有<b>现成的硬件机制</b>自动完成。</p>' },
  { title: 'I 保存断点和程序状态字 → 硬件完成', cls: 'bad',
    body: '<p>执行陷入指令后，<b>硬件（中断/异常机构）</b>自动保存断点（PC）和程序状态字（PSW），不经过软件 → 不是操作系统完成。</p>' },
  { title: 'IV 将 CPU 模式改为内核态 → 硬件完成', cls: 'bad',
    body: '<p>陷入指令执行时，由<b>硬件</b>自动把 CPU 从用户态切到内核态；OS 只能在已经处于内核态时执行内核代码 → 不是操作系统完成。</p>' },
  { title: 'II 保存通用寄存器的内容 → OS 完成', cls: 'good',
    body: '<p>硬件只保存断点与 PSW；<b>通用寄存器的现场</b>由操作系统按自己的约定保存（入栈或存入 PCB）→ <b>由 OS 完成</b>。</p>' },
  { title: 'III 执行系统调用服务例程 → OS 完成', cls: 'good',
    body: '<p>服务例程就是<b>内核代码</b>，根据调用号分派并由操作系统执行 → <b>由 OS 完成</b>。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>由 OS 完成的是 <b>II、III</b> → 答案选 <b>B</b>。记忆锚点：<b>断点/PSW/切态归硬件，寄存器现场与服务例程归 OS</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '系统调用过程中软硬件的分工（2022-31）',
  subtitle: '考点：陷入机制硬件自动动作 vs 操作系统软件动作',
  counterLabel: '已推演',
  ribbonTitle: '推理环节（✓ 环节闭环）',
  intro: '点击「▶ 播放」，逐项判定 I~IV 的完成者。',
  snaps: snaps,
  result: {
    big: '答案 B（仅 II、III）',
    html: '记忆锚点：保存<b>断点和 PSW</b>、用户态切内核态由<b>硬件</b>自动完成；保存<b>通用寄存器现场</b>与执行<b>系统调用服务例程</b>由<b>操作系统</b>完成。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
