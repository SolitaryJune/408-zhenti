<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-34 概念辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     2022-34：无噪声信道 + 4 幅值 ASK → 奈奎斯特定理求最大速率
     形态：逐步揭示计算推理链卡片。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：选哪个定理？',
    cls: 'key',
    body: '<p>关键词一：<b>无噪声信道</b> → 用<b>奈奎斯特定理</b>；香农定理需要<b>信噪比 S/N</b>，题目没给，套它就是方向性错误。关键词二：<b>4 个幅值的 ASK</b> → 码元状态数 M = 4。</p>' },
  { title: '每个码元携带多少比特',
    cls: 'step',
    body: '<p>一个码元有 4 种幅值状态，携带的信息量 = <code>log2(4) = 2 bit</code>。即 1 个码元 = 2 比特。</p>' },
  { title: '奈奎斯特公式',
    cls: 'step',
    body: '<p>理想无噪声信道极限数据率：<code>C = 2W · log2(M)</code>（bit/s），其中 W 为带宽（Hz）。</p>' },
  { title: '代入计算',
    cls: 'good',
    body: '<p>W = 200 kHz，M = 4：<code>C = 2 × 200k × 2 = 800 kbps</code>。其中 <code>2W = 400k Baud</code> 是<b>码元速率</b>上限，还要乘上每码元 2 bit。</p>' },
  { title: '排除干扰项 B：400 kbps',
    cls: 'bad',
    body: '<p>B（400 kbps）：只算了 <code>2W = 400k</code> 的波特率，<b>忘了乘 log2(M)</b>——把码元速率当成了数据率。</p>' },
  { title: '排除干扰项 A / D',
    cls: 'bad',
    body: '<p>A（200 kbps）：把带宽原样当速率，无根据。<b>D（1600 kbps）</b>：把 <code>log2(4)</code> 算成 4（相当于按 M = 16 算），或乱套香农公式——香农定理要求<b>有噪声、给信噪比</b>，本题两者都不满足。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C（800 kbps）</b>。记忆锚点：<b>无噪声 → 奈奎斯特 C = 2W·log2(M)</b>；有噪声且给信噪比 → 香农。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-34：无噪声信道 + 4 幅值 ASK 的最大数据率',
  subtitle: '带宽 <code>200 kHz</code> · 调制状态数 <code>M = 4</code> · 奈奎斯特定理',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开计算推理链。',
  snaps: snaps,
  result: {
    big: '800 kbps（选 C）',
    html: 'C = 2W·log2(M) = 2 × 200k × 2 = <b>800 kbps</b>。两大失分点：把 <b>2W 的波特率</b>当数据率（选 B）；<b>无噪声信道硬套香农</b>（选 D 的常见来源）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
