<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-36 概念辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     2022-36：由路由器接口 192.168.1.62/27 推 H 的掩码与默认网关
     形态：逐步揭示推理链卡片。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：同一子网 ⇒ 同一掩码',
    cls: 'key',
    body: '<p>图上主机 H 通过交换机接在路由器接口 <code>192.168.1.62/27</code> 所在网段。<b>同一子网内的所有主机与路由器接口必须使用相同的子网掩码</b>——所以 H 的掩码就是该接口的 /27，网关就是该接口的 IP。</p>' },
  { title: '/27 换算成点分十进制',
    cls: 'good',
    body: '<p>/27 = 27 个 1 ＋ 5 个 0：<code>11111111.11111111.11111111.11100000</code> = <b>255.255.255.224</b>。掩码为 255.255.255.192 的选项 A、B 直接排除。</p>' },
  { title: 'H 落在哪个子网？',
    cls: 'step',
    body: '<p>/27 块大小 = 32：子网依次是 <code>.0</code>、<code>.32</code>、<code>.64</code>、<code>.96</code>……H 的地址 192.168.1.<b>60</b> 落在 <code>192.168.1.32/27</code>（主机范围 .33–.62，广播地址 .63）。</p>' },
  { title: '默认网关 = 同子网的路由器接口 IP',
    cls: 'good',
    body: '<p>H 发往外网的分组要交给同网段的<b>路由器接口</b>，即图中标注的 <code>192.168.1.62</code>——它与 H 同属 192.168.1.32/27，可达。</p>' },
  { title: '排除干扰项：网关 192.168.1.1',
    cls: 'bad',
    body: '<p>选项 A/C 的网关 192.168.1.1 属于子网 <code>192.168.1.0/27</code>，而 H 在 <code>192.168.1.32/27</code>——<b>不同子网，H 无法直接使用</b>。"网关是子网第一个地址"是错误直觉。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>：子网掩码 <b>255.255.255.224</b>（/27），默认网关 <b>192.168.1.62</b>。记忆点：掩码抄路由器接口的前缀，网关抄路由器接口的 IP。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-36：主机 H 的子网掩码与默认网关',
  subtitle: '拓扑：H — 交换机 — 路由器接口 <code>192.168.1.62/27</code> · H 的 IP = <code>192.168.1.60</code>',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '掩码 <b>255.255.255.224</b>（同子网同掩码）＋ 网关 <b>192.168.1.62</b>（同子网路由器接口 IP）。H（.60）落在 192.168.1.32/27，网关 .1 在另一个子网 .0/27 里，不可用。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
