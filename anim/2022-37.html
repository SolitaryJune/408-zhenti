<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-37 概念辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     2022-37：SDN 控制器向数据平面交换机下发流表 → 南向接口
     形态：逐步揭示推理链卡片。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：控制器 ↔ 谁？',
    cls: 'key',
    body: '<p>题干：SDN 控制器向<b>数据平面的 SDN 交换机</b><b>下发流表</b>。SDN 分三层：应用层（网络应用）— 控制层（SDN 控制器）— 数据层（SDN 交换机）。接口以<b>控制器为中心</b>按方位命名：控制器跟谁通信，就往那个方向叫。</p>' },
  { title: '北向接口：控制器 ↔ 上层应用',
    cls: 'step',
    body: '<p><b>北向接口</b>：控制器向<b>上层网络应用</b>开放能力（北向 API）。方向是"向上"，服务对象是应用，不是交换机。</p>' },
  { title: '南向接口：控制器 ↔ 数据层设备',
    cls: 'good',
    body: '<p><b>南向接口</b>：控制器与<b>下方数据平面的转发设备</b>（SDN 交换机）之间的接口，典型协议是 <b>OpenFlow</b>。控制器向交换机<b>下发流表</b>、收集链路状态，走的正是南向接口。</p>' },
  { title: '东向 / 西向：干扰项',
    cls: 'bad',
    body: '<p>东向、西向接口不是「控制器—交换机」这条线的考点（东向多见于与传统网管系统/其他系统对接的说法）。本题考点只有南北向。</p>' },
  { title: '方向口诀锁定',
    cls: 'step',
    body: '<p>交换机在控制器的<b>下方</b>（数据平面）。<b>上北下南</b>：向下通信 = 南向 → 下发流表用<b>南向接口</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B（南向接口）</b>。记忆锚点：<b>控制器管应用走北向、管交换机（下发流表）走南向</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2022-37：SDN 下发流表用哪个接口？',
  subtitle: '考点：<code>SDN 体系结构 · 南向/北向接口</code> · 方位记忆法',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B（南向接口）',
    html: 'SDN 控制器 ↔ 数据平面交换机之间是<b>南向接口</b>（OpenFlow），下发流表走这里；控制器 ↔ 上层应用是<b>北向接口</b>。口诀：<b>上北下南</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
