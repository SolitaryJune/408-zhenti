<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-41 顺序存储二叉树的 BST 判定</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

/* 题面数据：T1 是 BST（返回 true），T2 不是（返回 false） */
var A1 = ['40', '25', '60', '-1', '30', '-1', '80', '-1', '-1', '27'];
var A2 = ['40', '50', '60', '-1', '30', '-1', '-1', '-1', '-1', '-1', '35'];

/* 每步操作：t=激活的树(0 两棵/1=T1/2=T2)
   init=初始化 pmin/pmax；k/p=当前检查的下标与其双亲；arr+idx+val=传播更新；fin/fail=收尾 */
var UPD = [
  null,
  { t: 0, init: true },
  { t: 1, k: 9,  p: 4, arr: 'min', idx: 4, val: '27' },
  { t: 1, k: 6,  p: 2, arr: 'max', idx: 2, val: '80' },
  { t: 1, k: 4,  p: 1, arr: 'max', idx: 1, val: '30' },
  { t: 1, k: 2,  p: 0, arr: 'max', idx: 0, val: '80' },
  { t: 1, k: 1,  p: 0, arr: 'min', idx: 0, val: '25' },
  { t: 1, fin: true },
  { t: 2, sw: true },
  { t: 2, k: 10, p: 4, arr: 'max', idx: 4, val: '35' },
  { t: 2, k: 4,  p: 1, fail: true },
  { t: 0, fin: true },
];

var g1 = [], g2 = [];   // 每棵树 3 行（数组值 / pmin / pmax）的 cellRow

function makeRows(stage, inner, header, base){
  inner.appendChild(AW.el('div', 'aw-row-label', header));
  var rows = [];
  var labels = ['<b>数组 SqBiTNode</b>', '<b>pmin（子树最小）</b>', '<b>pmax（子树最大）</b>'];
  for (var r = 0; r < 3; r++){
    inner.appendChild(AW.el('div', 'aw-row-label', labels[r]));
    var cells = [];
    for (var j = 0; j < base.length; j++) cells.push('');
    var row = AW.cellRow(cells, cells, null, 1);
    // 题目口径：数组下标从 0 开始，覆盖默认序号
    for (var j2 = 0; j2 < base.length; j2++){
      row.children[j2].children[2].textContent = String(j2);
    }
    inner.appendChild(row);
    rows.push(row);
  }
  return rows;
}

function paintGroup(rows, base, dmin, dmax, mode, u){
  var n = base.length, j;
  var isCur = !!(u && u.k != null);
  for (j = 0; j < n; j++){
    var bA = rows[0].children[j].children[1];
    var bN = rows[1].children[j].children[1];
    var bX = rows[2].children[j].children[1];
    bA.textContent = base[j];
    bN.textContent = dmin[j];
    bX.textContent = dmax[j];
    var clsA, clsN, clsX;
    if (mode === 'dim'){
      clsA = clsN = clsX = ' dim';
    } else {
      clsA = base[j] === '-1' ? ' dim' : '';
      clsN = dmin[j] === '-1' ? ' dim' : '';
      clsX = dmax[j] === '-1' ? ' dim' : '';
      if (isCur){
        if (j === u.k || j === u.p) clsA = u.fail ? ' miss' : ' hit';
        if (!u.fail && u.arr === 'min' && j === u.idx) clsN = ' hit';
        if (!u.fail && u.arr === 'max' && j === u.idx) clsX = ' hit';
      } else if (u && (u.init || u.fin)){
        if (base[j] !== '-1') clsA = ' ok';
        if (dmin[j] !== '-1') clsN = ' ok';
        if (dmax[j] !== '-1') clsX = ' ok';
      }
    }
    bA.className = 'aw-box' + clsA;
    bN.className = 'aw-box' + clsN;
    bX.className = 'aw-box' + clsX;
  }
}

function paint(i){
  var d1min = A1.slice(), d1max = A1.slice();
  var d2min = A2.slice(), d2max = A2.slice();
  for (var s = 1; s <= i; s++){
    var u = UPD[s];
    if (u && u.val != null){
      var arr = (u.t === 1) ? (u.arr === 'min' ? d1min : d1max)
                            : (u.arr === 'min' ? d2min : d2max);
      arr[u.idx] = u.val;
    }
  }
  var u2 = UPD[i] || {};
  var act = u2.t || 0;
  paintGroup(g1, A1, d1min, d1max, act === 0 || act === 1 ? 'norm' : 'dim', act === 1 ? u2 : (act === 0 ? u2 : null));
  paintGroup(g2, A2, d2min, d2max, act === 0 || act === 2 ? 'norm' : 'dim', act === 2 ? u2 : (act === 0 ? u2 : null));
}

AW.init({
  title: '顺序存储二叉树的 BST 判定（2022-41）',
  subtitle: '双亲 <code>⌊(k−1)/2⌋</code> · 左孩子 <code>2k+1</code> · 右孩子 <code>2k+2</code> · 左子树最大值须 &lt; 双亲，右子树最小值须 &gt; 双亲',
  counterLabel: '已检查下标',
  intro: '点击「▶ 播放」：先在 T1 上完整走一遍（true），再在 T2 上看抓错（false）。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    g1 = makeRows(stage, inner, '<b>示例 T1</b>（是 BST，ElemNum=10，下标 0～9）', A1);
    g2 = makeRows(stage, inner, '<b>示例 T2</b>（不是 BST，ElemNum=11，下标 0～10）', A2);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    paint(0);
  },
  snaps: [
    { cls: 'shift', tag: '开始',      log: '顺序存储规则：下标 k 的左孩子是 2k+1、右孩子是 2k+2、双亲 ⌊(k−1)/2⌋；空位存 −1。BST 的要害：左子树最大值 < 双亲、右子树最小值 > 双亲', count: 0 },
    { cls: 'step',  tag: '初始化',    log: 'pmin[k] = pmax[k] = SqBiTNode[k]：先认为每棵子树的最小/最大值就是结点自己', count: 0 },
    { cls: 'ok',    tag: 'T1·k=9',   log: 'k=9（值 27，是 4 号 30 的左孩子）：要求 30 > pmax[9]=27，成立 ⇒ 传播最小值 pmin[4]=27', count: 1 },
    { cls: 'ok',    tag: 'T1·k=6',   log: 'k=6（值 80，是 2 号 60 的右孩子）：要求 60 < pmin[6]=80，成立 ⇒ 传播最大值 pmax[2]=80', count: 2 },
    { cls: 'ok',    tag: 'T1·k=4',   log: 'k=4（值 30，是 1 号 25 的右孩子）：要求 25 < pmin[4]=27（已含 27 的信息），成立 ⇒ pmax[1]=30', count: 3 },
    { cls: 'ok',    tag: 'T1·k=2',   log: 'k=2（值 60，是 0 号 40 的右孩子）：要求 40 < pmin[2]=60，成立 ⇒ pmax[0]=80', count: 4 },
    { cls: 'ok',    tag: 'T1·k=1',   log: 'k=1（值 25，是 0 号 40 的左孩子）：要求 40 > pmax[1]=30（含 30、27），成立 ⇒ pmin[0]=25', count: 5 },
    { cls: 'ok',    tag: 'T1 通过',  log: '扫描到 k=0 停止（循环条件 k > 0），T1 所有检查通过 ⇒ 返回 true，T1 是 BST', count: 5 },
    { cls: 'shift', tag: '换 T2',    log: 'T2 数组 [40,50,60,-1,30,-1,…,-1,35]，ElemNum=11。pmin/pmax 已初始化，看两处要害', count: 5 },
    { cls: 'ok',    tag: 'T2·k=10',  log: 'k=10（值 35，是 4 号 30 的右孩子）：要求 30 < pmin[10]=35，成立 ⇒ pmax[4]=35', count: 6 },
    { cls: 'miss',  tag: 'T2·k=4',   log: 'k=4（值 30，是 1 号 50 的右孩子）：要求 50 < pmin[4]=30？50 ≥ 30 不成立 ⇒ 右子树里出现了比双亲小的值，返回 false！', count: 6 },
    { cls: 'done',  tag: '完成',     log: '结论：T1 true、T2 false。自底向上每个下标只查一次 ⇒ 时间 O(n)；pmin、pmax 两个辅助数组 ⇒ 空间 O(n)', count: 6, done: true },
  ],
  render: function(stage, sn, i){ paint(i); },
  result: {
    big: '时间 O(n) · 空间 O(n)',
    html: '辅助数组 <code>pmin/pmax</code> 记录各子树的最小/最大值，<b>从最后一个下标向 1 倒序</b>检查并向上传播：左孩子比 <code>pmax</code>、右孩子比 <code>pmin</code>，任一失败立即返回 false。T1 全部通过（true）；T2 在 k=4 抓到 50 右子树里有 30（false）。只看“双亲与直接孩子”会漏判——必须比整棵子树的最值。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
