<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2022-43 单总线数据通路五问解析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
.sigchip{
  display:inline-block; background:#d9e3df; border:1.5px solid #1b3a4b; color:#1b3a4b;
  border-radius:8px; padding:4px 10px; font-size:12.5px; font-weight:700;
  font-family:Menlo,Consolas,monospace; margin-right:6px;
}
.sigchip.off{ background:#f8edcb; border-color:#1b3a4b26; color:#5a7d8c66; }
.sigchip.amber{ background:#f8edcb; border-color:#e07a2f; color:#92400e; }
.cycbadge{
  display:inline-block; background:#1b3a4b; color:#fbbf24; border-radius:8px;
  padding:3px 10px; font-size:12.5px; font-weight:700; margin-left:6px;
}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 取指信号序列条：lit = 已点亮的信号个数（0~5），cyc = 累计周期
function seqRow(lit, cyc){
  var names = ['PCout', 'MARin', 'Read', 'MDRout', 'IRin'];
  var row = '<div style="margin:4px 0 2px">';
  for (var i = 0; i < names.length; i++){
    var c = 'sigchip';
    if (i < lit) c += (i === 2 ? ' amber' : '');
    else c += ' off';
    row += '<span class="' + c + '">' + names[i] + '</span>';
    if (i === 1 || i === 2) row += '<span style="color:#b9cbd0;font-size:13px"> → </span>';
  }
  if (cyc != null) row += '<span class="cycbadge">累计 ' + cyc + ' 周期</span>';
  return row + '</div>';
}

var STEPS = [
  { title: '总览：单总线数据通路的 5 问', cls: 'key',
    body: '<p>题 43 图是<b>单总线</b> CPU：内部总线串起 MAR/MDR/PC/IR/Y/Z/ALU/GPRs，虚线是控制信号。逐问攻破：①标志表达式 ②Y/Z 的作用 ③GPRs 的端口 ④取指序列与周期 ⑤CU 的输入。</p>' },
  { title: '问 1：符号标志 SF', cls: '',
    body: '<p>FR 的符号标志直接抄 ALU 结果的符号位：<code>SF = F15</code>。溢出标志 OF 则要看<b>操作数符号与结果符号</b>的组合，见后两步。</p>' },
  { title: '问 1：加法溢出 OF', cls: 'good',
    body: '<p>加法只有两种溢出情形：<b>正 + 正 = 负</b>、<b>负 + 负 = 正</b>：<br><code>OF = ¬A15·¬B15·F15 + A15·B15·¬F15</code>（¬X 表示取反，· 为与，+ 为或）</p>' },
  { title: '问 1：减法溢出 OF', cls: 'good',
    body: '<p>减法 A-B 的溢出情形：<b>正 - 负 = 负</b>、<b>负 - 正 = 正</b>：<br><code>OF = ¬A15·B15·F15 + A15·¬B15·¬F15</code><br>注意 B15 不取反——减一个数相当于加其相反数，符号组合与加法不同。</p>' },
  { title: '问 2：Y 与 Z 的作用', cls: '',
    body: '<p>单总线<b>同一时刻只能传一个数据</b>。一次运算要"两进一出"共三次过总线：<br><b>Y</b>：先锁存 ALU 的一个输入操作数，腾出总线再送第二个操作数；<br><b>Z</b>：锁存 ALU 的输出 F，等总线空闲再 <code>Zout</code> 送上总线。没有它们总线就会撞车。</p>' },
  { title: '问 3：GPRs 的端口', cls: '',
    body: '<p><code>rs</code>、<code>rd</code> 各 4 位 → 最多 <code>2^4 = 16</code> 个通用寄存器；二者都是指令里的寄存器编号字段，来自 <b>IR</b>。<br><b>读</b>：多路选择器按 rs 选中一个寄存器输出；<b>写</b>：地址译码器产生唯一选中信号 → <b>rd 应连接地址译码器</b>。</p>' },
  { title: '问 4：第 1 步 PCout, MARin', cls: '',
    body: '<p>取指令：先把 PC 的内容经内部总线送 MAR，并由 MAR 向主存送地址。<br>' + seqRow(2, 1) + '本步 <b>1 个时钟周期</b>（总线传一次数据）。</p>' },
  { title: '问 4：第 2 步 Read', cls: 'shift',
    body: '<p>发<b>主存读命令</b>，等待主存把指令读出并送入 MDR。<br>' + seqRow(3, 6) + '题目给出这一步需 <b>5 个时钟周期</b>。</p>' },
  { title: '问 4：第 3 步 MDRout, IRin', cls: '',
    body: '<p>MDR 中的指令经内部总线写入 IR。<br>' + seqRow(5, 7) + '本步 <b>1 个时钟周期</b>。取指阶段（不计 PC 增量）共 <b>1 + 5 + 1 = 7 个时钟周期</b>。</p>' },
  { title: '问 5：控制信号的产生与 CU 输入', cls: '',
    body: '<p>图中虚线控制信号都由<b>控制部件 CU</b>（控制单元）产生。CU 要知道<b>当前执行哪条指令</b>、<b>运算结果的状态</b>，所以图中 <b>IR 与 FR</b> 的输出连到 CU 的输入端。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>要点汇总：<code>SF = F15</code>；加/减 OF 表达式（见第 3、4 步）；Y 存 ALU 输入、Z 存 ALU 输出；16 个寄存器、rd 接地址译码器；取指序列 <code>PCout,MARin → Read → MDRout,IRin</code> 共 <b>7</b> 周期；控制信号由 <b>CU</b> 产生，<b>IR、FR</b> 接其输入。</p>' },
];

// 每步手工配置：tag / ribbon（问 1~5 分别在对应步骤点亮 ✓）
var META = [
  { tag: '总览',   ribbon: null },
  { tag: '问 1',   ribbon: null },
  { tag: '问 1',   ribbon: null },
  { tag: '问 1',   ribbon: { k: 1, ok: true } },
  { tag: '问 2',   ribbon: { k: 2, ok: true } },
  { tag: '问 3',   ribbon: { k: 3, ok: true } },
  { tag: '问 4',   ribbon: null },
  { tag: '问 4',   ribbon: null },
  { tag: '问 4',   ribbon: { k: 4, ok: true } },
  { tag: '问 5',   ribbon: { k: 5, ok: true } },
  { tag: '结论',   ribbon: null },
];

var snaps = STEPS.map(function(s, i){
  var m = META[i];
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: m.tag,
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (m.ribbon) sn.ribbon = m.ribbon;
  return sn;
});

AW.init({
  title: '2022-43 · 单总线数据通路五问解析',
  subtitle: '标志表达式 · 暂存器 Y/Z · GPRs 端口 · 取指序列 7 周期 · CU 输入',
  counterLabel: '解析步骤',
  ribbonTitle: '问题（✓ 已解）',
  intro: '点击「▶ 播放」逐问解析，并看取指阶段信号序列。',
  snaps: snaps,
  result: {
    big: '取指阶段至少 7 个时钟周期',
    html: '① <code>SF = F15</code>；加法 <code>OF = ¬A15·¬B15·F15 + A15·B15·¬F15</code>，减法 <code>OF = ¬A15·B15·F15 + A15·¬B15·¬F15</code>；② Y 暂存 ALU 输入、Z 暂存 ALU 输出（单总线一次传一个数）；③ 16 个寄存器，rs/rd 来自 IR，rd 接<b>地址译码器</b>；④ <code>PCout,MARin(1) → Read(5) → MDRout,IRin(1) = 7 周期</code>；⑤ 控制信号由 <b>CU</b> 产生，<b>IR 与 FR</b> 接其输入。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
