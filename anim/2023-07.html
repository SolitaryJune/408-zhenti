<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-07 · B 树四条性质逐条判断</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：B 树与 B+ 树的根本区别',
    cls: 'key',
    body: '<p>B 树：关键字分布在<b>所有结点</b>上，查找可中途命中；插入先落终端结点、溢出分裂上移。B+ 树：关键字全在叶、查找必到叶。四条叙述要用这套规则逐条检验。</p>' },
  { title: 'I. 插入可能增加树的高度 —— 对',
    cls: 'good',
    body: '<p>插入先落进终端结点；关键字超上限就<b>分裂</b>、中间关键字上移到父结点。分裂若一路传到根，就<b>新建根结点</b>，树高 +1。平时多数插入不增高，所以是「<b>可能</b>」增高——说法准确。</p>' },
  { title: 'II. 删除一定导致叶（终端）结点变化 —— 对',
    cls: 'good',
    body: '<p>删终端结点关键字：终端结点直接变。删<b>非终端结点</b>关键字：必须拿它的<b>前驱/后继</b>（一定在终端结点里）替换过来再删——终端结点同样变了。借位、合并也都在终端结点之间发生。任何情形终端结点都变，「一定」成立。</p>' },
  { title: 'III. 查找某关键字总是要查找到叶结点 —— 错',
    cls: 'bad',
    body: '<p>B 树关键字遍布各层，<b>途中命中即停</b>；只有查找失败（或找插入位置）才走到终端结点。「必到叶」是 <b>B+ 树</b>的特征，张冠李戴。</p>' },
  { title: 'IV. 插入的新关键字最终位于叶结点中 —— 错',
    cls: 'bad',
    body: '<p>新关键字确实先进终端结点，但分裂会把部分关键字<b>上移</b>到父结点甚至根——最终位置<b>未必</b>在叶。同样是 B+ 树才有的性质。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>对的是 I、II，答案选 <b>B</b>（仅 I、II）。记忆锚点：<b>B 树查找可半路停、插入会上浮；B+ 树一切必到叶</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2023-07 · 非空 B 树的四条叙述哪条对？',
  subtitle: 'I 插入可能增高　II 删除必变终端结点　III 查找必到叶　IV 新关键字最终在叶',
  intro: '点击「▶ 播放」逐条推演。',
  snaps: snaps,
  result: {
    big: '答案 B（仅 I、II）',
    html: 'I 对：分裂传到根时<b>新建根、树高 +1</b>（只是可能）。II 对：删终端结点直接变，删非终端结点要用<b>终端结点里的前驱/后继替换</b>，终端结点必变。III、IV 错：「必到叶」「新关键字留在叶」是 <b>B+ 树</b>的性质，B 树途中命中即停、分裂会上移关键字。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
