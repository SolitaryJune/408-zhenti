<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-10 · 哪些排序是不稳定的</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：什么叫不稳定',
    cls: 'key',
    body: '<p>稳定 = 相等元素排序后<b>相对次序不变</b>。判断抓手：算法里有没有「<b>大跨度交换/移动</b>」（远距离对换会跨越相等元素）；有没有「同分同序」的收集机制。</p>' },
  { title: 'I. 希尔排序 —— 不稳定 ✓（入选）',
    cls: 'good',
    body: '<p>按增量分组做插入排序：相等的元素可能被分进<b>不同的增量组</b>，各组独立移动后，两者的前后次序可能被颠倒。不稳定，入选。</p>' },
  { title: 'II. 归并排序 —— 稳定（不选）',
    cls: 'bad',
    body: '<p>合并两个有序段时，遇到相等元素<b>先取左段</b>即可保持原次序；归并没有大跨度跳跃移动。稳定，不入选。</p>' },
  { title: 'III. 快速排序 —— 不稳定 ✓（入选）',
    cls: 'good',
    body: '<p>Partition 的交换 / 挖坑填充是<b>大跨度移动</b>，相等元素可能被换到枢轴的另一侧，次序被打乱。不稳定，入选。</p>' },
  { title: 'IV. 堆排序 —— 不稳定 ✓（入选）',
    cls: 'good',
    body: '<p>建堆与调整中的「堆顶 ↔ 堆尾」交换也是<b>大跨度</b>移动，相等元素的相对次序会被打乱。不稳定，入选。</p>' },
  { title: 'V. 基数排序 —— 稳定（不选）',
    cls: 'bad',
    body: '<p>按关键字位<b>分桶收集</b>：「先来先收」保证同桶内相对次序不变，多趟分配正是靠这种稳定性逐位继承成果。稳定，不入选。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>不稳定的是 <b>I、III、IV</b>，答案选 <b>C</b>。记忆锚点：不稳定四兄弟「<b>快些选堆</b>」——快排、希尔、简单选择、堆排（简单选择本题没列，同样不稳定）。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2023-10 · 五种排序算法，哪些不稳定？',
  subtitle: 'I 希尔　II 归并　III 快速　IV 堆　V 基数 · 稳定性逐项判定',
  intro: '点击「▶ 播放」逐项推演。',
  snaps: snaps,
  result: {
    big: '答案 C（仅 I、III、IV）',
    html: '不稳定：<b>希尔（跨组移动）、快速（Partition 大跨度交换）、堆（堆顶堆尾大跨度交换）</b>；稳定：归并（先取左段）、基数（先来先收）。口诀「<b>快些选堆</b>」不稳定——快排、希尔、简单选择、堆排，简单选择本题未列但同样不稳。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
