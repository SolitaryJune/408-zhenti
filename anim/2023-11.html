<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-11 · 一次划分后的枢轴是谁？</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var SEQ = [68, 11, 70, 23, 80, 77, 48, 81, 93, 88];

/* 每个位置（1-based）的检查结果：null=未检查；数组=该位置作为候选时各格配色 */
function verdictClasses(k){
  if (k == null){ return null; }
  var cand = SEQ[k - 1];
  var cls = [];
  for (var i = 0; i < SEQ.length; i++){
    if (i === k - 1){ cls.push('shift'); continue; }
    if (i < k - 1){ cls.push(SEQ[i] <= cand ? 'ok' : 'miss'); }
    else { cls.push(SEQ[i] >= cand ? 'ok' : 'miss'); }
  }
  return cls;
}

var STATES = [
  { k:null, note:'快速排序一次划分结束时，枢轴落在最终位置：左侧全部 ≤ 枢轴，右侧全部 ≥ 枢轴。逐个位置验证。' },
  { k:1,  note:'候选 68：右侧 11 ＜ 68，违反 → 不是枢轴。' },
  { k:2,  note:'候选 11：左侧 68 ＞ 11，违反 → 不是枢轴。' },
  { k:3,  note:'候选 70：右侧 48 ＜ 70，违反 → 不是枢轴。' },
  { k:4,  note:'候选 23：左侧 70 ＞ 23，违反 → 不是枢轴。' },
  { k:5,  note:'候选 80：右侧 77、48 ＜ 80，违反 → 不是枢轴。' },
  { k:6,  note:'候选 77：左侧 80 ＞ 77，违反 → 不是枢轴。' },
  { k:7,  note:'候选 48：左侧 80 ＞ 48，违反 → 不是枢轴。' },
  { k:8,  note:'候选 81：左侧 68,11,70,23,80,77,48 全部 ≤ 81；右侧 93,88 全部 ≥ 81 → 枢轴！' },
  { k:9,  note:'候选 93：右侧 88 ＜ 93，违反 → 不是枢轴。' },
  { k:10, note:'候选 88：左侧 93 ＞ 88，违反 → 不是枢轴。' },
  { k:8,  note:'结论：只有第 8 位 81 两侧同时满足 → 该次划分的枢轴是 81，答案 D。' },
];

function stageHTML(st){
  var cls = verdictClasses(st.k);
  if (st.final){ cls = null; }
  var h = '<div class="aw-row-label"><b>一次划分后的序列</b>（琥珀=当前候选；绿=满足该侧条件；红=违反）</div>';
  h += '<div class="aw-cells">';
  var ptrMap = {};
  if (st.k != null){ ptrMap[st.k] = '候选'; }
  for (var i = 0; i < SEQ.length; i++){
    var c = '';
    if (st.final){
      c = (i === 7) ? ' hit' : ' dim';
    } else if (cls){
      c = ' ' + cls[i];
    }
    h += '<div class="aw-col"><div class="aw-ptr">' + (ptrMap[i + 1] || '') + '</div>' +
         '<div class="aw-box' + c + '">' + SEQ[i] + '</div>' +
         '<div class="aw-idx">' + (i + 1) + '</div></div>';
  }
  h += '</div>';
  h += '<div class="aw-row-label" style="font-size:14px;color:#1b3a4b">' + st.note + '</div>';
  return h;
}

var snaps = STATES.map(function(st, i){
  var last = i === STATES.length - 1;
  var tagArr = ['规则','检查 68','检查 11','检查 70','检查 23','检查 80','检查 77','检查 48','检查 81','检查 93','检查 88','完成'];
  var clsArr = ['shift','miss','miss','miss','miss','miss','miss','miss','ok','miss','miss','done'];
  var logArr = [
    '枢轴判定规则：左全部 ≤ 它 且 右全部 ≥ 它',
    '第 1 位 68：右侧 11 ＜ 68 ✗',
    '第 2 位 11：左侧 68 ＞ 11 ✗',
    '第 3 位 70：右侧 48 ＜ 70 ✗',
    '第 4 位 23：左侧 70 ＞ 23 ✗',
    '第 5 位 80：右侧 77、48 ＜ 80 ✗',
    '第 6 位 77：左侧 80 ＞ 77 ✗',
    '第 7 位 48：左侧 80 ＞ 48 ✗',
    '第 8 位 81：左全部 ≤ 81 且右全部 ≥ 81 ✓',
    '第 9 位 93：右侧 88 ＜ 93 ✗',
    '第 10 位 88：左侧 93 ＞ 88 ✗',
    '只有 81 满足 → 枢轴是 81，答案 D'
  ];
  var sn = {
    cls: clsArr[i], tag: tagArr[i], log: logArr[i], count: Math.max(0, Math.min(i, 10)),
    html: stageHTML({ k: st.k, final: last, note: st.note }), done: last,
  };
  if (i >= 1 && i <= 10){ sn.ribbon = { k: i, ok: i === 8 }; }
  return sn;
});

AW.init({
  title: '2023-11 · 快排一次划分后，枢轴是谁？',
  subtitle: '划分结果 <code>68, 11, 70, 23, 80, 77, 48, 81, 93, 88</code> · 枢轴满足左 ≤ 它 ≤ 右',
  counterLabel: '已检查位置',
  ribbonTitle: '各位置（✓ 可为枢轴 / ✗ 不满足）',
  intro: '点击「▶ 播放」逐个位置验证枢轴条件。',
  snaps: snaps,
  result: {
    big: '枢轴 = 81（答案 D）',
    html: '一次划分后枢轴位于<b>最终位置</b>：左侧全部 ≤ 81（68,11,70,23,80,77,48），右侧全部 ≥ 81（93,88）。其余位置至少一侧违反——70、80 都倒在右侧的 48 上。技巧：从左往右扫，找到第一个「左全 ≤ 且右全 ≥」的位置即枢轴。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
