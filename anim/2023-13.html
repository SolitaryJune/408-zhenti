<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-13 short 型 -8190 的机器数（补码）</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
.aw-box.sm{ font-size:15px; }
.aw-box.amber{ background:#f8edcb; border-color:#e07a2f; color:#92400e; }
.bitlbl{ width:74px; text-align:right; margin-right:8px; padding-top:12px; font-size:13px; color:#213e48; font-weight:700; flex:0 0 auto; }
.bitnote{ margin-left:82px; font-size:13px; color:#213e48; line-height:1.7; margin-top:2px; }
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function bitRow(label, bits, cls, noteHtml){
  var row = '<div style="display:flex;align-items:flex-start;margin:6px 0">';
  row += '<div class="bitlbl">' + label + '</div>';
  row += '<div class="aw-cells" style="--cell:40px;--gap:3px">';
  for (var i = 0; i < 16; i++){
    var c = (cls && cls[i]) ? ' ' + cls[i] : '';
    row += '<div class="aw-col"><div class="aw-ptr"></div>' +
           '<div class="aw-box sm' + c + '">' + bits.charAt(i) + '</div>' +
           '<div class="aw-idx">' + (15 - i) + '</div></div>';
  }
  row += '</div></div>';
  if (noteHtml) row += '<div class="bitnote">' + noteHtml + '</div>';
  return row;
}

function dim16(){ var a = []; for (var i = 0; i < 16; i++) a.push('dim'); return a; }
function amber0(){ var a = []; for (var i = 0; i < 16; i++) a.push(i === 0 ? 'amber' : ''); return a; }

function tip(t){
  return '<div style="display:inline-block;background:#f8edcb;border:1.5px solid #1b3a4b26;border-radius:10px;padding:6px 12px;font-size:14px;line-height:1.8;color:#213e48;margin-bottom:4px">' + t + '</div>';
}

var M_ABS  = '0001111111111110'; // 8190
var M_YUAN = '1001111111111110'; // 原码 9FFE
var M_FAN  = '1110000000000001'; // 反码 E001
var M_BU   = '1110000000000010'; // 补码 E002

var snaps = [
  { cls:'step', tag:'审题', count:0,
    log:'x = -8190，short 16 位，求机器数（C 语言整型按补码存储）。',
    html: tip('<b>short 为 16 位</b>，x = <code>-8190</code>。负数在机器里按<b>补码</b>存储，先从 |x| 入手。') +
      bitRow('机器数', '????????????????', dim16(), '16 位都未知，逐步推出。') },
  { cls:'step', tag:'求 |x|', count:1, ribbon:{k:1, ok:true},
    log:'|x| = 8190 = 8192 − 2 = 1FFE H → 0001 1111 1111 1110。',
    html: tip('<code>8190 = 8192 − 2</code>，十六进制 <code>1FFE H</code>：') +
      bitRow('|x| = 8190', M_ABS, null, '二进制 0001 1111 1111 1110（这就是 16 位无符号形式）。') },
  { cls:'step', tag:'原码', count:2, ribbon:{k:2, ok:true},
    log:'原码 = 符号位 1 ＋ 尾数（|x| 低 15 位）= 9FFE H。',
    html: tip('负数<b>原码</b>：最高位放符号 <b>1</b>，低 15 位照抄 |x|：') +
      bitRow('|x| = 8190', M_ABS, dim16()) +
      bitRow('原码', M_YUAN, amber0(), '符号位 1（琥珀）＋ 尾数 001 1111 1111 1110 → <code>9FFE H</code>。') },
  { cls:'step', tag:'反码', count:3, ribbon:{k:3, ok:true},
    log:'反码：符号位不变，尾数逐位取反 → E001 H。',
    html: tip('<b>反码</b>：符号位保持 1，尾数 15 位逐位取反：') +
      bitRow('原码', M_YUAN, dim16()) +
      bitRow('反码', M_FAN, amber0(), '001 1111 1111 1110 → 110 0000 0000 0001 → <code>E001 H</code>。') },
  { cls:'shift', tag:'补码', count:4, ribbon:{k:4, ok:true},
    log:'补码 = 反码末位 +1：末位 1+1=10 → 本位 0 → E002 H。',
    html: tip('<b>补码</b> = 反码末位加 1：') +
      bitRow('反码', M_FAN, dim16()) +
      bitRow('补码', M_BU, (function(){ var a = []; for (var i = 0; i < 16; i++) a.push(i === 15 ? 'hit' : ''); return a; })(),
        '末位 1 + 1 = 10，本位留 0、无进位传播 → <code>E002 H</code>。') },
  { cls:'step', tag:'十六进制', count:5, ribbon:{k:5, ok:true},
    log:'按 4 位一组：1110→E、0000→0、0000→0、0010→2 → E002H。',
    html: tip('每 4 位一组写成十六进制：') +
      bitRow('补码', M_BU, null,
        '<code>1110</code>→E · <code>0000</code>→0 · <code>0000</code>→0 · <code>0010</code>→2') +
      '<div style="display:flex;align-items:flex-start;margin:6px 0"><div class="bitlbl">机器数</div><div class="aw-cells">' +
      '<div class="aw-col"><div class="aw-box hit">E</div><div class="aw-idx"></div></div>' +
      '<div class="aw-col"><div class="aw-box hit">0</div><div class="aw-idx"></div></div>' +
      '<div class="aw-col"><div class="aw-box hit">0</div><div class="aw-idx"></div></div>' +
      '<div class="aw-col"><div class="aw-box hit">2</div><div class="aw-idx">H</div></div>' +
      '</div></div>' },
  { cls:'step', tag:'干扰项', count:6,
    log:'B = 忘了 +1（停在反码）；D = 原码；C = 原码又加 1。',
    html: tip('<b>四个选项各对应一步之差：</b><br>' +
      'A <code>E002H</code>：补码，<b>正确</b>；<br>' +
      'B <code>E001H</code>：只做到反码，<b>忘了末位 +1</b>；<br>' +
      'D <code>9FFEH</code>：这是<b>原码</b>——只放了符号位，没做取反加 1；<br>' +
      'C <code>9FFFH</code>：在原码 9FFEH 上又多加了 1，两头都错。') },
  { cls:'done', tag:'结论', count:7, done:true,
    log:'x 的机器数 = E002H → 答案 A。',
    html: tip('<b>结论</b>：-8190 的 16 位补码 = <code>E002 H</code> → 答案 <b>A</b>。<br>校验：<code>2^16 − 8190 = 65536 − 8190 = 57346 = E002H</code> ✓') },
];

AW.init({
  title: '2023-13 · short 型 −8190 的机器数（补码）',
  subtitle: 'x = <code>-8190</code> · 16 位 · 原码 → 反码 → 补码 → 十六进制',
  counterLabel: '转换步骤',
  ribbonTitle: '转换环节（✓ 完成）',
  intro: '点击「▶ 播放」逐位推出补码机器数。',
  snaps: snaps,
  result: {
    big: '答案 A（E002H）',
    html: '路径：<code>8190 = 1FFEH</code> → 原码 <code>9FFEH</code> → 反码 <code>E001H</code> → 末位 +1 → 补码 <code>E002H</code>。干扰项正好是各步之差：B 漏 +1、D 是原码、C 是原码 +1。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
