<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-17 寄存器里是操作数还是地址，靠什么区分</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：一个寄存器，两种可能', cls: 'key',
    body: '<p>指令地址码给出的是<b>寄存器编号</b>。寄存器 R 里可能直接放<b>操作数</b>，也可能放操作数的<b>主存地址</b>。CPU 取操作数前必须先弄清是哪一种——依据是什么？</p>' },
  { title: '两种对应的寻址方式', cls: '',
    body: '<p>放操作数 → <b>寄存器寻址</b>：操作数 = R 的内容；<br>放地址 → <b>寄存器间接寻址</b>：操作数 = M[R 的内容]。<br>同一个寄存器，两种走法，走向由指令里约定的<b>寻址方式</b>决定。</p>' },
  { title: '区分依据：寻址方式字段', cls: 'good',
    body: '<p>指令中除了寄存器编号，还通过寻址方式（字段/操作码约定）告诉 CPU 这次按哪种方式取操作数。<b>CPU 区分的依据 = 操作数的寻址方式</b>。</p>' },
  { title: '排除 B、C、D', cls: '',
    body: '<p><b>B 编码方式</b>：指数据的机器表示（补码等），与取数走法无关；<br><b>C 寄存器编号</b>：只定位用哪个寄存器，定不了内容的含义；<br><b>D 寄存器的内容</b>：一个 32 位值没有「数还是地址」的标记，CPU 正是要判断它，不能自己当自己的依据。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>寄存器寻址 vs 寄存器间接寻址，靠操作数的寻址方式区分</b>。</p>' },
];

var RIBBONS = { 1: { k: 1, ok: true }, 2: { k: 2, ok: true }, 3: { k: 3, ok: true } };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (RIBBONS[i]) sn.ribbon = RIBBONS[i];
  return sn;
});

AW.init({
  title: '2023-17 · 寄存器里是操作数还是地址，靠什么区分',
  subtitle: '地址码 = 寄存器编号 · 寄存器寻址 vs 寄存器间接寻址',
  counterLabel: '推理步骤',
  ribbonTitle: '推理环节（✓ 完成）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（操作数的寻址方式）',
    html: '寄存器里放操作数是<b>寄存器寻址</b>，放地址是<b>寄存器间接寻址</b>；CPU 按指令约定的<b>寻址方式</b>决定走法。编码方式管数据表示、编号只定位寄存器、内容无法自证含义（B/C/D 均错）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
