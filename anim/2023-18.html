<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-18 操作元件与状态元件分类</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两类元件的判据', cls: 'key',
    body: '<p>数据通路元件分两类：<b>操作元件（组合逻辑）</b>——无记忆，输出只由当前输入决定；<b>状态元件（时序逻辑）</b>——有记忆，时钟沿到来才更新并保存状态。<br>候选：I. ALU　II. PC　III. 通用寄存器组 GPRs　IV. 多路选择器 MUX。</p>' },
  { title: 'I. ALU → 操作元件', cls: 'good',
    body: '<p>ALU 对当前输入做算术逻辑运算，没有任何存储，是<b>纯组合逻辑</b> → 操作元件 ✓</p>' },
  { title: 'II. PC → 状态元件', cls: 'bad',
    body: '<p>程序计数器在时钟沿保存「下条指令地址」，典型的<b>有记忆</b>元件 → 状态元件 ✗（不是操作元件）</p>' },
  { title: 'III. GPRs → 状态元件', cls: 'bad',
    body: '<p>通用寄存器组保存各寄存器内容，时钟沿写入、随时读出，是<b>时序逻辑</b> → 状态元件 ✗（不是操作元件）</p>' },
  { title: 'IV. MUX → 操作元件', cls: 'good',
    body: '<p>多路选择器按选择信号从多路输入中选一路输出，不保存任何东西 → <b>组合逻辑</b> → 操作元件 ✓</p>' },
  { title: '核对四个选项', cls: '',
    body: '<p>A 仅 I、II：II（PC）混入状态元件 ✗；<br>B 仅 I、IV：<b>全是操作元件 ✓</b>；<br>C 仅 II、III：两个全是状态元件 ✗；<br>D 仅 I、II、IV：又混入 PC ✗。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>ALU、MUX = 组合逻辑（操作元件）；PC、GPRs、MAR、MDR = 时序逻辑（状态元件）</b>。</p>' },
];

var RIBBONS = { 1: { k: 1, ok: true }, 2: { k: 2, ok: false }, 3: { k: 3, ok: false }, 4: { k: 4, ok: true } };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (RIBBONS[i]) sn.ribbon = RIBBONS[i];
  return sn;
});

AW.init({
  title: '2023-18 · 数据通路中的操作元件与状态元件',
  subtitle: 'I. ALU · II. PC · III. GPRs · IV. MUX —— 谁是操作元件（组合逻辑）',
  counterLabel: '判定步骤',
  ribbonTitle: '元件判定（✓ 操作元件 / ✗ 状态元件）',
  intro: '点击「▶ 播放」逐个判定四个元件。',
  snaps: snaps,
  result: {
    big: '答案 B（仅 I、IV）',
    html: '<b>ALU、MUX</b> 是纯组合逻辑 → 操作元件；<b>PC、GPRs</b> 有记忆、靠时钟沿保存状态 → 状态元件。A/D 混入 PC，C 全是状态元件。同类状态元件还有 MAR、MDR。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
