<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-21 硬件与异常/中断的关系辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：异常与中断是两条线', cls: 'key',
    body: '<p><b>异常（内中断）</b>：由指令执行本身引起（除 0、溢出、缺页、非法操作码）。<br><b>中断（外中断）</b>：由外设请求引起。<br>本题找<b>错误</b>说法，逐项核对。</p>' },
  { title: 'A：异常在指令执行过程中检测 ✓', cls: '',
    body: '<p>除 0、溢出、缺页这类异常都发生在<b>一条指令的执行过程中</b>，CPU 边执行边检测、一旦出现立即转入异常处理 → A 正确。</p>' },
  { title: 'B：中断请求在指令执行完时检测 ✓', cls: '',
    body: '<p>外中断请求随时可能到来，CPU 统一在<b>每条指令执行完后</b>（指令周期末）采样中断请求信号 → B 正确。</p>' },
  { title: 'C：开中断时检测到请求就响应 ✓', cls: '',
    body: '<p>响应中断的前提是<b>允许中断（开中断，IF=1）</b>：开中断状态下检测到请求就进入中断响应过程 → C 正确。</p>' },
  { title: 'D：设备向 CPU 发中断结束信号 ✗', cls: 'bad',
    body: '<p>「中断结束」（EOI）方向是 <b>CPU → 中断控制器 → 外设</b>：服务程序处理完，由 CPU 向中断控制器发中断结束命令，控制器再通知设备。选项把方向<b>说反</b>了 → D 错误，选它。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>请求（设备→CPU）与应答/结束（CPU→设备经中断控制器）方向相反</b>；异常检测在指令过程中，中断采样在指令执行完。</p>' },
];

var RIBBONS = { 1: { k: 1, ok: true }, 2: { k: 2, ok: true }, 3: { k: 3, ok: true }, 4: { k: 4, ok: false } };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (RIBBONS[i]) sn.ribbon = RIBBONS[i];
  return sn;
});

AW.init({
  title: '2023-21 · 硬件与异常/中断的关系辨析',
  subtitle: '异常检测时机 · 中断采样时机 · 中断响应条件 · 中断结束信号方向',
  counterLabel: '辨析步骤',
  ribbonTitle: '选项（✓ 说法正确 / ✗ 说法错误）',
  intro: '点击「▶ 播放」逐项核对四个说法。',
  snaps: snaps,
  result: {
    big: '答案 D（错误的是它）',
    html: 'A 对：异常在<b>指令执行过程中</b>检测；B 对：中断请求在<b>指令执行完</b>采样；C 对：开中断（IF=1）才响应；D 错：<b>中断结束信号由 CPU 经中断控制器发给设备</b>，方向说反了。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
