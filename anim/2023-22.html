<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-22 三种 I/O 控制方式辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：每种方式「谁在干活」', cls: 'key',
    body: '<p>I/O 控制方式的核心区别：<b>查询、中断靠 CPU 执行程序</b>；<b>DMA 靠 DMA 控制器硬件</b>。本题找<b>错误</b>说法。</p>' },
  { title: 'A：查询方式——CPU 执行查询程序 ✓', cls: '',
    body: '<p>查询方式下 CPU 不断执行查询（轮询）程序：读状态寄存器、判就绪、再传数据 → A 正确。</p>' },
  { title: 'B：中断方式——CPU 执行中断服务程序 ✓', cls: '',
    body: '<p>设备就绪后发中断请求，CPU 响应后执行<b>中断服务程序</b>完成 I/O → B 正确。</p>' },
  { title: 'C：DMA 方式——CPU 执行 DMA 传送程序 ✗', cls: 'bad',
    body: '<p>DMA 的数据传送由 <b>DMA 控制器（专用硬件）</b>直接控制主存与设备之间的传送，<b>CPU 不执行传送程序</b>。CPU 只做两头的杂事：<b>初始化</b>（预处理：预置传送字数、主存起始地址、方向并启动）与<b>结束处理</b>。「CPU 执行 DMA 传送程序」是杜撰的 → C 错误，选它。</p>' },
  { title: 'D：SSD、网卡等高速设备用 DMA ✓', cls: '',
    body: '<p>SSD、网络适配器数据量大、速度快，用 DMA 可避免 CPU 逐字干预 → D 正确。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>查询/中断 = CPU 执行程序传数据；DMA = 控制器硬件传数据，CPU 只管初始化与结束处理</b>。</p>' },
];

var RIBBONS = { 1: { k: 1, ok: true }, 2: { k: 2, ok: true }, 3: { k: 3, ok: false }, 4: { k: 4, ok: true } };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (RIBBONS[i]) sn.ribbon = RIBBONS[i];
  return sn;
});

AW.init({
  title: '2023-22 · 三种 I/O 控制方式辨析',
  subtitle: '查询 / 中断 / DMA —— 数据传送阶段「谁在干活」',
  counterLabel: '辨析步骤',
  ribbonTitle: '选项（✓ 说法正确 / ✗ 说法错误）',
  intro: '点击「▶ 播放」逐项核对四个说法。',
  snaps: snaps,
  result: {
    big: '答案 C（错误的是它）',
    html: 'A 对：查询靠 CPU 执行查询程序；B 对：中断靠 CPU 执行中断服务程序；D 对：高速设备用 DMA。C 错：DMA 的数据传送由 <b>DMA 控制器硬件</b>完成，CPU 只做<b>初始化（预处理）和结束处理</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
