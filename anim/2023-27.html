<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-27 执行态→就绪态的转换条件</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：就绪态 = 万事俱备、只缺 CPU',
    cls: 'key',
    body: '<p>执行态 → 就绪态的唯一原因：<b>不缺任何资源，只是暂时没被分配 CPU</b>' +
          '（时间片用完、被抢占、主动出让）。若在「等一个非 CPU 的资源/事件」→ 转<b>阻塞态</b>。按这个标尺逐项检验。</p>' },
  { title: 'A. 键盘输入 —— 在等 I/O，进阻塞',
    cls: 'bad',
    body: '<p>线程等待键盘输入完成，缺的是 <b>I/O 结果</b>，不是 CPU → 转<b>阻塞态</b>。</p>' },
  { title: 'B. 缺页异常 —— 在等调页，进阻塞',
    cls: 'bad',
    body: '<p>访问的页面不在内存，必须等调页 I/O 完成，缺的是<b>页面数据</b> → 转<b>阻塞态</b>。</p>' },
  { title: 'C. 主动出让 CPU —— 不缺资源，进就绪',
    cls: 'good',
    body: '<p>线程什么资源都不缺，只是把 CPU 让给别人，<b>随时可被再次调度</b> → 转<b>就绪态</b>。符合题意。</p>' },
  { title: 'D. 执行 wait() —— 等信号量，进阻塞',
    cls: 'bad',
    body: '<p>资源不足（信号量值不满足）时线程自我阻塞，缺的是<b>临界资源</b> → 转<b>阻塞态</b>。</p>' },
  { title: '结论：答案 C',
    cls: 'good',
    body: '<p>一句话：<b>缺资源（I/O、页面、信号量）→ 阻塞；只缺 CPU → 就绪</b>。' +
          '「主动出让 CPU」是线程自己发起、不缺任何资源的操作，<b>答案选 C</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '哪个事件使线程由执行态变为就绪态',
  subtitle: '考点：进程与线程简介 · 三态转换（执行/就绪/阻塞）',
  intro: '点击「▶ 播放」逐项分析四个选项。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：判定标尺 = 「缺的是什么」。缺<b>非 CPU 资源</b>（I/O、页面、信号量）→ <b>阻塞</b>；' +
          '不缺资源、只暂时拿不到 CPU（主动出让/时间片到/被抢占）→ <b>就绪</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
