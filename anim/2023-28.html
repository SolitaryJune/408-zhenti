<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-28 进程虚拟地址空间辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：虚拟地址空间的大小由谁决定',
    cls: 'key',
    body: '<p>虚拟内存方式下，每个进程有一套<b>独立的虚拟地址空间</b>，程序用的全是<b>虚拟地址</b>，访问时由页表映射成物理地址。' +
          '本题要找<b>错误</b>叙述，核心疑点：空间大小由「地址位数」还是「内存＋硬盘大小」决定？</p>' },
  { title: 'A. 每个进程都有独立的虚拟地址空间 —— 正确',
    cls: 'good',
    body: '<p>这正是虚拟内存实现<b>隔离与保护</b>的方式：进程 P、S 各有各的地址空间，互不干扰。</p>' },
  { title: 'B. malloc() 返回的是虚拟地址 —— 正确',
    cls: 'good',
    body: '<p>用户程序接触的地址<b>全是虚拟地址</b>，物理地址对程序透明（由页表转换）。malloc 自然返回虚拟地址。</p>' },
  { title: 'C. 数据段与代码段可有不同的访问权限 —— 正确',
    cls: 'good',
    body: '<p>虚拟空间按段（区）设置权限：代码段通常<b>只读可执行</b>，数据段<b>可读写</b>；越权访问触发保护性异常。</p>' },
  { title: 'D. 大小由内存和硬盘的大小决定 —— 错误！',
    cls: 'bad',
    body: '<p>虚拟地址空间的大小由 <b>CPU 的地址位数（虚拟地址位数）</b>决定：32 位系统 → 4GB 编址范围。' +
          '内存和硬盘只影响<b>实际能装入多少内容</b>，不决定编址范围的大小。</p>' },
  { title: '结论：错误的叙述是 D',
    cls: 'good',
    body: '<p>记忆锚点：<b>「编址范围看地址位数，装多少看内存＋外存」</b>。' +
          'A、B、C 都符合虚拟内存的基本特征，<b>错误项选 D</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '关于进程虚拟地址空间，哪项叙述错误',
  subtitle: '考点：虚拟内存管理 · 独立空间 / 虚拟地址 / 段权限 / 空间大小',
  intro: '点击「▶ 播放」逐项检验四个叙述。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：<b>虚拟地址空间大小 = 由虚拟地址位数决定</b>（32 位 → 4GB），与内存、硬盘的实际大小无关；' +
          '内存＋硬盘决定的是「实际能装入的内容量」。进程空间独立、malloc 给虚拟地址、按段设权限均为正确叙述。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
