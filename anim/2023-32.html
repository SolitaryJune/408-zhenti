<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-32 设备分配需要考虑的因素</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：跟着设备分配流程逐环节核对',
    cls: 'key',
    body: '<p>设备分配的流程：<b>查映射找设备 → 查类型挑设备 → 查状态看忙闲 → 查权限做安全检查 → 分配设备/控制器/通道</b>。' +
          '四个因素 Ⅰ～Ⅳ 是否需要，按流程逐一对号。</p>' },
  { title: 'Ⅰ. 设备的类型 —— 需要',
    cls: 'good',
    body: '<p>用户申请的是某<b>类</b>设备（如「一台打印机」），系统必须在<b>同类设备</b>中挑选一台可用设备分配。</p>' },
  { title: 'Ⅱ. 设备的访问权限 —— 需要',
    cls: 'good',
    body: '<p>分配前要做<b>安全检查</b>：确认用户/进程有权使用该设备，<b>防止越权使用</b>。这也是设备分配安全性的内容。</p>' },
  { title: 'Ⅲ. 设备的占用状态 —— 需要',
    cls: 'good',
    body: '<p>查<b>设备控制表（DCT）</b>看设备忙闲：忙则把请求者<b>排入等待队列</b>或另选同类设备。</p>' },
  { title: 'Ⅳ. 逻辑设备与物理设备的映射关系 —— 需要',
    cls: 'good',
    body: '<p>设备独立性靠<b>逻辑设备表（LUT）</b>完成「逻辑设备 → 物理设备」映射，分配时必须先查映射定位物理设备。</p>' },
  { title: '结论：四项都要，答案 D',
    cls: 'good',
    body: '<p>类型（同类挑选）、权限（安全检查）、占用状态（查 DCT）、映射关系（查 LUT）<b>缺一不可</b>，' +
          '<b>答案选 D</b>。易漏的恰是 Ⅱ 和 Ⅳ。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '设备分配需要考虑哪些因素',
  subtitle: '考点：设备独立性软件 · Ⅰ 类型 / Ⅱ 权限 / Ⅲ 占用状态 / Ⅳ 逻辑—物理映射',
  intro: '点击「▶ 播放」按分配流程逐项核对。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：设备分配 = <b>查 LUT 映射 → 按类型挑设备 → 查 DCT 看忙闲 → 查权限保安全 → 分配</b>。' +
          '四项对应四个环节，全部需要；最易漏的是「访问权限」和「逻辑—物理映射」。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
