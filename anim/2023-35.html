<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-35 三种滑动窗口协议的最大信道利用率</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- 概念/推理链类：协议窗口对比推理 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { tag:'审题眼', cls:'key', title:'审题眼：比"最大利用率"就是比"最大发送窗口"',
    body:'<p>同一条信道、同样帧长、3 bit 序号。信道利用率 U ≈ <b>W·TD ÷ (TD + RTT + TA)</b>' +
         '（W 为发送窗口，未填满管道时），窗口越大 U 越大，上限 1。' +
         '所以三个协议的 U 谁大谁小，<b>就看各自允许的最大发送窗口</b>。</p>' },
  { tag:'停-等', cls:'step', title:'停-等协议：窗口 = 1',
    body:'<p>停-等每发 1 帧就停下来等确认，发送窗口恒为 <b>1</b> → U1 是三者中的下限基准。</p>' },
  { tag:'GBN', cls:'step', title:'GBN：发送窗口 ≤ 2³ − 1 = 7',
    body:'<p>GBN 接收窗口固定为 1，3 bit 序号下发送窗口最大 <b>2³ − 1 = 7</b>，管道填得最满。</p>' },
  { tag:'SR', cls:'step', title:'SR：收发窗口相等 → 各 = 2³ ÷ 2 = 4',
    body:'<p>SR 为保证不出错要求 <b>发送窗口 + 接收窗口 ≤ 2ⁿ</b>；题设两者相等，' +
         '故各取 2² = <b>4</b>。括号「发送窗口和接收窗口相等」正是把 SR 窗口压到 4 的关键。</p>' },
  { tag:'排序', cls:'good', title:'窗口 1 ≤ 4 ≤ 7 → U1 ≤ U3 ≤ U2',
    body:'<p>窗口越大利用率越高：停-等(1) ≤ SR(4) ≤ GBN(7)，即 <b>U1 ≤ U3 ≤ U2</b>。' +
         '若传播时延很短、窗口 4 就能填满管道，三者都趋于 1，所以取「≤」可相等。</p>' },
  { tag:'干扰项', cls:'bad', title:'A / C / D 错在哪',
    body:'<p><b>A（U2 ≤ U3）</b>：默认"SR 更先进一定更高效"——那是重传开销的比较，比最大窗口 SR(4) 反而小于 GBN(7)。<br>' +
         '<b>C、D</b>：把停-等排在中途或最大，忘了它的窗口只有 1，必然最小。</p>' },
  { tag:'结论', cls:'good', title:'结论：选 B（U1 ≤ U3 ≤ U2）',
    body:'<p>记忆点：<b>停等窗口 1、SR 窗口 2<sup>n−1</sup>、GBN 窗口 2<sup>n</sup>−1</b>；n=3 时 1 ≤ 4 ≤ 7。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step')),
    tag: s.tag,
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '停-等 / GBN / SR 的最大信道利用率排序',
  subtitle: '考点：序号 3 bit 对窗口的约束 · 逐协议推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：U 随发送窗口增大 → <b>停等 1、SR 2<sup>n−1</sup>（收发窗口之和 ≤ 2<sup>n</sup> 且相等）、GBN 2<sup>n</sup>−1</b>；' +
          'n=3 → 1 ≤ 4 ≤ 7，<b>U1 ≤ U3 ≤ U2</b>。SR 并非处处优于 GBN——序号位数压缩了它的窗口。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
