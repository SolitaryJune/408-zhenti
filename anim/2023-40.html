<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023-40 IPv4 与 IPv6 四条叙述辨析</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 概念/推理链类：逐条判断 + 匹配选项 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { tag:'审题眼', cls:'key', title:'审题眼：四条叙述逐条判断',
    body:'<p>Ⅰ 地址空间倍数、Ⅱ 首部长度可变性、Ⅲ 过渡技术、Ⅳ Hop Limit 与 TTL。' +
         '考点：<b>IPv6 与 IPv4 的核心差异</b>——地址位数、首部结构、过渡、逐跳字段。</p>' },
  { tag:'Ⅰ ✗', cls:'bad', title:'Ⅰ. 「地址空间是 96 倍」——错',
    body:'<p>IPv6 地址 <b>128 位</b>，IPv4 <b>32 位</b>，地址<b>数量</b>之比 = 2<sup>128</sup> ÷ 2<sup>32</sup> = <b>2<sup>96</sup> 倍</b>。' +
         '96 只是指数差，倍数要把 2 带上——说「96 倍」错得离谱。</p>' },
  { tag:'Ⅱ ✗', cls:'bad', title:'Ⅱ. 「两个首部都可变」——错',
    body:'<p>IPv4 首部 20 ~ 60 B <b>可变</b>（有选项字段）；IPv6 <b>基本首部固定 40 B</b>，长度不可变，' +
         '可变的功能挪到扩展首部——定长正是 IPv6 加快路由器处理的设计点。</p>' },
  { tag:'Ⅲ ✓', cls:'good', title:'Ⅲ. 「双协议栈 + 隧道过渡」——对',
    body:'<p>IPv4 向 IPv6 过渡的两大标准技术：<b>双协议栈</b>（设备同时跑两套协议）与<b>隧道</b>（IPv6 分组封装进 IPv4 分组穿越 IPv4 网络）。</p>' },
  { tag:'Ⅳ ✓', cls:'good', title:'Ⅳ. 「Hop Limit 等价 TTL」——对',
    body:'<p>IPv6 基本首部的 <b>Hop Limit</b> 就是 IPv4 <b>TTL</b> 的改名：每过一个路由器减 1，减到 0 丢弃，防分组无限兜圈。</p>' },
  { tag:'匹配选项', cls:'step', title:'含错项的选项全排除',
    body:'<p>A（含Ⅰ）✗、B（含Ⅰ）✗、C（含Ⅱ）✗；只有 <b>D = 仅Ⅲ、Ⅳ</b> 全对。</p>' },
  { tag:'结论', cls:'good', title:'结论：选 D（仅 III、IV）',
    body:'<p>记忆点：<b>2<sup>96</sup> 倍（不是 96 倍）、基本首部定长 40 B、双栈 + 隧道、Hop Limit = TTL</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step')),
    tag: s.tag,
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'IPv4 与 IPv6：哪几条叙述正确',
  subtitle: '考点：地址空间 · 首部结构 · 过渡技术 · Hop Limit · 逐条推演',
  intro: '点击「▶ 播放」逐条判断、再匹配选项。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：地址数量是 <b>2<sup>96</sup> 倍</b>（Ⅰ 错）；IPv6 基本首部<b>固定 40 B</b>（Ⅱ 错）；' +
          '过渡用<b>双协议栈 + 隧道</b>（Ⅲ 对）；<b>Hop Limit ≡ TTL</b>（Ⅳ 对）→ 仅Ⅲ、Ⅳ，选 <b>D</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
