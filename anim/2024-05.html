<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-05 谁不适合折半查找</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body) {
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
    '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  {
    title: '审题眼：折半查找的两个前提',
    cls: 'key',
    body: '<p>折半查找每次取中点 <code>mid</code>，与关键字比较后舍弃一半。它必须同时满足：<b>① 关键字有序</b>（否则比较 mid 无法决定舍弃哪一半）；<b>② 必须支持随机存取</b>（一步到位地取任意下标元素，即顺序存储）。逐个用这两条去卡四个结构。</p>'
  },
  {
    title: 'Ⅰ. 有序链表：卡在「随机存取」',
    cls: 'bad',
    body: '<p>有序 ✓，但链表是<b>链式存储</b>，取第 mid 个元素要从头沿链走 mid 步，O(n) 的定位让「每次折半」失去意义（总时间反而更差）。<b>不适合</b>。</p>'
  },
  {
    title: 'Ⅱ. 无序数组：卡在「有序」',
    cls: 'bad',
    body: '<p>数组随机存取 ✓，但<b>无序</b>：比完 mid 与 key 的大小也判断不出关键字在哪一半，无法舍弃一半。<b>不适合</b>。</p>'
  },
  {
    title: 'Ⅲ. 有序静态链表：还是卡在「随机存取」',
    cls: 'bad',
    body: '<p>静态链表用游标（下标）模拟链，逻辑上仍是<b>链式</b>结构：定位第 mid 个元素同样要沿游标逐个走，不支持随机存取。有序救不了它。<b>不适合</b>。</p>'
  },
  {
    title: 'Ⅳ. 无序静态链表：两条全不占',
    cls: 'bad',
    body: '<p>既<b>无序</b>又<b>不能随机存取</b>，两条前提都不满足，自然不适合。</p>'
  },
  {
    title: '结论',
    cls: 'good',
    body: '<p>Ⅰ、Ⅱ、Ⅲ、Ⅳ <b>全部不适合</b>，答案选 <b>D</b>。适合折半查找的只有「<b>有序的顺序表</b>（有序数组）」这一种组合。</p>'
  }
];

var snaps = STEPS.map(function (s, i) {
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function (x, j) {
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '四个结构逐个卡「折半查找两前提」（2024-05）',
  subtitle: '前提：① 有序　② 随机存取（顺序存储）· 两者缺一不可',
  intro: '点击「▶ 播放」，逐个结构检查两条前提。',
  snaps: snaps,
  result: {
    big: '答案 D（4 个全不适合）',
    html: '记忆锚点：折半 = 「<b>有序</b>」+「<b>随机存取</b>」缺一不可。链表、静态链表这类<b>链式</b>结构无论有序与否都不行；数组若<b>无序</b>也不行。只有有序顺序表能折半。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
