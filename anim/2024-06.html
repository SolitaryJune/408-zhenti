<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-06 KMP 修正 next 的最大滑动距离</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var S  = ['a', 'a', 'b', 'a', 'a', 'b'];
var NX = ['0', '1', '2', '1', '2', '3'];
var NV = ['0', '0', '2', '0', '0', '2'];
var DS = ['1', '2', '1', '4', '5', '4'];
var BLANK = ['·', '·', '·', '·', '·', '·'];

var rS, rN, rV, rD;

function setRow(row, vals, clsArr, ptrArr) {
  for (var j = 0; j < 6; j++) {
    var box = row.children[j].children[1];
    var ptr = row.children[j].children[0];
    box.textContent = vals[j];
    box.className = 'aw-box' + (clsArr && clsArr[j] ? ' ' + clsArr[j] : '');
    ptr.textContent = (ptrArr && ptrArr[j]) || '';
  }
}

function paint(i) {
  setRow(rS, S, ['ok', 'ok', 'ok', 'ok', 'ok', 'ok']);
  setRow(rN, i >= 1 ? NX : BLANK, i >= 1 ? ['ok', 'ok', 'ok', 'ok', 'ok', 'ok'] : null);
  setRow(rV, i >= 2 ? NV : BLANK, i >= 2 ? ['ok', 'ok', 'ok', 'ok', 'ok', 'ok'] : null);
  var dcls = null, dptr = null;
  if (i >= 3) {
    dcls = ['ok', 'ok', 'ok', 'ok', 'ok', 'ok'];
    if (i >= 4) {
      dcls[4] = 'hit';
      dptr = ['', '', '', '', '最大', ''];
    }
  }
  setRow(rD, i >= 3 ? DS : BLANK, dcls, dptr);
}

AW.init({
  title: 'KMP：修正 next 后模式串能滑多远（2024-06）',
  subtitle: '模式串 <code>S = aabaab</code> · 滑动距离 = <code>j − nextval[j]</code>（nextval[j]=0 时滑 j 格）',
  counterLabel: '已求出位数',
  intro: '点击「▶ 播放」：先求 next，再修正为 nextval，最后算滑动距离。',
  build: function (stage) {
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>模式串 S</b>（下方数字为位次 j）'));
    rS = AW.cellRow(S, ['', '', '', '', '', ''], null, 1);
    inner.appendChild(rS);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>next</b>（教材版：next[1]=0，next[j]=S[1..j−1] 最长相等前后缀长度 + 1）'));
    rN = AW.cellRow(BLANK, ['', '', '', '', '', ''], null, 1);
    inner.appendChild(rN);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>nextval</b>（修正：S[j]=S[next[j]] 时跳传 nextval[next[j]]）'));
    rV = AW.cellRow(BLANK, ['', '', '', '', '', ''], null, 1);
    inner.appendChild(rV);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>失配时右滑距离 = j − nextval[j]</b>'));
    rD = AW.cellRow(BLANK, ['', '', '', '', '', ''], null, 1);
    inner.appendChild(rD);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    paint(0);
  },
  snaps: [
    { cls: 'step', tag: '初始', log: '模式串 S=aabaab，共 6 位。先按教材版定义求 next：next[1]=0，next[j] 看 S[1..j−1] 的最长相等前后缀长度 + 1', count: 0 },
    { cls: 'ok', tag: '求 next', log: '逐位求：j=2 看「a」→1；j=3 看「aa」→1+1=2；j=4 看「aab」→0+1=1；j=5 看「aaba」→1+1=2；j=6 看「aabaa」→2+1=3。得 next = 0,1,2,1,2,3', count: 6 },
    { cls: 'ok', tag: '修正 nextval', log: '修正规则：若 S[j]=S[next[j]]，则 nextval[j]=nextval[next[j]]，否则 nextval[j]=next[j]。j=2:a=a→0；j=4:a=a→0；j=5:a=a→0；j=6:b=b→nextval[3]=2；j=3:b≠a→2。得 nextval = 0,0,2,0,0,2', count: 6 },
    { cls: 'step', tag: '算滑动距离', log: '在 S[j] 处失配时右滑 j−nextval[j] 格；nextval[j]=0 表示滑 j 格、从主串当前位置的下一字符重新比较。六个距离 = 1,2,1,4,5,4', count: 6 },
    { cls: 'ok', tag: '找最大', log: '最大滑动在 j=5 处：5−0=5。即主串字符与 S[5]=a 失配时，模式串一次性右滑 5 格', count: 6 },
    { cls: 'done', tag: '完成', log: 'S 将向右滑动的最长距离 = 5（选项 A）', count: 6, done: true }
  ],
  render: function (stage, sn, i) { paint(i); },
  result: {
    big: '最长滑动 5（选 A）',
    html: 'next = <code>0,1,2,1,2,3</code>，修正后 nextval = <code>0,0,2,0,0,2</code>；滑动距离 = <b>j − nextval[j]</b>，最大在 j=5 处等于 <b>5</b>。记忆点：nextval[j]=0 说明滑到主串下一字符从头比，滑动距离恰为 j。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
