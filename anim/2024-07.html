<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-07 二叉搜索树里子树 T 的取值范围</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body) {
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
    '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  {
    title: '审题眼：认清树形',
    cls: 'key',
    body: '<p>题 7 图的结构：k1 是根；<b>k2 是 k1 的右孩子</b>；<b>k3 是 k2 的左孩子</b>；<b>子树 T 是 k3 的右子树</b>。T 中任一结点的关键字 x 要同时受这条路径上所有祖先的约束。</p>'
  },
  {
    title: 'BST 约束的传递规则',
    cls: '',
    body: '<p>二叉搜索树：左子树所有关键字 &lt; 根 &lt; 右子树所有关键字。走到子树里，约束会<b>累积</b>：T 在某结点的右子树里 ⇒ x &gt; 该结点关键字；T 在某结点的左子树里 ⇒ x &lt; 该结点关键字。</p>'
  },
  {
    title: '沿路径逐站收集约束',
    cls: '',
    body: '<p>k1 →(右) k2：T 在 k1 的右子树里 ⇒ <code>x &gt; k1</code>。<br/>k2 →(左) k3：T 在 k2 的左子树里 ⇒ <code>x &lt; k2</code>。<br/>k3 →(右) T：T 在 k3 的右子树里 ⇒ <code>x &gt; k3</code>。</p>'
  },
  {
    title: '合并约束，取最紧的一对',
    cls: '',
    body: '<p>下界取最大：x &gt; k1 且 x &gt; k3。因为 k3 在 k1 的右子树里必有 k3 &gt; k1，所以更紧的下界是 <code>k3</code>。上界只有 <code>k2</code>。合起来：<code>k3 &lt; x &lt; k2</code>（它自动包含 x &gt; k1）。</p>'
  },
  {
    title: '逐项排除',
    cls: 'bad',
    body: '<p><b>A</b> <code>x &lt; k1</code>：方向反了，T 在 k1 的右子树里。<b>B</b> <code>x &gt; k2</code>：T 在 k2 的左子树里，应小于 k2。<b>C</b> <code>k1 &lt; x &lt; k3</code>：x 与 k3 的关系是 x &gt; k3，这个区间整个装错了。</p>'
  },
  {
    title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>（k3 &lt; x &lt; k2）。代入数字自检：设 k1=20、k2=50、k3=30，T 挂在 k3 右边，T 中关键字必须 &gt;30 且 &lt;50（同时自然 &gt;20），比如 40。</p>'
  }
];

var snaps = STEPS.map(function (s, i) {
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function (x, j) {
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '子树 T 中的关键字 x 满足什么（2024-07）',
  subtitle: 'k1 根 · k2 是 k1 右孩子 · k3 是 k2 左孩子 · T 是 k3 的右子树',
  intro: '点击「▶ 播放」，沿查找路径逐站收集上下界。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：<b>右转抬下界、左转压上界</b>，把路径上的约束全部收集后取最紧的一对。T 的约束链：x&gt;k1、x&gt;k3、x&lt;k2 ⇒ <b>k3 &lt; x &lt; k2</b>。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
