<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-10 三个有序段的二路归并比较次数</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

/* 每个快照：当前两段内容、输出内容、左右指针、已耗格子数 */
var LVALS = [[3, 5], [3, 5], [3, 5], [3, 5, 7, 9], [3, 5, 7, 9], [3, 5, 7, 9], [3, 5, 7, 9], [3, 5, 7, 9]];
var RVALS = [[7, 9], [7, 9], [7, 9], [6], [6], [6], [6], [6]];
var OVALS = [[], [3], [3, 5, 7, 9], [], [3], [3, 5], [3, 5, 6, 7, 9], [3, 5, 6, 7, 9]];
/* 本步发生比较的位置（段内下标），无比较为 -1 */
var CMPL = [-1, 0, 1, -1, 0, 1, 2, -1];
var CMPR = [-1, 0, 0, -1, 0, 0, 0, -1];
/* 已输出而消耗掉的左/右段元素个数 */
var USED = [
  [0, 0], [1, 0], [2, 2], [0, 0], [1, 0], [2, 0], [2, 1], [4, 1]
];
/* 最后一步全部点亮 */
var FINALS = [false, false, false, false, false, false, false, true];

var rL, rR, rO;

function paintRow(row, vals, used, cmpIdx, allOk, total) {
  var n = row.children.length;
  for (var j = 0; j < n; j++) {
    var box = row.children[j].children[1];
    var ptr = row.children[j].children[0];
    if (j < vals.length) {
      box.textContent = String(vals[j]);
      var cls = 'aw-box';
      if (allOk) cls += ' ok';
      else if (j < used) cls += ' dim';
      else if (j === cmpIdx) cls += ' hit';
      box.className = cls;
    } else {
      box.textContent = '·';
      box.className = 'aw-box dim';
    }
    ptr.textContent = '';
  }
}

function paintOut(row, vals, allOk) {
  for (var j = 0; j < row.children.length; j++) {
    var box = row.children[j].children[1];
    if (j < vals.length) {
      box.textContent = String(vals[j]);
      box.className = 'aw-box' + (allOk ? ' ok' : '');
    } else {
      box.textContent = '·';
      box.className = 'aw-box dim';
    }
  }
}

function paint(i) {
  paintRow(rL, LVALS[i], USED[i][0], CMPL[i], FINALS[i]);
  paintRow(rR, RVALS[i], USED[i][1], CMPR[i], FINALS[i]);
  paintOut(rO, OVALS[i], FINALS[i]);
}

AW.init({
  title: '三个有序段从左到右两路归并：数比较次数（2024-10）',
  subtitle: '段 A=(3,5)、段 B=(7,9)、段 C=(6) · 顺序：A⊕B 先归并，结果再与 C 归并',
  counterLabel: '关键字比较',
  ribbonTitle: '比较次数（✓ 计入总数）',
  intro: '点击「▶ 播放」：每一次关键字比较计 1 次，段尽后剩余部分直接接上、不再比较。',
  build: function (stage) {
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>左段</b>（当前参与归并的左有序段）'));
    rL = AW.cellRow(['·', '·', '·', '·'], ['', '', '', ''], null, 1);
    inner.appendChild(rL);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>右段</b>（当前参与归并的右有序段）'));
    rR = AW.cellRow(['·', '·'], ['', ''], null, 1);
    inner.appendChild(rR);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>归并输出</b>（绿=已就位）'));
    rO = AW.cellRow(['·', '·', '·', '·', '·'], ['', '', '', '', ''], null, 1);
    inner.appendChild(rO);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    paint(0);
  },
  snaps: [
    { cls: 'shift', tag: '开始', log: '三个有序段 A=(3,5)、B=(7,9)、C=(6)，按从左至右次序：先归并 A 和 B，再把结果与 C 归并', count: 0 },
    { cls: 'ok', tag: '归并①比1', log: '3 与 7 比较：3<7，输出 3（第 1 次比较）', count: 1, ribbon: { k: 1, ok: true } },
    { cls: 'ok', tag: '归并①比2', log: '5 与 7 比较：5<7，输出 5；左段取尽，7、9 直接接上不再比较 → 归并①得 (3,5,7,9)，共 2 次', count: 2, ribbon: { k: 2, ok: true } },
    { cls: 'shift', tag: '归并②', log: '第二步：把 (3,5,7,9) 与 (6) 归并', count: 2 },
    { cls: 'ok', tag: '归并②比3', log: '3 与 6 比较：3<6，输出 3（第 3 次比较）', count: 3, ribbon: { k: 3, ok: true } },
    { cls: 'ok', tag: '归并②比4', log: '5 与 6 比较：5<6，输出 5（第 4 次比较）', count: 4, ribbon: { k: 4, ok: true } },
    { cls: 'ok', tag: '归并②比5', log: '7 与 6 比较：7>6，输出 6（第 5 次比较）；右段取尽，7、9 接上 → 得 (3,5,6,7,9)，归并②共 3 次', count: 5, ribbon: { k: 5, ok: true } },
    { cls: 'done', tag: '完成', log: '总比较次数 = 2 + 3 = 5（选项 C）', count: 5, done: true }
  ],
  render: function (stage, sn, i) { paint(i); },
  result: {
    big: '总比较 5 次（选 C）',
    html: '归并① (3,5)+(7,9)：比 <b>2</b> 次（3、5 连胜后左段尽，7、9 白拿）；归并② (3,5,7,9)+(6)：比 <b>3</b> 次（6 连输三阵才落位）。合计 <b>5</b>。记忆点：<b>某段取尽后剩余元素直接接上，不耗比较</b>。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
