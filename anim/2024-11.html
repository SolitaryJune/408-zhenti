<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-11 败者树里冠军结点存的是什么</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body) {
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
    '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  {
    title: '审题眼：外排多路归并要选什么',
    cls: 'key',
    body: '<p>外排序的 k 路归并中，各归并段<b>初始为升序</b>，每次要选出 k 个段当前关键字中的<b>最小者</b>送入输出串。败者树就是为「快速选最小」搭的树形选择结构 —— 先把这一点钉死，答案方向就定了。</p>'
  },
  {
    title: '败者树怎么比：胜者上升，败者留下',
    cls: '',
    body: '<p>叶子是各段当前关键字；两两比较，<b>较小者为胜</b>（升序归并要的就是小），继续上一层；<b>较大者为败</b>，其<b>归并段号</b>被记进双亲（内部）结点。所以内部结点存的都是「败者来自哪一段」。</p>'
  },
  {
    title: '冠军是谁、记在哪',
    cls: '',
    body: '<p>一路获胜、最终站上树根之外的那个结点就是<b>冠军</b>（题里的 ls[0]）：它对应当前 k 个关键字中的<b>最小关键字</b>。冠军的关键字本身不进树，冠军结点里记的是<b>这个最小关键字所在的归并段号</b>。</p>'
  },
  {
    title: '为什么存段号而不是关键字',
    cls: '',
    body: '<p>冠军被输出后，要从它所在的归并段读出<b>下一个</b>关键字重赛。结点里存段号，就能顺藤摸瓜回到该段取数，只需沿「叶 → 根」一条路径重新比较，不必遍历整棵树 —— 存段号省空间又方便回段取数。</p>'
  },
  {
    title: '逐项排除',
    cls: 'bad',
    body: '<p><b>A</b> 最大关键字：升序归并取最小，方向就错了。<b>B</b> 最小关键字：值是有的，但败者树的结点（含冠军结点）保存的是<b>段号</b>，不是关键字本身。<b>C</b> 最大关键字所在段号：同 A，方向错。</p>'
  },
  {
    title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>：败者树中记录「冠军」的结点保存<b>最小关键字所在的归并段号</b>。记忆锚点：败者树结点里全是段号，冠军 = 当前最小关键字的那一段。</p>'
  }
];

var snaps = STEPS.map(function (s, i) {
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function (x, j) {
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '败者树：冠军结点里记的是什么（2024-11）',
  subtitle: '外排序 · k 路归并 · 各归并段初始升序',
  intro: '点击「▶ 播放」，从「选最小」的目标一步步推到冠军结点的内容。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '升序多路归并每步选<b>最小</b>关键字；败者树内部结点记败者、冠军另记一处，记的内容是<b>最小关键字所在的归并段号</b>——输出后好回段取下一个关键字。记忆锚点：<b>树上全是段号，冠军=最小</b>。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
