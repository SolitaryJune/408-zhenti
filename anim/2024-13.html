<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-13 伪指令/微指令/机器指令/汇编指令 辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 概念/推理链类：四类指令逐项辨析 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：四个层面',
    cls: 'key',
    body: '<p>四类"指令"分属不同层面：伪指令、汇编指令在<b>汇编源程序</b>层面；机器指令在<b>机器（ISA）</b>层面；微指令在<b>控制器（微程序）</b>层面。题目问：CPU 能<b>理解并直接执行</b>的是哪些。</p>' },
  { title: 'I 伪指令 —— 不能',
    cls: 'bad',
    body: '<p>伪指令不是真正的机器指令，只是写给<b>汇编程序</b>看的"指示"（把实现特定功能的指令序列定义成一个名字、分配存储单元等）。由汇编程序翻译/展开成机器指令，<b>CPU 不认识伪指令</b>。</p>' },
  { title: 'II 微指令 —— 能',
    cls: 'good',
    body: '<p>微指令存放在 CPU 内部的<b>控制存储器</b>中，微程序控制器逐条取出、直接执行并产生控制信号序列——它是 CPU（控制部件）能<b>直接执行</b>的指令。</p>' },
  { title: 'III 机器指令 —— 能',
    cls: 'good',
    body: '<p>机器指令是机器（ISA）层面的指令，CPU 能直接<b>译码并执行</b>——这正是"机器指令"的定义。</p>' },
  { title: 'IV 汇编指令 —— 不能"直接"',
    cls: 'bad',
    body: '<p>汇编指令是机器指令的<b>助记符文本</b>（如 <code>add r1, r2</code>）。CPU 硬件"看不懂"符号文本，必须先经<b>汇编程序</b>翻译成机器指令才能执行——不是"直接"执行。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>能被 CPU 理解并直接执行的是 <b>II 微指令、III 机器指令</b>，答案选 <b>B</b>。记忆锚点：汇编层面的东西（伪指令、汇编指令）都要过"汇编程序"这道翻译关。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'CPU 能直接执行的指令：伪指令 / 微指令 / 机器指令 / 汇编指令',
  subtitle: '考点：指令的层次划分 · 四项逐一辨析',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '<p><b>仅 II、III</b> 能被 CPU 理解并直接执行。伪指令（I）与汇编指令（IV）都属汇编语言层面，须经汇编程序处理；微指令（II）由 CPU 内部控制器直接执行，机器指令（III）由 CPU 直接译码执行。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
