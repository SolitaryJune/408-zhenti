<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-15 整数乘法实现方式辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 概念/推理链类：乘法四叙述逐项辨析 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：找"错误"的那句',
    cls: 'key',
    body: '<p>四个叙述涉及乘法的两种硬件实现（<b>阵列乘法器</b>、<b>ALU + 移位器</b>）与两种编译优化（<b>常数乘</b>、<b>变量乘</b>）。要求选出<b>错误</b>的一项。</p>' },
  { title: 'A：阵列乘法器一周期完成 —— 正确',
    cls: '',
    body: '<p>阵列乘法器是纯组合逻辑电路：与门阵列产生全部部分积，再一次相加求和，操作数到位即可得结果，<b>可以在一个时钟周期内完成</b>（代价是电路规模大、延迟长）。叙述正确。</p>' },
  { title: 'B：ALU+移位器多周期 —— 正确',
    cls: '',
    body: '<p>用 ALU 和移位器做乘法要"加法—移位"迭代 n 次（n 为操作数位数），每个时钟周期推进一步，<b>无法在一个时钟周期内完成</b>。叙述正确。</p>' },
  { title: 'C：常数乘拆移位加/减 —— 正确',
    cls: '',
    body: '<p>常数在编译时已知，可拆成 2 的幂的组合，如 <code>x*10 = (x&lt;&lt;3) + (x&lt;&lt;1)</code> → 编译优化为<b>若干条移位与加/减运算指令</b>。叙述正确。</p>' },
  { title: 'D：变量乘"无法"用循环 —— 错误！',
    cls: 'bad',
    body: '<p>两个变量相乘完全可以编译为"<b>移位—相加</b>"的<b>循环</b>（模拟手工乘法：每轮判断乘数最低位，决定是否加被乘数，然后移位），循环 n 轮即得结果。"无法编译转换为循环实现"不成立 → 选 <b>D</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。C 与 D 的区别仅在"一个操作数编译时是否已知"：常数可静态拆成定长几条指令，变量则写成循环——两者都能优化，只是形式不同。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '整数乘法：硬件实现 × 编译优化，哪句错了？',
  subtitle: '阵列乘法器 / ALU+移位器 / 常数乘 / 变量乘 · 逐项辨析',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '<p>阵列乘法器一周期完成（A 对）；ALU+移位器需多周期迭代（B 对）；常数乘拆移位 + 加/减（C 对）；变量乘<b>可以</b>用"移位-相加"循环实现——D 的"无法"二字不成立。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
