<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-20 总线带宽计算动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- 概念/推理链类：总线带宽的口径辨析与计算推理链 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：口径先定死',
    cls: 'key',
    body: '<p>时钟 <b>420 MHz</b>、总线宽 <b>64 位</b>、每周期传送 <b>2 次</b>数据。求"总线带宽（<b>最大数据传输率</b>）"——口径：按<b>数据传输期的峰值速率</b>算，不摊入地址周期、等待周期等开销。</p>' },
  { title: '第一步：峰值速率公式',
    cls: 'key',
    body: '<p>最大数据传输率 = 时钟频率 × 每周期传送次数 × 总线宽度<br><code>420 MHz × 2 × 64 bit = 53.76 Gb/s</code></p>' },
  { title: '第二步：位 → 字节',
    cls: 'good',
    body: '<p><code>53.76 Gb/s ÷ 8 = 6.72 GB/s</code> → 对应选项 <b>B</b>。</p>' },
  { title: '第三步：拆解干扰项 A',
    cls: 'bad',
    body: '<p><b>A = 3.84 GB/s</b> 是"单事务平均带宽"口径：把整个突发事务 7 个周期摊入——8 次数据 × 8 B ÷ 7 周期 × 420 MHz。题问"<b>最大</b>数据传输率"，不这样算。</p>' },
  { title: '第四步：拆解干扰项 D、C',
    cls: 'bad',
    body: '<p><b>D = 53.76 GB/s</b>：53.76 的正确单位是 <b>Gb/s</b>，忘了 ÷8；<b>C = 30.72 GB/s</b> 是错误口径上再叠加折算错误。</p>' },
  { title: '第五步：复核',
    cls: 'good',
    body: '<p>复核：420M 周期/秒 × 2 次/周期 = 8.4 亿次传送/秒，每次 8 B → <code>8.4 亿 × 8 B = 6.72 GB/s</code> ✓</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B（6.72 GB/s）</b>。记忆锚点：带宽 = 频率 × 每周期次数 × 宽度；"<b>最大</b>"别摊开销；"<b>位 → 字节</b>"记得 ÷8。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '总线带宽（最大数据传输率）的计算',
  subtitle: '420 MHz · 64 位 · 每周期 2 次 · 突发 8 次数据',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B：6.72 GB/s',
    html: '<p>420 MHz × 2 次/周期 × 8 B/次 = <b>6.72 GB/s</b>（即 53.76 Gb/s ÷ 8）。A 是把 7 个事务周期摊入的平均带宽（3.84 GB/s），D 忘了 ÷8。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
