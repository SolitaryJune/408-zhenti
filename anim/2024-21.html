<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-21 中断 I/O 方式辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- 概念/推理链类：中断流程软硬件分工逐项辨析 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：谁实现哪一步',
    cls: 'key',
    body: '<p>考中断流程中各步骤的<b>实现者</b>（硬件隐指令 / 软件服务程序），以及<b>响应优先级</b>与<b>处理优先级</b>的区别。找"<b>错误</b>"叙述。</p>' },
  { title: 'A：屏蔽字定"响应"优先级 —— 错误！',
    cls: 'bad',
    body: '<p>中断<b>响应</b>优先级由硬件排队电路（中断控制器/排队器）决定，是<b>固定</b>的；<b>屏蔽字</b>改变的是<b>处理</b>优先级——通过屏蔽某些中断源调整服务程序执行的先后。混淆两个概念 → 选 <b>A</b>。</p>' },
  { title: 'B：断点与 PSW 在响应阶段保存 —— 正确',
    cls: '',
    body: '<p>中断<b>响应阶段</b>（隐指令）由<b>硬件</b>自动完成：关中断、保存断点（PC）、保存程序状态字。叙述正确。</p>' },
  { title: 'C：通用寄存器与屏蔽字由软件处理 —— 正确',
    cls: '',
    body: '<p>保存通用寄存器、设置新的屏蔽字是<b>中断服务程序</b>开头的工作，由<b>软件</b>（指令）实现。叙述正确。</p>' },
  { title: 'D：单重中断处理期间关中断 —— 正确',
    cls: '',
    body: '<p>单重（单级）中断方式下，服务程序一进来就"关中断"，整个处理期间 CPU 处于关中断状态，不再响应新请求。叙述正确。</p>' },
  { title: '结论：两个优先级辨析',
    cls: 'good',
    body: '<p>答案选 <b>A</b>。<b>响应优先级</b>：多个请求同时到达时先响应谁——硬件排队器决定，屏蔽字改不了；<b>处理优先级</b>：服务中谁可打断谁——由屏蔽字决定。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '中断 I/O：响应阶段做什么、屏蔽字管什么',
  subtitle: '隐指令（硬件） vs 服务程序（软件） · 两个优先级辨析',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '<p><b>响应优先级</b>：硬件排队器定，固定不可调；<b>处理优先级</b>：屏蔽字定，可调。断点与 PSW 的保存归硬件（响应阶段），通用寄存器与屏蔽字的设置归软件（服务程序）——A 混淆了响应与处理，错误。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
