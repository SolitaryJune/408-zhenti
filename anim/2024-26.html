<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-26 · 空闲空间管理方法的开销</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念对比动画：位图法 vs 空闲表/成组链接/空闲链表（答案 A）
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    tag: '审题',
    log: '题眼：占用外存空间只跟总块数有关，不随空闲块数量变化',
    body: '<p>题眼：<b>「占用外存空间的大小与当前空闲块数量无关」</b>。判断标准：记录结构是按<b>总块数</b>定长，还是按<b>空闲情况</b>动态变化。</p>' },
  { title: '位图法：定长开销',
    cls: 'good',
    tag: 'A 判定',
    log: '一块一位、只跟总块数有关，空闲多少块都不影响大小 ✓',
    body: '<p>位图法：每个磁盘块固定对应 <b>1 个比特</b>（0 空闲 / 1 已分配）。位图大小 = 总块数 ÷ 8 字节，<b>只取决于磁盘容量</b>——当前空闲多少块都不影响其大小 → <b>符合题意</b> ✓。</p>',
    ribbon: { k: 1, ok: true } },
  { title: '空闲表法：按空闲区记账',
    cls: 'bad',
    tag: 'B 判定',
    log: '表项数随空闲区数量变化：与空闲块数量有关 ✗',
    body: '<p>空闲表法：用表项记录（起始块号，连续空闲块数）。空闲区越少/越多，<b>表项数随之变化</b> → 占用与空闲块数量有关 ✗。</p>',
    ribbon: { k: 2, ok: false } },
  { title: '成组链接法：按空闲块记账',
    cls: 'bad',
    tag: 'C 判定',
    log: '直接记录空闲块号，空闲块增减改变记录与占用 ✗',
    body: '<p>成组链接法：专门记录空闲块号（空闲块号栈，满一组再链入下一组）。<b>直接按空闲块记账</b>，空闲块增减直接改变记录内容与占用 → 有关 ✗。</p>',
    ribbon: { k: 3, ok: false } },
  { title: '空闲链表法：按空闲结点记账',
    cls: 'bad',
    tag: 'D 判定',
    log: '空闲块越多结点越多：与空闲块数量有关 ✗',
    body: '<p>空闲链表法：每个空闲区（或空闲块）挂一个链表结点，<b>空闲块越多结点越多</b> → 有关 ✗。</p>',
    ribbon: { k: 4, ok: false } },
  { title: '结论',
    cls: 'good',
    tag: '结论',
    log: '位图「一块一位、开销固定」，选 A',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>位图「一块一位、开销固定」</b>；其余三种都要「按空闲情况记账」，随空闲块数量变化。</p>' },
];

var CLS_MAP = { good: 'ok', bad: 'miss', key: 'shift' };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : (CLS_MAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.log || s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
  if(s.ribbon) sn.ribbon = s.ribbon;
  return sn;
});

AW.init({
  title: '空闲空间管理：哪种方法的开销与空闲块数量无关',
  subtitle: '考点：<code>位图法</code> 定长 vs <code>空闲表 / 成组链接 / 空闲链表</code> 记账式',
  intro: '点击「▶ 播放」逐步展开推理链。',
  counterLabel: '推理步',
  ribbonTitle: '方法判定（✓ 与空闲块数量无关 / ✗ 有关）',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '<b>位图法的开销与当前空闲块数量无关。</b>每个磁盘块固定对应 1 个比特，位图大小 = 总块数 ÷ 8 字节，只取决于磁盘容量。<br>记忆锚点：<b>位图「定长」；空闲表、成组链接、空闲链表都要随空闲情况「记账」</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
