<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-27 · 伙伴算法的合并规则</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     概念辨析动画：伙伴算法「仅合并等大小分区」（答案 A）
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    tag: '审题',
    log: '题眼：回收分区时仅合并大小相等的空闲分区',
    body: '<p>题眼：<b>「回收分区时仅合并大小相等的空闲分区」</b>。回忆各算法回收空闲分区时的合并对象是谁。</p>' },
  { title: '伙伴算法：只找「伙伴」合并',
    cls: 'good',
    tag: 'A 判定',
    log: '只与等大小、地址成对的伙伴合并，合并后翻倍上溯 ✓',
    body: '<p>伙伴算法：分区大小限定为 2 的幂。回收一块空闲分区时只检查它的<b>伙伴</b>——由同一个父块分裂出来、<b>大小相等</b>、地址成对的另一半；伙伴也空闲才合并成大一档的块，并逐层上溯 → <b>仅合并大小相等的分区</b> ✓。</p>',
    ribbon: { k: 1, ok: true } },
  { title: '为什么「仅合并等大小」',
    cls: 'key',
    tag: '关键',
    log: '等大小的伙伴才能拼回原父块，不等大小的邻居不参与',
    body: '<p><b>为什么「仅合并等大小」</b>：只有等大小的两个伙伴才能拼回原来的父块；大小不等的邻居与它不是伙伴，绝不参与合并——这正是题干描述的特征。</p>' },
  { title: '逐项判定 B',
    cls: 'bad',
    tag: 'B 判定',
    log: '最佳适应：回收时与任意相邻空闲区合并，不分大小 ✗',
    body: '<p>最佳适应：动态分区<b>放置</b>策略（挑最小能装下的空闲区），回收时与<b>任意相邻</b>的空闲分区合并、<b>不分大小</b> → 不符合题意 ✗。</p>',
    ribbon: { k: 2, ok: false } },
  { title: '逐项判定 C',
    cls: 'bad',
    tag: 'C 判定',
    log: '最坏适应：回收规则同上，不分大小 ✗',
    body: '<p>最坏适应：挑最大的空闲区装下请求，回收时同样与<b>任意相邻</b>空闲分区合并、<b>不分大小</b> → 不符合题意 ✗。</p>',
    ribbon: { k: 3, ok: false } },
  { title: '逐项判定 D',
    cls: 'bad',
    tag: 'D 判定',
    log: '首次适应：回收规则同上，不分大小 ✗',
    body: '<p>首次适应：从头找第一个能装下的空闲区，回收时同样与<b>任意相邻</b>空闲分区合并、<b>不分大小</b> → 不符合题意 ✗。</p>',
    ribbon: { k: 4, ok: false } },
  { title: '结论',
    cls: 'good',
    tag: '结论',
    log: '「等大小才能合并、合并后翻倍上溯」是伙伴算法独有特征',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>等大小才能合并、合并后翻倍上溯</b>——伙伴算法独有；动态分区三算法回收时合并相邻空闲区且不分大小。</p>' },
];

var CLS_MAP = { good: 'ok', bad: 'miss', key: 'shift' };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : (CLS_MAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.log || s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
  if(s.ribbon) sn.ribbon = s.ribbon;
  return sn;
});

AW.init({
  title: '哪种算法回收分区时只合并等大小的空闲分区',
  subtitle: '考点：<code>伙伴算法</code> 合并规则 vs <code>动态分区三算法</code>',
  intro: '点击「▶ 播放」逐步展开推理链。',
  counterLabel: '推理步',
  ribbonTitle: '算法判定（✓ 仅合并等大小 / ✗ 不限大小）',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '<b>伙伴算法</b>回收时只与「大小相等、地址成对（同一父块分裂而来）」的伙伴合并，合并成大一档的块后逐层上溯。<br>记忆锚点：<b>等大小才能合并、合并后翻倍上溯</b>；最佳适应/最坏适应/首次适应回收时与任意相邻空闲区合并，不分大小。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
