<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-29 · 哪个系统调用包含按名查找</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- ============================================================
     概念辨析动画：open 完成「文件名→fd」，其余调用只认 fd（答案 A）
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    tag: '审题',
    log: '按名查找 = 拿文件名逐级查目录；看哪个调用的实现还拿着「名字」',
    body: '<p>题眼：<b>按名查找</b> = 拿着文件名沿目录逐级查找目录项，把名字变成 FCB / 索引结点。判断依据：哪个调用的实现里还<b>拿着文件名</b>？</p>' },
  { title: 'open()：按名查找的必经之地',
    cls: 'good',
    tag: 'A 判定',
    log: 'open 参数是路径名，实现必须逐级查目录找到 FCB，再返回 fd ✓',
    body: '<p>open()：参数是<b>路径名</b>。实现必须：按名逐级查找目录 → 找到 FCB / 索引结点调入内存 → 在打开文件表中登记 → 返回 fd。<b>按名查找正是 open 的必经步骤</b> ✓。</p>',
    ribbon: { k: 1, ok: true } },
  { title: 'read()：只认 fd',
    cls: 'bad',
    tag: 'B 判定',
    log: 'read 凭 fd 查打开文件表，不再碰目录 ✗',
    body: '<p>read()：参数是 fd、缓冲区、字节数。凭 fd 直接查<b>打开文件表</b>定位文件，不再碰目录 → 无按名查找 ✗。</p>',
    ribbon: { k: 2, ok: false } },
  { title: 'write()：只认 fd',
    cls: 'bad',
    tag: 'C 判定',
    log: 'write 凭 fd 定位文件写数据，不再碰目录 ✗',
    body: '<p>write()：同样只拿 fd 与缓冲区，按 fd 定位文件写数据 → 无按名查找 ✗。</p>',
    ribbon: { k: 3, ok: false } },
  { title: 'close()：只认 fd',
    cls: 'bad',
    tag: 'D 判定',
    log: 'close 凭 fd 回收打开文件表项，不再碰目录 ✗',
    body: '<p>close()：按 fd 回收打开文件表项、抹掉 FCB 内存副本 → 无按名查找 ✗。</p>',
    ribbon: { k: 4, ok: false } },
  { title: '分界线',
    cls: 'key',
    tag: '关键',
    log: '「名字 → fd」只发生在 open；之后的操作都只认 fd',
    body: '<p><b>分界线</b>：「名字 → fd」的转换只发生在 open；open 之后的一切操作（read / write / close）都只认 fd。</p>' },
  { title: '结论',
    cls: 'good',
    tag: '结论',
    log: '按名查找只发生在 open 的实现里，选 A',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>open 是「文件名」与「句柄 fd」的分界线，按名查找只发生在 open 的实现里</b>。</p>' },
];

var CLS_MAP = { good: 'ok', bad: 'miss', key: 'shift' };

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : (CLS_MAP[s.cls] || 'step'),
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.log || s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1
  };
  if(s.ribbon) sn.ribbon = s.ribbon;
  return sn;
});

AW.init({
  title: '哪个系统调用包含「文件按名查找」',
  subtitle: '考点：<code>open 完成 文件名 → fd</code> · 其余调用只认 fd',
  intro: '点击「▶ 播放」逐步展开推理链。',
  counterLabel: '推理步',
  ribbonTitle: '调用判定（✓ 含按名查找 / ✗ 不含）',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '<b>open() 的实现包含按名查找：</b>参数是路径名，必须逐级查目录找到 FCB / 索引结点，登记打开文件表后返回 fd。<br>记忆锚点：<b>read / write / close 都只凭 fd 定位文件，「名字 → fd」只发生在 open</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
