<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-37 · SR 协议窗口滑动与超时重传</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     过程推演动画：SR（3 比特序号，窗口 4）t1 发 F4、t2 重传 F1（答案 D）
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var SEQ = ['0','1','2','3','4','5','6','7'];

AW.init({
  title: '选择重传 SR：t1 与 t2 时刻甲发送的是什么',
  subtitle: '序号 3 比特（0～7）· 发送窗口 = 接收窗口 = 最大值 <code>4</code> · F0✓ F1丢失 F2✓ F3✓，ACK0/ACK2 到达、ACK3 丢失',
  counterLabel: '已发送帧次',
  ribbonTitle: '事件（✓ 正常推进 / ✗ 帧丢失）',
  intro: '点击「▶ 播放」，按时间顺序推演窗口滑动与重传。',

  build: function(stage){
    stage.innerHTML = '';
    var legend = AW.el('div', 'aw-row-label',
      '<b>读图</b>：实心绿格 = 甲已确认（ACK 已到）；浅绿格 = 已发送未确认；红格 = 在途中丢失；▶窗口左/右 标出当前发送窗口 [lo, hi]。');
    stage.appendChild(legend);
    var self = this;
    this._info = AW.el('div', 'aw-row-label', '');
    stage.appendChild(this._info);
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    var lab = AW.el('div', 'aw-row-label', '<b>序号空间</b>（3 比特 → 序号 0～7）');
    inner.appendChild(lab);
    var row = AW.el('div', 'aw-cells');
    this._cols = [];
    SEQ.forEach(function(ch){
      var col = AW.el('div', 'aw-col');
      var ptr = AW.el('div', 'aw-ptr', '');
      var box = AW.el('div', 'aw-box', 'F' + ch);
      var idx = AW.el('div', 'aw-idx', '序号 ' + ch);
      col.appendChild(ptr); col.appendChild(box); col.appendChild(idx);
      row.appendChild(col);
      self._cols.push({ ptr: ptr, box: box });
    });
    inner.appendChild(row);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'初始',
      log:'3 比特序号 → 序号 0～7；SR 要求 发送窗口 + 接收窗口 ≤ 8，两窗口相同且取最大 → 发送窗口 = 4，初始窗口 [0,3]',
      count:0, win:[0,3] },
    { cls:'ok', tag:'发 F0',
      log:'甲发送 F0，正确到达乙（乙只对正确收到的帧独立确认，稍后回 ACK0）',
      count:1, win:[0,3], sent:[0], ribbon:{k:1, ok:true} },
    { cls:'miss', tag:'F1 丢失',
      log:'甲发送 F1，在途中丢失，乙收不到 → 不会有 ACK1，F1 只能等甲侧超时',
      count:2, win:[0,3], sent:[0], lost:[1], ribbon:{k:2, ok:false} },
    { cls:'ok', tag:'发 F2',
      log:'甲发送 F2，正确到达乙',
      count:3, win:[0,3], sent:[0,2], lost:[1], ribbon:{k:3, ok:true} },
    { cls:'ok', tag:'发 F3',
      log:'甲发送 F3，正确到达乙；窗口 [0,3] 已用满，甲暂时不能发新帧',
      count:4, win:[0,3], sent:[0,2,3], lost:[1], ribbon:{k:4, ok:true} },
    { cls:'shift', tag:'ACK0 到达',
      log:'甲收到 ACK0 → F0 移出窗口，发送窗口滑动为 [1,4]，序号 4 变为可用',
      count:4, win:[1,4], hit:[0], sent:[2,3], lost:[1], ribbon:{k:5, ok:true} },
    { cls:'ok', tag:'t1 发 F4',
      log:'t1 时刻：窗口 [1,4] 中序号 4 可用，甲发送新帧 F4（此时尚未收到 ACK2，F1 也未超时）',
      count:5, win:[1,4], hit:[0], sent:[2,3,4], lost:[1], ribbon:{k:6, ok:true} },
    { cls:'shift', tag:'ACK2 到达',
      log:'甲收到 ACK2 → 发送窗口滑动为 [2,5]；ACK3 在途中丢失，甲收不到（F3 仍视为未确认）',
      count:5, win:[2,5], hit:[0,2], sent:[3,4], lost:[1], ribbon:{k:7, ok:true} },
    { cls:'miss', tag:'t2 F1 超时',
      log:'t2 时刻：F1 的超时计时器到时（图中标注「F1超时」），SR 对每帧独立超时重传 → 甲重传 F1',
      count:6, win:[2,5], hit:[0,2], sent:[3,4], lost:[1], re:1, ribbon:{k:8, ok:true} },
    { cls:'done', tag:'结论',
      log:'t1 时刻甲发送 F4，t2 时刻甲发送 F1，选 D',
      count:6, win:[2,5], hit:[0,2], sent:[3,4], lost:[1], re:1, done:true },
  ],

  render: function(stage, sn, i){
    var cols = this._cols || [];
    var hit = sn.hit || [], sent = sn.sent || [], lost = sn.lost || [];
    function has(arr, k){ return arr.indexOf(k) >= 0; }
    for(var k = 0; k < cols.length; k++){
      var o = cols[k];
      o.ptr.textContent = '';
      var cls = 'aw-box';
      if(has(hit, k)) cls += ' hit';
      else if(has(lost, k)) cls += ' miss';
      else if(has(sent, k)) cls += ' ok';
      o.box.className = cls;
    }
    if(sn.win){
      cols[sn.win[0]].ptr.textContent = '窗口左▶';
      cols[sn.win[1]].ptr.textContent = '◀窗口右';
    }
    if(sn.re != null && cols[sn.re]){
      cols[sn.re].ptr.textContent = '▶超时重传';
    }
    if(this._info){
      var confirmed = hit.length;
      this._info.innerHTML = '发送窗口 = <b>[' + sn.win[0] + ', ' + sn.win[1] + ']</b>（宽 4）· 已确认 <b>' +
        confirmed + '</b> 帧 · 累计发送（含重传）<b>' + sn.count + '</b> 帧' +
        (sn.re != null ? ' · 当前动作：重传 F1' : '');
    }
  },

  result: {
    big: 't1 发 F4，t2 发 F1',
    html: '选 <b>D</b>。记忆锚点：SR 收到 ACK0 窗口即滑动到 [1,4]，t1 发<b>新帧 F4</b>；F1 丢失没有确认、也无 NAK，只能等<b>独立超时计时器</b>到时后于 t2 <b>重传 F1</b>。窗口大小 = 序号空间一半 = 4（发送窗口 + 接收窗口 ≤ 8）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
