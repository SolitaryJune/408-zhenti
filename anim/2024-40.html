<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-40 · 非持久 HTTP/1.0 串行获取的 RTT 数</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     过程推演动画：8 个对象 × 每个 2 RTT = 16 RTT（答案 D）
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var OBJECTS = [
  { name: 'Web 页（HTML）', note: '收到后才发现 7 个图像引用' },
  { name: '图像 1' }, { name: '图像 2' }, { name: '图像 3' }, { name: '图像 4' },
  { name: '图像 5' }, { name: '图像 6' }, { name: '图像 7' },
];

AW.init({
  title: '非持久 HTTP/1.0：取回 1 页 + 7 图要几个 RTT',
  subtitle: '不支持并行 TCP 连接（串行）· 每个对象新建一条 TCP 连接 · 每对象 = 建连 1 RTT + 请求/响应 1 RTT',
  counterLabel: '累计 RTT',
  ribbonTitle: '对象（✓ 取回）',
  intro: '点击「▶ 播放」，逐对象累计往返时间。',

  build: function(stage){
    stage.innerHTML = '';
    var legend = AW.el('div', 'aw-row-label',
      '<b>读图</b>：每行一个对象，两格分别为「TCP 建连 1 RTT」「HTTP 请求+响应 1 RTT」；绿格 = 已完成，实心绿格 = 正在进行。');
    stage.appendChild(legend);
    var self = this;
    this._info = AW.el('div', 'aw-row-label', '');
    stage.appendChild(this._info);
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    this._rows = [];
    OBJECTS.forEach(function(o, idx){
      var lab = AW.el('div', 'aw-row-label', '<b>' + (idx + 1) + '. ' + o.name + '</b>' + (o.note ? '（' + o.note + '）' : ''));
      var row = AW.el('div', 'aw-cells');
      var cols = [];
      ['TCP 建连', '请求+响应'].forEach(function(t){
        var col = AW.el('div', 'aw-col');
        col.style.width = '150px';
        var ptr = AW.el('div', 'aw-ptr', '');
        var box = AW.el('div', 'aw-box', t + ' 1RTT');
        box.style.width = '146px';
        box.style.fontSize = '13px';
        col.appendChild(ptr); col.appendChild(box);
        row.appendChild(col);
        cols.push({ ptr: ptr, box: box });
      });
      inner.appendChild(lab);
      inner.appendChild(row);
      self._rows.push(cols);
    });
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'审题',
      log:'非持久 HTTP/1.0 + 不支持并行连接：1 个 Web 页 + 7 个图像共 8 个对象，只能串行获取，且每个对象都要新建 TCP 连接', count:'0 RTT', doneRows:0 },
    { cls:'ok', tag:'Web 页',
      log:'Web 页：TCP 建连 1 RTT + HTTP 请求/响应 1 RTT = 2 RTT；解析 HTML 后才发现 7 个图像引用',
      count:'2 RTT', doneRows:1, ribbon:{k:1, ok:true} },
    { cls:'ok', tag:'图像 1',
      log:'图像 1：新建 TCP（1 RTT）+ 请求/响应（1 RTT）→ 累计 4 RTT', count:'4 RTT', doneRows:2, ribbon:{k:2, ok:true} },
    { cls:'ok', tag:'图像 2',
      log:'图像 2：又是 2 RTT → 累计 6 RTT', count:'6 RTT', doneRows:3, ribbon:{k:3, ok:true} },
    { cls:'ok', tag:'图像 3',
      log:'图像 3：2 RTT → 累计 8 RTT', count:'8 RTT', doneRows:4, ribbon:{k:4, ok:true} },
    { cls:'ok', tag:'图像 4',
      log:'图像 4：2 RTT → 累计 10 RTT', count:'10 RTT', doneRows:5, ribbon:{k:5, ok:true} },
    { cls:'ok', tag:'图像 5',
      log:'图像 5：2 RTT → 累计 12 RTT', count:'12 RTT', doneRows:6, ribbon:{k:6, ok:true} },
    { cls:'ok', tag:'图像 6',
      log:'图像 6：2 RTT → 累计 14 RTT', count:'14 RTT', doneRows:7, ribbon:{k:7, ok:true} },
    { cls:'ok', tag:'图像 7',
      log:'图像 7：2 RTT → 累计 16 RTT，全部内容接收完毕', count:'16 RTT', doneRows:8, ribbon:{k:8, ok:true} },
    { cls:'done', tag:'结论',
      log:'8 个对象 × 每对象 2 RTT = 16 RTT，选 D', count:'16 RTT', doneRows:8, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows || [];
    var n = sn.doneRows || 0;
    for(var r = 0; r < rows.length; r++){
      var cols = rows[r];
      cols[0].ptr.textContent = '';
      cols[1].ptr.textContent = '';
      var base = r < n ? ' ok' : '';
      cols[0].box.className = 'aw-box' + base;
      cols[1].box.className = 'aw-box' + (r < n ? ' ok' : '');
      if(r === n && r < rows.length){
        cols[0].ptr.textContent = '▶ 建连中';
      }
    }
    if(this._info){
      this._info.innerHTML = '已完成 <b>' + n + ' / 8</b> 个对象，累计 <b>' + sn.count + '</b>' +
        (n < 8 ? '（每对象固定 2 RTT：建连 1 + 请求/响应 1）' : '（8 × 2 = 16 RTT）');
    }
  },

  result: {
    big: '16 RTT',
    html: '选 <b>D</b>。记忆锚点：<b>非持久 HTTP 每个对象 = 建连 1 RTT + 请求/响应 1 RTT = 2 RTT</b>；1 页 + 7 图 = 8 个对象串行 → 8 × 2 = <b>16 RTT</b>。干扰项：14 = 只算 7 个图；9 = 每对象只算 1 RTT；4 = 误按并行/持久连接处理。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
