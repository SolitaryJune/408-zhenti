<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-41 拓扑序列唯一性的判定算法</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

/* 题目不给具体图，这里用两个小示例图演示判定流程（算法对任意图成立）
   图1（不唯一情形）：0→1、0→2、1→3、2→3、3→4
   图2（唯一情形）  ：0→1、1→2、2→3            */
var G1CHIPS = ['0→1', '0→2', '1→3', '2→3', '3→4'];
var G2CHIPS = ['0→1', '1→2', '2→3'];
var G1VALS = [
  ['·', '·', '·', '·', '·'],
  ['0', '1', '1', '2', '1'],
  ['–', '0', '0', '2', '1'],
  ['–', '0', '0', '2', '1']
];
var G1CLS = [
  null,
  ['hit', '', '', '', ''],
  ['dim', 'ok', 'ok', '', ''],
  ['dim', 'miss', 'miss', '', '']
];
var G1PTR = [
  ['', '', '', '', ''],
  ['唯一0', '', '', '', ''],
  ['序1', '', '', '', ''],
  ['序1', '', '', '', '']
];
var G1LIT = [
  [false, false, false, false, false],
  [false, false, false, false, false],
  [true, true, false, false, false],
  [true, true, false, false, false]
];
var G2VALS = [
  ['0', '1', '1', '1'],
  ['–', '–', '0', '1'],
  ['–', '–', '–', '–'],
  ['–', '–', '–', '–']
];
var G2CLS = [
  ['hit', '', '', ''],
  ['dim', 'dim', 'hit', ''],
  ['ok', 'ok', 'ok', 'ok'],
  ['ok', 'ok', 'ok', 'ok']
];
var G2PTR = [
  ['唯一0', '', '', ''],
  ['序1', '序2', '', ''],
  ['序1', '序2', '序3', '序4'],
  ['序1', '序2', '序3', '序4']
];
var G2LIT = [
  [false, false, false],
  [true, true, false],
  [true, true, true],
  [true, true, true]
];

var row1, row2, chipRow1, chipRow2, lab1, lab2;

function setIndeg(row, vals, clsArr, ptrArr) {
  for (var j = 0; j < row.children.length; j++) {
    var box = row.children[j].children[1];
    var ptr = row.children[j].children[0];
    box.textContent = vals[j];
    box.className = 'aw-box' + (clsArr && clsArr[j] ? ' ' + clsArr[j] : '');
    ptr.textContent = (ptrArr && ptrArr[j]) || '';
  }
}

function setChips(row, lit) {
  for (var j = 0; j < row.children.length; j++) {
    row.children[j].style.background = lit[j] ? '#2f9e4424' : '#f8edcb';
    row.children[j].style.color = lit[j] ? '#276942' : '#586e72';
    row.children[j].style.border = lit[j] ? '2px solid #2f9e44' : '2px solid #1b3a4b26';
  }
}

function paint(i) {
  var g1 = i <= 3, k = g1 ? i : i - 4;
  lab1.style.display = g1 ? '' : 'none';
  row1.style.display = g1 ? '' : 'none';
  chipRow1.style.display = g1 ? '' : 'none';
  lab2.style.display = g1 ? 'none' : '';
  row2.style.display = g1 ? 'none' : '';
  chipRow2.style.display = g1 ? 'none' : '';
  if (g1) {
    setIndeg(row1, G1VALS[k], G1CLS[k], G1PTR[k]);
    setChips(chipRow1, G1LIT[k]);
  } else {
    setIndeg(row2, G2VALS[k], G2CLS[k], G2PTR[k]);
    setChips(chipRow2, G2LIT[k]);
  }
}

function mkChips(labels) {
  var row = AW.el('div', 'aw-cells');
  labels.forEach(function (t) {
    var c = AW.el('div', '', t);
    c.style.cssText = 'padding:6px 10px;border-radius:9px;font-size:14px;font-weight:700;font-family:Menlo,monospace';
    row.appendChild(c);
  });
  return row;
}

AW.init({
  title: '判定有向图是否存在唯一的拓扑序列（2024-41）',
  subtitle: '邻接矩阵存储 · 准则：<b>每一步入度为 0 的顶点恰好 1 个</b> ⇔ 拓扑序列唯一',
  counterLabel: '已删除顶点',
  ribbonTitle: '扫描轮次（✓ 唯一通过 / ✗ 出现多个候选）',
  intro: '点击「▶ 播放」：先用示例图 1 看不唯一的情形，再用示例图 2 看唯一的情形。',
  build: function (stage) {
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    lab1 = AW.el('div', 'aw-row-label', '<b>示例图 1</b>（演示「不唯一」情形，题目未给图，仅示意流程）：边 0→1、0→2、1→3、2→3、3→4');
    inner.appendChild(lab1);
    chipRow1 = mkChips(G1CHIPS);
    inner.appendChild(chipRow1);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>入度表 degree[]</b>（绿=已入序，红=候选不唯一，–=已删除）'));
    row1 = AW.cellRow(['·', '·', '·', '·', '·'], ['', '', '', '', ''], null, 1);
    /* 顶点号应为 0~4（cellRow 的 idxStart 不接受 0，这里手动改写） */
    for (var j1 = 0; j1 < 5; j1++) row1.children[j1].children[2].textContent = String(j1);
    inner.appendChild(row1);
    lab2 = AW.el('div', 'aw-row-label', '<b>示例图 2</b>（演示「唯一」情形）：边 0→1、1→2、2→3');
    lab2.style.display = 'none';
    inner.appendChild(lab2);
    chipRow2 = mkChips(G2CHIPS);
    chipRow2.style.display = 'none';
    inner.appendChild(chipRow2);
    row2 = AW.cellRow(['·', '·', '·', '·'], ['', '', '', ''], null, 1);
    /* 顶点号应为 0~3 */
    for (var j2 = 0; j2 < 4; j2++) row2.children[j2].children[2].textContent = String(j2);
    row2.style.display = 'none';
    inner.appendChild(row2);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    paint(0);
  },
  snaps: [
    { cls: 'step', tag: '思想', log: '判定准则：DAG 的拓扑序列唯一 ⇔ 拓扑排序的每一步，入度为 0 的顶点有且仅有 1 个。算法就是在这个意义上跑一遍拓扑排序', count: 0 },
    { cls: 'step', tag: '建入度表', log: '扫描邻接矩阵逐列求和：degree[j] = Σ Edge[i][j]，得示例图 1 的入度表 = 0,1,1,2,1；入度为 0 的只有顶点 0', count: 0 },
    { cls: 'ok', tag: '第 1 轮', log: '第 1 轮扫描：入度 0 的顶点恰好 1 个（顶点 0）→ 删除它：degree[0] 记 −1，其邻接点 1、2 的入度各减 1', count: 1, ribbon: { k: 1, ok: true } },
    { cls: 'miss', tag: '第 2 轮', log: '第 2 轮扫描：入度 0 的顶点有 1 和 2 两个（zero_count &gt; 1）→ 返回 0：之后既可排 1 也可排 2，拓扑序列不唯一', count: 1, ribbon: { k: 2, ok: false } },
    { cls: 'shift', tag: '换图重跑', log: '换成示例图 2（链状 0→1→2→3）再跑一遍：入度表 = 0,1,1,1，入度 0 的只有顶点 0', count: 0 },
    { cls: 'ok', tag: '逐轮唯一', log: '每轮都恰好 1 个入度 0 顶点：删 0 后只剩 1，删 1 后只剩 2……依次删除 0、1、2，无一次出现并列', count: 2, ribbon: { k: 3, ok: true } },
    { cls: 'ok', tag: '删完返回 1', log: '顶点 3 入度归 0 被删除，count = n，全部顶点删除完毕 → 返回 1：拓扑序列唯一', count: 4, ribbon: { k: 4, ok: true } },
    { cls: 'done', tag: '总结', log: '判定准则：某轮 0 个入度 0 顶点 → 有环；某轮 ≥2 个 → 序列不唯一；两种情况都返回 0。每轮恰 1 个且删完全部顶点 → 返回 1', count: 4, done: true }
  ],
  render: function (stage, sn, i) { paint(i); },
  result: {
    big: '准则：每步入度 0 的顶点恰 1 个',
    html: '对邻接矩阵建入度表后反复扫描：<b>0 个入度 0 顶点 → 有环；≥2 个 → 拓扑序列不唯一</b>，都返回 0；每轮恰 1 个并成功删完全部顶点才返回 <b>1</b>。用邻接矩阵实现时时间复杂度 O(n²)（n 轮 × 每轮扫 n 列）。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
