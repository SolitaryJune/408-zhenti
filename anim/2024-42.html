<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-42 散列表：平方探测构造与查找</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

/* H(key)=(key*3)%11，冲突后 Hk=(H0+k*k)%11 */
var KEYS = [20, 3, 11, 18, 9, 14, 7];
/* 每个快照：格内值（11 格）、配色、指针标签 */
var VALS = [
  ['', '', '', '', '', '', '', '', '', '', ''],
  ['', '', '', '', '', '20', '', '', '', '', ''],
  ['', '', '', '', '', '20', '', '', '', '3', ''],
  ['11', '', '', '', '', '20', '', '', '', '3', ''],
  ['11', '', '', '', '', '20', '', '', '', '3', '18'],
  ['11', '', '', '', '', '20', '9', '', '', '3', '18'],
  ['11', '', '14', '', '', '20', '9', '', '', '3', '18'],
  ['11', '', '14', '7', '', '20', '9', '', '', '3', '18'],
  ['11', '', '14', '7', '', '20', '9', '', '', '3', '18'],
  ['11', '', '14', '7', '', '20', '9', '', '', '3', '18'],
  ['11', '', '14', '7', '', '20', '9', '', '', '3', '18'],
  ['11', '', '14', '7', '', '20', '9', '', '', '3', '18']
];
/* cls：''=普通, ok=已存, hit=本次落位, miss=本次探测遇冲突, amber=失败确认的空位 */
var CLS = [
  ['', '', '', '', '', '', '', '', '', '', ''],
  ['', '', '', '', '', 'hit', '', '', '', '', ''],
  ['', '', '', '', '', 'ok', '', '', '', 'hit', ''],
  ['hit', '', '', '', '', 'ok', '', '', '', 'ok', ''],
  ['ok', '', '', '', '', 'ok', '', '', '', 'ok', 'hit'],
  ['ok', '', '', '', '', 'miss', 'hit', '', '', 'ok', 'ok'],
  ['ok', '', 'hit', '', '', 'ok', 'ok', '', '', 'miss', 'miss'],
  ['miss', '', 'ok', 'hit', '', 'ok', 'ok', '', '', 'ok', 'miss'],
  ['ok', '', 'ok', 'ok', '', 'ok', 'ok', '', '', 'ok', 'ok'],
  ['ok', '', 'miss', 'ok', '', 'ok', 'ok', '', '', 'miss', 'miss'],
  ['miss', 'ok', 'miss', 'miss', 'ok', 'ok', 'miss', 'amber', 'ok', 'miss', 'ok'],
  ['ok', '', 'ok', 'ok', '', 'ok', 'ok', '', '', 'ok', 'ok']
];
var PTRS = [
  ['', '', '', '', '', '', '', '', '', '', ''],
  ['', '', '', '', '', 'H0', '', '', '', '', ''],
  ['', '', '', '', '', '', '', '', '', 'H0', ''],
  ['H0', '', '', '', '', '', '', '', '', '', ''],
  ['', '', '', '', '', '', '', '', '', '', 'H0'],
  ['', '', '', '', '', 'H0', 'H1', '', '', '', ''],
  ['', '', '', '', '', '', '', '', '', 'H0', 'H1'],
  ['H1', '', '', 'H2', '', '', '', '', '', '', 'H0'],
  ['', '', '', '', '', '', '', '', '', '', ''],
  ['比3', '', '比3', 'ok', '', '', '', '', '', '比1', '比2'],
  ['比4', '', '比1', '比2', '', '', '比3', '比5', '', '', ''],
  ['', '', '', '', '', '', '', '', '', '', '']
];
/* H0 地址提示行（只在相关步显示） */
var H0TIP = [
  '', '20：H0=60%11=5', '3：H0=9%11=9', '11：H0=33%11=0', '18：H0=54%11=10',
  '9：H0=27%11=5（冲突）', '14：H0=42%11=9（冲突）', '7：H0=21%11=10（冲突）',
  '', '14：H0=9', '8：H0=24%11=2', ''
];

var hRow, tip;

function paint(i) {
  for (var j = 0; j < 11; j++) {
    var box = hRow.children[j].children[1];
    var ptr = hRow.children[j].children[0];
    box.textContent = VALS[i][j] || '';
    var c = CLS[i][j];
    if (c === 'amber') {
      box.className = 'aw-box';
      box.style.border = '2px solid #d97706';
      box.style.background = '#fef3c7';
    } else {
      box.className = 'aw-box' + (c ? ' ' + c : '');
      box.style.border = '';
      box.style.background = '';
    }
    ptr.textContent = PTRS[i][j];
  }
  tip.textContent = H0TIP[i] ? '当前：' + H0TIP[i] : '';
}

AW.init({
  title: '散列表：H(key)=(key×3)%11 平方探测（2024-42）',
  subtitle: '表长 11（地址 0~10）· 冲突后 <code>Hk=(H0+k²)%11</code>，k=1,2,3,… · 关键字 20,3,11,18,9,14,7 依次存入',
  counterLabel: '已插入关键字',
  ribbonTitle: '关键字（✓ 已插入）',
  intro: '点击「▶ 播放」：逐个插入 7 个关键字，再看查找 14 与查找 8 的过程。',
  build: function (stage) {
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    tip = AW.el('div', 'aw-row-label', '');
    inner.appendChild(tip);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>散列表 HT</b>（下方数字为地址 0~10；红=探测时冲突，绿=已存关键字）'));
    hRow = AW.cellRow(['', '', '', '', '', '', '', '', '', '', ''], ['', '', '', '', '', '', '', '', '', '', ''], null, 1);
    /* 地址应为 0~10（cellRow 的 idxStart 不接受 0，这里手动改写） */
    for (var j = 0; j < 11; j++) hRow.children[j].children[2].textContent = String(j);
    inner.appendChild(hRow);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    paint(0);
  },
  snaps: [
    { cls: 'shift', tag: '开始', log: '长度 11 的空散列表。散列函数 H(key)=(key×3)%11；发生冲突时按平方探测 Hk=(H0+k²)%11 找下一地址', count: 0 },
    { cls: 'ok', tag: '插入 20', log: '20：H0=(20×3)%11=5，5 号空 → 20 存入 5 号', count: 1, ribbon: { k: 1, ok: true } },
    { cls: 'ok', tag: '插入 3', log: '3：H0=(3×3)%11=9，9 号空 → 3 存入 9 号', count: 2, ribbon: { k: 2, ok: true } },
    { cls: 'ok', tag: '插入 11', log: '11：H0=(11×3)%11=33%11=0，0 号空 → 11 存入 0 号', count: 3, ribbon: { k: 3, ok: true } },
    { cls: 'ok', tag: '插入 18', log: '18：H0=(18×3)%11=54%11=10，10 号空 → 18 存入 10 号', count: 4, ribbon: { k: 4, ok: true } },
    { cls: 'shift', tag: '插入 9', log: '9：H0=(9×3)%11=5，5 号已有 20 → H1=(5+1²)%11=6，6 号空 → 9 存入 6 号', count: 5, ribbon: { k: 5, ok: true } },
    { cls: 'shift', tag: '插入 14', log: '14：H0=42%11=9，9 号有 3 → H1=(9+1)%11=10，有 18 → H2=(9+2²)%11=2，2 号空 → 14 存入 2 号', count: 6, ribbon: { k: 6, ok: true } },
    { cls: 'shift', tag: '插入 7', log: '7：H0=21%11=10，有 18 → H1=(10+1)%11=0，有 11 → H2=(10+4)%11=3，3 号空 → 7 存入 3 号', count: 7, ribbon: { k: 7, ok: true } },
    { cls: 'ok', tag: '构造完成', log: '7 个关键字全部插入：装填因子 α = 7/11 ≈ 0.64（元素数 ÷ 表长）', count: 7 },
    { cls: 'step', tag: '查找 14', log: '查 14：H0=9 → 比 3，不等；H1=10 → 比 18，不等；H2=2 → 比 14，命中。比较序列 = 3, 18, 14', count: 7 },
    { cls: 'shift', tag: '查找 8', log: '查 8：H0=24%11=2 → 比 14；H1=3 → 比 7；H2=(2+4)%11=6 → 比 9；H3=(2+9)%11=0 → 比 11；H4=(2+16)%11=7 → 7 号为空，确认失败。失败地址 = 7', count: 7 },
    { cls: 'done', tag: '完成', log: '结论：(1) HT 如上，α=7/11；(2) 查 14 的比较序列 3,18,14；(3) 查 8 失败时散列地址为 7', count: 7, done: true }
  ],
  render: function (stage, sn, i) { paint(i); },
  result: {
    big: 'α=7/11 · 比较序列 3,18,14 · 失败地址 7',
    html: '(1) 建成的 HT：0 号 11、2 号 14、3 号 7、5 号 20、6 号 9、9 号 3、10 号 18，<b>α=7/11</b>；(2) 查 14 依次比较 <b>3, 18, 14</b> 命中；(3) 查 8 一路探到 <b>7 号为空</b>才确认失败。记忆点：平方探测偏移量是 1, 4, 9, 16…；<b>遇到空位即可下结论</b>（成功或失败）。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
