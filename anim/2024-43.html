<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-43 指令格式与数据通路动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 算法/过程类：控制信号 → ALU 加法 → 标志位 → 指令译码全过程演示 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '计算机 M：控制信号、ALU 运算与指令译码',
  subtitle: 'add / slli / lw · 数据通路（A=rs1，B=rs2，扩展器接 MUX 1 端）',
  counterLabel: '步骤',
  intro: '点击「▶ 播放」按问逐步演示。',

  build: function(stage){
    stage.innerHTML = '';
    var inner = AW.el('div', '');

    // 控制信号 chips
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>控制信号</b>（随步骤给出取值）'));
    var chipRow = AW.el('div', 'aw-cells');
    chipRow.style.marginBottom = '4px';
    var mkChip = function(name){
      var b = AW.el('div', 'aw-box dim', '—');
      b.style.width = '150px';
      b.style.height = '44px';
      b.style.fontSize = '14px';
      chipRow.appendChild(b);
      return b;
    };
    this._chB = mkChip();
    this._chE = mkChip();
    this._chC = mkChip();
    inner.appendChild(chipRow);
    inner.appendChild(AW.el('div', 'aw-row-label', '<span style="font-size:12px;color:#586e72">从左到右：ALUBsrc（0=B 寄存器，1=扩展器）· Ext（0=零扩展，1=符号扩展）· ALUctr（000=加，001=减，010=逻辑左移）</span>'));

    // 加法竖式
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>ALU 加法竖式</b>（第（2）问：87654321H + 98765432H）'));
    var mkRow = function(cells, cls){
      var row = AW.el('div', 'aw-cells');
      row.style.marginBottom = '4px';
      var boxes = [];
      cells.forEach(function(c){
        var b = AW.el('div', 'aw-box' + (cls ? ' ' + cls : ' dim'), c);
        b.style.fontSize = '16px';
        row.appendChild(b);
        boxes.push(b);
      });
      inner.appendChild(row);
      return boxes;
    };
    var idxRow = AW.el('div', 'aw-cells');
    idxRow.style.marginBottom = '4px';
    ['31..28','27..24','23..20','19..16','15..12','11..8','7..4','3..0'].forEach(function(t){
      var d = AW.el('div', 'aw-idx', t);
      d.style.width = '44px';
      d.style.textAlign = 'center';
      idxRow.appendChild(d);
    });
    inner.appendChild(idxRow);
    this._ra = mkRow(['8','7','6','5','4','3','2','1']);
    this._rb = mkRow(['9','8','7','6','5','4','3','2']);
    this._rf = mkRow(['?','?','?','?','?','?','?','?']);
    // CF chip
    var cfRow = AW.el('div', 'aw-cells');
    cfRow.style.marginBottom = '4px';
    var cfl = AW.el('div', 'aw-row-label', '');
    cfl.style.margin = '0';
    var cfBox = AW.el('div', 'aw-box dim', 'CF=?');
    cfBox.style.width = '70px';
    cfBox.style.height = '34px';
    cfBox.style.fontSize = '13px';
    cfRow.appendChild(cfBox);
    cfRow.appendChild(AW.el('div', 'aw-row-label', '<span style="font-size:12px;color:#586e72;margin:8px 0 0 8px">最高位进位（无符号溢出标志）</span>'));
    inner.appendChild(cfRow);
    this._cf = cfBox;

    // 位段拆解条（第（5）问用）
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>机器码 A040 A103H 的位段拆解</b>（第（5）问）'));
    var bfRow = AW.el('div', 'aw-cells');
    bfRow.style.marginBottom = '4px';
    var mkBf = function(top, val, w){
      var col = AW.el('div', '');
      col.style.marginRight = '6px';
      col.appendChild(AW.el('div', 'aw-idx', top));
      var b = AW.el('div', 'aw-box dim', val);
      b.style.width = w + 'px';
      b.style.height = '40px';
      b.style.fontSize = '13px';
      col.appendChild(b);
      bfRow.appendChild(col);
      return b;
    };
    this._bfImm = mkBf('imm IR[31:20]', 'A04H', 100);
    this._bfRs1 = mkBf('rs1 IR[19:15]', '00001', 92);
    this._bfF3  = mkBf('功能码 IR[14:12]', '010', 60);
    this._bfRd  = mkBf('rd IR[11:7]', '00010', 92);
    this._bfOp  = mkBf('操作码 IR[6:0]', '0000011', 110);
    inner.appendChild(bfRow);
    this._bfLabel = AW.el('div', 'aw-row-label', '');
    inner.appendChild(this._bfLabel);

    this._note = AW.el('div', 'aw-row-label', '');
    inner.appendChild(this._note);
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'第（1）问', log:'rs1、rs2 字段各占 5 位 → 最多 2^5 = 32 个通用寄存器；字长 32 位 → 移位位数 0~31 共 32 种取值 → shamt 占 5 位。', count:0, note:'（1）32 个寄存器；shamt 5 位（0~31）' },
    { cls:'shift', tag:'第（2）问', log:'add 功能 R[rd] ← R[rs1]+R[rs2]：ALU 第二操作数选寄存器 B → ALUBsrc = 0。', count:1, note:'（2）ALUBsrc = 0（选 B）', ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'ALU 加法', log:'逐位相加：1+2=3、2+3=5、3+4=7、4+5=9、5+6=B、6+7=D、7+8=F、8+9=17（本位 1 并进位）→ F = 1FDB9753H。', count:2, note:'F = 1FDB9753H', ribbon:{k:2, ok:true} },
    { cls:'miss',  tag:'判 OF',   log:'符号位：8、9 的最高位都是 1（负数），结果 1FDB9753H 的最高位是 0（正数）——负+负=正 → OF = 1（有符号溢出）。', count:3, note:'OF = 1（负 + 负 = 正）', ribbon:{k:3, ok:true} },
    { cls:'miss',  tag:'判 CF',   log:'最高位 8+9=17 产生进位 → CF = 1。若 add 处理无符号整数，应根据 CF 判断溢出（CF=1 即溢出）。', count:4, note:'CF = 1；无符号整数看 CF', ribbon:{k:4, ok:true} },
    { cls:'shift', tag:'第（3）问', log:'slli：移位位数只使用 IR[31:20] 的低 5 位（shamt），扩展器扩展的高位结果不会被使用 → Ext 取 0 或 1 都可以。', count:5, note:'（3）slli：Ext = 0 或 1 均可', ribbon:{k:5, ok:true} },
    { cls:'shift', tag:'第（4）问', log:'lw：R[rd] ← M[R[rs1]+imm]。imm 是补码偏移量，可能为负 → Ext = 1（符号扩展）；有效地址 = R[rs1]+imm → ALUctr = 000（加法）。', count:6, note:'（4）lw：Ext = 1，ALUctr = 000', ribbon:{k:6, ok:true} },
    { cls:'step',  tag:'第（5）问', log:'拆 A040 A103H：操作码 IR[6:0] = 0000011，与 lw 操作码一致；功能码 IR[14:12] = 010 也与 lw 一致；而 add 是 0110011、slli 是 0010011，均不符 → 一定是 lw。', count:7, note:'（5）操作码 0000011 + 功能码 010 → 必是 lw', ribbon:{k:7, ok:true} },
    { cls:'shift', tag:'扩展 imm', log:'imm = IR[31:20] = A04H，符号位为 1 → 符号扩展为 FFFFFA04H（值 = −1532）。', count:8, note:'A04H → 符号扩展 → FFFFFA04H' },
    { cls:'ok',    tag:'算地址',   log:'有效地址 = R[01H] + FFFFFA04H = FFFFA2D0H + FFFFFA04H = FFFF9CD4H（进位超出 32 位丢弃）。', count:9, note:'地址 = FFFF9CD4H', ribbon:{k:8, ok:true} },
    { cls:'done',  tag:'完成',     log:'五问全部完成：32 个寄存器 / shamt 5 位；ALUBsrc=0，F=1FDB9753H，OF=CF=1；slli 的 Ext 任意；lw 的 Ext=1、ALUctr=000；A040A103H 必是 lw，地址 FFFF9CD4H。', count:10, done:true, note:'全部答案见结论卡' },
  ],

  render: function(stage, sn, i){
    var setCls = function(b, cls){ b.className = 'aw-box' + (cls ? ' ' + cls : ''); };
    // chips
    setCls(this._chB, 'dim'); setCls(this._chE, 'dim'); setCls(this._chC, 'dim');
    this._chB.textContent = '—'; this._chE.textContent = '—'; this._chC.textContent = '—';
    // 加法行
    var ra = this._ra, rb = this._rb, rf = this._rf;
    ra.forEach(function(b){ setCls(b, 'dim'); });
    rb.forEach(function(b){ setCls(b, 'dim'); });
    rf.forEach(function(b, k){ setCls(b, 'dim'); b.textContent = '?'; });
    setCls(this._cf, 'dim'); this._cf.textContent = 'CF=?';
    // 位段条
    var bfs = [this._bfImm, this._bfRs1, this._bfF3, this._bfRd, this._bfOp];
    bfs.forEach(function(b){ setCls(b, 'dim'); });
    this._bfLabel.innerHTML = '<span style="font-size:12px;color:#b9cbd0">（第（5）问开始时点亮）</span>';
    if (i >= 1){ this._chB.textContent = 'ALUBsrc = 0'; setCls(this._chB, 'shift'); }
    if (i >= 2){
      ra.forEach(function(b){ setCls(b, 'ok'); });
      rb.forEach(function(b){ setCls(b, 'ok'); });
      ['1','F','D','B','9','7','5','3'].forEach(function(c, k){ rf[k].textContent = c; setCls(rf[k], 'ok'); });
    }
    if (i >= 3){ rf.forEach(function(b, k){ if (k === 0) setCls(rf[k], 'shift'); else setCls(rf[k], 'ok'); }); }
    if (i >= 4){ setCls(this._cf, 'miss'); this._cf.textContent = 'CF=1'; }
    if (i >= 5){ this._chE.textContent = 'Ext = 0 或 1'; setCls(this._chE, 'shift'); this._chC.textContent = 'ALUctr=010'; setCls(this._chC, 'shift'); }
    if (i >= 6){ this._chE.textContent = 'Ext = 1'; setCls(this._chE, 'miss'); this._chC.textContent = 'ALUctr = 000'; setCls(this._chC, 'ok'); }
    if (i >= 7){
      setCls(this._bfImm, 'dim'); setCls(this._bfRs1, 'ok'); setCls(this._bfF3, 'ok');
      setCls(this._bfRd, 'ok'); setCls(this._bfOp, 'ok');
      this._bfLabel.innerHTML = '<span style="font-size:12px;color:#276942">操作码 0000011 = lw 操作码，功能码 010 = lw 功能码 → 必是 lw（rs1=1，rd=2）</span>';
    }
    if (i >= 8){ setCls(this._bfImm, 'shift'); this._bfLabel.innerHTML = '<span style="font-size:12px;color:#92400e">imm = A04H，符号位 1 → 符号扩展 FFFFFA04H（−1532）</span>'; }
    if (i >= 9){ this._bfLabel.innerHTML = '<span style="font-size:12px;color:#276942">FFFFA2D0H + FFFFFA04H = FFFF9CD4H（有效地址）</span>'; }
    this._note.innerHTML = '<b>' + (sn.note || '') + '</b>';
  },

  result: {
    big: '五问答案全齐',
    html: '<p>（1）最多 <b>32 个</b>通用寄存器（rs1/rs2 各 5 位），shamt <b>5 位</b>（移位 0~31）；（2）ALUBsrc=<b>0</b>，F=<b>1FDB9753H</b>，OF=<b>1</b>，CF=<b>1</b>，无符号看 <b>CF</b>；（3）slli 的 Ext <b>0/1 均可</b>（扩展高位不被使用）；（4）lw：Ext=<b>1</b>、ALUctr=<b>000</b>；（5）操作码+功能码双吻合 → 必为 <b>lw</b>，有效地址 <b>FFFF9CD4H</b>。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
