<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024-46 · 缓冲区 B 的同步与互斥</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- ============================================================
     PV 操作推演动画：临界区判定 + 同步信号量 + 互斥信号量（大题三问）
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 各阶段两个进程的代码行
var CODE = {
  0: { p1: ['（条件回顾）'],            p2: ['（条件回顾）'] },
  1: { p1: ['C1;  // 写入 B'],          p2: ['C1;  // 写入 B'] },
  2: { p1: ['C1;', 'signal(S);'],       p2: ['wait(S);', 'C2;'] },
  3: { p1: ['wait(mutex);', 'C3;', 'signal(mutex);'], p2: ['wait(mutex);', 'C3;', 'signal(mutex);'] },
};

var LINE_STYLE = 'text-align:left;padding:5px 10px;margin:4px 0;border-radius:8px;background:#f8edcb;border:1px solid #1b3a4b26;font-family:Menlo,monospace;font-size:13px;';
var HI_STYLE = {
  ok:    { background: '#2f9e4424', border: '1px solid #2f9e44', color: '#1e4d33', fontWeight: '700' },
  miss:  { background: '#e6394620', border: '1px solid #e63946', color: '#a02830', fontWeight: '700' },
  shift: { background: '#f8edcb', border: '1px solid #e07a2f', color: '#92400e', fontWeight: '700' },
  none:  { background: '#f8edcb', border: '1px solid #1b3a4b26', color: '#213e48', fontWeight: '400' },
};

AW.init({
  title: '缓冲区 B 的同步与互斥：三问推演',
  subtitle: 'B 只放 <code>1 个分组</code> · C1 写（需 B 空）· C2 读 / C3 改（需 B 非空）· 大题三问',
  counterLabel: '推演步',
  ribbonTitle: '三问结论（✓ 已得出）',
  intro: '点击「▶ 播放」逐步推演三问的信号量方案。',

  build: function(stage){
    stage.innerHTML = '';
    var top = AW.el('div', 'aw-cells');
    top.style.gap = '24px';
    function chipCol(label){
      var col = AW.el('div', 'aw-col');
      col.style.width = '130px';
      var ptr = AW.el('div', 'aw-ptr', label);
      var box = AW.el('div', 'aw-box', '—');
      box.style.width = '130px';
      box.style.height = '46px';
      box.style.fontSize = '15px';
      var idx = AW.el('div', 'aw-idx', '');
      col.appendChild(ptr); col.appendChild(box); col.appendChild(idx);
      return { col: col, box: box, idx: idx };
    }
    this._b = chipCol('缓冲区 B');
    this._s = chipCol('信号量值');
    top.appendChild(this._b.col);
    top.appendChild(this._s.col);
    stage.appendChild(top);

    var panels = AW.el('div', 'aw-cells');
    panels.style.gap = '24px';
    panels.style.marginTop = '10px';
    this._panels = [];
    var names = ['P1（P2 同理）', 'P2'];
    for(var k = 0; k < 2; k++){
      var col = AW.el('div', 'aw-col');
      col.style.width = '220px';
      col.style.alignItems = 'stretch';
      var head = AW.el('div', 'aw-row-label', '<b>' + names[k] + '</b>');
      var lines = AW.el('div', '');
      col.appendChild(head);
      col.appendChild(lines);
      panels.appendChild(col);
      this._panels.push(lines);
    }
    stage.appendChild(panels);
    this._cap = AW.el('div', 'aw-row-label', '');
    stage.appendChild(this._cap);
  },

  snaps: [
    { cls:'step',  tag:'条件',        log:'缓冲区 B 只放 1 个分组：C1 写入（要求 B 空）、C2 读出、C3 修改（要求 B 非空）', count:1, phase:0, sem:'—',        b:'空',     cap:'先看三个操作对 B 的要求' },
    { cls:'ok',    tag:'问(1) 判定',  log:'P1、P2 都要执行 C1 写 B：B 是共享资源且一次只能容纳一次写入，并发 C1 会互相冲突 → C1 必须互斥执行 → C1 的代码是临界区', count:2, phase:1, sem:'—',        b:'空',     cap:'问(1)：两个 C1 都想写 B——必须互斥，C1 是临界区', hi:[0,0], hiCls:'miss', hi2:[1,0], ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'问(2) 设计',  log:'B 初空、P1 写一次、P2 读一次：只需 1 个同步信号量 S=0，语义是「B 中是否已有数据」（0 表示还没有数据）', count:3, phase:2, sem:'S = 0',    b:'空',     cap:'问(2)：一写一读 → 同步信号量 S，初值 0' },
    { cls:'ok',    tag:'P1 执行 C1',  log:'P1：C1 把分组写入 B，B 变为非空', count:4, phase:2, sem:'S = 0',    b:'有数据', cap:'问(2)：P1 先写', hi:[0,0] },
    { cls:'shift', tag:'P1 signal(S)', log:'P1：signal(S) 把 S 由 0 增为 1——通知 P2「已有数据可读」', count:5, phase:2, sem:'S = 1',    b:'有数据', cap:'问(2)：P1 发信号', hi:[0,1], hiCls:'shift' },
    { cls:'ok',    tag:'P2 wait(S)',  log:'P2：wait(S)，S 由 1 减为 0（未变负、不阻塞），获得「可读」许可；若 P2 先到，会在 wait(S) 上阻塞直到 P1 写完', count:6, phase:2, sem:'S = 0',    b:'有数据', cap:'问(2)：P2 取得许可', hi:[1,0] },
    { cls:'ok',    tag:'P2 执行 C2',  log:'P2：C2 从 B 读出分组，B 变回空', count:7, phase:2, sem:'S = 0',    b:'空',     cap:'问(2)：P2 读出', hi:[1,1] },
    { cls:'ok',    tag:'问(2) 结论',  log:'最少 1 个信号量：S 初值 0；P1: C1 → signal(S)，P2: wait(S) → C2。再加 mutex 反而违背「尽可能少」', count:8, phase:2, sem:'S = 0',    b:'空',     cap:'问(2)：仅 1 个同步信号量 S=0', ribbon:{k:2, ok:true} },
    { cls:'step',  tag:'问(3) 设计',  log:'B 初非空、P1 与 P2 各执行一次 C3（都要修改 B）：无先后次序要求，但不能同时改 → 只需 1 个互斥信号量 mutex=1', count:9, phase:3, sem:'mutex = 1', b:'有数据', cap:'问(3)：两个 C3 竞争 → 互斥信号量 mutex=1' },
    { cls:'ok',    tag:'P1 进临界区', log:'P1：wait(mutex)，mutex 由 1 减为 0，进入临界区执行 C3', count:10, phase:3, sem:'mutex = 0', b:'有数据', cap:'问(3)：P1 进入', hi:[0,0] },
    { cls:'miss',  tag:'P2 被挡住',   log:'此刻若 P2 也执行 wait(mutex)：mutex 已为 0 → P2 阻塞在临界区外——这就是互斥', count:11, phase:3, sem:'mutex = 0', b:'有数据', cap:'问(3)：P2 进不来（被阻塞）', hi:[1,0], hiCls:'miss' },
    { cls:'shift', tag:'P1 释放',     log:'P1：signal(mutex)，mutex 由 0 增为 1，退出临界区并唤醒 P2', count:12, phase:3, sem:'mutex = 1', b:'有数据', cap:'问(3)：P1 释放', hi:[0,2], hiCls:'shift' },
    { cls:'ok',    tag:'P2 完成',     log:'P2：wait(mutex) 成功（1 → 0）→ C3 → signal(mutex)（0 → 1），两个 C3 一先一后完成', count:13, phase:3, sem:'mutex = 1', b:'有数据', cap:'问(3)：P2 完成', hi:[1,2] },
    { cls:'done',  tag:'结论',        log:'(1) C1 是临界区；(2) 同步信号量 S=0：P1: C1→signal(S)，P2: wait(S)→C2；(3) 互斥信号量 mutex=1：双方 wait(mutex)→C3→signal(mutex)', count:14, phase:0, sem:'—', b:'—', cap:'三问结论汇总', ribbon:{k:3, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var code = CODE[sn.phase] || CODE[0];
    var panels = this._panels || [];
    function hiFor(p, l){
      if(sn.hi && sn.hi[0] === p && sn.hi[1] === l) return sn.hiCls || sn.cls;
      if(sn.hi2 && sn.hi2[0] === p && sn.hi2[1] === l) return sn.hiCls || sn.cls;
      return null;
    }
    for(var p = 0; p < 2; p++){
      var lines = code[p === 0 ? 'p1' : 'p2'];
      var cont = panels[p];
      cont.innerHTML = '';
      for(var l = 0; l < lines.length; l++){
        var d = AW.el('div', '', lines[l]);
        d.setAttribute('style', LINE_STYLE);
        var hc = hiFor(p, l);
        var sty = HI_STYLE[hc || 'none'];
        for(var key in sty){ d.style[key] = sty[key]; }
        cont.appendChild(d);
      }
    }
    this._b.box.textContent = sn.b;
    this._b.box.className = 'aw-box' + (sn.b === '有数据' ? ' ok' : (sn.b === '空' ? '' : ' dim'));
    this._s.box.textContent = sn.sem;
    this._s.box.className = 'aw-box' + (sn.sem === '—' ? ' dim' : ' shift');
    this._cap.innerHTML = '<b>' + sn.cap + '</b>';
  },

  result: {
    big: '三问全解',
    html: '<b>（1）C1 的代码是临界区</b>：P1、P2 都要写共享缓冲区 B（一次只容纳一个分组），必须互斥执行。<br><b>（2）</b>只需 1 个同步信号量 <code>S=0</code>（B 初空）：P1: <code>C1; signal(S);</code>　P2: <code>wait(S); C2;</code><br><b>（3）</b>只需 1 个互斥信号量 <code>mutex=1</code>：双方 <code>wait(mutex); C3; signal(mutex);</code><br>记忆点：<b>同步看「先后」，互斥看「竞争」；信号量语义决定初值——「已有数据」初值 0，「可用名额」初值 1。</b>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
