</head>
<body>
<!-- ============================================================
     概念推理动画：2024 大题 5 问逐问推演（OSPF / TTL=16 / 30s·60s / eBGP·iBGP / R11·R13）
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：四个 AS 的拓扑与约束',
    cls: 'key',
    body: '<p>AS1 内部跑 <b>RIP</b>（每 <code>30 s</code> 交换一次距离向量），边界路由器 R11/R12/R13 分别连 AS2(R22)、AS3(R33)、AS4(R44)，内部 R14/R15/R16 挂着 210.2.3.0/24 与 210.2.4.0/24。约束：<b>AS3</b> 内任意两主机 ≤ <code>15</code> 个路由器；<b>AS4</b> 内可能 <code>超过 20</code> 个。</p>' },
  { title: '（1）AS4 选 OSPF',
    cls: 'good',
    body: '<p>RIP 最大距离 <b>15</b>（16 = 不可达）；AS4 内通信可能经过 <b>20 多个路由器</b>，超出 RIP 上限。OSPF 无跳数限制 → AS4 选 <b>OSPF</b>。</p>' },
  { title: '（2）初始 TTL 至少 16',
    cls: 'good',
    body: '<p>TTL 每过一个路由器 <b>减 1</b>，减到 0 分组被丢弃。AS3 内最多经过 <code>15</code> 个路由器：TTL = 15 时减完恰好为 0、被丢在半路；初始 TTL 至少 <b>16</b>。</p>' },
  { title: '（3）210.2.3.0/24：至少 30 s',
    cls: 'good',
    body: '<p>RIP 一轮交换信息前进一跳（本轮交换的是<b>更新前</b>的表）。该网直连 <b>R14</b>：初始交换后 R11、R15 学到；<code>t = 30 s</code> 第一次周期交换后 R12（经 R11）、R13（经 R15）、R16（经 R15）也学到 → R11～R16 全部正确，<b>至少 30 s</b>。</p>' },
  { title: '（3）210.2.4.0/24：至少 60 s',
    cls: 'good',
    body: '<p>该网直连 <b>R16</b>：初始交换后 R13、R15 学到；<code>30 s</code> 后 R12、R14 学到，但 R11 的邻居 R12、R14 那一轮交换的仍是<b>旧表</b>，R11 还没拿到；<code>60 s</code> 第二次周期交换时 R11 才学到 → <b>至少 60 s</b>。</p>' },
  { title: '（4）eBGP + UPDATE；再 iBGP 通告',
    cls: 'good',
    body: '<p>R44（AS4）↔ R13（AS1）<b>跨 AS</b>：由 <b>BGP 外部会话（eBGP）</b>完成，通告报文是 <b>UPDATE</b>。R13 与 R14、R15 <b>同属 AS1</b>：经 <b>BGP 内部会话（iBGP）</b>把 136.5.16.0/20 的可达性通告给它们。</p>' },
  { title: '（5）R14 下一跳 R11，R15 下一跳 R13',
    cls: 'good',
    body: '<p>BGP 选路：先比 <b>AS 路径条数</b>。经 R11 = AS2,AS8,AS19（3 个）；经 R13 = AS4,AS10,AS19（3 个）；经 R12 = AS3,AS7,AS11,AS19（4 个）→ 经 R12 淘汰。R11、R13 等长 → 比 AS1 内到下一跳的 <b>RIP 距离</b>：R14 到 R11 = 1（直连）&lt; 到 R13 = 2 → 选 <b>R11</b>；R15 到 R13 = 1（直连）&lt; 到 R11 = 2 → 选 <b>R13</b>。</p>' },
  { title: '结论：五问答案汇总',
    cls: 'good',
    body: '<p><b>（1）OSPF</b>；（2）TTL 至少 <b>16</b>；（3）210.2.3.0/24 至少 <b>30 s</b>、210.2.4.0/24 至少 <b>60 s</b>；（4）<b>eBGP 外部会话 + UPDATE 报文</b>，R13 经 <b>iBGP 内部会话</b>通告 R14/R15；（5）R14 下一跳 <b>R11</b>、R15 下一跳 <b>R13</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'RIP/OSPF、TTL 与 BGP：大题五问逐问推演',
  subtitle: '考点：IGP 选型 · TTL 下限 · RIP 收敛轮数 · eBGP/iBGP 与 UPDATE · BGP 选路规则',
  counterLabel: '已展开',
  intro: '点击「▶ 播放」，按问逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '五问答案',
    html: '<b>（1）OSPF</b>（RIP 15 跳上限不够用）；<b>（2）TTL ≥ 16</b>（最多 15 个路由器 + 1）；<b>（3）30 s / 60 s</b>（信息一轮前进一跳，R11 到 210.2.4.0/24 隔了两个周期）；<b>（4）eBGP + UPDATE，R13 经 iBGP 通告</b>；<b>（5）R14 → R11，R15 → R13</b>（AS 路径等长比 IGP 开销，直连者胜）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
