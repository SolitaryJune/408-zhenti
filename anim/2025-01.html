<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-01 双层循环时间复杂度动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '双层循环的时间复杂度：数内层总执行次数',
  subtitle: '<code>for(i=1; i*i<=n; i++) for(j=1; j<=i; j++) count++;</code> · 取 n=36 实测（i 最大到 6）',
  counterLabel: 'count 累计',
  ribbonTitle: '外层 i（✓ 进入循环 / ✗ 退出）',
  intro: '点击「▶ 播放」逐轮观察外层 i 与 count 的累计。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    this._iWrap = AW.el('div', '');
    this._sumWrap = AW.el('div', '');
    this._formula = AW.el('div', 'aw-row-label',
      '内层第 i 轮执行 i 次 ⇒ 总次数 = 1+2+…+k（k = ⌊√n⌋）');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>外层变量 i</b>（条件 i*i ≤ 36）'));
    inner.appendChild(this._iWrap);
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>count 累计值</b>（1+2+…+i）'));
    inner.appendChild(this._sumWrap);
    inner.appendChild(this._formula);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'开始', log:'设 n=36。外层条件 i*i<=36：i 最多只能到 6，不是 36！', count:0 },
    { cls:'step', tag:'i=1', log:'i=1：1×1≤36 成立，内层 j=1..1 执行 1 次，count = 1', count:1, ribbon:{k:1, ok:true} },
    { cls:'step', tag:'i=2', log:'i=2：4≤36 成立，内层执行 2 次，count = 1+2 = 3', count:3, ribbon:{k:2, ok:true} },
    { cls:'step', tag:'i=3', log:'i=3：9≤36 成立，内层执行 3 次，count = 6', count:6, ribbon:{k:3, ok:true} },
    { cls:'step', tag:'i=4', log:'i=4：16≤36 成立，内层执行 4 次，count = 10', count:10, ribbon:{k:4, ok:true} },
    { cls:'step', tag:'i=5', log:'i=5：25≤36 成立，内层执行 5 次，count = 15', count:15, ribbon:{k:5, ok:true} },
    { cls:'step', tag:'i=6', log:'i=6：36≤36 成立（边界也进！），内层执行 6 次，count = 21', count:21, ribbon:{k:6, ok:true} },
    { cls:'done', tag:'完成', log:'i=7：49>36 退出。总次数 = 6×7/2 = 21 ≈ n/2 → O(n)，答案 B', count:21, ribbon:{k:7, ok:false}, done:true },
  ],

  render: function(stage, sn, i){
    var IVALS = ['1','2','3','4','5','6','7'];
    var SUMS = ['1','3','6','10','15','21','—'];
    var iCls = [], sCls = [];
    for (var c = 0; c < 7; c++){
      var cl = '';
      if (i === 0){ cl = ''; }
      else if (i < 7){ cl = c < i ? 'ok' : (c === i ? 'hit' : ''); }
      else { cl = c < 6 ? 'ok' : 'miss'; }
      iCls.push(cl);
      sCls.push(cl === 'miss' ? 'miss' : cl);
    }
    this._iWrap.innerHTML = '';
    this._iWrap.appendChild(AW.cellRow(IVALS, iCls, null, 1));
    this._sumWrap.innerHTML = '';
    this._sumWrap.appendChild(AW.cellRow(SUMS, sCls, null, 1));
    this._formula.innerHTML = (i >= 7)
      ? '总次数 = k(k+1)/2，k = ⌊√n⌋ → <b>约 n/2，即 O(n)</b>'
      : '内层第 i 轮执行 i 次 ⇒ 总次数 = 1+2+…+k（k = ⌊√n⌋）';
  },

  result: {
    big: 'O(n)',
    html: '外层只跑到 k = ⌊√n⌋，内层总执行次数 = 1+2+…+k = k(k+1)/2 ≈ <b>n/2</b>，系数不影响量级 → <b>O(n)</b>，选 <b>B</b>。<br>记忆锚点：内层上限是 <code>i</code>，累加后"平方项自乘"恰好把量级压回 <code>n</code>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
