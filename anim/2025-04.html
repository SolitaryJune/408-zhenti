<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-04 森林与二叉树概念动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>四个说法覆盖二叉树性质与森林转化。策略：能举反例的<b>错</b>，有定理支撑的<b>对</b>，逐项排查。</p>' },
  { title: '选项 A：完全二叉树不存在度为 1 的结点',
    cls: 'bad',
    body: '<p><b>错</b>。反例：n=2 的完全二叉树（根 + 左孩子），根的度就是 1。一般地，完全二叉树结点数 n 为<b>偶数</b>时，恰有一个"只有左孩子"的度 1 结点；"不存在度 1 结点"是<b>满二叉树</b>的特征。</p>' },
  { title: '选项 B：任何一个森林一定能转化成一棵二叉树',
    cls: 'good',
    body: '<p><b>对</b>。孩子-兄弟（左孩子、右兄弟）表示法：各树根视为兄弟连成右链，树内同样处理——任何森林（含空森林）都唯一对应一棵二叉树，且去掉根的右链即可还原。这是标准定理。</p>' },
  { title: '选项 C：二叉树的分支结点个数比叶结点个数少',
    cls: 'bad',
    body: '<p><b>错</b>。恒等式 n0 = n2 + 1 只保证"叶 = 度2 + 1"；分支结点 = n1 + n2 = n0 + n1 − 1，只要 n1 ≥ 1 就<b>不少于</b>叶结点。反例：一条左单链，叶 1 个、分支一堆。</p>' },
  { title: '选项 D：表达式树的根中保存的是最先计算的运算符',
    cls: 'bad',
    body: '<p><b>错</b>。方向记反了：叶子是操作数，<b>越靠近根越后计算</b>，根保存的是<b>最后</b>计算的运算符（如根为 +，说明整个表达式最后才做这次加法）。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>任何森林 ⇄ 一棵二叉树（左孩子右兄弟）</b>；完全二叉树 n 为偶数时有 1 个度 1 结点；表达式树根 = 最后计算的运算符。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '森林与二叉树：四个说法逐项排查',
  subtitle: '考点：树/森林 ⇄ 二叉树转化 · 二叉树性质 · 表达式树 · 选项逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：<b>左孩子右兄弟</b>——任何森林都能唯一转化为一棵二叉树。<br>干扰项来源：A 把满二叉树的性质安到完全二叉树上；C 忽略 n1 ≥ 1 的情形；D 把表达式树的计算顺序记反。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
