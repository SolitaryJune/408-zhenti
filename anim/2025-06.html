<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-06 图的基本性质动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>四个选项分别涉及：有向图的入度、拓扑序列的唯一性、无向图回路的存在性、BFS 的适用范围。思路：<b>能举反例的错，能证明的对</b>。</p>' },
  { title: '选项 A：有向图必定存在入度为 0 的顶点',
    cls: 'bad',
    body: '<p><b>错</b>。反例：n 个顶点连成有向环 <code>1→2→…→n→1</code>，每个顶点入度恰为 1，没有任何入度 0 的顶点。"总有个起点"只在 DAG（拓扑排序语境）里成立。</p>' },
  { title: '选项 B：有向无环图的拓扑有序序列存在且唯一',
    cls: 'bad',
    body: '<p><b>错</b>。DAG 的拓扑序列<b>一定存在</b>（无环保证），但<b>不唯一</b>：反例图 1→2、3→4，则 <code>1,2,3,4</code> 与 <code>3,4,1,2</code> 都是拓扑序列。"存在"与"唯一"是两件事。</p>' },
  { title: '选项 C：各顶点的度均 ≥ 2 的无向图必有回路',
    cls: 'good',
    body: '<p><b>对</b>。设 n 点 e 边：各点度 ≥ 2 ⇒ Σdeg ≥ 2n，而 Σdeg = 2e ⇒ <b>e ≥ n</b>。若无回路，每个连通分量边数 &lt; 顶点数，全图必有 e &lt; n，矛盾。故必有回路。</p>' },
  { title: '选项 D：可用 BFS 求带权图每一对顶点的最短路径',
    cls: 'bad',
    body: '<p><b>错</b>。BFS 只适用<b>无权图</b>的单源最短路：它按层扩展，先到的只是"跳数最少"。带权图边权不等时跳数少 ≠ 路径短，"每一对顶点"更要用 Dijkstra / Floyd。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>无向图各点度 ≥ 2 ⇒ e ≥ n ⇒ 必有回路</b>；拓扑序列存在不唯一；BFS 只管无权图。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '图的基本概念：四个说法逐项排查',
  subtitle: '考点：入度 · 拓扑序列 · 回路存在性 · BFS 适用边界 · 反例 + 证明推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：<b>度 ≥ 2 ⇒ e ≥ n ⇒ 有环</b>。<br>干扰项来源：A 忘了有向环处处入度为 1；B 把"存在"升级成"唯一"；D 给 BFS 硬加权重。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
