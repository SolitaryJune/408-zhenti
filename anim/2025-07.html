<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-07 分块查找最优块长动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>400 个元素均匀分块：b 块 × 每块 s 个，<code>b·s = 400</code>。块间<b>顺序查找</b>定块 + 块内<b>顺序查找</b>，求 ASL 最小的 s。</p>' },
  { title: '第一步：写出 ASL 公式',
    cls: 'key',
    body: '<p>块间平均查 (b+1)/2 块，块内平均查 (s+1)/2 个：</p><p><code>ASL = (b+1)/2 + (s+1)/2 = (s + 400/s)/2 + 1</code></p><p>只消让 <code>s + 400/s</code> 最小。</p>' },
  { title: '第二步：均值不等式定最优块长',
    cls: 'good',
    body: '<p><code>s + 400/s ≥ 2·√400 = 40</code>，当 <code>s = √400 = 20</code> 取等号；此时 b = 400/20 = 20，<b>ASL = (20+20)/2 + 1 = 21</b>，最小。答案指向 <b>C</b>。</p>' },
  { title: '验证 A：s = 8',
    cls: 'bad',
    body: '<p>b = 50：块间 (50+1)/2 = 25.5，块内 (8+1)/2 = 4.5，总 ASL = <b>30</b>。块太碎，块间代价太大。</p>' },
  { title: '验证 B：s = 10',
    cls: 'bad',
    body: '<p>b = 40：块间 20.5，块内 5.5，总 ASL = <b>26</b>。仍偏向块间开销。</p>' },
  { title: '验证 D：s = 25',
    cls: 'bad',
    body: '<p>b = 16：块间 8.5，块内 13，总 ASL = <b>21.5</b>。块太大，块内代价反超。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>（每块 20 个，ASL = 21 最小）。记忆锚点：块间、块内同为顺序查找时，<b>最优块长 s = √n</b>，此时 b = s。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '分块查找：每块放多少个元素 ASL 最小？',
  subtitle: '400 个元素 · 块间顺序 + 块内顺序 · <code>ASL = (s + 400/s)/2 + 1</code>',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '每块 20 个',
    html: '记忆锚点：b·s = n 且两项对称 ⇒ <b>s = b = √n = 20</b>，ASL = 21。<br>干扰项来源：只顾优化块内（s=8、10）或只顾块间（s=25），都会偏离对称点。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
