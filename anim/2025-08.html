<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-08 4阶B树形态计数动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 画一棵小树：rootKeys 根关键字个数，rows 为下层结点的关键字个数
function treeHtml(rootKeys, rows){
  var h = '<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0 4px">';
  h += '<div class="aw-box" style="width:auto;min-width:52px;padding:0 10px;border-color:#d97706;background:#fef3c7;color:#92400e">根 ' + rootKeys + ' 关键字</div>';
  if (rows && rows.length){
    h += '<div class="aw-cells">';
    for (var i = 0; i < rows.length; i++){
      h += '<div class="aw-box" style="width:auto;min-width:44px;padding:0 8px">' + rows[i] + '关键字</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}
// 三层树：根 → 2 个内部结点 → 4 个叶子
function tree3Html(){
  var h = '<div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0 4px">';
  h += '<div class="aw-box" style="width:auto;min-width:52px;padding:0 10px;border-color:#d97706;background:#fef3c7;color:#92400e">根 1 关键字</div>';
  h += '<div class="aw-cells"><div class="aw-box" style="width:auto;padding:0 8px">内部 1 关键字</div><div class="aw-box" style="width:auto;padding:0 8px">内部 1 关键字</div></div>';
  h += '<div class="aw-cells"><div class="aw-box ok">1</div><div class="aw-box ok">1</div><div class="aw-box ok">1</div><div class="aw-box ok">1</div></div>';
  h += '<div style="font-size:12px;color:#64748b">4 个叶子各装 1 个关键字（绿框），恰好用满 7 个</div>';
  h += '</div>';
  return h;
}
function textHtml(t){
  return '<div class="aw-stepcard key"><h4>' + t + '</h4></div>';
}

AW.init({
  title: '7 个关键字能构成多少种不同的 4 阶 B 树？',
  subtitle: '4 阶：每结点 ≤ 3 个关键字、非根 ≥ 1 个、根非叶 ≥ 2 棵子树、叶子同层 · 按树高与根关键字分类枚举',
  counterLabel: '累计种数',
  intro: '点击「▶ 播放」逐类枚举所有树形。',

  snaps: [
    { cls:'shift', tag:'规则', log:'4 阶 B 树：结点 ≤ 3 个关键字、非根 ≥ 1 个、根非叶 ≥ 2 棵子树、叶子同层。7 个关键字树高只能是 2 或 3', count:0,
      html:'' },
    { cls:'step', tag:'树高2·根1关键字', log:'根 1 个关键字 → 2 个叶子，叶子共 6 个关键字、每个 1~3 个：只能 (3,3) → 1 种', count:1 },
    { cls:'step', tag:'树高2·根2关键字', log:'根 2 个 → 3 个叶子共 5 个关键字：(1,1,3),(1,2,2),(1,3,1),(2,1,2),(2,2,1),(3,1,1) → 6 种', count:7 },
    { cls:'step', tag:'树高2·根3关键字', log:'根 3 个 → 4 个叶子共 4 个关键字：只能 (1,1,1,1) → 1 种', count:8 },
    { cls:'step', tag:'树高3', log:'三层树最少要根 1 + 内部 2×1 + 叶子 4×1 = 7 个，恰好用满 → 1 种', count:9 },
    { cls:'done', tag:'完成', log:'1 + 6 + 1 + 1 = 9 种 → 答案 C', count:9, done:true },
  ],

  render: function(stage, sn, i){
    if (i === 0){
      stage.innerHTML = textHtml('4 阶 B 树的约束：每结点至多 3 个关键字；非根结点至少 1 个关键字；根结点（非叶）至少 2 棵子树；所有叶子在同一层。7 个关键字：树高为 2 或 3，下面逐类枚举。');
    } else if (i === 1){
      stage.innerHTML = treeHtml(1, [3, 3]) +
        '<div class="aw-row-label">两个叶子各装 3 个关键字（共 1+6=7 个）✓。注意叶子分布有序，(2,4) 之类违反上限，不算。</div>';
    } else if (i === 2){
      stage.innerHTML = treeHtml(2, [1, 1, 3]) +
        '<div class="aw-row-label">示意 (1,1,3) 一种；全部排布：(1,1,3)、(1,2,2)、(1,3,1)、(2,1,2)、(2,2,1)、(3,1,1) —— 共 <b>6</b> 种。</div>';
    } else if (i === 3){
      stage.innerHTML = treeHtml(3, [1, 1, 1, 1]) +
        '<div class="aw-row-label">4 个叶子共装 4 个关键字，每个至少 1 个 → 只能 (1,1,1,1) 一种。</div>';
    } else if (i === 4){
      stage.innerHTML = tree3Html() +
        '<div class="aw-row-label">三层树的下限之和恰好 = 7，再多放任何关键字都超出，故只有 1 种。</div>';
    } else {
      stage.innerHTML = '<div class="aw-stepcard good"><h4>合计</h4><p>树高 2：1 + 6 + 1 = 8 种；树高 3：1 种。<br><b>共 9 种，选 C。</b></p></div>';
    }
  },

  result: {
    big: '9 种',
    html: '分类口径：<b>根的关键字个数 × 叶子关键字分布（有序）</b>。<br>树高 2：根 1 关键字 1 种、根 2 关键字 6 种、根 3 关键字 1 种；树高 3：全部取下限恰好 7 个，1 种。合计 <b>9 种</b>，选 <b>C</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
