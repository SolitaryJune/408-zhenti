<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-09 散列冲突处理辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>两条主线：① 探查序列<b>能否覆盖全表</b>（"只要表不满一定能找到空位"）；② 冲突<b>发生在谁之间</b>（同义词还是非同义词）。</p>' },
  { title: '选项 A：表不满时线性探查一定能找到空位',
    cls: 'good',
    body: '<p><b>对</b>。线性探查 di = 0,1,2,…,m−1，m 个地址<b>逐一试遍</b>；表不满 ⇒ 空位一定存在 ⇒ 沿序列找必能找到。</p>' },
  { title: '选项 B：表不满时二次探查一定能找到空位',
    cls: 'bad',
    body: '<p><b>错</b>。二次探查 di = 1², −1², 2², −2², … 跳跃式、可能重复：m=5 时探查地址只有 <code>H+1</code>、<code>H−1</code> 两个不同位置（H+4≡H−1、H−4≡H+1），明明有空位也可能探查不到。</p>' },
  { title: '选项 C：线性探查处理的冲突一定是同义词之间',
    cls: 'bad',
    body: '<p><b>错</b>。线性探查会产生<b>堆积（聚集）</b>：散列地址不同的<b>非同义词</b>也会因落入连续被占区段而卷入冲突。冲突不一定发生在同义词之间。</p>' },
  { title: '选项 D：二次探查处理的冲突一定是非同义词之间',
    cls: 'bad',
    body: '<p><b>错</b>。同义词本来就可能撞在一起，二次探查处理的冲突<b>可以是同义词之间</b>；"一定是非同义词"既绝对化又与事实相反。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>线性探查走得全、必有堆积；二次探查走得跳、覆盖不全</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '散列冲突处理：四个说法逐项排查',
  subtitle: '考点：线性探查 · 二次探查 · 覆盖性 · 堆积现象 · 反例推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '记忆锚点：线性探查序列 <code>0..m−1</code> 覆盖全表（表不满必找到），但会<b>堆积</b>；二次探查跳跃、<b>覆盖不全</b>（m=5 时只能到达 2 个位置）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
