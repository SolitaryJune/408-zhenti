<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-10 排序算法移动次数动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：数"移动"，看"最坏"',
    cls: 'key',
    body: '<p>两个口径：① 数<b>元素移动</b>次数，不是比较次数；② 看最坏情况。注意一次交换 = 3 次移动（借助暂存变量）。</p>' },
  { title: '选项 A：起泡排序',
    cls: 'bad',
    body: '<p>最坏 = 初始<b>逆序</b>：n(n−1)/2 对元素全部要交换，移动 3×n(n−1)/2 次，<b>O(n²) 级</b>。多。</p>' },
  { title: '选项 B：直接插入排序',
    cls: 'bad',
    body: '<p>最坏 = 初始<b>逆序</b>：每个元素都要一路移到最前面，移动约 n²/2 次，<b>O(n²) 级</b>。多。</p>' },
  { title: '选项 C：快速排序',
    cls: 'bad',
    body: '<p>最坏 = 基本<b>有序</b>且取端点为枢轴：划分极度失衡，交换 O(n²) 次，移动也 <b>O(n²) 级</b>。多。</p>' },
  { title: '选项 D：简单选择排序',
    cls: 'good',
    body: '<p>第 i 趟只在"最小值不在位置 i"时做<b>至多 1 次交换</b>（3 次移动），全程 ≤ 3(n−1) 次移动，<b>O(n) 级</b>且与初始序列无关——最少。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：简单选择排序"比较最多、移动最少"——比较恒为 n(n−1)/2，移动 ≤ 3(n−1)。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '最坏情况下元素移动最少的排序算法',
  subtitle: '考点：起泡 / 直接插入 / 快速 / 简单选择 · 移动次数口径 · 最坏情况分析',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：<b>选择排序：比较 O(n²)、移动 O(n)</b>（每趟至多 1 次交换）。<br>干扰项来源：起泡/插入最坏逆序、快排最坏有序失衡，三者移动都是 O(n²) 级。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
