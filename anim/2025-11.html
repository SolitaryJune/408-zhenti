<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-11 由排序过程反推算法动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '由两趟排序结果反推：这是哪种排序算法？',
  subtitle: '9 个元素 · 第 1 趟 → <code>5,10,20,30,15,35,45,25,40</code> · 第 2 趟 → <code>5,10,15,25,20,30,40,35,45</code>',
  counterLabel: '推理步',
  ribbonTitle: '候选算法（✓ 吻合 / ✗ 排除）',
  intro: '点击「▶ 播放」先排除三个算法，再用希尔排序复现两趟。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    this._label = AW.el('div', 'aw-row-label', '');
    this._rowWrap = AW.el('div', '');
    this._note = AW.el('div', 'aw-row-label', '');
    inner.appendChild(this._label);
    inner.appendChild(this._rowWrap);
    inner.appendChild(this._note);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'初始', log:'初始序列 5,25,40,30,10,20,45,15,35。两趟后都没整体有序，但每趟都"大变样"——先怀疑分组插入', count:0 },
    { cls:'miss', tag:'排除 D', log:'折半插入第 1 趟只把第 2 个元素 25 插入前面有序区，序列几乎不变 → 排除 D', count:1, ribbon:{k:'D', ok:false} },
    { cls:'miss', tag:'排除 B', log:'基数排序第 1 趟按个位收集：40,30,10,20,5,25,45,15,35 → 排除 B', count:2, ribbon:{k:'B', ok:false} },
    { cls:'miss', tag:'排除 C', log:'归并排序第 1 趟两两归并：5,25,30,40,10,20,15,45,35 → 排除 C', count:3, ribbon:{k:'C', ok:false} },
    { cls:'step', tag:'试希尔 gap=3', log:'gap=3 分三组：{5,30,45} {25,10,15} {40,20,35}，组内直接插入排序', count:4 },
    { cls:'ok', tag:'第1趟吻合', log:'三组各自有序后放回：5,10,20,30,15,35,45,25,40 —— 与题面第 1 趟完全一致 ✓', count:5, ribbon:{k:'A', ok:true} },
    { cls:'step', tag:'第2趟 gap=2', log:'gap=2 分两组：{5,20,15,45,40} {10,30,35,25}，组内直接插入排序', count:6 },
    { cls:'ok', tag:'第2趟吻合', log:'两组各自有序后放回：5,10,15,25,20,30,40,35,45 —— 与题面第 2 趟完全一致 ✓，gap 序列 3→2', count:7 },
    { cls:'done', tag:'完成', log:'两趟均与希尔排序（gap 3→2）吻合 → 答案 A', count:8, done:true },
  ],

  render: function(stage, sn, i){
    var INIT = ['5','25','40','30','10','20','45','15','35'];
    var P1  = ['5','10','20','30','15','35','45','25','40'];
    var P2  = ['5','10','15','25','20','30','40','35','45'];
    var disp = INIT, cls = [], label = '', note = '';
    for (var c = 0; c < 9; c++) cls.push('');

    if (i <= 3){ disp = INIT; label = '<b>初始序列</b>（9 个元素）'; }
    if (i === 1){ for (var c1 = 0; c1 < 2; c1++) cls[c1] = 'ok'; note = '折半插入一趟只产生"前 2 个有序"，变化太小，与题面不符。'; }
    if (i === 2){ cls = ['','','ok','ok','ok','ok','','',''];
      note = '个位为 0 的元素（40,30,10,20，绿框）应先被收集——与题面不符。'; }
    if (i === 3){ cls = ['ok','ok','ok','ok','ok','ok','ok','ok','']; note = '归并一趟产生长度为 2 的有序段（相邻两两）：(5,25)→5,25、(40,30)→30,40…… 与题面不符。'; }
    if (i === 4){ disp = INIT;
      cls = ['hit','','','hit','','','hit','',''];
      cls[1] = 'ok'; cls[4] = 'ok'; cls[7] = 'ok';
      label = '<b>希尔排序 第 1 趟：gap = 3</b>'; note = '组 1（绿底）= 下标 1,4,7：{5,30,45}；组 2（浅绿）= 下标 2,5,8：{25,10,15}；其余 = 下标 3,6,9：{40,20,35}。各组组内直接插入。'; }
    if (i === 5){ disp = P1; for (var c5 = 0; c5 < 9; c5++) cls[c5] = 'ok';
      label = '<b>第 1 趟结果</b>'; note = '与题面第 1 趟 5,10,20,30,15,35,45,25,40 完全一致 ✓（gap=3 的组内插入）。'; }
    if (i === 6){ disp = P1;
      cls = ['hit','ok','hit','ok','hit','ok','hit','ok','hit'];
      label = '<b>希尔排序 第 2 趟：gap = 2</b>'; note = '组 1（绿底）= 下标 1,3,5,7,9：{5,20,15,45,40}；组 2（浅绿）= 下标 2,4,6,8：{10,30,35,25}。'; }
    if (i === 7 || i === 8){ disp = P2; for (var c7 = 0; c7 < 9; c7++) cls[c7] = 'ok';
      label = i === 7 ? '<b>第 2 趟结果</b>' : '<b>最终判定</b>';
      note = i === 7 ? '与题面第 2 趟 5,10,15,25,20,30,40,35,45 完全一致 ✓（gap=2 的组内插入）。'
                     : 'gap 序列 3 → 2（下一趟 gap=1 才整体有序）→ 希尔排序，答案 A。'; }

    this._label.innerHTML = label || '<b>初始序列</b>';
    this._rowWrap.innerHTML = '';
    this._rowWrap.appendChild(AW.cellRow(disp, cls, null, 1));
    this._note.innerHTML = note;
  },

  result: {
    big: '答案 A（希尔排序）',
    html: '第 1 趟 gap=3、第 2 趟 gap=2 的组内直接插入，两趟结果都与题面完全吻合。<br>记忆锚点：中间趟"部分有序 + 大变样"是希尔排序的指纹；折半插入一趟几乎不动、基数一趟按位收集、归并一趟只产生长度 2 的有序段。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
