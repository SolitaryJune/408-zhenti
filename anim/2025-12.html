<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-12 有符号数转无符号数动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 算法/过程类：符号扩展 → 无符号解释的位级演示 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: 'short → unsigned int：符号扩展与无符号解释',
  subtitle: '<code>short si = -32767;</code> · <code>unsigned int ui = si;</code> · 32 位机',
  counterLabel: '步骤',
  ribbonTitle: '关键步骤（✓ 正确 / ✗ 陷阱）',
  intro: '点击「▶ 播放」逐步演示机器数的变化。',

  build: function(stage){
    stage.innerHTML = '';
    var self = this;
    var inner = AW.el('div', '');

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>si 的 16 位补码</b>（求 -32767 的机器数）'));
    var r1 = AW.el('div', 'aw-cells');
    r1.style.marginBottom = '6px';
    self._s1 = [];
    ['8','0','0','1'].forEach(function(c){
      var b = AW.el('div', 'aw-box dim', c);
      b.style.fontSize = '18px';
      r1.appendChild(b); self._s1.push(b);
    });
    inner.appendChild(r1);
    inner.appendChild(AW.el('div', 'aw-row-label', '<span style="font-size:12px;color:#586e72">32767 = 7FFFH → 按位取反加 1</span>'));

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>转换成 32 位 unsigned int 后的机器数</b>（先符号扩展）'));
    var r2 = AW.el('div', 'aw-cells');
    r2.style.marginBottom = '6px';
    self._s2 = [];
    ['F','F','F','F','8','0','0','1'].forEach(function(c){
      var b = AW.el('div', 'aw-box dim', c);
      b.style.fontSize = '18px';
      r2.appendChild(b); self._s2.push(b);
    });
    inner.appendChild(r2);

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>两种解释方式的真值</b>'));
    var r3 = AW.el('div', 'aw-cells');
    r3.style.marginBottom = '6px';
    var mk = function(txt){
      var b = AW.el('div', 'aw-box dim', txt);
      b.style.width = '200px'; b.style.height = '40px'; b.style.fontSize = '14px';
      r3.appendChild(b); return b;
    };
    self._e1 = mk('按补码解释：?');
    self._e2 = mk('按无符号解释：?');
    inner.appendChild(r3);

    self._note = AW.el('div', 'aw-row-label', '');
    inner.appendChild(self._note);
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',     log:'si = -32767（16 位 short），赋给 32 位 unsigned int ui：先写出 si 的机器数，再看它在 32 位下如何被解释。', count:0, note:'目标：ui 的真值' },
    { cls:'ok',    tag:'求补码',   log:'32767 = 7FFFH = 0111 1111 1111 1111B；取负按「按位取反、末位加 1」得 1000 0000 0000 0001B，即 [si]补 = 8001H。', count:1, ribbon:{k:1, ok:true}, note:'[si]补 = 8001H' },
    { cls:'shift', tag:'符号扩展', log:'short → 32 位先做符号扩展：符号位是 1，高 16 位全部补 1，得 32 位机器数 FFFF 8001H。', count:2, ribbon:{k:2, ok:true}, note:'符号扩展 → FFFF 8001H' },
    { cls:'miss',  tag:'陷阱',     log:'若误把 8001H 前面补 0 得 0000 8001H，按无符号解释恰为 2^15+1 —— 干扰项 A 就是这么来的。有符号数加宽必须符号扩展。', count:3, ribbon:{k:3, ok:false}, note:'✗ 零扩展 → 2^15+1（干扰项 A）' },
    { cls:'ok',    tag:'按补码读', log:'FFFF 8001H 按 32 位补码解释，真值仍是 -32767（符号扩展不改变有符号值）。', count:4, ribbon:{k:4, ok:true}, note:'按补码读：-32767' },
    { cls:'shift', tag:'按无符号读', log:'但 ui 是 unsigned 类型：最高位 1 不再当符号，按位权展开的无符号真值 = 2^32 − 32767。', count:5, ribbon:{k:5, ok:true}, note:'按无符号读：2^32 − 32767' },
    { cls:'ok',    tag:'化简',     log:'32767 = 2^15 − 1，所以 ui = 2^32 − 2^15 + 1。', count:6, ribbon:{k:6, ok:true}, note:'ui = 2^32 − 2^15 + 1' },
    { cls:'done',  tag:'完成',     log:'结论：ui 的真值 = 2^32 − 2^15 + 1，选 D。', count:7, done:true, note:'答案 D' },
  ],

  render: function(stage, sn, i){
    var self = this;
    var set = function(b, cls, txt){
      b.className = 'aw-box' + (cls ? ' ' + cls : '');
      if(txt != null) b.textContent = txt;
    };
    self._s1.forEach(function(b){ set(b, 'dim'); });
    self._s2.forEach(function(b){ set(b, 'dim'); });
    set(self._e1, 'dim', '按补码解释：?');
    set(self._e2, 'dim', '按无符号解释：?');
    if(i >= 1){ self._s1.forEach(function(b){ set(b, 'ok'); }); }
    if(i >= 2){
      ['F','F','F','F','8','0','0','1'].forEach(function(c, k){ set(self._s2[k], 'shift', c); });
      set(self._e1, 'ok', '按补码解释：-32767');
    }
    if(i === 3){
      ['0','0','0','0','8','0','0','1'].forEach(function(c, k){ set(self._s2[k], 'miss', c); });
    }
    if(i >= 4){
      ['F','F','F','F','8','0','0','1'].forEach(function(c, k){ set(self._s2[k], 'ok', c); });
      set(self._e1, 'ok', '按补码解释：-32767');
    }
    if(i >= 5){ set(self._e2, 'shift', '按无符号解释：2^32 − 32767'); }
    if(i >= 6){ set(self._e2, 'ok', '按无符号解释：2^32 − 2^15 + 1'); }
    self._note.innerHTML = '<b>' + (sn.note || '') + '</b>';
  },

  result: {
    big: '答案 D',
    html: '<p>ui 的真值 = <b>2^32 − 2^15 + 1</b>（机器数 FFFF 8001H 按无符号解释）。记忆锚点：有符号短整型赋给更宽的无符号整型，<b>先符号扩展、再按无符号解释</b>；忘做符号扩展就掉进 2^15+1（干扰项 A）。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
