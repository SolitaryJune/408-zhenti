<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-13 IEEE 754 机器数还原动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 算法/过程类：IEEE 754 单精度字段拆解 → 真值还原 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: 'IEEE 754 单精度：从 4730 0000H 还原 x',
  subtitle: 'float x 的机器数为 <code>4730 0000H</code> · 格式：1 位符号 + 8 位阶码 + 23 位尾数',
  counterLabel: '步骤',
  ribbonTitle: '关键步骤（✓ 对 / ✗ 错）',
  intro: '点击「▶ 播放」逐步拆解并还原真值。',

  build: function(stage){
    stage.innerHTML = '';
    var self = this;
    var inner = AW.el('div', '');

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>十六进制机器数</b>（8 个十六进制位）'));
    var r0 = AW.el('div', 'aw-cells');
    r0.style.marginBottom = '6px';
    self._hex = [];
    ['4','7','3','0','0','0','0','0'].forEach(function(c){
      var b = AW.el('div', 'aw-box dim', c);
      b.style.fontSize = '18px';
      r0.appendChild(b); self._hex.push(b);
    });
    inner.appendChild(r0);

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>拆成 1 + 8 + 23 三段</b>'));
    var r1 = AW.el('div', 'aw-cells');
    r1.style.marginBottom = '6px';
    var mkField = function(top, val, w){
      var col = AW.el('div', '');
      col.style.marginRight = '8px';
      col.appendChild(AW.el('div', 'aw-idx', top));
      var b = AW.el('div', 'aw-box dim', val);
      b.style.width = w + 'px'; b.style.height = '44px'; b.style.fontSize = '15px';
      col.appendChild(b);
      r1.appendChild(col);
      return b;
    };
    self._fS = mkField('数符 S（1 位）', '?', 60);
    self._fE = mkField('阶码 E（8 位）', '?', 150);
    self._fM = mkField('尾数 M（23 位）', '?', 300);
    inner.appendChild(r1);

    inner.appendChild(AW.el('div', 'aw-row-label', '<b>求指数与有效数字</b>'));
    var r2 = AW.el('div', 'aw-cells');
    r2.style.marginBottom = '6px';
    var mkChip = function(txt){
      var b = AW.el('div', 'aw-box dim', txt);
      b.style.width = '210px'; b.style.height = '40px'; b.style.fontSize = '14px';
      r2.appendChild(b); return b;
    };
    self._c1 = mkChip('真指数 = ?');
    self._c2 = mkChip('有效数字 = ?');
    inner.appendChild(r2);

    self._note = AW.el('div', 'aw-row-label', '');
    inner.appendChild(self._note);
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',     log:'float x 的机器数是 4730 0000H，按 IEEE 754 单精度格式还原真值。', count:0, note:'目标：x 的值' },
    { cls:'shift', tag:'展开',     log:'4730 0000H = 0100 0111 0011 0000 0000 0000 0000 0000B，共 32 位。', count:1, note:'二进制 0100 0111 0011 0000 …' },
    { cls:'ok',    tag:'拆三段',   log:'按 1+8+23 拆：S = 0（正数）；E = 1000 1110B；M = 011 0000 0000 0000 0000 0000B。', count:2, ribbon:{k:1, ok:true}, note:'S=0，E=1000 1110B，M=011B…' },
    { cls:'ok',    tag:'求指数',   log:'E = 1000 1110B = 128+8+4+2 = 142；偏置 127，真指数 = 142 − 127 = 15。', count:3, ribbon:{k:2, ok:true}, note:'真指数 = 142 − 127 = 15' },
    { cls:'ok',    tag:'求尾数',   log:'M = 011B，其余 20 位全 0；规格化数隐含最高位的 1，有效数字 = 1.011B = 1 + 0.25 + 0.125 = 1.375。', count:4, ribbon:{k:3, ok:true}, note:'有效数字 = 1.375' },
    { cls:'miss',  tag:'陷阱',     log:'若漏掉隐含的 1，把值写成 0.375 × 2^15 —— 干扰项 A、C 正是这样错出来的。', count:5, ribbon:{k:4, ok:false}, note:'✗ 漏隐含 1 → 0.375 × 2^15' },
    { cls:'ok',    tag:'合成',     log:'x = (+1) × 1.375 × 2^15。', count:6, ribbon:{k:5, ok:true}, note:'x = 1.375 × 2^15' },
    { cls:'done',  tag:'完成',     log:'结论：x = 1.375 × 2^15，选 D。', count:7, done:true, note:'答案 D' },
  ],

  render: function(stage, sn, i){
    var self = this;
    var set = function(b, cls, txt){
      b.className = 'aw-box' + (cls ? ' ' + cls : '');
      if(txt != null) b.textContent = txt;
    };
    self._hex.forEach(function(b){ set(b, 'dim'); });
    set(self._fS, 'dim', '?'); set(self._fE, 'dim', '?'); set(self._fM, 'dim', '?');
    set(self._c1, 'dim', '真指数 = ?'); set(self._c2, 'dim', '有效数字 = ?');
    if(i >= 1){ self._hex.forEach(function(b){ set(b, 'shift'); }); }
    if(i >= 2){
      set(self._fS, 'ok', '0');
      set(self._fE, 'ok', '1000 1110');
      set(self._fM, 'ok', '011 0000 …0（23 位）');
    }
    if(i >= 3){ set(self._c1, 'ok', '真指数 = 142 − 127 = 15'); }
    if(i >= 4){ set(self._c2, 'ok', '有效数字 = 1.011B = 1.375'); }
    self._note.innerHTML = '<b>' + (sn.note || '') + '</b>';
  },

  result: {
    big: '答案 D',
    html: '<p>x = <b>1.375 × 2^15</b>。还原三步：拆 1+8+23 三段 → 指数减偏置（142−127=15）→ 尾数补隐含 1（0.011B → 1.011B = 1.375）。漏隐含 1 就错成 0.375 × 2^15。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
