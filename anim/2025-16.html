<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-16 ISA 规定内容辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 概念/推理链类：ISA 与微架构实现分层辨析 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：ISA 是软硬件交界面',
    cls: 'key',
    body: '<p>ISA（指令集体系结构）规定的是「写进手册」的约定：<b>指令格式（指令字长、操作码编码）、寻址方式、寄存器组织、可执行的运算、异常与 I/O 约定</b>。至于用哪种电路实现这些指令，属于<b>微架构（实现）层</b>，ISA 不做规定。</p>' },
  { title: '选项 A：阵列乘法器 —— 不是 ISA',
    cls: 'bad',
    rb: {k:1, ok:false},
    body: '<p>是否采用<b>阵列乘法器</b>：这是运算器内部的<b>电路实现方式</b>。ISA 只规定「提供乘法运算/乘法指令」，同一 ISA 可以用阵列乘法器，也可以用其他乘法电路实现。</p>' },
  { title: '选项 B：定长指令字格式 —— ISA 规定',
    cls: 'good',
    rb: {k:2, ok:true},
    body: '<p>是否采用<b>定长指令字格式</b>：指令字长与编码格式是 ISA 的核心内容，直接影响取指、译码的约定（如许多 RISC 处理器定长 32 位指令）。<b>它写进 ISA 手册，软件看得见</b>。</p>' },
  { title: '选项 C：微程序控制器 —— 不是 ISA',
    cls: 'bad',
    rb: {k:3, ok:false},
    body: '<p>是否采用<b>微程序控制器</b>：控制器用微程序还是硬连线实现，是控制器的设计方式，对软件完全不可见，同一 ISA 下两种实现都能兼容。</p>' },
  { title: '选项 D：单总线数据通路 —— 不是 ISA',
    cls: 'bad',
    rb: {k:4, ok:false},
    body: '<p>是否采用<b>单总线数据通路</b>：数据通路（单总线/多总线/专用通路）是 CPU 内部结构，属于微架构实现细节。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有 <b>B 指令字长是否定长</b>属于 ISA 规定的内容；A、C、D 都是同一 ISA 下可以任意选择的实现细节。答案选 <b>B</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if(s.rb) sn.ribbon = s.rb;
  return sn;
});

AW.init({
  title: '哪些内容由 ISA 规定？',
  subtitle: '考点：ISA 与微架构实现的分层 · 选项逐项推演',
  ribbonTitle: '选项（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '<p><b>是否采用定长指令字格式</b>由 ISA 规定——指令字长、编码格式是软硬件交界面上的约定。阵列乘法器（A）、微程序控制器（C）、单总线数据通路（D）都是微架构实现细节，同一 ISA 下可有不同选择。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
