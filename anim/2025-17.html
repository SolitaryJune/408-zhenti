<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-17 RISC 特征辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 概念/推理链类：RISC 特征逐项核对，找错误叙述 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：找「错误」的 RISC 叙述',
    cls: 'key',
    body: '<p>RISC 的典型特征：指令少而规整（定长指令字）、寻址方式少、只有 <b>Load/Store</b> 指令访存、大量通用寄存器传参、控制器多用<b>硬连线</b>、<b>易于流水线</b>。逐项核对四个选项。</p>' },
  { title: '选项 A：硬连线控制器 —— 正确叙述',
    cls: 'good',
    rb: {k:1, ok:true},
    body: '<p>多采用硬连线方式实现控制器：RISC 指令规整、控制逻辑简单，硬连线速度快，正是 RISC 的典型选择（CISC 因指令复杂反而常用微程序）。</p>' },
  { title: '选项 B：Load/Store 风格 —— 正确叙述',
    cls: 'good',
    rb: {k:2, ok:true},
    body: '<p>通常采用 Load/Store 型指令设计风格：只有取数/存数指令访存，运算指令都在寄存器之间进行——这是 RISC 的标志性特征。</p>' },
  { title: '选项 C：「难以流水线」—— 错误叙述',
    cls: 'bad',
    rb: {k:3, ok:false},
    body: '<p>「难以采用流水线数据通路实现微架构」说反了。RISC 指令<b>长度相同、执行时间接近、访存少</b>，数据通路便于划分成规整流水段，<b>最容易</b>实现流水线；难以流水线的倒是 CISC（指令长短不一、耗时差异大）。</p>' },
  { title: '选项 D：寄存器传参 —— 正确叙述',
    cls: 'good',
    rb: {k:4, ok:true},
    body: '<p>多采用寄存器传递过程调用时的参数：RISC 寄存器多，调用约定用寄存器传参以减少访存，这也是 RISC 的典型特征。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>A、B、D 都是 RISC 的正确特征，只有 <b>C 与事实相反</b>——RISC 恰恰是为流水线而生的。题目选错误的叙述，答案选 <b>C</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if(s.rb) sn.ribbon = s.rb;
  return sn;
});

AW.init({
  title: '关于 RISC 的叙述，哪个是错误的？',
  subtitle: '考点：RISC 的基本特征 · 选项逐项核对',
  ribbonTitle: '选项（✓ 正确叙述 / ✗ 错误叙述）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '<p>RISC 特征：规整简单 + Load/Store + 寄存器传参 + 硬连线 + <b>易于流水线</b>。「难以采用流水线数据通路」正好说反——那是 CISC 的困难，所以选 <b>C</b>。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
