<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-20 总线带宽计算动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 概念/推理链类：MT/s 单位澄清 → 带宽计算 → 干扰项解剖 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：1333 MHz 实为 1333 MT/s',
    cls: 'key',
    body: '<p>题干明确：「工作频率 1333 MHz（实际单位是 <b>MT/s</b>，表示每秒传送 <b>1333 M 次</b>数据）」。也就是说每秒传送次数已经给定，<b>quad-pumped（每总线时钟周期传 4 次）已经计入其中，不能再乘 4</b>。</p>' },
  { title: '第二步：每次传送多少字节',
    cls: 'key',
    rb: {k:1, ok:true},
    body: '<p>总线宽度 64 位 = 64 ÷ 8 = <b>8 字节</b>。每次数据传送搬运 8 B。</p>' },
  { title: '第三步：带宽 = 次数 × 字节数',
    cls: 'good',
    rb: {k:2, ok:true},
    body: '<p>带宽 = 1333 M 次/s × 8 B/次 = <b>10664 MB/s</b>。按 1000 进制换算：10664 MB/s ≈ <b>10.66 GB/s</b>。</p>' },
  { title: '第四步：对号入座选 A',
    cls: 'good',
    rb: {k:3, ok:true},
    body: '<p>10.66 GB/s 正是<b>选项 A</b>。</p>' },
  { title: '第五步：解剖干扰项 B',
    cls: 'bad',
    rb: {k:4, ok:false},
    body: '<p><b>B = 42.66 GB/s</b> = 10.66 × 4：把 MT/s 误解成总线时钟频率，又乘了一次 4——重复计入 quad-pumped。C、D 则是继续乱乘系数（85.31 = 10.66 × 8）的产物。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>带宽 = <b>1333 MT/s × 8 B = 10664 MB/s ≈ 10.66 GB/s</b>，答案选 <b>A</b>。记忆锚点：MT/s 已含每周期多次传送，带宽直接用 MT/s × 宽度字节数。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var sn = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if(s.rb) sn.ribbon = s.rb;
  return sn;
});

AW.init({
  title: '总线带宽：1333 MT/s × 64 位总线',
  subtitle: '考点：总线带宽计算与 MT/s 单位陷阱 · quad-pumped 已计入次数',
  ribbonTitle: '计算步骤（✓ 对 / ✗ 陷阱）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（10.66 GB/s）',
    html: '<p>带宽 = <b>1333 M 次/s × 8 B = 10664 MB/s ≈ 10.66 GB/s</b>。最大陷阱是<b>再乘 4</b>：MT/s 已经是「每秒传送次数」，quad-pumped 无需重复计入（乘 4 得 B 的 42.66 GB/s）。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
