<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-23 上下文切换时不需要更新的寄存器</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body) {
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
    '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  {
    title: '审题眼：切换的是"进程私有"现场',
    cls: 'key',
    body: '<p>上下文切换＝把 CPU 从一个进程换给另一个进程：保存旧进程现场、恢复新进程现场。判断标准只有一条：<b>该寄存器的内容是否与"当前是哪个进程"有关</b>。题干强调<b>页式虚拟存储</b>——每个进程有独立页表，这正是 B 项的关键。</p>'
  },
  {
    title: 'A 通用寄存器：要更新',
    cls: 'bad',
    body: '<p>通用寄存器是进程私有的工作现场（中间计算结果都在这里）。切出时整组保存到该进程的 PCB / 内核栈，切入时从新进程的现场恢复——<b>必须更新</b>。</p>',
    ribbon: { k: 1, ok: false }
  },
  {
    title: 'B 页表基址寄存器：要更新',
    cls: 'bad',
    body: '<p>页式虚拟存储中<b>每个进程有自己的页表</b>。切换后地址映射必须换到新进程的页表，否则新进程会按旧进程的映射错读内存——<b>必须更新</b>。</p>',
    ribbon: { k: 2, ok: false }
  },
  {
    title: 'C 程序寄存器（PC）：要更新',
    cls: 'bad',
    body: '<p>程序寄存器（程序计数器）记录进程执行到哪条指令，各进程断点位置不同。切换后必须指向新进程的断点——<b>必须更新</b>。</p>',
    ribbon: { k: 3, ok: false }
  },
  {
    title: 'D 内核中断向量表基址寄存器：不需要更新',
    cls: 'good',
    body: '<p>中断向量表是操作系统<b>启动时初始化</b>的内核全局数据，全系统<b>唯一</b>、所有进程共用，与"当前是哪个进程"无关。上下文切换根本不碰它——<b>不需要更新</b>。</p>',
    ribbon: { k: 4, ok: true }
  },
  {
    title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>切换只搬"进程私有"的现场</b>（通用寄存器、PC、页表基址寄存器）；内核全局配置（中断向量表基址寄存器）全系统一份，不随进程切换。</p>'
  }
];

var snaps = STEPS.map(function (s, i) {
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function (x, j) {
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    ribbon: s.ribbon,
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '上下文切换时，哪个寄存器不需要更新（2025-23）',
  subtitle: '页式虚拟存储 · 上下文切换 · 判断标准：<b>寄存器内容是否与"当前是哪个进程"有关</b>',
  ribbonTitle: '选项判定（✓ 不需要更新 / ✗ 必须更新）',
  intro: '点击「▶ 播放」，逐项判断四个寄存器。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '上下文切换更新的是<b>进程私有</b>现场：通用寄存器、程序寄存器（PC）、页表基址寄存器都要换；而<b>内核中断向量表基址寄存器</b>是全系统唯一的内核全局配置，与进程无关，不需要更新。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
