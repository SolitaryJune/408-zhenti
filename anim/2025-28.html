<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-28 虚拟文件系统（VFS）的正确说法</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body) {
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
    '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  {
    title: '审题眼：VFS 在哪一层、干什么',
    cls: 'key',
    body: '<p>VFS（虚拟文件系统）是内核中的<b>抽象层</b>：用户调用 open/read/write 等统一接口 → VFS 把它转交给底层的具体文件系统（ext4、FAT、NFS…）。记住关键词：<b>"虚拟"＝抽象统一接口</b>，与虚拟内存无关。</p>'
  },
  {
    title: 'A "运行在虚拟内存的文件系统"：错',
    cls: 'bad',
    body: '<p>望文生义的陷阱：VFS 的"虚拟"指<b>抽象出统一接口</b>，不是"虚拟内存"。VFS 是内核代码，谈不上"运行在虚拟内存里"。A 错。</p>',
    ribbon: { k: 1, ok: false }
  },
  {
    title: 'B "可以加快文件系统的访问速度"：错',
    cls: 'bad',
    body: '<p>VFS 只是一层统一的中间接口，<b>不做缓存、不做优化</b>，反而多一次接口转发。它的价值是"统一"，不是"提速"。B 错。</p>',
    ribbon: { k: 2, ok: false }
  },
  {
    title: 'C "定义了访问不同文件系统的统一接口"：对',
    cls: 'good',
    body: '<p>这正是 VFS 的定义：向上提供统一系统调用，向下规定一套标准接口函数，各具体文件系统<b>实现这套接口</b>即可被统一访问——用户感知不到底层差异。C 对。</p>',
    ribbon: { k: 3, ok: true }
  },
  {
    title: 'D "只能访问本地，不能访问网络文件系统"：错',
    cls: 'bad',
    body: '<p>NFS 等网络文件系统正是<b>通过 VFS 的统一接口接入</b>的——用户访问 NFS 与访问本地盘方式完全一致。VFS 既管本地也管网络。D 错。</p>',
    ribbon: { k: 4, ok: false }
  },
  {
    title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>VFS ＝ 统一接口层</b>——"统一"是它的全部使命；"虚拟"不是虚拟内存，也不负责提速，本地网络通吃。</p>'
  }
];

var snaps = STEPS.map(function (s, i) {
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function (x, j) {
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    ribbon: s.ribbon,
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '关于虚拟文件系统（VFS），哪个说法正确（2025-28）',
  subtitle: '文件系统 · VFS ＝ 内核中的<b>统一接口抽象层</b>（ext4 / FAT / NFS… 之上的统一门面）',
  ribbonTitle: '选项判定（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」，抓住"统一接口"这个关键词逐项判断。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '<b>VFS 定义了访问不同文件系统的统一接口</b>：向上统一系统调用，向下让 ext4、FAT、NFS 等各自实现标准接口函数。"虚拟"与虚拟内存无关（A 错）、不负责提速（B 错）、本地网络文件系统都能接（D 错）。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
