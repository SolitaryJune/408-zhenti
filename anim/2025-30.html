<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-30 内存映射文件：四个说法逐条判断</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body) {
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
    '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  {
    title: '审题眼：内存映射文件是什么',
    cls: 'key',
    body: '<p>内存映射文件：把磁盘文件（的全部或部分内容）<b>映射到进程虚拟地址空间的一个区域</b>，进程像访问内存一样读写文件，缺页时由请求调页按需装入；<b>多个进程映射同一文件 → 共享内存 → 进程间通信</b>。记住两个关键词：<b>虚拟地址空间</b>、<b>共享文件</b>。</p>'
  },
  {
    title: 'I 可实现进程间通信：对',
    cls: 'good',
    body: '<p>多个进程把<b>同一个文件</b>映射到各自的虚拟地址空间，读写的就是同一份内容——这就是基于内存映射文件的共享内存，可用来实现进程间通信。I 对。</p>',
    ribbon: { k: 1, ok: true }
  },
  {
    title: 'II 实现了页面到磁盘块的映射：错',
    cls: 'bad',
    body: '<p>内存映射直接建立的是<b>「文件 ↔ 进程虚拟地址空间」</b>的映射；至于虚拟页最终对应哪个<b>磁盘块</b>，由文件系统的盘块分配和请求调页在缺页时动态决定——不是内存映射机制一步做成的固定映射。II 错。</p>',
    ribbon: { k: 2, ok: false }
  },
  {
    title: 'III 将文件映射到进程的虚拟地址空间：对',
    cls: 'good',
    body: '<p>这就是<b>定义本身</b>：映射的目标是进程虚拟地址空间里的一个区域。III 对。</p>',
    ribbon: { k: 3, ok: true }
  },
  {
    title: 'IV 将文件映射到系统的物理地址空间：错',
    cls: 'bad',
    body: '<p>进程能直接使用的地址只有<b>虚拟地址</b>；物理页在缺页时才按需分配，进程根本看不到物理地址空间。"映射到物理地址空间"混淆了两个空间。IV 错。</p>',
    ribbon: { k: 4, ok: false }
  },
  {
    title: '结论',
    cls: 'good',
    body: '<p>I、III 正确，答案选 <b>A</b>。记忆锚点：<b>映射对象＝进程虚拟地址空间；同一文件多进程映射＝进程间通信</b>；"物理地址空间""页面到磁盘块"都不是内存映射文件直接实现的东西。</p>'
  }
];

var snaps = STEPS.map(function (s, i) {
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function (x, j) {
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    ribbon: s.ribbon,
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '内存映射文件：I～IV 哪些说法正确（2025-30）',
  subtitle: '虚拟内存管理 · 内存映射文件 · 抓住两个关键词：<b>虚拟地址空间</b> 与 <b>共享文件</b>',
  ribbonTitle: '说法判定（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」，先记定义，再逐条判断 I～IV。',
  snaps: snaps,
  result: {
    big: 'I、III 正确（选 A）',
    html: '内存映射文件<b>将磁盘文件映射到进程的虚拟地址空间</b>（III 对，IV 错——不是物理地址空间）；多个进程映射同一文件即可<b>实现进程间通信</b>（I 对）。页面到磁盘块的对应由文件系统与请求调页动态完成，不是该机制直接实现的固定映射（II 错）。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
