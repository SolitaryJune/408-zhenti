<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-31 谁能告诉文件系统外存的空闲空间</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body) {
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
    '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  {
    title: '审题眼："空闲空间"需要一份全盘台账',
    cls: 'key',
    body: '<p>要回答"哪些盘块还没分配出去"，必须有<b>覆盖全部盘块</b>的记录。空闲空间管理的经典手段：位示图、空闲链表、成组链接……以及本题的主角——<b>显式链接分配中的 FAT</b>。逐项排查四个结构谁握有这份台账。</p>'
  },
  {
    title: 'A 目录：不管空闲块',
    cls: 'bad',
    body: '<p>目录是"文件名 → FCB/索引节点号"的映射表，职责只有<b>按名检索</b>。它既不记录盘块分配，更不记录空闲块。A 错。</p>',
    ribbon: { k: 1, ok: false }
  },
  {
    title: 'B 系统打开文件表：与盘块无关',
    cls: 'bad',
    body: '<p>它是内存中管理<b>已打开文件</b>的表（读写指针、共享计数、FCB 位置……），面向"打开文件"这个动态过程，与外存空闲空间完全是两回事。B 错。</p>',
    ribbon: { k: 2, ok: false }
  },
  {
    title: 'C 文件分配表（FAT）：对',
    cls: 'good',
    body: '<p>FAT 的表项与<b>全部盘块一一对应</b>：文件的块链记在这里，<b>空闲块的表项标特殊值（如 0）串成空闲链</b>——查空闲块只需扫 FAT。它既是链接结构，又<b>兼职空闲空间管理</b>。C 对。</p>',
    ribbon: { k: 3, ok: true }
  },
  {
    title: 'D 文件控制块（FCB）：只有"局部"信息',
    cls: 'bad',
    body: '<p>FCB 记录<b>单个文件</b>占用了哪些盘块——它知道"这个文件用了谁"，不知道"全盘还有谁空闲"。每个文件一份，拼不成全盘台账。D 错。</p>',
    ribbon: { k: 4, ok: false }
  },
  {
    title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>FAT 与盘块一一对应，空闲块在表中一眼可见</b>；目录管按名检索、打开文件表管已打开文件、FCB 只管单个文件，都给不出全盘空闲信息。</p>'
  }
];

var snaps = STEPS.map(function (s, i) {
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function (x, j) {
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    ribbon: s.ribbon,
    done: i === STEPS.length - 1
  };
});

AW.init({
  title: '文件系统靠谁掌握外存空闲空间（2025-31）',
  subtitle: '文件系统基础 · 空闲空间管理 · 需要一份<b>与全部盘块一一对应</b>的台账',
  ribbonTitle: '选项判定（✓ 能 / ✗ 不能）',
  intro: '点击「▶ 播放」，逐项排查四个结构。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '<b>文件分配表（FAT）</b>的表项与全部盘块一一对应：文件块链记在其中，空闲块的表项标特殊值（如 0）串成空闲链——FAT 兼职空闲空间管理，能直接查出外存空闲情况。目录只管按名检索（A）、系统打开文件表只管已打开文件（B）、FCB 只有单个文件的块记录（D）。'
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
