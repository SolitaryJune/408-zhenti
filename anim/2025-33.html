<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-33 三种交换方式传送时间比较动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     算法/过程类：电路交换 / 分组交换 / 报文交换的端到端时间推演
     外壳与控件全部由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
var S = {};   // 持久 DOM 引用

AW.init({
  title: '三种交换方式的传送时间比较',
  subtitle: '2 MB 文件（1 M = 10<sup>6</sup> B）· 链路 10 / 100 / 1000 Mbps · 忽略传播时延与拆装时间',
  counterLabel: '已推演',
  ribbonTitle: '关键步骤（✓ 对 / ✗ 陷阱）',
  intro: '点击「▶ 播放」，逐步算出 T_cs、T_ps、T_ms 并比较。',

  build: function(stage){
    stage.innerHTML = '';
    var inner = AW.el('div', '');

    var mkRow = function(label, chips, widths){
      inner.appendChild(AW.el('div', 'aw-row-label', label));
      var row = AW.el('div', 'aw-cells');
      row.style.marginBottom = '6px';
      var boxes = [];
      chips.forEach(function(t, k){
        var b = AW.el('div', 'aw-box dim', t);
        b.style.width = ((widths && widths[k]) || 150) + 'px';
        b.style.height = '46px';
        b.style.fontSize = '13.5px';
        row.appendChild(b); boxes.push(b);
      });
      inner.appendChild(row);
      return boxes;
    };

    S.f  = mkRow('<b>文件大小</b>',
      ['2 MB', '2×10⁶ B', '1.6×10⁷ bit（16 Mb）'], [110, 140, 200]);
    S.cs = mkRow('<b>① 电路交换</b>（建连 32 μs，速率 10 Mbps，不存储转发）',
      ['建连 32 μs', '发送 16 Mb ÷ 10 Mbps = 1.6 s', 'T_cs = 1.600032 s'], [130, 240, 200]);
    S.ps = mkRow('<b>② 分组交换</b>（每组 400 B，R1、R2 存储转发）',
      ['5000 组（2×10⁶ B ÷ 400 B）', '每组 3200 bit：320 / 32 / 3.2 μs', '流水线：瓶颈 10 Mbps，末组补 32 + 3.2 μs', 'T_ps = 1.6 s + 35.2 μs = 1.6000352 s'], [220, 240, 270, 280]);
    S.ms = mkRow('<b>③ 报文交换</b>（整报文逐段存储转发）',
      ['H1→R1：16 Mb ÷ 10 Mbps = 1.6 s', 'R1→R2：÷ 100 Mbps = 0.16 s', 'R2→H2：÷ 1000 Mbps = 0.016 s', 'T_ms = 1.776 s'], [230, 200, 210, 150]);
    S.cp = mkRow('<b>三者比较</b>',
      ['T_cs = 1.600032 s', 'T_ps = 1.6000352 s', 'T_ms = 1.776 s', 'T_ms > T_ps > T_cs（答案 B）'], [180, 180, 150, 240]);

    S.note = AW.el('div', 'aw-row-label', '');
    inner.appendChild(S.note);
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',     log:'2 MB 文件从 H1 经 R1、R2 到 H2，三段链路 10 / 100 / 1000 Mbps；电路交换建连 32 μs、速率 10 Mbps；分组 400 B；忽略传播时延与拆装时间。', count:0, note:'先统一单位：2 MB = 2×10⁶ B' },
    { cls:'ok',    tag:'换算',     log:'文件大小 2 MB = 2×10⁶ B = 1.6×10⁷ bit（16 Mb）。', count:1, ribbon:{k:1, ok:true}, note:'16 Mb' },
    { cls:'ok',    tag:'电路交换', log:'建连 32 μs 后整条报文以 10 Mbps 连续发送，R1、R2 不存储转发：T_cs = 32 μs + 1.6 s = 1.600032 s。', count:2, ribbon:{k:2, ok:true}, note:'T_cs = 1.600032 s' },
    { cls:'ok',    tag:'分组数',   log:'2×10⁶ B ÷ 400 B = 5000 个分组，每组 400 B = 3200 bit。', count:3, ribbon:{k:3, ok:true}, note:'5000 组 × 3200 bit' },
    { cls:'ok',    tag:'首分组',   log:'首分组走完全程：3200 bit ÷ 10 Mbps = 320 μs、÷ 100 Mbps = 32 μs、÷ 1000 Mbps = 3.2 μs，共 355.2 μs 到达 H2。', count:4, ribbon:{k:4, ok:true}, note:'首分组 355.2 μs 到达' },
    { cls:'shift', tag:'流水线',   log:'此后流水线推进，但瓶颈是第一段 10 Mbps：H1 每 320 μs 才发完一个分组；最后一个分组仍要在 R1、R2 各存储转发一次。', count:5, ribbon:{k:5, ok:true}, note:'瓶颈 10 Mbps，末组补 32 + 3.2 μs' },
    { cls:'ok',    tag:'得 T_ps',  log:'T_ps = 5000 × 320 μs + 32 μs + 3.2 μs = 1.6 s + 35.2 μs = 1.6000352 s。', count:6, ribbon:{k:6, ok:true}, note:'T_ps = 1.6000352 s' },
    { cls:'ok',    tag:'报文交换', log:'整个 2 MB 报文在 R1、R2 各「收完再发」：1.6 s + 0.16 s + 0.016 s = 1.776 s，即 T_ms。', count:7, ribbon:{k:7, ok:true}, note:'T_ms = 1.776 s' },
    { cls:'ok',    tag:'比较',     log:'1.776 s > 1.6000352 s > 1.600032 s：T_ms > T_ps > T_cs。分组交换只比电路交换慢 3.2 μs，报文交换最慢。', count:8, ribbon:{k:8, ok:true}, note:'T_ms > T_ps > T_cs' },
    { cls:'done',  tag:'完成',     log:'结论：选 B。', count:9, done:true, note:'答案 B' },
  ],

  render: function(stage, sn, i){
    var set = function(b, cls, txt){
      b.className = 'aw-box' + (cls ? ' ' + cls : '');
      if(txt != null) b.textContent = txt;
    };
    S.f.forEach(function(b){ set(b, i >= 1 ? 'ok' : 'dim'); });
    S.cs.forEach(function(b){ set(b, i >= 2 ? 'ok' : 'dim'); });
    set(S.ps[0], i >= 3 ? 'ok' : 'dim');
    set(S.ps[1], i >= 4 ? 'ok' : 'dim');
    set(S.ps[2], i >= 5 ? 'shift' : 'dim');
    set(S.ps[3], i >= 6 ? 'hit' : 'dim');
    S.ms.forEach(function(b){ set(b, i >= 7 ? 'ok' : 'dim'); });
    set(S.cp[0], i >= 8 ? 'ok' : 'dim');
    set(S.cp[1], i >= 8 ? 'ok' : 'dim');
    set(S.cp[2], i >= 8 ? 'ok' : 'dim');
    set(S.cp[3], i >= 8 ? 'hit' : 'dim');
    S.note.innerHTML = '<b>' + (sn.note || '') + '</b>';
  },

  result: {
    big: '答案 B：T_ms > T_ps > T_cs',
    html: '<p>T_cs = <b>1.600032 s</b>（建连 32 μs + 1.6 s）；T_ps = <b>1.6000352 s</b>（瓶颈在 10 Mbps 首段，末分组补 32 + 3.2 μs 存储转发）；T_ms = <b>1.776 s</b>（整报文三段存储转发）。记忆锚点：瓶颈速率相同时，分组交换只比电路交换多付存储转发时延；报文交换把大报文整段逐站转发，最慢。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
