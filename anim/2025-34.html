<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-34 最小海明距离与检错/纠错能力动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/推理链类：差错编码集两两求距离 → d_min → 检错/纠错能力
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：一切看最小海明距离',
    cls: 'key',
    body: '<p>编码集 4 个等长码字。检错、纠错能力由码字两两距离的<b>最小值 d_min</b> 决定：可检测 <code>d_min − 1</code> 位错；可纠正 <code>⌊(d_min − 1)/2⌋</code> 位错。所以先求 d_min——4 个码字两两共 6 对。</p>' },
  { title: '摆出 4 个码字',
    cls: '',
    body: '<p>A = <code>1001 1010</code>，B = <code>0101 1100</code>，C = <code>1111 0000</code>，D = <code>0000 1111</code>。两两逐位比对，不同的位数就是海明距离。</p>' },
  { title: 'A 与 B、C、D 三对',
    cls: '',
    body: '<p>A↔B：第 1、2、6、7 位不同 → <b>4</b>；A↔C：第 2、3、5、7 位不同 → <b>4</b>；A↔D：第 1、4、6、8 位不同 → <b>4</b>。</p>' },
  { title: 'B、C、D 之间的三对',
    cls: '',
    body: '<p>B↔C：第 1、3、5、6 位不同 → <b>4</b>；B↔D：第 2、4、7、8 位不同 → <b>4</b>；C↔D：<code>1111 0000</code> 与 <code>0000 1111</code> 逐位全反 → <b>8</b>。</p>' },
  { title: '最小海明距离 d_min = 4',
    cls: 'key',
    body: '<p>六对距离 {4, 4, 4, 4, 4, 8}，最小值 <b>4</b>。这就是检错、纠错能力的唯一依据。</p>' },
  { title: '检错能力：d_min − 1 = 3',
    cls: 'good',
    body: '<p>任何合法码字错 ≤ 3 位，都不可能变成另一个合法码字 → 可检测不超过 <b>3 位</b>错，检错率 100%。选项说「检 2 位」的 A、B 项能力被低估。</p>' },
  { title: '纠错能力：⌊(d_min−1)/2⌋ = 1',
    cls: 'good',
    body: '<p>(4 − 1) ÷ 2 向下取整 = <b>1</b>。错 2 位时接收码字可能同时与两个合法码字等距，无法唯一裁决 → 只能纠正 <b>1 位</b>错。「可纠 2 位」的 B、D 项超出了能力。</p>' },
  { title: '逐项核对选项',
    cls: 'bad',
    body: '<p>A（检 2 纠 1）：检错被低估，错；B（检 2 纠 2）：两项都不对；D（检 3 纠 2）：检错对但纠错超能力；C（检 3 纠 1）：与 d_min = 4 完全匹配。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：检错吃 <code>d_min − 1</code>，纠错吃一半 <code>⌊(d_min − 1)/2⌋</code>——纠错能力永远不高于检错能力。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '差错编码：检错 / 纠错能力由谁定？',
  subtitle: '编码集 {1001 1010, 0101 1100, 1111 0000, 0000 1111} · 6 对距离逐对求',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C：检 3 位、纠 1 位',
    html: '<p>6 对距离中最小的 d_min = <b>4</b>（C↔D 那对是 8，不影响最小值）。可检测 ≤ <b>3</b> 位错；可纠正 ≤ <b>1</b> 位错。干扰项来源：距离没算全（低估检错）、忘记向下取整（高估纠错）。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
