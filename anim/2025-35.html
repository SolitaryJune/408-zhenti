<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-35 二进制指数退避封顶规则动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- ============================================================
     概念/推理链类：争用期 → 退避规则 → 封顶 → 最大间隔计算
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：10BaseT 的争用期',
    cls: 'key',
    body: '<p>10 Mbps 以太网的争用期 2τ = 512 bit 时间 ÷ 10 Mbps = <code>51.2 μs</code>。退避等待永远以争用期为单位。问：连续 11 次冲突后，再次尝试发送的<b>最大</b>间隔。</p>' },
  { title: '二进制指数退避规则',
    cls: 'key',
    body: '<p>第 i 次冲突后，从整数 <code>0 ~ 2^i − 1</code> 中随机选一个 k，推迟 <code>k × 51.2 μs</code> 再重传。第 1 次冲突 k ∈ {0, 1}，第 2 次 k ∈ {0…3}，逐次翻倍。</p>' },
  { title: '关键：指数封顶',
    cls: 'key',
    body: '<p>当 i &gt; 10，取值范围<b>不再翻倍</b>，固定为 <code>0 ~ 1023</code>（即 2^10 − 1）；冲突累计达 16 次放弃发送。封顶是为了避免等待时间无限膨胀。</p>' },
  { title: '本题：已连续冲突 11 次',
    cls: '',
    body: '<p>i = 11 &gt; 10 → 封顶生效，下一次尝试前 k 在 <code>0 ~ 1023</code> 中取，最大 k = <b>1023</b>。</p>' },
  { title: '陷阱：不封顶会怎样',
    cls: 'bad',
    body: '<p>若按 2^11 − 1 = 2047 算：2047 × 51.2 μs = <b>104.8064 ms</b>——正是 D 项。忘了「i &gt; 10 封顶」就掉进这个坑。</p>' },
  { title: '计算最大间隔',
    cls: 'good',
    body: '<p>k 取最大 1023：1023 × 51.2 μs = 52377.6 μs = <b>52.3776 ms</b>。</p>' },
  { title: '其余干扰项的来源',
    cls: 'bad',
    body: '<p>0.512 ms = 10 个争用期、0.5632 ms = 11 个争用期——都把「冲突次数 / 指数」误当成了 k 本身；k 的上限是 1023，不是 10 或 11。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。记忆锚点：<b>i &gt; 10 封顶 1023 个争用期</b>，1023 × 51.2 μs = 52.3776 ms；16 次冲突放弃。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '连续 11 次冲突后，最大退避间隔是多少？',
  subtitle: '10BaseT · 争用期 51.2 μs · 二进制指数退避 · 封顶 2^10 − 1',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C：52.3776 ms',
    html: '<p>冲突 11 次 → 指数封顶为 10 → k 上限 <b>1023</b>，最大间隔 = 1023 × 51.2 μs = <b>52.3776 ms</b>。D 项 104.8064 ms 来自「忘封顶按 2047 算」，A、B 项来自把冲突次数当 k。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
