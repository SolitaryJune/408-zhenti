<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-40 POP3 职能边界辨析动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/推理链类：邮件系统三段路 → POP3 四条叙述逐个判 → 结论
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：邮件系统的三段路',
    cls: 'key',
    body: '<p>用户代理 → 发送方邮件服务器、发送方 → 接收方邮件服务器，这两段都用 <b>SMTP</b>「推」信；只有「用户代理 ← 接收方邮件服务器」拉信这一段用 <b>POP3</b>（TCP，端口 110）。逐条核 I~IV。</p>' },
  { title: 'I. 用户代理从邮件服务器读取邮件 —— 对',
    cls: 'good',
    body: '<p>POP3 的本职：收件方的用户代理通过 POP3 从接收方邮件服务器<b>下载、读取</b>邮件。</p>',
    ribbon: {k:1, ok:true} },
  { title: 'II. 用户代理向邮件服务器发送邮件 —— 错',
    cls: 'bad',
    body: '<p>发信是「推」，走 <b>SMTP</b>；POP3 只有取信、删信等读取类命令，没有发信功能。</p>',
    ribbon: {k:2, ok:false} },
  { title: 'III. 邮件服务器之间发送与接收邮件 —— 错',
    cls: 'bad',
    body: '<p>服务器之间传递邮件同样用 <b>SMTP</b>；POP3 只存在于「用户代理 ↔ 接收方邮件服务器」之间，从不跨服务器通信。</p>',
    ribbon: {k:3, ok:false} },
  { title: 'IV. 一条 TCP 连接接收多封邮件 —— 对',
    cls: 'good',
    body: '<p>POP3 建立一条 TCP 连接进入事务状态后，可以连续 LIST、RETR、DELE 处理多封邮件，直到 QUIT 才关闭连接 → 一条连接可接收<b>多封</b>邮件。</p>',
    ribbon: {k:4, ok:true} },
  { title: '结论',
    cls: 'good',
    body: '<p>对的是 I、IV，答案选 <b>A</b>。记忆锚点：POP3 只管「最后一跳的拉」；发信与服务器间转发都是 SMTP 的活。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: 'POP3 能做什么、不能做什么？',
  subtitle: '四条叙述逐个判（✓ 正确 / ✗ 错误）· SMTP 推 / POP3 拉',
  counterLabel: '推理步',
  ribbonTitle: '四条叙述（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A：仅 I、IV',
    html: '<p>POP3 = 用户代理从邮件服务器<b>读取</b>邮件 + <b>一条 TCP 连接可收多封</b>邮件。发信（II）与服务器间传递（III）都是 SMTP 的职责。误选 C、D 多因把 II 或 III 当成了 POP3 的功能。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
