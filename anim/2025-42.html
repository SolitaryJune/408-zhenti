<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-42 AOE 网关键路径动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 题图数据：事件 1..7（源点 1、汇点 5），12 个活动
var VE = {1:0, 2:9, 3:2, 4:5, 5:12, 6:6, 7:9};
var VL = {1:0, 2:10, 3:2, 4:5, 5:12, 6:8, 7:9};
// 活动：名称、弧、持续时间、最早开始 ee、最迟开始 el、余量
var ACTS = [
  ['a', '1→3', 2, 0, 0, 0],
  ['b', '1→2', 5, 0, 5, 5],
  ['c', '3→6', 1, 2, 7, 5],
  ['d', '1→4', 3, 0, 2, 2],
  ['e', '3→4', 3, 2, 2, 0],
  ['f', '4→2', 4, 5, 6, 1],
  ['g', '4→6', 1, 5, 7, 2],
  ['h', '6→7', 1, 6, 8, 2],
  ['j', '4→5', 1, 5, 11, 6],
  ['k', '2→5', 2, 9, 10, 1],
  ['m', '4→7', 4, 5, 5, 0],
  ['n', '7→5', 3, 9, 9, 0],
];
var TD = 'border:1px solid #cbd5e1;padding:3px 9px;text-align:center;font-size:13px;font-family:Menlo,monospace';

function evTableHtml(veKnown, vlKnown, hiVe, hiVl, hiVlRow){
  var evs = [1,2,3,4,5,6,7];
  var h = '<table style="border-collapse:collapse;margin-top:8px">';
  h += '<tr><th style="' + TD + ';background:#f1f5f9">事件</th>';
  evs.forEach(function(e){ h += '<th style="' + TD + ';background:#f1f5f9">' + e + '</th>'; });
  h += '</tr><tr><th style="' + TD + ';background:#f1f5f9">最早 ve</th>';
  evs.forEach(function(e){
    var known = veKnown[e] != null;
    var bg = '#fff', color = '#0f172a';
    if (known && hiVe && hiVe.indexOf(e) >= 0){ bg = '#16a34a'; color = '#fff'; }
    else if (known){ bg = '#dcfce7'; }
    h += '<td style="' + TD + ';background:' + bg + ';color:' + color + '">' + (known ? veKnown[e] : '—') + '</td>';
  });
  h += '</tr><tr><th style="' + TD + ';background:#f1f5f9">最迟 vl</th>';
  evs.forEach(function(e){
    var known = vlKnown[e] != null;
    var bg = '#fff', color = '#0f172a';
    if (known && (hiVlRow || (hiVl && hiVl.indexOf(e) >= 0))){ bg = '#16a34a'; color = '#fff'; }
    else if (known){ bg = '#dcfce7'; }
    h += '<td style="' + TD + ';background:' + bg + ';color:' + color + '">' + (known ? vlKnown[e] : '—') + '</td>';
  });
  h += '</tr></table>';
  return h;
}

function actTableHtml(showSlack, hiNames){
  var h = '<table style="border-collapse:collapse;margin-top:10px">';
  h += '<tr>';
  ['活动','弧','持续','最早开始','最迟开始'].forEach(function(t){
    h += '<th style="' + TD + ';background:#f1f5f9">' + t + '</th>';
  });
  h += '<th style="' + TD + ';background:#f1f5f9">余量</th></tr>';
  ACTS.forEach(function(a){
    var key = showSlack && a[5] === 0;
    var bg = key ? '#dcfce7' : '#fff';
    var weight = key ? ';font-weight:700' : '';
    if (hiNames && hiNames.indexOf(a[0]) >= 0){ bg = '#fef3c7'; }
    h += '<tr>';
    for (var c = 0; c < 5; c++){
      h += '<td style="' + TD + weight + ';background:' + bg + '">' + a[c] + '</td>';
    }
    h += '<td style="' + TD + weight + ';background:' + bg + '">' + (showSlack ? a[5] : '—') + '</td>';
    h += '</tr>';
  });
  h += '</table>';
  return h;
}

function bannerHtml(text, cls){
  var border = cls === 'good' ? '#16a34a' : '#d97706';
  var bg = cls === 'good' ? '#f6fef9' : '#fffbeb';
  return '<div style="border:2px solid ' + border + ';background:' + bg +
    ';border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.7;margin-bottom:6px">' + text + '</div>';
}

function edgeHtml(){
  return '<div style="font-size:12px;color:#64748b;line-height:1.9;margin-top:10px">题图边表：' +
    'a:1→3(2)　b:1→2(5)　c:3→6(1)　d:1→4(3)　e:3→4(3)　f:4→2(4)　g:4→6(1)　h:6→7(1)　' +
    'j:4→5(1)　k:2→5(2)　m:4→7(4)　n:7→5(3)</div>';
}

function summaryHtml(){
  return '<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">' +
    bannerHtml('(1) 最短完成时间 = <b>12</b>；关键活动 = <b>a、e、m、n</b>（关键路径 1→3→4→7→5，2+3+4+3=12）', 'good') +
    bannerHtml('(2) 与 e 同时进行的活动可能为 <b>b、d、c</b>（e 时段 [2,5]，b [0,10]、d [0,5]、c [2,8] 与之重叠）', 'good') +
    bannerHtml('(3) 时间余量最大的活动是 <b>j</b>，余量 = <b>6</b>（11 − 5）', 'good') +
    bannerHtml('(4) b 时刻 6 开工：持续时间最多 <b>4</b>；若 b 仍为 5，则把 <b>k 由 2 压缩为 1</b>', 'good') +
    '</div>';
}

AW.init({
  title: 'AOE 网：关键路径 · 并行活动 · 时间余量',
  subtitle: '12 个活动、7 个事件（源点 1、汇点 5）· 正推 ve → 逆推 vl → 活动余量 → 逐问解答',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」先求 ve / vl，再逐问解答。',

  snaps: [
    { cls:'shift', tag:'审题', log:'AOE 网如题图：源点 1、汇点 5，12 个活动。先正推事件最早时间 ve，再逆推最迟时间 vl', count:0 },
    { cls:'step', tag:'正推 ve·上', log:'ve(1)=0；ve(3)=ve(1)+a=2；ve(4)=max(ve(1)+d=3, ve(3)+e=5)=5', count:1 },
    { cls:'step', tag:'正推 ve·下', log:'ve(6)=max(ve(3)+c=3, ve(4)+g=6)=6；ve(2)=max(ve(1)+b=5, ve(4)+f=9)=9；ve(7)=max(ve(6)+h=7, ve(4)+m=9)=9', count:2 },
    { cls:'ok', tag:'工期 12', log:'ve(5)=max(ve(2)+k=11, ve(4)+j=6, ve(7)+n=12)=12 → 最短工期 12（问 1 前半）', count:3 },
    { cls:'step', tag:'逆推 vl', log:'vl(5)=12；vl(7)=12−n=9；vl(2)=12−k=10；vl(6)=vl(7)−h=8；vl(4)=min(6,11,5,7)=5；vl(3)=min(vl(4)−e=2, vl(6)−c=7)=2；vl(1)=0', count:4 },
    { cls:'ok', tag:'问(1)答', log:'活动余量 = 最迟开始 − 最早开始，为 0 者：a、e、m、n（关键路径 1→3→4→7→5，2+3+4+3=12）', count:5 },
    { cls:'shift', tag:'问(2)', log:'e 的可能时段 [2,5]；b [0,10]、d [0,5]、c [2,8] 与之重叠；f/g/m 最早 5 才开始、a 最迟 2 完成 → 可能同时进行：b、d、c', count:6 },
    { cls:'shift', tag:'问(3)', log:'余量最大：j = 11 − 5 = 6（其次 b、c 各 5）→ 活动 j，余量 6', count:7 },
    { cls:'shift', tag:'问(4)·①', log:'b 时刻 6 才开工：须 ve(2)+k ≤ 12，即 b 最迟 10 完成 → 6+d_b ≤ 10 → b 持续时间最多 4', count:8 },
    { cls:'shift', tag:'问(4)·②', log:'若 b 仍为 5（11 完成，ve(2)=11）：需 11+k ≤ 12 → k ≤ 1，把 k 由 2 压缩为 1（压 f 无用，ve(2) 已由 b 决定）', count:9 },
    { cls:'done', tag:'完成', log:'四问齐了：工期 12 / 关键活动 a,e,m,n；同时进行 b,d,c；余量最大 j（6）；b 最多 4 或把 k 压成 1', count:10, done:true },
  ],

  render: function(stage, sn, i){
    var h = '';
    if (i === 0){
      h += bannerHtml('源点 1（工程开始）→ 汇点 5（工程结束）。<b>ve 正推取 max</b>（所有入边就绪），<b>vl 逆推取 min</b>（不拖累后继）。活动余量 = 弧头 vl − 持续时间 − 弧尾 ve。', 'key') + edgeHtml();
    } else if (i === 1){
      h += bannerHtml('正推最早时间（取 max）：ve(1)=0 → ve(3)=0+2=2 → ve(4)=max(0+3, 2+3)=<b>5</b>');
      h += evTableHtml({1:0,3:2,4:5}, {}, [1,3,4], null, false);
    } else if (i === 2){
      h += bannerHtml('继续正推：ve(6)=max(2+1, 5+1)=<b>6</b>；ve(2)=max(0+5, 5+4)=<b>9</b>；ve(7)=max(6+1, 5+4)=<b>9</b>');
      h += evTableHtml(VE, {}, [6,2,7], null, false);
    } else if (i === 3){
      h += bannerHtml('汇点：ve(5)=max(9+2, 5+1, 9+3)=<b>12</b> → <b>最短工期 12</b>', 'good');
      h += evTableHtml(VE, {}, [5], null, false);
    } else if (i === 4){
      h += bannerHtml('逆推最迟时间（取 min）：vl(5)=12；vl(7)=9；vl(2)=10；vl(6)=8；vl(4)=min(10−4, 12−1, 9−4, 8−1)=<b>5</b>；vl(3)=min(5−3, 8−1)=<b>2</b>；vl(1)=0');
      h += evTableHtml(VE, VL, null, null, true);
    } else if (i === 5){
      h += bannerHtml('(1) 最短完成时间 <b>12</b>；余量 0 的关键活动：<b>a、e、m、n</b>（绿行，关键路径 1→3→4→7→5）', 'good');
      h += evTableHtml(VE, VL, null, null, false);
      h += actTableHtml(true, null);
    } else if (i === 6){
      h += bannerHtml('(2) e 的可能执行时段 = [最早开始 2, 最迟完成 2+3=5]。b [0,10]、d [0,5]、c [2,8] 与其重叠 → <b>b、d、c</b>；f/g/m 最早 5 才开始，a 最迟 2 完成', 'key');
      h += evTableHtml(VE, VL, null, null, false);
      h += actTableHtml(true, ['b','d','c']);
    } else if (i === 7){
      h += bannerHtml('(3) 逐行看余量列：j = 11 − 5 = <b>6</b> 最大（b、c 各 5）→ <b>活动 j，余量 6</b>', 'key');
      h += evTableHtml(VE, VL, null, null, false);
      h += actTableHtml(true, ['j']);
    } else if (i === 8){
      h += bannerHtml('(4)① b 改在时刻 6 开始：不延期须 ve(2) ≤ 12−k=10，即 b 最迟 10 完成 → 6 + d_b ≤ 10 → <b>d_b ≤ 4</b>', 'key');
      h += evTableHtml(VE, VL, null, null, false);
      h += actTableHtml(true, ['b','k']);
    } else if (i === 9){
      h += bannerHtml('(4)② b 仍为 5 → 11 完成，ve(2)=11：须 11 + k ≤ 12 → <b>k 由 2 压缩为 1</b>（f 已不决定 ve(2)，压它没用）', 'key');
      h += evTableHtml(VE, VL, null, null, false);
      h += actTableHtml(true, ['k']);
    } else {
      h += summaryHtml();
    }
    stage.innerHTML = '<div class="aw-scroll">' + h + '</div>';
  },

  result: {
    big: '工期 12',
    html: '(1) 最短完成时间 <b>12</b>，关键活动 <b>a、e、m、n</b>；(2) 与 e 可能同时进行：<b>b、d、c</b>；(3) 余量最大 <b>j，余量 6</b>；(4) b 持续时间最多 <b>4</b>，或把 <b>k 由 2 压缩为 1</b>。<br>方法锚点：ve 正推取 max → vl 逆推取 min → 活动余量 = 弧头 vl − 弧长 − 弧尾 ve。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
