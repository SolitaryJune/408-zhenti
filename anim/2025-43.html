<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-43 Cache 地址划分与缺失率动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 算法/过程类：地址划分 → 元素定位 → 缺失率 → 跨页/缺页，四问逐问演示 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '组相联 Cache：地址划分、缺失率与跨页分析',
  subtitle: '32KB Cache · 8 路组相联 · 块 64B · 页 4KB · d 起始 VA <code>0180 0020H</code>',
  counterLabel: '步骤',
  ribbonTitle: '关键步骤（✓ 对 / ✗ 陷阱）',
  intro: '点击「▶ 播放」按问逐步演示。',

  build: function(stage){
    stage.innerHTML = '';
    var self = this;
    var inner = AW.el('div', '');

    // 通用：往指定行里放一个带顶部标签的 chip
    var mkChipInto = function(row, top, val, w){
      var col = AW.el('div', '');
      col.style.marginRight = '8px';
      if(top) col.appendChild(AW.el('div', 'aw-idx', top));
      var b = AW.el('div', 'aw-box dim', val);
      b.style.width = w + 'px'; b.style.height = '42px'; b.style.fontSize = '14px';
      col.appendChild(b);
      row.appendChild(col);
      return b;
    };

    // 主存地址划分条
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>主存地址划分（32 位）</b>'));
    var pa = AW.el('div', 'aw-cells');
    pa.style.marginBottom = '4px';
    self._pTag = mkChipInto(pa, '', '标记 ?', 170);
    self._pSet = mkChipInto(pa, '', '组号 ?', 120);
    self._pOff = mkChipInto(pa, '', '块内 ?', 120);
    inner.appendChild(pa);

    // 虚拟地址低 12 位
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>虚拟地址（VA31～VA0）：页 4KB → 低 12 位是页内偏移，虚实相同</b>'));
    self._va = AW.el('div', 'aw-row-label', '');
    inner.appendChild(self._va);

    // VA 计算行
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>d[100] 虚拟地址计算</b>（第（2）问）'));
    var calc = AW.el('div', 'aw-cells');
    calc.style.marginBottom = '6px';
    self._c1 = mkChipInto(calc, '', 'd 起始：0180 0020H', 180);
    self._c2 = mkChipInto(calc, '', '+ 100 × 4 = 190H', 160);
    self._c3 = mkChipInto(calc, '', '= 0180 01B0H', 150);
    inner.appendChild(calc);

    // 统计 chips
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>第（3）问统计</b>（读 + 写，2048 轮）'));
    var st = AW.el('div', 'aw-cells');
    st.style.marginBottom = '6px';
    self._tOff = mkChipInto(st, '', '偏移 ?', 100);
    self._tAcc = mkChipInto(st, '', '访问 4096 次', 130);
    self._tBlk = mkChipInto(st, '', '主存块 129 个', 140);
    self._tMiss = mkChipInto(st, '', '缺失 129 次', 120);
    self._tRate = mkChipInto(st, '', '缺失率 ?', 120);
    self._tAmt = mkChipInto(st, '', '平均访问时间 ?', 140);
    inner.appendChild(st);

    // 页分析
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>第（4）问：数组跨页分析</b>'));
    var pg = AW.el('div', 'aw-cells');
    pg.style.marginBottom = '6px';
    self._g1 = mkChipInto(pg, '', '页 01800', 110);
    self._g2 = mkChipInto(pg, '', '页 01801', 110);
    self._g3 = mkChipInto(pg, '', '页 01802', 110);
    self._g4 = mkChipInto(pg, '', '共 ? 页，缺页 ? 次', 190);
    inner.appendChild(pg);

    self._note = AW.el('div', 'aw-row-label', '');
    inner.appendChild(self._note);
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',       log:'Cache 数据区 32KB、8 路组相联、块 64B；页式虚存页 4KB；数组 d（int，2048 个）起始虚拟地址 0180 0020H。', count:0, note:'四问：字段位数 → d[100] → 缺失率 → 跨页' },
    { cls:'ok',    tag:'（1）求组数', log:'块数 = 32KB ÷ 64B = 512 块；8 路组相联 → 组数 = 512 ÷ 8 = 64 = 2^6 → 组号字段占 6 位。', count:1, ribbon:{k:1, ok:true}, note:'组号字段 6 位（512 块 ÷ 8 路 = 64 组）' },
    { cls:'ok',    tag:'（1）块内地址', log:'块大小 64B = 2^6 → 块内地址字段占 6 位；剩下 32−6−6 = 20 位是主存字块标记。', count:2, ribbon:{k:2, ok:true}, note:'块内地址 6 位，tag 20 位' },
    { cls:'ok',    tag:'（1）虚地址索引', log:'页 4KB = 2^12 → VA11～VA0 是页内偏移，虚实页内偏移相同；组号 6 位 + 块内 6 位恰在其中 → VA11～VA6 可作 Cache 索引。', count:3, ribbon:{k:3, ok:true}, note:'VA11～VA6 作 Cache 索引' },
    { cls:'shift', tag:'（2）算 VA',  log:'d[100] 虚拟地址 = 0180 0020H + 100 × 4 = 0180 0020H + 190H = 0180 01B0H。', count:4, ribbon:{k:4, ok:true}, note:'d[100] VA = 0180 01B0H' },
    { cls:'ok',    tag:'（2）求组号',  log:'0x1B0 = 0001 1011 0000B，取 VA11～VA6 = 000110B = 06H（十进制 6）。', count:5, ribbon:{k:5, ok:true}, note:'d[100] → 组号 06H' },
    { cls:'ok',    tag:'（3）d[0] 偏移', log:'d[0] 虚拟地址 0180 0020H 的低 6 位（VA5～VA0）= 100000B → 块内偏移 20H。', count:6, ribbon:{k:6, ok:true}, note:'d[0] 块内偏移 = 20H' },
    { cls:'ok',    tag:'（3）占块数',  log:'数组 2048 × 4B = 8192B，从偏移 20H 开始到偏移 2020H−1：占 0 号块尾部至第 128 号块 → 129 个主存块。', count:7, ribbon:{k:7, ok:true}, note:'数组占 129 个主存块' },
    { cls:'ok',    tag:'（3）访问次数', log:'每轮对 d[i] 读一次（d[i]/x）、写一次（赋值）→ 2 × 2048 = 4096 次访问；每块只有首次访问缺失 → 缺失 129 次。', count:8, ribbon:{k:8, ok:true}, note:'4096 次访问，缺失 129 次' },
    { cls:'ok',    tag:'（3）缺失率与时间', log:'缺失率 = 129 ÷ 4096 ≈ 3.15%；平均访问时间 = 2 + 0.0315 × 200 = 8.30 个时钟周期。', count:9, ribbon:{k:9, ok:true}, note:'缺失率 3.15%，平均 8.30 拍' },
    { cls:'ok',    tag:'（4）跨页与缺页', log:'数组占 VA 0180 0020H ～ 0180 201FH；页大小 4KB（1000H），首地址页号 01800H，末地址页号 01802H → 3 个页；每页首次访问缺页一次 → 缺页 3 次。', count:10, ribbon:{k:10, ok:true}, note:'3 个页，缺页 3 次' },
    { cls:'done',  tag:'完成',       log:'汇总：组号 6 位、块内 6 位、VA11～VA6 索引；d[100] VA = 0180 01B0H、组号 06H；d[0] 偏移 20H；缺失率 3.15%、平均 8.30 拍；3 页、缺页 3 次。', count:11, done:true, note:'四问答案见结论卡' },
  ],

  render: function(stage, sn, i){
    var self = this;
    var set = function(b, cls, txt){
      b.className = 'aw-box' + (cls ? ' ' + cls : '');
      if(txt != null) b.textContent = txt;
    };
    set(self._pTag, 'dim', '标记 ?');
    set(self._pSet, 'dim', '组号 ?');
    set(self._pOff, 'dim', '块内 ?');
    self._va.innerHTML = '<span style="font-size:12px;color:#b9cbd0">（待点亮：页号 20 位 | VA11～VA6 组索引 | VA5～VA0 块内）</span>';
    set(self._c1, 'dim', 'd 起始：0180 0020H');
    set(self._c2, 'dim', '+ 100 × 4 = 190H');
    set(self._c3, 'dim', '= 0180 01B0H');
    set(self._tOff, 'dim', '偏移 ?');
    set(self._tAcc, 'dim', '访问 4096 次');
    set(self._tBlk, 'dim', '主存块 129 个');
    set(self._tMiss, 'dim', '缺失 129 次');
    set(self._tRate, 'dim', '缺失率 ?');
    set(self._tAmt, 'dim', '平均访问时间 ?');
    set(self._g1, 'dim', '页 01800'); set(self._g2, 'dim', '页 01801');
    set(self._g3, 'dim', '页 01802'); set(self._g4, 'dim', '共 ? 页，缺页 ? 次');
    if(i >= 1){ set(self._pSet, 'ok', '组号 6 位'); }
    if(i >= 2){ set(self._pOff, 'ok', '块内 6 位'); set(self._pTag, 'ok', '标记 20 位'); }
    if(i >= 3){
      self._va.innerHTML = '<span style="font-size:12.5px;color:#276942">页号（VA31～VA12） | <b>VA11～VA6 = 组索引</b> | VA5～VA0 = 块内地址</span>';
    }
    if(i >= 4){ set(self._c1, 'ok'); set(self._c2, 'ok'); set(self._c3, 'shift'); }
    if(i >= 6){ set(self._tOff, 'ok', '偏移 20H'); }
    if(i >= 7){ set(self._tBlk, 'ok'); }
    if(i >= 8){ set(self._tAcc, 'ok'); set(self._tMiss, 'ok'); }
    if(i >= 9){ set(self._tRate, 'ok', '缺失率 3.15%'); set(self._tAmt, 'ok', '平均 8.30 拍'); }
    if(i >= 10){
      set(self._g1, 'ok'); set(self._g2, 'ok'); set(self._g3, 'ok');
      set(self._g4, 'ok', '共 3 页，缺页 3 次');
    }
    self._note.innerHTML = '<b>' + (sn.note || '') + '</b>';
  },

  result: {
    big: '四问答案全齐',
    html: '<p>（1）组号字段 <b>6 位</b>、块内地址 <b>6 位</b>，<b>VA11～VA6</b> 可作 Cache 索引；（2）d[100] 虚拟地址 <b>0180 01B0H</b>，组号 <b>06H（6）</b>；（3）d[0] 块内偏移 <b>20H</b>，缺失率 <b>129/4096 ≈ 3.15%</b>，平均访问时间 <b>2 + 0.0315 × 200 = 8.30</b> 个时钟周期；（4）数组分布在 <b>3 个页</b>，缺页 <b>3 次</b>。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
