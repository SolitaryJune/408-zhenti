<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2025-47 卫星链路大题三问推演动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- ============================================================
     概念/推理链类：大题三问逐问推演（时延/吞吐量 · GBN 窗口/序号 · 子网划分）
     外壳与控件由 assets/anim-engine.js 提供，只改 AW.init 区域。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：拓扑与三个已知量',
    cls: 'key',
    body: '<p>拓扑：H—S1—R1—TR1—卫星—TR2—R2—S2—总部服务器。已知：轨道高 <code>36000 km</code>，波速 <code>300000 km/s</code>，R1↔R2 每方向 <code>200 kb/s</code>；H = <code>10.10.10.33/26</code>。三问：时延与吞吐量、GBN 窗口/序号、子网划分。</p>' },
  { title: '（1）单向传播时延：上行 + 下行',
    cls: 'good',
    body: '<p>卫星到地面收发设备的距离一致，上行、下行各 <code>36000 ÷ 300000 = 0.12 s</code> → R1 到 R2 之间的卫星链路单向传播时延 = 2 × 0.12 = <b>0.24 s</b>。</p>' },
  { title: '（1）最大吞吐量：短板效应',
    cls: 'good',
    body: '<p>整条链路找最慢一段：全路径只给出 <code>200 kb/s</code> 这一个速率 → 最大吞吐量 = <b>200 kb/s</b>。</p>' },
  { title: '（1）4000B 文件：发送时延 + 传播时延',
    cls: 'good',
    body: '<p>发送时延 = 4000 × 8 ÷ 200000 = <code>0.16 s</code>；至少需要 0.16 + 0.24 = <b>0.40 s</b>。</p>' },
  { title: '（2）一个「发送→确认」周期',
    cls: '',
    body: '<p>帧发送时间 Tf = 1500 × 8 ÷ 200000 = <code>0.06 s</code>；周期 = Tf + 2 × 0.24 = 0.06 + 0.48 = <code>0.54 s</code>。</p>' },
  { title: '（2）发送窗口：利用率 ≥ 80%',
    cls: 'good',
    body: '<p><code>w × Tf ÷ 0.54 ≥ 0.8</code> → <code>0.06w ≥ 0.432</code> → <code>w ≥ 7.2</code>。不能取 7，发送窗口至少 <b>8</b>。</p>' },
  { title: '（2）序号位数：空间 ≥ 发送窗口 + 接收窗口',
    cls: 'good',
    body: '<p>GBN 接收窗口 = 1，序号空间至少 8 + 1 = 9；2<sup>3</sup> = 8 &lt; 9 ≤ 2<sup>4</sup> = 16 → 帧序号至少 <b>4 位</b>。</p>' },
  { title: '（3）需求换算：可分配数 = 块大小 − 2',
    cls: 'key',
    body: '<p>生活区可分配 ≥ 120 → 用 /25（128 块，可分配 <b>126</b>）；作业区、管理区可分配 ≥ 60 → 各用 /26（64 块，可分配 <b>62</b>）。2 × 64 + 128 = 256，恰好用满 /24。</p>' },
  { title: '（3）顺次切块，用 H 的地址验证',
    cls: 'good',
    body: '<p>H = <code>10.10.10.33/26</code> 落在 <code>10.10.10.0/26</code> → 管理区 10.10.10.0/26、作业区 <b>10.10.10.64/26</b>、生活区 <b>10.10.10.128/25</b>。</p>' },
  { title: '结论：三问答案汇总',
    cls: 'good',
    body: '<p>（1）单向传播时延 <b>0.24 s</b>、最大吞吐量 <b>200 kb/s</b>、4000B 至少 <b>0.40 s</b>；（2）发送窗口至少 <b>8</b>、序号至少 <b>4 位</b>；（3）管理区 <b>10.10.10.0/26</b>、作业区 <b>10.10.10.64/26</b>、生活区 <b>10.10.10.128/25</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '卫星链路：时延 / GBN 窗口 / 子网划分（大题三问）',
  subtitle: '轨道高 36000 km · 波速 300000 km/s · 每方向 200 kb/s · 1500B 帧 · 10.10.10.0/24 切三块',
  counterLabel: '已展开',
  intro: '点击「▶ 播放」，按问逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '三问答案',
    html: '<b>（1）0.24 s / 200 kb/s / 0.40 s</b>（上行下行各 0.12 s；短板效应；发送时延 0.16 s + 传播 0.24 s）；<b>（2）窗口 8、序号 4 位</b>（w ≥ 7.2 向上取整；2^n ≥ 8+1）；<b>（3）10.10.10.0/26、10.10.10.64/26、10.10.10.128/25</b>（62/62/126 个可分配地址，H=10.10.10.33/26 验证管理区）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
<script>/* aw-ok */</script>
</body>
</html>
