<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-01 顺序表头尾插删的元素移动 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var BASE = ['a1','a2','a3','a4','a5','a6'];   // n = 6 ≥ 3 的顺序表

// 生成一行格子，并按 paint = {位置(1起): 'amber'|'green'|'red'|'dim'} 涂色
function styledRow(chars, paint, ptrMap){
  var row = AW.cellRow(chars, null, ptrMap || null, 1);
  if (paint){
    for (var k in paint){
      var col = row.children[+k - 1];
      if (!col) continue;
      var boxEl = col.children[1];
      var p = paint[k];
      if (p === 'amber'){ boxEl.style.background='#f8edcb'; boxEl.style.borderColor='#e07a2f'; boxEl.style.color='#92400e'; }
      else if (p === 'green'){ boxEl.style.background='#2f9e4424'; boxEl.style.borderColor='#2f9e44'; boxEl.style.color='#1e4d33'; }
      else if (p === 'red'){ boxEl.style.background='#e6394620'; boxEl.style.borderColor='#e63946'; boxEl.style.color='#a02830'; }
      else if (p === 'dim'){ boxEl.style.opacity='.45'; }
    }
  }
  return row;
}

var box = null, verdict = null;

function build(stage){
  stage.innerHTML = '';
  var wrap = AW.el('div', 'aw-scroll');
  var lbl = AW.el('div', 'aw-row-label', '<b>顺序表 L</b>（n = 6，仍有空闲空间；绿=新元素，琥珀=被移动的元素，红=空出的位置）');
  box = AW.el('div', '');
  verdict = AW.el('div', 'aw-row-label', '');
  wrap.appendChild(lbl);
  wrap.appendChild(box);
  wrap.appendChild(verdict);
  stage.appendChild(wrap);
}

function render(stage, sn){
  box.innerHTML = '';
  box.appendChild(styledRow(sn.cells, sn.paint, sn.ptr));
  verdict.innerHTML = sn.note || '';
}

var snaps = [
  { cls:'step', tag:'初始', count:0,
    log:'初始：顺序表 a1, a2, a3, a4, a5, a6（n=6 ≥ 3），原有相对次序必须保持。',
    cells: BASE, paint:{}, note:'下面逐个考察四种操作，看哪些<b>一定会移动多个元素</b>。' },
  { cls:'shift', tag:'I 表头插入', count:1, ribbon:{k:1, ok:true},
    log:'I 在表头插入：新元素占第 1 位，原有 6 个元素位序全部加 1，必须整体后移一格 —— 移动 6 个元素。',
    cells:['新','a1','a2','a3','a4','a5','a6'],
    paint:{1:'green', 2:'amber', 3:'amber', 4:'amber', 5:'amber', 6:'amber', 7:'amber'},
    ptr:{1:'插入→'},
    note:'原有 n 个元素全部后移：<b>一定移动多个元素</b>（n ≥ 3）。' },
  { cls:'shift', tag:'II 表头删除', count:2, ribbon:{k:2, ok:true},
    log:'II 在表头删除：a1 被删掉，空出的首位由 a2..a6 整体前移一格填补 —— 移动 5 个元素。',
    cells:['a2','a3','a4','a5','a6','空','—'],
    paint:{1:'amber', 2:'amber', 3:'amber', 4:'amber', 5:'amber', 6:'red', 7:'dim'},
    ptr:{1:'a1 已删'},
    note:'其余 n−1 个元素全部前移（n−1 ≥ 2）：<b>一定移动多个元素</b>。' },
  { cls:'ok', tag:'III 表尾插入', count:3, ribbon:{k:3, ok:false},
    log:'III 在表尾插入：新元素直接写入第 7 个存储位置，任何原有元素都不用动 —— 移动 0 个。',
    cells:['a1','a2','a3','a4','a5','a6','新'],
    paint:{7:'green'},
    ptr:{7:'插入→'},
    note:'一步到位：<b>不移动任何元素</b>。' },
  { cls:'ok', tag:'IV 表尾删除', count:4, ribbon:{k:4, ok:false},
    log:'IV 在表尾删除：表长直接减 1，a6 自然出局，其余元素位置不变 —— 移动 0 个。',
    cells:['a1','a2','a3','a4','a5','空','—'],
    paint:{6:'red', 7:'dim'},
    ptr:{6:'a6 已删'},
    note:'一步到位：<b>不移动任何元素</b>。' },
  { cls:'done', tag:'结论', count:4,
    log:'一定是「移动多个元素」的只有 I（表头插入，动 6 个）和 II（表头删除，动 5 个）→ 选 A。',
    cells: BASE, paint:{},
    note:'<b style="color:#2f9e44">仅 I、II 一定移动多个元素 → 答案 A</b>。表尾插/删一步到位，不移动任何元素。', done:true },
];

AW.init({
  title: '2026-01 · 顺序表头/尾插删：谁一定移动多个元素',
  subtitle: '顺序存储 · n ≥ 3 · 相对次序必须保持 · <code>表头动全表，表尾只碰一格</code>',
  counterLabel: '已分析操作',
  ribbonTitle: '操作（✓ 一定移动多个 / ✗ 不移动）',
  intro: '点击「▶ 播放」逐个操作观察必须挪动的元素。',
  build: build,
  render: render,
  snaps: snaps,
  result: {
    big: '答案 A（仅 I、II）',
    html: '表头插入要把原有 <b>n 个元素全部后移</b>，表头删除要把 <b>n−1 个元素全部前移</b>，都是「一定移动多个」；表尾插入/删除只碰最后一个位置，<b>移动 0 个元素</b>。所以仅 I、II 符合，选 <b>A</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
