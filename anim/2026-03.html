<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-03 中序+层序重建二叉树求后序 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

var INORDER = ['b','e','d','f','c','a','g'];
var LEVEL   = ['a','b','g','c','d','e','f'];

// 涂色小工具：paint = {位置(1起): 'amber'|'green'|'red'|'dim'|'blue'}
function styledRow(chars, paint, label){
  var row = AW.cellRow(chars, null, null, 1);
  if (paint){
    for (var k in paint){
      var col = row.children[+k - 1];
      if (!col) continue;
      var boxEl = col.children[1];
      var p = paint[k];
      if (p === 'amber'){ boxEl.style.background='#f8edcb'; boxEl.style.borderColor='#e07a2f'; boxEl.style.color='#92400e'; }
      else if (p === 'green'){ boxEl.style.background='#2f9e4424'; boxEl.style.borderColor='#2f9e44'; boxEl.style.color='#1e4d33'; }
      else if (p === 'blue'){ boxEl.style.background='#d9e3df'; boxEl.style.borderColor='#1b3a4b'; boxEl.style.color='#1b3a4b'; }
      else if (p === 'red'){ boxEl.style.background='#e6394620'; boxEl.style.borderColor='#e63946'; boxEl.style.color='#a02830'; }
      else if (p === 'dim'){ boxEl.style.opacity='.45'; }
    }
  }
  var wrap = AW.el('div', '');
  if (label) wrap.appendChild(AW.el('div', 'aw-row-label', label));
  wrap.appendChild(row);
  return wrap;
}

/* ---- 树：a( b(－, c(d(e,f)) ) , g )，用中序位置布局 ---- */
var TREE = {
  v:'a',
  l:{ v:'b', l:null, r:{ v:'c', l:{ v:'d', l:{ v:'e', l:null, r:null }, r:{ v:'f', l:null, r:null } }, r:null } },
  r:{ v:'g', l:null, r:null }
};
var POS = {}, cnt = 0;
(function assign(nd, d){ if(!nd) return; assign(nd.l, d+1); POS[nd.v] = { x: ++cnt, d: d }; assign(nd.r, d+1); })(TREE, 1);
var XP = 58, YP = 54, R = 17;

// vis = {id: 'new'|'ok'}，只画已确定的结点
function drawTree(vis){
  var W = (cnt + 1) * XP, H = 6.2 * YP;
  function px(id){ return POS[id].x * XP; }
  function py(id){ return POS[id].d * YP - 14; }
  var s = '<svg width="' + W + '" height="' + H + '" style="display:block;margin:0 auto">';
  (function edges(nd){
    if (!nd) return;
    var me = vis[nd.v];
    ['l','r'].forEach(function(k){
      if (nd[k] && me && vis[nd[k].v]){
        s += '<line x1="' + px(nd.v) + '" y1="' + py(nd.v) + '" x2="' + px(nd[k].v) + '" y2="' + py(nd[k].v) +
             '" stroke="#b9cbd0" stroke-width="2"/>';
      }
    });
    edges(nd.l); edges(nd.r);
  })(TREE);
  for (var id in POS){
    if (!vis[id]) continue;
    var isNew = (vis[id] === 'new');
    var fill = isNew ? '#f8edcb' : '#2f9e4424';
    var stroke = isNew ? '#e07a2f' : '#2f9e44';
    s += '<circle cx="' + px(id) + '" cy="' + py(id) + '" r="' + R + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>' +
         '<text x="' + px(id) + '" y="' + (py(id) + 5) + '" text-anchor="middle" font-size="13" font-weight="700" fill="#1b3a4b" font-family="Menlo,Consolas,monospace">' + id + '</text>';
  }
  return s + '</svg>';
}

var seqBox = null, treeBox = null, noteLine = null;

function build(stage){
  stage.innerHTML = '';
  seqBox = AW.el('div', '');
  treeBox = AW.el('div', '');
  noteLine = AW.el('div', 'aw-row-label', '');
  stage.appendChild(seqBox);
  stage.appendChild(treeBox);
  stage.appendChild(noteLine);
}

function render(stage, sn){
  seqBox.innerHTML = '';
  seqBox.appendChild(styledRow(INORDER, sn.ip, '<b>中序</b> b,e,d,f,c,a,g（琥珀=当前左子树，绿=当前根，蓝=当前右子树）'));
  seqBox.appendChild(styledRow(LEVEL, sn.lp, '<b>层序</b> a,b,g,c,d,e,f（绿=本步确定的子树根）'));
  if (sn.post){
    seqBox.appendChild(styledRow(['e','f','d','c','b','g','a'], sn.post, '<b>后序</b>（左子树 → 右子树 → 根）'));
  }
  treeBox.innerHTML = drawTree(sn.vis || {});
  noteLine.innerHTML = sn.note || '';
}

var VIS_A   = { a:'new' };
var VIS_BG  = { a:'ok', g:'ok', b:'new' };
var VIS_C   = { a:'ok', g:'ok', b:'ok', c:'new' };
var VIS_ALL = { a:'ok', g:'ok', b:'ok', c:'ok', d:'new', e:'new', f:'new' };
var VIS_OK  = { a:'ok', g:'ok', b:'ok', c:'ok', d:'ok', e:'ok', f:'ok' };

var snaps = [
  { cls:'step', tag:'规则', count:0,
    ip:{}, lp:{},
    note:'规则：<b>层序序列定根</b>（子树根是它在层序中最先出现的结点），<b>中序序列分左右</b>（根左边的进左子树、右边的进右子树）。',
    log:'已知中序 b,e,d,f,c,a,g 与层序 a,b,g,c,d,e,f，两序列配合即可唯一重建二叉树。' },
  { cls:'step', tag:'定根 a', count:1, ribbon:{k:1, ok:true},
    ip:{6:'green', 1:'amber',2:'amber',3:'amber',4:'amber',5:'amber', 7:'blue'},
    lp:{1:'green'},
    vis: VIS_A,
    note:'层序第一个元素 <b>a</b> 是根；中序里 a 左边的 {b,e,d,f,c} 是左子树、右边的 {g} 是右子树（g 在层序中紧跟 a 且独占一段，单结点即可确定）。',
    log:'层序定根 a，中序切分：左子树 b,e,d,f,c（5 个结点），右子树 g。' },
  { cls:'step', tag:'定根 b', count:3, ribbon:{k:2, ok:true},
    ip:{1:'green', 2:'amber',3:'amber',4:'amber',5:'amber'},
    lp:{2:'green'},
    vis: VIS_BG,
    note:'左子树 {b,e,d,f,c} 在层序中最先出现的是 <b>b</b> → b 为左子树根；b 在中序最左 → <b>b 无左子树</b>，其右子树为 {e,d,f,c}。',
    log:'左子树的根是 b；b 位于中序最左，没有左孩子，剩下 e,d,f,c 全在 b 的右子树里。' },
  { cls:'step', tag:'定根 c', count:4, ribbon:{k:3, ok:true},
    ip:{4:'green', 1:'amber',2:'amber',3:'amber'},
    lp:{4:'green'},
    vis: VIS_C,
    note:'右子树 {e,d,f,c} 在层序中最先出现的是 <b>c</b> → c 为根；c 在中序最右 → <b>c 无右子树</b>，其左子树为 {e,d,f}。',
    log:'b 的右子树以 c 为根；c 位于中序最右，没有右孩子，左子树为 e,d,f。' },
  { cls:'step', tag:'定根 d', count:7, ribbon:{k:4, ok:true},
    ip:{2:'green', 1:'blue', 3:'blue'},
    lp:{5:'green'},
    vis: VIS_ALL,
    note:'{e,d,f} 在层序中最先出现的是 <b>d</b> → d 为根；中序中 d 左边是 e（左孩子）、右边是 f（右孩子），两个叶结点。树重建完成。',
    log:'最后一棵子树 {e,d,f}：根为 d，左孩子 e、右孩子 f —— 整棵树确定。' },
  { cls:'ok', tag:'验证', count:7,
    ip:{1:'green',2:'green',3:'green',4:'green',5:'green',6:'green',7:'green'},
    lp:{1:'green',2:'green',3:'green',4:'green',5:'green',6:'green',7:'green'},
    vis: VIS_OK,
    note:'验证：中序 e,d,f,c,b → a → g 吻合；层序 a | b,g | c | d | e,f 吻合。树为 a（左 b，b 无左孩子、右孩子 c，c 左孩子 d，d 的孩子 e、f；右 g）。',
    log:'用两个原序列逐位验证，树形正确。' },
  { cls:'ok', tag:'推后序', count:7,
    ip:{}, lp:{}, post:{1:'green',2:'green',3:'green',4:'green',5:'green',6:'green',7:'green'},
    vis: VIS_OK,
    note:'后序 = 左子树后序 + 右子树后序 + 根：d 的后序 e,f,d → c 的后序 e,f,d,c → b 的后序 e,f,d,c,b → 右子树 g → 根 a。<b>e,f,d,c,b,g,a</b>。',
    log:'自底向上拼后序：e,f,d → e,f,d,c → e,f,d,c,b → 再访问右子树 g → 最后根 a。' },
  { cls:'done', tag:'结论', count:7,
    ip:{}, lp:{}, post:{1:'green',2:'green',3:'green',4:'green',5:'green',6:'green',7:'green'},
    vis: VIS_OK,
    note:'<b style="color:#2f9e44">后序序列为 e,f,d,c,b,g,a → 答案 C</b>。干扰项 A、B 只是把 e、f 的先后调换。',
    log:'对照选项：C 的 e,f,d,c,b,g,a 与推导完全一致 → 选 C。',
    done:true },
];

AW.init({
  title: '2026-03 · 由中序 + 层序重建二叉树，再求后序',
  subtitle: '层序定根 · 中序分左右 · <code>重建后按「左右根」写出后序</code>',
  counterLabel: '已确定结点',
  ribbonTitle: '定根步骤（✓ 完成）',
  intro: '点击「▶ 播放」，看树如何被两个序列逐步唯一确定。',
  build: build,
  render: render,
  snaps: snaps,
  result: {
    big: '答案 C（e,f,d,c,b,g,a）',
    html: '重建规则：<b>层序定根、中序分左右</b>。得到 a（左 b：b 无左孩子、右孩子 c：c 无右孩子、左孩子 d：d 的孩子是 e、f；右 g）。后序按「左右根」自底向上拼出 <b>e,f,d,c,b,g,a</b>，选 <b>C</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
