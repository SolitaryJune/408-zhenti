<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-04 森林转二叉树的最小高度 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 5 棵树：结点数 2,3,4,5,7；最优排列为大树在前；h(n)=各树转成二叉树后的最小高度
var TREES = [
  { j:1, n:7, h:4 },
  { j:2, n:5, h:4 },
  { j:3, n:4, h:3 },
  { j:4, n:3, h:3 },
  { j:5, n:2, h:2 },
];

// 层尺：rows = 已处理的树；每行标出根所在层（蓝）与该树最深点所在层（红）
function rulerHTML(rows, maxLayer){
  var h = '<table style="border-collapse:collapse;margin:6px 0;font-size:13px">';
  h += '<tr><td style="padding:3px 8px;color:#64748b">层 →</td>';
  for (var L = 1; L <= 7; L++){
    var hot = (L === maxLayer);
    h += '<td style="padding:3px 10px;font-weight:700;color:' + (hot ? '#dc2626' : '#94a3b8') +
         ';border-bottom:2px solid #e2e8f0">' + L + '</td>';
  }
  h += '</tr>';
  rows.forEach(function(t){
    h += '<tr><td style="padding:3px 8px;color:#334155;white-space:nowrap">树 ' + t.j +
         '（' + t.n + ' 结点，转化高 ' + t.h + '）</td>';
    for (var L = 1; L <= 7; L++){
      var bg = '#fff', txt = '', bd = '#e2e8f0', fg = '#334155';
      if (L === t.j){ bg = '#dbeafe'; bd = '#2563eb'; txt = '根'; fg = '#1e40af'; }
      else if (L === t.j + t.h - 1){ bg = '#fee2e2'; bd = '#dc2626'; txt = '深'; fg = '#b91c1c'; }
      else if (L > t.j && L < t.j + t.h - 1){ bg = '#fef3c7'; bd = '#fcd34d'; txt = '·'; fg = '#92400e'; }
      h += '<td style="padding:3px 10px;background:' + bg + ';border:1.5px solid ' + bd +
           ';color:' + fg + ';text-align:center;font-weight:700;min-width:34px">' + txt + '</td>';
    }
    h += '<td style="padding:3px 10px;color:#64748b">最深点在第 <b>' + (t.j + t.h - 1) + '</b> 层</td></tr>';
  });
  h += '</table>';
  return h;
}

var stageBox = null, noteLine = null;

function build(stage){
  stageBox = AW.el('div', '');
  noteLine = AW.el('div', 'aw-row-label', '');
  stage.appendChild(stageBox);
  stage.appendChild(noteLine);
}

function chainHTML(){
  var h = '<div style="margin:8px 0;white-space:nowrap;font-size:14px">';
  for (var i = 1; i <= 5; i++){
    h += '<span class="aw-box" style="display:inline-block;width:52px;height:40px;background:#dbeafe;border-color:#2563eb;color:#1e40af">树' + i + '根</span>';
    if (i < 5) h += '<span style="display:inline-block;margin:0 8px;color:#64748b">—右孩子→</span>';
  }
  h += '</div>';
  return h;
}

function hTableHTML(){
  return '<table style="border-collapse:collapse;margin:6px 0;font-size:13.5px">' +
    '<tr><td style="border:1.5px solid #cbd5e1;padding:4px 12px;background:#f1f5f9">树中结点数 n</td>' +
    '<td style="border:1.5px solid #cbd5e1;padding:4px 12px">2</td><td style="border:1.5px solid #cbd5e1;padding:4px 12px">3</td>' +
    '<td style="border:1.5px solid #cbd5e1;padding:4px 12px">4</td><td style="border:1.5px solid #cbd5e1;padding:4px 12px">5</td>' +
    '<td style="border:1.5px solid #cbd5e1;padding:4px 12px">7</td></tr>' +
    '<tr><td style="border:1.5px solid #cbd5e1;padding:4px 12px;background:#f1f5f9">转化后最小高度 h(n)</td>' +
    '<td style="border:1.5px solid #cbd5e1;padding:4px 12px;color:#b91c1c;font-weight:700">2</td>' +
    '<td style="border:1.5px solid #cbd5e1;padding:4px 12px;color:#b91c1c;font-weight:700">3</td>' +
    '<td style="border:1.5px solid #cbd5e1;padding:4px 12px;color:#b91c1c;font-weight:700">3</td>' +
    '<td style="border:1.5px solid #cbd5e1;padding:4px 12px;color:#b91c1c;font-weight:700">4</td>' +
    '<td style="border:1.5px solid #cbd5e1;padding:4px 12px;color:#b91c1c;font-weight:700">4</td></tr></table>';
}

function render(stage, sn){
  var h = '';
  if (sn.mode === 'rule'){ h = chainHTML(); }
  else if (sn.mode === 'htable'){ h = hTableHTML(); }
  else if (sn.mode === 'order'){
    h = '<div style="margin:8px 0;font-size:14px">最优排列（大树在前）：';
    [7,5,4,3,2].forEach(function(n, i){
      h += '<span class="aw-box" style="display:inline-block;width:44px;height:40px;margin-right:6px;background:#fef3c7;border-color:#d97706;color:#92400e">' + n + '</span>';
      if (i < 4) h += '<span style="margin-right:6px;color:#64748b">→</span>';
    });
    h += '</div>';
  }
  else if (sn.rows){ h = rulerHTML(sn.rows, sn.maxLayer || 1); }
  stageBox.innerHTML = h;
  noteLine.innerHTML = sn.note || '';
}

var snaps = [
  { cls:'step', tag:'规则', count:0, mode:'rule',
    note:'森林转二叉树：第 1 棵树的根作二叉树根，第 j 棵树的根是第 j−1 棵树根的<b>右孩子</b> —— 5 个树根连成右链，第 j 棵树的根必落在第 j 层；树内部按「左孩子、右兄弟」转化。',
    log:'排列次序任意，能选的只有「各棵树的先后次序」；高度由根链层数与树内深度共同决定。' },
  { cls:'step', tag:'单树最小转化高', count:0, mode:'htable',
    note:'先把每棵树各自转得最矮：根的第一个孩子挂左子树、其余孩子成根的右链，结点分得越均衡越矮。n=7 时：第一孩子挂 4 结点子树（转化高 3）、第二孩子挂 2 结点子树（转化高 2），整树高 1+max(3,1+2)=4。',
    log:'五棵树的最小转化高度：h(2)=2，h(3)=3，h(4)=3，h(5)=4，h(7)=4。' },
  { cls:'shift', tag:'排列策略', count:0, mode:'order',
    note:'第 j 棵树的最深点落在第 j+h−1 层：j 越大层越深，所以<b>转化高大的树排前面</b>。按 7,5,4,3,2 排列。',
    log:'把 7、5 结点的树放前面（j=1、2），2 结点的小树放最后（j=5）。' },
  { cls:'step', tag:'树 1（7 结点）', count:1, ribbon:{k:1, ok:true},
    rows:[TREES[0]], maxLayer:4,
    note:'树 1 的根在第 1 层，转化高 4 → 最深点在第 1+4−1 = <b>4</b> 层。',
    log:'j=1，h=4：最深点到第 4 层。当前最大层高 4。' },
  { cls:'step', tag:'树 2（5 结点）', count:2, ribbon:{k:2, ok:true},
    rows:[TREES[0], TREES[1]], maxLayer:5,
    note:'树 2 的根在第 2 层，转化高 4 → 最深点在第 2+4−1 = <b>5</b> 层。',
    log:'j=2，h=4：最深点到第 5 层。当前最大层高 5。' },
  { cls:'step', tag:'树 3（4 结点）', count:3, ribbon:{k:3, ok:true},
    rows:[TREES[0], TREES[1], TREES[2]], maxLayer:5,
    note:'树 3 的根在第 3 层，转化高 3 → 最深点在第 3+3−1 = <b>5</b> 层，未超过当前最大。',
    log:'j=3，h=3：最深点到第 5 层。当前最大层高仍为 5。' },
  { cls:'step', tag:'树 4（3 结点）', count:4, ribbon:{k:4, ok:true},
    rows:[TREES[0], TREES[1], TREES[2], TREES[3]], maxLayer:6,
    note:'树 4 的根在第 4 层，转化高 3 → 最深点在第 4+3−1 = <b>6</b> 层，最大层被推高到 6。',
    log:'j=4，h=3：最深点到第 6 层。当前最大层高 6。' },
  { cls:'step', tag:'树 5（2 结点）', count:5, ribbon:{k:5, ok:true},
    rows:TREES, maxLayer:6,
    note:'树 5 的根在第 5 层，转化高 2 → 最深点在第 5+2−1 = <b>6</b> 层。五棵树全部放好。',
    log:'j=5，h=2：最深点到第 6 层。最终最大层高 6。' },
  { cls:'done', tag:'结论', count:5,
    rows:TREES, maxLayer:6,
    note:'反向验证不可能更矮：第 5 棵树的根永远在第 5 层（右链长度固定），而它至少 2 个结点、内部至少再下探 1 层 → 高度至少 6。<b style="color:#16a34a">高度至少是 6 → 答案 B</b>。',
    log:'最小高度 = 6：根链占第 1 至 5 层，树内结点再叠 1 层。',
    done:true },
];

AW.init({
  title: '2026-04 · 森林转二叉树：高度至少是多少',
  subtitle: '5 棵树结点数 2,3,4,5,7 · 排列次序任意 · <code>树根成右链 + 树内孩子兄弟转化</code>',
  counterLabel: '已放置的树',
  ribbonTitle: '树（✓ 已放置）',
  intro: '点击「▶ 播放」，逐棵树放置并观察最深点落在哪一层。',
  build: build,
  render: render,
  snaps: snaps,
  result: {
    big: '答案 B（高度至少 6）',
    html: '5 个树根成右链占第 <b>1～5</b> 层；每棵树内部按孩子兄弟转化后还要再挂深 1～3 层。大树排前（7,5,4,3,2）时最深点最高到第 <b>6</b> 层，且第 5 棵树根在第 5 层必然再下探 1 层——高度<b>至少 6</b>，选 <b>B</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
