<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-04 森林转二叉树的最小高度 · 构树动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
<style>
  .fsvg{width:100%;max-width:860px;display:block;margin:0 auto;background:#f8edcb;
    border:1px solid #1b3a4b38;border-radius:12px}
  .fsvg text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .fsvg .fhead{font-size:13px;font-weight:700;fill:#213e48;text-anchor:middle}
  .fsvg .fsub{font-size:12px;font-weight:800;fill:#92400e;text-anchor:middle}
  .fsvg .flab{font-size:10px;font-weight:700;fill:#586e72;text-anchor:middle}
  .fsvg .flab2{font-size:9.5px;font-weight:700;text-anchor:middle;font-family:Menlo,monospace}
  .fsvg .fdiv{stroke:#5a7d8c66;stroke-width:1;stroke-dasharray:5 4}
  .fsvg .layer-g{stroke:#5a7d8c66;stroke-width:1.4;stroke-dasharray:6 5;transition:stroke .3s,opacity .4s}
  .fsvg .layer-g.hot{stroke:#e63946;stroke-width:2.2}
  .fsvg .layer-t{font-size:11px;font-weight:700;fill:#b9cbd0;text-anchor:start;transition:fill .3s,opacity .4s}
  .fsvg .layer-t.hot{fill:#e63946}
  .fsvg .mnode circle{fill:#fff;stroke:#213e48;stroke-width:1.8;transition:opacity .4s}
  .fsvg .mnode text{font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;
    font-family:Menlo,monospace;transition:opacity .4s}
  .fsvg .medge{stroke:#586e72;stroke-width:1.6;transition:opacity .4s}
  .fsvg .skel-c{fill:#fff;stroke:#b9cbd0;stroke-width:2;stroke-dasharray:4 3;transition:opacity .4s,fill .3s,stroke .3s}
  .fsvg .skel-c.hot{stroke:#e07a2f;fill:#f8edcb}
  .fsvg .skel-e{stroke:#5a7d8c66;stroke-width:2;stroke-dasharray:6 5;transition:opacity .4s,stroke .3s}
  .fsvg .skel-e.hot{stroke:#e07a2f;stroke-width:3}
  .fsvg .cnode circle.nd{fill:#fff;stroke-width:2.2;transition:opacity .4s,stroke-width .3s}
  .fsvg .cnode text{font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central;
    font-family:Menlo,monospace;transition:opacity .4s}
  .fsvg .cnode.fresh circle.nd{stroke-width:3.8}
  .fsvg .cnode .ring{fill:none;stroke:#e63946;stroke-width:2;stroke-dasharray:4 3;transition:opacity .4s}
  .fsvg .cedge{stroke-width:2;fill:none;transition:opacity .4s,stroke-width .3s}
  .fsvg .cedge.fresh{stroke-width:3.6}
  .fsvg .hidden-el{opacity:0}
  .fnote{margin-top:10px;text-align:center;font-size:14.5px;font-weight:700;color:#1b3a4b;line-height:1.8}
  .fnote code{background:#1b3a4b14;padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 2026-04 森林转二叉树最小高度（SVG 构树演示） ==================
 * 5 棵树 2,3,4,5,7 个结点：树根成右链（第 j 棵树根在第 j 层），树内孩子兄弟转化。
 * 各树取最矮形状（转化高 2,3,3,4,4），按 7,5,4,3,2 排列 → 最深点第 6 层 → 高度至少 6，选 B。 */
var svgNS = 'http://www.w3.org/2000/svg';
var COLORS = ['#1b3a4b', '#2f9e44', '#e07a2f', '#e07a2f', '#0891b2'];
var TINTS = ['rgba(37,99,235,.14)', 'rgba(22,163,74,.14)', 'rgba(217,119,6,.14)',
             'rgba(124,58,237,.14)', 'rgba(8,145,178,.14)'];
var SIZES = [7, 5, 4, 3, 2];
function mk(t){ return document.createElementNS(svgNS, t); }
function attr(e, o){ for (var k in o) e.setAttribute(k, o[k]); return e; }
function nd(t, l, r, deep){ return {t:t, l:l, r:r, deep:!!deep}; }

// 转化后的二叉树（各树取最矮形状；deep = 该树最深点）
var t7 = nd(0, nd(0, nd(0, nd(0, null, null, true), nd(0, null, null)),
                     nd(0, nd(0, null, null), null)), null);
var t5 = nd(1, nd(1, nd(1, nd(1, null, null, true), nd(1, null, null)), null), null);
var t4 = nd(2, nd(2, nd(2, null, null, true), nd(2, null, null)), null);
var t3 = nd(3, nd(3, null, nd(3, null, null, true)), null);
var t2 = nd(4, nd(4, null, null, true), null);
t7.r = t5; t5.r = t4; t4.r = t3; t3.r = t2;
var ROOTS = [t7, t5, t4, t3, t2];

// 中序布局：x = 序号 × 42，y = 深度 × 62
var counter = 0;
function layout(ndo, depth){
  if (!ndo) return;
  layout(ndo.l, depth + 1);
  ndo.x = 30 + (counter++) * 42;
  ndo.y = 190 + depth * 62;
  layout(ndo.r, depth + 1);
}
layout(t7, 0);

// 森林带：5 棵小树（相对坐标），各取最矮形状
var FOREST = [
  { x:80,  pts:[[0,0],[-16,28],[16,28],[-30,56],[-4,56],[-44,80],[28,56]],
    edges:[[0,1],[0,2],[1,3],[1,4],[3,5],[2,6]] },
  { x:280, pts:[[0,0],[0,26],[-14,52],[14,52],[-28,78]],
    edges:[[0,1],[1,2],[1,3],[2,4]] },
  { x:430, pts:[[0,0],[-16,28],[16,28],[-30,56]],
    edges:[[0,1],[0,2],[1,3]] },
  { x:560, pts:[[0,0],[-14,28],[14,28]],
    edges:[[0,1],[0,2]] },
  { x:650, pts:[[0,0],[0,28]],
    edges:[[0,1]] },
];
var MAXL = {3:4, 4:5, 5:5, 6:6, 7:6, 8:6};
var NOTES = [
  '规则：第 1 棵树根作二叉树根，第 j 棵树根是第 j−1 棵树根的<b>右孩子</b> —— 5 个树根连成右链（右带虚线为规划位置）；树内按「左孩子、右兄弟」转化。',
  '各树自选最矮形状：h(2)=2，h(3)=3，h(4)=3，h(5)=4，h(7)=4（如 7 结点树：第一孩子挂 4 结点子树、第二孩子挂 2 结点子树，整树转化高 1+max(3,1+2)=4）。',
  '排列策略：第 j 棵树最深点在第 <code>j+h−1</code> 层 → j 越大越深 → <b>转化高大的树排前面：7,5,4,3,2</b>。',
  '树 1（7 结点，h=4）：根在第 1 层 → 最深点第 <b>1+4−1 = 4</b> 层。',
  '树 2（5 结点，h=4）：根在第 2 层 → 最深点第 <b>2+4−1 = 5</b> 层。',
  '树 3（4 结点，h=3）：根在第 3 层 → 最深点第 <b>3+3−1 = 5</b> 层，未推高。',
  '树 4（3 结点，h=3）：根在第 4 层 → 最深点第 <b>4+3−1 = 6</b> 层 ← 推高到 6！',
  '树 5（2 结点，h=2）：根在第 5 层 → 最深点第 <b>5+2−1 = 6</b> 层。五棵树全部放好，最大层 = 6。',
  '下界论证：第 5 棵树根<b>永远</b>在第 5 层（右链长度固定），它至少含 2 个结点、内部至少再下探 1 层 → 任何排列高度都不低于 6 → <b>高度至少 6，选 B</b>。',
];

var svg, noteBox, skelC = [], skelE = [];

function build(stage){
  stage.innerHTML = '';
  svg = mk('svg'); attr(svg, {viewBox:'0 0 900 540', 'class':'fsvg'});
  // 上带：森林
  var h1 = mk('text'); attr(h1, {x:450, y:20, 'class':'fhead'});
  h1.textContent = '森林 F：5 棵树（各取最矮形状）'; h1.dataset.step = 0; svg.appendChild(h1);
  var h2 = mk('text'); attr(h2, {x:450, y:37, 'class':'fsub'});
  h2.textContent = '排列次序：7,5,4,3,2（大树在前）'; h2.dataset.step = 2; svg.appendChild(h2);
  FOREST.forEach(function(ft, ti){
    var color = COLORS[ti], cx = ft.x, cy = 55;
    var pos = ft.pts.map(function(p){ return [cx + p[0], cy + p[1]]; });
    ft.edges.forEach(function(e){
      var A = pos[e[0]], B = pos[e[1]];
      var dx = B[0]-A[0], dy = B[1]-A[1], L = Math.sqrt(dx*dx+dy*dy);
      var l = mk('line');
      attr(l, {x1:A[0]+dx/L*8, y1:A[1]+dy/L*8, x2:B[0]-dx/L*8, y2:B[1]-dy/L*8,
               'class':'medge', stroke:color});
      l.dataset.step = 1; svg.appendChild(l);
    });
    pos.forEach(function(p, i){
      var g = mk('g'); g.setAttribute('class', 'mnode'); g.dataset.step = 1;
      var c = mk('circle'); attr(c, {cx:p[0], cy:p[1], r:8, stroke:color});
      if (i === 0) c.setAttribute('fill', TINTS[ti]);
      var t = mk('text'); attr(t, {x:p[0], y:p[1], fill:color});
      t.textContent = '根';
      if (i === 0) g.appendChild(t);
      svg.appendChild(g);
    });
    var lab = mk('text'); attr(lab, {x:cx, y:158, 'class':'flab', fill:color});
    lab.textContent = SIZES[ti] + ' 结点 · 转化高 ' + [4,4,3,3,2][ti];
    lab.dataset.step = 1; svg.appendChild(lab);
  });
  var sep = mk('line'); attr(sep, {x1:15, y1:168, x2:885, y2:168, 'class':'fdiv'});
  sep.dataset.step = 0; svg.appendChild(sep);
  // 层线（第 3 步起）
  for (var d = 1; d <= 6; d++){
    var y = 190 + (d-1)*62;
    var ln = mk('line'); attr(ln, {x1:15, y1:y, x2:885, y2:y, 'class':'layer-g'});
    ln.dataset.step = 3; ln.dataset.layer = d; svg.appendChild(ln);
    var lb = mk('text'); attr(lb, {x:8, y:y-6, 'class':'layer-t'});
    lb.textContent = '层 ' + d; lb.dataset.step = 3; lb.dataset.layer = d; svg.appendChild(lb);
  }
  // 树根右链骨架（第 0~2 步的规划示意）
  ROOTS.forEach(function(rt, k){
    var c = mk('circle'); attr(c, {cx:rt.x, cy:rt.y, r:13, 'class':'skel-c'});
    c.dataset.skel = 'c' + k; svg.appendChild(c); skelC.push(c);
  });
  for (var k = 0; k < 4; k++){
    var A = ROOTS[k], B = ROOTS[k+1];
    var l = mk('line'); attr(l, {x1:A.x, y1:A.y, x2:B.x, y2:B.y, 'class':'skel-e'});
    l.dataset.skel = 'e' + k; svg.appendChild(l); skelE.push(l);
  }
  // 转化后的二叉树：递归画结点与边
  function drawNode(ndo){
    var step = 3 + ndo.t, color = COLORS[ndo.t];
    if (ndo.l){
      var el = mk('line');
      attr(el, {x1:ndo.x, y1:ndo.y, x2:ndo.l.x, y2:ndo.l.y, 'class':'cedge', stroke:COLORS[ndo.l.t]});
      el.dataset.step = 3 + ndo.l.t; svg.appendChild(el);
      drawNode(ndo.l);
    }
    if (ndo.r){
      var er = mk('line');
      attr(er, {x1:ndo.x, y1:ndo.y, x2:ndo.r.x, y2:ndo.r.y, 'class':'cedge', stroke:COLORS[ndo.r.t]});
      er.dataset.step = 3 + ndo.r.t; svg.appendChild(er);
      drawNode(ndo.r);
    }
    var g = mk('g'); g.setAttribute('class', 'cnode'); g.dataset.step = step; g.dataset.tree = ndo.t;
    if (ndo.deep){
      var ring = mk('circle'); attr(ring, {cx:ndo.x, cy:ndo.y, r:18, 'class':'ring'});
      g.appendChild(ring);
    }
    var c = mk('circle'); attr(c, {cx:ndo.x, cy:ndo.y, r:13, 'class':'nd', stroke:color});
    c.setAttribute('fill', TINTS[ndo.t]);
    var t = mk('text'); attr(t, {x:ndo.x, y:ndo.y, fill:color});
    t.textContent = SIZES[ndo.t];
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
  }
  drawNode(t7);
  stage.appendChild(svg);
  noteBox = AW.el('div', 'fnote', '');
  stage.appendChild(noteBox);
}

function render(stage, sn, i){
  [].forEach.call(svg.querySelectorAll('[data-step]'), function(el){
    el.classList.toggle('hidden-el', +el.dataset.step > i);
  });
  // 骨架：真实结点出现后逐个退场
  skelC.forEach(function(el, k){ el.classList.toggle('hidden-el', i >= 3 + k); });
  skelE.forEach(function(el, k){ el.classList.toggle('hidden-el', i >= 4 + k); });
  var skelHot = (i === 2);
  skelC.forEach(function(el){ el.classList.toggle('hot', skelHot); });
  skelE.forEach(function(el){ el.classList.toggle('hot', skelHot); });
  // 层线高亮：当前最深层
  var ml = MAXL[Math.min(i, 8)];
  [].forEach.call(svg.querySelectorAll('.layer-g,.layer-t'), function(el){
    el.classList.toggle('hot', ml != null && +el.dataset.layer === ml);
  });
  // 本步新放置的树高亮
  [].forEach.call(svg.querySelectorAll('.cnode,.cedge'), function(el){
    el.classList.toggle('fresh', +el.dataset.step === i);
  });
  noteBox.innerHTML = NOTES[Math.min(i, NOTES.length - 1)];
}

var SNAPS = [
  { cls:'shift', tag:'规则', count:0,
    log:'森林转二叉树：第 1 棵树根作二叉树根，第 j 棵树根是第 j−1 棵树根的右孩子 —— 5 个树根连成右链，第 j 棵树的根必然落在二叉树第 j 层。' },
  { cls:'step', tag:'单树最矮形状', count:0,
    log:'先把每棵树各自转得最矮：h(2)=2，h(3)=3，h(4)=3，h(5)=4，h(7)=4。树高 ≠ 转化高，要按「左孩子、右兄弟」重算。' },
  { cls:'shift', tag:'大树在前', count:0,
    log:'第 j 棵树最深点落在第 j+h−1 层：j 越大层越深 → 转化高大的树排前面，按 7,5,4,3,2 排列。' },
  { cls:'step', tag:'树 1（7 结点）', count:1, ribbon:{k:1, ok:true},
    log:'树 1 的根在第 1 层，转化高 4 → 最深点（红圈）在第 1+4−1 = 4 层。当前最大层 4。' },
  { cls:'step', tag:'树 2（5 结点）', count:2, ribbon:{k:2, ok:true},
    log:'树 2 的根在第 2 层，转化高 4 → 最深点在第 2+4−1 = 5 层。当前最大层 5。' },
  { cls:'step', tag:'树 3（4 结点）', count:3, ribbon:{k:3, ok:true},
    log:'树 3 的根在第 3 层，转化高 3 → 最深点在第 3+3−1 = 5 层，未超过当前最大。' },
  { cls:'step', tag:'树 4（3 结点）', count:4, ribbon:{k:4, ok:true},
    log:'树 4 的根在第 4 层，转化高 3 → 最深点在第 4+3−1 = 6 层，最大层被推高到 6。' },
  { cls:'step', tag:'树 5（2 结点）', count:5, ribbon:{k:5, ok:true},
    log:'树 5 的根在第 5 层，转化高 2 → 最深点在第 5+2−1 = 6 层。五棵树全部放好，最大层 = 6。' },
  { cls:'done', tag:'结论', count:5, done:true,
    log:'第 5 棵树根永远在第 5 层（右链长度固定），内部至少再下探 1 层 → 高度不可能低于 6 → 高度至少是 6，选 B。' },
];

AW.init({
  title: '2026-04 · 森林转二叉树：高度至少是多少',
  subtitle: '5 棵树结点数 2,3,4,5,7 · 排列次序任意 · <code>树根成右链 + 树内孩子兄弟转化</code>',
  counterLabel: '已放置的树',
  ribbonTitle: '树（✓ 已放置）',
  intro: '点击「▶ 播放」，逐棵树转化并观察最深点落在第几层。',
  build: build,
  render: render,
  snaps: SNAPS,
  result: {
    big: '答案 B（高度至少 6）',
    html: '5 个树根成右链占第 <b>1～5</b> 层；每棵树内部按孩子兄弟转化后还要再挂深 1～3 层（各树最矮转化高 2,3,3,4,4）。<br>' +
      '按 <b>7,5,4,3,2</b>（大树在前）排列，最深点最高到第 <b>6</b> 层；且第 5 棵树根恒在第 5 层、内部必然再下探 1 层——高度<b>至少 6</b>，选 <b>B</b>。',
  },
});
</script>
</body>
</html>
