<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-06 邻接表求入度的时间复杂度 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：邻接表里存的是谁',
    cls: 'key',
    body: '<p>有向图的邻接表为每个顶点挂一条边表，边表结点记录的是<b>以该顶点为弧尾的出边</b>。所以：出度 = 数自家边表，很便宜；而顶点 v 的入边（以 v 为弧头）<b>分散在所有其他顶点的边表里</b>。考点：<code>求入度的时间复杂度</code>。</p>' },
  { title: '出度 vs 入度：一局部一全局',
    cls: '',
    body: '<p>出度：只看 v 自己的边表，O(出度) 完成。<br>入度：v 的入边藏在别人的边表中，没有任何局部信息，只能<b>全局扫一遍</b>去找所有指向 v 的弧结点。</p>' },
  { title: '数入度必须扫什么',
    cls: '',
    body: '<p>要统计多少条边指向 v，只能把 |V| 个顶点的边表逐个看过去：<br>① |V| 个边表的<b>表头结点</b>都要访问——边表为空的顶点也得看一眼，|V| 项省不掉；<br>② 全部 |E| 个<b>边结点</b>都可能被检查——判断它是否指向 v。<br>合计 <code>O(|V| + |E|)</code>。</p>' },
  { title: 'O(|V|+|E|) 就是选项 D',
    cls: 'good',
    body: '<p><code>O(|V|+|E|) = O(max(|V|,|E|))</code>：两个量都可能出现且取大者，正对应 <b>D</b> 选项。</p>' },
  { title: '排除 A、B、C',
    cls: 'bad',
    body: '<p><b>A（O(|V|)）</b>：只够把顶点表走一遍，藏在边表里的入边没数到。<br><b>B（O(min(|V|,|E|))）</b>：两项都必须付出，取不到「小」的那一个。<br><b>C（O(|E|)）</b>：|E| 可能远小于 |V|（顶点多边少的稀疏图），空边表的表头开销省不掉。</p>' },
  { title: '对照记忆：别的存储法呢',
    cls: 'key',
    body: '<p><b>逆邻接表</b>：存的是入边，求入度变成数自家边表，很快。<br><b>邻接矩阵</b>：入度 = 扫 v 对应的一整列，O(|V|)。<br>这正是「存储结构决定操作代价」的经典对比。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>邻接表存出边，入度分散在别人的边表里，必须扫全部表头和边结点：<code>O(|V|+|E|) = O(max(|V|,|E|))</code>，答案选 <b style="font-size:16px">D</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2026-06 · 邻接表上有向图求入度要多久',
  subtitle: '考点：<code>邻接表存出边 → 入度必须全局扫</code> · 推理链逐项展开',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（O(max(|V|,|E|))）',
    html: '邻接表的边表记录<b>弧尾的出边</b>：出度局部可数，入度却分散在所有顶点的边表中——|V| 个表头与 |E| 个边结点都要扫，<code>O(|V|+|E|)=O(max(|V|,|E|))</code>。逆邻接表才让入度变便宜；邻接矩阵扫一列为 O(|V|)。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
