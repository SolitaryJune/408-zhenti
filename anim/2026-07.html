<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-07 路径字符串集合 S 的性质判定 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：S 由什么构成',
    cls: 'key',
    body: '<p>S = 初始点到各标记点的有向路径上的边字符拼成的字符串集合，<b>字符串长度 = 路径的边数</b>。题设关键约束：每个顶点都落在某条「初始点 → 标记点」的路径上——它保证环上的点也能被路径经过。判定四个选项 = 判定路径长度的可能取值。</p>' },
  { title: '无环：路径全是简单路径（判 A）',
    cls: 'good',
    body: '<p>G 无环时任何路径都不含重复顶点（有重复必有环）。n 个顶点的简单路径至多 n−1 条边，且这样的路径条数有限：长度只能取 1 到 n−1，条数有穷 → <b>S 是有穷集，A 正确</b>。</p>' },
  { title: '无环：不存在长度恰为 n 的串（判 B）',
    cls: 'bad',
    body: '<p>长度 = 边数 ≤ n−1 &lt; n。「存在长度<b>等于</b> n 的字符串」恰好卡在边界外，永远取不到——<b>B 的断言不成立，B 就是错误的那句</b>。</p>' },
  { title: '有环：绕环可任意加长（判 C）',
    cls: 'good',
    body: '<p>G 有环时，408 口径的路径允许重复经过顶点。设环长 r，环上任一点 v 由题设条件在某条「初始点 → 标记点」路径上（长 L）：在 v 处把环绕一圈接回后半段，得长 L+r 的路径；绕 t 圈得 <code>L + t·r</code>。t 增大即可超过 n → <b>存在长度大于 n 的字符串，C 正确</b>。</p>' },
  { title: '有环：小于 2n 的串始终存在（判 D）',
    cls: 'good',
    body: '<p>最短的「初始点 → 标记点」路径若含重复顶点就能截短，故最短者是简单路径，长度 ≤ n−1 &lt; 2n → <b>S 中必有长度小于 2n 的字符串，D 正确</b>。有环只负责「能变长」，不剥夺「存在短串」。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>A、C、D 都对，<b>错误的是 B</b>：无环时路径长度至多 n−1，长度等于 n 的字符串不存在。记忆锚点：<code>无环限长 n−1，有环可绕任意长，最短恒为简单路径</code>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2026-07 · 字符串集合 S：哪句说错了',
  subtitle: '有向图路径字符串 · <code>无环限长 n−1 / 有环可绕环加长</code> · 逐项推理',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步检验 A、B、C、D。',
  snaps: snaps,
  result: {
    big: '答案 B（该叙述错误）',
    html: '无环时所有路径都是简单路径：n 个顶点至多 <b>n−1 条边</b>，S 有穷（A 对）但长度<b>取不到 n</b>（B 错）。有环时在路径中绕环一圈得 L+r，绕 t 圈可超 n（C 对）；最短路径恒为简单路径 ≤ n−1 &lt; 2n（D 对）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
