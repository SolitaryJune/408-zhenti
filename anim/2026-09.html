<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-09 直接插入排序比较次数 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 哨兵口径：第 i 趟比较次数 = 前面比它大的元素个数 + 1（最后与第一个不大于它的元素或哨兵比较后停）
var OPTS = [
  { L:'A', seq:['30','27','56','41','80','95','69'],
    rows:[ ['2','27','30'], ['1','56','—'], ['2','41','56'], ['1','80','—'], ['1','95','—'], ['3','69','95、80'] ], total:10 },
  { L:'B', seq:['31','43','26','55','63','99','77'],
    rows:[ ['1','43','—'], ['3','26','43、31'], ['1','55','—'], ['1','63','—'], ['1','99','—'], ['2','77','99'] ], total:9 },
  { L:'C', seq:['61','84','51','23','34','91','40'],
    rows:[ ['1','84','—'], ['3','51','84、61'], ['4','23','84、61、51'], ['4','34','84、61、51'], ['1','91','—'], ['5','40','91、84、61、51'] ], total:18 },
  { L:'D', seq:['93','32','48','81','50','21','72'],
    rows:[ ['2','32','93'], ['2','48','93'], ['1','81','—'], ['3','50','93、81'], ['6','21','93、81、50、48、32'], ['3','72','93、81'] ], total:17 },
];

function styledRow(chars, paint){
  var row = AW.cellRow(chars, null, null, 1);
  if (paint){
    for (var k in paint){
      var col = row.children[+k - 1];
      if (!col) continue;
      var boxEl = col.children[1];
      var p = paint[k];
      if (p === 'amber'){ boxEl.style.background='#f8edcb'; boxEl.style.borderColor='#e07a2f'; boxEl.style.color='#92400e'; }
      else if (p === 'green'){ boxEl.style.background='#2f9e4424'; boxEl.style.borderColor='#2f9e44'; boxEl.style.color='#1e4d33'; }
    }
  }
  return row;
}

function optionHTML(o){
  // 琥珀 = 比较次数 > 1（引发了多余比较）的元素；绿 = 一比即停的元素；墨青 = 首元素（免插入）
  var paint = { 1: 'blue' };
  o.rows.forEach(function(r, i){
    paint[i + 2] = (+r[0] > 1) ? 'amber' : 'green';
  });
  var h = '<div class="aw-row-label"><b>选项 ' + o.L + '</b>：' + o.seq.join('，') + '（琥珀=引发多余比较，绿=一比即停）</div>';
  var wrap = AW.el('div', 'aw-scroll');
  wrap.appendChild(styledRow(o.seq, paint));
  h += wrap.outerHTML;
  h += '<table style="border-collapse:collapse;margin:8px 0 2px;font-size:13.5px">' +
       '<tr><td style="border:1.5px solid #5a7d8c66;padding:3px 10px;background:#f8edcb">趟</td>' +
       '<td style="border:1.5px solid #5a7d8c66;padding:3px 10px;background:#f8edcb">插入元素</td>' +
       '<td style="border:1.5px solid #5a7d8c66;padding:3px 10px;background:#f8edcb">比较次数</td>' +
       '<td style="border:1.5px solid #5a7d8c66;padding:3px 10px;background:#f8edcb">越过的更大元素</td></tr>';
  o.rows.forEach(function(r, i){
    h += '<tr><td style="border:1.5px solid #5a7d8c66;padding:3px 10px;color:#586e72">' + (i + 2) + '</td>' +
         '<td style="border:1.5px solid #5a7d8c66;padding:3px 10px">' + r[1] + '</td>' +
         '<td style="border:1.5px solid #5a7d8c66;padding:3px 10px;font-weight:700;color:' + (+r[0] > 1 ? '#a02830' : '#2f9e44') + '">' + r[0] + '</td>' +
         '<td style="border:1.5px solid #5a7d8c66;padding:3px 10px;color:#586e72">' + r[2] + '</td></tr>';
  });
  h += '</table>';
  var counts = o.rows.map(function(r){ return r[0]; }).join(' + ');
  h += '<div style="font-size:15px;font-weight:800;color:#1b3a4b;margin-top:6px">逐趟相加：' + counts + ' = <b>' + o.total + '</b> 次</div>';
  return h;
}

var snaps = [
  { cls:'step', tag:'规则', count:0,
    html:'<div class="aw-stepcard key"><h4><span class="n">1</span>比较次数由逆序决定</h4>' +
         '<p>直接插入排序每趟把第 i 个元素插入前面的有序区（从后往前比较）：遇到比它大的元素要比一次并后移，最后与第一个<b>不大于它的元素（或哨兵）</b>比较一次而停。<br>' +
         '所以第 i 趟比较次数 = <b>前面比它大的元素个数 + 1</b>；总比较次数 = (n−1) + <b>逆序对数</b>。序列越接近升序，比较次数越少。下面对四个选项逐趟数。</p></div>' },
  { cls:'step', tag:'选项 A', count:1, ribbon:{k:1, ok:false},
    html: optionHTML(OPTS[0]) +
          '<div style="font-size:14px;color:#213e48;margin-top:4px">逆序对只有 4 个（30&gt;27、56&gt;41、80&gt;69、95&gt;69），共 6+4 = <b>10</b> 次。</div>',
    log:'选项 A：2+1+2+1+1+3 = 10 次。' },
  { cls:'step', tag:'选项 B', count:2, ribbon:{k:2, ok:true},
    html: optionHTML(OPTS[1]) +
          '<div style="font-size:14px;color:#213e48;margin-top:4px">逆序对只有 2 个（31&gt;26、99&gt;77），共 6+3 = <b>9</b> 次 —— 目前最少。</div>',
    log:'选项 B：1+3+1+1+1+2 = 9 次，只有 26 和 77 引发多余比较。' },
  { cls:'step', tag:'选项 C', count:3, ribbon:{k:3, ok:false},
    html: optionHTML(OPTS[2]) +
          '<div style="font-size:14px;color:#213e48;margin-top:4px">前面 61,84 有序也救不了后面：51、23、34、40 连环逆序，共 12 个逆序对，6+12 = <b>18</b> 次。</div>',
    log:'选项 C：1+3+4+4+1+5 = 18 次，逆序最多。' },
  { cls:'step', tag:'选项 D', count:4, ribbon:{k:4, ok:false},
    html: optionHTML(OPTS[3]) +
          '<div style="font-size:14px;color:#213e48;margin-top:4px">首元素 93 压住全场，21 一趟要越过全部 5 个已排元素，共 11 个逆序对，6+11 = <b>17</b> 次。</div>',
    log:'选项 D：2+2+1+3+6+3 = 17 次。' },
  { cls:'done', tag:'结论', count:5,
    html:'<div class="aw-stepcard good"><h4><span class="n">2</span>汇总与结论</h4>' +
         '<p>A：10 次；B：<b>9 次</b>；C：18 次；D：17 次。<br>B 的逆序对最少（仅 31&gt;26、99&gt;77 两处），序列最接近升序，比较次数最少。</p>' +
         '<p style="font-weight:800;color:#2f9e44;font-size:16px">答案选 B</p></div>',
    log:'总比较次数 = (n−1) + 逆序对数：B 最少（9 次）→ 选 B。',
    done:true },
];

AW.init({
  title: '2026-09 · 直接插入排序：谁的比较次数最少',
  subtitle: '哨兵口径：<code>每趟比较次数 = 前面比它大的元素个数 + 1</code> · 总次数 = (n−1) + 逆序对数',
  counterLabel: '已分析选项',
  ribbonTitle: '选项（✓ 次数最少 / ✗ 更多）',
  intro: '点击「▶ 播放」，逐个选项数比较次数。',
  snaps: snaps,
  result: {
    big: '答案 B（9 次）',
    html: '总比较次数 = <code>(n−1) + 逆序对数</code>。A 逆序 4 个 → 10 次；<b>B 逆序仅 2 个 → 9 次</b>；C 逆序 12 个 → 18 次；D 逆序 11 个 → 17 次。B 最接近升序，选 <b>B</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
