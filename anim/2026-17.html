<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-17 哪些指令可能顺序执行下一条 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>问哪些指令"执行后<b>有可能</b>按存放顺序执行其下一条指令"。关键：转移目标由<b>谁</b>决定——指令地址码自由指定的才存在顺序执行的可能。</p>' },
  { title: 'I 条件跳转指令',
    cls: 'good',
    body: '<p>条件<b>不成立</b>时转移不发生，PC 顺序指向下一条 → <b>可能</b> ✓。</p>' },
  { title: 'II 过程调用指令',
    cls: 'good',
    body: '<p>转移目标由指令<b>地址码</b>给出，是编码时确定的任意入口，不是硬件固定位置；当目标恰好紧邻其后时即顺序执行下一条（调用返回时回到的也正是调用指令的下一条）→ <b>可能</b> ✓。</p>' },
  { title: 'III 陷阱（Trap）指令',
    cls: 'bad',
    body: '<p>执行后<b>固定</b>转向由硬件（异常向量）确定的处理程序入口，绝不会顺序执行下一条 → <b>不可能</b> ✗。</p>' },
  { title: 'IV 过程返回指令',
    cls: 'bad',
    body: '<p>执行后<b>固定</b>转向栈/寄存器中保存的返回地址——那是"调用指令"的下一条，不是"返回指令"自己的下一条 → <b>不可能</b> ✗。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>仅 I、II 有可能，选 <b>A</b>。记忆锚点：目标由指令码"自由指定"才可能顺序执行；由硬件向量或栈中返回地址固定的必转移。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title + '：' + s.body.replace(/<[^>]+>/g, ''),
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

// 明确标记：最后一步为 done:true（配合上方 map 生成）
snaps[snaps.length - 1].done = true;

AW.init({
  title: '2026·17 四类控制指令的"顺序执行可能性"',
  subtitle: '考点：转移目标由谁决定 · 条件跳转 / 过程调用 / 陷阱 / 过程返回',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（仅 I、II）',
    html: '记忆锚点：<b>条件不成立可顺序（I）；调用目标由地址码自由指定（II）</b>；陷阱入口由硬件向量固定（III）、返回落点是保存的返回地址（IV），二者必转移。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
