<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-20 数据通路结构与 CPI · 动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>CPI = 执行一条指令所需的<b>平均时钟周期数</b>。题目前提：不考虑异常/中断处理和访存额外开销——但<b>没有排除</b>数据相关、控制相关等冒险。</p>' },
  { title: 'I 单周期数据通路',
    cls: 'good',
    body: '<p>一条指令在一个（较长的）时钟周期内完成取指、执行、写回 → <b>CPI = 1，对</b> ✓。</p>' },
  { title: 'II 多周期数据通路',
    cls: 'good',
    body: '<p>一条指令拆成多个周期逐段完成（取指、译码、执行、访存、写回各占一拍）→ <b>CPI &gt; 1，对</b> ✓。</p>' },
  { title: 'III 流水线数据通路（本题关键）',
    cls: 'bad',
    body: '<p>理想流水线每拍流出一条，但存在<b>数据相关、控制相关</b>时要插入气泡暂停：CPI = 1 + 暂停拍数 ÷ 指令数 <b>&gt; 1</b>。题目前提未排除冒险，不能断言"等于 1" → <b>错</b> ✗。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>仅 I、II 正确，选 <b>A</b>。记忆锚点：单周期 =1，多周期 &gt;1，流水线 = 1 + 冒险暂停，通常大于 1。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title + '：' + s.body.replace(/<[^>]+>/g, ''),
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

// 明确标记：最后一步为 done:true（配合上方 map 生成）
snaps[snaps.length - 1].done = true;

AW.init({
  title: '2026·20 三种数据通路结构与 CPI',
  subtitle: '考点：单周期 / 多周期 / 流水线的 CPI 判断 · 注意题目排除了什么、没排除什么',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 A（仅 I、II）',
    html: '记忆锚点：<b>流水线 CPI = 1 + 冒险暂停</b>。题目只排除了异常和访存开销，没排除相关暂停，所以"流水线 CPI 等于 1"不成立；单周期恰好 =1，多周期必然 &gt;1。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
