<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-21 特权指令辨析 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>题目问"<b>不属于</b>特权指令的是"。判别标准：特权指令只能在<b>内核态</b>执行，直接控制硬件资源或改变系统状态。</p>' },
  { title: '逐项分析 A：I/O 指令',
    cls: 'bad',
    body: '<p><b>属于特权指令</b>。直接启动、控制外设，用户态绝不允许直接执行。</p>' },
  { title: '逐项分析 B：关中断指令',
    cls: 'bad',
    body: '<p><b>属于特权指令</b>。改变中断允许状态，若用户可随意关中断，系统将失去响应能力。</p>' },
  { title: '逐项分析 C：中断返回指令',
    cls: 'bad',
    body: '<p><b>属于特权指令</b>。恢复系统态现场、改变处理机状态（从内核态返回），必须特权。</p>' },
  { title: '逐项分析 D：系统调用指令（本题答案）',
    cls: 'good',
    body: '<p><b>不属于特权指令</b>。它本身在<b>用户态执行</b>：只是一条触发"用户态 → 内核态"陷入的指令，为用户提供请求内核服务的入口；真正的 I/O 由内核中的系统调用处理程序（用特权指令）完成。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>选 <b>D</b>。记忆锚点：能改变机器状态（启停外设、动中断、换态返回）的是特权指令；"请求服务"的陷入指令不是。系统调用是用户进入特权领域的"门"，敲门这个动作本身不需要特权。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title + '：' + s.body.replace(/<[^>]+>/g, ''),
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

// 明确标记：最后一步为 done:true（配合上方 map 生成）
snaps[snaps.length - 1].done = true;

AW.init({
  title: '2026·21 哪些指令是特权指令',
  subtitle: '考点：特权指令判别标准 · I/O 指令 / 关中断 / 中断返回 / 系统调用',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D（系统调用指令）',
    html: '记忆锚点：<b>系统调用指令在用户态执行</b>，只是陷入内核的入口，不是特权指令；I/O 指令、关中断、中断返回都必须在内核态执行，是特权指令。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
