<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-22 中断响应与处理的软硬件分工 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>题目问中断响应及处理过程中"<b>必须由硬件完成</b>"的工作。分工主线：<b>中断隐指令</b>（关中断、保存断点、引出服务入口）由硬件自动完成；其余现场工作由软件（服务程序）完成。</p>' },
  { title: '逐项分析 A：开中断',
    cls: 'bad',
    body: '<p>由<b>软件</b>完成：服务程序中显式执行开中断指令，时机由软件决定。响应时硬件自动做的是<b>关</b>中断，不是开中断 ✗。</p>' },
  { title: '逐项分析 B：中断判优',
    cls: 'bad',
    body: '<p><b>不必</b>硬件：可用硬件链式（菊花链）判优，也可用软件轮询判优，不是"必须由硬件" ✗。</p>' },
  { title: '逐项分析 C：保存断点（本题答案）',
    cls: 'good',
    body: '<p><b>必须由硬件完成</b>：中断隐指令在指令周期内自动把 PC（断点）保存到栈或指定位置，软件此时还来不及参与 ✓。</p>' },
  { title: '逐项分析 D：保存通用寄存器',
    cls: 'bad',
    body: '<p>由<b>软件</b>完成：中断服务程序按需把通用寄存器压栈/换区保护，哪些寄存器要保存由软件决定 ✗。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>选 <b>C</b>。记忆锚点：中断隐指令三件事——关中断、存断点、取服务入口，全由硬件完成；保存现场、开中断、软件判优都是软件的事。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title + '：' + s.body.replace(/<[^>]+>/g, ''),
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

// 明确标记：最后一步为 done:true（配合上方 map 生成）
snaps[snaps.length - 1].done = true;

AW.init({
  title: '2026·22 中断过程中的软硬件分工',
  subtitle: '考点：中断隐指令（硬件）vs 中断服务程序（软件）· 找"必须由硬件完成"的一项',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C（保存断点）',
    html: '记忆锚点：<b>断点（PC）由硬件的中断隐指令自动保存</b>；开中断、保存通用寄存器由软件完成；中断判优既可硬件也可软件，都不是"必须"。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
