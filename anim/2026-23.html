<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-23 哪个程序在内核模式执行</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：判断标准只有一条',
    cls: 'key',
    body: '<p>一个程序在内核模式还是用户模式执行，不看它是不是"系统自带"，只看它的执行是否必须使用<b>特权指令</b>（分配内存、改页表、操作设备等）。四个候选：编译程序、链接程序、装入程序、命令解释程序。</p>' },
  { title: 'A 编译程序：用户模式',
    cls: 'bad',
    ribbon: { k: 1, ok: false },
    body: '<p>把高级语言源程序翻译成目标代码，是对文本的纯软件加工，不碰任何系统资源。<b>× 在用户模式执行</b></p>' },
  { title: 'B 链接程序：用户模式',
    cls: 'bad',
    ribbon: { k: 2, ok: false },
    body: '<p>把多个目标模块拼接、重定位成装入模块，同样是纯软件加工，不需要任何特权指令。<b>× 在用户模式执行</b></p>' },
  { title: 'C 装入程序：内核模式',
    cls: 'good',
    ribbon: { k: 3, ok: true },
    body: '<p>装入要<b>分配内存、建立页表等地址映射</b>——这些操作必须使用特权指令，用户模式下执行会触发异常。所以装入程序只能在<b>内核模式</b>执行（现代系统由 exec 系统调用进入内核完成装入）。<b>√ 内核模式</b></p>' },
  { title: 'D 命令解释程序：用户模式',
    cls: 'bad',
    ribbon: { k: 4, ok: false },
    body: '<p>最容易误判：shell 是"系统的心脏"？其实 Unix/Linux 中命令解释程序就是一个<b>用户态进程</b>，它解释命令、创建子进程，需要内核服务时通过系统调用进入内核，自身不在内核模式。<b>× 在用户模式执行</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有装入程序必须使用特权指令 → 答案选 <b>C（装入程序）</b>。记忆锚点：<b>系统软件 ≠ 内核模式</b>，用没用特权指令才是分界线。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var o = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (s.ribbon) o.ribbon = s.ribbon;
  return o;
});

AW.init({
  title: '2026-23 · 哪个程序在内核模式执行',
  subtitle: '考点：<code>特权指令与双模式</code> · 四个系统程序逐项判断',
  counterLabel: '推理步',
  ribbonTitle: '选项判断（✓ 内核模式 / ✗ 用户模式）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：<b>是否使用特权指令</b>是内核/用户模式的分界线。装入程序要分配内存、建立地址映射 → 内核模式；编译、链接、命令解释程序 → 用户模式。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
