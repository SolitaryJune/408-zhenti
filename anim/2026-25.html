<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-25 线程的创建者与共享资源</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两件事分开看',
    cls: 'key',
    body: '<p>本题考两组事实：① <b>线程由谁创建</b>（用户级线程由线程库创建，内核级线程由 OS 创建）；② <b>线程间什么私有、什么共享</b>（私有：栈、寄存器、内核栈；共享：进程的虚拟地址空间——代码段、数据段、堆）。</p>' },
  { title: 'A 线程均由 OS 创建：错',
    cls: 'bad',
    ribbon: { k: 1, ok: false },
    body: '<p><b>内核级线程</b>在内核中实现，由 OS 创建和调度；但<b>用户级线程</b>由用户程序通过<b>线程库</b>在用户态创建管理，OS 根本不知道它的存在。<b>× 不是"均由 OS 创建"</b></p>' },
  { title: 'B 多个内核线程映射到一个用户线程：错',
    cls: 'bad',
    ribbon: { k: 2, ok: false },
    body: '<p>映射方向记反了。正确关系是"<b>多个用户级线程 → 一个/少量内核级线程</b>"（多对一、多对多模型）。一个用户级线程某一时刻只能运行在某个内核级线程上，无法同时映射到多个内核级线程。<b>× 方向不成立</b></p>' },
  { title: 'C 不同内核级线程共用内核栈：错',
    cls: 'bad',
    ribbon: { k: 3, ok: false },
    body: '<p>每个内核级线程被调度进内核时都要保存自己的中断现场和内核调用链，因此<b>每个内核级线程都有独立的内核栈</b>。内核栈与用户栈、寄存器现场一样，是线程<b>私有</b>的。<b>× 内核栈私有</b></p>' },
  { title: 'D 同进程线程共享堆：对',
    cls: 'good',
    ribbon: { k: 4, ok: true },
    body: '<p>同一进程的所有线程共享进程的<b>虚拟地址空间</b>：代码段、数据段、<b>堆</b>、全局变量、打开文件。malloc 分配的堆内存可被同进程各线程访问。<b>√ 正确</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：线程<b>私有</b>——栈、寄存器现场、TCB、内核栈；线程<b>共享</b>——进程地址空间（代码段/数据段/<b>堆</b>）、打开文件。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var o = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (s.ribbon) o.ribbon = s.ribbon;
  return o;
});

AW.init({
  title: '2026-25 · 用户级/内核级线程与共享资源',
  subtitle: '考点：<code>线程的创建者 · 私有与共享</code> · 四句叙述逐项判断',
  counterLabel: '推理步',
  ribbonTitle: '选项判断（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：用户级线程由<b>线程库</b>创建；映射是"多用户 → 少内核"；<b>内核栈线程私有</b>；同进程线程<b>共享堆等地址空间</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
