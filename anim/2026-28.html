<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-28 三级页表最多占多少页框</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 64 位虚拟地址结构（题 28 图）
var ADDR_ROW =
  '<table style="border-collapse:collapse;margin:6px 0;font-family:Menlo,monospace;font-size:12.5px;width:100%">' +
  '<tr>' +
  '<td style="border:1.5px solid #213e48;padding:5px 0;text-align:center;width:26%">保留<br><b>25 位</b></td>' +
  '<td style="border:1.5px solid #213e48;padding:5px 0;text-align:center;width:20%;background:#f8edcb">一级页号<br><b>9 位</b></td>' +
  '<td style="border:1.5px solid #213e48;padding:5px 0;text-align:center;width:20%;background:#f8edcb">二级页号<br><b>9 位</b></td>' +
  '<td style="border:1.5px solid #213e48;padding:5px 0;text-align:center;width:20%;background:#fde2e2">三级页号<br><b>9 位</b></td>' +
  '<td style="border:1.5px solid #213e48;padding:5px 0;text-align:center;width:14%;background:#2f9e4424">页内偏移<br><b>12 位</b></td>' +
  '</tr></table>';

var STEPS = [
  { title: '审题眼：读地址结构',
    cls: 'key',
    body: '<p>64 位虚拟地址 = <b>保留 25 位</b> + 一级 9 位 + 二级 9 位 + 三级 9 位 + <b>页内偏移 12 位</b>；各级页表项均占 <b>8 B</b>。问：<b>第三级页表</b>最多占多少页框。</p>' + ADDR_ROW },
  { title: '第一步：一页页表能装多少项',
    cls: '',
    body: '<p>页内偏移 12 位 → 页大小 <code>2^12 = 4 KB</code>。每页表项 8 B → 一页页表容纳 <code>4KB ÷ 8B = 512 = 2^9 项</code>，恰好对应每级页号的 <b>9 位</b>：查一级页号 = 在一页页表内定位一个表项。</p>' },
  { title: '第二步：进程最多有多少虚页',
    cls: '',
    body: '<p>三级页号共 9+9+9 = <b>27 位</b>（保留的 25 位不参与映射），故进程最多 <code>2^27 = 128M</code> 个虚页，最大虚拟空间 <code>2^27 × 4KB = 2^39 = 512 GB</code>。</p>' },
  { title: '第三步：相除得第三级页表张数',
    cls: 'key',
    body: '<p>每张三级页表覆盖 <b>512 个虚页</b>（512 项 × 每项对应一个虚页）。<br>第三级页表张数 = <code>2^27 ÷ 2^9 = 2^18 = 256K 张</code>。<br>每张三级页表本身占 <b>1 个页框</b> → 最多占 <b>256K 个页框</b>。</p>' },
  { title: '验算：从二级页表往下数',
    cls: '',
    body: '<p>二级页号 9 位 → 二级页表最多 <code>2^9 = 512</code> 张；每张二级页表的 512 个表项可指向 <b>512 张三级页表</b> → <code>512 × 512 = 2^18 = 256K</code> 张，两条路一致。✓</p>' },
  { title: '排除干扰项',
    cls: 'bad',
    body: '<p><b>D 128M</b>：这是进程的<b>虚页总数</b>（2^27），忘了除以每张三级页表覆盖的 512 个虚页。<br><b>A 512</b>：这是一张页表的表项数 / 二级页表的张数，只是一个层级的规模。<br><b>B 32K</b>：把除数用错（如用页大小 2^12 去除）所得。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>2^27 个虚页 ÷ 每张 512 项 = <b>2^18 = 256K</b> 个页框 → 答案选 <b>C</b>。记忆锚点：<b>页框数 = 虚页数 ÷ 一张页表的项数</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var o = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  return o;
});

AW.init({
  title: '2026-28 · 三级页表的第三级最多占多少页框',
  subtitle: '考点：<code>页大小 · 页表项大小 · 多级页表规模</code> · 逐级推算',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推导链。',
  snaps: snaps,
  result: {
    big: '256K 个页框（答案 C）',
    html: '记忆锚点：<b>虚页总数 2^27 ÷ 每张三级页表 512 项 = 2^18 = 256K</b>。D 的 128M 是虚页总数，A 的 512 只是一张页表的项数——别把"虚页数"和"页表页框数"混为一谈。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
