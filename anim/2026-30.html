<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-30 共享页在两个进程页表中的表现</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：共享页的本质',
    cls: 'key',
    body: '<p>共享页 S：进程 1 经 <code>VA1 → PT1 页表项</code> 访问它，进程 2 经 <code>VA2 → PT2 页表项</code> 访问它。共享的本质只有一句：<b>两个页表项指向同一个物理页框</b>。其余一切都是各进程的"私有视角"。</p>' },
  { title: 'A：VA1 与 VA2 相同——错',
    cls: 'bad',
    ribbon: { k: 1, ok: false },
    body: '<p>VA1、VA2 是页 S 在<b>两个进程各自虚拟地址空间</b>中的起始地址。两个地址空间相互独立，S 挂在哪由各自的布局决定，一般不同、也不必相同。<b>× 可以不同</b></p>' },
  { title: 'B：VA1、VA2 映射到相同物理地址——对',
    cls: 'good',
    ribbon: { k: 2, ok: true },
    body: '<p>共享页在 PT1、PT2 的两个页表项里记录的是<b>同一个物理页框号</b>，所以 VA1、VA2 经各自页表转换后得到<b>相同的物理地址</b>——这正是"共享"的实现方式。<b>√ 正确</b></p>' },
  { title: 'C：PT1、PT2 中页表项内容相同——错',
    cls: 'bad',
    ribbon: { k: 3, ok: false },
    body: '<p>页表项不只是页框号：通常还有<b>访问位、修改位、保护位</b>等控制位。两个进程对 S 的访问历史、权限可以不同 → 页表项内容<b>不必相同</b>。"页框号相同"推不出"整项相同"。<b>× 不必相同</b></p>' },
  { title: 'D：PT1、PT2 中页表项虚拟地址相同——错',
    cls: 'bad',
    ribbon: { k: 4, ok: false },
    body: '<p>两个页表项分别存放在 <b>PT1 和 PT2 各自的内存位置</b>里，位置不同，谈不上"虚拟地址相同"；页表项本身也无所谓"虚拟地址相同"一说。<b>× 不成立</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>共享页 = 页框号相同；虚拟地址与页表项的其他控制位是各进程私有视角，可以不同</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var o = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (s.ribbon) o.ribbon = s.ribbon;
  return o;
});

AW.init({
  title: '2026-30 · 共享页：相同的是什么，不同的是什么',
  subtitle: '考点：<code>页共享 · 页表项内容 · 虚实映射</code> · 四句叙述逐项判断',
  counterLabel: '推理步',
  ribbonTitle: '选项判断（✓ 正确 / ✗ 错误）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：<b>共享页在两进程页表项中记录同一物理页框号 → VA1、VA2 映射到相同物理地址</b>；而虚拟地址、页表项其他控制位属于各进程私有视角，可以不同。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
