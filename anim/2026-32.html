<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-32 鼠标中断：数据通路上谁干了什么</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
</head>
<body>
<!-- 模板：概念/分析类 · 只改下方 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：先画完整数据通路',
    cls: 'key',
    body: '<p>鼠标输入的完整链路：<b>①鼠标硬件</b>把数据写入设备接口的数据寄存器 → <b>②中断硬件</b>发中断请求并自动切换用户态→内核态 → <b>③中断处理程序</b>从寄存器取数存入内核数据区 → <b>④内核</b>唤醒等待输入的进程。四个选项各对应哪一环？</p>' },
  { title: 'A：把当前进程改为阻塞态——错',
    cls: 'bad',
    ribbon: { k: 1, ok: false },
    body: '<p>改进程状态是进程/调度层面的动作；鼠标中断到来时通常是<b>唤醒</b>等待输入的进程，而不是把谁置为阻塞态。<b>× 不是中断处理程序的事</b></p>' },
  { title: 'B：用户模式切换为内核模式——错',
    cls: 'bad',
    ribbon: { k: 2, ok: false },
    body: '<p>响应中断时"用户态 → 内核态"的切换由<b>中断硬件自动完成</b>，发生在中断处理程序开始执行<b>之前</b>——处理程序运行时已经在内核模式了。<b>× 硬件做的</b></p>' },
  { title: 'C：把输入数据存入数据寄存器——错',
    cls: 'bad',
    ribbon: { k: 3, ok: false },
    body: '<p>把数据<b>写入</b>设备接口的数据寄存器，是<b>鼠标/控制器硬件</b>的行为。寄存器是设备→CPU 的传递站：写入靠硬件，读出靠 CPU 侧程序。<b>× 设备硬件做的</b></p>' },
  { title: 'D：把数据从数据寄存器传送到内核数据区——对',
    cls: 'good',
    ribbon: { k: 4, ok: true },
    body: '<p>中断处理程序正是数据通路的第③环：从设备接口的数据寄存器<b>读取</b>输入数据，存入<b>内核数据区</b>（缓冲区）。<b>√ 中断处理程序完成</b></p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>硬件填寄存器，硬件切模式；中断处理程序把数据从寄存器搬进内核数据区</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var o = {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
  if (s.ribbon) o.ribbon = s.ribbon;
  return o;
});

AW.init({
  title: '2026-32 · 鼠标中断处理程序完成哪一步',
  subtitle: '考点：<code>中断处理程序职责 · I/O 数据通路</code> · 四句叙述逐项判断',
  counterLabel: '推理步',
  ribbonTitle: '选项判断（✓ 由它完成 / ✗ 不是它）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：数据通路四环各归其主——<b>硬件</b>填数据寄存器、<b>硬件</b>切内核态、<b>中断处理程序</b>把寄存器数据搬进内核数据区、<b>内核</b>唤醒等待进程。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
