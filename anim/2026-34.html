<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-34 香农定理求速率并算传输时延 · 推理链动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：「至少」= 按极限速率发送',
    cls: 'key',
    body: '<p>带宽 200 kHz，信噪比 <code>S/N = 1023</code>（是功率比，不是 dB），发送 1500 B 的分组。"传输时延<b>至少</b>"意味着按信道<b>极限速率</b>发送——极限速率由<b>香农公式</b>给出。</p>' },
  { title: '第一步：香农公式求信道极限速率',
    cls: 'key',
    body: '<p><code>C = W × log2(1 + S/N)</code>。代入：<code>log2(1 + 1023) = log2(1024) = 10</code>，所以 <code>C = 200×10³ × 10 = 2×10⁶ bps = 2 Mbps</code>。这是该信道理论上的最高速率。</p>' },
  { title: '第二步：单位换算（最大的坑）',
    cls: 'bad',
    body: '<p>分组长度 1500 <b>B</b> 是字节，速率是比特每秒，必须换算：<code>1500 B = 1500 × 8 = 12000 bit</code>。忘了这一步会算出 0.75 ms——正是干扰项 B。</p>' },
  { title: '第三步：传输时延 = 数据量 ÷ 速率',
    cls: 'good',
    body: '<p><code>t = 12000 bit ÷ (2×10⁶ bps) = 6×10⁻³ s = 6 ms</code>。这就是发送 1500 B 分组所需时间的下限。</p>' },
  { title: '干扰项溯源',
    cls: 'bad',
    body: '<p><b>B（0.75 ms）</b>：忘了 B→bit 换算，直接 1500÷2×10⁶。<b>C（3 ms）</b>：把速率错算成 4 Mbps（公式记混/量纲错）。<b>A（0.375 ms）</b>：上述两个错误叠加。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D（6 ms）</b>。记忆锚点：<b>香农公式 log2(1+1023)=10 → 2 Mbps；1500 B 先乘 8 再除</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    ribbon: i > 0 ? { k: i, ok: (i !== 2 && i !== 4) } : null,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2026-34 · 香农定理 → 极限速率 → 传输时延',
  subtitle: '<code>C = W·log2(1+S/N) = 2 Mbps</code> · <code>t = 12000 bit ÷ 2 Mbps = 6 ms</code> · 推理链逐环展开',
  counterLabel: '推理环节数',
  ribbonTitle: '环节（✓ 正确 / ✗ 常见错误）',
  intro: '点击「▶ 播放」沿推理链走：极限速率 → 单位换算 → 传输时延。',
  snaps: snaps,
  result: {
    big: '答案 D（6 ms）',
    html: '香农公式：<code>C = 200kHz × log₂(1+1023) = 200kHz × 10 = 2 Mbps</code>；1500 B = <b>12000 bit</b>；<code>t = 12000 ÷ 2×10⁶ = 6 ms</code>。陷阱是 <b>B→bit</b> 的换算（0.75 ms 就是这么来的）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
