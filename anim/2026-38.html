<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-38 哪个 IGP 能划分区域 · 推理链动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115b">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115c"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两道筛子',
    cls: 'key',
    body: '<p>题目要的是<b>①内部网关协议（IGP）</b>且<b>②能把一个自治系统划分成多个区域（Area）</b>。先用"IGP/EGP"筛一轮，再用"有无区域概念"筛一轮。</p>' },
  { title: '先分身份：谁是内部、谁是外部',
    cls: 'key',
    body: '<p><b>OSPF</b>、<b>RIP</b>：内部网关协议（IGP），在<b>同一个 AS 内部</b>运行。<b>BGP</b>：外部网关协议（EGP），在<b>不同 AS 之间</b>交换可达性信息——它根本不负责 AS 内部的结构划分。</p>' },
  { title: '逐项分析 I：OSPF',
    cls: 'good',
    body: '<p>OSPF 是链路状态 IGP，支持大规模网络的关键手段就是把 AS 划分为若干<b>区域（Area）</b>：每个区域有 32 位区域标识符，<b>区域 0（0.0.0.0）是主干区域</b>，区域边界路由器（ABR）转发区域间信息；洪泛交换链路状态信息的范围被限制在区域内部。<b>I 满足两个条件</b>。</p>' },
  { title: '逐项分析 II：RIP',
    cls: 'bad',
    body: '<p>RIP 是距离向量 IGP，但整个 AS 内所有路由器跑同一个 RIP 进程，只用<b>跳数</b>选路（最大 15 跳），结构扁平，<b>没有区域的概念</b>。II 不满足条件②。</p>' },
  { title: '逐项分析 III：BGP',
    cls: 'bad',
    body: '<p>BGP 是<b>外部网关协议（EGP）</b>，管的是 AS 与 AS 之间，不把 AS 内部划区域。注意 C（仅 I、III）是陷阱——题干限定"内部网关协议"。III 不满足条件①。</p>' },
  { title: '结论：仅 OSPF 有区域',
    cls: 'good',
    body: '<p>答案选 <b>A（仅 I）</b>。记忆锚点：<b>OSPF = 链路状态 + 区域划分（Area 0 主干）</b>；RIP 扁平无区域；BGP 管间不管内。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    ribbon: i > 0 ? { k: i, ok: (i === 2 || i === 5) } : null,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2026-38 · OSPF / RIP / BGP：谁能划分区域',
  subtitle: '考点：<code>IGP vs EGP · OSPF 区域划分</code> · 两道筛子逐项过',
  counterLabel: '已筛项数',
  ribbonTitle: '判断（✓ 满足 / ✗ 不满足）',
  intro: '点击「▶ 播放」：先筛 IGP/EGP，再筛有没有区域概念。',
  snaps: snaps,
  result: {
    big: '答案 A（仅 I）',
    html: '<b>OSPF</b>：链路状态 IGP，把 AS 划分为多个区域，主干区域 Area 0 连通全网，ABR 负责区域间转发。RIP 扁平、无区域；BGP 是<b>外部</b>网关协议，与 AS 内部划分无关。记忆锚点：<b>OSPF 靠区域撑大规模，BGP 管间不管内</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
