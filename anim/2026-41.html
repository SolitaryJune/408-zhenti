<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-41 BST 找与 k 差值最小的结点 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// BST：50(30(20,40(35,·)),70(60,80))，k = 45
var TREE = {
  v:50,
  l:{ v:30, l:{ v:20, l:null, r:null },
             r:{ v:40, l:{ v:35, l:null, r:null }, r:null } },
  r:{ v:70, l:{ v:60, l:null, r:null }, r:{ v:80, l:null, r:null } }
};
var K = 45;

var POS = {}, seq = [];
(function ino(nd){ if(!nd) return; ino(nd.l); seq.push(nd.v); ino(nd.r); })(TREE);
var pos = {}, cnt = 0, maxd = 0;
(function place(nd, d){
  if (!nd) return;
  place(nd.l, d + 1);
  pos[nd.v] = { x: ++cnt, y: d }; maxd = Math.max(maxd, d);
  place(nd.r, d + 1);
})(TREE, 1);
var XP = 64, YP = 56, R = 19;

function drawTree(sn){
  var W = (cnt + 1) * XP, H = (maxd + 1) * YP;
  function px(v){ return pos[v].x * XP; }
  function py(v){ return pos[v].y * YP - 10; }
  var s = '<svg width="' + W + '" height="' + H + '" style="display:block;margin:0 auto">';
  (function edges(nd){
    if (!nd) return;
    ['l','r'].forEach(function(k){
      if (nd[k]){
        var on = sn.vis && sn.vis[nd[k].v];
        s += '<line x1="' + px(nd.v) + '" y1="' + py(nd.v) + '" x2="' + px(nd[k].v) + '" y2="' + py(nd[k].v) +
             '" stroke="' + (on ? '#1b3a4b' : '#5a7d8c66') + '" stroke-width="2"' + (on ? '' : ' stroke-dasharray="4,3"') + '/>';
      }
    });
    edges(nd.l); edges(nd.r);
  })(TREE);
  for (var v in pos){
    var cur = (sn.cur === v);
    var seen = sn.vis && sn.vis[v];
    var isCand = (sn.pmin1 === v || sn.pmin2 === v);
    var fill = '#fff', stroke = '#5a7d8c66';
    if (seen){ fill = '#2f9e4424'; stroke = '#2f9e44'; }
    if (isCand){ fill = '#d9e3df'; stroke = '#1b3a4b'; }
    if (cur){ fill = '#f8edcb'; stroke = '#e07a2f'; }
    s += '<circle cx="' + px(v) + '" cy="' + py(v) + '" r="' + R + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.5"/>' +
         '<text x="' + px(v) + '" y="' + (py(v) + 5) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#1b3a4b" font-family="Menlo,Consolas,monospace">' + v + '</text>';
    if (cur) s += '<text x="' + px(v) + '" y="' + (py(v) - 26) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#e07a2f">p ▼</text>';
    if (isCand && !cur) s += '<text x="' + px(v) + '" y="' + (py(v) - 26) + '" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b3a4b">' + (sn.pmin1 === v ? 'pmin1' : 'pmin2') + '</text>';
  }
  return s + '</svg>';
}

function statePanel(sn){
  var min = (sn.min == null) ? '∞' : sn.min;
  var m1 = sn.pmin1 == null ? '—' : sn.pmin1;
  var m2 = sn.pmin2 == null ? '—' : sn.pmin2;
  return '<div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">' +
    '<span class="aw-box" style="width:auto;min-width:96px;height:36px;font-size:13px;background:#f8edcb">min = ' + min + '</span>' +
    '<span class="aw-box" style="width:auto;min-width:96px;height:36px;font-size:13px;background:#d9e3df;border-color:#1b3a4b;color:#1b3a4b">pmin1 = ' + m1 + '</span>' +
    '<span class="aw-box" style="width:auto;min-width:96px;height:36px;font-size:13px;background:#d9e3df;border-color:#1b3a4b;color:#1b3a4b">pmin2 = ' + m2 + '</span>' +
    '<span class="aw-box" style="width:auto;min-width:96px;height:36px;font-size:13px;background:#f8edcb">k = ' + K + '</span>' +
    '</div>';
}

var treeBox = null, panelBox = null, noteLine = null;

function build(stage){
  var wrap = AW.el('div', 'aw-scroll');
  var lbl = AW.el('div', 'aw-row-label', '<b>二叉搜索树</b>（琥珀=当前结点 p，绿=已比较，蓝=当前候选 pmin1/pmin2；k = 45）');
  treeBox = AW.el('div', '');
  panelBox = AW.el('div', '');
  noteLine = AW.el('div', 'aw-row-label', '');
  wrap.appendChild(treeBox);
  wrap.appendChild(panelBox);
  wrap.appendChild(noteLine);
  stage.appendChild(wrap);
}

function render(stage, sn){
  treeBox.innerHTML = drawTree(sn);
  panelBox.innerHTML = statePanel(sn);
  noteLine.innerHTML = sn.note || '';
}

var snaps = [
  { cls:'step', tag:'初始化', count:0,
    vis:{}, cur:null, min:null, pmin1:null, pmin2:null,
    note:'算法思想：按查找 k 的方式沿<b>一条路径</b>下行（当前值 &gt; k 走左，&lt; k 走右），<b>沿途记录差值绝对值最小的结点</b>（min / pmin1 / pmin2），直到空指针。候选至多两个：k 上、下两侧各一个。',
    log:'初始化：p = root，min = MAX，pmin1、pmin2 待记录。时间 O(h)、空间 O(1)。' },
  { cls:'step', tag:'p → 50', count:1, ribbon:{k:1, ok:true},
    vis:{50:1}, cur:50, min:5, pmin1:50, pmin2:50,
    note:'|50 − 45| = 5 &lt; MAX → min = 5，pmin1 = pmin2 = 50。50 &gt; 45 → 候选还可能在左子树，p = p-&gt;left。',
    log:'访问 50：差值 5，记录为当前最优；50 大于 k，走左。' },
  { cls:'step', tag:'p → 30', count:2, ribbon:{k:2, ok:true},
    vis:{50:1, 30:1}, cur:30, min:5, pmin1:50, pmin2:50,
    note:'|30 − 45| = 15 ≥ 5，不更新。30 &lt; 45 → 候选还可能在右子树，p = p-&gt;right。',
    log:'访问 30：差值 15，比 min 大，保持不变；30 小于 k，走右。' },
  { cls:'step', tag:'p → 40（等差！）', count:3, ribbon:{k:3, ok:true},
    vis:{50:1, 30:1, 40:1}, cur:40, min:5, pmin1:50, pmin2:40,
    note:'|40 − 45| = 5 == min → 出现另一个同差值结点，<b>pmin2 = 40</b>（k 恰落在 40 与 50 正中间）。40 &lt; 45 → 走右。',
    log:'访问 40：差值 5 与 min 相等 → pmin2 = 40，候选变成两个；40 小于 k，走右。' },
  { cls:'step', tag:'p → NULL', count:4,
    vis:{50:1, 30:1, 40:1}, cur:null, min:5, pmin1:50, pmin2:40,
    note:'40 的右孩子为空 → while 结束。路径上已比较 3 个结点：k 右侧最近的候选（50）与左侧最近的候选（40）都已记录，不会再有更优者。',
    log:'p 为空，循环结束：路径走到头，候选确定。' },
  { cls:'ok', tag:'输出', count:5,
    vis:{50:1, 30:1, 40:1}, cur:null, min:5, pmin1:50, pmin2:40,
    note:'pmin1(50) ≠ pmin2(40) → 输出：<b>差值绝对值 = 5，结点 1 = 50，结点 2 = 40</b>。若二者相同则只输出一个结点。',
    log:'输出差值 5 与两个候选结点 50、40。' },
  { cls:'done', tag:'结论', count:6,
    vis:{50:1, 30:1, 40:1}, cur:null, min:5, pmin1:50, pmin2:40,
    note:'算法要点：① 命中 k（差值 0）立即唯一输出返回；② 否则沿路径记 min 与 pmin1、pmin2；③ 走到空指针后按一个/两个候选分别输出。时间 <b>O(h)</b>、空间 <b>O(1)</b>。',
    log:'只走一条路径、只记两个候选：O(h) 完成 → 这就是「尽可能高效」的写法。',
    done:true },
];

AW.init({
  title: '2026-41 · 二叉搜索树：找与 k 差值最小的结点',
  subtitle: 'BST 查找路径 · <code>沿途记 min 与 pmin1/pmin2 · 命中即返回 · O(h)</code> · 演示 k = 45',
  counterLabel: '已访问结点',
  ribbonTitle: '路径结点（✓ 已比较）',
  intro: '点击「▶ 播放」，看查找路径如何同时锁定两个候选。',
  build: build,
  render: render,
  snaps: snaps,
  result: {
    big: '输出：差值 5，结点 50 与 40',
    html: '沿 BST 查找 k=45 的路径 50→30→40：|50−45|=5 先记录，|30−45|=15 更差，|40−45|=5 与 min 相等补入 pmin2——k 恰在 40 与 50 正中间，候选<b>两个</b>。走到空指针输出差值与候选。命中 k 时差值 0 唯一并提前返回。时间 <b>O(h)</b>、空间 <b>O(1)</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
