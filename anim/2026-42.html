<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-42 栈的出栈序列判定 · 动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

// 序列 A：2,3,1,6,4,7,5,9,8（失败） 序列 B：2,3,1,5,6,7,4,9,8（成功）
var SEQ_A = ['2','3','1','6','4','7','5','9','8'];
var SEQ_B = ['2','3','1','5','6','7','4','9','8'];

function styledRow(chars, paint, ptrMap){
  var row = AW.cellRow(chars, null, ptrMap || null, 1);
  if (paint){
    for (var k in paint){
      var col = row.children[+k - 1];
      if (!col) continue;
      var boxEl = col.children[1];
      var p = paint[k];
      if (p === 'amber'){ boxEl.style.background='#f8edcb'; boxEl.style.borderColor='#e07a2f'; boxEl.style.color='#92400e'; }
      else if (p === 'green'){ boxEl.style.background='#2f9e4424'; boxEl.style.borderColor='#2f9e44'; boxEl.style.color='#1e4d33'; }
      else if (p === 'red'){ boxEl.style.background='#e6394620'; boxEl.style.borderColor='#e63946'; boxEl.style.color='#a02830'; }
      else if (p === 'blue'){ boxEl.style.background='#d9e3df'; boxEl.style.borderColor='#1b3a4b'; boxEl.style.color='#1b3a4b'; }
      else if (p === 'dim'){ boxEl.style.opacity='.45'; }
    }
  }
  return row;
}

function stackViz(arr, topMark){
  var h = '<div style="display:inline-block;text-align:center;margin:4px 22px 0 0;vertical-align:top">';
  h += '<div style="font-size:12px;color:#b9cbd0;margin-bottom:4px">栈顶 ↑</div>';
  h += '<div style="display:inline-flex;flex-direction:column;gap:4px;border:2px solid #5a7d8c66;border-radius:10px;padding:6px;min-height:44px">';
  if (arr.length === 0){
    h += '<div style="width:44px;height:34px;font-size:12px;color:#b9cbd0;line-height:34px">空</div>';
  }
  for (var i = arr.length - 1; i >= 0; i--){
    var cls = (topMark && i === arr.length - 1) ? 'aw-box hit' : 'aw-box dim';
    h += '<div class="' + cls + '" style="width:44px;height:34px;font-size:15px">' + arr[i] + '</div>';
  }
  h += '</div><div style="font-size:12px;color:#b9cbd0;margin-top:4px">栈底</div></div>';
  return h;
}

function nextIn(next){
  return '<div style="display:inline-block;vertical-align:top;margin-top:4px;font-size:13.5px;color:#213e48">' +
         '下一个待入栈元素：<b>' + (next == null ? '（已全部入栈）' : next) + '</b></div>';
}

var targetBox = null, workBox = null, noteLine = null;

function build(stage){
  targetBox = AW.el('div', '');
  workBox = AW.el('div', '');
  noteLine = AW.el('div', 'aw-row-label', '');
  stage.appendChild(targetBox);
  stage.appendChild(workBox);
  stage.appendChild(noteLine);
}

function render(stage, sn){
  targetBox.innerHTML = '';
  if (sn.seq){
    var paint = {};
    for (var i = 1; i <= 9; i++){
      if (i < sn.pos) paint[i] = 'green';
      else if (i === sn.pos) paint[i] = sn.posFail ? 'red' : 'amber';
      else paint[i] = 'dim';
    }
    targetBox.appendChild(styledRow(sn.seq, paint, {pos: '要出→'}));
    targetBox.insertBefore(AW.el('div', 'aw-row-label',
      '<b>' + sn.seqName + '</b>（绿=已按序输出，琥珀=当前要输出，红=判定失败的位置）'), targetBox.firstChild);
  }
  workBox.innerHTML = sn.stack ? (stackViz(sn.stack, true) + nextIn(sn.next)) : '';
  noteLine.innerHTML = sn.note || '';
}

var snaps = [
  { cls:'step', tag:'规则', count:0,
    note:'出栈序列给定后，操作是<b>唯一确定</b>的：下一个要出的元素若不在栈顶，就把未入栈的元素依次压入，直到它出现在栈顶。用这条规则模拟问 1 的两个序列（n = 9）。',
    log:'判定法则：不在栈顶就「压到出现为止」；若它已被压住且压它的元素排得更靠后，则该序列不可得。' },
  { cls:'step', tag:'A：出 2', count:1, ribbon:{k:1, ok:true},
    seq:SEQ_A, seqName:'序列 A：2,3,1,6,4,7,5,9,8', pos:1,
    stack:['1'], next:'3',
    note:'要出 2：压 1、压 2，弹出 2 ✓。栈内剩 [1]。',
    log:'序列 A：压 1、压 2，出 2。' },
  { cls:'step', tag:'A：出 3、1', count:2, ribbon:{k:2, ok:true},
    seq:SEQ_A, seqName:'序列 A', pos:3,
    stack:[], next:'4',
    note:'要出 3：压 3、弹出 3 ✓；要出 1：栈顶恰是 1，弹出 ✓。栈空。',
    log:'序列 A：压 3，出 3、出 1。' },
  { cls:'step', tag:'A：出 6', count:3, ribbon:{k:3, ok:true},
    seq:SEQ_A, seqName:'序列 A', pos:4,
    stack:['4','5','6'], next:'7',
    note:'要出 6：压 4、5、6，弹出 6 ✓。栈内自底向顶为 [4, 5] —— 问题从这里开始。',
    log:'序列 A：压 4、5、6，出 6。栈里 4 被 5 压住。' },
  { cls:'miss', tag:'A：出 4 失败', count:4, ribbon:{k:4, ok:false},
    seq:SEQ_A, seqName:'序列 A', pos:5, posFail:true,
    stack:['4','5'], next:'7',
    note:'下一个要出 <b>4</b>，但栈顶是 <b>5</b>，4 被 5 压住；即使继续压 7、8、9 也无济于事——5 必须先出，而 5 在目标序列中排在第 7 位（7 之后）。4 永远轮不到 → <b>序列 A 不能得到</b>。',
    log:'要出 4 时栈顶是 5：压着 4 的 5 排在 4 之后出栈 → 不可能。判 A 失败。' },
  { cls:'step', tag:'B：出 2、3、1', count:5, ribbon:{k:5, ok:true},
    seq:SEQ_B, seqName:'序列 B：2,3,1,5,6,7,4,9,8', pos:4,
    stack:[], next:'4',
    note:'压 1、2，出 2 ✓；压 3，出 3、出 1 ✓。栈空，与 A 的前三步相同。',
    log:'序列 B：出 2、3、1，全部顺利。' },
  { cls:'step', tag:'B：出 5、6、7、4', count:6, ribbon:{k:6, ok:true},
    seq:SEQ_B, seqName:'序列 B', pos:8,
    stack:[], next:'8',
    note:'压 4、5，出 5 ✓；压 6，出 6 ✓；压 7，出 7 ✓；此时栈顶恰是 4，弹出 ✓。B 在这里与 A 分道扬镳——它让 5、6、7 先走，4 顺理成章地出了栈。',
    log:'序列 B：出 5、6、7，然后出 4 —— 栈顶刚好是 4。' },
  { cls:'ok', tag:'B：出 9、8，成功', count:7, ribbon:{k:7, ok:true},
    seq:SEQ_B, seqName:'序列 B', pos:10,
    stack:[], next:null,
    note:'压 8、9，出 9 ✓；出 8 ✓。九个元素全部按序输出 → <b>序列 B 能得到</b>。',
    log:'序列 B：出 9、8，模拟完毕，合法。' },
  { cls:'done', tag:'结论（问 2~4 要点）', count:8,
    note:'问 1：<b>A 不能得到，B 能得到</b>。<br>问 2：i&lt;j&lt;k 时若 <b>Pj &lt; Pk &lt; Pi</b>（输出次序为中、小、大），则不是出栈序列——Pi 出栈时 Pj、Pk 都在栈中且 Pk 压住 Pj，要出 Pj 必先出 Pk，矛盾。<br>' +
         '问 3：n=4 以 2 开头的出栈序列恰有 <b>5</b> 个：2,1,3,4 / 2,1,4,3 / 2,3,1,4 / 2,3,4,1 / 2,4,3,1。<br>' +
         '问 4：以 1 开头、以 2 开头的个数都等于 M；全部出栈序列个数为 <b>(4k−2)/(k+1)·M</b>（Catalan 递推）。',
    log:'A 不可得（4 被 5 压住）；B 可得。312 模式不可得；n=4 以 2 开头 5 个；总数 (4k−2)/(k+1)·M。',
    done:true },
];

AW.init({
  title: '2026-42 · 两个出栈序列能否由栈产生',
  subtitle: '入栈次序 1..9 · <code>不在栈顶就压到出现为止</code> · 序列 A：2,3,1,6,4,7,5,9,8；序列 B：2,3,1,5,6,7,4,9,8',
  counterLabel: '模拟步',
  ribbonTitle: '步骤（✓ 推进成功 / ✗ 判定失败）',
  intro: '点击「▶ 播放」，逐序列模拟入栈出栈。',
  build: build,
  render: render,
  snaps: snaps,
  result: {
    big: 'A 不能得到，B 能得到',
    html: '确定性模拟：A 在出 4 时被栈顶 5 卡死（5 排在 4 之后出栈，压住 4 的它必须先出）——<b>不可得</b>；B 让 5、6、7 先出再出 4，全程合法——<b>可得</b>。推论要点：不可能模式为 <code>Pj &lt; Pk &lt; Pi</code>；n=4 以 2 开头 5 个；n=k 时以 1、以 2 开头各 M 个，总数 (4k−2)/(k+1)·M。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
