<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026-47 TCP 建连 / 慢开始传输 / 挥手全流程 · 时序动画</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261116a">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261116a"></script>
<script>
/* ================== 题目专属区域（只改这里） ================== */

/* 已知：C 初始序号 1000，Si 初始序号 2000；MSS=500 B；文件 2000 B = 4 MSS；
   rwnd 恒为 1000 B = 2 MSS；ssthresh = 8 MSS；RTT = 5 ms；确认段不带数据（Si 的 seq 恒为 2001） */

var KIND_COLOR = { hs:'#1b3a4b', data:'#2f9e44', ack:'#0891b2', fin:'#e07a2f' };
var KIND_NAME  = { hs:'握手', data:'数据', ack:'确认', fin:'挥手' };

var MSGS = [
  { dir:'C2S',  kind:'hs',   q:null, t:0,  label:'握手① SYN=1, seq=1000' },
  { dir:'S2C',  kind:'hs',   q:1,    t:5,  label:'握手② SYN=1, ACK=1, seq=2000, ack_seq=1001' },
  { dir:'C2S',  kind:'hs',   q:null, t:5,  label:'握手③ ACK=1, seq=1001, ack_seq=2001' },
  { dir:'C2S',  kind:'data', q:null, t:5,  label:'第1段 seq=1001~1500（1 MSS）' },
  { dir:'S2C',  kind:'ack',  q:null, t:10, label:'确认① ack_seq=1501' },
  { dir:'C2S',  kind:'data', q:null, t:10, label:'第2、3段 seq=1501~2000 / 2001~2500（2 MSS）' },
  { dir:'S2C',  kind:'ack',  q:2,    t:15, label:'确认② ACK=1, seq=2001, ack_seq=2001, rwnd=1000' },
  { dir:'C2S',  kind:'data', q:null, t:15, label:'第4段 seq=2501~3000（最后 1 MSS）' },
  { dir:'S2C',  kind:'ack',  q:4,    t:20, label:'确认④ ack_seq=3001（全部 2000 B）' },
  { dir:'C2S',  kind:'fin',  q:null, t:20, label:'挥手① FIN=1, seq=3001, ack_seq=2001' },
  { dir:'S2C',  kind:'fin',  q:null, t:25, label:'挥手② ACK=1, seq=2001, ack_seq=3002' },
  { dir:'S2C',  kind:'fin',  q:3,    t:25, label:'挥手③ FIN=1, ACK=1, seq=2001, ack_seq=3002' },
  { dir:'C2S',  kind:'fin',  q:null, t:25, label:'挥手④ ACK=1, seq=3002, ack_seq=3002' },
];

var XC = 130, XS = 560, Y0 = 84, SLOT = 46;
var mscBox, panelBox;

function drawMsc(mDrawn, cur){
  var H = Y0 + MSGS.length * SLOT + 16;
  var s = '<svg width="680" height="' + H + '" viewBox="0 0 680 ' + H + '" style="display:block;max-width:100%">';
  /* 泳道 */
  s += '<line x1="' + XC + '" y1="56" x2="' + XC + '" y2="' + (H - 8) + '" stroke="#5a7d8c66" stroke-width="2" stroke-dasharray="5,4"/>';
  s += '<line x1="' + XS + '" y1="56" x2="' + XS + '" y2="' + (H - 8) + '" stroke="#5a7d8c66" stroke-width="2" stroke-dasharray="5,4"/>';
  /* 主机头 */
  s += '<rect x="' + (XC - 92) + '" y="14" width="184" height="36" rx="10" fill="#1b3a4b14" stroke="#1b3a4b" stroke-width="2"/>';
  s += '<text x="' + XC + '" y="37" text-anchor="middle" font-size="14" font-weight="800" fill="#1b3a4b">C（算力用户）</text>';
  s += '<rect x="' + (XS - 92) + '" y="14" width="184" height="36" rx="10" fill="#f8edcb" stroke="#e07a2f" stroke-width="2"/>';
  s += '<text x="' + XS + '" y="37" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">Si（负载均衡服务器）</text>';
  if (mDrawn === 0){
    s += '<text x="345" y="200" text-anchor="middle" font-size="13" fill="#b9cbd0">时间自上而下流逝：蓝=握手 · 绿=数据 · 青=确认 · 琥珀=挥手</text>';
    s += '</svg>';
    return s;
  }
  for (var m = 0; m < mDrawn && m < MSGS.length; m++){
    var msg = MSGS[m];
    var y = Y0 + m * SLOT;
    var col = KIND_COLOR[msg.kind];
    var isCur = (m === mDrawn - 1);
    var w = isCur ? 3 : 1.8;
    var op = isCur ? 1 : 0.55;
    var x1 = msg.dir === 'C2S' ? XC + 20 : XS - 20;
    var x2 = msg.dir === 'C2S' ? XS - 20 : XC + 20;
    /* 箭杆 */
    s += '<line x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '" stroke="' + col + '" stroke-width="' + w + '" opacity="' + op + '"/>';
    /* 箭头 */
    var hx = msg.dir === 'C2S' ? x2 - 1 : x2 + 1;
    var dx = msg.dir === 'C2S' ? 1 : -1;
    s += '<polygon points="' + hx + ',' + (y - 5) + ' ' + (hx + dx * 10) + ',' + y + ' ' + hx + ',' + (y + 5) + '" fill="' + col + '" opacity="' + op + '"/>';
    /* 标签 */
    s += '<text x="345" y="' + (y - 7) + '" text-anchor="middle" font-size="' + (isCur ? '13' : '12') + '" font-weight="' + (isCur ? '800' : '400') + '" fill="' + col + '" opacity="' + op + '">' +
         (isCur ? '▶ ' : '') + msg.label + '（t=' + msg.t + ' ms）</text>';
    /* 问号徽章 */
    if (msg.q){
      s += '<circle cx="' + (msg.dir === 'C2S' ? XC - 34 : XS + 34) + '" cy="' + y + '" r="13" fill="#1b3a4b"/>';
      s += '<text x="' + (msg.dir === 'C2S' ? XC - 34 : XS + 34) + '" y="' + (y + 4.5) + '" text-anchor="middle" font-size="11" font-weight="800" fill="#fbbf24">问' + msg.q + '</text>';
    }
    /* 种类小字 */
    s += '<text x="' + (msg.dir === 'C2S' ? XC + 26 : XS - 26) + '" y="' + (y + 14) + '" text-anchor="start" font-size="10" fill="#b9cbd0" opacity="' + op + '">' + KIND_NAME[msg.kind] + '</text>';
  }
  s += '</svg>';
  return s;
}

function drawPanel(sn){
  var chip = function(label, val, color){
    return '<span class="aw-box" style="display:inline-flex;width:auto;min-width:104px;height:34px;font-size:12.5px;background:' + color.bg + ';border-color:' + color.bd + ';color:' + color.fg + '">' + label + ' = ' + val + '</span>';
  };
  var gray = { bg:'#f8edcb', bd:'#5a7d8c66', fg:'#213e48' };
  var green = { bg:'#2f9e4424', bd:'#2f9e44', fg:'#1e4d33' };
  var s = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px">';
  s += chip('cwnd', sn.cw, sn.cwHi ? green : gray);
  s += chip('发送窗口', sn.sw, sn.swHi ? green : gray);
  s += chip('t', sn.t + ' ms', gray);
  s += '</div>';
  s += '<div class="aw-row-label" style="line-height:1.7">' + (sn.note || '') + '</div>';
  return s;
}

var snaps = [
  { cls:'step', tag:'初始条件', m:0, cw:'—', sw:'—', cwHi:false, swHi:false, t:0, count:0,
    note:'已知：MSS = 500 B；文件 2000 B = <b>4 MSS</b>；rwnd 恒为 1000 B = 2 MSS；ssthresh = 8 MSS（全程不会进入拥塞避免）；RTT = 5 ms；C 初始序号 1000、Si 初始序号 2000；Si 对每个段单独确认且确认段不带数据。' },
  { cls:'step', tag:'握手①', m:1, cw:'—', sw:'—', cwHi:false, swHi:false, t:0, count:0,
    log:'t=0：C 发起连接，SYN=1，seq=1000（SYN 占一个序号）。',
    note:'第一次握手：C→Si，SYN=1，seq=1000。' },
  { cls:'ok', tag:'握手②（问1）', m:2, cw:'—', sw:'—', cwHi:false, swHi:false, t:5, count:5, ribbon:{k:1, ok:true},
    log:'C 收到的 SYN=1、ACK=1 段就是第二次握手：ack_seq = C 的初始序号 + 1 = <b>1000 + 1 = 1001</b>（SYN 占序号 1000）。问(1)第一空：3 次握手；第二空：ack_seq=1001。',
    note:'<b>问(1)：3 次握手；C 收到的 SYN=1、ACK=1 段 ack_seq = 1001</b>。Si 的 SYN 占序号 2000，此后 Si 的数据/确认从 seq=2001 开始。' },
  { cls:'step', tag:'握手③', m:3, cw:'1 MSS', sw:'1 MSS', cwHi:false, swHi:false, t:5, count:5,
    log:'第三次握手：C 发 ACK=1，seq=1001，ack_seq=2001（确认 Si 的 SYN）。连接建立；慢开始启动：cwnd = 1 MSS，rwnd = 1000 B = 2 MSS。',
    note:'连接建立。cwnd 初始 1 MSS（500 B）；发送窗口 = min(cwnd, rwnd) = min(1 MSS, 2 MSS) = 1 MSS。' },
  { cls:'ok', tag:'发第 1 段', m:4, cw:'1 MSS', sw:'1 MSS', cwHi:false, swHi:false, t:5, count:5,
    log:'C 发第 1 段：seq=1001~1500（1 MSS=500 B）。窗口被 cwnd 限制为 1 MSS。',
    note:'第 1 个 RTT 用于握手（t=0~5 ms）；这一轮（t=5~10 ms）只发得动 1 MSS。' },
  { cls:'ok', tag:'确认① → cwnd=2', m:5, cw:'2 MSS', sw:'2 MSS', cwHi:false, swHi:false, t:10, count:10,
    log:'Si 收到第 1 段后回确认① ack_seq=1501。慢开始每收到一个新确认 cwnd + 1 MSS → <b>cwnd = 2 MSS</b>。',
    note:'收到第 1 个新确认：cwnd = 1 + 1 = 2 MSS；发送窗口 = min(2 MSS, 2 MSS) = 2 MSS。' },
  { cls:'ok', tag:'发第 2、3 段', m:6, cw:'2 MSS', sw:'2 MSS', cwHi:false, swHi:false, t:10, count:10,
    log:'C 一口气发 2 MSS：第 2 段 seq=1501~2000、第 3 段 seq=2001~2500（窗口 min(2, 2) = 2 MSS）。',
    note:'这一轮（t=10~15 ms）发出 2 MSS；文件已发 3 MSS，还剩 1 MSS。' },
  { cls:'ok', tag:'确认②（问2）', m:7, cw:'3 MSS', sw:'2 MSS', cwHi:true, swHi:true, t:15, count:15, ribbon:{k:2, ok:true},
    log:'C 收到题目给的确认段「ACK=1, seq=2001, ack_seq=2001, rwnd=1000」——这是对第 2 段的确认，也是第 2 个新确认 → cwnd = 1 + 2 = <b>3 MSS = 1500 B</b>；发送窗口 = min(1500 B, 1000 B) = <b>1000 B = 2 MSS</b>（受 rwnd 限制）。问(2)得解。',
    note:'<b>问(2)：cwnd = 3 MSS = 1500 B；发送窗口 = 2 MSS = 1000 B</b>。随后对第 3 段的确认 ack_seq=2501 也到达 → cwnd = 4 MSS（仍未达阈值 8 MSS）。' },
  { cls:'ok', tag:'发第 4 段', m:8, cw:'4 MSS', sw:'2 MSS', cwHi:false, swHi:false, t:15, count:15,
    log:'窗口虽然到 4 MSS，但文件只剩最后 1 MSS → C 发第 4 段：seq=2501~3000。',
    note:'文件 4 MSS 已全部发出（1001~3000）。' },
  { cls:'ok', tag:'确认④（问4）', m:9, cw:'4 MSS', sw:'2 MSS', cwHi:false, swHi:false, t:20, count:20, ribbon:{k:3, ok:true},
    log:'t=20 ms：C 收到 ack_seq=3001，确认号覆盖全部 2000 B 数据 → <b>C 确认 Si 已成功收到文件</b>。从建连算起共 4 个 RTT：握手 1 + 传数据 3 → <b>4 × 5 ms = 20 ms</b>。问(4)得解。',
    note:'<b>问(4)：4 × 5 ms = 20 ms</b>（RTT1 握手、RTT2 发 1 MSS、RTT3 发 2 MSS、RTT4 发最后 1 MSS 并收到全部确认）。' },
  { cls:'shift', tag:'挥手①', m:10, cw:'4 MSS', sw:'—', cwHi:false, swHi:false, t:20, count:20,
    log:'数据发完，C 请求释放：FIN=1，seq=3001（FIN 占一个序号），ack_seq=2001。',
    note:'C 已发完 1001~3000，下一序号 3001 给 FIN。' },
  { cls:'shift', tag:'挥手②', m:11, cw:'—', sw:'—', cwHi:false, swHi:false, t:25, count:25,
    log:'Si 确认 C 的 FIN：ACK=1，seq=2001（Si 没发过数据，序号停在初始 2000+1），ack_seq = 3001 + 1 = <b>3002</b>。',
    note:'确认号规则：对 FIN 的确认 = FIN 占用的序号 3001 + 1 = 3002。' },
  { cls:'shift', tag:'挥手③（问3）', m:12, cw:'—', sw:'—', cwHi:false, swHi:false, t:25, count:25, ribbon:{k:4, ok:true},
    log:'C 收到的最后一个 TCP 报文段 = 第三次挥手：<b>FIN=1，seq=2001，ack_seq=3002</b>。问(3)得解。',
    note:'<b>问(3)：4 次挥手；C 收到的最后一个段 seq = 2001、ack_seq = 3002、FIN = 1</b>（Si 的确认段不带数据，seq 一直是 2001）。' },
  { cls:'shift', tag:'挥手④', m:13, cw:'—', sw:'—', cwHi:false, swHi:false, t:25, count:25,
    log:'C 最后确认：ACK=1，seq=3002，ack_seq=3002。<b>4 次挥手完成</b>，连接进入 TIME_WAIT 后关闭。',
    note:'挥手全程 4 个报文：FIN → ACK → FIN+ACK → ACK。' },
  { cls:'done', tag:'四问汇总', m:13, cw:'—', sw:'—', cwHi:false, swHi:false, t:25, count:25,
    log:'全流程回顾：3 次握手（ack_seq=1001）→ 慢开始 1→2→4 MSS 传完 4 MSS（cwnd 到 3 MSS 时发送窗口被 rwnd 限制为 2 MSS）→ 4 次挥手（最后段 seq=2001、ack_seq=3002、FIN=1）→ 文件送达时刻 4×5=20 ms。',
    note:'<b>问(1)</b> 3 次握手，ack_seq=1001；<b>问(2)</b> cwnd=3 MSS=1500 B，发送窗口=2 MSS=1000 B；<b>问(3)</b> 4 次挥手，seq=2001、ack_seq=3002、FIN=1；<b>问(4)</b> 4×5 ms=20 ms。' },
];

snaps.forEach(function(sn, i){ sn.done = i === snaps.length - 1; });

AW.init({
  title: '2026-47 · TCP 全流程：三次握手 → 慢开始传文件 → 四次挥手',
  subtitle: '<code>MSS=500 B · 文件 4 MSS · rwnd=1000 B · ssthresh=8 MSS · RTT=5 ms</code> · C 初始序号 1000 / Si 2000',
  counterLabel: '累计时间(ms)',
  ribbonTitle: '四问关键点（✓ 已锁定）',
  intro: '点击「▶ 播放」，沿时序图逐段推演 seq / ack_seq / cwnd / 发送窗口。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    mscBox = AW.el('div', '');
    panelBox = AW.el('div', '');
    wrap.appendChild(mscBox);
    wrap.appendChild(panelBox);
    stage.appendChild(wrap);
  },
  render: function(stage, sn){
    mscBox.innerHTML = drawMsc(sn.m, sn);
    panelBox.innerHTML = drawPanel(sn);
  },
  snaps: snaps,
  result: {
    big: '20 ms · 四问全解',
    html: '<b>问(1)</b>：3 次握手；第二次握手段 ack_seq = 1000+1 = <b>1001</b>。<b>问(2)</b>：收到第 2 个新确认（ack_seq=2001）时 cwnd = 1+2 = <b>3 MSS = 1500 B</b>；发送窗口 = min(1500, rwnd 1000) = <b>2 MSS = 1000 B</b>。<b>问(3)</b>：4 次挥手；C 收到的最后一个段 = 第三次挥手：<b>seq=2001、ack_seq=3002、FIN=1</b>（FIN 占序号 3001，确认号 = 3001+1）。<b>问(4)</b>：握手 1 RTT + 慢开始 3 RTT（1 MSS → 2 MSS → 1 MSS）= <b>4 × 5 ms = 20 ms</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
