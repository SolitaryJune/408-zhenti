<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研倒计时</title>
<style>
html,body{height:100%}
body{margin:0;background:#fff;color:#000;text-align:center;
  font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;-webkit-text-size-adjust:100%}
.wrap{display:table;width:100%;height:100%}
.inner{display:table-cell;vertical-align:middle;padding:20px 16px}
.tag{font-size:16px;color:#333;margin:0 0 8px;letter-spacing:1px}
.big{font-size:180px;line-height:.95;font-weight:700;letter-spacing:-4px}
.unit{font-size:30px;font-weight:700;margin-left:8px}
.detail{font-size:22px;font-weight:700;margin:16px 0 6px}
.today{font-size:14px;color:#444;margin:0 0 10px}
.note{font-size:11px;color:#777;margin:18px 0 0}
@media (orientation: landscape){
  .big{font-size:280px;letter-spacing:-8px}
  .unit{font-size:44px}
  .tag{font-size:18px}
  .detail{font-size:28px;margin-top:10px}
  .today{font-size:15px}
  .note{margin-top:12px}
}
@media (orientation: landscape) and (max-height: 640px){
  .big{font-size:210px}
  .unit{font-size:36px}
  .detail{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap"><div class="inner">
  <p class="tag">2027 考研初试 · 预计 2026-12-19 08:30</p>
  <div><span class="big" id="days">--</span><span class="unit">天</span></div>
  <p class="detail" id="detail">取数中…</p>
  <p class="today" id="today"></p>
  <p class="note">日期以研招网正式公告为准</p>
</div></div>

<script>
(function(){
  var qs = function(k){
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  };
  var targetStr = qs('d') || '2026-12-19T08:30:00+08:00';
  var title = qs('t');
  if (title) document.querySelector('.tag').innerHTML = title;

  var target = new Date(targetStr);
  if (isNaN(target.getTime())) target = new Date('2026-12-19T08:30:00+08:00');

  var WEEK = ['日','一','二','三','四','五','六'];
  function pad(n){ return (n < 10 ? '0' : '') + n; }

  var elDays = document.getElementById('days');
  var elDetail = document.getElementById('detail');
  var elToday = document.getElementById('today');
  var lastDay = '', lastDetail = '', lastToday = '';

  function render(){
    var now = new Date();
    var ms = target.getTime() - now.getTime();

    var todayStr = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' +
      now.getDate() + ' 日 星期' + WEEK[now.getDay()];

    var days, detail;
    if (ms <= 0){
      days = '0';
      detail = '考试已开始 / 已结束';
    } else {
      days = String(Math.floor(ms / 86400000));
      var hours = Math.floor(ms % 86400000 / 3600000);
      var mins = Math.floor(ms % 3600000 / 60000);
      detail = '还有 ' + days + ' 天 ' + pad(hours) + ' 小时 ' + pad(mins) + ' 分';
    }

    /* 只在文字真正变化时写 DOM，减少电子墨水屏刷新 */
    if (days !== lastDay){ elDays.innerHTML = days; lastDay = days; }
    if (detail !== lastDetail){ elDetail.innerHTML = detail; lastDetail = detail; }
    if (todayStr !== lastToday){ elToday.innerHTML = todayStr; lastToday = todayStr; }
  }

  /* 每分钟整分刷新一次；休眠唤醒补一次 */
  function schedule(){
    var delay = 60000 - (Date.now() % 60000) + 100;
    setTimeout(function(){ render(); schedule(); }, delay);
  }
  render();
  schedule();
  if (document.addEventListener){
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) render(); }, false);
  }
  window.onfocus = render;
})();
</script>
</body>
</html>
