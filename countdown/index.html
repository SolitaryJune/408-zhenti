<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研倒计时</title>
<style>
html,body{height:100%;margin:0;background:#fff;color:#000}
body{font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
  text-align:center;-webkit-text-size-adjust:100%}
.screen{width:100%;height:100%}
.wrap{display:table;width:100%;height:100%}
.inner{display:table-cell;vertical-align:middle;padding:18px 16px}
.tag{font-size:17px;color:#000;margin:0 0 8px;letter-spacing:1px}
.big{font-size:260px;line-height:.95;font-weight:700;letter-spacing:-8px;color:#000}
.unit{font-size:42px;font-weight:700;margin-left:8px;color:#000}
.detail{font-size:26px;font-weight:700;margin:12px 0 6px;color:#000}
.today{font-size:14px;color:#000;margin:0 0 8px}
.note{font-size:11px;color:#000;margin:14px 0 0}

/* 竖屏握持时：整页向右（顺时针）旋转 90°，直接以横屏阅读 */
@media (orientation: portrait){
  html,body{overflow:hidden}
  .screen{position:fixed;left:50%;top:50%;width:100vh;height:100vw;
    transform:translate(-50%,-50%) rotate(90deg);
    -webkit-transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;-webkit-transform-origin:center center}
}
@media (max-width:520px){
  .big{font-size:150px;letter-spacing:-4px}
  .unit{font-size:28px}
  .detail{font-size:18px}
  .tag{font-size:13px}
}
</style>
</head>
<body>
<div class="screen"><div class="wrap"><div class="inner">
  <p class="tag">2027 考研初试 · 预计 2026-12-19 08:30</p>
  <div><span class="big" id="days">--</span><span class="unit">天</span></div>
  <p class="detail" id="detail">取数中…</p>
  <p class="today" id="today"></p>
  <p class="note">日期以研招网正式公告为准 · 每 5 分钟刷新一次</p>
</div></div></div>

<script>
(function(){
  var qs = function(k){
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  };
  var targetStr = qs('d') || '2026-12-19T08:30:00+08:00';
  var title = qs('t');
  if (title) document.querySelector('.tag').innerHTML = title;

  /* 刷新间隔（分钟），默认 5 分钟省电；?i=1 可恢复每分钟 */
  var intervalMin = parseInt(qs('i'), 10);
  if (!intervalMin || intervalMin < 1) intervalMin = 5;
  if (intervalMin > 60) intervalMin = 60;
  var noteEl = document.querySelector('.note');
  noteEl.innerHTML = '日期以研招网正式公告为准 · 每 ' + intervalMin + ' 分钟刷新一次';

  var target = new Date(targetStr);
  if (isNaN(target.getTime())) target = new Date('2026-12-19T08:30:00+08:00');

  var WEEK = ['日','一','二','三','四','五','六'];
  function pad(n){ return (n < 10 ? '0' : '') + n; }

  var elDays = document.getElementById('days');
  var elDetail = document.getElementById('detail');
  var elToday = document.getElementById('today');
  var lastDay = '', lastDetail = '', lastToday = '';

  function render(){
    var now = new Date();
    var ms = target.getTime() - now.getTime();

    var todayStr = now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' +
      now.getDate() + ' 日 星期' + WEEK[now.getDay()];

    var days, detail;
    if (ms <= 0){
      days = '0';
      detail = '考试已开始 / 已结束';
    } else {
      days = String(Math.floor(ms / 86400000));
      var hours = Math.floor(ms % 86400000 / 3600000);
      var mins = Math.floor(ms % 3600000 / 60000);
      detail = '还有 ' + days + ' 天 ' + pad(hours) + ' 小时 ' + pad(mins) + ' 分';
    }

    /* 只在文字真正变化时写 DOM，减少电子墨水屏刷新 */
    if (days !== lastDay){ elDays.textContent = days; lastDay = days; }
    if (detail !== lastDetail){ elDetail.textContent = detail; lastDetail = detail; }
    if (todayStr !== lastToday){ elToday.textContent = todayStr; lastToday = todayStr; }
  }

  var timer = null;
  function schedule(){
    if (timer) clearTimeout(timer);
    var span = intervalMin * 60000;
    var delay = span - (Date.now() % span) + 100;
    timer = setTimeout(function(){ render(); schedule(); }, delay);
  }
  function stop(){ if (timer){ clearTimeout(timer); timer = null; } }

  render();
  schedule();

  /* 页面不可见/休眠时停掉定时器，唤醒后再补一次 —— 省电 */
  if (document.addEventListener){
    document.addEventListener('visibilitychange', function(){
      if (document.hidden || document.webkitHidden){ stop(); }
      else { render(); schedule(); }
    }, false);
  }
  window.onfocus = function(){ render(); schedule(); };
  window.onblur = stop;
})();
</script>
</body>
</html>
